// MKS driver close-up: the board as it sits in front of you (screen side up, blue motor plug at the top),
// every terminal labelled as printed (elec.py), and this card's wires drawn into their terminals with the
// same numbers as the card's text. A conn row is [from, to, colour, note, pin, tag, flag, board, word].
const BRD={'57D':{L:['EVCC','EGND','I1','I2','O1','O2','A2','B2'],R:['V+','Gnd','Com','En','Stp','Dir','B/L','A/H'],h:270,cy:282},
           '42D':{L:['+5V','GND','IN','CANH','CANL'],R:['V+','Gnd','COM','En','Stp','Dir'],h:240,cy:256}};
const TOPP=['A+','A−','B+','B−'];
const HALO='#f6f6f4';
function wpath(pts,c,w=4,cls=''){const p=pts.map(q=>q.join(',')).join(' ');return `<polyline points="${p}" fill="none" stroke="${HALO}" stroke-width="${w+5}" stroke-linejoin="round" stroke-linecap="round"/><polyline class="${cls}" points="${p}" fill="none" stroke="${COL[c]||c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`}
function badge(x,y,n,c){const dark=['yel','wht','org','cyn','pnk'].includes(c);return `<circle cx="${x}" cy="${y}" r="12" fill="${COL[c]||c}" stroke="#1a1a1a" stroke-width="1.2"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="${dark?'#1a1a1a':'#ffffff'}" font-size="13.5" font-weight="700">${n}</text>`}
function benchSVG(s,brd,narrow){
  if(narrow===undefined) narrow=window.innerWidth<720;
  const d=s.drv==='42D'?'42D':'57D', B=BRD[d], X0=190,X1=410,XC=300,Y0=140,Y1=Y0+B.h,PT=28,SP=27;
  const lit=new Set(s.bench||[]);
  let n=0; const rows=(s.conn||[]).map(r=>({r,num:r[6]==='done'?0:++n})).filter(o=>o.r[4]&&(!brd||!o.r[7]||o.r[7]===brd));
  const pinY=(arr,k)=>B.cy+(k-(arr.length-1)/2)*PT;
  const pos=p=>{let k=B.L.indexOf(p); if(k>=0) return {s:'L',x:X0,y:pinY(B.L,k),k}; k=B.R.indexOf(p); if(k>=0) return {s:'R',x:X1,y:pinY(B.R,k),k};
    k=TOPP.indexOf(p); if(k>=0) return {s:'T',x:XC+(k-1.5)*26,y:Y0,k}; return null};
  const used=new Set(rows.map(o=>o.r[4]));
  // board
  let o=`<rect x="${X0}" y="${Y0}" width="${X1-X0}" height="${B.h}" rx="14" fill="#232629" stroke="#1a1a1a"/>`;
  o+=`<text x="${XC}" y="${Y0+64}" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">MKS SERVO${d}</text>`+
     `<text x="${XC}" y="${Y0+82}" text-anchor="middle" fill="${brd?'#ffd166':'#b9bec4'}" font-size="${brd?13:11}" font-weight="${brd?700:400}">${brd?brd+' driver':'screen side up'}</text>`;
  o+=`<rect x="${XC-40}" y="${Y1-122}" width="80" height="50" rx="3" fill="#06080c" stroke="#555"/><text x="${XC}" y="${Y1-93}" text-anchor="middle" fill="#8a9099" font-size="11">screen</text>`;
  o+=['Next','Enter','Menu'].map((t,k)=>`<rect x="${XC-48+k*36}" y="${Y1-30}" width="24" height="16" rx="3" fill="#d9d4c7"/><text x="${XC-36+k*36}" y="${Y1-36}" text-anchor="middle" fill="#b9bec4" font-size="10">${t}</text>`).join('');
  if(d==='57D'){const on=lit.has('dip'),x=XC+46,y=Y1-120;
    o+=`<g${on?' class="st-now"':''}><rect x="${x}" y="${y}" width="28" height="34" rx="2" fill="#e2b640" stroke="#1a1a1a"/>`+[1,2,3].map(k=>`<rect x="${x+4}" y="${y+3+(k-1)*10}" width="20" height="8" fill="#3a3022"/><rect x="${x+(k>1?4:16)}" y="${y+4+(k-1)*10}" width="8" height="6" fill="#f4f1e8"/>`).join('')+
       `<text x="${x+14}" y="${y+48}" text-anchor="middle" fill="#ffffff" font-size="10">DIP</text></g>`;
  }
  // terminal blocks with the labels as printed
  const blk=(arr,side)=>{const ys=arr.map((_,k)=>pinY(arr,k)),x=side==='L'?X0-14:X1-6;
    return `<rect x="${x}" y="${ys[0]-14}" width="20" height="${ys[ys.length-1]-ys[0]+28}" rx="3" fill="#8fd3a0" stroke="#1a1a1a"/>`+
      arr.map((t,k)=>`<rect x="${(side==='L'?X0:X1)-5}" y="${ys[k]-5}" width="10" height="10" rx="2" fill="#1a1a1a"/><text x="${side==='L'?X0+12:X1-12}" y="${ys[k]+5}" text-anchor="${side==='L'?'start':'end'}" fill="${used.has(t)?'#ffffff':'#b9bec4'}" font-size="15" font-weight="${used.has(t)?700:500}">${t}</text>`).join('')};
  o+=blk(B.L,'L')+blk(B.R,'R');
  o+=`<rect x="${XC-56}" y="${Y0-12}" width="112" height="22" rx="3" fill="#2f7fd8" stroke="#1a1a1a"/>`+TOPP.map((t,k)=>{const x=XC+(k-1.5)*26;return `<rect x="${x-5}" y="${Y0-6}" width="10" height="10" rx="2" fill="#1a1a1a"/><text x="${x}" y="${Y0+30}" text-anchor="middle" fill="${used.has(t)?'#ffffff':'#b9bec4'}" font-size="14" font-weight="700">${t}</text>`}).join('');
  // motor + coil wires (top)
  const meter=lit.has('meter'); if(meter) narrow=false;
  const K=narrow?[16,40,50,62]:[18,58,76,88];  // stub, bend, end, badge (distance from the pin)
  if(meter||rows.some(q=>pos(q.r[4])&&pos(q.r[4]).s==='T')||lit.has('coil')){
    o+=`<circle cx="${XC}" cy="48" r="26" fill="#ffffff" stroke="#1a1a1a"/><text x="${XC}" y="53" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="700">motor</text>`;
    if(meter){
      ['grn','blk','blu','red'].forEach((c,k)=>{const bx=XC+(k-1.5)*40;o+=wpath([[XC+(k-1.5)*8,72],[bx,108]],c,4)+`<circle cx="${bx}" cy="110" r="4" fill="#c77b30"/>`});
      o+=`<g class="st-now">${box(10,14,170,56,'Meter on Ω','a few ohms = one coil')}${line('180,34 '+(XC-60)+',110','#d62828',2.5,false)}${line('180,56 '+(XC-20)+',110','#1a1a1a',2.5,false)}</g>`+
         `<text x="95" y="92" text-anchor="middle" fill="#1a1a1a" font-size="12">red probe → green wire tip</text><text x="95" y="108" text-anchor="middle" fill="#1a1a1a" font-size="12">black probe → black wire tip</text><text x="95" y="124" text-anchor="middle" fill="#6b6b6b" font-size="12">wires out of the terminals</text>`;
    }
  }
  // wires
  const bySide={L:[],R:[],T:[],J:[]};
  rows.forEach(q=>{if(q.r[4]==='COM~+5V'){bySide.J.push(q);return} const p=pos(q.r[4]); if(p){q.p=p; bySide[p.s].push(q)}});
  let maxY=Y1, minY=Y0-26;
  ['L','R'].forEach(sd=>{
    const a=bySide[sd].sort((u,v)=>u.p.y-v.p.y||u.num-v.num); if(!a.length) return;
    const mean=a.reduce((t,q)=>t+q.p.y,0)/a.length; let y0=Math.max(66,mean-(a.length-1)/2*SP);
    a.forEach((q,j)=>{const sy=y0+j*SP, dir=sd==='L'?-1:1, x=q.p.x, c=q.r[2], faint=q.r[6]==='done';
      maxY=Math.max(maxY,sy+14); minY=Math.min(minY,sy-18);
      const w=wpath([[x,q.p.y],[x+dir*K[0],q.p.y],[x+dir*K[1],sy],[x+dir*K[2],sy]],c,4,faint?'':'flow');
      const tag=`<text x="${x+dir*104}" y="${sy+5}" text-anchor="${sd==='L'?'end':'start'}" fill="${faint?'#8a8a8a':'#1a1a1a'}" font-size="15" font-weight="600">${esc(q.r[5]||'')}${faint?' ✓':''}</text>`;
      o+=`<g${faint?' opacity=".35"':''}>${w}${faint?'':badge(x+dir*K[3],sy,q.num,c)}${narrow?'':tag}</g>`;});
  });
  bySide.T.forEach(q=>{const k=q.p.k,bx=XC+(k-1.5)*40,c=q.r[2];o+=wpath([[XC+(k-1.5)*8,72],[bx,100],[q.p.x,Y0-8]],c,4,'flow')+badge(bx,100,q.num,c)});
  bySide.J.forEach(q=>{const yc=pinY(B.R,B.R.indexOf('COM')),y5=pinY(B.L,B.L.indexOf('+5V')),yb=Y1+22;
    o+=wpath([[X1,yc],[X1+12,yc],[X1+12,yb],[X0-12,yb],[X0-12,y5],[X0,y5]],q.r[2],4,'flow')+badge(XC,yb,q.num,q.r[2])+
      `<text x="${XC}" y="${yb+30}" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">short wire: COM → +5V</text>`; maxY=Math.max(maxY,yb+34)});
  // notes
  const notes=[];
  if(d==='57D'&&lit.has('dip')) notes.push(['#b85c00','DIP switches (beside the screen): 2 and 3 ON, 1 OFF.']);
  if(rows.some(q=>['EVCC','+5V'].includes(q.r[4])&&q.r[2]==='red')) notes.push(['#c62828','Sensor power = 5 V from the driver. Never 24 V.']);
  if(rows.some(q=>q.r[4]==='V+')) notes.push(['#c62828','Red = +V (24 V), black = GND. Check the polarity.']);
  if(rows.some(q=>q.num&&q.r[6]==='tmp')) notes.push(['#6b6b6b','Table-test wires come off again before the driver goes in.']);
  notes.push(['#6b6b6b','Labels as printed on the board, seen from the screen side.']);
  {let m=0; const off=[]; (s.conn||[]).forEach(r=>{if(r[6]==='done')return; m++; if(!r[4]&&(!brd||!r[7]||r[7]===brd)&&rows.length) off.push(m)});
   if(off.length&&off.length<6) notes.unshift(['#1a1a1a','Line'+(off.length>1?'s ':' ')+off.join(', ')+': not on this board (see the list).']);}
  if(narrow&&rows.some(q=>q.r[6]==='done')) notes.unshift(['#6b6b6b','Faint wires are already in.']);
  const fs=narrow?12.5:14;
  let y=maxY+30; o+=notes.map(([c,t])=>{const r=`<text x="${XC}" y="${y}" text-anchor="middle" fill="${c}" font-size="${fs}">${t}</text>`;y+=fs+6;return r}).join('');
  const vx=narrow?X0-K[3]-16:0, vw=narrow?X1-X0+2*(K[3]+16):600, top=(meter||bySide.T.length||lit.has('coil'))?0:Math.max(0,minY);
  return `<svg class="wd" viewBox="${vx} ${top} ${vw} ${y-top}" xmlns="http://www.w3.org/2000/svg">${o}</svg>`;
}


function gripSVG(s,narrow){

  // narrow = phone: servo and step-down sit under the Nano instead of beside it.
  if(narrow===undefined) narrow=window.innerWidth<720;
  const lit=new Set(s.grip||[]), all=!lit.size;
  const g=(id,inner)=>`<g class="${!all&&lit.has(id)?'st-now':'st-done'}">${inner}</g>`;
  const T=(x,y,t,a='start',fs=14,b=600,c='#1a1a1a')=>`<text x="${x}" y="${y}" text-anchor="${a}" fill="${c}" font-size="${fs}" font-weight="${b}">${t}</text>`;
  const pin=(x,y)=>`<rect x="${x-5}" y="${y-5}" width="10" height="10" rx="2" fill="#1a1a1a"/>`;
  const card=(x,y,w,h,t,sub,fill)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${fill}" stroke="#1a1a1a"/>`+T(x+w/2,y+24,t,'middle',16,800,'#ffffff')+(sub?T(x+w/2,y+42,sub,'middle',12,500,'#e6e6e6'):'');

  const M0=narrow?0:40, M1=narrow?140:220, N0=narrow?205:330, N1=narrow?345:480;
  let o=card(M0,30,M1-M0,330,'MCP2515','CAN board','#1f4fa8')+card(N0,30,N1-N0,330,'Nano','gripper_CL','#1e57b8');
  o+=g('spi',R.map(([a,b,c],j)=>{const y=90+j*36;return wpath([[M1,y],[N0,y]],c,3.5)}).join(''));
  o+=R.map(([a,b],j)=>{const y=90+j*36;return pin(M1,y)+T(M1-10,y+5,a,'end',14,700,'#ffffff')+pin(N0,y)+T(N0+10,y+5,b,'start',14,700,'#ffffff')}).join('');
  o+=g('can',wpath([[M0-80,300],[M0,300]],'yel',4)+wpath([[M0-80,330],[M0,330]],'grn',4))+pin(M0,300)+pin(M0,330)+T(M0+10,305,'H','start',14,700,'#ffffff')+T(M0+10,335,'L','start',14,700,'#ffffff')+T(M0-78,288,'from C driver','start',12,500,'#6b6b6b');
  o+=g('j1',chip(M0+(narrow?14:38),250,'J1 jumper ON'));

  o+=NP.map(([t,y])=>pin(N1,y)+T(N1-10,y+5,t,'end',14,700,'#ffffff')).join('');
  if(!narrow){
    o+=card(600,40,140,130,'Servo','DS3225','#9b2d2d')+card(600,240,140,130,'Step-down','HW-035 · 6.0 V','#2a6db0');
    o+=[['S',90],['+',115],['−',140]].map(([t,y])=>pin(600,y)+T(612,y+5,t,'start',14,700,'#ffffff')).join('');
    o+=[['OUT+',300],['OUT−',330]].map(([t,y])=>pin(600,y)+T(612,y+5,t,'start',13,700,'#ffffff')).join('');
    o+=[['IN+',300],['IN−',330]].map(([t,y])=>pin(740,y)+T(728,y+5,t,'end',13,700,'#ffffff')).join('');
    o+=g('sig',wpath([[480,110],[540,110],[540,90],[600,90]],'org',4));
    o+=g('gnd',wpath([[480,300],[600,300]],'red',4)+wpath([[480,330],[600,330]],'blk',4)+T(512,292,'6 V → VIN','middle',12,600)+T(540,352,'common GND','middle',12,600));
    o+=g('sv6',wpath([[600,115],[575,115],[575,300],[600,300]],'red',4)+wpath([[600,140],[560,140],[560,330],[600,330]],'brn',4)+`<circle cx="575" cy="300" r="4" fill="${COL.red}"/><circle cx="560" cy="330" r="4" fill="${COL.blk}"/>`);
    o+=g('sdin',wpath([[740,300],[790,300]],'red',4)+wpath([[740,330],[790,330]],'blk',4)+T(790,392,'from C driver V+ / Gnd','end',12,500,'#6b6b6b'));

  o+=[['S',455],['+',480],['−',505]].map(([t,y])=>pin(SX1,y)+T(SX1-12,y+5,t,'end',14,700,'#ffffff')).join('');
  o+=[['OUT+',640],['OUT−',670]].map(([t,y])=>pin(SX1,y)+T(SX1-12,y+5,t,'end',13,700,'#ffffff')).join('');
  o+=[['IN+',640],['IN−',670]].map(([t,y])=>pin(SX0,y)+T(SX0+12,y+5,t,'start',13,700,'#ffffff')).join('');

  o+=g('gnd',wpath([[N1,300],[395,300],[395,640],[SX1,640]],'red',4)+wpath([[N1,330],[410,330],[410,670],[SX1,670]],'blk',4));

  o+=T(170,748,'Set the step-down to 6.0 V first.','middle',13,600,'#c62828')+T(170,766,'Never 24 V on the Nano.','middle',13,600,'#c62828');

  const h=location.hash.replace(/^#\/?/,''); let i=S.findIndex(x=>!pst.done[sid(x)]); if(i<0)i=0;
  const [h0,h1]=h.split('/');
  if(h0==='ws'){render(pst.last||0); openWs(h1||'ov'); return}
  if(h){const m=h0.match(/^s(\d+)$/); i=m?S.findIndex(x=>x.kind==='step'&&x.n===+m[1]):(+h0-1); if(!(i>=0))i=0;}
  if(h1){vFor=i; vTab=h1;}
  render(i); window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

const TESTS=[['Each driver, bench','Cal','“Cal success” on the screen'],['Each driver, bench','Read encoder (31)','A reply. The number changes when you turn the shaft.'],['Each driver, bench','Magnet at each sensor','The sensor LED lights'],['Each driver, bench','Go home (91), no load','It turns slowly and stops when you trigger the sensor'],['Each gearbox, by hand','Turn the input through one full output turn','Smooth. No tight spot, no clicking.'],['Each gearbox, by hand','Hold the input, wiggle the output','Almost no play'],['Each joint, belt OFF','Jog ±5°','Right direction, no noise'],['Each joint, belt ON','Jog ±10°, then home','Smooth. It stops at the sensor.'],['Whole bus','Power off, meter CAN H to CAN L','About 60 Ω'],['Whole bus','Scan IDs 1–7','Every device answers once, with the right ID']];
let dTab='ff', filt=null, tq='', ffPath=[];
function openTs(o={}){dTab=o.tab||'ff';filt=o.cats||null;tq='';if(o.tab==='ff')ffPath=[];document.body.classList.add('ts-open');drawTs()}
function listHTML(cats,q){
  const ql=q.toLowerCase(); let o='';
  DATA.cats.forEach(c=>{if(cats&&!cats.includes(c))return;
    const ids=P.map((p,i)=>i).filter(i=>P[i].cat===c&&(!ql||strip(P[i].problem+' '+P[i].cause+' '+P[i].fix).toLowerCase().includes(ql)));
    if(ids.length) o+=`<div class="cath">${esc(c)}</div>`+ids.map(i=>prHTML(i,false)).join('');});
  return o?`<div class="plist">${o}</div>`:'<p>No match. Try a shorter word.</p>';
}
function drawTs(){
  $$('[data-dt]').forEach(b=>b.classList.toggle('on',b.dataset.dt===dTab));
  const B=$('#tsBody'), st=G[stageOf(pIdx)];
  if(dTab==='step'){
    const ts=S[pIdx].ts||[];
    B.innerHTML=ts.length?`<div class="plist">${ts.map(i=>prHTML(i,false)).join('')}</div><p><button class="chip" data-dt="ff">Not here? Fault finder</button> <button class="chip" data-dt="list">All problems</button></p>`:'<p>No known problems for this step.</p>';
  } else if(dTab==='list'){
    B.innerHTML=`<input class="q" id="tq" placeholder="Search the problems…" value="${esc(tq)}">
      <div class="chips"><button class="chip ${!filt?'on':''}" data-c="">All</button><button class="chip ${filt&&filt.join()===st.cats.join()?'on':''}" data-c="__st">This stage</button>${DATA.cats.map(c=>`<button class="chip ${filt&&filt.length===1&&filt[0]===c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <div id="tl">${listHTML(filt,tq)}</div>`;
    $('#tq').oninput=e=>{tq=e.target.value;$('#tl').innerHTML=listHTML(filt,tq);fixLinks($('#tl'))};
  } else if(dTab==='tests'){
    B.innerHTML=`<p>Do these <b>before</b> you close up each joint. A fault is easy to fix now and hard to fix later.</p><div class="txt"><div class="tbl"><table><tr><th>When</th><th>Test</th><th>Pass</th></tr>${TESTS.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td></tr>`).join('')}</table></div></div>`;
  } else {
    const cur=ffPath.length?ffPath[ffPath.length-1]:'s', n=typeof cur==='string'?FF[cur]:null;
    let o=`<div class="ff"><div class="tip">First: take the belt off and try again. If the motor runs fine without the belt, the problem is in the joint. If it stops at the same angle every time, it is mechanical.</div>`;
    o+=`<div class="path">${ffPath.length?ffPath.map((p,k)=>typeof p==='string'?'':'').join('')+'Question '+(ffPath.length+1):'Question 1'}</div>`;
    if(n){
      o+=`<div class="q">${n.q}</div><div class="yn">${n.b?n.b.map((b,k)=>`<button data-ff="${k}">${b[0]}</button>`).join(''):'<button data-ff="y">Yes</button><button data-ff="n">No</button>'}</div>`;
      if(n.b) o=o.replace('class="yn"','class="yn" style="flex-direction:column"');
    } else {
      o+=`<div class="end"><b>${cur.t||'Problems'}</b>${cur.d||''}</div>${cur.c&&cur.c.length?listHTML(cur.c,''):''}`;
    }
    o+=ffPath.length?`<p><button class="chip" data-ffback>← Back one question</button> <button class="chip" data-ffre>Start again</button></p>`:'';
    B.innerHTML=o+'</div>';
  }
  fixLinks(B);
}
document.addEventListener('click',e=>{
  const t=e.target;
  const gl=t.closest('.gl'); if(gl){e.preventDefault();e.stopPropagation();gl.classList.contains('on')?gpopHide():gpopShow(gl);return} gpopHide();
  if(t.closest('[data-close]')||t.closest('#scrim')){document.body.classList.remove('ts-open','ws-open');return}
  const ts=t.closest('[data-ts]'); if(ts){const v=ts.dataset.ts; if(v==='stage')openTs({tab:'list',cats:G[stageOf(pIdx)].cats}); else openTs({tab:(S[pIdx].ts||[]).length?'step':'ff'}); return}
  const dt=t.closest('[data-dt]'); if(dt){dTab=dt.dataset.dt;drawTs();return}
  const c=t.closest('[data-c]'); if(c){const v=c.dataset.c;filt=v===''?null:v==='__st'?G[stageOf(pIdx)].cats:[v];drawTs();return}
  const ff=t.closest('[data-ff]'); if(ff){const cur=ffPath.length?ffPath[ffPath.length-1]:'s',n=FF[cur],v=ff.dataset.ff;const nx=n.b?n.b[+v][1]:n[v];ffPath.push(nx);drawTs();return}
  if(t.closest('[data-ffback]')){ffPath.pop();drawTs();return}
  if(t.closest('[data-ffre]')){ffPath=[];drawTs();return}
  const lb=t.closest('[data-lv]'); if(lb){setLevel(lb.dataset.lv);return}
  const wsb=t.closest('[data-ws]'); if(wsb){e.preventDefault();openWs(wsb.dataset.ws);return}
  if(t.closest('#wsBtn')){openWs('ov');return}
  if(t.closest('[data-print]')){window.print();return}
  const wt=t.closest('[data-wt]'); if(wt){openWs(wt.dataset.wt);return}
  const img=t.closest('main img, .drawer img'); if(img){$('#lb').innerHTML='<img alt="">';$('#lb img').src=img.src;document.body.classList.add('lb-open');return}
  const sv=t.closest('main .vbox svg, .modal .vbox svg'); if(sv){$('#lb').innerHTML='<div class="lbs">'+sv.outerHTML+'</div>';document.body.classList.add('lb-open');return}
  if(t.closest('#lb')){document.body.classList.remove('lb-open');return}
  const gs=t.closest('[data-go]'); if(gs){go(+gs.dataset.go);return}
  const tr=t.closest('#track'); if(tr){const r=tr.getBoundingClientRect();go(Math.floor((e.clientX-r.left)/r.width*NV()));return}
  if(t.closest('[data-on3d]')){on3d=true;store.set('3d-on',true);$('#v3d').innerHTML='';mount3d();return}
  const vb=t.closest('[data-v]'); if(vb){vTab=vb.dataset.v;$$('.vtabs button').forEach(b=>b.classList.toggle('on',b===vb));$('#vis').innerHTML=visHTML(pIdx,vTab);mount3d();return}
  const mv=t.closest('[data-mv]'); if(mv){go(pIdx+ +mv.dataset.mv);return}
  if(t.closest('[data-done]')){pst.done[sid(S[pIdx])]=true;save();if(pIdx<NV()-1)go(pIdx+1);else render(pIdx);return}
  const ck=t.closest('[data-ck]'); if(ck&&ck.classList.contains('dn')){e.preventDefault();return} if(ck){const k=ck.dataset.ck;pst.checks[k]=!pst.checks[k];save();ck.classList.toggle('ok',pst.checks[k]);$('input',ck).checked=pst.checks[k];e.preventDefault();return}
});


function wiresSVG(){
  // which wire to use, and how to fit it in the small MKS screw terminals
  const ins=(x,y,w,c)=>`<rect x="${x}" y="${y-9}" width="${w}" height="18" rx="9" fill="${c}" stroke="#1a1a1a"/>`;
  const strands=(x,y)=>[...Array(9)].map((_,i)=>{const dy=(i-4)*1.9;return `<path d="M${x} ${y+dy*0.6} C ${x+18} ${y+dy*0.8}, ${x+30} ${y+dy*1.3}, ${x+44} ${y+dy*1.9}" fill="none" stroke="#c77b30" stroke-width="1.3"/>`}).join('');
  const ok=(x,y)=>`<circle cx="${x}" cy="${y}" r="13" fill="#2e7d4f"/><path d="M${x-6} ${y} l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3"/>`;
  const no=(x,y)=>`<circle cx="${x}" cy="${y}" r="13" fill="#c62828"/><path d="M${x-5} ${y-5} l10 10 M${x+5} ${y-5} l-10 10" stroke="#fff" stroke-width="3"/>`;
  const T=(x,y,t,b=0,c='#1a1a1a',sz=13)=>`<text x="${x}" y="${y}" fill="${c}" font-size="${sz}" ${b?'font-weight="700"':''}>${t}</text>`;
  let o='';
  // row 1: the three kinds
  o+=T(20,26,'Which wire?',1,'#1a1a1a',16);
  // stranded
  o+=ins(30,70,150,'#d62828')+strands(180,70)+ok(260,70)+T(30,105,'Stranded (many tiny strands)',1)+T(30,122,'Use it for everything in the arm.',0,'#2e7d4f',12)+T(30,138,'It bends without breaking.',0,'#6b6b6b',12);
  // solid
  o+=ins(330,70,150,'#1d6fd8')+`<rect x="480" y="66" width="44" height="8" rx="3" fill="#c77b30" stroke="#8a5a20"/>`+no(560,70)+T(330,105,'Solid (1 thick strand)',1)+T(330,122,'Not in the arm.',0,'#c62828',12)+T(330,138,'It snaps when a joint moves.',0,'#6b6b6b',12);
  // jumper
  o+=`<rect x="630" y="58" width="40" height="24" rx="3" fill="#1a1a1a"/><rect x="636" y="64" width="6" height="12" fill="#555"/>`+ins(670,70,120,'#e9b200')+ok(830,70)+T(630,105,'Jumper (Dupont) wire',1)+T(630,122,'OK for the limit sensors:',0,'#2e7d4f',12)+T(630,138,'the plug goes on the sensor pins.',0,'#6b6b6b',12);
  // row 2: how to fit it
  o+=`<line x1="20" y1="165" x2="880" y2="165" stroke="#d0d0d0"/>`+T(20,195,'Into the MKS screw terminals',1,'#1a1a1a',16);
  // 1 strip
  o+=T(30,228,'1. Strip 5 mm',1)+ins(30,262,110,'#d62828')+strands(140,262)+`<line x1="140" y1="285" x2="184" y2="285" stroke="#1a1a1a"/><text x="162" y="300" text-anchor="middle" fill="#1a1a1a" font-size="11">5 mm</text>`;
  // 2 twist
  o+=T(240,228,'2. Twist tight',1)+ins(240,262,110,'#d62828')+`<path d="M350 262 l6 -4 l6 8 l6 -8 l6 8 l6 -8 l6 8 l6 -4" fill="none" stroke="#c77b30" stroke-width="3.5"/>`;
  // 3 terminal
  o+=T(450,228,'3. In, then tighten',1)+`<rect x="560" y="240" width="60" height="44" rx="4" fill="#3fa66b" stroke="#1a1a1a"/><circle cx="590" cy="252" r="7" fill="#d9d9d9" stroke="#1a1a1a"/><path d="M585 252 h10" stroke="#1a1a1a" stroke-width="2"/><rect x="556" y="266" width="10" height="10" fill="#1a1a1a"/>`+ins(450,271,80,'#d62828')+`<path d="M530 271 h32" stroke="#c77b30" stroke-width="3.5"/>`+T(450,305,'Tug it gently: it must stay in.',0,'#6b6b6b',12);
  // don'ts
  o+=no(680,250)+T(700,255,'No solder on the end',1)+`<rect x="700" y="262" width="60" height="12" rx="6" fill="#d62828" stroke="#1a1a1a"/><ellipse cx="770" cy="268" rx="12" ry="6" fill="#b0b0b0" stroke="#777"/>`;
  o+=no(680,300)+T(700,305,'No metal crimp tip (ferrule)',1)+`<rect x="700" y="312" width="60" height="12" rx="6" fill="#d62828" stroke="#1a1a1a"/><rect x="760" y="313" width="26" height="10" fill="#c0c0c0" stroke="#777"/>`;
  o+=T(700,345,'They snap inside the small terminals.',0,'#6b6b6b',12);

function wireMini(kinds){
  // the wire type for this card, drawn small: only the kinds this card uses
  const strand=(x,y,c)=>`<rect x="${x}" y="${y-6}" width="46" height="12" rx="6" fill="${c}" stroke="#1a1a1a"/>`+[...Array(7)].map((_,i)=>`<path d="M${x+46} ${y+(i-3)*1.1} q8 ${(i-3)*0.6} 16 ${(i-3)*2}" fill="none" stroke="#c77b30" stroke-width="1.1"/>`).join('');
  const K={
    power:['Power wire','stranded, about 18 AWG. Two wires in one terminal (in and out): twist the bare ends together first.',`${strand(4,10,'#d62828')}${strand(4,26,'#1a1a1a')}`],
    can:['CAN wire','stranded 22–24 AWG, H and L twisted together. Dupont jumpers only straight into the MKS / CANable: nothing else.',`<path d="M4 12 q8 10 16 0 t16 0 t16 0" fill="none" stroke="#e9b200" stroke-width="5"/><path d="M4 22 q8 -10 16 0 t16 0 t16 0" fill="none" stroke="#2b9348" stroke-width="5"/>`],
    sensor:['Sensor wires','jumper wires: the plug goes on the sensor pins',`<rect x="4" y="6" width="18" height="20" rx="2" fill="#1a1a1a"/><rect x="22" y="12" width="40" height="8" rx="4" fill="#1d6fd8" stroke="#1a1a1a"/>`],
    jumper:['Board wires','jumper wires',`<rect x="4" y="6" width="18" height="20" rx="2" fill="#1a1a1a"/><rect x="22" y="12" width="40" height="8" rx="4" fill="#8a8a8a" stroke="#1a1a1a"/>`],
    coil:['Motor wires','the motor’s own 4 wires',`${['#2b9348','#1a1a1a','#1d6fd8','#d62828'].map((c,i)=>`<rect x="4" y="${4+i*7}" width="58" height="5" rx="2.5" fill="${c}"/>`).join('')}`],
  };
  const items=(kinds||[]).filter(k=>K[k]).map(k=>`<div class="wm"><svg viewBox="0 0 70 34" width="70" height="34">${K[k][2]}</svg><div><b>${K[k][0]}</b><div class="wd2">${K[k][1]}</div></div></div>`).join('');
  return items?`<div class="wmini">${items}<div class="wm-t">Into a screw terminal: strip 5 mm, twist tight. No solder, no crimp tip.</div></div>`:'';
}

const planIdx=S.findIndex(s=>s.ov&&s.ov.includes('*'));
const WST=[['ov','Whole arm'],['all','Every wire'],['57D','57D driver (X, Y)'],['42D','42D driver (Z, A, B, C)'],['grip','Gripper'],['wires','Wires'],['tbl','Motor table']];
// which driver a card's terminals belong to (for the "every wire" list)
const DRVOF={'b-wirecoils':'X','b-power':'X','b-can':'X','b-sensor':'X','x-wire':'X','y-fan':'Y','Y-setup':'Y','y-wire':'Y','y-sensors':'Y','Z-setup':'Z','Z-remap':'Z','z-driver':'Z','z-sensors':'Z','A-setup':'A','a-wire':'A','a-sensor':'A','BC-setup':'B and C','b-sensors':'B','c-sensor':'C'};
function fullConn(d){
  // a whole driver, for the 57D / 42D close-ups of the wiring sheet
  const H=d==='57D'?'A/H':'CANH', Lw=d==='57D'?'B/L':'CANL', V=d==='57D'?'EVCC':'+5V', G=d==='57D'?'EGND':'GND', I1=d==='57D'?'I1':'En', I2=d==='57D'?'I2':'Dir';
  const R=(f,t,c,p,tag,w)=>[f,t,c,'',p,tag,'',null,w||{red:'Red',blk:'Black',yel:'Yellow',grn:'Green',blu:'Blue'}[c]];
  return [R('motor wire','A+','grn','A+'),R('motor wire','A−','blk','A−'),R('motor wire','B+','blu','B+'),R('motor wire','B−','red','B−'),
    R('+V in','V+','red','V+','+V in'),R('+V out','V+','red','V+','+V out'),R('GND in','Gnd','blk','Gnd','GND in'),R('GND out','Gnd','blk','Gnd','GND out'),
    R('CAN H in',H,'yel',H,'CAN H in'),R('CAN H out',H,'yel',H,'CAN H out'),R('CAN L in',Lw,'grn',Lw,'CAN L in'),R('CAN L out',Lw,'grn',Lw,'CAN L out'),
    R('sensor +',V,'red',V,'sensor +'),R('sensor −',G,'blk',G,'sensor −'),R('home sensor',I1,'blu',I1,'home S'),R('2nd sensor',I2,'blu',I2,'2nd S')]
    .concat(d==='42D'?[R('short wire from COM','+5V','red','COM~+5V','COM → +5V')]:[]);
}
function allConnHTML(){
  // every wire that stays in the arm, in build order (table-test wires are left out: they come off again)
  let o='', k=0, cur=-1;
  S.forEach((s,i)=>{
    if(!s.conn||s.kind!=='wire') return;
    const nxt=S.slice(i+1).find(x=>x.kind==='step'), drv=DRVOF[s.key];
    let n=0;
    s.conn.forEach(r=>{
      if(r[6]==='done') return; n++; if(r[6]==='tmp') return;
      if(s.stage!==cur){cur=s.stage; o+=`<div class="ch">${esc(G[cur].title)}</div>`;}
      const who=r[1].startsWith('**')&&r[4]?(r[7]?r[7]+' driver ':drv?drv+' driver ':''):'';
      o+=`<div class="cr"><span class="cn">${++k}</span><span class="cw"><i style="background:${COL[r[2]]||r[2]}"></i>${esc(r[8])}</span><span class="cf">${mdb(r[0]||'')}</span><span class="ct">→ ${esc(who)}${mdb(r[1])}</span><span class="cc"><a href="#/${i+1}">${esc(s.title)}</a><span class="ccl"> · line ${n}${nxt?` · before step ${nxt.n}`:''}</span><span class="ccp">${nxt?'before '+nxt.n:''}</span></span></div>`;
    });
  });
  return `<div class="wsall"><div class="wsh"><b>Arctos: every wire, in build order</b><span>${k} wires. Table-test wires are not listed: they come off again.</span><button class="chip noprint" data-print>Print this sheet</button></div>${legend}<div class="cols2">${o}</div></div>`;
}
function openWs(k){
  document.body.classList.add('ws-open');
  $('#wsTabs').innerHTML=WST.map(([id,l])=>`<button data-wt="${id}" class="${id===k?'on':''}">${l}</button>`).join('');
  let o='';
  if(k==='ov') o=`<div class="vbox sheet">${overviewSVG(planIdx)}</div>${legend}<p>The four wires that run up the arm: <b>+V, GND, CAN H, CAN L</b>. Power and CAN both daisy-chain: each driver takes them from the driver below and passes them on to the next one, from the same screws. The bus ends at the CANable (120R jumper) and at the gripper MCP2515 (J1).</p>`;
  else if(k==='all') o=allConnHTML();
  else if(k==='57D'||k==='42D') o=`<div class="vbox sheet">${benchSVG({bench:k==='57D'?['dip']:[],drv:k,conn:fullConn(k)})}</div>${legend}`+(k==='57D'?'<p><b>Right-hand block:</b> power (V+, Gnd) and CAN (B/L = CAN L, A/H = CAN H). <b>Left-hand block:</b> sensors on I1 (home) and I2, sensor power from EVCC and EGND. Set <b>DIP switches 2 and 3 ON</b>. The sensors take 5 V from the driver, never 24 V.</p>':'<p><b>Right-hand block:</b> power (V+, Gnd) and the sensor signals (En = home, Dir). <b>Left-hand block:</b> sensor power (+5V, GND) and CAN (CANH, CANL). A short wire joins <b>COM to +5V</b>. Send the remap command for that axis (Z <code>03 9E 01 A2</code>, A <code>04 9E 01 A3</code>, B <code>05 9E 01 A4</code>, C <code>06 9E 01 A5</code>).</p>');
  else if(k==='wires') o=`<div class="vbox sheet">${wiresSVG()}</div><div class="txt"><table><tr><th>Wire</th><th>Type</th><th>Size</th></tr><tr><td>+V and GND up the arm</td><td>Stranded</td><td>about 18 AWG (0.75–1 mm²)</td></tr><tr><td>CAN H and CAN L</td><td>Dupont jumper wires, or stranded; twisted together</td><td>22–24 AWG or jumper</td></tr><tr><td>Thin solid wire</td><td>Bench tests only, never through a joint</td><td>–</td></tr><tr><td>Limit sensors</td><td>Jumper wires</td><td>as they come</td></tr><tr><td>Motor coils</td><td>The motor's own wires</td><td>–</td></tr></table></div>`;
  else if(k==='grip') o=`<div class="vbox sheet">${gripSVG({grip:[]})}</div><p>MCP2515 → Nano with jumper wires. The step-down (6.0 V) feeds the servo and the Nano VIN, with one common GND. Its input comes from the C driver V+ / Gnd. J1 jumper on: the far end of the CAN bus.</p>`;
  else { const b=S.find(s=>s.key==='b-intro'); o=`<div class="txt">${b?b.html.replace(/<ol>[\s\S]*$/,''):''}</div>`; }
  $('#wsBody').innerHTML=o; wsK=k;
}
let wsK='ov';

/* ---------- find ---------- */
const IDX=S.map((s,i)=>({i,t:(s.kind==='step'?'Step '+s.n+': ':(KLAB[s.kind]+': '))+s.title,x:(s.title+' '+strip(s.html)+' '+(s.conn||[]).flat().join(' ')).toLowerCase()}));
let hsel=0;
function findDraw(){
  const q=$('#q').value.trim().toLowerCase(), H=$('#hits'); if(!q){H.style.display='none';return}
  let r=/^\d+$/.test(q)?IDX.filter(o=>S[o.i].n===+q):[];
  r=r.concat(IDX.filter(o=>!r.includes(o)&&o.x.includes(q))).slice(0,14);
  H.innerHTML=r.map((o,k)=>`<a href="#/${o.i+1}" class="${k===hsel?'sel':''}">${esc(o.t)}<small>${esc(G[stageOf(o.i)].title)}</small></a>`).join('')||'<a>No match</a>';
  H.style.display='block';
}
$('#q').addEventListener('input',()=>{hsel=0;findDraw()});
$('#q').addEventListener('keydown',e=>{const a=$$('#hits a');if(e.key==='ArrowDown'){hsel=Math.min(hsel+1,a.length-1);findDraw();e.preventDefault()}else if(e.key==='ArrowUp'){hsel=Math.max(hsel-1,0);findDraw();e.preventDefault()}else if(e.key==='Enter'&&a[hsel]){location.hash=a[hsel].getAttribute('href');$('#q').value='';findDraw();$('#q').blur()}else if(e.key==='Escape'){$('#q').value='';findDraw()}});
document.addEventListener('click',e=>{if(!e.target.closest('.find'))$('#hits').style.display='none'; if(e.target.closest('#hits a')){$('#q').value='';}});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){document.body.classList.remove('ts-open','ws-open','lb-open');return}
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.body.classList.contains('ts-open')||document.body.classList.contains('ws-open'))return;
  if(e.key==='ArrowRight'){go(pIdx+1);e.preventDefault()}
  else if(e.key==='ArrowLeft'){go(pIdx-1);e.preventDefault()}
  else if(e.key==='Enter'&&!e.target.closest('button,a,summary')){$('[data-done]').click();e.preventDefault()}
});
route();
})();
</script>
</body>
</html>
