<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arctos Build Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eeeeee; --sheet:#f6f6f4; --ink:#1a1a1a; --ink2:#3d3d3d; --muted:#6b6b6b; --rule:#c9c9c9; --rule2:#dcdcdc;
  --wire:#e07a00; --test:#1f7a3a; --info:#1a1a1a; --bad:#c62828;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
code{white-space:nowrap;font-family:var(--mono);font-size:.9em;background:#fff;border:1px solid var(--rule2);padding:0 4px}
pre{background:#fff;border:1px solid var(--rule);padding:10px 12px;overflow:auto;font-size:13.5px}
pre code{border:0;padding:0}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--ink)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 24px;max-width:1500px;margin:0 auto}
.logo{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.logo b{font-weight:700;letter-spacing:.14em;font-size:19px}
.logo span{font-weight:400;letter-spacing:.2em;font-size:12px;color:var(--muted);text-transform:uppercase}
.find{position:relative;flex:1;max-width:380px;margin-left:auto}
.find input{width:100%;padding:7px 10px;border:1px solid var(--ink);background:#fff;font:14px var(--sans);border-radius:0}
.hits{position:absolute;top:38px;left:0;right:0;background:#fff;border:1px solid var(--ink);max-height:60vh;overflow:auto;display:none;z-index:40}
.hits a{display:block;padding:7px 10px;border-bottom:1px solid var(--rule2);text-decoration:none;font-size:14px}
.hits a:hover,.hits a.sel{background:var(--paper)}
.hits small{display:block;color:var(--muted);font-size:12px}
.tb{border:1px solid var(--ink);background:transparent;padding:6px 12px;font-size:14px;white-space:nowrap}
.tb:hover{background:#fff}
.tb.bad{border-color:var(--bad);color:var(--bad)}
/* level buttons */
.lvl{display:flex;border:1px solid var(--ink);flex:0 0 auto}
.lvl button{border:0;background:transparent;padding:6px 13px;min-height:44px;font-size:13.5px;color:var(--ink2)}
.lvl button+button{border-left:1px solid var(--ink)}
.lvl button.on{background:var(--ink);color:#fff;font-weight:600}
.lvnote{font-size:13px;color:var(--muted);border-left:3px solid var(--ink);padding:2px 10px;margin:0 0 12px}
/* beginner glossary */
.gl{border-bottom:1.5px dotted var(--wire);cursor:help}
.gl:hover,.gl.on{background:#fff3e0}
.gpop{position:absolute;z-index:44;max-width:300px;background:#fff;border:1px solid var(--ink);padding:8px 11px;font-size:13.5px;line-height:1.45;box-shadow:3px 3px 0 var(--rule)}
.gpop b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
/* chapters */
.chap{display:flex;gap:0;overflow-x:auto;max-width:1500px;margin:0 auto;padding:0 24px;scrollbar-width:thin}
.chap button{flex:0 0 auto;border:0;background:none;padding:8px 12px 7px;min-height:44px;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.chap button b{font-family:var(--mono);font-weight:500;margin-right:5px;color:var(--ink2)}
.chap button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.chap button .n{font-family:var(--mono);font-size:11px;margin-left:5px}
.chap button.full .n{color:var(--test)}
.track{display:flex;height:4px;max-width:1500px;margin:0 auto;background:var(--rule2);cursor:pointer;position:relative}
.track .seg{height:100%;border-right:2px solid var(--paper);position:relative}
.track .seg i{position:absolute;inset:0;background:var(--ink);transform-origin:left}
.track .pos{position:absolute;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--wire);margin-left:-5px}
/* page */
main{max-width:1500px;margin:0 auto;padding:18px 24px 120px}
.fig{position:relative}
.vtabs{display:flex;gap:0;margin-bottom:-1px;flex-wrap:wrap}
.vtabs button{border:1px solid var(--rule);border-bottom:0;background:var(--paper);padding:5px 12px;font-size:13px;color:var(--muted);margin-right:-1px}
.vtabs button.on{background:var(--sheet);color:var(--ink);border-color:var(--ink);position:relative;z-index:1}
.vbox{border:1px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;min-height:220px}
.vbox.sheet{background:var(--sheet)}
.vbox img{max-width:100%;max-height:46vh;display:block;cursor:zoom-in}
.vbox svg{width:100%;height:auto;display:block;max-height:58vh}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.modal .legend .lv{display:none}
.legend i{display:inline-block;width:20px;height:4px;margin-right:6px;vertical-align:middle}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:34px;margin-top:22px;align-items:start}
/* step header: big number with a leader line, like the manual's labels */
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:6px}
.num{font-weight:300;font-size:64px;line-height:.9;letter-spacing:-.02em}
.num.card{font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid currentColor;padding:4px 9px;line-height:1.2;margin-bottom:6px}
.num.wire{color:var(--wire)} .num.test{color:var(--test)} .num.info{color:var(--ink)}
.lead{flex:1;position:relative;height:1px;background:var(--ink);margin-bottom:12px}
.lead:before{content:"";position:absolute;left:-5px;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--ink)}
.kick{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;white-space:nowrap;margin-left:auto}
.txt h1{font-size:27px;font-weight:500;line-height:1.25;margin:4px 0 14px}
.txt h2,.txt h3{font-size:18px;font-weight:600;margin:20px 0 6px}
.txt img{max-width:100%;cursor:zoom-in;border:1px solid var(--rule)}
.txt table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0 14px}
.txt th,.txt td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.txt th{font-weight:600;border-bottom:1.5px solid var(--ink);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.tbl{overflow-x:auto}
.txt ol,.txt ul{padding-left:22px} .txt li{margin:3px 0}
.txt ol li::marker{font-family:var(--mono);font-size:.9em}
.callout{border-left:3px solid var(--ink);padding:8px 14px;margin:14px 0;background:var(--sheet)}
.callout-title{font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.callout.warning,.callout.danger,.callout.caution{border-color:var(--bad)} .callout.warning .callout-title,.callout.danger .callout-title{color:var(--bad)}
.callout.tip{border-color:var(--test)} .callout.important{border-color:var(--wire)}
.callout p{margin:4px 0}
.missing{color:var(--muted);font-style:italic}
/* wire checklist */
.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin:18px 0 6px;display:flex;align-items:center;gap:10px}
.sec:after{content:"";flex:1;height:1px;background:var(--rule)}
.conn{width:100%;border-collapse:collapse;font-size:14.5px;margin:0 0 10px}
.conn td{border-bottom:1px solid var(--rule2);padding:7px 6px;vertical-align:middle}
.conn tr{cursor:pointer} .conn tr.ok td{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
.conn .sw{display:inline-block;width:28px;height:5px;margin-right:9px;vertical-align:middle}
.conn .ar{color:var(--muted)} .conn .nt{display:block;color:var(--muted);font-size:12.5px;text-decoration:none}
.conn input,.checks input{width:18px;height:18px;accent-color:var(--ink);vertical-align:middle;margin:0}
.checks{list-style:none;padding:0!important;margin:6px 0 14px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule2);cursor:pointer;margin:0}
.checks input{margin-top:3px;flex:0 0 auto}
.checks li.ok span{color:var(--muted)}
/* side column */
.side>div{margin-bottom:22px}
.joint{border:1px solid var(--ink);background:var(--sheet)}
.joint h4,.help h4{margin:0;padding:8px 12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;gap:8px}
.joint h4 span,.help h4 span{font-weight:400;color:var(--muted);letter-spacing:.04em;text-transform:none}
.jr{display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px 10px;padding:8px 12px;border-bottom:1px solid var(--rule2);font-size:13.5px;line-height:1.45}
.jr:last-child{border-bottom:0}
.jr>b{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:1px}
.jr .w{display:flex;align-items:center;gap:8px;margin:1px 0}
.jr .w i{flex:0 0 22px;height:4px}
.jnote{padding:8px 12px;font-size:13px;color:var(--muted)}
.help{border:1px solid var(--bad);background:var(--sheet)}
.help h4{border-color:var(--bad);color:var(--bad)}
details.pr{border-bottom:1px solid var(--rule2)}
details.pr:last-of-type{border-bottom:0}
details.pr summary{padding:8px 12px 8px 30px;cursor:pointer;font-size:14px;list-style:none;position:relative;font-weight:500}
details.pr summary::-webkit-details-marker{display:none}
details.pr summary:before{content:"+";position:absolute;left:12px;font-family:var(--mono);color:var(--bad)}
details.pr[open] summary:before{content:"−"}
details.pr summary small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
details.pr .fx{padding:0 12px 10px 30px;font-size:14px}
details.pr .fx p{margin:4px 0}
.fx .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:6px}
.help .acts{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--rule2)}
.help .acts button{border:1px solid var(--ink);background:transparent;padding:5px 10px;font-size:13px}
/* keyboard focus */
:focus-visible{outline:2px solid var(--wire);outline-offset:2px}
.find input:focus-visible{outline-offset:0}
/* credit */
.credit{margin:28px 0 0;padding-top:10px;border-top:1px solid var(--rule2);font-size:13px;color:var(--muted);line-height:1.5}
.credit a{color:var(--muted)}
.credbox{border:1px solid var(--ink);background:var(--sheet);padding:12px 14px;margin:0 0 16px;font-size:14.5px;line-height:1.55}
.credbox b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--paper);border-top:1px solid var(--ink)}
.nav .in{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 24px}
.nb{border:1px solid var(--ink);background:transparent;padding:11px 18px;font-size:15px}
.nb:hover:not(:disabled){background:#fff}
.nb:disabled{opacity:.3;cursor:default}
.nb.go{background:var(--ink);color:#fff;font-weight:600}
.nb.go:hover{background:#000}
.nb.bad{border-color:var(--bad);color:var(--bad)}
.nav .cnt{margin:0 auto;text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted);line-height:1.3}
.nav .cnt b{color:var(--ink);font-weight:500;font-size:15px}
kbd{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:6px}
.nb.go kbd{color:#bbb}
/* simple mode: fewer controls */
body.simple .find, body.simple #wsBtn, body.simple .bar > [data-ts], body.simple [data-mv="1"], body.simple .kick, body.simple .track{display:none}
body.simple .cols{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
body.simple .txt{font-size:17px}
.cols.one{grid-template-columns:minmax(0,1fr)!important;max-width:900px}
/* drawer + sheet modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:45;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);z-index:50;background:var(--paper);border-left:1px solid var(--ink);transform:translateX(105%);transition:transform .22s;display:flex;flex-direction:column}
body.ts-open .drawer{transform:none} body.ts-open .scrim,body.ws-open .scrim{display:block}
.dh{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--ink)}
.dh h3{margin:0;font-size:15px;letter-spacing:.12em;text-transform:uppercase;flex:1}
.x{border:1px solid var(--ink);background:transparent;width:44px;height:44px;font-size:18px;line-height:1}
.dtabs{display:flex;border-bottom:1px solid var(--rule)}
.dtabs button{flex:1;border:0;background:none;padding:9px;min-height:44px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent}
.dtabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.db{overflow:auto;padding:14px 18px 40px;flex:1}
.db input.q{width:100%;padding:8px 10px;border:1px solid var(--ink);background:#fff;font:14px var(--sans);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--rule);background:transparent;padding:3px 9px;font-size:12.5px;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.plist{border:1px solid var(--ink);background:var(--sheet)}
.cath{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:10px 12px 4px;color:var(--muted);border-bottom:1px solid var(--rule2)}
.ff .q{font-size:22px;font-weight:500;margin:6px 0 16px;line-height:1.3}
.ff .yn{display:flex;gap:10px;margin-bottom:18px}
.ff .yn button{flex:1;border:1px solid var(--ink);background:#fff;padding:14px;font-size:17px;font-weight:600}
.ff .yn button:hover{background:var(--ink);color:#fff}
.ff .path{font-size:13px;color:var(--muted);margin-bottom:12px;font-family:var(--mono)}
.ff .end{border:1px solid var(--ink);background:var(--sheet);padding:12px 14px;margin-bottom:14px}
.ff .end b{display:block;font-size:17px;margin-bottom:4px}
.ff .tip{font-size:14px;color:var(--ink2);border-left:3px solid var(--wire);padding:4px 12px;margin:0 0 16px}
.modal{position:fixed;inset:24px;z-index:50;background:var(--paper);border:1px solid var(--ink);display:none;flex-direction:column}
body.ws-open .modal{display:flex}
.modal .db{padding:16px 22px 30px}
.wsgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(238,238,238,.97);display:none;align-items:center;justify-content:center;cursor:zoom-out}
.lb img{max-width:96vw;max-height:94vh}
.lbs{width:96vw;height:94vh;overflow:auto;background:var(--sheet);border:1px solid var(--ink)} .lbs svg{width:max(96vw,1100px);height:auto;display:block}
.vbox svg{cursor:zoom-in}
body.lb-open .lb{display:flex} body.lb-open .scrim{display:none}
/* svg states */
.wd text{font-family:var(--sans)}
.wd rect,.wd circle{stroke-width:1.3}
.wd .st-off{opacity:.12} .wd .st-done{opacity:1}
.wd .st-now{opacity:1;filter:drop-shadow(0 0 2.5px #ff9500) drop-shadow(0 0 7px rgba(255,149,0,.55))}
.wd .st-now .flow{stroke-dasharray:9 7;animation:flow .9s linear infinite}
.wd .ghost{opacity:1}
@keyframes flow{to{stroke-dashoffset:-16}}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)} }
@media (max-width:720px){
  .lvl{order:4;flex-basis:100%} .lvl button{flex:1}
  .bar{padding:8px 14px;flex-wrap:wrap;gap:8px} .find{order:3;flex-basis:100%;max-width:none} .logo span{display:none}
  .chap{padding:0 8px} main{padding:12px 16px 110px}
  .num{font-size:48px} .txt h1{font-size:22px} .kick{display:none}
  .nav .in{padding:8px 10px;gap:6px} .nb{padding:10px 11px;font-size:14px;min-width:44px;min-height:44px} kbd,.nl{display:none}
  .modal{inset:0}
  .vbox img{max-height:40vh}
}
@media print{.top,.nav,.side .help .acts{display:none} main{padding:0}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="logo"><b>ARCTOS</b><span>Closed-loop build manual</span></div>
    <div class="lvl" role="group" aria-label="How much to read"><button data-lv="0">Simple</button><button data-lv="2">Detailed</button></div>
    <div class="find"><input id="q" aria-label="Find a step" placeholder="Find a step: “129”, “belt”, “CAN”…" autocomplete="off"><div class="hits" id="hits"></div></div>
    <button class="tb" id="wsBtn">Wiring sheet</button>
    <button class="tb bad" data-ts>⚠ Troubleshooting</button>
  </div>
  <div class="chap" id="chap"></div>
  <div class="track" id="track"></div>
</header>
<main id="main"></main>
<div class="nav"><div class="in">
  <button class="nb" data-mv="-1">← Back<kbd>←</kbd></button>
  <button class="nb bad" data-ts title="Troubleshooting" aria-label="Problem? Open troubleshooting">⚠<span class="nl"> Problem?</span></button>
  <div class="cnt" id="cnt"></div>
  <button class="nb" data-mv="1">Skip<kbd>→</kbd></button>
  <button class="nb go" data-done>Done, next →<kbd>Enter</kbd></button>
</div></div>
<div class="scrim" id="scrim"></div>
<section class="drawer" aria-label="Troubleshooting">
  <div class="dh"><h3>Troubleshooting</h3><button class="x" data-close aria-label="Close">×</button></div>
  <div class="dtabs"><button data-dt="ff">Fault finder</button><button data-dt="list">All problems</button><button data-dt="tests">Tests</button></div>
  <div class="db" id="tsBody"></div>
</section>
<section class="modal" aria-label="Wiring sheet">
  <div class="dh"><h3>Wiring sheet</h3><button class="x" data-close aria-label="Close">×</button></div>
  <div class="dtabs" id="wsTabs"></div>
  <div class="db" id="wsBody"></div>
</section>
<div class="lb" id="lb"><img alt="Manual picture, zoomed"></div>
<script>
const DATA = {"problems": [{"cat": "Printing and fit", "problem": "Bearings, nuts or bolts don't fit", "cause": "", "fix": "Calibrate the flow rate, then print the test part. [docs] Deburr or drill the holes. [docs]"}, {"cat": "Printing and fit", "problem": "Parts are consistently too big", "cause": "", "fix": "Print at 99 %. [docs]"}, {"cat": "Printing and fit", "problem": "A bearing won't go in", "cause": "", "fix": "Tap it in evenly with a wood block and a mallet, or press it with a socket or a second bearing. Don't force it crooked. (Unexpected Maker)"}, {"cat": "Printing and fit", "problem": "A big bearing won't enter a tapered bore", "cause": "", "fix": "<strong>Reprint</strong>, don't sand. Sanding made it stick. (Unexpected Maker)"}, {"cat": "Printing and fit", "problem": "A nut spins in its pocket (stripped plastic)", "cause": "", "fix": "Hold it with pliers or Blu-Tack. Reprint the part if the pocket is gone."}, {"cat": "Printing and fit", "problem": "A part snapped while forcing a rod", "cause": "", "fix": "Stop forcing it. Check the alignment and the order. Reprint. (Unexpected Maker, Y cycloid)"}, {"cat": "Printing and fit", "problem": "The gearbox won't close (wrist)", "cause": "", "fix": "Your motor's shaft may be longer than the design expects. Check it against the CAD. (Unexpected Maker)"}, {"cat": "Cycloidal gearbox", "problem": "<strong>Lots of slop / backlash</strong> (even 45°)", "cause": "<strong>Undersized outer pins</strong>", "fix": "Measure them: they should be about <strong>3.97 mm</strong>. One builder's were 3.82 mm. Buy good pins. \"It's not a 3D printing problem.\" (Unexpected Maker)"}, {"cat": "Cycloidal gearbox", "problem": "Slop", "cause": "Loose disk bearings", "fix": "Press the bearing caps fully down. Reprint the caps if needed. (Unexpected Maker)"}, {"cat": "Cycloidal gearbox", "problem": "Slop came back after tightening", "cause": "The nuts pull the rods", "fix": "Use M4x100 / M5x100 <strong>bolts</strong> instead of rods with ause": "Gears printed too big", "fix": "Try 99 % (or 98 %). Run it in with a drill. Lubricate it. [docs]"}, {"cat": "Planetary gearbox", "problem": "Binds", "cause": "The output sun gear", "fix": "Try it <strong>without</strong> the output sun gear. [docs, manual note]"}, {"cat": "Planetary gearbox", "problem": "Bolt holes half a hole out", "cause": "The planet is turned 180°", "fix": "Turn it 180°. The holes are off-centre. (Unexpected Maker)"}, {"cat": "Planetary gearbox", "problem": "<strong>Gears tilt and lock</strong>", "cause": "Gears printed <strong>too small</strong>", "fix": "Reprint at <strong>100 %</strong>. Check that the slicer is not scaling everything. (Unexpected Maker, wrist)"}, {"cat": "Planetary gearbox", "problem": "Rattles", "cause": "Too loose", "fix": "Print at a bigger scale. Tighten the bolts evenly. Press the parts against the bearings while you tighten."}, {"cat": "Planetary gearbox", "problem": "A sun gear cracked", "cause": "A bolt that is too long", "fix": "Use the right bolt length (about 15 mm there). (Alberto)"}, {"cat": "Planetary gearbox", "problem": "Screws won't go in", "cause": "No clearance holes", "fix": "Pre-drill with a 3 mm bit. (Unexpected Maker)"}, {"cat": "Planetary gearbox", "problem": "A catch at one spot (stick-slip)", "cause": "Gear mesh too tight in one place", "fix": "Work it back and forth by hand through the spot. Grease it. Reprint with more clearance if needed. (mdion2)"}, {"cat": "Belts", "problem": "The belt skips under load", "cause": "", "fix": "Tighten it so it <strong>can't skip</strong>. On X: loosen the 4 motor bolts, slide the motor back, tighten the back nuts, then the front ones. (Unexpected Maker)"}, {"cat": "Belts", "problem": "The idler doesn't turn", "cause": "", "fix": "It is clamped. Add washers so it floats. (Unexpected Maker)"}, {"cat": "Belts", "problem": "A bolt head rubs the belt", "cause": "", "fix": "Turn the bolt around. (Unexpected Maker)"}, {"cat": "Belts", "problem": "The A belt can' dion2)"}, {"cat": "CAN bus / drivers not answering", "problem": "Is the bus getting data?", "cause": "", "fix": "With \"Direct mode\" on, the driver LED flashes when it receives CAN messages. [docs]"}, {"cat": "CAN bus / drivers not answering", "problem": "Answers, but the joint holds and won't move", "cause": "", "fix": "That is the classic <strong>H/L swap</strong> symptom. (Unexpected Maker)"}, {"cat": "CAN bus / drivers not answering", "problem": "One bad section breaks everything", "cause": "", "fix": "The daisy chain is in series. Check each joint's connections. Photograph them before you take anything apart. (Unexpected Maker)"}, {"cat": "Motor problems", "problem": "<strong>Answers but no torque</strong> (the shaft spins freely)", "cause": "", "fix": "No motor power on V+/Gnd (the driver can talk on USB/CAN power alone), a broken phase wire, or a bad connector. Measure the coils (a few ohms each). Swap with a known-good motor. (mdion2)"}, {"cat": "Motor problems", "problem": "Moves only a little (1° instead of 4°)", "cause": "", "fix": "A loose motor connector. Reseat it. (mdion2)"}, {"cat": "Motor problems", "problem": "Wrong direction", "cause": "", "fix": "Invert the axis in Arctos Studio → Robot Config, or flip one coil. [docs]"}, {"cat": "Motor problems", "problem": "Moves too far / not far enough", "cause": "", "fix": "Set the gear ratio, or run <strong>Calibrate Axes</strong>. [docs]"}, {"cat": "Motor problems", "problem": "Motor too hot", "cause": "", "fix": "Lower the current (Ma). \"Maximum torque without the motor being too hot to touch.\" [docs]"}, {"cat": "Motor problems", "problem": "Jerky at very low speed", "cause": "", "fix": "A known vFOC issue. Try SR_CLOSE mode. (MKS issue #16)"}, {"cat": "Motor problems", "problem": "Misses steps, but stall protection doesn't trip", "cause": "", "fix": "A known MKS issue: stall detection is unreliable. Don't rely on it. (MKS issue #3, 4 reports)"}, {"cat": "Motor problems", "problem": "A new target is ignored while moving", "cause": "", "fix": "The MKS ignores a new position command until the move ends. Send smaller moves, or stop first. (MKS issue #29)"}, {"cat": "Motor problems", "problem": "Stuck on \"Coming back to Origin\"", "cause": "", "fix": "A known firmware bug. Power cycle; factory reset (hold Next at power-on); re-calibrate. No confirmed fix. (MKS issue #19)"}, {"cat": "Motor problems", "problem": "Power comes on and then goes off", "cause": "", "fix": "A loose wire somewhere, often in the wrist. (Unexpected Maker)"}, {"cat": "Calibration (MKS \"Cal\")", "problem": "\"Reverse Lookup Error\"", "cause": "", "fix": "Check that the magnet is glued, <strong>centred</strong> and close to the chip. The coil resistance must be <strong>under 10 Ω</strong>. Calibrate <strong>with no load</strong>. [MKS], (MKS issues #6, #40)"}, {"cat": "Calibration (MKS \"Cal\")", "problem": "\"Phase Line Error!\"", "cause": "", "fix": "Check the motor wiring order and the power supply. [MKS]"}, {"cat": "Calibration (MKS \"Cal\")", "problem": "\"Not Cal\"", "cause": "", "fix": "Run Cal. You must calibrate before the other menu items unlock. [MKS]"}, {"cat": "Calibration (MKS \"Cal\")", "problem": "Odd behaviour after mounting", "cause": "", "fix": "Factory reset, then calibrate again <strong>with the belt off</strong>, then re-enter the settings. This fixed X running past its limit. (Unexpected Maker)"}, {"cat": "Limit sensors and homing", "problem": "A sensor doesn't light", "cause": "", "fix": "The driver must be powered, because the sensors take its 5 V. On a 57D, set <strong>DIP switches 2 and 3 ON</strong>. [docs]"}, {"cat": "Limit sensors and homing", "problem": "It lights, but the motor runs past it", "cause": "", "fix": "<strong>EndLimit</strong> is off. Or on a 42D: the <strong>remap</strong> wasn't sent, or the <strong>COM-to-+V jumper</strong> is missing. (Unexpected Maker)"}, {"cat": "Limit sensors and homing", "problem": "42D remap fails", "cause": "", "fix": "Stop h he motor wiring order and the power supply."}, {"problem": "\"Not Cal\"", "cause": "", "fix": "Run Cal. You must calibrate before the other menu items unlock."}, {"problem": "Odd behaviour after mounting", "cause": "", "fix": "Factory reset, then calibrate again with the belt off, then re-enter the settings."}, {"problem": "A limit sensor doesn't light", "cause": "The sensors take 5 V from the driver, so it must be powered.", "fix": "Power the driver. On a 57D, set DIP switches 2 and 3 ON."}, {"problem": "Sensor lights, but the motor runs past it", "cause": "", "fix": "EndLimit is off. On a 42D, the remap wasn't sent or the COM-to-+V jumper is missing."}, {"problem": "42D remap fails", "cause": "", "fix": "Stop homing first. The remap only works by command, not from the menu."}, {"problem": "It homes the wrong way or to the wrong sensor", "cause": "", "fix": "Swap the sensors, or change HmDir (CW/CCW)."}, {"problem": "A magnet isn't detected", "cause": "The magnet faces the wrong way. Hall sensors only see one pole.", "fix": "Test each magnet before you glue it."}, {"problem": "The sensor can't reach its magnet", "cause": "", "fix": "Use spacers under the board (2x M2.5 nuts), or move the magnet."}, {"problem": "A sensor burnt out", "cause": "Its 5 V wire touched the 12/24 V line.", "fix": "Keep the sensor wires separate."}, {"problem": "The X sensor stops working", "cause": "", "fix": "Check the 57D's sensor GND terminal. One was broken."}, {"problem": "Motors weak or the supply cuts out", "cause": "The supply is too small.", "fix": "Use 12/24 V at 20 A, and at least 100 W."}, {"problem": "Boards died at first power-on", "cause": "Reversed polarity.", "fix": "Always check polarity with a meter before powering on."}, {"problem": "A wire got hot", "cause": "The wire is too thin.", "fix": "Use proper power wire for the main line, and a fuse."}, {"problem": "A wire snapped inside an MKS terminal", "cause": "Ferrules snap in the 2.54 mm terminals.", "fix": "Use bare, twisted stranded wire, or solid-core wire. Don't tin it."}, {"problem": "A stepper lead broke at the motor", "cause": "", "fix": "Add strain relief, and don't let parts press on the wires."}, {"problem": "Can't remove a motor", "cause": "The wires are too short.", "fix": "Leave slack."}, {"problem": "GRBL won't flash", "cause": "", "fix": "Re-zip only the inner <code>grbl</code> folder."}, {"problem": "Motors jitter during upload", "cause": "", "fix": "Unplug the motor power while you upload."}, {"problem": "Serial port busy", "cause": "", "fix": "Close the Arduino Serial Monitor first."}, {"problem": "<code>ArmJointState.h: No such file</code> (ROS 1)", "cause": "", "fix": "Source the ROS workspace, then regenerate <code>ros_lib</code>."}, {"problem": "The G-code converter outputs nothing", "cause": "", "fix": "Keep all 6 axes in every G-code line."}, {"problem": "Inverse kinematics fails", "cause": "", "fix": "Move the target closer to the base, or change the gripper angle."}, {"problem": "Arctos GUI on a Mac", "cause": "It needs ROS 1.", "fix": "Use the VM or Arctos Studio."}, {"problem": "The gripper servo doesn't move", "cause": "", "fix": "Set the step-down to 6 V. Check the shared ground between the Nano and the step-down. Check that the Nano sketch is flashed and that the MCP2515 has the 8 MHz crystal."}, {"problem": "No CAN response from the gripper", "cause": "It should be ID 07.", "fix": "Check the J1 jumper and the H/L wires."}, {"problem": "A metal servo arm came in the kit", "cause": "", "fix": "Use it. You don't need the printed one."}], "cats": ["Printing and fit", "Cycloidal gearbox", "Planetary gearbox", "Belts", "CAN bus / drivers not answering", "Motor problems", "Calibration (MKS \"Cal\")", "Limit sensors and homing", "Power", "Wires and terminals", "Software", "Gripper"], "steps": [{"stage": 0, "kind": "step", "n": 1, "title": "Title page of the manual", "img": "Attachments/Arctos/manual/arctos-step-001.png", "html": "<p>Title page of the manual. No assembly in this step. Note: \"ARCTOS assembly manual v 0.2.9 beta\"</p>", "html_simple": "<p>No building in this step.</p>", "checks_simple": [], "ts": [54, 44, 34]}, {"stage": 0, "kind": "step", "n": 2, "title": "Put a 625 bearing into one of the small pockets around the side of…", "img": "Attachments/Arctos/manual/arctos-step-002.png", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>A ring of <strong>625 bearings</strong> on <strong>M5x30</strong> bolts in the X upper core. Fill every pocket the same way.</p>\n</div>\n<p>Put a 625 bearing into one of the small pockets around the side of the X upper Core. Push a Bolt M5 30mm through the side hole so it goes through the bearing and holds it like an axle. Parts: X upper Core. Hardware: 625 bearing (8), Bolt M5 30mm v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Tip: the top bearing must sit <strong>flush</strong> with the top face. If a bearing won't go in by hand, put a block of wood on it and tap it evenly with a mallet. The M5x30 bolts thread straight into the plastic; the holes are tight on purpose.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>Ring of <strong>625 bearings</strong> on <strong>M5x30</strong> bolts in X upper core. Fill every pocket the same way.</p>\n</div>\n<p>625 bearing into each small side pocket of X upper Core; Bolt M5 30mm v2 through side hole, through bearing, as axle. Parts: X upper Core. Hardware: 625 bearing (8), Bolt M5 30mm v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Top bearing <strong>flush</strong> with top face. Stuck bearing: wood block on it, tap evenly with mallet. M5x30 bolts thread straight into plastic; holes tight on purpose.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Push a <strong>625 bearing</strong> (8x) into a small pocket on the side of the <strong>X upper Core</strong>.</li>\n<li>Push an <strong>M5x30</strong> bolt through the side hole and the bearing.</li>\n<li>Fill every pocket the same way.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Bearing flush</div>\n<p>The top bearing must sit flush with the top face.</p>\n</div>", "checks_simple": [], "ts": [2, 3, 0]}, {"stage": 0, "kind": "step", "n": 3, "title": "Result: the X upper Core with the bearings fitted in the side…", "img": "Attachments/Arctos/manual/arctos-step-003.png", "html": "<p>Result: the X upper Core with the bearings fitted in the side pockets and the bolt heads seen in the side holes. Check every bearing pocket is filled the same way. Parts: X upper Core (shown, not labelled). Hardware: none labelled.</p>", "html_pro": "<p>Result: X upper Core, bearings in side pockets, bolt heads visible in side holes. Check all pockets filled identically. Parts: X upper Core (shown, not labelled). Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture. Every bearing pocket is filled the same way.</p>", "checks_simple": [], "ts": [2, 3, 0]}, {"stage": 0, "kind": "step", "n": 4, "title": "Put the X upper Core on top of the X lower core", "img": "Attachments/Arctos/manual/arctos-step-004.png", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The upper core onto the lower core: <strong>3x M8</strong> from above and <strong>6x M3x20</strong> from below. (The manual says M8x25; the BOM lists M8x40 and M8x100. Check your bag.)</p>\n</div>\n<p>Put the X upper Core on top of the X lower core. Bolt them together with Bolt M8 25mm from above (drawn: 3) and fix the bottom with Bolt M3 20 mm from underneath (drawn: 6). Parts: X lower core. Hardware: Bolt M8 25mm v2, Bolt M3 20 mm.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Note: the picture says <strong>M8x25</strong>, but the parts list only has M8x40 and M8x100. Check the length against your parts before you buy.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>Upper core onto lower core: <strong>3x M8</strong> from above, <strong>6x M3x20</strong> from below. (Manual says M8x25; BOM lists M8x40 and M8x100. Check your bag.)</p>\n</div>\n<p>X upper Core on X lower core. Bolt M8 25mm v2 from above (drawn: 3); Bolt M3 20 mm from underneath (drawn: 6). Parts: X lower core. Hardware: Bolt M8 25mm v2, Bolt M3 20 mm.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Picture says <strong>M8x25</strong>; parts list has only M8x40 and M8x100. Check length against your parts before buying.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>X upper Core</strong> on the <strong>X lower core</strong>.</li>\n<li>Fix the top with <strong>M8</strong> bolts (3x) from above.</li>\n<li>Fix the bottom with <strong>M3x20</strong> bolts (6x) from underneath.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">M8 length</div>\n<p>The picture says M8x25, but the parts list has M8x40 and M8x100. Check your bag.</p>\n</div>", "checks_simple": [], "ts": [26, 0, 54]}, {"stage": 0, "kind": "step", "n": 5, "title": "Result: upper core and lower core joined into one base unit, with…", "img": "Attachments/Arctos/manual/arctos-step-005.png", "html": "<p>Result: upper core and lower core joined into one base unit, with the bolt heads showing on the sides and the bottom. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: upper and lower core joined as one base unit; bolt heads on sides and bottom. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>", "checks_simple": [], "ts": [26, 0, 54]}, {"stage": 0, "kind": "step", "n": 6, "title": "Fit two Bearing 61806 into the center of the core", "img": "Attachments/Arctos/manual/arctos-step-006.png", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>2x <strong>61806</strong> bearings in the centre, the X pulley onto the X pulley shaft with <strong>3x M3x20 + 3x M3 nuts</strong>. Turn the base over, add a third <strong>61806</strong>, then screw on the <strong>X pulley nut</strong>.</p>\n</div>\n<p>Fit two Bearing 61806 into the center of the core. Join the X pulley onto the X pulley shaft with Bolt M3 20mm (drawn: 3) and Nut M3 (drawn: 3). Drop the shaft down through the center bearings; a Nut M5 is also shown loose beside it. Parts: X pulley (2), X pulley shaft. Hardware: Bolt M3 20mm v2, Nut M3 v2, Nut M5 v2, Bearing 61806 (2).</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Tip: the X pulley holes may need drilling out for the M3x20 bolts. After step 8, <strong>give the pulley a few spins</strong>. If it turns unevenly, a bearing is not seated straight: back it off, reseat it, and refit.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>2x <strong>61806</strong> bearings in centre; X pulley onto X pulley shaft with <strong>3x M3x20 + 3x M3 nuts</strong>. Flip base, third <strong>61806</strong>, screw on <strong>X pulley nut</strong>.</p>\n</div>\n<p>Two Bearing 61806 into centre of core. X pulley onto X pulley shaft: Bolt M3 20mm v2 (drawn: 3), Nut M3 v2 (drawn: 3). Drop shaft down through centre bearings; a Nut M5 v2 also shown loose beside it. Parts: X pulley (2), X pulley shaft. Hardware: Bolt M3 20mm v2, Nut M3 v2, Nut M5 v2, Bearing 61806 (2).</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>X pulley holes may need drilling out for M3x20. After step 8, <strong>spin the pulley a few times</strong>; uneven = bearing not seated straight: back off, reseat, refit.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Fit two <strong>61806</strong> bearings into the centre of the core.</li>\n<li>Join the <strong>X pulley</strong> (2) to the <strong>X pulley shaft</strong> with <strong>M3x20</strong> bolts (3x) and <strong>M3 nuts</strong> (3x).</li>\n<li>Drop the shaft down through the centre bearings.</li>\n<li>Keep an <strong>M5 nut</strong> beside it.</li>\n<li>Spin the pulley. It must turn evenly.</li>\n</ol>", "checks_simple": [], "ts": [2, 3, 4, 0]}, {"stage": 0, "kind": "step", "n": 7, "title": "Result: the large X pulley sits on top of the base unit and can turn", "img": "Attachments/Arctos/manual/arctos-step-007.png", "html": "<p>Result: the large X pulley sits on top of the base unit and can turn. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: large X pulley on top of base unit, turns freely. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture. The pulley turns.</p>", "checks_simple": [], "ts": [16, 34, 35, 37, 42]}, {"stage": 0, "kind": "step", "n": 8, "title": "Turn the base upside down", "img": "Attachments/Arctos/manual/arctos-step-008.png", "html": "<p>Turn the base upside down. Put another Bearing 61806 over the threaded end of the shaft, then screw the X pulley nut onto the thread to hold the shaft in place. Parts: X pulley nut. Hardware: Bearing 61806 (3).</p>", "html_pro": "<p>Flip base. Bearing 61806 over threaded shaft end; X pulley nut onto thread to retain shaft. Parts: X pulley nut. Hardware: Bearing 61806 (3).</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the base upside down.</li>\n<li>Put a third <strong>61806</strong> bearing over the threaded end of the shaft.</li>\n<li>Screw the <strong>X pulley nut</strong> onto the thread.</li>\n</ol>", "checks_simple": [], "ts": [2, 3, 4, 0]}, {"stage": 0, "kind": "step", "n": 9, "title": "Result seen from below: the X pulley nut is screwed onto the shaft…", "img": "Attachments/Arctos/manual/arctos-step-009.png", "html": "<p>Result seen from below: the X pulley nut is screwed onto the shaft in the center. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result, from below: X pulley nut on shaft, centre. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>", "checks_simple": [], "ts": [4, 16, 0]}, {"stage": 0, "kind": "step", "n": 10, "title": "Put Nut M5 into the nut slots inside the base", "img": "Attachments/Arctos/manual/arctos-step-010.png", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>M5 nuts in the slots, then the X motor core with <strong>4x M5x20</strong>.</p>\n</div>\n<p>Put Nut M5 into the nut slots inside the base. Slide the X motor CORE (a box-shaped frame) into the side opening of the base and fix it with Bolt M5 20mm (drawn: 4). Parts: X motor CORE. Hardware: Nut M5 v2, Bolt M5 20mm v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Tip: the M5 nuts deep in the motor core are hard to reach. Use a screwdriver extension through the back opening. Blu-Tack on the Allen key holds a nut or bolt in place.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>M5 nuts in slots, then X motor core with <strong>4x M5x20</strong>.</p>\n</div>\n<p>Nut M5 v2 into nut slots inside base. Slide X motor CORE (box-shaped frame) into base side opening; fix with Bolt M5 20mm v2 (drawn: 4). Parts: X motor CORE. Hardware: Nut M5 v2, Bolt M5 20mm v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>M5 nuts deep in motor core are hard to reach: screwdriver extension through back opening. Blu-Tack on Allen key holds nut/bolt.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Put <strong>M5 nuts</strong> into the nut slots inside the base.</li>\n<li>Slide the <strong>X motor CORE</strong> into the side opening of the base.</li>\n<li>Fix it with <strong>M5x20</strong> bolts (4x).</li>\n</ol>", "checks_simple": [], "ts": [4, 71, 33, 0]}, {"stage": 0, "kind": "step", "n": 11, "title": "Result: the X motor CORE box is attached to the side of the base", "img": "Attachments/Arctos/manual/arctos-step-011.png", "html": "<p>Result: the X motor CORE box is attached to the side of the base. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: X motor CORE box attached to base side. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>", "checks_simple": [], "ts": [71, 33, 54]}, {"stage": 0, "kind": "step", "n": 12, "title": "Build the X limit switch holder from three printed pieces", "img": "Attachments/Arctos/manual/arctos-step-012.png", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The X limit holder (3 pieces) clamps round the pulley hub: <strong>2x M3x20 + 2 nuts</strong>, then <strong>2x M3x10</strong>.</p>\n</div>\n<p>Build the X limit switch holder from three printed pieces. Clamp X limit holder 1 and X limit holder 2 together around a ring shape with Bolt M3 20mm (drawn: 2) and Nut M3 (drawn: 2). Then fix X limit holder 3 to holder 2 with Bolt M3 10mm (drawn: 2). Parts: X limit holder 1, X limit holder 2, X limit holder 3. Hardware: Bolt M3 20mm v2, Nut M3 v2, Bolt M3 10mm v2.</p>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>X limit holder (3 pieces) clamps round pulley hub: <strong>2x M3x20 + 2 nuts</strong>, then <strong>2x M3x10</strong>.</p>\n</div>\n<p>Build X limit switch holder from three printed pieces. X limit holder 1 + X limit holder 2 clamped into a ring: Bolt M3 20mm v2 (drawn: 2), Nut M3 v2 (drawn: 2). X limit holder 3 to holder 2: Bolt M3 10mm v2 (drawn: 2). Parts: X limit holder 1, X limit holder 2, X limit holder 3. Hardware: Bolt M3 20mm v2, Nut M3 v2, Bolt M3 10mm v2.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Join <strong>X limit holder 1</strong> and <strong>2</strong> into a ring with <strong>M3x20</strong> bolts (2x) and <strong>M3 nuts</strong> (2x).</li>\n<li>Fix <strong>X limit holder 3</strong> to holder 2 with <strong>M3x10</strong> bolts (2x).</li>\n</ol>", "checks_simple": [], "ts": [4, 16, 58, 59, 61, 64]}, {"stage": 0, "kind": "step", "n": 13, "title": "Result seen from below: the limit holder is clamped around the…", "img": "Attachments/Arctos/manual/arctos-step-013.png", "html": "<p>Result seen from below: the limit holder is clamped around the center hub of the X pulley inside the base. [unclear: exact clamp position is not marked] Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result, from below: limit holder clamped round centre hub of X pulley inside base. [unclear: exact clamp position is not marked] Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>", "checks_simple": [], "ts": [16, 58, 59, 61, 64]}, {"stage": 0, "kind": "step", "n": 14, "title": "On top of the X motor CORE, fit the belt idler", "img": "Attachments/Arctos/manual/arctos-step-014.png", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The GT2 idlers on <strong>M5x20</strong> bolts with an <strong>M3 washer</strong> under each, nuts below. <strong>Add washers so the idler floats.</strong> A clamped idler won't turn. (Unexpected Maker)</p>\n</div>\n<p>On top of the X motor CORE, fit the belt idler. Stack the GT2 idler on a Bolt M5 20mm with an M3 washer under it, push the bolt down through the top plate and hold it with Nut M5 from below. The drawing shows two idler bolts (drawn: 2 bolts, 2 nuts). Parts: none labelled. Hardware: GT2 idler W10 (1), Bolt M5 20mm v2, M3 washer (1), Nut M5 v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Tip: <strong>fit the idlers before the motor.</strong> The idler bearings can clamp and stop turning. Add an M5 washer (or a printed 2 mm washer) above and below so the idler floats.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>GT2 idlers on <strong>M5x20</strong> bolts, <strong>M3 washer</strong> under each, nuts below. <strong>Add washers so the idler floats</strong>; a clamped idler won't turn. (Unexpected Maker)</p>\n</div>\n<p>On top of X motor CORE, fit belt idler: GT2 idler on Bolt M5 20mm v2 with M3 washer under it; bolt down through top plate, Nut M5 v2 from below. Drawing shows two idler bolts (drawn: 2 bolts, 2 nuts). Parts: none labelled. Hardware: GT2 idler W10 (1), Bolt M5 20mm v2, M3 washer (1), Nut M5 v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p><strong>Fit idlers before the motor.</strong> Idler bearings can clamp and stop turning; add an M5 washer (or printed 2 mm washer) above and below so the idler floats.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Stack a <strong>GT2 idler W10</strong> on an <strong>M5x20</strong> bolt with an <strong>M3 washer</strong> under it.</li>\n<li>Push the bolt down through the top plate of the X motor CORE.</li>\n<li>Hold it with an <strong>M5 nut</strong> from below.</li>\n<li>Do this for both idlers.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Idler must float</div>\n<p>Add washers so the idler turns freely. A clamped idler will not turn.</p>\n</div>", "checks_simple": [], "ts": [2, 3, 4, 28, 30, 29]}, {"stage": 0, "kind": "info", "key": "b-intro", "title": "Before step 15: set up the X driver", "img": "Attachments/Arctos/arctos-encoder_bolts_table_labelled_MKS_config_on_docs.jpg", "html": "<p>You <strong>wire as you go</strong>. Each motor's driver is set up on the table <strong>right before that motor goes in</strong>, then wired into the arm before the step that closes it in.</p>\n<p>The X motor is first: step 15 fits its driver, so set it up now. Power it straight from the supply for this bench setup.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Axis</th>\n<th>Motor</th>\n<th>Driver</th>\n<th>Encoder bolts</th>\n<th>CAN ID</th>\n<th>Limit sensors</th>\n<th>42D remap</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>X</td>\n<td>NEMA 23</td>\n<td>SERVO57D</td>\n<td>M3x65</td>\n<td>1</td>\n<td>1x WSH231</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Y</td>\n<td>NEMA 23</td>\n<td>SERVO57D</td>\n<td>M3x65</td>\n<td>2</td>\n<td>2x KY-003, Back = home</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Z</td>\n<td>NEMA 17, 60 mm</td>\n<td>SERVO42D</td>\n<td>M3x65</td>\n<td>3</td>\n<td>2x KY-003, Front = home</td>\n<td><code>03 9E 01 A2</code></td>\n</tr>\n<tr>\n<td>A</td>\n<td>NEMA 17, 34 mm</td>\n<td>SERVO42D</td>\n<td>M3x40 (test-fit)</td>\n<td>4</td>\n<td>1x WSH231</td>\n<td><code>04 9E 01 A3</code></td>\n</tr>\n<tr>\n<td>B</td>\n<td>NEMA 17, 23 mm</td>\n<td>SERVO42D</td>\n<td>M3x25</td>\n<td>5</td>\n<td>2x KY-003, Top = home</td>\n<td><code>05 9E 01 A4</code></td>\n</tr>\n<tr>\n<td>C</td>\n<td>NEMA 17, 23 mm</td>\n<td>SERVO42D</td>\n<td>M3x25</td>\n<td>6</td>\n<td>1x WSH231</td>\n<td><code>06 9E 01 A5</code></td>\n</tr>\n<tr>\n<td>Gripper</td>\n<td>DS3225 servo</td>\n<td>Nano + MCP2515</td>\n<td>–</td>\n<td>7</td>\n<td>–</td>\n<td>–</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Label</strong> each motor and its driver with a marker: the axis letter and the CAN ID.</li>\n<li>Keep this table next to you. You need it at every joint.</li>\n</ol>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": [], "html_pro": "<p><strong>Wire as you go</strong>: set up each driver on the table <strong>right before its motor goes in</strong>; wire it into the arm before the step that closes it in.</p>\n<p>X first: step 15 fits its driver. Bench-power it straight from the supply.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Axis</th>\n<th>Motor</th>\n<th>Driver</th>\n<th>Encoder bolts</th>\n<th>CAN ID</th>\n<th>Limit sensors</th>\n<th>42D remap</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>X</td>\n<td>NEMA 23</td>\n<td>SERVO57D</td>\n<td>M3x65</td>\n<td>1</td>\n<td>1x WSH231</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Y</td>\n<td>NEMA 23</td>\n<td>SERVO57D</td>\n<td>M3x65</td>\n<td>2</td>\n<td>2x KY-003, Back = home</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Z</td>\n<td>NEMA 17, 60 mm</td>\n<td>SERVO42D</td>\n<td>M3x65</td>\n<td>3</td>\n<td>2x KY-003, Front = home</td>\n<td><code>03 9E 01 A2</code></td>\n</tr>\n<tr>\n<td>A</td>\n<td>NEMA 17, 34 mm</td>\n<td>SERVO42D</td>\n<td>M3x40 (test-fit)</td>\n<td>4</td>\n<td>1x WSH231</td>\n<td><code>04 9E 01 A3</code></td>\n</tr>\n<tr>\n<td>B</td>\n<td>NEMA 17, 23 mm</td>\n<td>SERVO42D</td>\n<td>M3x25</td>\n<td>5</td>\n<td>2x KY-003, Top = home</td>\n<td><code>05 9E 01 A4</code></td>\n</tr>\n<tr>\n<td>C</td>\n<td>NEMA 17, 23 mm</td>\n<td>SERVO42D</td>\n<td>M3x25</td>\n<td>6</td>\n<td>1x WSH231</td>\n<td><code>06 9E 01 A5</code></td>\n</tr>\n<tr>\n<td>Gripper</td>\n<td>DS3225 servo</td>\n<td>Nano + MCP2515</td>\n<td>–</td>\n<td>7</td>\n<td>–</td>\n<td>–</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Label</strong> motor and driver with marker: axis letter and CAN ID.</li>\n<li>Keep this table at hand for every joint.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Set up the X driver now, before step 15.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Axis</th>\n<th>Motor</th>\n<th>Driver</th>\n<th>Encoder bolts</th>\n<th>CAN ID</th>\n<th>Limit sensors</th>\n<th>42D remap</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>X</td>\n<td>NEMA 23</td>\n<td>SERVO57D</td>\n<td>M3x65</td>\n<td>1</td>\n<td>1x WSH231</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Y</td>\n<td>NEMA 23</td>\n<td>SERVO57D</td>\n<td>M3x65</td>\n<td>2</td>\n<td>2x KY-003, Back = home</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Z</td>\n<td>NEMA 17, 60 mm</td>\n<td>SERVO42D</td>\n<td>M3x65</td>\n<td>3</td>\n<td>2x KY-003, Front = home</td>\n<td><code>03 9E 01 A2</code></td>\n</tr>\n<tr>\n<td>A</td>\n<td>NEMA 17, 34 mm</td>\n<td>SERVO42D</td>\n<td>M3x40 (test-fit)</td>\n<td>4</td>\n<td>1x WSH231</td>\n<td><code>04 9E 01 A3</code></td>\n</tr>\n<tr>\n<td>B</td>\n<td>NEMA 17, 23 mm</td>\n<td>SERVO42D</td>\n<td>M3x25</td>\n<td>5</td>\n<td>2x KY-003, Top = home</td>\n<td><code>05 9E 01 A4</code></td>\n</tr>\n<tr>\n<td>C</td>\n<td>NEMA 17, 23 mm</td>\n<td>SERVO42D</td>\n<td>M3x25</td>\n<td>6</td>\n<td>1x WSH231</td>\n<td><code>06 9E 01 A5</code></td>\n</tr>\n<tr>\n<td>Gripper</td>\n<td>DS3225 servo</td>\n<td>Nano + MCP2515</td>\n<td>–</td>\n<td>7</td>\n<td>–</td>\n<td>–</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li>Label each motor and driver with its axis letter and CAN ID.</li>\n<li>Keep this table next to you.</li>\n</ol>", "checks_simple": [], "ts": [58, 59, 61, 64, 71, 33]}, {"stage": 0, "kind": "wire", "key": "b-coils", "title": "Find the coil pairs", "img": null, "html": "<p>A stepper motor has <strong>2 coils</strong> and <strong>4 wires</strong>.</p>\n<p><strong>Why measure:</strong> one coil must go on A, the other on B. Mixed up, the motor won't calibrate. Colours differ between makers, so the meter tells you which two wires belong together.</p>\n<ol>\n<li><strong>Power off. Motor wires not in the driver.</strong> Measure on the motor alone.</li>\n<li>Set the multimeter to ohms (the 200 Ω range).</li>\n<li>Meter leads: black in <strong>COM</strong>, red in <strong>VΩ</strong>.</li>\n<li><strong>Each probe on a different motor wire</strong>, never both on the same one. Red probe on the bare tip of the <strong>green</strong> wire, black probe on the bare tip of the <strong>black</strong> wire. (If the motor has a plug, touch two of its pins.) A coil reads <strong>a few ohms</strong>.</li>\n<li>Do the same with <strong>blue and red</strong>. A wire from one coil to a wire of the other (for example green to blue) reads nothing (\"OL\" or \"1\").</li>\n<li>The coil must read <strong>under 10 Ω</strong>, or the MKS driver can't calibrate the motor.</li>\n<li>Mark the two pairs with tape.</li>\n</ol>\n<p>Other way: touch two wires together and turn the shaft. If it gets <strong>harder to turn</strong>, those two wires are one coil.</p>\n<p>Official Arctos diagram: <strong>A+ green, A− black, B+ blue, B− red</strong>. So coil 1 = green + black, coil 2 = blue + red.</p>\n<p>The two wires of one coil must stay on the same pair (A or B). Inside a pair the order doesn't matter: swapped, the motor only turns the other way, and you flip that in software.</p>\n<div class=\"callout note\">\n<div class=\"callout-title\">Colours change between makers</div>\n<p>Always measure yours.</p>\n</div>\n<p>You need only the motor and the meter here. No CANable, no limit sensors yet.</p>", "ov": null, "bench": ["coil", "meter"], "drv": "57D", "grip": null, "conn": [["Coil 1: green wire", "A+", "grn", "official diagram"], ["Coil 1: black wire", "A−", "blk", ""], ["Coil 2: blue wire", "B+", "blu", ""], ["Coil 2: red wire", "B−", "red", "check pairs with the meter"]], "checks": [], "html_pro": "<p><strong>Why:</strong> one coil goes on A, the other on B. Mixed up, the motor won't calibrate. Colours differ between makers, so the meter shows which two wires belong together.</p>\n<p>Stepper: <strong>2 coils</strong>, <strong>4 wires</strong>.</p>\n<ol>\n<li>Power off; motor wires out of the driver. Measure the motor alone.</li>\n<li>Multimeter to ohms (200 Ω range).</li>\n<li>Leads: black in COM, red in VΩ.</li>\n<li>One probe on each of <strong>two different motor wires</strong> (bare tips, or two pins of the motor plug): green to black, then blue to red. A coil reads <strong>a few ohms</strong>; wires from different coils read open (\"OL\").</li>\n<li>Coil must read <strong>under 10 Ω</strong>, or the MKS driver can't calibrate the motor.</li>\n<li>Tape-mark the two pairs.</li>\n</ol>\n<p>Alternative: short two wires together and turn the shaft; <strong>harder to turn</strong> = same coil.</p>\n<p>Official Arctos diagram: <strong>A+ green, A− black, B+ blue, B− red</strong> (coil 1 = green + black, coil 2 = blue + red). Each coil stays on its own pair; swapping the two wires inside a pair only reverses the direction (flip it in software).</p>\n<div class=\"callout note\">\n<div class=\"callout-title\">Colours vary by maker</div>\n<p>Always measure.</p>\n</div>", "checks_pro": [], "html_simple": "<p><strong>Why:</strong> one coil goes on A, the other on B. Mixed up, the motor won't calibrate. Colours differ between makers, so the meter shows which two wires belong together.</p>\n<ol>\n<li><strong>Power off. Motor wires not in the driver.</strong></li>\n<li>Set the multimeter to ohms (200 Ω range).</li>\n<li>Meter leads: black in <strong>COM</strong>, red in <strong>VΩ</strong>.</li>\n<li><strong>One probe on each of two different motor wires</strong>, not the same spot: red probe on the bare tip of the <strong>green</strong> wire, black probe on the <strong>black</strong> wire. A coil reads a few ohms.</li>\n<li>Do the same with <strong>blue and red</strong>. Green to blue reads nothing (\"OL\").</li>\n<li>Each coil must read <strong>under 10 Ω</strong>.</li>\n<li>Mark the two pairs with tape.</li>\n</ol>\n<p>Official diagram: <strong>A+ green, A− black, B+ blue, B− red</strong>. Measure to be sure.</p>\n<p>Keep each coil on its own pair (A or B). Inside a pair the order doesn't matter: swapped, the motor only turns the other way (fix it in software).</p>\n<p>You need only the motor and the meter. No CANable, no sensors yet.</p>", "checks_simple": [], "ts": [7, 11, 58, 59, 61, 64]}, {"stage": 0, "kind": "info", "key": "b-magnet", "title": "Glue the magnet, fit the driver", "img": "Attachments/Arctos/manual/arctos-step-015.png", "html": "<ol>\n<li><strong>Glue the encoder magnet</strong> to the centre of the shaft end with superglue. Let it dry fully.</li>\n<li><strong>Fit the MKS driver</strong> to the back of the motor with the encoder bolts from the table (M3x65, M3x40 or M3x25), plus washers.</li>\n<li>Seat the thermal pads.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Off-centre magnet = calibration errors</div>\n<p>The driver reads the magnet to know the shaft angle. It must be centred and close to the chip.</p>\n</div>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": [], "html_pro": "<ol>\n<li><strong>Glue encoder magnet</strong> to centre of shaft end, superglue. Dry fully.</li>\n<li><strong>Fit MKS driver</strong> to motor back: encoder bolts from table (M3x65, M3x40 or M3x25) plus washers.</li>\n<li>Seat thermal pads.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Off-centre magnet = calibration errors</div>\n<p>Driver reads the magnet for shaft angle. Centred, close to the chip.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Superglue the <strong>encoder magnet</strong> to the centre of the shaft end. Let it dry.</li>\n<li>Fit the <strong>MKS driver</strong> to the motor back with the encoder bolts (M3x65, M3x40 or M3x25, see table), plus washers.</li>\n<li>Seat the thermal pads.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Magnet centred</div>\n<p>An off-centre magnet causes calibration errors.</p>\n</div>", "checks_simple": [], "ts": [62, 54, 63, 71, 33, 26]}, {"stage": 0, "kind": "wire", "key": "b-wirecoils", "title": "Wire the coils", "img": null, "html": "<ol>\n<li><strong>Green → A+, black → A−, blue → B+, red → B−</strong> (official diagram). Use the pairs you measured.</li>\n<li>The order inside a coil doesn't matter. If the motor turns the wrong way later, flip it in software.</li>\n<li>Use <strong>bare twisted strands</strong>. <strong>No tinning, no ferrules</strong> in the small MKS terminals. Ferrules snapped off inside them.</li>\n<li>Twist the strands so no single strand sticks out.</li>\n<li>Add a zip tie as strain relief. Stepper leads snap at the motor.</li>\n</ol>", "ov": null, "bench": ["coil"], "drv": "57D", "grip": null, "conn": [["Green wire", "A+", "grn", "coil 1"], ["Black wire", "A−", "blk", "coil 1"], ["Blue wire", "B+", "blu", "coil 2"], ["Red wire", "B−", "red", "coil 2"]], "checks": [], "html_pro": "<ol>\n<li><strong>Green → A+, black → A−, blue → B+, red → B−</strong> (official diagram; the pairs you measured).</li>\n<li>Order within a coil is irrelevant; reverse direction later in software.</li>\n<li><strong>Bare twisted strands. No tinning, no ferrules</strong> in the small MKS terminals; ferrules snapped off inside.</li>\n<li>Twist so no strand sticks out.</li>\n<li>Zip tie as strain relief; stepper leads snap at the motor.</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li><strong>Green → A+, black → A−, blue → B+, red → B−</strong> (the pairs you measured).</li>\n<li>Use bare twisted strands. No tinning, no ferrules.</li>\n<li>Add a zip tie as strain relief.</li>\n</ol>", "checks_simple": [], "ts": [71, 33, 69, 70, 53, 54]}, {"stage": 0, "kind": "wire", "key": "b-power", "title": "Power the driver", "img": null, "html": "<ol>\n<li>Use 12–24 V.</li>\n<li><strong>Check the polarity with a meter first.</strong> Red = +, black = −.</li>\n<li>Connect + to <strong>V+</strong> and − to <strong>Gnd</strong> on the driver's power terminal.</li>\n<li>Switch on. The screen should light.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">A reversed supply destroys the driver</div>\n<p>Check it three times. It can't be repaired.</p>\n</div>", "ov": null, "bench": ["pwr"], "drv": "57D", "grip": null, "conn": [["Supply +", "V+", "red", "12–24 V"], ["Supply −", "Gnd", "blk", ""]], "checks": [], "html_pro": "<ol>\n<li>12–24 V.</li>\n<li><strong>Check polarity with a meter first.</strong> Red = +, black = −.</li>\n<li>\n<ul>\n<li>to <strong>V+</strong>, − to <strong>Gnd</strong> on the driver's power terminal.</li>\n</ul>\n</li>\n<li>Switch on; screen should light.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Reversed supply destroys the driver</div>\n<p>Check three times. Not repairable.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Use 12–24 V.</li>\n<li>Check polarity with a meter. Red = +, black = −.</li>\n<li>Connect + to <strong>V+</strong> and − to <strong>Gnd</strong>.</li>\n<li>Switch on. The screen lights.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Reversed power</div>\n<p>A reversed supply destroys the driver.</p>\n</div>", "checks_simple": [], "ts": [34, 35, 37, 42, 67, 66]}, {"stage": 0, "kind": "info", "key": "b-cal", "title": "Calibrate, then set the menu", "img": null, "html": "<ol>\n<li>With <strong>nothing on the shaft</strong>, choose <strong>Cal</strong> in the menu. Wait for \"success\".</li>\n<li>Set the menu:</li>\n</ol>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Setting</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Mode</td>\n<td>SR_vFOC</td>\n</tr>\n<tr>\n<td>Ma (current)</td>\n<td>X, Y: 3200 mA (the 57D default). Z: about 1600 mA. A: about 1300 mA. B, C: about 1200 mA</td>\n</tr>\n<tr>\n<td>HoldMa</td>\n<td>50 %</td>\n</tr>\n<tr>\n<td>MStep</td>\n<td>16</td>\n</tr>\n<tr>\n<td>CanRate</td>\n<td>500K</td>\n</tr>\n<tr>\n<td>CanID</td>\n<td>from the table (X 1 … C 6)</td>\n</tr>\n<tr>\n<td>CanRSP</td>\n<td>On</td>\n</tr>\n<tr>\n<td>HmTrig</td>\n<td>Low</td>\n</tr>\n<tr>\n<td>HmDir</td>\n<td>CW</td>\n</tr>\n<tr>\n<td>HmSpeed</td>\n<td>60</td>\n</tr>\n<tr>\n<td>EndLimit</td>\n<td>On</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Current</div>\n<p>The A, B and C motors are rated lower. Don't leave them on the 1600 mA 42D default. A motor should never be too hot to touch.</p>\n</div>\n<p>Full details: <a class=\"wl\" href=\"#/mks/3-menu-settings\">MKS Driver Setup › 3. Menu settings</a>.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": [], "html_pro": "<ol>\n<li><strong>Nothing on the shaft</strong>; menu <strong>Cal</strong>; wait for \"success\".</li>\n<li>Set menu:</li>\n</ol>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Setting</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Mode</td>\n<td>SR_vFOC</td>\n</tr>\n<tr>\n<td>Ma</td>\n<td>X, Y: 3200 mA (the 57D default). Z: about 1600 mA. A: about 1300 mA. B, C: about 1200 mA</td>\n</tr>\n<tr>\n<td>HoldMa</td>\n<td>50 %</td>\n</tr>\n<tr>\n<td>MStep</td>\n<td>16</td>\n</tr>\n<tr>\n<td>CanRate</td>\n<td>500K</td>\n</tr>\n<tr>\n<td>CanID</td>\n<td>from the table (X 1 … C 6)</td>\n</tr>\n<tr>\n<td>CanRSP</td>\n<td>On</td>\n</tr>\n<tr>\n<td>HmTrig</td>\n<td>Low</td>\n</tr>\n<tr>\n<td>HmDir</td>\n<td>CW</td>\n</tr>\n<tr>\n<td>HmSpeed</td>\n<td>60</td>\n</tr>\n<tr>\n<td>EndLimit</td>\n<td>On</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Current</div>\n<p>A, B, C rated lower: don't leave them on the 1600 mA default. Motor must never be too hot to touch.</p>\n</div>\n<p>Full details: <a class=\"wl\" href=\"#/mks/3-menu-settings\">MKS Driver Setup › 3. Menu settings</a>.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>With nothing on the shaft, choose <strong>Cal</strong>. Wait for \"success\".</li>\n<li>Set the menu:</li>\n</ol>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Setting</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Mode</td>\n<td>SR_vFOC</td>\n</tr>\n<tr>\n<td>Ma</td>\n<td>X, Y 3200 mA. Z 1600. A 1300. B, C 1200</td>\n</tr>\n<tr>\n<td>HoldMa</td>\n<td>50 %</td>\n</tr>\n<tr>\n<td>MStep</td>\n<td>16</td>\n</tr>\n<tr>\n<td>CanRate</td>\n<td>500K</td>\n</tr>\n<tr>\n<td>CanID</td>\n<td>from the table (X 1 … C 6)</td>\n</tr>\n<tr>\n<td>CanRSP</td>\n<td>On</td>\n</tr>\n<tr>\n<td>HmTrig</td>\n<td>Low</td>\n</tr>\n<tr>\n<td>HmDir</td>\n<td>CW</td>\n</tr>\n<tr>\n<td>HmSpeed</td>\n<td>60</td>\n</tr>\n<tr>\n<td>EndLimit</td>\n<td>On</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Current</div>\n<p>A motor must never get too hot to touch.</p>\n</div>", "checks_simple": [], "ts": [58, 59, 61, 64, 71, 33]}, {"stage": 0, "kind": "wire", "key": "b-dip", "title": "57D only (X, Y): DIP switches", "img": "Attachments/Arctos/arctos-mks_port_remap_limit_switches.png", "html": "<ol>\n<li>On the SERVO57D, set DIP switches <strong>2 and 3 ON</strong>.</li>\n<li>Leave switch <strong>1 OFF</strong>.</li>\n<li>Switches 2 and 3 power the limit sensors.</li>\n</ol>\n<p>Skip this card for the 42D drivers (Z, A, B, C).</p>", "ov": null, "bench": ["dip"], "drv": "57D", "grip": null, "conn": null, "checks": [], "html_pro": "<ol>\n<li>SERVO57D: DIP switches <strong>2 and 3 ON</strong>.</li>\n<li>Switch <strong>1 OFF</strong>.</li>\n<li>Switches 2 and 3 power the limit sensors.</li>\n</ol>\n<p>Skip for the 42D drivers (Z, A, B, C).</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Set DIP switches <strong>2 and 3 ON</strong>.</li>\n<li>Leave switch <strong>1 OFF</strong>.</li>\n</ol>\n<p>Skip this for Z, A, B, C.</p>", "checks_simple": [], "ts": [58, 59, 61, 64, 79, 80]}, {"stage": 0, "kind": "wire", "key": "b-can", "title": "Connect the CANable (one driver at a time)", "img": null, "html": "<ol>\n<li>Plug the CANable into the computer with USB.</li>\n<li><strong>Put the jumper on the CANable's \"120R\" header.</strong></li>\n<li>Connect <strong>CAN H to CAN H</strong> and <strong>CAN L to CAN L</strong>. <strong>Read the labels printed on each board.</strong> Don't trust wire colours or old diagrams.</li>\n<li>For this bench test, put a <strong>120 Ω resistor across H and L</strong> at the driver end.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">The early-2024 diagram had H and L swapped</div>\n<p>With H and L swapped, the motor holds but won't move.</p>\n</div>", "ov": null, "bench": ["can", "r120"], "drv": "57D", "grip": null, "conn": [["CANable CAN H", "driver CAN H", "yel", "check the printed labels"], ["CANable CAN L", "driver CAN L", "grn", ""], ["120R jumper", "on the CANable", "wht", "end 1"], ["120 Ω resistor", "H–L at the driver", "wht", "bench only"]], "checks": [], "html_pro": "<ol>\n<li>CANable to computer by USB.</li>\n<li><strong>Jumper on CANable \"120R\" header.</strong></li>\n<li><strong>CAN H to CAN H, CAN L to CAN L.</strong> <strong>Go by the labels printed on each board</strong>, not wire colours or old diagrams.</li>\n<li>Bench test: <strong>120 Ω resistor across H and L</strong> at the driver end.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Early-2024 diagram had H and L swapped</div>\n<p>Swapped H/L: motor holds but won't move.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Plug the CANable into the computer by USB.</li>\n<li>Put the jumper on the <strong>120R</strong> header.</li>\n<li>Connect <strong>CAN H to CAN H</strong> and <strong>CAN L to CAN L</strong>. Read the board labels.</li>\n<li>Put a <strong>120 Ω</strong> resistor across H and L at the driver end.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">H and L swapped</div>\n<p>The motor holds but will not move.</p>\n</div>", "checks_simple": [], "ts": [71, 33, 69, 70, 53, 34]}, {"stage": 0, "kind": "wire", "key": "b-sensor", "title": "Plug in the limit sensor(s) and test them", "img": "Attachments/Arctos/arctos-endstop_testing_setup.png", "html": "<ol>\n<li>Plug this axis's sensor(s) in on short test leads.\n   - 57D (X, Y): <strong>IN_1 = home</strong>, IN_2 = the other limit.\n   - 42D (Z, A, B, C): En = limit 1, Dir = limit 2.</li>\n<li>The sensors get <strong>5 V from the driver</strong>, so the driver must be on.</li>\n<li>Hold a magnet at each sensor. Its LED lights.</li>\n<li><strong>Mark which magnet face lights the LED.</strong> The sensors only see one pole.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Sensor red wire = 5 V from the driver</div>\n<p>Never put a sensor's red wire into the 12/24 V Wago. It burns out the sensor.</p>\n</div>", "ov": null, "bench": ["lim", "sensor"], "drv": "57D", "grip": null, "conn": [["Sensor +", "driver 5 V out", "red", "5 V, not 24 V"], ["Sensor −", "driver GND", "blk", ""], ["Sensor S (home)", "IN_1 (57D) / En (42D)", "blu", ""], ["Sensor S (2nd)", "IN_2 (57D) / Dir (42D)", "blu", "if the axis has two"]], "checks": [], "html_pro": "<ol>\n<li>Plug this axis's sensor(s) in on short test leads.\n   - 57D (X, Y): <strong>IN_1 = home</strong>, IN_2 = other limit.\n   - 42D (Z, A, B, C): En = limit 1, Dir = limit 2.</li>\n<li>Sensors take <strong>5 V from the driver</strong>; driver must be on.</li>\n<li>Hold a magnet at each sensor; LED lights.</li>\n<li><strong>Mark which magnet face lights the LED.</strong> Sensors see one pole only.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Sensor red wire = 5 V from the driver</div>\n<p>Never to the 12/24 V Wago. Burns out the sensor.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Plug the sensor(s) in on short test leads.\n   - 57D (X, Y): <strong>IN_1 = home</strong>, IN_2 = other limit.\n   - 42D (Z, A, B, C): En = limit 1, Dir = limit 2.</li>\n<li>Keep the driver on.</li>\n<li>Hold a magnet at each sensor. Its LED lights.</li>\n<li>Mark which magnet face lights the LED.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Sensor red wire</div>\n<p>Never put it in the 12/24 V Wago. It burns the sensor.</p>\n</div>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 0, "kind": "test", "key": "b-test", "title": "Test the X driver before it goes in", "img": null, "html": "<ol>\n<li>Send read encoder (<code>31</code>). Turn the shaft. Read it again: the number changes.</li>\n<li>Send home (<code>91</code>). Trigger the home sensor with the magnet by hand. The motor must stop.</li>\n<li><strong>Photograph</strong> the screen and the wiring. Write the settings on a card.</li>\n</ol>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["It says \"Cal success\" and keeps its settings after a power cycle.", "It answers on its own ID (X = 1).", "The sensor lights with its marked magnet face.", "It stops on its home sensor."], "html_pro": "<ol>\n<li>Send read encoder (<code>31</code>); turn shaft; read again: value changes.</li>\n<li>Send home (<code>91</code>); trigger home sensor by hand with magnet: motor must stop.</li>\n<li><strong>Photograph</strong> screen and wiring; write settings on a card.</li>\n</ol>", "checks_pro": ["\"Cal success\"; settings persist after power cycle.", "Answers on its own ID (X = 1).", "Sensor lights with its marked magnet face.", "Stops on its home sensor."], "html_simple": "<ol>\n<li>Send read encoder (<code>31</code>). Turn the shaft. Read again. The number changes.</li>\n<li>Send home (<code>91</code>). Trigger the home sensor with the magnet. The motor stops.</li>\n<li>Photograph the screen and wiring. Write the settings on a card.</li>\n</ol>", "checks_simple": ["Cal success, settings kept after power cycle.", "Answers on its own ID (X = 1).", "Sensor lights on marked magnet face.", "Stops on its home sensor."], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 0, "kind": "step", "n": 15, "title": "Put Pulley GT2W10B6.35 on the shaft of the Nema 23 stepper motor", "img": "Attachments/Arctos/manual/arctos-step-015.png", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The GT2W10 pulley on the NEMA 23 shaft. The motor goes up into the X motor core from below. It uses <strong>M5x20 bolts from below and M5 nuts on top</strong>. The picture shows 2 bolts and 3 nuts, but the NEMA 23 has 4 holes: use 4 of each. (unsure: the hidden ones are not drawn)</p>\n</div>\n<p>Put Pulley GT2W10B6.35 on the shaft of the Nema 23 stepper motor. Fix the MKS Servo 57D driver to the back of the motor, with the encoder magnet on the end of the motor shaft (red arrow). Push the motor up into the X motor CORE so the pulley comes out on top, and fix it with Bolt M5 20mm (drawn: 2) from below and Nut M5 on top (drawn: 3). Parts: Nema 23 stepper motor, MKS Servo 57D. Hardware: Pulley GT2W10B6.35 (1), Nut M5 v2, Bolt M5 20mm v2, encoder magnet. Note: \"encoder magnet\" / \"Detailed video about wiring the encoder can be found on youtube\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p><strong>Before this step:</strong> set up the MKS 57D on the bench (CAN ID <strong>01</strong>), glue the encoder magnet on the shaft, and wire the motor. See <a class=\"wl\" href=\"#/mks\">MKS Driver Setup</a>. The motor bolts with 3x M5x20, wires facing the pulley. Don't fully tighten the pulley set screw yet.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>GT2W10 pulley on NEMA 23 shaft. Motor goes up into X motor core from below: <strong>M5x20 bolts from below, M5 nuts on top</strong>. Picture shows 2 bolts and 3 nuts, but NEMA 23 has 4 holes: use 4 of each. (unsure: the hidden ones are not drawn)</p>\n</div>\n<p>Pulley GT2W10B6.35 on Nema 23 stepper shaft. MKS Servo 57D driver on motor back, encoder magnet on shaft end (red arrow). Push motor up into X motor CORE, pulley out on top; Bolt M5 20mm v2 from below (drawn: 2), Nut M5 v2 on top (drawn: 3). Parts: Nema 23 stepper motor, MKS Servo 57D. Hardware: Pulley GT2W10B6.35 (1), Nut M5 v2, Bolt M5 20mm v2, encoder magnet. Note: \"encoder magnet\" / \"Detailed video about wiring the encoder can be found on youtube\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p><strong>Before this step:</strong> bench-set up MKS 57D (CAN ID <strong>01</strong>), glue encoder magnet on shaft, wire motor. See <a class=\"wl\" href=\"#/mks\">MKS Driver Setup</a>. Motor bolts with 3x M5x20, wires facing pulley. Pulley set screw not fully tight yet.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>GT2W10B6.35</strong> pulley on the <strong>Nema 23</strong> motor shaft. Do not tighten the set screw yet.</li>\n<li>Fix the <strong>MKS Servo 57D</strong> (CAN ID <strong>01</strong>) to the motor back, magnet on the shaft end.</li>\n<li>Push the motor up into the <strong>X motor CORE</strong>, pulley on top.</li>\n<li>Fix it with <strong>M5x20</strong> bolts (4x) from below and <strong>M5 nuts</strong> (4x) on top.</li>\n</ol>", "checks_simple": [], "ts": [4, 28, 30, 62, 54, 63]}, {"stage": 0, "kind": "wire", "key": "h-plan", "title": "The four wires that run up the arm", "img": "Attachments/Arctos/arctos-closed_loop_wiring_diagram.png", "html": "<p>At every joint, <strong>four wires go in and four go on</strong> to the next joint:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Wire</th>\n<th>Colour</th>\n<th>Goes to</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>+V (12 or 24 V)</td>\n<td>red</td>\n<td>V+ on each driver</td>\n</tr>\n<tr>\n<td>GND</td>\n<td>black</td>\n<td>Gnd on each driver</td>\n</tr>\n<tr>\n<td>CAN H</td>\n<td>yellow</td>\n<td>CAN H on each driver</td>\n</tr>\n<tr>\n<td>CAN L</td>\n<td>green</td>\n<td>CAN L on each driver</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>Join them at each joint with <strong>Wago lever connectors</strong>: one Wago per wire. Port 1 comes in, port 2 goes to this driver, port 3 goes on up.</li>\n<li>The CAN wires that come with the MKS drivers are fine for the whole robot.</li>\n<li><strong>Limit sensor wires go only to their own driver.</strong> They never join the Wagos.</li>\n</ul>\n<p>The diagram above lights up as you wire. Grey parts are not wired yet.</p>", "ov": ["*"], "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": [], "html_pro": "<p>Each joint: <strong>4 wires in, 4 on</strong> to the next joint.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Wire</th>\n<th>Colour</th>\n<th>Goes to</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>+V (12 or 24 V)</td>\n<td>red</td>\n<td>V+ on
