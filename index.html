y>\n<tr>\n<td>X</td>\n<td>NEMA 23</td>\n<td>SERVO57D</td>\n<td>M3x65</td>\n<td>1</td>\n<td>1x WSH231</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Y</td>\n<td>NEMA 23</td>\n<td>SERVO57D</td>\n<td>M3x65</td>\n<td>2</td>\n<td>2x KY-003, Back = home</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Z</td>\n<td>NEMA 17, 60 mm</td>\n<td>SERVO42D</td>\n<td>M3x65</td>\n<td>3</td>\n<td>2x KY-003, Front = home</td>\n<td><code>03 9E 01 A2</code></td>\n</tr>\n<tr>\n<td>A</td>\n<td>NEMA 17, 34 mm</td>\n<td>SERVO42D</td>\n<td>M3x40 (test-fit)</td>\n<td>4</td>\n<td>1x WSH231</td>\n<td><code>04 9E 01 A3</code></td>\n</tr>\n<tr>\n<td>B</td>\n<td>NEMA 17, 23 mm</td>\n<td>SERVO42D</td>\n<td>M3x25</td>\n<td>5</td>\n<td>2x KY-003, Top = home</td>\n<td><code>05 9E 01 A4</code></td>\n</tr>\n<tr>\n<td>C</td>\n<td>NEMA 17, 23 mm</td>\n<td>SERVO42D</td>\n<td>M3x25</td>\n<td>6</td>\n<td>1x WSH231</td>\n<td><code>06 9E 01 A5</code></td>\n</tr>\n<tr>\n<td>Gripper</td>\n<td>DS3225 servo</td>\n<td>Nano + MCP2515</td>\n<td>–</td>\n<td>7</td>\n<td>–</td>\n<td>–</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Label</strong> motor and driver with marker: axis letter and CAN ID.</li>\n<li>Keep this table at hand for every joint.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Set up each driver on the table right before its motor goes in. X is first.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Axis</th>\n<th>Motor</th>\n<th>Driver</th>\n<th>Encoder bolts</th>\n<th>CAN ID</th>\n<th>Limit sensors</th>\n<th>42D remap</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>X</td>\n<td>NEMA 23</td>\n<td>SERVO57D</td>\n<td>M3x65</td>\n<td>1</td>\n<td>one WSH231</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Y</td>\n<td>NEMA 23</td>\n<td>SERVO57D</td>\n<td>M3x65</td>\n<td>2</td>\n<td>two KY-003, Back = home</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Z</td>\n<td>NEMA 17, 60 mm</td>\n<td>SERVO42D</td>\n<td>M3x65</td>\n<td>3</td>\n<td>two KY-003, Front = home</td>\n<td><code>03 9E 01 A2</code></td>\n</tr>\n<tr>\n<td>A</td>\n<td>NEMA 17, 34 mm</td>\n<td>SERVO42D</td>\n<td>M3x40 (test-fit)</td>\n<td>4</td>\n<td>one WSH231</td>\n<td><code>04 9E 01 A3</code></td>\n</tr>\n<tr>\n<td>B</td>\n<td>NEMA 17, 23 mm</td>\n<td>SERVO42D</td>\n<td>M3x25</td>\n<td>5</td>\n<td>two KY-003, Top = home</td>\n<td><code>05 9E 01 A4</code></td>\n</tr>\n<tr>\n<td>C</td>\n<td>NEMA 17, 23 mm</td>\n<td>SERVO42D</td>\n<td>M3x25</td>\n<td>6</td>\n<td>one WSH231</td>\n<td><code>06 9E 01 A5</code></td>\n</tr>\n<tr>\n<td>Gripper</td>\n<td>DS3225 servo</td>\n<td>Nano + MCP2515</td>\n<td>–</td>\n<td>7</td>\n<td>–</td>\n<td>–</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li>Label each motor and its driver with the axis letter and the CAN ID.</li>\n<li>Keep this table next to you.</li>\n</ol>", "checks_simple": [], "ts": [87, 91, 58, 59, 61, 64]}, {"stage": 0, "kind": "test", "key": "b-coils", "title": "Find the coil pairs", "img": null, "html": "<p>A stepper motor has <strong>2 coils</strong> and <strong>4 wires</strong>.</p>\n<ol>\n<li><strong>Power off. The 4 motor wires not in the driver terminals.</strong> The magnet and the driver can already be on the motor.</li>\n<li>Set the multimeter to ohms (the 200 Ω range).</li>\n<li>Meter leads: black in <strong>COM</strong>, red in <strong>VΩ</strong>.</li>\n<li><strong>Each probe on a different motor wire</strong>, never both on the same one. Red probe on the bare tip of the <strong>green</strong> wire, black probe on the bare tip of the <strong>black</strong> wire. (If the motor has a plug, touch two of its pins.) A coil reads <strong>a few ohms</strong>.</li>\n<li>Do the same with <strong>blue and red</strong>. A wire from one coil to a wire of the other (for example green to blue) reads nothing (\"OL\" or \"1\").</li>\n<li>The coil must read <strong>under 10 Ω</strong>.</li>\n<li>Mark the two pairs with tape.</li>\n</ol>\n<p>Other way: touch two wires together and turn the shaft. If it gets <strong>harder to turn</strong>, those two wires are one coil.</p>\n<div class=\"callout note\">\n<div class=\"callout-title\">Colours change between makers</div>\n<p>Always measure yours.</p>\n</div>\n<p>You need only the motor and the meter.</p>", "ov": null, "bench": ["coil", "meter"], "drv": "57D", "grip": null, "conn": [["green and black wires", "a few Ω (under 10)", "grn", "coil 1", null, null, "", null, "Meter on"], ["blue and red wires", "a few Ω (under 10)", "blu", "coil 2", null, null, "", null, "Meter on"], ["green and blue wires", "nothing (OL)", "wht", "different coils", null, null, "", null, "Meter on"]], "conn_title": "Measure these", "sen": null, "sen_names": null, "wire": null, "checks": [], "html_pro": "<p>Stepper: <strong>2 coils</strong>, <strong>4 wires</strong>.</p>\n<ol>\n<li>Power off; the 4 motor wires out of the driver terminals. The magnet and driver can already be on the motor.</li>\n<li>Multimeter to ohms (200 Ω range).</li>\n<li>Leads: black in COM, red in VΩ.</li>\n<li>One probe on each of <strong>two different motor wires</strong> (bare tips, or two pins of the motor plug): green to black, then blue to red. A coil reads <strong>a few ohms</strong>; wires from different coils read open (\"OL\").</li>\n<li>Coil must read <strong>under 10 Ω</strong>.</li>\n<li>Tape-mark the two pairs.</li>\n</ol>\n<p>Alternative: short two wires together and turn the shaft; <strong>harder to turn</strong> = same coil.</p>\n<div class=\"callout note\">\n<div class=\"callout-title\">Colours vary by maker</div>\n<p>Always measure.</p>\n</div>\n<p><a href=\"https://app.cirkitdesigner.com/project/6c301cb3-c8e1-4516-b3c2-bac0ea6c533a\">Official Arctos wiring diagram (interactive)</a></p>", "checks_pro": [], "html_simple": "<ol>\n<li>Power off. The 4 motor wires must be free, not in any driver terminal.</li>\n<li>Set the meter to ohms (200 Ω). Black lead in <strong>COM</strong>, red lead in <strong>VΩ</strong>.</li>\n<li>Put one probe on the <strong>green</strong> wire tip and one on the <strong>black</strong> wire tip. It reads a few ohms.</li>\n<li>Do the same with <strong>blue</strong> and <strong>red</strong>.</li>\n<li>Test green to blue. It reads nothing (\"OL\").</li>\n<li>Each coil must read under 10 Ω. Mark the two pairs with tape.</li>\n</ol>\n<div class=\"callout note\">\n<div class=\"callout-title\">Colours change between makers</div>\n<p>Always measure yours.</p>\n</div>\n<p><a href=\"https://app.cirkitdesigner.com/project/6c301cb3-c8e1-4516-b3c2-bac0ea6c533a\">Official Arctos wiring diagram (interactive)</a></p>", "checks_simple": [], "ts": [85, 55, 56, 71]}, {"stage": 0, "kind": "info", "key": "b-magnet", "title": "Glue the magnet, fit the driver", "img": "Attachments/Arctos/web/manual/arctos-step-015.webp", "html": "<ol>\n<li><strong>Glue the encoder magnet</strong> to the centre of the shaft end with superglue. Let it dry fully.\n   <strong>Magnet jig for NEMA 23 (print it):</strong> <a href=\"https://arctosrobotics.com/wp-content/uploads/2024/05/NEMA_23_Shaft_end_magnet_jig.zip\">NEMA_23_Shaft_end_magnet_jig.zip</a> from the Arctos site. Push it over the shaft end, drop the magnet in its centre hole, let the glue dry, pull the jig off.</li>\n<li>Fit the <strong>MKS driver</strong> to the motor back, screen facing out, with <strong>4x M3x65 + 4 washers</strong> (X):\n   - Take out <strong>one</strong> of the motor's 4 back screws.\n   - Washer on an M3x65, through a corner hole of the MKS board, into that motor hole. Screw in loosely.\n   - Repeat for each corner, <strong>one at a time</strong>. Never take out all 4 motor screws at once.\n   - Tighten in a cross pattern until firm.</li>\n<li>Seat the thermal pads.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Off-centre magnet = calibration errors</div>\n<p>The driver reads the magnet to know the shaft angle. It must be centred and close to the chip.</p>\n</div>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": [], "html_pro": "<ol>\n<li><strong>Glue encoder magnet</strong> to centre of shaft end, superglue. Dry fully.</li>\n<li>Fit the <strong>MKS driver</strong> to the motor back, screen facing out, with <strong>4x M3x65 + 4 washers</strong> (X):\n   - Take out <strong>one</strong> of the motor's 4 back screws.\n   - Washer on an M3x65, through a corner hole of the MKS board, into that motor hole. Screw in loosely.\n   - Repeat for each corner, <strong>one at a time</strong>. Never take out all 4 motor screws at once.\n   - Tighten in a cross pattern until firm.</li>\n<li>Seat thermal pads.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Off-centre magnet = calibration errors</div>\n<p>Driver reads the magnet for shaft angle. Centred, close to the chip.</p>\n</div>\n<p><strong>Magnet jig for NEMA 23 (print it):</strong> <a href=\"https://arctosrobotics.com/wp-content/uploads/2024/05/NEMA_23_Shaft_end_magnet_jig.zip\">NEMA_23_Shaft_end_magnet_jig.zip</a> from the Arctos site. Push it over the shaft end, drop the magnet in its centre hole, let the glue dry, pull the jig off.</p>\n<p>The encoder magnet is the <strong>6 mm round one from the MKS bag</strong>. Its polarity does not matter. One small drop of glue.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Superglue the <strong>encoder magnet</strong> to the centre of the shaft end. Let it dry.</li>\n<li>Take out <strong>one</strong> of the motor's 4 back screws.</li>\n<li>Put a washer on one long bolt. Push it through a corner hole of the <strong>MKS driver</strong> into that motor hole. Screen faces out.</li>\n<li>Do the same at each corner, one at a time (4x <strong>M3x65 bolt</strong>, 4x washer).</li>\n<li>Tighten in a cross pattern. Seat the thermal pads.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Magnet centred</div>\n<p>An off-centre magnet causes calibration errors.</p>\n</div>\n<p>The magnet is the <strong>6 mm round one from the MKS bag</strong>. Either face up. Use one small drop of glue.</p>\n<p><strong>Magnet jig for NEMA 23 (print it):</strong> <a href=\"https://arctosrobotics.com/wp-content/uploads/2024/05/NEMA_23_Shaft_end_magnet_jig.zip\">NEMA_23_Shaft_end_magnet_jig.zip</a>. Push it over the shaft end. Drop the magnet in its centre hole. Pull it off when the glue is dry.</p>", "checks_simple": [], "ts": [86, 85, 54, 56]}, {"stage": 0, "kind": "wire", "key": "b-wirecoils", "title": "Wire the coils", "img": null, "html": "<ol>\n<li><strong>Green → A+, black → A−, blue → B+, red → B−</strong> (official diagram). Use the pairs you measured.</li>\n<li>The order inside a coil doesn't matter. If the motor turns the wrong way later, flip it in software.</li>\n<li>Use <strong>bare twisted strands</strong>. <strong>No tinning, no ferrules</strong> in the small MKS terminals. Ferrules snapped off inside them.</li>\n<li>Twist the strands so no single strand sticks out.</li>\n<li>Add a zip tie as strain relief. Stepper leads snap at the motor.</li>\n</ol>", "ov": null, "bench": ["coil"], "drv": "57D", "grip": null, "conn": [["motor wire", "**A+**", "grn", "coil 1", "A+", null, "", null, "Green"], ["motor wire", "**A−**", "blk", "coil 1", "A−", null, "", null, "Black"], ["motor wire", "**B+**", "blu", "coil 2", "B+", null, "", null, "Blue"], ["motor wire", "**B−**", "red", "coil 2", "B−", null, "", null, "Red"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["coil"], "checks": [], "html_pro": "<ol>\n<li><strong>Green → A+, black → A−, blue → B+, red → B−</strong> (official diagram; the pairs you measured).</li>\n<li>Order within a coil is irrelevant; reverse direction later in software.</li>\n<li><strong>Bare twisted strands. No tinning, no ferrules</strong> in the small MKS terminals; ferrules snapped off inside.</li>\n<li>Twist so no strand sticks out.</li>\n<li>Zip tie as strain relief; stepper leads snap at the motor.</li>\n</ol>", "checks_pro": [], "html_simple": "<p><strong>Motor:</strong> the blue plug on the top edge (A+ A− B+ B−).</p>\n<ol>\n<li><strong>Green</strong> motor wire → <strong>A+</strong> (coil 1)</li>\n<li><strong>Black</strong> motor wire → <strong>A−</strong> (coil 1)</li>\n<li><strong>Blue</strong> motor wire → <strong>B+</strong> (coil 2)</li>\n<li><strong>Red</strong> motor wire → <strong>B−</strong> (coil 2)</li>\n</ol>\n<ul>\n<li>Bare twisted strands. No tinning, no ferrules.</li>\n<li>Twist so no strand sticks out. Add a zip tie as strain relief.</li>\n</ul>", "checks_simple": [], "ts": [70, 71, 55, 44]}, {"stage": 0, "kind": "wire", "key": "b-power", "title": "Power the driver", "img": null, "html": "<ol>\n<li>Use <strong>24 V</strong> (12–24 V works). A 24 V 15 A supply is fine.</li>\n<li>If the supply has screw terminals <strong>L, N, ⏚</strong>, an adult wires the mains cable. Never touch them while plugged in.</li>\n<li><strong>Meter on V DC first:</strong> red probe on the supply's <strong>+V</strong>, black on <strong>−V</strong> (or COM). It reads about +24 V.</li>\n<li>Supply <strong>+V → V+</strong>, <strong>−V → Gnd</strong> on the driver's power terminal.</li>\n<li>Switch on. The screen should light.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">A reversed supply destroys the driver</div>\n<p>Check it three times. It can't be repaired.</p>\n</div>", "ov": null, "bench": ["pwr"], "drv": "57D", "grip": null, "conn": [["from the bench supply **+V**", "**V+**", "red", "table test", "V+", "supply +V", "tmp", null, "Red"], ["from the bench supply **−V**", "**Gnd**", "blk", "table test", "Gnd", "supply −V", "tmp", null, "Black"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["power"], "checks": [], "html_pro": "<ol>\n<li><strong>24 V</strong> (12–24 V works). 24 V 15 A (360 W) is fine.</li>\n<li>Screw-terminal supply (<strong>L, N, ⏚</strong>): an adult wires the mains side. Never touch it while plugged in.</li>\n<li><strong>Meter on V DC first:</strong> red on +V, black on −V/COM: about +24 V.</li>\n<li>Supply <strong>+V → V+</strong>, <strong>−V → Gnd</strong> on the driver's power terminal.</li>\n<li>Switch on; screen should light.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Reversed supply destroys the driver</div>\n<p>Check three times. Not repairable.</p>\n</div>\n<p><a href=\"https://app.cirkitdesigner.com/project/6c301cb3-c8e1-4516-b3c2-bac0ea6c533a\">Official Arctos wiring diagram (interactive)</a></p>", "checks_pro": [], "html_simple": "<p><strong>Power:</strong> right-hand block, top 2 screws (V+, Gnd).</p>\n<ul>\n<li>Use a <strong>24 V</strong> supply (12–24 V works). An adult wires the mains side (<strong>L, N, ⏚</strong>). Never touch it while plugged in.</li>\n<li>Meter on V DC first: red probe on the supply <strong>+V</strong>, black on <strong>−V</strong>. It reads about +24 V.</li>\n</ul>\n<ol>\n<li><strong>Red</strong> from the bench supply <strong>+V</strong> → <strong>V+</strong> (table test)</li>\n<li><strong>Black</strong> from the bench supply <strong>−V</strong> → <strong>Gnd</strong> (table test)</li>\n</ol>\n<ul>\n<li>Switch on. The screen lights.</li>\n</ul>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Reversed power destroys the driver</div>\n<p>Red = +, black = −. Check three times with the meter.</p>\n</div>", "checks_simple": [], "ts": [92, 93, 69, 67, 38, 53, 66, 68]}, {"stage": 0, "kind": "info", "key": "b-cal", "title": "Calibrate, then set the menu", "img": null, "html": "<ol>\n<li><strong>Nothing on the shaft:</strong> no pulley, no belt.</li>\n<li>Press <strong>Menu</strong>. The first item is <strong>Cal</strong>. Press <strong>Enter</strong>. The motor turns by itself.</li>\n<li>Wait for <strong>\"Cal success\"</strong>.</li>\n<li>Set the menu. <strong>Next</strong> = move down, <strong>Enter</strong> = open / save, <strong>Menu</strong> = back:</li>\n</ol>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Setting</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Mode</td>\n<td>SR_vFOC</td>\n</tr>\n<tr>\n<td>Ma (current)</td>\n<td>X, Y: 3200 mA (the 57D default). Z: about 1600 mA. A: about 1300 mA. B, C: about 1200 mA</td>\n</tr>\n<tr>\n<td>HoldMa</td>\n<td>50 %</td>\n</tr>\n<tr>\n<td>MStep</td>\n<td>16</td>\n</tr>\n<tr>\n<td>CanRate</td>\n<td>500K</td>\n</tr>\n<tr>\n<td>CanID</td>\n<td>from the table (X 1 … C 6)</td>\n</tr>\n<tr>\n<td>CanRSP</td>\n<td>On</td>\n</tr>\n<tr>\n<td>HmTrig</td>\n<td>Low</td>\n</tr>\n<tr>\n<td>HmDir</td>\n<td>CW</td>\n</tr>\n<tr>\n<td>HmSpeed</td>\n<td>60</td>\n</tr>\n<tr>\n<td>EndLimit</td>\n<td>On</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Current</div>\n<p>The A, B and C motors are rated lower. Don't leave them on the 1600 mA 42D default. A motor should never be too hot to touch.</p>\n</div>\n<p>Full details: <a class=\"wl\" href=\"#/mks/3-menu-settings\">MKS Driver Setup › 3. Menu settings</a>.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": [], "html_pro": "<ol>\n<li><strong>Nothing on the shaft</strong> (no pulley, no belt).</li>\n<li><strong>Menu</strong> → <strong>Cal</strong> → <strong>Enter</strong>; motor turns by itself; wait for \"Cal success\".</li>\n<li>Set menu (<strong>Next</strong> = down, <strong>Enter</strong> = open/save, <strong>Menu</strong> = back):</li>\n</ol>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Setting</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Mode</td>\n<td>SR_vFOC</td>\n</tr>\n<tr>\n<td>Ma</td>\n<td>X, Y: 3200 mA (the 57D default). Z: about 1600 mA. A: about 1300 mA. B, C: about 1200 mA</td>\n</tr>\n<tr>\n<td>HoldMa</td>\n<td>50 %</td>\n</tr>\n<tr>\n<td>MStep</td>\n<td>16</td>\n</tr>\n<tr>\n<td>CanRate</td>\n<td>500K</td>\n</tr>\n<tr>\n<td>CanID</td>\n<td>from the table (X 1 … C 6)</td>\n</tr>\n<tr>\n<td>CanRSP</td>\n<td>On</td>\n</tr>\n<tr>\n<td>HmTrig</td>\n<td>Low</td>\n</tr>\n<tr>\n<td>HmDir</td>\n<td>CW</td>\n</tr>\n<tr>\n<td>HmSpeed</td>\n<td>60</td>\n</tr>\n<tr>\n<td>EndLimit</td>\n<td>On</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Current</div>\n<p>A, B, C rated lower: don't leave them on the 1600 mA default. Motor must never be too hot to touch.</p>\n</div>\n<p>Full details: <a class=\"wl\" href=\"#/mks/3-menu-settings\">MKS Driver Setup › 3. Menu settings</a>.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take everything off the shaft: no pulley, no belt.</li>\n<li>Press <strong>Menu</strong>. The first item is <strong>Cal</strong>. Press <strong>Enter</strong>. The motor turns by itself.</li>\n<li>Wait for <strong>\"Cal success\"</strong>.</li>\n<li>Set the menu. <strong>Next</strong> = down, <strong>Enter</strong> = open / save, <strong>Menu</strong> = back:</li>\n</ol>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Setting</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Mode</td>\n<td>SR_vFOC</td>\n</tr>\n<tr>\n<td>Ma</td>\n<td>X, Y 3200 mA. Z 1600. A 1300. B, C 1200</td>\n</tr>\n<tr>\n<td>HoldMa</td>\n<td>50 %</td>\n</tr>\n<tr>\n<td>MStep</td>\n<td>16</td>\n</tr>\n<tr>\n<td>CanRate</td>\n<td>500K</td>\n</tr>\n<tr>\n<td>CanID</td>\n<td>from the table (X 1 … C 6)</td>\n</tr>\n<tr>\n<td>CanRSP</td>\n<td>On</td>\n</tr>\n<tr>\n<td>HmTrig</td>\n<td>Low</td>\n</tr>\n<tr>\n<td>HmDir</td>\n<td>CW</td>\n</tr>\n<tr>\n<td>HmSpeed</td>\n<td>60</td>\n</tr>\n<tr>\n<td>EndLimit</td>\n<td>On</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Current</div>\n<p>Set A, B and C lower than the 1600 mA default. A motor must never get too hot to touch.</p>\n</div>\n<p>Full details: <a class=\"wl\" href=\"#/mks/3-menu-settings\">MKS Driver Setup › 3. Menu settings</a>.</p>", "checks_simple": [], "ts": [85, 56, 54, 55, 57]}, {"stage": 0, "kind": "wire", "key": "b-dip", "title": "57D only (X, Y): DIP switches", "img": "Attachments/Arctos/web/arctos-mks_port_remap_limit_switches.webp", "html": "<ol>\n<li>On the SERVO57D, set DIP switches <strong>2 and 3 ON</strong>.</li>\n<li>Leave switch <strong>1 OFF</strong>.</li>\n<li>Switches 2 and 3 power the limit sensors.</li>\n</ol>\n<p>Skip this card for the 42D drivers (Z, A, B, C).</p>", "ov": null, "bench": ["dip"], "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": [], "html_pro": "<ol>\n<li>SERVO57D: DIP switches <strong>2 and 3 ON</strong>.</li>\n<li>Switch <strong>1 OFF</strong>.</li>\n<li>Switches 2 and 3 power the limit sensors.</li>\n</ol>\n<p>Skip for the 42D drivers (Z, A, B, C).</p>", "checks_pro": [], "html_simple": "<p><strong>DIP switches (SW1):</strong> to the right of the screen.</p>\n<ol>\n<li>Set switches <strong>2 and 3 ON</strong>.</li>\n<li>Leave switch <strong>1 OFF</strong>.</li>\n</ol>\n<p>Skip this for the 42D drivers (Z, A, B, C).</p>", "checks_simple": [], "ts": [58, 59]}, {"stage": 0, "kind": "wire", "key": "b-can", "title": "Connect the CANable (one driver at a time)", "img": null, "html": "<ol>\n<li>Plug the CANable into the computer with USB.</li>\n<li><strong>Put the jumper on the CANable's \"120R\" header.</strong></li>\n<li>Connect CANable <strong>CAN H → A/H</strong> and <strong>CAN L → B/L</strong> (the 57D labels). <strong>Read the labels printed on each board.</strong> Don't trust wire colours or old diagrams.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">The early-2024 diagram had H and L swapped</div>\n<p>With H and L swapped, the motor holds but won't move.</p>\n</div>", "ov": null, "bench": ["can", "r120"], "drv": "57D", "grip": null, "conn": [["from CANable **H**", "**A/H**", "yel", "table test, only this driver on the CANable", "A/H", "CANable H", "tmp", null, "Yellow"], ["from CANable **L**", "**B/L**", "grn", "table test", "B/L", "CANable L", "tmp", null, "Green"], ["", "**120R** pins on the CANable", "wht", "end 1 of the CAN bus", null, null, "", null, "Jumper cap"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["can"], "checks": [], "html_pro": "<ol>\n<li>CANable to computer by USB.</li>\n<li><strong>Jumper on CANable \"120R\" header.</strong></li>\n<li><strong>CAN H → A/H, CAN L → B/L</strong> (57D labels). <strong>Go by the labels printed on each board</strong>, not wire colours or old diagrams.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Early-2024 diagram had H and L swapped</div>\n<p>Swapped H/L: motor holds but won't move.</p>\n</div>\n<p><a href=\"https://app.cirkitdesigner.com/project/6c301cb3-c8e1-4516-b3c2-bac0ea6c533a\">Official Arctos wiring diagram (interactive)</a></p>", "checks_pro": [], "html_simple": "<p><strong>CAN on the 57D:</strong> right-hand block, bottom 2 screws (B/L, A/H).</p>\n<ul>\n<li>Plug the CANable into the computer (USB). Mac: click <strong>Allow</strong> on the pop-up. If nothing happens, try another cable.</li>\n</ul>\n<ol>\n<li><strong>Yellow</strong> from CANable <strong>H</strong> → <strong>A/H</strong> (table test, only this driver on the CANable)</li>\n<li><strong>Green</strong> from CANable <strong>L</strong> → <strong>B/L</strong> (table test)</li>\n<li><strong>Jumper cap</strong> → <strong>120R</strong> pins on the CANable (end 1 of the CAN bus)</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">H and L swapped</div>\n<p>Then the motor holds but does not move. Go by the labels printed on the boards, not the wire colours.</p>\n</div>", "checks_simple": [], "ts": [83, 90, 34, 39, 42, 38, 40]}, {"stage": 0, "kind": "wire", "key": "b-sensor", "title": "Plug in the X limit sensor and test it", "img": null, "html": "<ol>\n<li>X uses <strong>1 WSH231</strong> board with 4 pins (official diagram). Power off.</li>\n<li>Your board's pins: <strong>3-26V → EVCC</strong>, <strong>S_OUT → I2</strong>, <strong>N_OUT → I1</strong> (home), <strong>GND → EGND</strong>.</li>\n<li>Power on. Hold a magnet at the sensor: the north face triggers N_OUT, the south face S_OUT.</li>\n<li>Mark the north face. That is home.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Sensor VCC = 5 V from the driver</div>\n<p>Never connect it to the 12/24 V power wires. That burns out the sensor.</p>\n</div>", "ov": null, "bench": ["lim", "sensor"], "drv": "57D", "grip": null, "conn": [["from the sensor **3-26V**", "**EVCC**", "red", "5 V from the driver", "EVCC", "3-26V", "", null, "Red"], ["from the sensor **GND**", "**EGND**", "blk", "", "EGND", "GND", "", null, "Black"], ["from the sensor **N_OUT**", "**I1**", "blu", "home, north face", "I1", "N_OUT home", "", null, "Blue"], ["from the sensor **S_OUT**", "**I2**", "blu", "", "I2", "S_OUT", "", null, "Blue"]], "conn_title": null, "sen": "wsh", "sen_names": null, "wire": ["sensor"], "checks": [], "html_pro": "<ol>\n<li>X uses <strong>1 WSH231</strong> board with 4 pins (official diagram). Power off.</li>\n<li>Board pins: <strong>3-26V → EVCC</strong>, <strong>S_OUT → I2</strong>, <strong>N_OUT → I1</strong> (home), <strong>GND → EGND</strong>.</li>\n<li>Power on: EVCC gives the sensor 5 V. Hold a magnet at it: the north face triggers N_OUT, the south face S_OUT.</li>\n<li>Mark the north face. \"The North Pole corresponds to the Home limit\" (official diagram).</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Sensor VCC = 5 V from the driver</div>\n<p>Never to the 12/24 V power wires. Burns out the sensor.</p>\n</div>\n<p><a href=\"https://app.cirkitdesigner.com/project/6c301cb3-c8e1-4516-b3c2-bac0ea6c533a\">Official Arctos wiring diagram (interactive)</a></p>", "checks_pro": [], "html_simple": "<p><strong>Sensor:</strong> left-hand block, top 4 screws (EVCC, EGND, I1, I2). X has 1 <strong>WSH231</strong> board. Power off.</p>\n<ol>\n<li><strong>Red</strong> from the sensor <strong>3-26V</strong> → <strong>EVCC</strong> (5 V from the driver)</li>\n<li><strong>Black</strong> from the sensor <strong>GND</strong> → <strong>EGND</strong></li>\n<li><strong>Blue</strong> from the sensor <strong>N_OUT</strong> → <strong>I1</strong> (home, north face)</li>\n<li><strong>Blue</strong> from the sensor <strong>S_OUT</strong> → <strong>I2</strong></li>\n</ol>\n<ul>\n<li>Power on. Hold a magnet at the sensor. One face lights one LED, the other face the other LED.</li>\n<li>Mark the face that lights <strong>N_OUT</strong> (north). That is home.</li>\n</ul>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Sensor power = 5 V from the driver</div>\n<p>Never connect a sensor to the 24 V wires. That burns it out.</p>\n</div>", "checks_simple": [], "ts": [84, 88, 87, 91, 58, 64, 62, 59]}, {"stage": 0, "kind": "test", "key": "b-test", "title": "Test the X driver before it goes in", "img": null, "html": "<ol>\n<li>Send read encoder (<code>31</code>). Turn the shaft. Read it again: the number changes.</li>\n<li>Send home (<code>91</code>). Trigger the home sensor with the magnet by hand. The motor must stop.</li>\n<li><strong>Photograph</strong> the screen and the wiring. Write the settings on a card.</li>\n</ol>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["It says \"Cal success\" and keeps its settings after a power cycle.", "It answers on its own ID (X = 1).", "The sensor lights with its marked magnet face.", "It stops on its home sensor."], "html_pro": "<ol>\n<li>Send read encoder (<code>31</code>); turn shaft; read again: value changes.</li>\n<li>Send home (<code>91</code>); trigger home sensor by hand with magnet: motor must stop.</li>\n<li><strong>Photograph</strong> screen and wiring; write settings on a card.</li>\n</ol>", "checks_pro": ["\"Cal success\"; settings persist after power cycle.", "Answers on its own ID (X = 1).", "Sensor lights with its marked magnet face.", "Stops on its home sensor."], "html_simple": "<ol>\n<li>Send read encoder (<code>31</code>). Turn the shaft. Read again. The number changes.</li>\n<li>Send home (<code>91</code>). Trigger the home sensor with the magnet. The motor stops.</li>\n<li>Photograph the screen and the wiring. Write the settings on a card.</li>\n</ol>", "checks_simple": ["\"Cal success\", and settings stay after a power cycle.", "It answers on its own ID (X = 1).", "It stops when the marked magnet face reaches the sensor."], "ts": [34, 46, 59, 61, 44]}, {"stage": 0, "kind": "step", "n": 15, "title": "Put the HTD 5M 15T pulley (metal, 6.35 mm bore; HTD mod) on the…", "img": "Attachments/Arctos/web/manual/arctos-step-015.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The GT2W10 pulley on the NEMA 23 shaft. The motor goes up into the X motor core from below. It uses <strong>M5x20 bolts from below and M5 nuts on top</strong>. The picture shows 2 bolts and 3 nuts, but the NEMA 23 has 4 holes: use 4 of each. (unsure: the hidden ones are not drawn)</p>\n</div>\n<p>Put Pulley GT2W10B6.35 on the shaft of the Nema 23 stepper motor. Fix the MKS Servo 57D driver to the back of the motor, with the encoder magnet on the end of the motor shaft (red arrow). Push the motor up into the X motor CORE so the pulley comes out on top, and fix it with Bolt M5 20mm (drawn: 2) from below and Nut M5 on top (drawn: 3). Parts: Nema 23 stepper motor, MKS Servo 57D. Hardware: Pulley GT2W10B6.35 (1), Nut M5 v2, Bolt M5 20mm v2, encoder magnet. Note: \"encoder magnet\" / \"Detailed video about wiring the encoder can be found on youtube\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p><strong>Before this step:</strong> set up the MKS 57D on the bench (CAN ID <strong>01</strong>), glue the encoder magnet on the shaft, and wire the motor. See <a class=\"wl\" href=\"#/mks\">MKS Driver Setup</a>. The motor bolts with 3x M5x20, wires facing the pulley. Don't fully tighten the pulley set screw yet.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>GT2W10 pulley on NEMA 23 shaft. Motor goes up into X motor core from below: <strong>M5x20 bolts from below, M5 nuts on top</strong>. Picture shows 2 bolts and 3 nuts, but NEMA 23 has 4 holes: use 4 of each. (unsure: the hidden ones are not drawn)</p>\n</div>\n<p>Pulley GT2W10B6.35 on Nema 23 stepper shaft. MKS Servo 57D driver on motor back, encoder magnet on shaft end (red arrow). Push motor up into X motor CORE, pulley out on top; Bolt M5 20mm v2 from below (drawn: 2), Nut M5 v2 on top (drawn: 3). Parts: Nema 23 stepper motor, MKS Servo 57D. Hardware: Pulley GT2W10B6.35 (1), Nut M5 v2, Bolt M5 20mm v2, encoder magnet. Note: \"encoder magnet\" / \"Detailed video about wiring the encoder can be found on youtube\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p><strong>Before this step:</strong> bench-set up MKS 57D (CAN ID <strong>01</strong>), glue encoder magnet on shaft, wire motor. See <a class=\"wl\" href=\"#/mks\">MKS Driver Setup</a>. Motor bolts with 3x M5x20, wires facing pulley. Pulley set screw not fully tight yet.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Unplug the bench wires from the X driver: supply +V and −V, and the CANable CAN H and CAN L. The sensor and motor wires stay on.</li>\n<li>Put the <strong>HTD 5M 15T pulley</strong> (metal, 6.35 mm bore) on the <strong>Nema 23</strong> motor shaft. Leave the set screw loose.</li>\n<li>The X driver (MKS SERVO57D, CAN ID <strong>01</strong>) and the magnet are already on the motor back.</li>\n<li>Push the motor up into the <strong>X motor CORE</strong>, pulley on top.</li>\n<li>Fix it with 4x <strong>M5x20 bolt</strong> from below and 4x <strong>M5 nut</strong> on top.</li>\n</ol>", "checks_simple": [], "ts": [4, 28, 30, 62, 54, 63]}, {"stage": 0, "kind": "wire", "key": "h-plan", "title": "The four wires that run up the arm", "img": "Attachments/Arctos/web/arctos-closed_loop_wiring_diagram.webp", "html": "<p>At every joint, <strong>four wires go in and four go on</strong> to the next joint:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Wire</th>\n<th>Colour</th>\n<th>Goes to</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>+V (12 or 24 V)</td>\n<td>red</td>\n<td>V+ on each driver</td>\n</tr>\n<tr>\n<td>GND</td>\n<td>black</td>\n<td>Gnd on each driver</td>\n</tr>\n<tr>\n<td>CAN H</td>\n<td>yellow</td>\n<td>CAN H on each driver</td>\n</tr>\n<tr>\n<td>CAN L</td>\n<td>green</td>\n<td>CAN L on each driver</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>Daisy-chain them, driver to driver:</strong> wires come in from the driver below, and wires go out to the next driver from the same terminals.</li>\n<li>The CAN wires that come with the MKS drivers are fine for the whole robot.</li>\n<li><strong>Limit sensor wires go only to their own driver.</strong> They never join the power wires.</li>\n</ul>\n<p>The diagram above lights up as you wire. Grey parts are not wired yet.</p>", "ov": ["*"], "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": [], "html_pro": "<p>Each joint: <strong>4 wires in, 4 on</strong> to the next joint.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Wire</th>\n<th>Colour</th>\n<th>Goes to</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>+V (12 or 24 V)</td>\n<td>red</td>\n<td>V+ on each driver</td>\n</tr>\n<tr>\n<td>GND</td>\n<td>black</td>\n<td>Gnd on each driver</td>\n</tr>\n<tr>\n<td>CAN H</td>\n<td>yellow</td>\n<td>CAN H on each driver</td>\n</tr>\n<tr>\n<td>CAN L</td>\n<td>green</td>\n<td>CAN L on each driver</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>Daisy-chain</strong> driver to driver: in from the driver below, out to the next driver from the same terminals.</li>\n<li>Stock CAN wires from the MKS drivers are fine for the whole robot.</li>\n<li><strong>Limit sensor wires go only to their own driver.</strong> Never into the power wires.</li>\n</ul>\n<p>The diagram above lights up as you wire; grey = not wired yet.</p>\n<p><a href=\"https://app.cirkitdesigner.com/project/6c301cb3-c8e1-4516-b3c2-bac0ea6c533a\">Official Arctos wiring diagram (interactive)</a></p>", "checks_pro": [], "html_simple": "<p>Four wires run up the arm to every driver.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Wire</th>\n<th>Colour</th>\n<th>Terminal on the 57D (X, Y)</th>\n<th>Terminal on the 42D (Z, A, B, C)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>+V (24 V)</td>\n<td>red</td>\n<td><strong>V+</strong> (right)</td>\n<td><strong>V+</strong> (right)</td>\n</tr>\n<tr>\n<td>GND</td>\n<td>black</td>\n<td><strong>Gnd</strong> (right)</td>\n<td><strong>Gnd</strong> (right)</td>\n</tr>\n<tr>\n<td>CAN H</td>\n<td>yellow</td>\n<td><strong>A/H</strong> (right)</td>\n<td><strong>CANH</strong> (left)</td>\n</tr>\n<tr>\n<td>CAN L</td>\n<td>green</td>\n<td><strong>B/L</strong> (right)</td>\n<td><strong>CANL</strong> (left)</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>Daisy-chain:</strong> the 4 wires come in from the driver below. 4 wires go out to the next driver from the <strong>same screws</strong>.</li>\n<li>Sensor wires go only to their own driver. Never to the 24 V wires.</li>\n</ul>\n<p><a href=\"https://app.cirkitdesigner.com/project/6c301cb3-c8e1-4516-b3c2-bac0ea6c533a\">Official Arctos wiring diagram (interactive)</a></p>", "checks_simple": [], "ts": [43, 70]}, {"stage": 0, "kind": "wire", "key": "h-power", "title": "Power in: supply, jack, fuse, switch", "img": null, "html": "<ol>\n<li><strong>Power supply:</strong> 24 V (or 12 V), at least 100 W. A 24 V 15 A supply is fine. Mains side (L, N, ⏚): an adult wires it.</li>\n<li><strong>DC jack</strong> in the electronics panel (step 18). Find its + prong: meter on V DC, red probe on one prong, black on the other. <strong>+24 V = the red probe is on +.</strong> Red wire goes there. −24 V = the other prong is +.</li>\n<li><strong>Fuse</strong> on the + wire right after the jack: <strong>7 A at 24 V</strong>, or 15 A at 12 V. It is not in the kit.</li>\n<li><strong>Switch</strong> in the + wire after the fuse.</li>\n<li>The + and − wires go on to the <strong>X driver's V+ and Gnd</strong> (next stage).</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Check polarity three times</div>\n<p>Red = +, black = −. A reversed supply destroys every driver on the line.</p>\n</div>", "ov": ["psu", "pin", "pd-X"], "bench": null, "drv": "57D", "grip": null, "conn": [["from the supply **+V**", "DC jack **+**", "red", "find + with the meter", null, null, "", null, "Red"], ["from the supply **−V**", "DC jack **−**", "blk", "", null, null, "", null, "Black"], ["from the jack **+**", "**fuse** holder", "red", "7 A at 24 V, 15 A at 12 V", null, null, "", null, "Red"], ["from the fuse", "**switch**", "red", "", null, null, "", null, "Red"], ["from the switch", "X driver **V+**", "red", "right-hand block", null, null, "", null, "Red"], ["from the jack **−**", "X driver **Gnd**", "blk", "right-hand block", null, null, "", null, "Black"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["power"], "checks": [], "html_pro": "<ol>\n<li><strong>Supply:</strong> 24 V (or 12 V), at least 100 W. A 24 V 15 A supply is fine. Mains side (L, N, ⏚): an adult wires it.</li>\n<li><strong>DC jack</strong> in the electronics panel (step 18). Find its + prong: meter on V DC, red probe on one prong, black on the other. <strong>+24 V = the red probe is on +.</strong> Red wire goes there. −24 V = the other prong is +.</li>\n<li><strong>Fuse</strong> on + wire right after jack: <strong>7 A at 24 V</strong>, 15 A at 12 V. Not in kit.</li>\n<li><strong>Switch</strong> in + wire after fuse.</li>\n<li>\n<ul>\n<li>and − go on to the <strong>X driver's V+ and Gnd</strong>.</li>\n</ul>\n</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Check polarity three times</div>\n<p>Red = +, black = −. Reversed supply destroys every driver on the line.</p>\n</div>", "checks_pro": [], "html_simple": "<p><strong>X driver power:</strong> right-hand block, top 2 screws (V+, Gnd).</p>\n<ul>\n<li>Supply: 24 V (or 12 V), at least 100 W. An adult wires the mains side (L, N, ⏚).</li>\n<li>Find the jack's <strong>+</strong> prong: meter on V DC, one probe on each prong. +24 V = the red probe is on +.</li>\n</ul>\n<ol>\n<li><strong>Red</strong> from the supply <strong>+V</strong> → DC jack <strong>+</strong> (find + with the meter)</li>\n<li><strong>Black</strong> from the supply <strong>−V</strong> → DC jack <strong>−</strong></li>\n<li><strong>Red</strong> from the jack <strong>+</strong> → <strong>fuse</strong> holder (7 A at 24 V, 15 A at 12 V)</li>\n<li><strong>Red</strong> from the fuse → <strong>switch</strong></li>\n<li><strong>Red</strong> from the switch → X driver <strong>V+</strong> (right-hand block)</li>\n<li><strong>Black</strong> from the jack <strong>−</strong> → X driver <strong>Gnd</strong> (right-hand block)</li>\n</ol>\n<ul>\n<li>The fuse is not in the kit.</li>\n</ul>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Polarity</div>\n<p>Red = +, black = −. A reversed supply destroys every driver on the chain.</p>\n</div>", "checks_simple": [], "ts": [92, 69, 67, 66, 68, 53]}, {"stage": 0, "kind": "wire", "key": "h-canable", "title": "CANable: USB and the first terminator", "img": null, "html": "<ol>\n<li>USB from the CANable to the computer.</li>\n<li><strong>Jumper the \"120R\" header</strong> on the CANable. This is one end of the bus.</li>\n<li>Its CAN H / CAN L will go to the X driver in the next stage.</li>\n</ol>", "ov": ["pc", "usb", "canable", "r120"], "bench": null, "drv": "57D", "grip": null, "conn": [["from the CANable", "a **USB** port on the computer", "wht", "", null, null, "", null, "USB cable"], ["", "**120R** pins on the CANable", "wht", "end 1 of the CAN bus", null, null, "", null, "Jumper cap"]], "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": [], "html_pro": "<ol>\n<li>USB from CANable to computer.</li>\n<li><strong>Jumper the \"120R\" header</strong> on the CANable: one end of the bus.</li>\n<li>Its CAN H / CAN L go to the X driver in the next stage.</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li><strong>USB cable</strong> from the CANable → a <strong>USB</strong> port on the computer</li>\n<li><strong>Jumper cap</strong> → <strong>120R</strong> pins on the CANable (end 1 of the CAN bus)</li>\n</ol>\n<ul>\n<li>The CANable's <strong>H</strong> and <strong>L</strong> go to the X driver next.</li>\n</ul>", "checks_simple": [], "ts": [90, 39, 34]}, {"stage": 0, "kind": "test", "key": "h-test", "title": "Test the harness", "img": null, "html": "<p>Power on with nothing connected to the drivers yet.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["The meter reads the right voltage and polarity on the wires for the X driver.", "The step-down reads 6.0 V."], "html_pro": "<p>Power on, nothing connected to the drivers yet.</p>", "checks_pro": ["Meter reads correct voltage and polarity on the X driver wires.", "Step-down reads 6.0 V."], "html_simple": "<p>Power on with nothing connected to the drivers.</p>", "checks_simple": ["The wires for the X driver show the right voltage and polarity.", "The step-down reads 6.0 V."], "ts": [67, 66]}, {"stage": 0, "kind": "wire", "key": "x-wire", "title": "Wire X now, before step 16 closes the motor box", "img": null, "html": "<ol>\n<li><strong>X driver power:</strong> V+ and Gnd from the switch and jack.</li>\n<li><strong>X driver CAN in</strong> from the CANable: H to H, L to L.</li>\n<li>In the same terminals, fit the wires <strong>out</strong> to Y: V+, Gnd, CAN H, CAN L.</li>\n<li><strong>Route the bundle up through the centre</strong> of the base to the shoulder. No slip ring is needed.</li>\n<li>Leave slack at the motor, so you can take it out later.</li>\n</ol>\n<p>The X limit sensor goes in on the next two pages (manual steps 147–148), while you can still reach it.</p>", "ov": ["dX", "mX", "pd-X", "cc-X", "co-X"], "bench": ["pwr", "can"], "drv": "57D", "grip": null, "conn": [["+V from the switch", "**V+**", "red", "card \"Power in\"", "V+", "+V in", "done", null, "Red"], ["GND from the jack −", "**Gnd**", "blk", "card \"Power in\"", "Gnd", "GND in", "done", null, "Black"], ["from CANable **H**", "**A/H**", "yel", "", "A/H", "CANable H", "", null, "Yellow"], ["from CANable **L**", "**B/L**", "grn", "", "B/L", "CANable L", "", null, "Green"], ["+V out to the Y driver", "**V+**", "red", "same screw as the wire in", "V+", "+V out", "", null, "Red"], ["GND out to the Y driver", "**Gnd**", "blk", "same screw as the wire in", "Gnd", "GND out", "", null, "Black"], ["CAN H out to the Y driver", "**A/H**", "yel", "same screw as the wire in", "A/H", "CAN H out", "", null, "Yellow"], ["CAN L out to the Y driver", "**B/L**", "grn", "same screw as the wire in", "B/L", "CAN L out", "", null, "Green"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["power", "can"], "checks": [], "html_pro": "<ol>\n<li><strong>X driver power:</strong> V+ and Gnd from switch and jack.</li>\n<li><strong>X driver CAN in</strong> from CANable: H to H, L to L.</li>\n<li>Same terminals: 4 wires <strong>out</strong> to Y (V+, Gnd, CAN H, CAN L).</li>\n<li><strong>Route bundle up through base centre</strong> to shoulder. No slip ring needed.</li>\n<li>Leave slack at motor for later removal.</li>\n</ol>\n<p>X limit sensor goes in on next two pages (manual steps 147–148), while still reachable.</p>", "checks_pro": [], "html_simple": "<p><strong>Power and CAN on the X 57D:</strong> right-hand block. V+ / Gnd at the top, B/L / A/H at the bottom.</p>\n<ul>\n<li>The red (V+) and black (Gnd) wires from card \"Power in\" are already in.</li>\n</ul>\n<ol>\n<li><strong>Yellow</strong> from CANable <strong>H</strong> → <strong>A/H</strong></li>\n<li><strong>Green</strong> from CANable <strong>L</strong> → <strong>B/L</strong></li>\n<li><strong>Red</strong> +V out to the Y driver → <strong>V+</strong> (same screw as the wire in)</li>\n<li><strong>Black</strong> GND out to the Y driver → <strong>Gnd</strong> (same screw as the wire in)</li>\n<li><strong>Yellow</strong> CAN H out to the Y driver → <strong>A/H</strong> (same screw as the wire in)</li>\n<li><strong>Green</strong> CAN L out to the Y driver → <strong>B/L</strong> (same screw as the wire in)</li>\n</ol>\n<ul>\n<li>Two wires in one screw: twist the bare ends together first, then tighten.</li>\n<li>Run the 4 wires for Y up through the centre of the base. Leave slack at the motor.</li>\n</ul>", "checks_simple": [], "ts": [34, 37, 42, 70]}, {"stage": 0, "kind": "step", "n": 146, "title": "Section title page for the limit switches", "img": "Attachments/Arctos/web/manual/arctos-step-146.webp", "html": "<p>Section title page for the limit switches. No assembly in this step. Note: \"LIMIT SWITCHES\"</p>", "moved": "Paper manual step 146. In the paper manual this is in the Limit switches section near the end (steps 146–159). It is done here, right after this joint, while you can still reach the spot.", "html_simple": "<p>Title page. Nothing to build.</p>", "checks_simple": [], "ts": [87, 91, 58, 59, 61, 64]}, {"stage": 0, "kind": "step", "n": 147, "title": "Inside the base, fix the KYD003 endstop board with M2 screws (red…", "img": "Attachments/Arctos/web/manual/arctos-step-147-where.webp", "html": "<p>Inside the base, fix the KYD003 endstop board with M2 screws (red arrows) so it faces the magnet on the X pulley hub. Parts: KYD003 endstop. Hardware: M2 screws, magnet. Note: \"M2 screws\" / \"magnet\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Note: this picture labels the X sensor <strong>KY003</strong>, but the docs and the wiring diagram use a <strong>WSH231</strong> dual sensor on X (and on A and C). Use the sensor that matches your kit and the wiring diagram.</p>\n</div>", "html_pro": "<p>Inside base: fix KYD003 endstop board with M2 screws (red arrows), facing magnet on X pulley hub. Parts: KYD003 endstop. Hardware: M2 screws, magnet. Note: \"M2 screws\" / \"magnet\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Picture labels X sensor <strong>KY003</strong>; docs and wiring diagram use <strong>WSH231</strong> dual sensor on X (and A, C). Use the one matching your kit and the wiring diagram.</p>\n</div>\n<p><strong>Magnet:</strong> one small <strong>3×3 mm magnet</strong> (from the bag of ~150, not the MKS encoder magnet). Press it into the small hole on the side of the <strong>X pulley nut</strong> (the round nut from step 8), <strong>home face</strong> (the face that lights I1) pointing out toward the sensor. A drop of superglue if loose.</p>\n<p><strong>WSH231 holes don't line up</strong> (the holder is made for the KY-003): stick the board on with <strong>double-sided foam tape</strong> or a dab of <strong>hot glue</strong>, sensor chip facing the nut, 1–3 mm gap. Add a zip tie if it shifts.</p>\n<p><strong>M2 screws are not in the kit:</strong> buy <strong>M2x5</strong>. M2.5 screws crack the sensor board.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Press one small <strong>3x3 mm magnet</strong> into the hole in the side of the <strong>X pulley nut</strong>. Home face points out. Add a drop of superglue if loose.</li>\n<li>Fix the endstop board on <strong>X limit holder 3</strong> with 2x <strong>M2 screw</strong>. If the WSH231's holes don't line up with the holder, stick it on with double-sided foam tape instead.</li>\n<li>Face the sensor chip at the magnet, 1–3 mm gap.</li>\n</ol>\n<div class=\"callout note\">\n<div class=\"callout-title\">Which sensor</div>\n<p>The picture says KYD003. X uses a <strong>WSH231</strong>. Its holes do not line up: stick it on with double-sided foam tape or hot glue.</p>\n</div>\n<div class=\"callout warning\">\n<div class=\"callout-title\">M2 screws</div>\n<p>Not in the kit: buy <strong>M2x5</strong>. M2.5 screws crack the board.</p>\n</div>", "checks_simple": [], "ts": [16, 62, 54, 63, 58, 59]}, {"stage": 0, "kind": "step", "n": 148, "title": "Close view: the endstop board is fixed on its holder next to the…", "img": "Attachments/Arctos/web/manual/arctos-step-148.webp", "html": "<p>Close view: the endstop board is fixed on its holder next to the pulley hub, with its wires going out. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Close view: endstop board fixed on holder beside pulley hub, wires out. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the board is on its holder beside the pulley hub, wires going out.</p>", "checks_simple": [], "ts": [16, 87, 58, 59, 61, 64]}, {"stage": 0, "kind": "step", "n": 16, "title": "Put the X belt (HTD 5M, 9 mm wide, 650 mm; HTD mod) around the big…", "img": "Attachments/Arctos/web/manual/arctos-step-016.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The 630 mm belt round the big pulley, the motor pulley and the idlers. The X idler tensioner plate goes on top.</p>\n</div>\n<p>Put the X belt W10 630 mm around the big X pulley and around the motor pulley and idlers. Place the X idler tensioner plate on top of the idler bolts to hold them. Parts: X idler tensioner. Hardware: X belt W10 630 mm.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Tip: <strong>tension the belt so it can't skip</strong>. If it slips under load: loosen all 4 motor bolts, slide the motor back, tighten the 2 back nuts first, then the front ones.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>630 mm belt round big pulley, motor pulley, idlers. X idler tensioner plate on top.</p>\n</div>\n<p>Fit X belt W10 630 mm around big X pulley, motor pulley and idlers. Seat X idler tensioner plate on top of idler bolts. Parts: X idler tensioner. Hardware: X belt W10 630 mm.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Tip: <strong>tension belt so it can't skip</strong>. Slipping under load: loosen all 4 motor bolts, slide motor back, tighten 2 back nuts first, then front.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>X belt HTD 5M 650 mm</strong> (9 mm wide, \"650-5M-9\") round the big X pulley, the motor pulley and the idlers. Teeth face in. The idlers run on its smooth back.</li>\n<li>Put the <strong>X idler tensioner</strong> plate on top of the 2 idler bolts.</li>\n</ol>\n<div class=\"callout note\">\n<div class=\"callout-title\">HTD belt length</div>\n<p>650 mm is calculated, not test-fitted. If the belt is too tight to go on, loosen the 4 motor nuts (step 15) and slide the motor towards the X pulley. At <strong>Test X</strong> you slide it back to make the belt tight.</p>\n</div>", "checks_simple": [], "ts": [4, 28, 30, 29, 72, 33]}, {"stage": 0, "kind": "step", "n": 17, "title": "Result: the belt is on and the tensioner plate links the idler…", "img": "Attachments/Arctos/web/manual/arctos-step-017.webp", "html": "<p>Result: the belt is on and the tensioner plate links the idler bolts on top of the motor box. Parts: none labelled. Hardware: none labelled. Note: \"TIP: Do the wiring of the motors as you go. Some motors are in tight spaces and hard to wire after everything is assembled\"</p>", "html_pro": "<p>Result: belt on; tensioner plate links idler bolts on top of motor box. Parts: none labelled. Hardware: none labelled. Note: \"TIP: Do the wiring of the motors as you go. Some motors are in tight spaces and hard to wire after everything is assembled\"</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the belt is on, and the tensioner plate joins the idler bolts.</p>", "checks_simple": [], "ts": [28, 30, 29, 72, 33, 0]}, {"stage": 0, "kind": "step", "n": 18, "title": "Push the 12 female connector into the hole in the Electronics panel", "img": "Attachments/Arctos/web/manual/arctos-step-018.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The DC jack and the electronics panel (<strong>4x M3x10</strong>). The CANable fits on its side panel.</p>\n</div>\n<p>Push the 12 female connector into the hole in the Electronics panel. Screw the Electronics panel onto the end of the X motor CORE with Bolt M3 10mm (drawn: 4). Fit the mks cannable v2 board on the side panel. Parts: Electronics panel, 12 female connector, mks cannable v2. Hardware: Bolt M3 10mm v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>The 12 V/24 V female connector: its <strong>long prong is +</strong>. Wire + through the rocker switch. Add a fuse (not in the kit). See <a class=\"wl\" href=\"#/wiring/power\">Wiring › Power</a>.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>DC jack and electronics panel (<strong>4x M3x10</strong>). CANable fits on its side panel.</p>\n</div>\n<p>Push 12 female connector into Electronics panel hole. Screw Electronics panel onto end of X motor CORE with Bolt M3 10mm (drawn: 4). Fit mks cannable v2 board on side panel. <strong>USB port faces out</strong> (cable plugs in from outside); CAN H / L screws face in, towards the X driver. Parts: Electronics panel, 12 female connector, mks cannable v2. Hardware: Bolt M3 10mm v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>12 V/24 V female connector: find <strong>+ with the meter</strong> (+24 V = red probe on +). Wire + through rocker switch. Add fuse (not in kit). See <a class=\"wl\" href=\"#/wiring/power\">Wiring › Power</a>.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Push the <strong>12 female connector</strong> into the hole in the <strong>Electronics panel</strong>.</li>\n<li>Screw the panel onto the end of the <strong>X motor CORE</strong> with 4x <strong>M3x10 bolt</strong>.</li>\n<li>Fit the <strong>mks cannable v2</strong> on the side of the motor box. USB port faces out. CAN H / L screws face in.</li>\n<li>Lay the <strong>fuse holder</strong> inside the box, across it between the panel and the X motor.</li>\n</ol>", "checks_simple": [], "ts": [72, 33, 0, 70, 71, 53]}, {"stage": 0, "kind": "step", "n": 19, "title": "Fit the 3010 FAN 30x30 on the side of the motor box", "img": "Attachments/Arctos/web/manual/arctos-step-019.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The 30x30 fan, <strong>4x M3x10</strong>.</p>\n</div>\n<p>Fit the 3010 FAN 30x30 on the side of the motor box. Fix it with Bolt M3 10mm (drawn: 4). [unclear: the bolts are drawn near the round opening on the right face, so the fan may go there] Parts: 3010 FAN 30x30. Hardware: Bolt M3 10mm v2.</p>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>30x30 fan, <strong>4x M3x10</strong>.</p>\n</div>\n<p>Fit 3010 FAN 30x30 on side of motor box; fix with Bolt M3 10mm (drawn: 4). [unclear: bolts drawn near round opening on right face, so fan may go there] Parts: 3010 FAN 30x30. Hardware: Bolt M3 10mm v2.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>3010 FAN 30x30</strong> behind the round opening on the end of the motor box, above the Electronics panel.</li>\n<li>Fix it with 4x <strong>M3x10 bolt</strong>.</li>\n</ol>", "checks_simple": [], "ts": [72, 33, 0]}, {"stage": 0, "kind": "wire", "key": "x-fan", "title": "Wire the base fan (step 19)", "img": null, "html": "<ol>\n<li>Check the fan label: its voltage must match the supply (<strong>24 V fan on a 24 V supply</strong>).</li>\n<li>Fan red → the <strong>switch output</strong> (the same + wire that goes to X V+).</li>\n<li>Fan black → the <strong>jack −</strong> (the same − wire that goes to X Gnd).</li>\n<li>Switch on: the fan spins. Switch off: it stops.</li>\n</ol>", "ov": ["fX"], "bench": null, "drv": "57D", "grip": null, "conn": [["fan wire", "**switch** output", "red", "the + wire that goes on to X V+", null, null, "", null, "Red"], ["fan wire", "DC jack **−**", "blk", "the − wire that goes on to X Gnd", null, null, "", null, "Black"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["power"], "checks": [], "html_pro": "<ol>\n<li>Check the fan label: its voltage must match the supply (<strong>24 V fan on a 24 V supply</strong>).</li>\n<li>Fan red → the <strong>switch output</strong> (the same + wire that goes to X V+).</li>\n<li>Fan black → the <strong>jack −</strong> (the same − wire that goes to X Gnd).</li>\n<li>Switch on: the fan spins. Switch off: it stops.</li>\n</ol>", "checks_pro": [], "html_simple": "<ul>\n<li>Check the fan label: a <strong>24 V</strong> fan on a 24 V supply.</li>\n</ul>\n<ol>\n<li><strong>Red</strong> fan wire → <strong>switch</strong> output (the + wire that goes on to X V+)</li>\n<li><strong>Black</strong> fan wire → DC jack <strong>−</strong> (the − wire that goes on to X Gnd)</li>\n</ol>\n<ul>\n<li>Switch on: the fan spins. Switch off: it stops.</li>\n</ul>", "checks_simple": [], "ts": [70, 71, 53, 67, 66, 68]}, {"stage": 0, "kind": "step", "n": 20, "title": "Result: the X Axis base is complete, with the electronics panel,…", "img": "Attachments/Arctos/web/manual/arctos-step-020.webp", "html": "<p>Result: the X Axis base is complete, with the electronics panel, cannable board and fan fitted. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: X Axis base complete; electronics panel, cannable board, fan fitted. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: Electronics panel, cannable board and fan are on.</p>", "checks_simple": [], "ts": [72, 43, 54]}, {"stage": 0, "kind": "test", "key": "x-test", "title": "Test X", "img": null, "html": "<p><strong>Tension the belt first.</strong> Loosen the 4 motor bolts. Slide the motor back until the belt can't skip. Tighten the back nuts first, then the front ones.</p>", "ov": ["li-X"], "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["Belt off: jog X ±5°. It turns the right way.", "Belt on: jog ±10°, then home. It stops at the sensor.", "Turning the base by hand is smooth. No bearing rubs."], "html_pro": "<p><strong>Tension belt first.</strong> Loosen 4 motor bolts; slide motor back until belt can't skip; tighten back nuts, then front.</p>", "checks_pro": ["Belt off: jog X ±5°; correct direction.", "Belt on: jog ±10°, then home; stops at sensor.", "Base turns smooth by hand; no bearing rub."], "html_simple": "<ol>\n<li>Loosen the 4 motor bolts.</li>\n<li>Slide the motor back until the belt can't skip.</li>\n<li>Tighten the back nuts first, then the front ones.</li>\n</ol>", "checks_simple": ["Belt off: jog X ±5°. It turns the right way.", "Belt on: jog ±10°, then home. It stops at the sensor.", "The base turns smoothly by hand."], "ts": [84, 89, 28, 46, 59, 61, 65]}, {"stage": 1, "kind": "test", "key": "yg-before", "title": "Before you build the Y gearbox", "img": "Attachments/Arctos/arctos-cycloidal_disk_alignment.jpg", "html": "<p>Read <a class=\"wl\" href=\"#/cycloidal/before-you-start\">Cycloidal Gearboxes (Y and Z) › Before you start</a> once.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["The 4 mm pins measure about 3.97 mm. (At 3.82 mm one builder had 45° of slop.)", "Y parts set apart: M5 rods and 80 mm pins. The M4 rods and 50 mm pins are for Z.", "You found the marks on each disk and camshaft piece (numbers, notches, dashes)."], "html_pro": "<p>Read <a class=\"wl\" href=\"#/cycloidal/before-you-start\">Cycloidal Gearboxes (Y and Z) › Before you start</a> once.</p>", "checks_pro": ["4 mm pins measure about 3.97 mm. (At 3.82 mm one builder had 45° of slop.)", "Y parts set apart: M5 rods, 80 mm pins. M4 rods, 50 mm pins are for Z.", "Marks found on each disk and camshaft piece (numbers, notches, dashes)."], "html_simple": "<p>Read <a class=\"wl\" href=\"#/cycloidal/before-you-start\">Cycloidal Gearboxes (Y and Z) › Before you start</a> once.</p>", "checks_simple": ["The 4 mm pins measure about 3.97 mm.", "Y parts set apart: M5 rods and 80 mm pins. M4 rods and 50 mm pins are for Z.", "You found the marks on each disk and camshaft piece."], "ts": [94, 10, 15, 11, 17, 7]}, {"stage": 1, "kind": "step", "n": 21, "title": "Put the bearings and cap on one disk", "img": "Attachments/Arctos/web/manual/arctos-step-021.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Take one <strong>Y gearbox cycloidal disk</strong>.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> into the big centre hole.</li>\n<li>Press 5 x <strong>Bearing 688ZZ-4</strong> into the 5 holes around the centre.</li>\n<li>Put the <strong>Y cyclo bearings cap</strong> (the 5-lobed flat plate) on top.</li>\n<li>Screw the cap down with 5 x screws (labelled M2.6x5; the manual says use <strong>M3x10</strong> now).</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 61803, 5x 688ZZ-4, 5x cap screws. The label \"(11)\" and \"(10)\" are CAD numbers, not counts.</p>\n<p><strong>Orientation:</strong> The cap goes on the side shown in the picture. Its 5 lobes cover the 5 small bearings. Its centre hole lines up with the 61803.</p>\n<p><strong>Check:</strong> All 6 bearings sit flat. None stands proud of the disk. The cap is pressed fully down with no gap.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Press each bearing in evenly. Put a flat block of wood on it and tap with a mallet. A 22 mm socket also works as a press. (Unexpected Maker)</li>\n<li>Push the cap all the way down. Unexpected Maker's disk bearings were loose because the cap did not press them far enough. That made the gearbox wobble.</li>\n<li>Finish screws by hand. A power driver strips plastic. (Unexpected Maker)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Take one <strong>Y gearbox cycloidal disk</strong>.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> into big centre hole.</li>\n<li>Press 5 x <strong>Bearing 688ZZ-4</strong> into 5 holes around centre.</li>\n<li>Seat <strong>Y cyclo bearings cap</strong> (5-lobed flat plate) on top.</li>\n<li>Screw cap down with 5 x screws (labelled M2.6x5; manual now says <strong>M3x10</strong>).</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 61803, 5x 688ZZ-4, 5x cap screws. \"(11)\" and \"(10)\" are CAD numbers, not counts.</p>\n<p><strong>Orientation:</strong> Cap on side shown. 5 lobes cover the 5 small bearings; centre hole aligns with 61803.</p>\n<p><strong>Check:</strong> All 6 bearings flat, none proud of disk. Cap fully down, no gap.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Press bearings evenly: flat wood block + mallet tap; 22 mm socket also works. (Unexpected Maker)</li>\n<li>Push cap fully down. Unexpected Maker's disk bearings were loose because cap did not press them far enough; gearbox wobbled.</li>\n<li>Finish screws by hand; power driver strips plastic. (Unexpected Maker)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Take one <strong>Y gearbox cycloidal disk</strong> (zero-backlash mod: it replaces the stock disk).</li>\n<li>Press 1x <strong>Bearing 61803</strong> into the big centre hole.</li>\n<li>Press 5x <strong>Bearing 688ZZ-4</strong> into the 5 holes around it.</li>\n<li>Put the <strong>Y cyclo bearings cap</strong> on top, on the side shown.</li>\n<li>Screw the cap down with 5x <strong>M3x10</strong> screws (the label says M2.6x5).</li>\n</ol>\n<p>Check: all 6 bearings sit flat. The cap is fully down.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Screws by hand</div>\n<p>Finish the screws by hand. A power driver strips the plastic.</p>\n</div>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 1, "kind": "step", "n": 22, "title": "Check the finished disk", "img": "Attachments/Arctos/web/manual/arctos-step-022.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Look at the rim. Find the number (here \"3\") and the tick marks (here 3 ticks, at the top).</li>\n<li>Build the other two disks the same way (steps 21–22 again for disks 1 and 2).</li>\n</ol>\n<p><strong>Hardware:</strong> for 3 disks in total: 3x 61803, 15x 688ZZ-4, 15x cap screws.</p>\n<p><strong>Check:</strong> You have 3 disks. Disk 1 has 1 tick. Disk 2 has 2 ticks. Disk 3 has 3 ticks. Each cap has 5 screw heads.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Inspect rim: number (here \"3\"), tick marks (here 3 ticks, at top).</li>\n<li>Build other two disks the same way (steps 21–22 again for disks 1 and 2).</li>\n</ol>\n<p><strong>Hardware:</strong> 3 disks total: 3x 61803, 15x 688ZZ-4, 15x cap screws.</p>\n<p><strong>Check:</strong> 3 disks. Disk 1 = 1 tick, disk 2 = 2 ticks, disk 3 = 3 ticks. Each cap has 5 screw heads.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Find the number and the tick marks on the disk rim.</li>\n<li>Build 2 more disks the same way. That is 15x <strong>M3x10</strong> cap screws in all.</li>\n</ol>\n<p>Check: disk 1 has 1 tick, disk 2 has 2, disk 3 has 3.</p>\n<p>Check: the zero-backlash disks may not have the stock numbers and ticks. If yours have none, write 1, 2, 3 on them with a pen as they come off the printer.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 1, "kind": "step", "n": 23, "title": "Stack the disks on the camshaft pieces", "img": "Attachments/Arctos/web/manual/arctos-step-023.webp", "html": "<p><strong>Do (left to right in the picture):</strong></p>\n<ol>\n<li>Start with <strong>YC4</strong> (the piece with the forked tab end).</li>\n<li>Slide on <strong>Y gearbox cycloidal disk 3</strong>.</li>\n<li>Add <strong>YC3</strong>.</li>\n<li>Slide on <strong>disk 2</strong>.</li>\n<li>Add <strong>YC2</strong>.</li>\n<li>Slide on <strong>disk 1</strong>.</li>\n<li>Finish with <strong>YC1</strong> (the piece with the star-shaped end).</li>\n</ol>\n<p><strong>Hardware:</strong> none.</p>\n<p><strong>Orientation:</strong> Each camshaft piece keys into the next. Match the tick marks on the pieces as drawn. Keep each disk facing the same way it faces in the picture. (unsure: I could not read the exact tick count on each camshaft piece in the picture.)</p>\n<p><strong>Check:</strong> After the first cam piece and disk, turn the cam by hand. It must spin. (official 2026 video: add the first camshaft piece, then check that it spins)</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>\"All camshaft parts are marked with notches. Order of assembly is important.\" (3D manual note)</li>\n<li>If the disks go in back to front, the camshaft ends up on the wrong side. (Unexpected Maker, on Z)</li>\n</ul>", "html_pro": "<p><strong>Do (left to right in picture):</strong></p>\n<ol>\n<li><strong>YC4</strong> (forked tab end).</li>\n<li><strong>Y gearbox cycloidal disk 3</strong>.</li>\n<li><strong>YC3</strong>.</li>\n<li><strong>disk 2</strong>.</li>\n<li><strong>YC2</strong>.</li>\n<li><strong>disk 1</strong>.</li>\n<li><strong>YC1</strong> (star-shaped end).</li>\n</ol>\n<p><strong>Hardware:</strong> none.</p>\n<p><strong>Orientation:</strong> Each camshaft piece keys into the next. Match tick marks as drawn. Each disk faces as in picture. (unsure: could not read exact tick count on each camshaft piece in picture.)</p>\n<p><strong>Check:</strong> After first cam piece and disk, turn cam by hand; must spin. (official 2026 video: add first camshaft piece, check it spins)</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>\"All camshaft parts are marked with notches. Order of assembly is important.\" (3D manual note)</li>\n<li>Disks in back to front puts camshaft on wrong side. (Unexpected Maker, on Z)</li>\n</ul>", "checks_pro": [], "html_simple": "<p>Stack the parts left to right as in the picture:</p>\n<ol>\n<li><strong>YC4</strong> (forked tab end).</li>\n<li><strong>Y gearbox cycloidal disk 3</strong>.</li>\n<li><strong>YC3</strong>.</li>\n<li><strong>Y gearbox cycloidal disk 2</strong>.</li>\n<li><strong>YC2</strong>.</li>\n<li><strong>Y gearbox cycloidal disk 1</strong>.</li>\n<li>\n<p><strong>YC1</strong>.</p>\n</li>\n<li>\n<p>Match the notches as drawn.</p>\n</li>\n<li>Stand the stack on the table, YC4 down. Press down on YC1.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">YC1 and YC3 look alike</div>\n<p>YC1 is the longer one: about 32 mm. YC3 is about 26 mm.</p>\n</div>\n<p>Check: Turn the cam by hand. All 3 disks wobble a little. If one stays still, press the stack together again. Rest a fingertip on each disk rim to feel it.</p>\n<p>Check: Nothing turns slower yet. The slow turn starts when the gearbox is closed.</p>", "checks_simple": [], "ts": [94, 10, 15, 11, 17]}, {"stage": 1, "kind": "step", "n": 24, "title": "Lock the disks with one pin", "img": "Attachments/Arctos/web/manual/arctos-step-024.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Line up the small locking hole in all 3 disks. It sits in the notch between two lobes of the cap (red arrow).</li>\n<li>Push 1 x <strong>4 mm dowel pin</strong> through all 3 holes.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 4 mm dowel pin. Use one of the 25 Y gearbox pins.</p>\n<p><strong>Check:</strong> The 3 disks no longer turn against each other. Disk 3 faces you.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>The manual says: keep it in \"until the outer dowel pins are inserted. That will prevent disks from misaligning.\"</li>\n<li>You can also push 5 pins through the 5 small bearings to lock the stack. (designer, in Unexpected Maker's stream)</li>\n<li><strong>Don't forget to pull this pin out later.</strong> (3D manual note) I suggest you pull it just before the last outer pin goes in at step 26, then use it as that last pin. (unsure: this order is my suggestion, not in the manual.)</li>\n</ul>\n<p><img class=\"zoom\" loading=\"lazy\" src=\"Attachments/Arctos/arctos-cycloidal_disk_alignment.jpg\" alt=\"arctos-cycloidal_disk_alignment.jpg\"></p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Align small locking hole in all 3 disks (in notch between two cap lobes, red arrow).</li>\n<li>Push 1 x <strong>4 mm dowel pin</strong> through all 3 holes.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 4 mm dowel pin; one of the 25 Y gearbox pins.</p>\n<p><strong>Check:</strong> 3 disks no longer rotate against each other. Disk 3 faces you.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Manual: keep it in \"until the outer dowel pins are inserted. That will prevent disks from misaligning.\"</li>\n<li>Alternative: 5 pins through the 5 small bearings lock the stack. (designer, in Unexpected Maker's stream)</li>\n<li><strong>Pull this pin out later.</strong> (3D manual note) Suggest pulling it just before last outer pin at step 26 and using it as that pin. (unsure: this order is my suggestion, not in manual.)</li>\n</ul>\n<p><img class=\"zoom\" loading=\"lazy\" src=\"Attachments/Arctos/arctos-cycloidal_disk_alignment.jpg\" alt=\"arctos-cycloidal_disk_alignment.jpg\"></p>\n<p>The disk spikes (lobes) do <strong>not</strong> line up: each disk is turned 1/3 of a lobe (5°) and sits 1.5 mm off-centre, 120° apart. Only the 4.3 mm locking hole lines up.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Line up the small locking hole in all 3 disks (red arrow).</li>\n<li>Push 1x <strong>4 mm dowel pin</strong> through all 3 holes.</li>\n</ol>\n<p>Only the locking hole lines up. The disk spikes do <strong>not</strong> line up.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">This pin comes out again</div>\n<p>At step 26, when the other outer pins are in, it comes out. Then use it as the last pin.</p>\n</div>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 1, "kind": "step", "n": 25, "title": "Put the stack between the covers", "img": "Attachments/Arctos/web/manual/arctos-step-025.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Place the disk stack inside the <strong>Y gearbox L cover</strong> (the big flat ring with fingers, right in the picture).</li>\n<li>Bring the <strong>Y gearbox R cover</strong> (the ring with short prongs, left) to the other side.</li>\n<li>Push 4 x <strong>Y gearbox pin</strong> through the R cover holes, past the disk lobes, into the L cover.</li>\n</ol>\n<p><strong>Hardware:</strong> 4x Y gearbox pin (80 mm). \"(16)\" is a CAD number.</p>\n<p><strong>Orientation:</strong> The fingers of the L cover and the prongs of the R cover interlock around the disks. The YC1 star end points out through the L cover side. (unsure: the picture shows the cam end facing the L cover; check that your star end is reachable from the L-cover side, because the Y pulley drives it.)</p>\n<p><strong>Check:</strong> The two covers close with no gap. The 4 pins slide in with a tight fit.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Line up the dots and small holes on the disks and the covers before you fit the pins and rods. The manual does not say this. (Unexpected Maker)</li>\n<li>The designer said the hardest step is \"snap two cases together and align all the pins correctly\". (Reddit)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Place disk stack inside <strong>Y gearbox L cover</strong> (big flat ring with fingers, right in picture).</li>\n<li>Bring <strong>Y gearbox R cover</strong> (ring with short prongs, left) to other side.</li>\n<li>Push 4 x <strong>Y gearbox pin</strong> through R cover holes, past disk lobes, into L cover.</li>\n</ol>\n<p><strong>Hardware:</strong> 4x Y gearbox pin (80 mm). \"(16)\" is a CAD number.</p>\n<p><strong>Orientation:</strong> L cover fingers and R cover prongs interlock around disks. YC1 star end points out through L cover side. (unsure: picture shows cam end facing L cover; check star end is reachable from L-cover side, since Y pulley drives it.)</p>\n<p><strong>Check:</strong> Covers close, no gap. The 4 pins slide in tight.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Align dots and small holes on disks and covers before fitting pins and rods. Not in manual. (Unexpected Maker)</li>\n<li>Designer: hardest step is \"snap two cases together and align all the pins correctly\". (Reddit)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the disk stack inside the <strong>Y gearbox L cover</strong> (zero-backlash mod).</li>\n<li>Bring the <strong>Y gearbox R cover</strong> (zero-backlash mod) to the other side.</li>\n<li>Line up the dots and small holes on disks and covers.</li>\n<li>Push 4x <strong>Y gearbox pin</strong> through the R cover holes into the L cover.</li>\n</ol>\n<p>The YC1 end points to the L cover.</p>", "checks_simple": [], "ts": [5, 9, 13, 10, 15, 11]}, {"stage": 1, "kind": "step", "n": 26, "title": "Push in the rest of the outer pins and the shaft bearings", "img": "Attachments/Arctos/web/manual/arctos-step-026.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push the rest of the <strong>Y gearbox pins</strong> into the ring of holes. About 21 more are drawn, for 25 in total.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> onto the camshaft end on the R-cover side (left in the picture).</li>\n<li>Press 1 x <strong>Bearing 61803</strong> onto the camshaft end on the L-cover side (right in the picture).</li>\n</ol>\n<p><strong>Hardware:</strong> about 21x Y gearbox pin (could not count exactly; total must be 25), 2x 61803.</p>\n<p><strong>Check:</strong> All 25 pin holes are filled. Each pin is a <strong>tight</strong> fit. A loose pin means slop.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>\"It's easier to insert them when the entire assembly is upside down.\" (3D manual note)</li>\n<li>Pull the locking pin from step 24 when the other 24 pins are in. Use it as the 25th pin. (unsure: my suggestion)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push remaining <strong>Y gearbox pins</strong> into the ring of holes. About 21 more drawn; 25 total.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> onto camshaft end, R-cover side (left in picture).</li>\n<li>Press 1 x <strong>Bearing 61803</strong> onto camshaft end, L-cover side (right in picture).</li>\n</ol>\n<p><strong>Hardware:</strong> about 21x Y gearbox pin (could not count exactly; total must be 25), 2x 61803.</p>\n<p><strong>Check:</strong> All 25 pin holes filled. Each pin <strong>tight</strong>; loose pin = slop.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>\"It's easier to insert them when the entire assembly is upside down.\" (3D manual note)</li>\n<li>Pull step 24 locking pin once other 24 are in; use as 25th. (unsure: my suggestion)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Push in the rest of the <strong>Y gearbox pins</strong>.</li>\n<li>Pull out the locking pin from step 24. Push it back in as the last pin. 25 pins in total.</li>\n<li>Press 1x <strong>Bearing 61803</strong> on the camshaft end, R-cover side.</li>\n<li>Press 1x <strong>Bearing 61803</strong> on the camshaft end, L-cover side.</li>\n</ol>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Upside down</div>\n<p>Pins go in more easily with the gearbox upside down.</p>\n</div>\n<p>Check: every pin hole is filled. Each pin is a tight fit.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 1, "kind": "step", "n": 27, "title": "Big end bearings and through-bolts", "img": "Attachments/Arctos/web/manual/arctos-step-027.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put 1 x <strong>Bearing 61812</strong> on the R-cover end (left).</li>\n<li>Put 1 x <strong>Bearing 61812</strong> on the L-cover end (right).</li>\n<li>Push 6 x <strong>Bolt M5 80mm</strong> through the whole gearbox from the <strong>L-cover side</strong> (right).</li>\n<li>Screw 6 x <strong>Nut M5</strong> onto them on the <strong>R-cover side</strong> (left).</li>\n<li>Tighten them evenly, in a star pattern (opposite bolts in turn).</li>\n</ol>\n<p><strong>Hardware:</strong> 2x 61812, 6x M5x80, 6x M5 nut.</p>\n<p><strong>Check:</strong> Both 61812 bearings sit flat and fully seated. The gearbox does not rock when you squeeze it.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>The designer said only every second bolt is really needed. (Unexpected Maker stream)</li>\n<li>A nut seized and stripped its plastic pocket in one build. Don't over-tighten. (Unexpected Maker)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>1 x <strong>Bearing 61812</strong> on R-cover end (left).</li>\n<li>1 x <strong>Bearing 61812</strong> on L-cover end (right).</li>\n<li>Push 6 x <strong>Bolt M5 80mm</strong> through whole gearbox from <strong>L-cover side</strong> (right).</li>\n<li>6 x <strong>Nut M5</strong> on <strong>R-cover side</strong> (left).</li>\n<li>Tighten evenly in star pattern (opposite bolts in turn).</li>\n</ol>\n<p><strong>Hardware:</strong> 2x 61812, 6x M5x80, 6x M5 nut.</p>\n<p><strong>Check:</strong> Both 61812 flat, fully seated. Gearbox does not rock when squeezed.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Designer: only every second bolt is really needed. (Unexpected Maker stream)</li>\n<li>Nut seized and stripped plastic pocket in one build; don't over-tighten. (Unexpected Maker)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 1x <strong>Bearing 61812</strong> on the R-cover end.</li>\n<li>Put 1x <strong>Bearing 61812</strong> on the L-cover end.</li>\n<li>Push 6x <strong>Bolt M5x80</strong> through from the L-cover side.</li>\n<li>Screw 6x <strong>Nut M5</strong> on at the R-cover side.</li>\n<li>Tighten evenly, opposite bolts in turn.</li>\n</ol>\n<div clas
