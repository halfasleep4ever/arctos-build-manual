i>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Bolt length</div>\n<p>Use M3x15 only. Longer bolts break the sun gear.</p>\n</div>\n<p>Check: the whole gearbox turns smoothly.</p>", "checks_simple": [], "ts": [20, 21, 25, 27, 26]}, {"stage": 5, "kind": "step", "n": 100, "title": "AG output ring", "img": "Attachments/Arctos/web/manual/arctos-step-100.webp", "html": "<ol>\n<li>Turn the gearbox over. The middle planets face you again.</li>\n<li>Take the <strong>AG output ring</strong> (teeth on the inside, a row of small holes on its face).</li>\n<li>Slide it over the front of the middle planets. Its teeth face the gearbox.</li>\n</ol>\n<p><strong>Check:</strong> the ring sits flat against the A core inner rim. It turns by hand.\n<strong>Tip:</strong> UM: his big bearing would not go into the tapered output-ring bore. \"Reprint rather than sand.\" Test-fit the 61812 on the ring now.</p>", "moved": "Paper manual step 100. The paper manual draws step 100 on the page between steps 90 and 91, so it is built in that order.", "html_pro": "<ol>\n<li>Flip gearbox; middle planets face you.</li>\n<li><strong>AG output ring</strong> (inside teeth, row of small holes on face).</li>\n<li>Over front of middle planets; teeth face gearbox.</li>\n</ol>\n<p><strong>Check:</strong> ring flat against A core inner rim; turns by hand.\n<strong>Tip:</strong> UM: big bearing would not enter tapered output-ring bore. \"Reprint rather than sand.\" Test-fit 61812 on ring now.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the gearbox over. The middle planets face you.</li>\n<li>Take the <strong>AG output ring</strong> (teeth inside, small holes on its face).</li>\n<li>Slide it over the middle planets, teeth toward the gearbox.</li>\n<li>Test-fit the 61812 bearing on the ring now. It goes on for good at step 96.</li>\n</ol>\n<p>Check: the ring sits flat on the A core inner rim and turns.</p>", "checks_simple": [], "ts": [2, 3, 18, 19, 22, 23]}, {"stage": 5, "kind": "step", "n": 91, "title": "AG output sun", "img": "Attachments/Arctos/web/manual/arctos-step-091.webp", "html": "<ol>\n<li>Put the <strong>AG output sun</strong> in the centre, between the planets.</li>\n<li>Its plain side (the side with the hole shown in the picture) faces you.</li>\n</ol>\n<p><strong>Check:</strong> it drops in without force.\n<strong>Tip:</strong> 3D manual: \"In some cases the gearbox performs better without output sun gear.\" Keep it in. Remove it only if the box binds.</p>", "html_pro": "<ol>\n<li><strong>AG output sun</strong> in centre between planets.</li>\n<li>Plain side (with the hole shown in picture) toward you.</li>\n</ol>\n<p><strong>Check:</strong> drops in without force.\n<strong>Tip:</strong> 3D manual: \"In some cases the gearbox performs better without output sun gear.\" Keep it; remove only if box binds.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>AG output sun</strong> in the centre between the planets.</li>\n<li>The plain side faces you.</li>\n</ol>\n<p>Check: it drops in without force.</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23, 20]}, {"stage": 5, "kind": "step", "n": 92, "title": "Output planets", "img": "Attachments/Arctos/web/manual/arctos-step-092.webp", "html": "<ol>\n<li>Put on the 4 <strong>BCGR output planetary</strong> gears (drawn: 4).</li>\n<li>Each goes on the matching middle planet. The holes line up straight through.</li>\n<li>Copy the picture: 12 and 6 o'clock holes horizontal, 3 and 9 o'clock holes vertical.</li>\n<li>Match the small <strong>triangle marks</strong> to the picture (section 4).</li>\n<li>Fix with <strong>8x Bolt M3 10mm</strong> (drawn: 8), <strong>2 per gear</strong>, from the front.</li>\n<li>Tighten a little on each bolt in turn.</li>\n</ol>\n<p><strong>Check:</strong> turn the AG input gear by hand. The output ring turns slowly and smoothly.</p>", "html_pro": "<ol>\n<li>4x <strong>BCGR output planetary</strong> (drawn: 4), one per matching middle planet; holes line up straight through.</li>\n<li>Orientation per picture: 12 and 6 o'clock holes horizontal, 3 and 9 o'clock holes vertical.</li>\n<li>Match small <strong>triangle marks</strong> (section 4).</li>\n<li><strong>8x Bolt M3 10mm</strong> (drawn: 8), <strong>2 per gear</strong>, from front.</li>\n<li>Tighten incrementally.</li>\n</ol>\n<p><strong>Check:</strong> turn AG input gear by hand; output ring turns slowly and smoothly.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 4x <strong>BCGR output planetary</strong> on the middle planets.</li>\n<li>Copy the picture: top and bottom gears have their holes horizontal, left and right gears vertical.</li>\n<li>Match the small <strong>triangle marks</strong> to the picture.</li>\n<li>Fix them with 8x <strong>Bolt M3 10mm</strong>, 2 per gear, from the front.</li>\n<li>Tighten each bolt a little in turn.</li>\n</ol>\n<p>Check: turning the AG input gear turns the output ring smoothly.</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23, 20]}, {"stage": 5, "kind": "step", "n": 93, "title": "Spin test, then bring it to the elbow", "img": "Attachments/Arctos/web/manual/arctos-step-093.webp", "html": "<ol>\n<li><strong>Spin test now, on the bench.</strong> Turn the AG input gear many times.</li>\n<li>A good gearbox turns with very little effort. It has no hard spot.</li>\n<li>Hold the gearbox in front of the elbow as in the picture.</li>\n</ol>\n<p><strong>Check:</strong> if it binds at all, fix it now (section 4). Alberto: \"If it binds at all … that motor's not going to be able to move it.\"\n<strong>Tip:</strong> Grease only after it is fully built. Docs: vaseline or graphite grease. (unsure: the designer said in UM's chat that \"no grease is needed\".)</p>", "html_pro": "<ol>\n<li><strong>Bench spin test:</strong> turn AG input gear many times.</li>\n<li>Should turn with minimal effort, no hard spot.</li>\n<li>Hold gearbox in front of elbow as in picture.</li>\n</ol>\n<p><strong>Check:</strong> any binding: fix now (section 4). Alberto: \"If it binds at all … that motor's not going to be able to move it.\"\n<strong>Tip:</strong> grease only after fully built; docs: vaseline or graphite grease. (unsure: designer said in UM's chat \"no grease is needed\".)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the <strong>AG input gear</strong> many times by hand.</li>\n<li>It must turn easily, with no hard spot.</li>\n<li>If it binds, fix it now, before it goes on the elbow.</li>\n</ol>", "checks_simple": [], "ts": [72, 33, 54]}, {"stage": 5, "kind": "step", "n": 94, "title": "Bolt the gearbox to the elbow", "img": "Attachments/Arctos/web/manual/arctos-step-094.webp", "html": "<ol>\n<li>Offer the gearbox to the elbow. The AG input gear must mesh with the AG motor gear below.</li>\n<li>If the two gears do not line up face to face, loosen the grub screw (step 82). Slide the motor gear to line up. Retighten the grub screw firmly.</li>\n<li>Fit <strong>3x Bolt M3 20mm</strong> (drawn: 3) through the mounting ears of the A core inner into the elbow. They go in from the <strong>front</strong>.</li>\n<li>The picture shows one bolt at the top, one on the left side, and one at the bottom.</li>\n</ol>\n<p><strong>Check:</strong> turn the motor shaft by hand (or the gearbox output). Everything turns. There is a little play between the motor gear and input gear, not zero.</p>", "html_pro": "<ol>\n<li>Offer gearbox to elbow; AG input gear meshes with AG motor gear below.</li>\n<li>If gears do not line up face to face: loosen grub screw (step 82), slide motor gear to align, retighten firmly.</li>\n<li><strong>3x Bolt M3 20mm</strong> (drawn: 3) through A core inner mounting ears into elbow, from the <strong>front</strong>.</li>\n<li>Picture: one top, one left side, one bottom.</li>\n</ol>\n<p><strong>Check:</strong> turn motor shaft (or gearbox output) by hand; all turns. Small play between motor gear and input gear, not zero.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Offer the gearbox to the elbow. The <strong>AG input gear</strong> meshes with the <strong>AG motor gear</strong> below.</li>\n<li>If they do not line up, loosen the grub screw (step 82). Slide the motor gear, then tighten it firmly.</li>\n<li>Fit 3x <strong>Bolt M3 20mm</strong> from the <strong>front</strong>, one in each of the 3 ears round the gearbox. The 3D view shows which ears.</li>\n</ol>\n<p>Check: everything turns, with a little play between the gears.</p>", "checks_simple": [], "ts": [72, 33, 26]}, {"stage": 5, "kind": "step", "n": 95, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-095.webp", "html": "<ol>\n<li>The gearbox is fixed to the elbow. You can see the bolt heads at the top and on the right ear.</li>\n</ol>\n<p><strong>Check:</strong> the gearbox does not rock on the elbow.</p>", "html_pro": "<ol>\n<li>Gearbox fixed to elbow; bolt heads visible at top and on right ear.</li>\n</ol>\n<p><strong>Check:</strong> no rocking on elbow.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: 3 bolt heads in the ears. The gearbox does not rock.</p>", "checks_simple": [], "ts": [26, 0, 54]}, {"stage": 5, "kind": "step", "n": 96, "title": "Big bearing and A core outer", "img": "Attachments/Arctos/web/manual/arctos-step-096.webp", "html": "<ol>\n<li>Take <strong>1x Bearing 61812</strong> (the \"(1) (1)\" in the label is a part number).</li>\n<li>Push it straight onto the gearbox's front ring. Keep it square.</li>\n<li>Slide the <strong>A core outer</strong> over the bearing.</li>\n<li>The <strong>\"▲A\"</strong> mark on the A core outer goes at the <strong>top</strong>, as in the picture. (unsure: which mark it lines up with.)</li>\n</ol>\n<p><strong>Check:</strong> the A core outer turns smoothly on the bearing. The bearing sits fully down.\n<strong>Tip:</strong> UM: if it does not go in straight, reprint. Sanding made his stick.</p>", "html_pro": "<ol>\n<li><strong>1x Bearing 61812</strong> (\"(1) (1)\" in label is a part number); push straight onto gearbox front ring, square.</li>\n<li><strong>A core outer</strong> over bearing.</li>\n<li><strong>\"▲A\"</strong> mark at <strong>top</strong> per picture. (unsure: which mark it lines up with.)</li>\n<li>Done.</li>\n</ol>\n<p><strong>Check:</strong> A core outer turns smoothly on bearing; bearing fully down.\n<strong>Tip:</strong> UM: if it does not go in straight, reprint; sanding made his stick.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take 1x <strong>Bearing 61812</strong>.</li>\n<li>Push it straight onto the gearbox's front ring.</li>\n<li>Slide the <strong>A core outer</strong> over it.</li>\n<li>The <strong>\"▲A\"</strong> mark goes at the <strong>top</strong>.</li>\n</ol>\n<p>Check: the bearing is fully down. The A core outer turns smoothly.</p>", "checks_simple": [], "ts": [2, 3, 54]}, {"stage": 5, "kind": "step", "n": 97, "title": "A core", "img": "Attachments/Arctos/web/manual/arctos-step-097.webp", "html": "<ol>\n<li>Take the <strong>A core</strong> (the flat frame with a big centre hole).</li>\n<li>Hold it in front of the gearbox. The square lug block goes at <strong>top-left</strong>, the other at <strong>bottom-right</strong>, as in the picture.</li>\n</ol>\n<p><strong>Check:</strong> its holes line up with the holes on the front of the gearbox.</p>", "html_pro": "<ol>\n<li><strong>A core</strong> (flat frame, big centre hole).</li>\n<li>In front of gearbox; square lug block <strong>top-left</strong>, the other <strong>bottom-right</strong>, per picture.</li>\n</ol>\n<p><strong>Check:</strong> holes align with gearbox front holes.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>A core</strong>.</li>\n<li>Hold it in front of the gearbox: one square lug block <strong>top-left</strong>, the other <strong>bottom-right</strong>.</li>\n</ol>\n<p>Check: its holes line up with the gearbox holes.</p>", "checks_simple": [], "ts": [54, 18, 58]}, {"stage": 5, "kind": "step", "n": 98, "title": "Bolt the A core", "img": "Attachments/Arctos/web/manual/arctos-step-098.webp", "html": "<ol>\n<li>Fit <strong>6x Bolt M3 20mm</strong> (drawn: 6). They go in from the <strong>front</strong>.</li>\n<li>Picture positions: 2 at the top, 1 on the left, 1 on the right, 2 at the bottom.</li>\n<li>UM \"golden rule\": <strong>press the A core against the bearing while you tighten.</strong> That removes the play.</li>\n<li>Tighten in a cross pattern.</li>\n</ol>\n<p><strong>Check:</strong> the A core turns with the gearbox. Wiggle the A core. There should be little or no free play.\n<strong>Note:</strong> UM said \"M3x20 is too long here\" at one point in his stream. His caption is garbled. (unsure which bolt he meant. Use the M3x20 shown, and stop if a bolt bottoms out.)</p>", "html_pro": "<ol>\n<li><strong>6x Bolt M3 20mm</strong> (drawn: 6) from the <strong>front</strong>.</li>\n<li>Picture: 2 top, 1 left, 1 right, 2 bottom.</li>\n<li>UM \"golden rule\": <strong>press A core against bearing while tightening</strong> to remove play.</li>\n<li>Tighten in cross pattern.</li>\n</ol>\n<p><strong>Check:</strong> A core turns with gearbox; wiggle it: little or no free play.\n<strong>Note:</strong> UM said \"M3x20 is too long here\" once in his stream; caption garbled. (unsure which bolt he meant. Use M3x20 shown; stop if a bolt bottoms out.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Fit 6x <strong>Bolt M3 20mm</strong> from the front: 2 top, 1 left, 1 right, 2 bottom.</li>\n<li>Press the A core against the bearing while you tighten.</li>\n<li>Tighten in a cross pattern.</li>\n<li>A axis stiffer mod: put the <strong>A axis bearing block</strong> into the hollow front of the A core, over the M5 bolt end, on the 4 small holes. Fix it with 4x countersunk <strong>M3x10</strong> screws.</li>\n<li>Press 1x <strong>Bearing 61803</strong> into the block.</li>\n<li>Push the <strong>A axis inner ring</strong> into the bearing, over the bolt, hex pocket facing you.</li>\n<li>Put the <strong>M5 nylon lock nut</strong> on the bolt end, sunk in the hex pocket.</li>\n</ol>\n<p>Check: wiggle the A core. There is little or no free play.</p>", "checks_simple": [], "ts": [2, 3, 26]}, {"stage": 5, "kind": "step", "n": 99, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-099.webp", "html": "<ol>\n<li>The A core is bolted on. The output sun shows through the centre hole.</li>\n<li>Count the bolt heads: 6.</li>\n</ol>\n<p><strong>Check (final):</strong> turn the A core by hand. It rolls smoothly. The motor shaft turns with it, fast. No wire is pulled or pinched. Then go on to the B axis (step 101).</p>", "html_pro": "<ol>\n<li>A core bolted on; output sun visible through centre hole.</li>\n<li>Bolt heads: 6.</li>\n</ol>\n<p><strong>Check (final):</strong> turn A core by hand; rolls smoothly; motor shaft turns with it, fast; no wire pulled or pinched. Then B axis (step 101).</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the A core is on with 6 bolt heads. Turn it by hand. It rolls smoothly and no wire is pinched.</p>", "checks_simple": [], "ts": [72, 33, 26, 70, 71]}, {"stage": 5, "kind": "step", "n": 155, "title": "Fix a KYD003 endstop under the A axis at the place the red arrow…", "img": "Attachments/Arctos/web/manual/arctos-step-155.webp", "html": "<p>Fix a KYD003 endstop under the A axis at the place the red arrow shows, with M2 screws. Parts: KYD003 endstop. Hardware: M2 screws. Note: \"M2 screws\"</p>", "moved": "Paper manual step 155. In the paper manual this is in the Limit switches section near the end (steps 146–159). It is done here, right after this joint, while you can still reach the spot.", "html_pro": "<p>Fix KYD003 endstop under A axis at red-arrow location with M2 screws. Parts: KYD003 endstop. Hardware: M2 screws. Note: \"M2 screws\"</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix the A sensor in its pocket under the A axis (red arrow).</li>\n<li>Use <strong>M2 screws</strong>.</li>\n</ol>\n<div class=\"callout note\">\n<div class=\"callout-title\">Which sensor</div>\n<p>The picture says KYD003. A uses a <strong>WSH231</strong>. If its holes do not line up, stick it on with double-sided foam tape or hot glue.</p>\n</div>", "checks_simple": [], "ts": [87, 91, 58, 59, 61, 64]}, {"stage": 5, "kind": "step", "n": 156, "title": "Result: the A endstop is fixed in its pocket", "img": "Attachments/Arctos/web/manual/arctos-step-156.webp", "html": "<p>Result: the A endstop is fixed in its pocket. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: A endstop fixed in its pocket. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the A endstop sits fixed in its pocket.</p>", "checks_simple": [], "ts": [87, 91, 58, 59, 61, 64]}, {"stage": 5, "kind": "step", "n": 157, "title": "Put a magnet in the hole the red arrow shows, and another one on…", "img": "Attachments/Arctos/web/manual/arctos-step-157.webp", "html": "<p>Put a magnet in the hole the red arrow shows, and another one on the other side of the robot. The limit switch reads these magnets. Parts: none labelled. Hardware: magnet. Note: \"Place magnet here and on the other side of the robot. They will be read by the limit shitch\" (the printed note says \"shitch\"; it means \"switch\")</p>", "html_pro": "<p>Magnet in red-arrow hole, another on the other side of the robot; limit switch reads them. Parts: none labelled. Hardware: magnet. Note: \"Place magnet here and on the other side of the robot. They will be read by the limit shitch\" (printed \"shitch\" = \"switch\")</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put a <strong>magnet</strong> in the hole at the red arrow.</li>\n<li>Put another <strong>magnet</strong> in the same spot on the other side of the robot.</li>\n</ol>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 5, "kind": "wire", "key": "a-sensor", "title": "Connect the A limit sensor", "img": null, "html": "<ol>\n<li>The sensor sits in its pocket <strong>under the A axis</strong> (step 155), with M2 screws.</li>\n<li>Connect it to the \"A LIMIT\" lead.</li>\n<li>The magnet goes in the hole shown at step 157, <strong>and another one on the other side</strong>.</li>\n<li>The picture says KYD003, but the official wiring diagram uses <strong>1 WSH231</strong>: <strong>N_OUT → En</strong> (home), <strong>S_OUT → DIR</strong>.</li>\n</ol>", "ov": ["li-A"], "bench": ["lim", "sensor", "com"], "drv": "42D", "grip": null, "conn": [["from the sensor **3-26V**", "**+5V**", "red", "5 V from the driver, on the \"A LIMIT\" lead", "+5V", "3-26V", "", null, "Red"], ["from the sensor **GND**", "**GND**", "blk", "on the \"A LIMIT\" lead", "GND", "GND", "", null, "Black"], ["from the sensor **N_OUT**", "**En**", "blu", "home, north face", "En", "N_OUT home", "", null, "Blue"], ["from the sensor **S_OUT**", "**Dir**", "blu", "", "Dir", "S_OUT", "", null, "Blue"]], "conn_title": null, "sen": "wsh", "sen_names": null, "wire": ["sensor"], "checks": [], "html_pro": "<ol>\n<li>Sensor in pocket <strong>under A axis</strong> (step 155), M2 screws.</li>\n<li>Connect to \"A LIMIT\" lead.</li>\n<li>Magnet in hole shown at step 157, <strong>and another on the other side</strong>.</li>\n<li>Picture says KYD003; docs say A uses <strong>WSH231</strong>. Use what is in your kit.</li>\n</ol>", "checks_pro": [], "html_simple": "<p><strong>On the A 42D:</strong> sensor 5 V = left-hand block (+5V, GND). Signals = right-hand block (En, Dir).</p>\n<ul>\n<li>Fix the sensor in its pocket under the A axis with <strong>M2 screws</strong> (step 155).</li>\n<li>A uses 1 <strong>WSH231</strong> board (the picture shows a KYD003).</li>\n<li>Check there is room for the plugs between the pins and the motor. If not, bend the pins flat or solder the 4 wires to them.</li>\n</ul>\n<ol>\n<li><strong>Red</strong> from the sensor <strong>3-26V</strong> → <strong>+5V</strong> (5 V from the driver, on the \"A LIMIT\" lead)</li>\n<li><strong>Black</strong> from the sensor <strong>GND</strong> → <strong>GND</strong> (on the \"A LIMIT\" lead)</li>\n<li><strong>Blue</strong> from the sensor <strong>N_OUT</strong> → <strong>En</strong> (home, north face)</li>\n<li><strong>Blue</strong> from the sensor <strong>S_OUT</strong> → <strong>Dir</strong></li>\n</ol>\n<ul>\n<li>Magnets: one in the hole from step 157, one on the other side.</li>\n</ul>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Sensor power = 5 V from the driver</div>\n<p>Never connect a sensor to the 24 V wires. That burns it out.</p>\n</div>", "checks_simple": [], "ts": [62, 54, 85, 63, 87, 91]}, {"stage": 5, "kind": "test", "key": "a-test", "title": "Test A", "img": null, "html": "", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["The gearbox turned freely before the motor drove it (step 93).", "Jog A ±10°, then home. It stops at the sensor.", "Roll A by hand. The wrist wires don't pull tight."], "html_pro": "", "checks_pro": ["Gearbox turned freely before motor drove it (step 93).", "Jog A ±10°, then home; stops at sensor.", "Roll A by hand; wrist wires not taut."], "html_simple": "", "checks_simple": ["The gearbox turned freely before the motor drove it (step 93).", "Jog A ±10°, then home. It stops at the sensor.", "Roll A by hand. The wrist wires do not pull tight."], "ts": [54, 18, 58, 70]}, {"stage": 6, "kind": "test", "key": "w-before", "title": "Before you build the wrist", "img": null, "html": "<div class=\"callout important\">\n<div class=\"callout-title\">B and C work as a pair</div>\n<p>The wrist is a <strong>differential</strong>. Both motors the same way = one motion. Opposite ways = the other. So you always home and move B and C together.</p>\n</div>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["8 planets printed for the wrist (4 per side).", "Wrist gears sorted into one matched set per side. Don't mix L and R.", "Gear scale tested (99 % worked for one builder; for another, 100 % fixed tilting gears).", "You know the BR side is the mirror image of steps 107–140."], "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">B and C work as a pair</div>\n<p>Wrist is a <strong>differential</strong>: both motors same direction = one motion, opposite = the other. Always home and move B and C together.</p>\n</div>", "checks_pro": ["8 planets printed for wrist (4 per side).", "Wrist gears sorted into one matched set per side; no L/R mixing.", "Gear scale tested (99 % worked for one builder; 100 % fixed tilting gears for another).", "BR side is the mirror of steps 107–140."], "html_simple": "<div class=\"callout important\">\n<div class=\"callout-title\">B and C work as a pair</div>\n<p>Always home and move B and C together.</p>\n</div>\n<p>The BR side is the mirror image of steps 107–140.</p>", "checks_simple": ["8 wrist planets printed (4 per side).", "Gears sorted into one set per side. L and R not mixed.", "Gear scale tested (99 % or 100 %)."], "ts": [18, 28, 58, 70]}, {"stage": 6, "kind": "wire", "key": "BC-setup", "title": "Set up the B and C driver on the table", "img": null, "html": "<p>Do this before you build the wrist. Do it twice. It is the same job as the X driver (start of the X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>B and C</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 23 mm (two of them)</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x25</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>5 (B) and 6 (C)</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1200 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>B: 2x KY-003, <strong>Top</strong> = home. C: 1x WSH231</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with a meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue it to the centre of the shaft end. Let it dry. Fit the driver with the M3x25 bolts.</li>\n<li><strong>Power:</strong> check the polarity with a meter, then + to V+ and − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on the shaft. Set the menu like X, but <strong>CanID 5 (B) and 6 (C)</strong> and <strong>Ma about 1200 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on the bus.</li>\n<li><strong>Sensors:</strong> En = home, Dir = the other one. These only work after the <strong>remap and the COM jumper</strong> (same as Z): <code>05 9E 01 A4</code> (B), <code>06 9E 01 A5</code> (C).</li>\n</ol>", "ov": null, "bench": ["coil", "pwr", "can", "lim", "sensor", "com"], "drv": "42D", "grip": null, "conn": [["motor wire", "**A+**", "grn", "coil 1", "A+", null, "", null, "Green"], ["motor wire", "**A−**", "blk", "coil 1", "A−", null, "", null, "Black"], ["motor wire", "**B+**", "blu", "coil 2", "B+", null, "", null, "Blue"], ["motor wire", "**B−**", "red", "coil 2", "B−", null, "", null, "Red"], ["from the bench supply **+V**", "**V+**", "red", "table test", "V+", "supply +V", "tmp", null, "Red"], ["from the bench supply **−V**", "**Gnd**", "blk", "table test", "Gnd", "supply −V", "tmp", null, "Black"], ["from CANable **H**", "**CANH**", "yel", "table test, only this driver on the CANable", "CANH", "CANable H", "tmp", null, "Yellow"], ["from CANable **L**", "**CANL**", "grn", "table test", "CANL", "CANable L", "tmp", null, "Green"], ["short wire from **COM**", "**+5V**", "red", "without it, homing never stops at the sensor", "COM~+5V", "COM → +5V", "", null, "Red"]], "conn_title": null, "sen": "ky", "sen_names": ["Top", "Bottom"], "wire": ["coil", "power", "can", "sensor"], "checks": [], "html_pro": "<p>Before wrist build; do twice. Same job as X driver (start of X stage) with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>B and C</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 23 mm (two of them)</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x25</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>5 (B) and 6 (C)</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1200 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>B: 2x KY-003, <strong>Top</strong> = home. C: 1x WSH231</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with a meter (each under 10 Ω); coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue to centre of shaft end; dry; fit driver with M3x25 bolts.</li>\n<li><strong>Power:</strong> check polarity with meter, then + to V+, − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on shaft. Menu as X, but <strong>CanID 5 (B) and 6 (C)</strong>, <strong>Ma about 1200 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L; only this driver on the bus.</li>\n<li><strong>Sensors:</strong> En = home, Dir = the other. Work only after <strong>remap and COM jumper</strong> (same as Z): <code>05 9E 01 A4</code> (B), <code>06 9E 01 A5</code> (C).</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Do this twice (B, then C), like the X driver, with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>B and C</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 23 mm (two of them)</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x25</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>5 (B) and 6 (C)</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1200 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>B: 2x KY-003, <strong>Top</strong> = home. C: 1x WSH231</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>On the 42D:</strong> power = right-hand block, top (V+, Gnd). CAN = left-hand block, bottom (CANH, CANL). Sensor 5 V = left-hand block, top (+5V, GND). Sensor signals = right-hand block (En, Dir). Motor = blue plug on the top edge.</p>\n<ul>\n<li>Find the 2 coil pairs with the meter (each under 10 Ω).</li>\n<li>Superglue the magnet to the centre of the shaft end. Let it dry. Fit the driver with its encoder bolts (M3x25).</li>\n</ul>\n<ol>\n<li><strong>Green</strong> motor wire → <strong>A+</strong> (coil 1)</li>\n<li><strong>Black</strong> motor wire → <strong>A−</strong> (coil 1)</li>\n<li><strong>Blue</strong> motor wire → <strong>B+</strong> (coil 2)</li>\n<li><strong>Red</strong> motor wire → <strong>B−</strong> (coil 2)</li>\n</ol>\n<ul>\n<li>Meter check: the bench supply <strong>+V</strong> and <strong>−V</strong> the right way round.</li>\n</ul>\n<ol start=\"5\">\n<li><strong>Red</strong> from the bench supply <strong>+V</strong> → <strong>V+</strong> (table test)</li>\n<li><strong>Black</strong> from the bench supply <strong>−V</strong> → <strong>Gnd</strong> (table test)</li>\n<li><strong>Yellow</strong> from CANable <strong>H</strong> → <strong>CANH</strong> (table test, only this driver on the CANable)</li>\n<li><strong>Green</strong> from CANable <strong>L</strong> → <strong>CANL</strong> (table test)</li>\n</ol>\n<ul>\n<li><strong>Cal</strong> with nothing on the shaft. Menu like X, but <strong>CanID 5 (B) and 6 (C)</strong> and <strong>Ma about 1200 mA</strong>.</li>\n<li>Send the remap: <code>05 9E 01 A4</code> (B), <code>06 9E 01 A5</code> (C).</li>\n</ul>\n<ol start=\"9\">\n<li><strong>Red</strong> short wire from <strong>COM</strong> → <strong>+5V</strong> (without it, homing never stops at the sensor)</li>\n</ol>\n<ul>\n<li>\n<p>To test homing, hold the sensors on their pins: B Top <strong>S → En</strong>, Bottom <strong>S → Dir</strong>. C <strong>N_OUT → En</strong>, <strong>S_OUT → Dir</strong>. Sensor + → <strong>+5V</strong>, − → <strong>GND</strong>.</p>\n</li>\n<li>\n<p>Take the table-test wires off again before this driver goes in.</p>\n</li>\n</ul>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Reversed power destroys the driver</div>\n<p>Red = +, black = −. Check three times with the meter.</p>\n</div>", "checks_simple": [], "ts": [62, 54, 85, 63, 87, 91]}, {"stage": 6, "kind": "test", "key": "BC-check", "title": "Test the B and C driver before it goes in", "img": null, "html": "<p>Same tests as X. Fix anything now: the driver is hard to reach later.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["\"Cal success\", and the settings survive a power cycle.", "It answers on ID 5 (B) and 6 (C). Read encoder (<code>31</code>) changes when you turn the shaft.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): it stops when you trigger the home sensor by hand."], "html_pro": "<p>Same tests as X. Fix now; driver is hard to reach later.</p>", "checks_pro": ["\"Cal success\"; settings survive power cycle.", "Answers on ID 5 (B) and 6 (C). Read encoder (<code>31</code>) changes with shaft turn.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): stops when home sensor is triggered by hand."], "html_simple": "<p>Same tests as X. Fix problems now.</p>", "checks_simple": ["\"Cal success\", and the settings survive a power cycle.", "It answers on ID 5 (B) and 6 (C). Read encoder (<code>31</code>) changes when you turn the shaft.", "Each sensor LED lights with its magnet face. Home (<code>91</code>) stops when you trigger the home sensor by hand."], "ts": [18, 28, 58, 70]}, {"stage": 6, "kind": "step", "n": 101, "title": "Bearings into the B core", "img": "Attachments/Arctos/web/manual/arctos-step-101.webp", "html": "<ol>\n<li>Find the <strong>B core</strong>. It is the U-shaped part with \"B\" and \"C\" moulded on top.</li>\n<li>Press one <strong>Bearing 61803</strong> into the round hole on each side wall. Drawn: 2.</li>\n<li>Push them in straight and fully flat.</li>\n</ol>\n<p><strong>Check:</strong> both bearings sit flush. Each inner ring turns freely with a finger.</p>", "html_pro": "<ol>\n<li><strong>B core</strong> (U-shaped, \"B\" and \"C\" moulded on top).</li>\n<li>Press <strong>Bearing 61803</strong> into the round hole in each side wall. Drawn: 2.</li>\n<li>Seat straight and flat.</li>\n</ol>\n<p><strong>Check:</strong> both flush; inner rings turn freely by finger.</p>", "checks_pro": [], "html_simple": "<div class=\"callout note\">\n<div class=\"callout-title\">BR side first</div>\n<p>Picture 101 shows the BR side already on the forearm. Build it first, like steps 107–140 but mirror image, with the C motor (CAN ID 6). The 3D shows it part by part: <strong>BR motor holder</strong>, <strong>BCGR motor gear</strong> with its <strong>GT2B5W6</strong>, <strong>BR core</strong>, <strong>BC pulley</strong> (HTD 5M 38T, rigid diff mod) with 1x <strong>Bearing 61803</strong> in its outer recess and a <strong>BC pulley cap</strong> (the M5 nut of the cap goes in it too), 4x <strong>BCGR middle planetary</strong>, <strong>BCGR input sun</strong>, 4x <strong>BCGR input planetary</strong>, <strong>BCGR output sun</strong>, <strong>BCGR outer ring</strong> (HTD pulley mod), 4x <strong>BCGR output planetary</strong>, <strong>BC belt 2</strong> (HTD 5M, 9 mm x 450 mm), 2x <strong>GT2 idler W6</strong>. Bolts and nuts as in those steps.</p>\n</div>\n<ol>\n<li>Find the 2 parts of the <strong>B core</strong> (rigid diff mod): <strong>B core 1</strong> (U-shaped, \"B\" and \"C\" on top) and <strong>B core 2</strong> (the BL side wall).</li>\n<li>Press 1x <strong>Bearing 61803</strong> into the round hole of each part (2x in all).</li>\n<li>Push them in straight and flat.</li>\n</ol>\n<p>Check: both sit flush and turn freely.</p>", "checks_simple": [], "ts": [2, 3, 32]}, {"stage": 6, "kind": "step", "n": 102, "title": "Close view", "img": "Attachments/Arctos/web/manual/arctos-step-102.webp", "html": "<ol>\n<li>Same as step 101, seen closer. Nothing new to fit.</li>\n</ol>", "html_pro": "<ol>\n<li>Step 101, close view. Nothing new to fit.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: one bearing in each side wall of the B core.</p>", "checks_simple": [], "ts": [18, 28, 58]}, {"stage": 6, "kind": "step", "n": 103, "title": "B bevel gear L and its nuts", "img": "Attachments/Arctos/web/manual/arctos-step-103.webp", "html": "<ol>\n<li>Find <strong>B bevel gear L</strong>. Its flat face has 3 hexagon pockets.</li>\n<li>Press one <strong>Nut M3</strong> into each pocket. Drawn: 3.</li>\n<li>Put gear L inside the B core, on the side wall that faces the <strong>BR core</strong>.</li>\n<li>The teeth point <strong>inward</strong>, toward the middle of the B core. The nut face also faces inward.</li>\n<li>Its hub sits in that wall's 61803 bearing.</li>\n</ol>\n<p><strong>Check:</strong> the 3 nuts stay in their pockets. A drop of superglue or a bit of tape helps if they fall out.</p>\n<p>Tip: these nuts take the bolts from the BR timing pulley later. (unsure: bolt size; not drawn.)</p>", "html_pro": "<ol>\n<li><strong>B bevel gear L</strong>: 3 hex pockets on the flat face.</li>\n<li>Press <strong>Nut M3</strong> into each pocket. Drawn: 3.</li>\n<li>Place gear L in the B core, on the side wall facing the <strong>BR core</strong>.</li>\n<li>Teeth <strong>inward</strong>, toward the B core middle; nut face also inward.</li>\n<li>Hub sits in that wall's 61803 bearing.</li>\n</ol>\n<p><strong>Check:</strong> 3 nuts stay in their pockets. Superglue or tape if they fall out.</p>\n<p>Tip: these nuts take the BR timing pulley bolts later. (unsure: bolt size; not drawn.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Find <strong>B bevel gear L</strong> (rigid diff mod, helical teeth). It has no nut pockets: no nuts here.</li>\n<li>Press 1x <strong>Bearing 61803</strong> into the round pocket in its tooth face.</li>\n<li>Put its hub into the bearing of <strong>B core 2</strong> (the BL side wall). Teeth point <strong>inward</strong>.</li>\n</ol>\n<p>Check: the gear turns freely in B core 2.</p>", "checks_simple": [], "ts": [2, 3, 32, 26]}, {"stage": 6, "kind": "step", "n": 104, "title": "B bevel gear R", "img": "Attachments/Arctos/web/manual/arctos-step-104.webp", "html": "<ol>\n<li>Find <strong>B bevel gear R</strong>. It has a round shaft with 3 holes in its end.</li>\n<li>Pass it into the open middle of the B core.</li>\n<li>Push its shaft out through the bearing in the <strong>other</strong> wall (the BL side). Step 105 shows the shaft end sticking out.</li>\n<li>Teeth point inward, facing gear L.</li>\n</ol>\n<p><strong>Check:</strong> gear R's shaft turns in the bearing without rubbing the wall.</p>", "html_pro": "<ol>\n<li><strong>B bevel gear R</strong> (round shaft, 3 holes in the end).</li>\n<li>Pass into the open middle of the B core.</li>\n<li>Shaft out through the bearing in the <strong>other</strong> wall (BL side). Step 105 shows the shaft end protruding.</li>\n<li>Teeth inward, facing gear L.</li>\n</ol>\n<p><strong>Check:</strong> gear R shaft turns in the bearing, no wall rub.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Find <strong>B bevel gear R</strong> (rigid diff mod, round shaft, 3 holes in its end).</li>\n<li>Press 1x <strong>Bearing 61803</strong> into the round pocket in its tooth face.</li>\n<li>Pass it into the open middle of <strong>B core 1</strong>. Push its shaft out through the bearing in the BR side wall. Teeth point inward.</li>\n<li>Push one end of the <strong>Bevel gears free shaft</strong> into the bearing in gear R.</li>\n</ol>\n<p>Check: the shaft turns without rubbing.</p>", "checks_simple": [], "ts": [2, 3, 32]}, {"stage": 6, "kind": "step", "n": 105, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-105.webp", "html": "<ol>\n<li>Both side bevel gears now face each other inside the B core.</li>\n<li>The 3-hole shaft end of gear R sticks out on the BL side.</li>\n</ol>\n<p><strong>Check:</strong> spin each bevel gear by hand. Each turns freely in its own bearing. They do not mesh with each other directly. The C bevel gear joins them later (step 142).</p>\n<p>(unsure: the old caption said gear L and R teeth \"meet\". In the picture they face each other across the gap. They only connect through the C gear.)</p>", "html_pro": "<ol>\n<li>Both side bevel gears face each other inside the B core.</li>\n<li>Gear R's 3-hole shaft end protrudes on the BL side.</li>\n</ol>\n<p><strong>Check:</strong> spin each bevel gear by hand; each turns freely in its own bearing. No direct mesh between them. The C bevel gear joins them later (step 142).</p>\n<p>(unsure: old caption said gear L and R teeth \"meet\". In the picture they face each other across the gap and connect only through the C gear.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Rigid diff mod: put <strong>B core 2</strong> (with gear L) onto B core 1. The free end of the free shaft goes into the bearing in gear L.</li>\n<li>Fix B core 2 with 2x <strong>Bolt M3x10</strong> (counterbored holes).</li>\n</ol>\n<p>Check it matches the picture: gears L and R face each other. Each gear turns freely.</p>", "checks_simple": [], "ts": [2, 3, 32]}, {"stage": 6, "kind": "step", "n": 106, "title": "B limit magnet", "img": "Attachments/Arctos/web/manual/arctos-step-106.webp", "html": "<ol>\n<li>Press one 3x3 <strong>magnet</strong> into the small hole on the top corner of the B core (red arrow).</li>\n<li>Glue it if it is loose.</li>\n</ol>\n<p><strong>Check:</strong> the magnet is flush and does not stick out to rub anything.</p>\n<p>Tip: the B limit sensors (step 158) read this magnet. \"BC min magnet / BC max magnet … is read by this sensor.\" [3D] Mark which pole faces out. Unexpected Maker glued magnets in the wrong way round and had to reprint. [UM]</p>", "html_pro": "<ol>\n<li>Press 3x3 <strong>magnet</strong> into the small hole on the B core top corner (red arrow).</li>\n<li>Glue if loose.</li>\n</ol>\n<p><strong>Check:</strong> flush, no protrusion or rubbing.</p>\n<p>Tip: B limit sensors (step 158) read this magnet. \"BC min magnet / BC max magnet … is read by this sensor.\" [3D] Mark which pole faces out; Unexpected Maker glued magnets backwards and had to reprint. [UM]</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Press 1x 3x3 <strong>magnet</strong> into the small hole on the top corner of the B core (red arrow).</li>\n<li>Glue it if it is loose.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Magnet pole</div>\n<p>Mark which pole faces out before you glue it.</p>\n</div>\n<p>Check: the magnet is flush.</p>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 6, "kind": "step", "n": 107, "title": "Bearing into the BL motor holder", "img": "Attachments/Arctos/web/manual/arctos-step-107.webp", "html": "<ol>\n<li>Find the <strong>BL motor holder</strong>. It is moulded \"BLMH\" and \"ID5\".</li>\n<li>Press one <strong>Bearing 61803</strong> into its round hole (the upper hole of the figure-8 opening). Drawn: 1.</li>\n</ol>\n<p><strong>Check:</strong> the bearing is flat and turns freely.</p>", "html_pro": "<ol>\n<li><strong>BL motor holder</strong> (moulded \"BLMH\", \"ID5\").</li>\n<li>Press <strong>Bearing 61803</strong> into the round hole (upper hole of the figure-8 opening). Drawn: 1.</li>\n</ol>\n<p><strong>Check:</strong> bearing flat, turns freely.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Find the <strong>BL motor holder</strong> (moulded \"BLMH\" and \"ID5\").</li>\n<li>Press 1x <strong>Bearing 61803</strong> into the upper round hole of its figure-8 opening.</li>\n<li>The holder goes on the BL side of the B core.</li>\n</ol>\n<p>Check: the bearing sits flat and turns freely.</p>", "checks_simple": [], "ts": [2, 3, 32, 72, 33]}, {"stage": 6, "kind": "step", "n": 108, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-108.webp", "html": "<ol>\n<li>The bearing sits in the holder. Nothing new to fit.</li>\n</ol>", "html_pro": "<ol>\n<li>Bearing seated in holder. Nothing new to fit.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the bearing sits in the holder's upper hole.</p>", "checks_simple": [], "ts": [2, 3, 32]}, {"stage": 6, "kind": "step", "n": 109, "title": "Motor gear and gearbox gear", "img": "Attachments/Arctos/web/manual/arctos-step-109.webp", "html": "<ol>\n<li>Remove the top ring of the <strong>GT2B5W6</strong> pulley if you have not yet. [3D: \"GT2 pulley without top ring\"]</li>\n<li>Press the pulley into the <strong>BCGR/BCGL motor gear</strong> (the small gear). The pulley teeth fit the gear's inside teeth. \"The press fit is very tight.\" [UM]</li>\n<li>Find the <strong>BCGL gearbox gear</strong> (the larger gear). It goes in the 61803 bearing of the holder, on the gearbox side.</li>\n<li>The <strong>M3x15</strong> bolts shown (drawn: 2) fix the gearbox gear to the input sun later, in steps 129–131.</li>\n</ol>\n<p><strong>Check:</strong> the pulley is pressed fully into the motor gear, flat and centred.</p>\n<p>(unsure: the picture shows parts only, with no arrows. The 3D viewer lists \"Bolt M3 15mm\" right next to \"BCGL gearbox gear\", which fits steps 129–131.)</p>", "html_pro": "<ol>\n<li>Remove the top ring of the <strong>GT2B5W6</strong> pulley if not done. [3D: \"GT2 pulley without top ring\"]</li>\n<li>Press pulley into the <strong>BCGR/BCGL motor gear</strong> (small gear); pulley teeth engage the gear's inner teeth. \"The press fit is very tight.\" [UM]</li>\n<li><strong>BCGL gearbox gear</strong> (larger) goes in the holder's 61803 bearing, gearbox side.</li>\n<li><strong>M3x15</strong> bolts shown (drawn: 2) fix the gearbox gear to the input sun later, steps 129–131.</li>\n</ol>\n<p><strong>Check:</strong> pulley fully pressed into motor gear, flat and centred.</p>\n<p>(unsure: picture shows parts only, no arrows. The 3D viewer lists \"Bolt M3 15mm\" next to \"BCGL gearbox gear\", consistent with steps 129–131.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Pull the top ring off the <strong>GT2B5W6</strong> pulley (if not done yet).</li>\n<li>Press the pulley fully into the <strong>BCGR/BCGL motor gear</strong>. Tight fit.</li>\n<li>The larger <strong>BCGL gearbox gear</strong> goes in the holder's 61803 bearing, gearbox side.</li>\n<li>Keep the <strong>M3x15</strong> bolts (3 in all) for steps 129–131.</li>\n</ol>\n<p>Check: the pulley sits flat and centred in the motor gear.</p>", "checks_simple": [], "ts": [2, 3, 32, 28, 30, 72]}, {"stage": 6, "kind": "wire", "key": "w-wire", "title": "Wire both wrist drivers now, before step 110", "img": null, "html": "<div class=\"callout danger\">\n<div class=\"callout-title\">The terminals can't be reached once the wrist is built</div>\n<p>They face sideways inside the wrist.</p>\n</div>\n<ol>\n<li>Coils, power in and out, <strong>CAN in</strong> and <strong>CAN out</strong> on each 42D. The chain is <strong>B → C → gripper MCP2515</strong>.</li>\n<li>Step-down input (set to 6.0 V) to <strong>C's V+ and Gnd</strong>. C is the end of the power chain.</li>\n<li>Limit leads: B has 2 boards (<strong>Top = home</strong>). C has 1 board (WSH231).</li>\n<li><strong>B = CAN ID 5</strong> (the left holder is moulded \"ID5\"). <strong>C = CAN ID 6.</strong> Remaps <code>05 9E 01 A4</code> and <code>06 9E 01 A5</code>, plus the COM jumpers.</li>\n<li><strong>Label every end</strong> (\"B CAN in\", \"B CAN out\", \"B lim\" …).</li>\n<li>Leave tails long enough to reach along the forearm.</li>\n</ol>", "ov": ["pr-B", "dB", "mB", "pd-B", "cc-B", "co-B", "pr-C", "dC", "mC", "pd-C", "cc-C", "co-C", "sdin"], "bench": ["pwr", "can", "lim"], "drv": "42D", "grip": null, "conn": [["+V from the A driver", "**V+**", "red", "", "V+", "+V in", "", "B", "Red"], ["GND from the A driver", "**Gnd**", "blk", "", "Gnd", "GND in", "", "B", "Black"], ["CAN H from the A driver", "**CANH**", "yel", "", "CANH", "CAN H in", "", "B", "Yellow"], ["CAN L from the A driver", "**CANL**", "grn", "", "CANL", "CAN L in", "", "B", "Green"], ["+V out to the C driver", "**V+**", "red", "same screw as the wire in", "V+", "+V out", "", "B", "Red"], ["GND out to the C driver", "**Gnd**", "blk", "same screw as the wire in", "Gnd", "GND out", "", "B", "Black"], ["CAN H out to the C driver", "**CANH**", "yel", "same screw as the wire in", "CANH", "CAN H out", "", "B", "Yellow"], ["CAN L out to the C driver", "**CANL**", "grn", "same screw as the wire in", "CANL", "CAN L out", "", "B", "Green"], ["+V from the B driver", "**V+**", "red", "", "V+", "+V in", "", "C", "Red"], ["GND from the B driver", "**Gnd**", "blk", "", "Gnd", "GND in", "", "C", "Black"], ["CAN H from the B driver", "**CANH**", "yel", "", "CANH", "CAN H in", "", "C", "Yellow"], ["CAN L from the B driver", "**CANL**", "grn", "", "CANL", "CAN L in", "", "C", "Green"], ["+V out to the step-down (label \"C SD\")", "**V+**", "red", "same screw as the wire in", "V+", "+V out", "", "C", "Red"], ["GND out to the step-down (label \"C SD\")", "**Gnd**", "blk", "same screw as the wire in", "Gnd", "GND out", "", "C", "Black"], ["CAN H out to the MCP2515 (label \"C CAN out\")", "**CANH**", "yel", "same screw as the wire in", "CANH", "CAN H out", "", "C", "Yellow"], ["CAN L out to the MCP2515 (label \"C CAN out\")", "**CANL**", "grn", "same screw as the wire in", "CANL", "CAN L out", "", "C", "Green"], ["lead for the sensor", "**+5V**", "red", "labelled \"B lim\", the sensor goes on later", "+5V", "lim +5V", "", "B", "Red"], ["lead for the sensor", "**GND**", "blk", "left-hand GND", "GND", "lim GND", "", "B", "Black"], ["lead for the sensor", "**En**", "blu", "home", "En", "lim En", "", "B", "Blue"], ["lead for the sensor", "**Dir**", "blu", "", "Dir", "lim Dir", "", "B", "Blue"], ["lead for the sensor", "**+5V**", "red", "labelled \"C lim\", the sensor goes on later", "+5V", "lim +5V", "", "C", "Red"], ["lead for the sensor", "**GND**", "blk", "left-hand GND", "GND", "lim GND", "", "C", "Black"], ["lead for the sensor", "**En**", "blu", "home", "En", "lim En", "", "C", "Blue"], ["lead for the sensor", "**Dir**", "blu", "", "Dir", "lim Dir", "", "C", "Blue"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["power", "can", "sensor"], "checks": [], "html_pro": "<div class=\"callout danger\">\n<div class=\"callout-title\">Terminals unreachable once the wrist is built</div>\n<p>They face sideways inside the wrist.</p>\n</div>\n<ol>\n<li>Per 42D: coils, power in/out, <strong>CAN in</strong>, <strong>CAN out</strong>. Chain: <strong>B → C → gripper MCP2515</strong>.</li>\n<li>Step-down input (set 6.0 V) to <strong>C V+ / Gnd</strong> (end of power chain).</li>\n<li>Limit leads: B 2 boards (<strong>Top = home</strong>); C 1 board (WSH231).</li>\n<li><strong>B = CAN ID 5</strong> (left holder moulded \"ID5\"); <strong>C = CAN ID 6</strong>. Remaps <code>05 9E 01 A4</code> and <code>06 9E 01 A5</code>, plus COM jumpers.</li>\n<li><strong>Label every end</strong> (\"B CAN in\", \"B CAN out\", \"B lim\" …).</li>\n<li>Leave tails long enough to reach along the forearm.</li>\n</ol>", "checks_pro": [], "html_simple": "<div class=\"callout danger\">\n<div class=\"callout-title\">Wire both wrist drivers now</div>\n<p>You can't reach the terminals once the wrist is built.</p>\n</div>\n<p><strong>On each 42D:</strong> V+ / Gnd = right-hand block, top. CANH / CANL = left-hand block, bottom.</p>\n<ul>\n<li>Take the table-test wires off and put the 24 V supply away. Put the CANable back at the base with the X CAN pair on it.</li>\n</ul>\n<p><strong>B driver</strong> (CAN ID 5):</p>\n<ol>\n<li><strong>Red</strong> +V from the A driver → <strong>V+</strong></li>\n<li><strong>Black</strong> GND from the A driver → <strong>Gnd</strong></li>\n<li><strong>Yellow</strong> CAN H from the A driver → <strong>CANH</strong></li>\n<li><strong>Green</strong> CAN L from the A driver → <strong>CANL</strong></li>\n<li><strong>Red</strong> +V out to the C driver → <strong>V+</strong> (same screw as the wire in)</li>\n<li><strong>Black</strong> GND out to the C driver → <strong>Gnd</strong> (same screw as the wire in)</li>\n<li><strong>Yellow</strong> CAN H out to the C driver → <strong>CANH</strong> (same screw as the wire in)</li>\n<li><strong>Green</strong> CAN L out to the C driver → <strong>CANL</strong> (same screw as the wire in)</li>\n</ol>\n<p><strong>C driver</strong> (CAN ID 6). C is the end of the chain:</p>\n<ol start=\"9\">\n<li><strong>Red</strong> +V from the B driver → <strong>V+</strong></li>\n<li><strong>Black</strong> GND from the B driver → <strong>Gnd</strong></li>\n<li><strong>Yellow</strong> CAN H from the B driver → <strong>CANH</strong></li>\n<li><strong>Green</strong> CAN L from the B driver → <strong>CANL</strong></li>\n<li><strong>Red</strong> +V out to the step-down (label \"C SD\") → <strong>V+</strong> (same screw as the wire in)</li>\n<li><strong>Black</strong> GND out to the step-down (label \"C SD\") → <strong>Gnd</strong> (same screw as the wire in)</li>\n<li><strong>Yellow</strong> CAN H out to the MCP2515 (label \"C CAN out\") → <strong>CANH</strong> (same screw as the wire in)</li>\n<li><strong>Green</strong> CAN L out to the MCP2515 (label \"C CAN out\") → <strong>CANL</strong> (same screw as the wire in)</li>\n</ol>\n<p><strong>Sensor leads</strong> (+5V / GND left-hand block, En / Dir right-hand block):</p>\n<ol start=\"17\">\n<li><strong>Red</strong> lead for the sensor → <strong>+5V</strong> (labelled \"B lim\", the sensor goes on later)</li>\n<li><strong>Black</strong> lead for the sensor → <strong>GND</strong> (left-hand GND)</li>\n<li><strong>Blue</strong> lead for the sensor → <strong>En</strong> (home)</li>\n<li><strong>Blue</strong> lead for the sensor → <strong>Dir</strong></li>\n<li><strong>Red</strong> lead for the sensor → <strong>+5V</strong> (labelled \"C lim\", the sensor goes on later)</li>\n<li><strong>Black</strong> lead for the sensor → <strong>GND</strong> (left-hand GND)</li>\n<li><strong>Blue</strong> lead for the sensor → <strong>En</strong> (home)</li>\n<li><strong>Blue</strong> lead for the sensor → <strong>Dir</strong></li>\n</ol>\n<ul>\n<li>Two wires in one screw: twist the bare ends together first, then tighten.</li>\n<li>Label every end (\"B CAN in\", \"C CAN out\", \"B lim\" …). Leave the tails long enough to reach along the forearm.</li>\n</ul>", "checks_simple": [], "ts": [87, 91, 58, 59, 61, 64]}, {"stage": 6, "kind": "step", "n": 110, "title": "Fit the motor", "img": "Attachments/Arctos/web/manual/arctos-step-110.webp", "html": "<div class=\"callout danger\">\n<div class=\"callout-title\">🔌 WIRE NOW: before steps 110–111</div>\n<ol>\n<li>Connect the motor coil wires to the 42D motor terminal (A+ A− B+ B−). Find coil pairs first: short two wires and turn the shaft; if it resists, they are one coil. [Docs]</li>\n<li>Fit the <strong>power</strong> leads (V+ and GND) and <strong>CAN in</strong> (H, L) to the 42D.</li>\n<li>Fit a <strong>CAN out</strong> lead (H, L) to the B driver. It goes on to the C driver, then to the gripper MCP2515.</li>\n<li>Fit a lead to the limit input you will use for the B sensors (IN_1, and IN_2 after the remap). [Docs: 42D needs the remap command for two limits]</li>\n<li>Leave tails long enough to reach along the forearm. Label each end (\"B CAN in\", \"B CAN out\", \"B lim\").</li>\n<li>Twist the wire strands before they go in the terminals. Unexpected Maker had to redo one stray strand. [UM]</li>\n</ol>\n</div>\n<ol>\n<li>Put the <strong>Nema_17_23mm</strong> motor onto the holder from the back. The shaft goes through the lower opening.</li>\n<li>Slide the motor gear onto the shaft.</li>\n<li>Tighten the pulley's set screw onto the flat of the shaft.</li>\n</ol>\n<p><strong>Check:</strong> the motor gear meshes with the gearbox gear. Turn the motor shaft by hand. The gearbox gear turns smoothly.</p>\n<p>(unsure: the order of motor gear and motor. The picture shows the motor going on with the gear already in the holder.)</p>", "html_pro": "<div class=\"callout danger\">\n<div class=\"callout-title\">🔌 WIRE NOW: before steps 110–111</div>\n<ol>\n<li>Motor coils to the 42D terminal (A+ A− B+ B−). Find coil pairs first: short two wires and turn the shaft; resistance means one coil. [Docs]</li>\n<li><strong>Power</strong> (V+, GND) and <strong>CAN in</strong> (H, L) to the 42D.</li>\n<li><strong>CAN out</strong> (H, L) on the B driver, on to the C driver, then the gripper MCP2515.</li>\n<li>Lead to the limit input for the B sensors (IN_1, and IN_2 after the remap). [Docs: 42D needs the remap command for two limits]</li>\n<li>Tails long enough to reach along the forearm. Label each end (\"B CAN in\", \"B CAN out\", \"B lim\").</li>\n<li>Twist wire strands before inserting in terminals; Unexpected Maker redid one stray strand. [UM]</li>\n</ol>\n</div>\n<ol>\n<li><strong>Nema_17_23mm</strong> motor onto the holder from the back; shaft through the lower opening.</li>\n<li>Slide motor gear onto shaft.</li>\n<li>Tighten the pulley set screw on the shaft flat.</li>\n</ol>\n<p><strong>Check:</strong> motor gear meshes with gearbox gear; turn the motor shaft by hand, gearbox gear turns smoothly.</p>\n<p>(unsure: order of motor gear and motor. Picture shows the motor going on with the gear already in the holder.)</p>", "checks_pro": [], "html_simple": "<div class=\"callout danger\">\n<div class=\"callout-title\">Wire first</div>\n<p>Do the wiring card just before this step. The terminals are hard to reach later.</p>\n</div>\n<ol>\n<li>The gear set from step 109 sits in the <strong>BL motor holder</strong>.</li>\n<li>Push the <strong>Nema_17_23mm</strong> motor in from the back, shaft first.</li>\n<li>The shaft goes into the gear set through the lower opening.</li>\n<li>Tighten the set screw onto the flat of the shaft.</li>\n</ol>\n<p>Check: the motor gear meshes with the gearbox gear. Both turn smoothly by hand.</p>", "checks_simple": [], "ts": [16, 32, 58, 59, 61, 64]}, {"stage": 6, "kind": "step", "n": 111, "title": "MKS SERVO42D", "img": "Attachments/Arctos/web/manual/arctos-step-111.webp", "html": "<ol>\n<li>Put the <strong>MKS Servo 42D</strong> on the back of the motor.</li>\n<li>Put an <strong>M3 x 25 mm</strong> bolt through each of the 4 corner holes (red arrows). Drawn: 4 arrows.</li>\n<li>The bolts go through the driver into the motor body.</li>\n<li>Tighten them evenly. Unexpected Maker suggests washers. [MKS video]</li>\n</ol>\n<p><strong>Check:</strong> the driver sits flat. Its encoder chip is centred over the shaft magnet. All wires from the 🔌 box come out free and are not pinched.</p>", "html_pro": "<ol>\n<li><strong>MKS Servo 42D</strong> on the motor back.</li>\n<li><strong>M3 x 25 mm</strong> through each of the 4 corner holes (red arrows). Drawn: 4 arrows.</li>\n<li>Bolts pass through the driver into the motor body.</li>\n<li>Tighten evenly; Unexpected Maker suggests washers. [MKS video]</li>\n</ol>\n<p><strong>Check:</strong> driver flat; encoder chip centred over the shaft magnet; all wires from the 🔌 box free, not pinched.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>MKS Servo 42D</strong> on the back of the motor.</li>\n<li>Put 4x <strong>M3 x 25 mm</strong> bolt through the corner holes (red arrows).</li>\n<li>Tighten them evenly.</li>\n</ol>\n<p>Check: the driver sits flat. No wire is pinched.</p>", "checks_simple": [], "ts": [62, 54, 63, 72, 33, 26]}, {"stage": 6, "kind": "step", "n": 112, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-112.webp", "html": "<ol>\n<li>The B motor and its driver are on the holder.</li>\n</ol>\n<p><strong>Check:</strong> connect power and CAN on the bench. The 42D powers up and answers on CAN ID 5. This is the last easy moment to test it.</p>", "html_pro": "<ol>\n<li>B motor and driver on the holder.</li>\n</ol>\n<p><strong>Check:</strong> connect power and CAN on the bench; 42D powers up and answers on CAN ID 5. Last easy moment to test.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: motor and driver are on the holder.</p>\n<p>Check: connect power and CAN on the bench. The 42D answers on CAN ID 5.</p>", "checks_simple": [], "ts": [72, 33, 18]}, {"stage": 6, "kind": "step", "n": 113, "title": "Bolt the motor to the holder", "img": "Attachments/Arctos/web/manual/arctos-step-113.webp", "html": "<ol>\n<li>Turn the holder over to the gearbox side.</li>\n<li>Put one <strong>Bolt M3 x 15 mm</strong> through each of the 4 <strong>slotted</strong> holes around the motor gear. Drawn: 4.</li>\n<li>These bolts go into the <strong>motor's</strong> threaded holes. They hold the motor to the holder. (The old caption said they fix the holder to the wrist. That is wrong. Unexpected Maker confirms \"4x M3x15 for the motor\". [UM])</li>\n<li>Do not tighten yet.</li>\n</ol>\n<p><strong>Check:</strong> the motor can still slide a little in the slots.</p>", "html_pro": "<ol>\n<li>Flip the holder to the gearbox side.</li>\n<li><strong>Bolt M3 x 15 mm</strong> through each of the 4 <strong>slotted</strong> holes around the motor gear. Drawn: 4.</li>\n<li>Bolts thread into the <strong>motor's</strong> holes and hold the motor to the holder. (Old caption said holder to wrist; wrong. Unexpected Maker confirms \"4x M3x15 for the motor\". [UM])</li>\n<li>Leave loose.</li>\n</ol>\n<p><strong>Check:</strong> motor still slides slightly in the slots.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the holder over to the gearbox side.</li>\n<li>Put 4x <strong>Bolt M3x20</strong> through the <strong>slotted</strong> holes around the motor gear. The paper says 15 mm: too short for this holder.</li>\n<li>They go into the motor. Leave them loose.</li>\n</ol>\n<p>Check: the motor still slides a little in the slots.</p>", "checks_simple": [], "ts": [72, 33, 26]}, {"stage": 6, "kind": "step", "n": 114, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-114.webp", "html": "<ol>\n<li>The 4 bolts are in the slots, still loose.</li>\n</ol>", "html_pro": "<ol>\n<li>4 bolts in the slots, loose.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the bolts are in the slots, still loose.</p>", "checks_simple": [], "ts": [26, 0, 18]}, {"stage": 6, "kind": "step", "n": 115, "title": "Tighten (gently)", "img": "Attachments/Arctos/web/manual/arctos-step-115.webp", "html": "<ol>\n<li>Slide the motor so the motor gear meshes fully with the gearbox gear. Do not force it so tight that it binds.</li>\n<li>Tighten the 4 bolts \"all the way. Not too hard because motor housing is made out of aluminum and the threads might be damaged.\" [Manual]</li>\n</ol>\n<p><strong>Check:</strong> turn the gearbox gear by hand. It turns the motor with no binding and no gap you can feel.</p>\n<p>(unsure: the manual note ends \"only tight enough so that the belt can't skip\". That text is from the older belt design. The current design uses two helical gears here, so there is no belt at this point. [UM: \"no more tensioning issue … there's no belt\"])</p>", "html_pro": "<ol>\n<li>Slide the motor until the motor gear fully meshes with the gearbox gear; do not force into binding.</li>\n<li>Tighten the 4 bolts \"all the way. Not too hard because motor housing is made out of aluminum and the threads might be damaged.\" [Manual]</li>\n</ol>\n<p><strong>Check:</strong> turn the gearbox gear by hand; it turns the motor with no binding and no felt gap.</p>\n<p>(unsure: the manual note ends \"only tight enough so that the belt can't skip\". That is from the older belt design. Current design uses two helical gears here, no belt. [UM: \"no more tensioning issue … there's no belt\"])</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Slide the motor until its gear meshes fully with the gearbox gear. Do not force it into binding.</li>\n<li>Tighten the 4 bolts.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Do not overtighten</div>\n<p>The motor's aluminium threads strip easily.</p>\n</div>\n<p>Check: turn the gearbox gear by hand. It turns the motor with no binding and no gap.</p>", "checks_simple": [], "ts": [28, 30, 72, 33, 26]}, {"stage": 6, "kind": "step", "n": 116, "title": "The BL core", "img": "Attachments/Arctos/web/manual/arctos-step-116.webp", "html": "<ol>\n<li>Find the <strong>BL core</strong> (the long left side plate). It has a big ring gear with teeth on the inside.</li>\n<li>The picture shows the BL core already sitting over the motor holder on the forearm. No label or bolts are shown.</li>\n</ol>\n<p>(unsure: when the BL core is fixed. It looks loosely placed here. Steps 120–123 show it pulled away again, and step 134 bolts the unit on.)</p>", "html_pro": "<ol>\n<li><strong>BL core</strong> (long left side plate, internal ring gear).</li>\n<li>Picture shows it sitting over the motor holder on the forearm; no label or bolts shown.</li>\n</ol>\n<p>(unsure: when the BL core is fixed. Looks loosely placed. Steps 120–123 show it pulled away again; step 134 bolts the unit on.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the wrist to the other side.</li>\n<li>Press 2x <strong>Nut M3</strong> into the 2 lower hex pockets on that face of the holder (for step 134).</li>\n<li>Put the <strong>BL core</strong> over the motor holder as shown. It is the plate with the big inside ring gear.</li>\n<li>From inside the holder, fix it with 2x <strong>Bolt M3x10</strong>. The other bolts come in step 134.</li>\n</ol>", "checks_simple": [], "ts": [20, 21, 25, 27, 72, 33]}, {"stage": 6, "kind": "step", "n": 117, "title": "Bearing and GT2 timing pulley", "img": "Attachments/Arctos/web/manual/arctos-step-117.webp", "html": "<ol>\n<li>Press one <strong>Bearing 61803</strong> into the round boss at the narrow (wrist) end of the BL core. Drawn: 1.</li>\n<li>Put the <strong>GT2 Timing Pulley</strong> onto that bearing. Its small triangle boss with 3 holes faces <strong>out</strong>.</li>\n</ol>\n<p><strong>Check:</strong> the pulley spins freely on the bearing and does not wobble. \"BCG GT2 pulleys wobble\" is a known community mod topic. [Community]</p>", "html_pro": "<ol>\n<li>Press <strong>Bearing 61803</strong> into the round boss at the narrow (wrist) end of the BL core. Drawn: 1.</li>\n<li><strong>GT2 Timing Pulley</strong> onto that bearing; small triangle boss with 3 holes faces <strong>out</strong>.</li>\n</ol>\n<p><strong>Check:</strong> pulley spins freely, no wobble. \"BCG GT2 pulleys wobble\" is a known community mod topic. [Community]</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Press 1x <strong>Bearing 61803</strong> into the round boss at the narrow end of the BL core.\n   The 3D also shows 1x <strong>Bearing 61803</strong> in the inner side of that boss (in the CAD, not in the paper).</li>\n<li>Put the <strong>BC pulley</strong> (HTD 5M 38T, rigid diff mod) on that bearing: its hub goes into the bearing, the wide round recess faces <strong>out</strong>.</li>\n</ol>\n<p>Check: the pulley spins freely with no wobble.</p>", "checks_simple": [], "ts": [2, 3, 32, 28, 30]}, {"stage": 6, "kind": "step", "n": 118, "title": "Middle planets (the 90° rule)", "img": "Attachments/Arctos/web/manual/arctos-step-118.webp", "html": "<ol>\n<li>Put the 4 <strong>BCGR middle planetary</strong> gears into the ring gear. Drawn: 4.</li>\n<li>Each planet has <strong>2 holes</strong>. \"Each one is rotated 90° with respect to previous/next one.\" [Manual]</li>\n<li>In step 119 the holes go: top planet side-by-side, right planet one-above-the-other, bottom side-by-side, left one-above-the-other.</li>\n<li>Seen from the centre, every hole pair lies <strong>across</strong> the radius. The 8 holes form a square around the middle. \"Make sure that these holes are arranged exactly as in the image forming a rectangle. Otherwise the gearbox will not spin.\" [3D]</li>\n</ol>\n<p><strong>Check:</strong> the 4 planets are <strong>equally spaced</strong>. Uneven gaps mean one is a tooth off. Lift it out and re-seat it. \"If you're off by a single tooth that's going to make the whole thing bind.\" [Alberto]</p>", "html_pro": "<ol>\n<li>4 <strong>BCGR middle planetary</strong> gears into the ring gear. Drawn: 4.</li>\n<li>Each planet has <strong>2 holes</strong>; \"Each one is rotated 90° with respect to previous/next one.\" [Manual]</li>\n<li>Step 119 hole order: top side-by-side, right one-above-the-other, bottom side-by-side, left one-above-the-other.</li>\n<li>From the centre, every hole pair lies <strong>across</strong> the radius; the 8 holes form a square around the middle. \"Make sure that these holes are arranged exactly as in the image forming a rectangle. Otherwise the gearbox will not spin.\" [3D]</li>\n</ol>\n<p><strong>Check:</strong> the 4 planets <strong>equally spaced</strong>. Uneven gaps = one a tooth off; lift out and re-seat. \"If you're off by a single tooth that's going to make the whole thing bind.\" [Alberto]</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 4x <strong>BCGR middle planetary</strong> into the ring gear.</li>\n<li>Each one has 2 holes. Turn each one 90° from the one next to it.</li>\n<li>Hole pairs: top side-by-side, right one-above-the-other, bottom side-by-side, left one-above-the-other.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Hole pattern</div>\n<p>The 8 holes must form a square around the centre. A wrong pattern stops the gearbox.</p>\n</div>\n<p>Check: the 4 planets are equally spaced. If one gap is uneven, lift that planet and re-seat it.</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23, 20]}, {"stage": 6, "kind": "step", "n": 119, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-119.webp", "html": "<ol>\n<li>Compare your hole pattern with this picture before going on.</li>\n</ol>", "html_pro": "<ol>\n<li>Compare hole pattern with this picture before proceeding.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check your hole pattern matches the picture before you go on.</p>", "checks_simple": [], "ts": [18, 28, 58]}, {"stage": 6, "kind": "step", "n": 120, "title": "Input sun (from the other side)", "img": "Attachments/Arctos/web/manual/arctos-step-120.webp", "html": "<ol>\n<li>Turn to the motor-holder side of the BL core. The picture pulls the BL core away from the holder to show this face.</li>\n<li>Put the <strong>BCGR input sun</strong> into the centre of the planets. Its round flange with 3 holes faces the motor holder.</li>\n</ol>\n<p><strong>Check:</strong> the sun meshes with all 4 planets.</p>\n<p>Tip: \"The input sun is not retained yet, so do not spin the assembly.\" [Alberto] Trick: push the ring from below so it opens a little, drop the sun in, then let it close. [Alberto]</p>", "html_pro": "<ol>\n<li>Go to the motor-holder side of the BL core; picture pulls the core away from the holder to show this face.</li>\n<li><strong>BCGR input sun</strong> into the centre of the planets; round flange with 3 holes faces the motor holder.</li>\n</ol>\n<p><strong>Check:</strong> sun meshes with all 4 planets.</p>\n<p>Tip: \"The input sun is not retained yet, so do not spin the assembly.\" [Alberto] Trick: push the ring from below so it opens slightly, drop the sun in, let it close. [Alberto]</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn to the motor-holder side of the BL core.</li>\n<li>Put the <strong>BCGR input sun</strong> into the centre of the planets.</li>\n<li>Its round flange with 3 holes faces the motor holder.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Not held yet</div>\n<p>Do not spin the assembly.</p>\n</div>\n<p>Check: the sun meshes with all 4 planets.</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23, 72]}, {"stage": 6, "kind": "step", "n": 121, "title": "Input planets", "img": "Attachments/Arctos/web/manual/arctos-step-121.webp", "html": "<ol>\n<li>Put the 4 <strong>BCGR input planetary</strong> gears onto the middle planets, on this side. Drawn: 4.</li>\n<li>Turn each one until its 2 holes line up with the 2 holes in the middle planet below it.</li>\n</ol>\n<p><strong>Check:</strong> each input planet sits flat on its middle planet, with holes aligned.</p>\n<p>Tip: if the holes are \"half a hole out\", turn that planet 180°. The holes are off-centre. [UM, A axis]</p>", "html_pro": "<ol>\n<li>4 <strong>BCGR input planetary</strong> gears onto the middle planets, this side. Drawn: 4.</li>\n<li>Rotate each until its 2 holes align with the 2 holes in the middle planet below.</li>\n</ol>\n<p><strong>Check:</strong> each input planet flat on its middle planet, holes aligned.</p>\n<p>Tip: if holes are \"half a hole out\", rotate that planet 180°; the holes are off-centre. [UM, A axis]</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 4x <strong>BCGR input planetary</strong> onto the middle planets, on this side.</li>\n<li>Turn each one until its 2 holes line up with the middle planet's holes.</li>\n</ol>\n<p>Check: each one sits flat with its holes lined up.</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23, 20]}, {"stage": 6, "kind": "step", "n": 122, "title": "Bolt input planets to middle planets", "img": "Attachments/Arctos/web/manual/arctos-step-122.webp", "html": "<ol>\n<li>Put <strong>Bolt M3 10mm</strong> through each input planet into its middle planet. <strong>2 per planet, 8 in total.</strong> Drawn: 8.</li>\n<li>Tighten a little on each bolt in turn, so no planet lifts on one side. [Alberto]</li>\n</ol>\n<p><strong>Check:</strong> no bolt head sticks up above the gear face. The planets still turn around the sun.</p>\n<p>(The old caption said \"to the carrier\". There is no carrier. The bolts join the input planet to the middle planet.)</p>", "html_pro": "<ol>\n<li><strong>Bolt M3 10mm</strong> through each input planet into its middle planet; <strong>2 per planet, 8 total.</strong> Drawn: 8.</li>\n<li>Tighten a little on each bolt in turn so no planet lifts on one side. [Alberto]</li>\n</ol>\n<p><strong>Check:</strong> no bolt head above the gear face; planets still turn around the sun.</p>\n<p>(Old caption said \"to the carrier\". No carrier exists; the bolts join input planet to middle planet.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put <strong>Bolt M3 10mm v2</strong> through each input planet into its middle planet.</li>\n<li>Use 2 per planet, 8x in total.</li>\n<li>Tighten each bolt a little in turn.</li>\n</ol>\n<p>Check: no bolt head sticks up. The planets still turn around the sun.</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23, 26]}, {"stage": 6, "kind": "step", "n": 123, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-123.webp", "html": "<ol>\n<li>Each input planet shows 2 bolt heads.</li>\n</ol>", "html_pro": "<ol>\n<li>Each input planet shows 2 bolt heads.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: each input planet shows 2 bolt heads.</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23, 26]}, {"stage": 6, "kind": "step", "n": 124, "title": "Output sun (back on the outer side)", "img": "Attachments/Arctos/web/manual/arctos-step-124.webp", "html": "<ol>\n<li>Turn back to the outer side of the BL core.</li>\n<li>Put the <strong>BCGR output sun</strong> into the centre of the middle planets.</li>\n</ol>\n<p><strong>Check:</strong> it meshes with all 4 planets.</p>\n<p>Tip: \"Note: in some cases (depending on the tolerances) the gearbox runs smoothly without the sun gear.\" [3D] If the finished box binds, try it without this part.</p>", "html_pro": "<ol>\n<li>Back to the outer side of the BL core.</li>\n<li><strong>BCGR output sun</strong> into the centre of the middle planets.</li>\n</ol>\n<p><strong>Check:</strong> meshes with all 4 planets.</p>\n<p>Tip: \"Note: in some cases (depending on the tolerances) the gearbox runs smoothly without the sun gear.\" [3D] If the finished box binds, try it without this part.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn back to the outer side of the BL core.</li>\n<li>Put the <strong>BCGR output sun</strong> into the centre of the middle planets.</li>\n</ol>\n<p>Check: it meshes with all 4 planets.</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23, 20]}, {"stage": 6, "kind": "step", "n": 125, "title": "Big bearing and outer ring", "img": "Attachments/Arctos/web/manual/arctos-step-125.webp", "html": "<ol>\n<li>Put a <strong>Bearing 61812</strong> over the gearbox. Drawn: 1.</li>\n<li>Put the <strong>BCGL outer ring(Mirror)</strong> over it. It has belt teeth on the outside and gear teeth on the inside.</li>\n<li>Alberto fits the bearing into the outer ring first, then lowers both together. [Alberto]</li>\n</ol>\n<p><strong>Check:</strong> the bearing goes in <strong>straight</strong>. Do not sand a tight bore. Unexpected Maker's A-axis 61812 would not enter its bore, and sanding made it stick. Reprint rather than sand. [UM]</p>", "html_pro": "<ol>\n<li><strong>Bearing 61812</strong> over the gearbox. Drawn: 1.</li>\n<li><strong>BCGL outer ring(Mirror)</strong> over it (belt teeth outside, gear teeth inside).</li>\n<li>Alberto presses the bearing into the outer ring first, then lowers both together. [Alberto]</li>\n</ol>\n<p><strong>Check:</strong> bearing enters <strong>straight</strong>. Do not sand a tight bore; Unexpected Maker's A-axis 61812 would not enter its bore and sanding made it stick. Reprint instead. [UM]</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 1x <strong>Bearing 61812</strong> over the gearbox.</li>\n<li>Put the <strong>BCGL outer ring(Mirror)</strong> (HTD pulley mod) over it. Belt teeth face out, gear teeth face in.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Bearing goes in straight</div>\n<p>Do not sand a tight bore. Reprint the part instead.</p>\n</div>\n<p>Check: the bearing sits straight.</p>", "checks_simple": [], "ts": [2, 3, 32, 28, 30]}, {"stage": 6, "kind": "step", "n": 126, "title": "Output planets", "img": "Attachments/Arctos/web/manual/arctos-step-126.webp", "html": "<ol>\n<li>Put the 4 <strong>BCGR output planetary</strong> gears into the outer ring, onto the middle planets. Drawn: 4.</li>\n<li>Line up their holes with the middle planets.</li>\n<li>Bolt each one with <strong>Bolt M3 10mm v2</strong>, <strong>2 per planet, 8 in total</strong>. Drawn: 8.</li>\n<li>That makes <strong>16</strong> M3x10 per side. \"8 first, 16 in total.\" [Alberto]</li>\n</ol>\n<p><strong>Check:</strong> you can feel the herringbone halves grip the ring from both sides.</p>", "html_pro": "<ol>\n<li>4 <strong>BCGR output planetary</strong> gears into the outer ring, onto the middle planets. Drawn: 4.</li>\n<li>Align holes with the middle planets.</li>\n<li><strong>Bolt M3 10mm v2</strong>, <strong>2 per planet, 8 total</strong>. Drawn: 8.</li>\n<li><strong>16</strong> M3x10 per side in total. \"8 first, 16 in total.\" [Alberto]</li>\n</ol>\n<p><strong>Check:</strong> herringbone halves grip the ring from both sides, felt by hand.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 4x <strong>BCGR output planetary</strong> into the outer ring, onto the middle planets.</li>\n<li>Line up their holes with the middle planets.</li>\n<li>Fix each one with 2x <strong>Bolt M3 10mm v2</strong> (8x in total).</li>\n</ol>\n<p>Check: each output planet shows 2 bolt heads (8 on this side).</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23, 20]}, {"stage": 6, "kind": "step", "n": 127, "title": "The triangle marks", "img": "Attachments/Arctos/web/manual/arctos-step-127.webp", "html": "<ol>\n<li>Look at the small <strong>triangles</strong>. The outer ring has 4 (at 12, 3, 6 and 9 o'clock). They point <strong>toward the centre</strong>.</li>\n<li>Each planet and the output sun also has triangles.</li>\n<li>They should form <strong>4 straight lines</strong> from the centre, through each planet, to the ring triangles. \"The printed arrows should point to the centre of the gears.\" [Alberto]</li>\n<li>The output planet bolt pairs again alternate side-by-side and one-above-the-other.</li>\n</ol>\n<p><strong>Check:</strong> the <strong>spin test</strong>. Turn the outer ring by hand. It must turn with very little effort and keep turning a little after a flick. \"If it binds at all … that motor's not going to be able to move it.\" [Alberto] If it binds, see <a class=\"wl\" href=\"#/planetary/if-the-gearbox-binds-or-is-loose\">Planetary Gearboxes (A, B, C) › If the gearbox binds or is loose</a>.</p>", "html_pro": "<ol>\n<li>Small <strong>triangles</strong>: the outer ring has 4 (12, 3, 6, 9 o'clock), pointing <strong>toward the centre</strong>.</li>\n<li>Each planet and the output sun also carries triangles.</li>\n<li>They form <strong>4 straight lines</strong> from the centre, through each planet, to the ring triangles. \"The printed arrows should point to the centre of the gears.\" [Alberto]</li>\n<li>Output planet bolt pairs again alternate side-by-side and one-above-the-other.</li>\n</ol>\n<p><strong>Check:</strong> <strong>spin test</strong>: turn the outer ring by hand; very little effort, keeps turning a little after a flick. \"If it binds at all … that motor's not going to be able to move it.\" [Alberto] If it binds, see <a class=\"wl\" href=\"#/planetary/if-the-gearbox-binds-or-is-loose\">Planetary Gearboxes (A, B, C) › If the gearbox binds or is loose</a>.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Check the small triangles. The outer ring has 4 (12, 3, 6 and 9 o'clock).</li>\n<li>The triangles on the ring, planets and output sun form 4 straight lines from the centre.</li>\n<li>Output planet bolt pairs alternate: side-by-side, then one-above-the-other.</li>\n</ol>\n<p>Check: turn the outer ring by hand. It turns easily and keeps turning after a flick.
