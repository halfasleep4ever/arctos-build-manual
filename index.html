h a pen.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 3, "kind": "step", "n": 52, "title": "Stack the disks on the camshaft pieces", "img": "Attachments/Arctos/web/manual/arctos-step-052.webp", "html": "<p><strong>Do (left to right in the picture):</strong></p>\n<ol>\n<li>Start with <strong>ZC4</strong>.</li>\n<li>Slide on the first disk.</li>\n<li>Add <strong>ZC3</strong>.</li>\n<li>Slide on the second disk.</li>\n<li>Add <strong>ZC2</strong>.</li>\n<li>Slide on the third disk.</li>\n<li>Finish with <strong>ZC1</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> none.</p>\n<p><strong>Orientation:</strong> \"All camshaft pieces have markings on them.\" Match the marks as drawn. (unsure: the disks are not numbered in this picture. Step 53 shows disk 3 on the outside. By the Y pattern, disk 3 sits next to ZC4. Check your numbers against step 53.)</p>\n<p><strong>Check:</strong> It spins by hand after each stage.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li><strong>Cam 1 and cam 3 look alike.</strong> Check the marks. A bearing went in the wrong place for Unexpected Maker here.</li>\n<li><strong>The flat side of the cam stack faces the motor.</strong> (Unexpected Maker)</li>\n<li>Lock the disks: put 5 dowel pins through the 5 small bearings during assembly. (designer)</li>\n</ul>", "html_pro": "<p><strong>Do (left to right in picture):</strong></p>\n<ol>\n<li><strong>ZC4</strong>.</li>\n<li>First disk.</li>\n<li><strong>ZC3</strong>.</li>\n<li>Second disk.</li>\n<li><strong>ZC2</strong>.</li>\n<li>Third disk.</li>\n<li><strong>ZC1</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> none.</p>\n<p><strong>Orientation:</strong> \"All camshaft pieces have markings on them.\" Match marks as drawn. (unsure: disks not numbered in this picture. Step 53 shows disk 3 outside. By Y pattern, disk 3 next to ZC4. Check numbers against step 53.)</p>\n<p><strong>Check:</strong> Spins by hand after each stage.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li><strong>Cam 1 and cam 3 look alike</strong>; check marks. A bearing went in wrong place for Unexpected Maker here.</li>\n<li><strong>Flat side of cam stack faces motor.</strong> (Unexpected Maker)</li>\n<li>Lock disks: 5 dowel pins through the 5 small bearings during assembly. (designer)</li>\n</ul>", "checks_pro": [], "html_simple": "<p>Build the stack left to right, as in the picture:</p>\n<ol>\n<li><strong>ZC4</strong>, then disk 3.</li>\n<li><strong>ZC3</strong>, then disk 2.</li>\n<li><strong>ZC2</strong>, then disk 1.</li>\n<li><strong>ZC1</strong> last.</li>\n<li>Match the marks on each camshaft piece as drawn.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">ZC1 and ZC3 look alike</div>\n<p>Read the marks before you fit them. ZC1 is the longer one: about 26 mm. ZC3 is about 22 mm.</p>\n</div>\n<ol start=\"6\">\n<li>Stand the stack on the table, ZC4 down. Press down on ZC1.</li>\n<li>Look from the side: no gap between any two pieces. Each disk sits flat between its two pieces.</li>\n</ol>\n<p>Check: Turn the cam by hand. All 3 disks wobble a little (about 2 mm). If one stays still, press the stack together again. The 3 disks do not line up with each other: that is correct. The flat side of the cam stack faces the motor.</p>\n<p>Check: Nothing turns slower yet. The slow turn starts in step 58.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 3, "kind": "step", "n": 53, "title": "Check the stack", "img": "Attachments/Arctos/web/manual/arctos-step-053.webp", "html": "<p><strong>Check:</strong> Disk \"3\" is on the outside, facing you. The camshaft end shows in the centre. 5 cap screws are on disk 3.</p>\n<p><strong>Tip:</strong> If the disks went in back to front, the camshaft is on the wrong side. To fix it, remove only the outer bolts and flip the inner stack. (Unexpected Maker)</p>", "html_pro": "<p><strong>Check:</strong> Disk \"3\" outermost, facing you. Camshaft end visible in centre. 5 cap screws on disk 3.</p>\n<p><strong>Tip:</strong> Disks reversed = camshaft on wrong side. Fix: remove only the outer bolts, flip the inner stack. (Unexpected Maker)</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: disk \"3\" faces you, and the camshaft end shows in the centre.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Camshaft on the wrong side</div>\n<p>The stack is flipped. Take off only the outer bolts and flip the inner stack.</p>\n</div>", "checks_simple": [], "ts": [94, 10, 15, 11, 17, 0]}, {"stage": 3, "kind": "step", "n": 54, "title": "Put the stack into the left cover", "img": "Attachments/Arctos/web/manual/arctos-step-054.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put 1 x <strong>Bearing 61810</strong> on the <strong>outer</strong> side of the <strong>A gearbox L cover</strong> (right in the picture). This is the Z left cover; the name is old.</li>\n<li>Put the disk stack into the open side of the cover, disk 3 facing out (left).</li>\n<li>Push 4 x <strong>Z gearbox pin</strong> through the disk lobes into the cover.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 61810, 4x Z gearbox pin (50 mm). \"(16)\" and \"(1)\" are CAD numbers.</p>\n<p><strong>Orientation:</strong> The bearing goes on the side <strong>away</strong> from the disks. The cover's fingers wrap around the disks.</p>\n<p><strong>Check:</strong> The 4 pins are tight in their holes. The bearing is fully seated.</p>\n<p><strong>Tip:</strong> One builder found the big bearing not fully seated. He pressed it on with a second bearing. (Unexpected Maker)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>1 x <strong>Bearing 61810</strong> on the <strong>outer</strong> side of the <strong>A gearbox L cover</strong> (right in picture). It is the Z left cover; name is legacy.</li>\n<li>Disk stack into open side of cover, disk 3 out (left).</li>\n<li>4 x <strong>Z gearbox pin</strong> through disk lobes into cover.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 61810, 4x Z gearbox pin (50 mm). \"(16)\" and \"(1)\" are CAD numbers.</p>\n<p><strong>Orientation:</strong> Bearing on the side <strong>away</strong> from the disks. Cover fingers wrap the disks.</p>\n<p><strong>Check:</strong> 4 pins tight. Bearing fully seated.</p>\n<p><strong>Tip:</strong> One builder: big bearing not fully seated; pressed it home with a second bearing. (Unexpected Maker)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 1x <strong>Bearing 61810</strong> on the outer side of the <strong>A gearbox L cover</strong> (zero-backlash mod; right in the picture).</li>\n<li>Put the disk stack into the open side of the cover. Disk 3 faces out (left).</li>\n<li>Push 4x <strong>Z gearbox pin</strong> (50 mm) into the ring of holes, around the disks.</li>\n</ol>\n<p>Check: 4 pins tight. Bearing fully seated.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 3, "kind": "step", "n": 55, "title": "Check the stack in the cover", "img": "Attachments/Arctos/web/manual/arctos-step-055.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Look at the result before you close the gearbox.</li>\n</ol>\n<p><strong>Check:</strong></p>\n<ul>\n<li>Disk 3 faces you with its number at the top.</li>\n<li>4 pins are in, spread round the ring.</li>\n<li>The cover fingers wrap the disks evenly.</li>\n<li>The camshaft end shows in the centre.</li>\n<li>Turn the camshaft by hand. It should turn. (official video: check that it spins)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Inspect before closing the gearbox.</li>\n</ol>\n<p><strong>Check:</strong></p>\n<ul>\n<li>Disk 3 facing you, number at top.</li>\n<li>4 pins in, spread round the ring.</li>\n<li>Cover fingers wrap disks evenly.</li>\n<li>Camshaft end visible in centre.</li>\n<li>Turn camshaft by hand; must turn. (official video: check that it spins)</li>\n</ul>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: disk 3 faces you with its number at the top, and 4 pins sit spread round the ring.</p>\n<p>Check: The cover fingers wrap the disks evenly. The camshaft turns by hand.</p>", "checks_simple": [], "ts": [94, 10, 15, 11, 17, 7]}, {"stage": 3, "kind": "step", "n": 56, "title": "Close it with the ZR cover", "img": "Attachments/Arctos/web/manual/arctos-step-056.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put the <strong>ZR gearbox cover</strong> on the disk-3 side (left).</li>\n<li>Push 6 x <strong>Bolt M3 50mm v2</strong> through both covers from the <strong>L-cover side</strong> (right).</li>\n<li>Screw 6 x <strong>Nut M3 v2</strong> onto them on the <strong>ZR-cover side</strong> (left).</li>\n<li>Tighten evenly, opposite bolts in turn.</li>\n</ol>\n<p><strong>Hardware:</strong> 6x M3x50, 6x M3 nut.</p>\n<p><strong>Check:</strong> The two covers meet with no gap. Nothing rocks.</p>\n<p><strong>Tip:</strong> The cover nuts are <strong>M3, not M4</strong>. (Unexpected Maker)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>ZR gearbox cover</strong> on disk-3 side (left).</li>\n<li>6 x <strong>Bolt M3 50mm v2</strong> through both covers from <strong>L-cover side</strong> (right).</li>\n<li>6 x <strong>Nut M3 v2</strong> on <strong>ZR-cover side</strong> (left).</li>\n<li>Tighten evenly, opposite bolts in turn.</li>\n</ol>\n<p><strong>Hardware:</strong> 6x M3x50, 6x M3 nut.</p>\n<p><strong>Check:</strong> Covers meet, no gap. No rocking.</p>\n<p><strong>Tip:</strong> Cover nuts are <strong>M3, not M4</strong>. (Unexpected Maker)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>ZR gearbox cover</strong> (zero-backlash mod) on the disk-3 side (left).</li>\n<li>Push 6x <strong>Bolt M3 50mm v2</strong> through both covers from the L-cover side (right).</li>\n<li>Screw 6x <strong>Nut M3 v2</strong> on, on the ZR-cover side (left).</li>\n<li>Tighten evenly, opposite bolts in turn.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Nuts are M3</div>\n<p>The cover nuts are <strong>M3</strong>, not M4.</p>\n</div>\n<p>Check: The covers meet with no gap. Nothing rocks.</p>", "checks_simple": [], "ts": [4, 94, 10, 15, 11, 17]}, {"stage": 3, "kind": "step", "n": 57, "title": "The rest of the outer pins and the shaft bearing", "img": "Attachments/Arctos/web/manual/arctos-step-057.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>From the ZR-cover side, push the rest of the <strong>Z gearbox pin 50mm</strong> pins into the ring of holes. About 21 more are drawn, for 25 in total.</li>\n<li>Put 1 x <strong>Bearing 61810</strong> on the ZR-cover side.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> onto the camshaft end, in the centre.</li>\n<li>Pull the locking pin or filament out of the disks.</li>\n</ol>\n<p><strong>Hardware:</strong> about 21x Z gearbox pin (could not count exactly; total must be 25), 1x 61810, 1x 61803. \"(4) (1)\" are CAD numbers.</p>\n<p><strong>Check:</strong> All 25 pins are in and tight. Both 61810 bearings are seated.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Order that worked for Unexpected Maker: camshaft rod first, then the 5 centre pins, then the outer pins.</li>\n<li>Pins must be a tight fit. (Unexpected Maker)</li>\n<li>Look for support material left in a cover corner. It tilted his gearbox. (Unexpected Maker)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>From ZR-cover side, remaining <strong>Z gearbox pin 50mm</strong> pins into the ring of holes. About 21 more drawn; 25 total.</li>\n<li>1 x <strong>Bearing 61810</strong> on ZR-cover side.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> onto camshaft end, centre.</li>\n<li>Pull locking pin/filament from the disks.</li>\n</ol>\n<p><strong>Hardware:</strong> about 21x Z gearbox pin (not exactly countable; total must be 25), 1x 61810, 1x 61803. \"(4) (1)\" are CAD numbers.</p>\n<p><strong>Check:</strong> All 25 pins in, tight. Both 61810 seated.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Order that worked for Unexpected Maker: camshaft rod, then 5 centre pins, then outer pins.</li>\n<li>Pins must be tight. (Unexpected Maker)</li>\n<li>Check for support material in a cover corner; it tilted his gearbox. (Unexpected Maker)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>From the ZR-cover side, push <strong>Z gearbox pin 50mm</strong> pins into every empty hole of the ring.</li>\n<li>Put 1x <strong>Bearing 61810</strong> on the ZR-cover side.</li>\n<li>Press 1x <strong>Bearing 61803</strong> onto the camshaft end, in the centre.</li>\n<li>Pull the locking filament out of the disks.</li>\n</ol>\n<p>Check: Every ring hole has a tight pin. Both 61810 bearings are seated. No support material is left in a cover corner.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 5, 9]}, {"stage": 3, "kind": "step", "n": 58, "title": "Ready to mount", "img": "Attachments/Arctos/web/manual/arctos-step-058.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Check the L-cover side: the 61810 from step 54 is on, and the 6 bolt heads are in.</li>\n</ol>\n<p><strong>Hardware:</strong> none new. (unsure: there are no labels here. The 6 long, thin bolts look like the same M3x50 bolts from step 56, seen from the L side. The ring looks like the step-54 61810. The old caption guessed M5 bolts; the pictures do not support that.)</p>\n<p><strong>Check:</strong> Turn the camshaft by hand. It turns smoothly with no clicking. The housing turns slowly.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>L-cover side: 61810 from step 54 on, 6 bolt heads in.</li>\n</ol>\n<p><strong>Hardware:</strong> none new. (unsure: no labels. The 6 long thin bolts look like the M3x50 from step 56, seen from L side. Ring looks like the step-54 61810. Old caption guessed M5 bolts; pictures do not support that.)</p>\n<p><strong>Check:</strong> Turn camshaft by hand: smooth, no clicking. Housing turns slowly.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the gearbox to the L-cover side.</li>\n<li>Check the <strong>Bearing 61810</strong> from step 54 is on.</li>\n<li>Check the 6x <strong>Bolt M3 50mm v2</strong> heads from step 56 are in.</li>\n</ol>\n<p>Check: The camshaft turns smoothly with no clicking. The housing turns slowly.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 3, "kind": "test", "key": "zg-test", "title": "Test the Z gearbox", "img": null, "html": "<p>Unexpected Maker's good Z gearbox had \"no backlash at all\".</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["Smooth by hand.", "Almost no play at the output."], "html_pro": "<p>Unexpected Maker's good Z gearbox: \"no backlash at all\".</p>", "checks_pro": ["Smooth by hand.", "Almost no play at output."], "html_simple": "<p>Test the Z gearbox.</p>", "checks_simple": ["Smooth by hand", "Almost no play at output"], "ts": [7, 0]}, {"stage": 4, "kind": "step", "n": 59, "title": "Join the two elbow cores", "img": "Attachments/Arctos/web/manual/arctos-step-059.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Take the <strong>A R CORE</strong> (round plate with a big hole, top) and <strong>ZL core 1</strong> (round plate with a bearing seat, bottom).</li>\n<li>Slot their square ends together at the corner.</li>\n</ol>\n<p><strong>Hardware:</strong> none.</p>\n<p><strong>Orientation:</strong> The two round plates face each other, with a gap between them for the gearbox.</p>\n<p><strong>Check:</strong> The square ends fit fully together with no step.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>A R CORE</strong> (round plate, big hole, top) + <strong>ZL core 1</strong> (round plate, bearing seat, bottom).</li>\n<li>Slot square ends together at the corner.</li>\n</ol>\n<p><strong>Hardware:</strong> none.</p>\n<p><strong>Orientation:</strong> Round plates face each other, gap between for the gearbox.</p>\n<p><strong>Check:</strong> Square ends fully mated, no step.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>A R CORE</strong> (top) and the <strong>ZL core 1</strong> (bottom).</li>\n<li>Slot their square ends together at the corner.</li>\n<li>The two round plates face each other, with a gap for the gearbox.</li>\n</ol>\n<p>Check: The square ends fit fully, with no step.</p>", "checks_simple": [], "ts": [2, 3, 8, 12]}, {"stage": 4, "kind": "step", "n": 60, "title": "Bolt the elbow cores together", "img": "Attachments/Arctos/web/manual/arctos-step-060.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put 2 x <strong>Nut M3 v2</strong> into the nut pockets: 1 at the top, 1 at the bottom.</li>\n<li>Push 2 x <strong>Bolt M3 20mm v2</strong> in from the outside (right).</li>\n<li>Tighten them into the nuts.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x M3x20, 2x M3 nut.</p>\n<p><strong>Check:</strong> The joint does not flex.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>2 x <strong>Nut M3 v2</strong> into nut pockets: 1 top, 1 bottom.</li>\n<li>2 x <strong>Bolt M3 20mm v2</strong> in from outside (right).</li>\n<li>Tighten into nuts.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x M3x20, 2x M3 nut.</p>\n<p><strong>Check:</strong> Joint does not flex.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 2x <strong>Nut M3 v2</strong> in the nut pockets: 1 top, 1 bottom.</li>\n<li>Push 2x <strong>Bolt M3 20mm v2</strong> in from the outside (right).</li>\n<li>Tighten them into the nuts.</li>\n</ol>\n<p>Check: The joint does not flex.</p>", "checks_simple": [], "ts": [4, 26, 7]}, {"stage": 4, "kind": "step", "n": 61, "title": "Bring the Z gearbox to the elbow", "img": "Attachments/Arctos/web/manual/arctos-step-061.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Hold the Z gearbox with the <strong>ZR-cover side</strong> (the nut side) facing you.</li>\n<li>Find the <strong>▼Z</strong> mark on the elbow plate.</li>\n<li>Lower the gearbox into the elbow, between the two round plates.</li>\n</ol>\n<p><strong>Orientation:</strong> The ▼Z mark points to the top of the joint. (unsure: which edge of the gearbox lines up with ▼Z; match the bolt holes.)</p>\n<p><strong>Check:</strong> The bolt holes in the plates line up with holes in the gearbox covers.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Z gearbox with <strong>ZR-cover side</strong> (nut side) toward you.</li>\n<li>Locate <strong>▼Z</strong> mark on elbow plate.</li>\n<li>Lower gearbox into elbow between the two round plates.</li>\n</ol>\n<p><strong>Orientation:</strong> ▼Z points to top of joint. (unsure: which gearbox edge aligns with ▼Z; match bolt holes.)</p>\n<p><strong>Check:</strong> Plate bolt holes align with gearbox cover holes.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Hold the Z gearbox with the <strong>ZR gearbox cover</strong> side (nut side) toward you.</li>\n<li>Find the <strong>▼Z</strong> mark on the elbow plate. It points to the top of the joint.</li>\n<li>Lower the gearbox into the elbow, between the two round plates.</li>\n</ol>\n<p>Check: The plate bolt holes line up with the gearbox cover holes.</p>", "checks_simple": [], "ts": [4, 26, 72]}, {"stage": 4, "kind": "step", "n": 62, "title": "Bolt the gearbox into the elbow", "img": "Attachments/Arctos/web/manual/arctos-step-062.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push 5 x long bolts through the front plate (the ▼Z plate) into the gearbox.</li>\n<li>Push 5 x <strong>Bolt M3 20mm v2</strong> in from the back.</li>\n<li>Tighten all 10 in turn.</li>\n</ol>\n<p><strong>Hardware:</strong> 5x long bolts (unsure: not labelled; about twice as long as the M3x20 in the picture), 5x M3x20. The old caption said 6 short bolts; the picture shows 5.</p>\n<p><strong>Check:</strong> The gearbox is firmly held. The centre still turns.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>5 x long bolts through front plate (▼Z plate) into gearbox.</li>\n<li>5 x <strong>Bolt M3 20mm v2</strong> in from the back.</li>\n<li>Tighten all 10 in turn.</li>\n</ol>\n<p><strong>Hardware:</strong> 5x long bolts (unsure: unlabelled; about twice the M3x20 length in picture), 5x M3x20. Old caption said 6 short bolts; picture shows 5.</p>\n<p><strong>Check:</strong> Gearbox held firmly. Centre still turns.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Push 5x long bolts through the ▼Z plate (left) into the gearbox.</li>\n<li>Push 5x <strong>Bolt M3 20mm v2</strong> in from the back (right).</li>\n<li>Tighten all 10 in turn.</li>\n</ol>\n<p>The long bolts are about twice as long as the M3x20.</p>\n<p>Check: The gearbox is held firmly. The centre still turns.</p>", "checks_simple": [], "ts": [26, 0, 7]}, {"stage": 4, "kind": "step", "n": 63, "title": "Open the upper arm", "img": "Attachments/Arctos/web/manual/arctos-step-063.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Gently pull the two upper-arm plates apart (red arrows). \"Stretch Z axis cores so that A axis can fit.\"</li>\n<li>Hold them apart.</li>\n</ol>\n<p><strong>Check:</strong> The gap is wide enough for the elbow. Don't bend so far that a plate cracks.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Gently spread the two upper-arm plates (red arrows). \"Stretch Z axis cores so that A axis can fit.\"</li>\n<li>Hold apart.</li>\n</ol>\n<p><strong>Check:</strong> Gap wide enough for elbow. Do not over-bend; a plate can crack.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Gently pull the two upper-arm plates apart (red arrows).</li>\n<li>Hold them apart.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Plate can crack</div>\n<p>Do not bend the plates too far.</p>\n</div>\n<p>Check: The gap is wide enough for the elbow.</p>", "checks_simple": [], "ts": [34, 35, 7]}, {"stage": 4, "kind": "step", "n": 64, "title": "Put the elbow in and fit the 5 inner rods (M4)", "img": "Attachments/Arctos/web/manual/arctos-step-064.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Slide the elbow between the upper-arm plates. Line the gearbox up with the two hubs.</li>\n<li>Let the plates spring back.</li>\n<li>Push 5 x <strong>Rod M4 100mm</strong> through the 5 holes around the near hub (left in the picture).</li>\n<li>Push each rod through the gearbox and out of the far hub.</li>\n<li>Screw 1 x <strong>Nut M4 v2</strong> on each rod end on the far side (5 nuts).</li>\n<li>Screw 1 x <strong>Nut M4 v2</strong> on each rod end on the near side (5 nuts).</li>\n</ol>\n<p><strong>Hardware:</strong> 5x M4x100 rod, 10x M4 nut. \"(4)\" is a CAD number.</p>\n<p><strong>Check:</strong></p>\n<ul>\n<li>The last rod meets some resistance. That shows correct assembly. (official docs)</li>\n<li>All 10 nuts are tight.</li>\n</ul>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>The M4 rods were missing from the old slides. <strong>Insert them from the left side</strong>, because they thread into nuts on the right. (Unexpected Maker)</li>\n<li>Use the <strong>M4</strong> rods here, not the M5 ones.</li>\n<li>Many builders use <strong>M4x100 bolts</strong> instead of rod. Unexpected Maker called it the \"best thing I ever did\".</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Slide elbow between upper-arm plates; align gearbox with the two hubs.</li>\n<li>Plates spring back.</li>\n<li>5 x <strong>Rod M4 100mm</strong> through the 5 holes around near hub (left in picture).</li>\n<li>Each rod through gearbox and out of far hub.</li>\n<li>1 x <strong>Nut M4 v2</strong> on each rod end, far side (5 nuts).</li>\n<li>1 x <strong>Nut M4 v2</strong> on each rod end, near side (5 nuts).</li>\n</ol>\n<p><strong>Hardware:</strong> 5x M4x100 rod, 10x M4 nut. \"(4)\" is a CAD number.</p>\n<p><strong>Check:</strong></p>\n<ul>\n<li>Last rod meets some resistance: correct assembly. (official docs)</li>\n<li>All 10 nuts tight.</li>\n</ul>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>M4 rods were missing from old slides. <strong>Insert from the left side</strong>; they thread into nuts on the right. (Unexpected Maker)</li>\n<li><strong>M4</strong> rods here, not M5.</li>\n<li>Many use <strong>M4x100 bolts</strong> instead of rod. Unexpected Maker: \"best thing I ever did\".</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Slide the elbow between the upper-arm plates. Line the gearbox up with the two hubs.</li>\n<li>Push 5x <strong>Rod M4 100mm</strong> in from the left, through the near hub and the gearbox.</li>\n<li>Screw 1x <strong>Nut M4 v2</strong> on each rod end on the far side (5 nuts).</li>\n<li>Screw 1x <strong>Nut M4 v2</strong> on each rod end on the near side (5 nuts).</li>\n</ol>\n<p>Use <strong>M4</strong> rods here, not M5.</p>\n<p>Check: All 10 nuts are tight. The last rod meets some resistance. That is correct.</p>", "checks_simple": [], "ts": [4, 5, 9, 13]}, {"stage": 4, "kind": "step", "n": 65, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-065.webp", "html": "<p><strong>Check:</strong> 5 nuts sit round the near hub. The ▼Z mark is on top. The camshaft end shows in the centre.</p>", "html_pro": "<p><strong>Check:</strong> 5 nuts round near hub. ▼Z on top. Camshaft end visible in centre.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: 5 nuts round the near hub, and the ▼Z mark on top.</p>", "checks_simple": [], "ts": [4, 94, 10, 15, 11, 17]}, {"stage": 4, "kind": "step", "n": 66, "title": "The Z pulley", "img": "Attachments/Arctos/web/manual/arctos-step-066.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push the <strong>Z pulley</strong> onto the camshaft through the near hub. Its key must engage the camshaft end.</li>\n</ol>\n<p><strong>Check:</strong> The pulley sits fully home. It does not rock.</p>\n<p><strong>Tip:</strong> If it does not engage, push it further on. A washer fixed this on Y. (designer)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>Z pulley</strong> onto camshaft through near hub. Key must engage camshaft end.</li>\n</ol>\n<p><strong>Check:</strong> Pulley fully home, no rocking.</p>\n<p><strong>Tip:</strong> If not engaged, push further on. A washer fixed this on Y. (designer)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Push the <strong>Z pulley</strong> (the printed HTD mod pulley, 50 teeth) onto the camshaft through the near hub.</li>\n<li>Its key must engage the camshaft end. If it does not, push it further on.</li>\n</ol>\n<p>Check: The pulley is fully home and does not rock.</p>", "checks_simple": [], "ts": [94, 10, 15, 11, 17, 16]}, {"stage": 4, "kind": "step", "n": 67, "title": "The Z centre rod", "img": "Attachments/Arctos/web/manual/arctos-step-067.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Calibrate the Z driver now if you have not.</div>\n<p>The belt goes on in step 69. Calibration needs the motor free.</p>\n</div>\n<p><strong>Do:</strong></p>\n<ol>\n<li>Push 1 x <strong>Rod M5 100mm</strong> through the centre of the Z pulley and the gearbox.</li>\n<li>Screw 1 x <strong>Nut M5 v2</strong> on the far end.</li>\n<li>Screw <strong>Nut M5 v2</strong> onto the near end, outside the pulley. 2 nuts are drawn on this side.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x M5x100 rod, 3x M5 nut drawn. (unsure: step 68 shows only 1 nut on the pulley face. The second near-side nut may be a lock nut.)</p>\n<p><strong>Check:</strong> The rod sticks out at both ends. The pulley is held tight.</p>\n<p><strong>Tip:</strong> The rod \"isn't quite long enough\" for a nut each end. Use an M5 bolt 100 mm long (not counting the head), or longer rod. (Unexpected Maker)</p>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Calibrate Z driver now if not done.</div>\n<p>Belt goes on in step 69; calibration needs the motor free.</p>\n</div>\n<p><strong>Do:</strong></p>\n<ol>\n<li>1 x <strong>Rod M5 100mm</strong> through centre of Z pulley and gearbox.</li>\n<li>1 x <strong>Nut M5 v2</strong> on far end.</li>\n<li><strong>Nut M5 v2</strong> on near end, outside pulley. 2 nuts drawn on this side.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x M5x100 rod, 3x M5 nut drawn. (unsure: step 68 shows 1 nut on pulley face; second near-side nut may be a lock nut.)</p>\n<p><strong>Check:</strong> Rod protrudes both ends. Pulley held tight.</p>\n<p><strong>Tip:</strong> Rod \"isn't quite long enough\" for a nut each end. Use M5 bolt 100 mm long (excluding head) or longer rod. (Unexpected Maker)</p>", "checks_pro": [], "html_simple": "<div class=\"callout warning\">\n<div class=\"callout-title\">Calibrate the Z driver first</div>\n<p>Do it before the belt goes on in step 69.</p>\n</div>\n<ol>\n<li>Push 1x <strong>Rod M5 100mm</strong> through the centre of the <strong>Z pulley</strong> and the gearbox.</li>\n<li>Screw 1x <strong>Nut M5 v2</strong> on the far end.</li>\n<li>Screw 2x <strong>Nut M5 v2</strong> on the near end, outside the pulley.</li>\n</ol>\n<p>Check: The rod sticks out at both ends. The pulley is held tight.</p>", "checks_simple": [], "ts": [4, 5, 9, 13, 28, 30]}, {"stage": 4, "kind": "step", "n": 68, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-068.webp", "html": "<p><strong>Check:</strong> One nut sits on the pulley face. The rod end shows.</p>", "html_pro": "<p><strong>Check:</strong> One nut on pulley face. Rod end visible.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: a nut on the pulley face, with the rod end showing.</p>", "checks_simple": [], "ts": [4, 5, 9, 13, 16]}, {"stage": 4, "kind": "step", "n": 69, "title": "The Z belt", "img": "Attachments/Arctos/web/manual/arctos-step-069.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Loop <strong>GT2 W10 450 mm</strong> around the big Z pulley.</li>\n<li>Loop it down around the small motor pulley on the upper arm.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 450 mm belt.</p>\n<p><strong>Check:</strong> The belt runs straight, not twisted.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>GT2 W10 450 mm</strong> around big Z pulley.</li>\n<li>Down around small motor pulley on upper arm.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 450 mm belt.</p>\n<p><strong>Check:</strong> Belt straight, not twisted.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Loop the <strong>Z belt HTD 5M 470 mm</strong> (9 mm wide, \"470-5M-9\") around the big <strong>Z pulley</strong>. Teeth face in.</li>\n<li>Loop it down around the small motor pulley on the upper arm.</li>\n</ol>\n<p>Check: The belt runs straight, not twisted.</p>", "checks_simple": [], "ts": [28, 30, 16, 72, 33]}, {"stage": 4, "kind": "step", "n": 70, "title": "The Z belt tensioner", "img": "Attachments/Arctos/web/manual/arctos-step-070.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put the <strong>Nut M5 v2</strong> at the back of the <strong>Z belt tensioner</strong>.</li>\n<li>Fix the <strong>GT2 idler W10</strong> to the tensioner with 1 x <strong>Bolt M5 25mm v2</strong>.</li>\n<li>Put 2 x <strong>Nut M3 v2</strong> behind the arm plate.</li>\n<li>Fix the tensioner to the plate with 2 x <strong>Bolt M3 20mm v2</strong> through its slots.</li>\n<li>Leave the M3 bolts slightly loose.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x GT2 idler W10, 1x M5x25, 1x M5 nut, 2x M3x20, 2x M3 nut.</p>\n<p><strong>Check:</strong> The tensioner slides in its slots.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>M3x20 is the limit before the screws hit the gearbox. M3x15 also works. (designer, via Unexpected Maker)</li>\n<li>The idler bolt is M5x25. One kit did not include it. (Unexpected Maker)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>Nut M5 v2</strong> at back of <strong>Z belt tensioner</strong>.</li>\n<li><strong>GT2 idler W10</strong> to tensioner with 1 x <strong>Bolt M5 25mm v2</strong>.</li>\n<li>2 x <strong>Nut M3 v2</strong> behind arm plate.</li>\n<li>Tensioner to plate with 2 x <strong>Bolt M3 20mm v2</strong> through its slots.</li>\n<li>Leave M3 bolts slightly loose.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x GT2 idler W10, 1x M5x25, 1x M5 nut, 2x M3x20, 2x M3 nut.</p>\n<p><strong>Check:</strong> Tensioner slides in slots.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>M3x20 is the limit before screws hit gearbox; M3x15 also works. (designer, via Unexpected Maker)</li>\n<li>Idler bolt is M5x25; one kit omitted it. (Unexpected Maker)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix the <strong>GT2 idler W10</strong> to the <strong>Z belt tensioner</strong> with 1x <strong>Bolt M5 25mm v2</strong> and 1x <strong>Nut M5 v2</strong> at the back.</li>\n<li>Put 2x <strong>Nut M3 v2</strong> behind the arm plate.</li>\n<li>Fix the tensioner to the plate with 2x <strong>Bolt M3 20mm v2</strong> through its slots.</li>\n<li>Leave the M3 bolts slightly loose.</li>\n</ol>\n<p>Use M3x20 or shorter (M3x15 also works).</p>\n<p>Check: The tensioner slides in its slots.</p>", "checks_simple": [], "ts": [4, 28, 30, 29, 58, 59]}, {"stage": 4, "kind": "step", "n": 71, "title": "Tension the Z belt", "img": "Attachments/Arctos/web/manual/arctos-step-071.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push the tensioner so the idler presses on the belt (red arrow).</li>\n<li>\"Tighten the belt, then tighten the bolts to secure the tensioner.\"</li>\n<li>Slide the motor pulley until the belt runs straight. Tighten its set screw.</li>\n</ol>\n<p><strong>Check:</strong> The belt is tight. It does not skip when you turn the Z pulley by hand.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push tensioner so idler presses on belt (red arrow).</li>\n<li>\"Tighten the belt, then tighten the bolts to secure the tensioner.\"</li>\n<li>Slide motor pulley until belt runs straight; tighten set screw.</li>\n</ol>\n<p><strong>Check:</strong> Belt tight. No skipping when turning Z pulley by hand.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Push the tensioner so the idler presses on the belt (red arrow).</li>\n<li>Tighten the belt, then tighten the M3 bolts to lock the tensioner.</li>\n<li>Slide the motor pulley until the belt runs straight.</li>\n<li>Tighten the motor pulley set screw.</li>\n</ol>\n<p>Check: The belt is tight. It does not skip when you turn the Z pulley by hand.</p>\n<p>Check: the 470 mm HTD belt length is calculated, not test-fitted. If the tensioner cannot make it tight, tell Kai.</p>", "checks_simple": [], "ts": [28, 30, 16, 29, 72, 33]}, {"stage": 4, "kind": "step", "n": 72, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-072.webp", "html": "<p><strong>Check:</strong> The tensioner is locked. The belt is tight.</p>", "html_pro": "<p><strong>Check:</strong> Tensioner locked. Belt tight.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the belt is tight and the tensioner is locked in its slots.</p>", "checks_simple": [], "ts": [28, 30, 7]}, {"stage": 4, "kind": "step", "n": 73, "title": "The Z cable holder and its magnets", "img": "Attachments/Arctos/web/manual/arctos-step-073.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put magnets in the <strong>Z cable holder</strong> where the 3 red arrows point: 2 in the top, 1 in the round end at the bottom.</li>\n<li>Fit the holder to the far side of the elbow, by the hub with the M4 nuts.</li>\n<li>Fix it with 3 x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 3x M3x10, magnets (3x3 mm). (unsure: how many magnets in each spot.)</p>\n<p><strong>Check:</strong> The magnets are flush and test correctly with the sensor.</p>\n<p><strong>Tip:</strong> Same polarity warning as step 45.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wiring point: Z joint crossing</div>\n<p>The cable from the Z driver to the A driver crosses the Z joint here.</p>\n<ul>\n<li>Lay it now, before step 74.</li>\n<li>\"The ZL cover routes wires through itself.\" (Unexpected Maker)</li>\n<li>The A motor goes in at step 75. Its driver must be wired before it goes in. (docs: \"Once mounted, there's no space to add wires on A, B, and C axes\")</li>\n</ul>\n</div>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Magnets into <strong>Z cable holder</strong> at the 3 red arrows: 2 in top, 1 in round end at bottom.</li>\n<li>Holder on far side of elbow, by the hub with the M4 nuts.</li>\n<li>3 x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 3x M3x10, magnets (3x3 mm). (unsure: magnet count per spot.)</p>\n<p><strong>Check:</strong> Magnets flush; test correctly with sensor.</p>\n<p><strong>Tip:</strong> Same polarity warning as step 45.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wiring point: Z joint crossing</div>\n<p>Z driver to A driver cable crosses the Z joint here.</p>\n<ul>\n<li>Lay it now, before step 74.</li>\n<li>\"The ZL cover routes wires through itself.\" (Unexpected Maker)</li>\n<li>A motor goes in at step 75; driver must be wired before it goes in. (docs: \"Once mounted, there's no space to add wires on A, B, and C axes\")</li>\n</ul>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Put magnets (3x3 mm) in the <strong>Z cable holder</strong> at the 3 red arrows: 2 in the top, 1 in the round end.</li>\n<li>Fit the holder on the elbow side with the M4 nuts.</li>\n<li>Fix it with 3x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Lay the A cable next</div>\n<p>Do the next card (lay the cable to A) before step 74.</p>\n</div>\n<p>Check: The magnets sit flush. Each magnet triggers the sensor the same way as step 45.</p>", "checks_simple": [], "ts": [4, 62, 63, 58, 59, 61]}, {"stage": 4, "kind": "wire", "key": "z-cable", "title": "Lay the cable to A, before step 74", "img": null, "html": "<ol>\n<li>The power and CAN for A cross the Z joint here.</li>\n<li>\"The ZL cover routes wires through itself.\" (Unexpected Maker)</li>\n<li>Run +V, GND, CAN H and CAN L out of the Z driver, through the ZL cover core.</li>\n<li>Leave a slack loop so the elbow can bend.</li>\n</ol>\n<p>The A driver must be fully wired before step 75 (next stage).</p>", "ov": ["pr-A", "cc-A"], "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": ["power", "can"], "checks": [], "html_pro": "<ol>\n<li>Power and CAN for A cross the Z joint here.</li>\n<li>\"The ZL cover routes wires through itself.\" (Unexpected Maker)</li>\n<li>Run +V, GND, CAN H, CAN L out of Z driver, through ZL cover core.</li>\n<li>Leave a slack loop so the elbow can bend.</li>\n</ol>\n<p>A driver must be fully wired before step 75 (next stage).</p>", "checks_pro": [], "html_simple": "<p>No new screws here. You lay the 4 wires that are already on the Z driver.</p>\n<ul>\n<li>Run them (V+, Gnd, CANH, CANL) out of the Z driver towards A.</li>\n<li>Lay them along the elbow side, where the ZL cover core goes at step 74.</li>\n<li>Leave a slack loop so the elbow can bend.</li>\n</ul>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wire A before step 75</div>\n<p>The A driver has no room for wires once its motor is in.</p>\n</div>", "checks_simple": [], "ts": [70, 71, 53, 34, 35, 37]}, {"stage": 4, "kind": "step", "n": 74, "title": "The ZL cover core", "img": "Attachments/Arctos/web/manual/arctos-step-074.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Check that every wire passing the elbow is in place.</li>\n<li>Fit the <strong>ZL cover core</strong> over the side of the elbow.</li>\n<li>Fix it with 4 x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 4x M3x10.</p>\n<p><strong>Check:</strong> No wire is pinched under the cover. The elbow turns through its range by hand without pulling a wire tight.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Confirm all wires passing the elbow are in place.</li>\n<li><strong>ZL cover core</strong> over side of elbow.</li>\n<li>4 x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 4x M3x10.</p>\n<p><strong>Check:</strong> No wire pinched under cover. Elbow turns through range by hand, no wire pulled tight.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Check every wire that passes the elbow is in place.</li>\n<li>Fit the <strong>ZL cover core</strong> over the side of the elbow.</li>\n<li>Fix it with 4x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<p>Check: No wire is pinched under the cover. The elbow turns through its range with no wire pulled tight.</p>", "checks_simple": [], "ts": [26, 0, 70, 71, 72]}, {"stage": 4, "kind": "step", "n": 152, "title": "On the Z cable holder at the elbow, check the magnets are in the…", "img": "Attachments/Arctos/web/manual/arctos-step-152.webp", "html": "<p>On the Z cable holder at the elbow, check the magnets are in the holes the red arrows show. Parts: none labelled. Hardware: magnets. Note: \"magnets\"</p>", "moved": "Paper manual step 152. In the paper manual this is in the Limit switches section near the end (steps 146–159). It is done here, right after this joint, while you can still reach the spot.", "html_pro": "<p>Z cable holder at elbow: check magnets in the holes the red arrows show. Parts: none labelled. Hardware: magnets. Note: \"magnets\"</p>", "checks_pro": [], "html_simple": "<p>Check a magnet sits in each hole the 3 red arrows show on the <strong>Z cable holder</strong>: 2 in the top, 1 in the round end.</p>", "checks_simple": [], "ts": [62, 54, 63, 70, 71]}, {"stage": 4, "kind": "step", "n": 153, "title": "Fix a KYD003 endstop to the Z encoder holder with M2 screws", "img": "Attachments/Arctos/web/manual/arctos-step-153.webp", "html": "<p>Fix a KYD003 endstop to the Z encoder holder with M2 screws. Fix the holder over the Z hub with Bolt M3 20mm (drawn: 2). Parts: Z encoder holder (2), KYD003 endstop. Hardware: M2 screws, Bolt M3 20mm v2. Note: \"M2 screws\"</p>", "html_pro": "<p>KYD003 endstop to Z encoder holder with M2 screws. Holder over Z hub with Bolt M3 20mm (drawn: 2). Parts: Z encoder holder (2), KYD003 endstop. Hardware: M2 screws, Bolt M3 20mm v2. Note: \"M2 screws\"</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix 2x <strong>KYD003 endstop</strong> to the <strong>Z encoder holder</strong> with <strong>M2 screws</strong>, one on each side edge as drawn.</li>\n<li>Fix the holder over the Z hub with 2x <strong>Bolt M3 20mm v2</strong>.</li>\n</ol>", "checks_simple": [], "ts": [87, 91, 58, 59, 61, 64]}, {"stage": 4, "kind": "step", "n": 154, "title": "Result: the Z encoder holder is on and the endstop wire runs down…", "img": "Attachments/Arctos/web/manual/arctos-step-154.webp", "html": "<p>Result: the Z encoder holder is on and the endstop wire runs down the arm. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: Z encoder holder on; endstop wire runs down the arm. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the holder is on, and the endstop wire runs down the arm.</p>", "checks_simple": [], "ts": [87, 91, 58, 59, 61, 64]}, {"stage": 4, "kind": "wire", "key": "z-sensors", "title": "Wire the Z limit sensors", "img": null, "html": "<ol>\n<li>Two <strong>KY-003</strong>: \"Back\" and \"Front\". <strong>Front = home.</strong></li>\n<li>Wire them to the Z 42D: <strong>En = limit 1, Dir = limit 2</strong>.</li>\n<li>Check the <strong>COM-to-+V jumper</strong> is fitted.</li>\n<li>If the leads can't reach the magnet, use 2x M2.5 nuts as spacers.</li>\n<li>If Z runs past its limit later, the sensor-to-direction pairing is reversed. Swap the two sensors, or change HmDir.</li>\n</ol>", "ov": ["li-Z"], "bench": ["lim", "sensor", "com"], "drv": "42D", "grip": null, "conn": [["from the Front sensor **S**", "**En**", "blu", "home, on the \"Z lim\" lead", "En", "Front S", "", null, "Blue"], ["from the Front sensor **+**", "**+5V**", "red", "5 V from the driver", "+5V", "Front +", "", null, "Red"], ["from the Front sensor **−**", "**GND**", "blk", "", "GND", "Front −", "", null, "Black"], ["from the Back sensor **S**", "**Dir**", "blu", "on the \"Z lim\" lead", "Dir", "Back S", "", null, "Blue"], ["from the Back sensor **+**", "**+5V**", "red", "same screw as the other sensor", "+5V", "Back +", "", null, "Red"], ["from the Back sensor **−**", "**GND**", "blk", "same screw", "GND", "Back −", "", null, "Black"]], "conn_title": null, "sen": "ky", "sen_names": ["Front", "Back"], "wire": ["sensor"], "checks": [], "html_pro": "<ol>\n<li>Two <strong>KY-003</strong>: \"Back\" and \"Front\". <strong>Front = home.</strong></li>\n<li>Wire to Z 42D: <strong>En = limit 1, Dir = limit 2</strong>.</li>\n<li><strong>COM-to-+V jumper</strong> fitted.</li>\n<li>Leads can't reach magnet: 2x M2.5 nuts as spacers.</li>\n<li>Z runs past limit later: sensor-to-direction pairing reversed. Swap the two sensors, or change HmDir.</li>\n</ol>", "checks_pro": [], "html_simple": "<p><strong>Sensor signals:</strong> right-hand block of the Z 42D (En, Dir). <strong>Sensor 5 V:</strong> left-hand block (+5V, GND). Two <strong>KY-003</strong> boards: Front and Back. <strong>Front = home.</strong></p>\n<ol>\n<li><strong>Blue</strong> from the Front sensor <strong>S</strong> → <strong>En</strong> (home, on the \"Z lim\" lead)</li>\n<li><strong>Red</strong> from the Front sensor <strong>+</strong> → <strong>+5V</strong> (5 V from the driver)</li>\n<li><strong>Black</strong> from the Front sensor <strong>−</strong> → <strong>GND</strong></li>\n<li><strong>Blue</strong> from the Back sensor <strong>S</strong> → <strong>Dir</strong> (on the \"Z lim\" lead)</li>\n<li><strong>Red</strong> from the Back sensor <strong>+</strong> → <strong>+5V</strong> (same screw as the other sensor)</li>\n<li><strong>Black</strong> from the Back sensor <strong>−</strong> → <strong>GND</strong> (same screw)</li>\n</ol>\n<ul>\n<li>Check that the short <strong>COM → +5V</strong> wire is in.</li>\n<li>If the leads can't reach the magnet, use two M2.5 nuts as spacers.</li>\n</ul>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Sensor power = 5 V from the driver</div>\n<p>Never connect a sensor to the 24 V wires. That burns it out.</p>\n</div>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Z runs past its limit</div>\n<p>Swap the two sensors, or change HmDir.</p>\n</div>", "checks_simple": [], "ts": [4, 62, 54, 85, 63, 87]}, {"stage": 4, "kind": "test", "key": "z-test", "title": "Test Z", "img": null, "html": "", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["Belt off: jog Z ±5°.", "Belt on: jog ±10°, then home. It stops at the Front sensor.", "Bend the elbow by hand through its range. No wire goes tight."], "html_pro": "", "checks_pro": ["Belt off: jog Z ±5°.", "Belt on: jog ±10°, then home; stops at Front sensor.", "Bend elbow by hand through range; no wire tight."], "html_simple": "", "checks_simple": ["Belt off: jog Z ±5°", "Belt on: jog ±10°, then home, stops at Front sensor", "Bend elbow by hand, no wire goes tight"], "ts": [7, 28, 58, 70]}, {"stage": 5, "kind": "wire", "key": "A-setup", "title": "Set up the A driver on the table", "img": null, "html": "<p>Do this before you build the A gearbox. It is the same job as the X driver (start of the X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>A</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 34 mm</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x40 (test-fit first)</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>4</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1300 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>1x WSH231 switch</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with a meter (each under **", "**+5V**", "red", "without it, homing never stops at the sensor", "COM~+5V", "COM → +5V", "", null, "Red"]], "conn_title": null, "sen": "wsh", "sen_names": null, "wire": ["coil", "power", "can", "sensor"], "checks": [], "html_pro": "<p>Before building the A gearbox. Same as X driver (start of X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>A</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 34 mm</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x40 (test-fit first)</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>4</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1300 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>1x WSH231 switch</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue to centre of shaft end; let dry. Fit driver with M3x40 (test-fit first) bolts.</li>\n<li><strong>Power:</strong> check polarity with meter; + to V+, − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on shaft. Menu as X, but <strong>CanID 4</strong>, <strong>Ma about 1300 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on bus.</li>\n<li><strong>Sensors:</strong> En = home, Dir = other. Work only after <strong>remap and COM jumper</strong> (as Z): <code>04 9E 01 A3</code>.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Same job as the X driver, with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>A</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 34 mm</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x40 (test-fit first)</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>4</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1300 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>1x WSH231 switch</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>On the 42D:</strong> power = right-hand block, top (V+, Gnd). CAN = left-hand block, bottom (CANH, CANL). Sensor 5 V = left-hand block, top (+5V, GND). Sensor signals = right-hand block (En, Dir). Motor = blue plug on the top edge.</p>\n<ul>\n<li>Lay the motor on its side on a small block (about 2 cm high), so the lower screw blocks of the driver stay free.</li>\n<li>Find the 2 coil pairs with the meter (each under 10 Ω).</li>\n<li>Superglue the magnet to the centre of the shaft end. Let it dry. Fit the driver with its encoder bolts (M3x40 (test-fit first)).</li>\n</ul>\n<ol>\n<li><strong>Green</strong> motor wire → <strong>A+</strong> (coil 1)</li>\n<li><strong>Black</strong> motor wire → <strong>A−</strong> (coil 1)</li>\n<li><strong>Blue</strong> motor wire → <strong>B+</strong> (coil 2)</li>\n<li><strong>Red</strong> motor wire → <strong>B−</strong> (coil 2)</li>\n</ol>\n<ul>\n<li>Meter check: the bench supply <strong>+V</strong> and <strong>−V</strong> the right way round.</li>\n</ul>\n<ol start=\"5\">\n<li><strong>Red</strong> from the bench supply <strong>+V</strong> → <strong>V+</strong> (table test)</li>\n<li><strong>Black</strong> from the bench supply <strong>−V</strong> → <strong>Gnd</strong> (table test)</li>\n<li><strong>Yellow</strong> from CANable <strong>H</strong> → <strong>CANH</strong> (table test, only this driver on the CANable)</li>\n<li><strong>Green</strong> from CANable <strong>L</strong> → <strong>CANL</strong> (table test)</li>\n</ol>\n<ul>\n<li><strong>Cal</strong> with nothing on the shaft. Menu like X, but <strong>CanID 4</strong> and <strong>Ma about 1300 mA</strong>.</li>\n<li>Send the remap <code>04 9E 01 A3</code>.</li>\n</ul>\n<ol start=\"9\">\n<li><strong>Red</strong> from the sensor <strong>3-26V</strong> → <strong>+5V</strong> (5 V from the driver)</li>\n<li><strong>Black</strong> from the sensor <strong>GND</strong> → <strong>GND</strong></li>\n<li><strong>Blue</strong> from the sensor <strong>N_OUT</strong> → <strong>En</strong> (home, north face)</li>\n<li><strong>Blue</strong> from the sensor <strong>S_OUT</strong> → <strong>Dir</strong></li>\n<li><strong>Red</strong> short wire from <strong>COM</strong> → <strong>+5V</strong> (without it, homing never stops at the sensor)</li>\n</ol>\n<ul>\n<li>Take the table-test wires off again before this driver goes in.</li>\n</ul>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Reversed power destroys the driver</div>\n<p>Red = +, black = −. Check three times with the meter.</p>\n</div>", "checks_simple": [], "ts": [62, 54, 85, 63, 87, 91]}, {"stage": 5, "kind": "test", "key": "A-check", "title": "Test the A driver before it goes in", "img": null, "html": "<p>Same tests as X. Fix anything now: the driver is hard to reach later.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["\"Cal success\", and the settings survive a power cycle.", "It answers on ID 4. Read encoder (<code>31</code>) changes when you turn the shaft.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): it stops when you trigger the home sensor by hand."], "html_pro": "<p>Same tests as X. Fix now: driver hard to reach later.</p>", "checks_pro": ["\"Cal success\"; settings survive a power cycle.", "Answers on ID 4. Read encoder (<code>31</code>) changes when shaft turns.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): stops when home sensor triggered by hand."], "html_simple": "<p>Same tests as X.</p>", "checks_simple": ["\"Cal success\", and the settings survive a power cycle.", "It answers on ID 4. Read encoder (<code>31</code>) changes when you turn the shaft.", "Each sensor LED lights with its magnet face. Home (<code>91</code>) stops when you trigger the home sensor by hand."], "ts": [54, 18, 58, 70]}, {"stage": 5, "kind": "wire", "key": "a-wire", "title": "Wire A now, on the bench, before step 75", "img": null, "html": "<div class=\"callout danger\">\n<div class=\"callout-title\">The A driver ends up inside the elbow</div>\n<p>Run every wire <strong>before step 80</strong>, where 4x M3x10 lock the motor in.</p>\n</div>\n<ol>\n<li>Magnet, 42D (encoder bolts <strong>M3x40</strong>: test-fit them), coils.</li>\n<li>Power and <strong>CAN in</strong> from Z. Power and <strong>CAN out</strong> on towards B and C.</li>\n<li>A long <strong>\"A LIMIT\" lead</strong> on the limit input. The sensor itself goes in at step 155.</li>\n<li>CAN ID <strong>4</strong>, remap <code>04 9E 01 A3</code>, COM jumper. <strong>Cal</strong> with nothing on the shaft.</li>\n<li>Before step 98 closes the A core, the wires for the wrist must pass to the A core side, with a slack loop for the roll.</li>\n</ol>", "ov": ["dA", "mA", "pd-A", "cc-A", "co-A"], "bench": ["pwr", "can", "lim"], "drv": "42D", "grip": null, "conn": [["+V from the Z driver", "**V+**", "red", "", "V+", "+V in", "", null, "Red"], ["GND from the Z driver", "**Gnd**", "blk", "", "Gnd", "GND in", "", null, "Black"], ["CAN H from the Z driver", "**CANH**", "yel", "", "CANH", "CAN H in", "", null, "Yellow"], ["CAN L from the Z driver", "**CANL**", "grn", "", "CANL", "CAN L in", "", null, "Green"], ["+V out to the B driver", "**V+**", "red", "same screw as the wire in", "V+", "+V out", "", null, "Red"], ["GND out to the B driver", "**Gnd**", "blk", "same screw as the wire in", "Gnd", "GND out", "", null, "Black"], ["CAN H out to the B driver", "**CANH**", "yel", "same screw as the wire in", "CANH", "CAN H out", "", null, "Yellow"], ["CAN L out to the B driver", "**CANL**", "grn", "same screw as the wire in", "CANL", "CAN L out", "", null, "Green"], ["lead for the sensor", "**+5V**", "red", "labelled \"A LIMIT\", the sensor goes on later", "+5V", "lim +5V", "", null, "Red"], ["lead for the sensor", "**GND**", "blk", cial encoder video).</p>", "html_pro": "<ol>\n<li><strong>Nema_17_34mm</strong> motor and <strong>MKS Servo 42D</strong>.</li>\n<li>Complete all of section 5.1 first.</li>\n<li>Driver flat on <strong>back</strong> of motor; shaft points away from driver.</li>\n<li>4 encoder bolts through driver into motor (see 5.2). Not drawn in picture.</li>\n<li>Bring motor to elbow; picture shows it beside the elbow, shaft pointing forward (left in picture).</li>\n</ol>\n<p><strong>Check:</strong> driver tight, no rocking. Shaft turns by hand. All leads labelled and long enough.\n<strong>Tips:</strong> UM: \"Should have done the wiring as I was going.\" Washers under encoder bolts if possible (official encoder video).</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Get the <strong>Nema_17_34mm v1</strong> motor and the <strong>MKS Servo 42D</strong> (take them off the block on the table).</li>\n<li>Finish the A driver cards before this step.</li>\n<li>The driver sits flat on the <strong>back</strong> of the motor. The shaft points away from the driver.</li>\n<li>Hold the motor by the elbow, shaft pointing left as in the picture.</li>\n</ol>\n<p>Check: the driver does not rock. The shaft turns by hand. All leads are labelled.</p>", "checks_simple": [], "ts": [72, 33, 26]}, {"stage": 5, "kind": "step", "n": 76, "title": "Same picture again", "img": "Attachments/Arctos/web/manual/arctos-step-076.webp", "html": "<ol>\n<li>This picture is identical to step 75. There is no new part.</li>\n<li>Put the motor into the elbow's motor pocket. The shaft must come out through the round hole in the elbow's front plate. Step 77 already shows the shaft sticking out there. (unsure: the picture does not show the exact path into the pocket.)</li>\n</ol>\n<p><strong>Check:</strong> the shaft sticks out of the front plate. No wire is pinched between the motor and the elbow.</p>", "html_pro": "<ol>\n<li>Same picture as step 75; no new part.</li>\n<li>Seat motor in elbow motor pocket; shaft exits the round hole in the elbow front plate (shown in step 77). (unsure: picture does not show the exact path into the pocket.)</li>\n</ol>\n<p><strong>Check:</strong> shaft protrudes from front plate. No wire pinched between motor and elbow.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the motor into the elbow's motor opening.</li>\n<li>The shaft comes out of the <strong>lower round hole</strong> in the front plate.</li>\n</ol>\n<p>Check: no wire is pinched.</p>", "checks_simple": [], "ts": [72, 33, 70, 71]}, {"stage": 5, "kind": "step", "n": 77, "title": "A m3 bolt carrier", "img": "Attachments/Arctos/web/manual/arctos-step-077.webp", "html": "<ol>\n<li>Take the <strong>A m3 bolt carrier</strong> (a narrow printed bar with holes).</li>\n<li>Put it into its slot on the elbow, just below and left of the <strong>\"▼Z\"</strong> mark.</li>\n<li>The bar stands upright. Its round holes face out of the slot.</li>\n</ol>\n<p><strong>Check:</strong> it sits flush in the slot. It does not stick out.</p>", "html_pro": "<ol>\n<li><strong>A m3 bolt carrier</strong> (narrow printed bar with holes) into its elbow slot, just below and left of the <strong>\"▼Z\"</strong> mark.</li>\n<li>Upright; round holes face out of the slot.</li>\n</ol>\n<p><strong>Check:</strong> flush in slot, no protrusion.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>A m3 bolt carrier</strong>.</li>\n<li>Push it into its slot on the elbow, below and left of the <strong>\"▼Z\"</strong> mark.</li>\n<li>The round holes face out of the slot.</li>\n</ol>\n<p>Check: it sits flush.</p>", "checks_simple": [], "ts": [26, 0, 54]}, {"stage": 5, "kind": "step", "n": 78, "title": "Fix the bolt carrier", "img": "Attachments/Arctos/web/manual/arctos-step-078.webp", "html": "<ol>\n<li>Fix the bolt carrier with <strong>2x Bolt M3 10mm</strong> (drawn: 2).</li>\n<li>The picture shows one bolt near the \"Z\" mark and one lower down.</li>\n</ol>\n<p><strong>Check:</strong> the bar does not move when you push it.\n<strong>Tip:</strong> turn small screws in by hand. An impact driver strips the plastic (UM).</p>", "html_pro": "<ol>\n<li>Fix bolt carrier: <strong>2x Bolt M3 10mm</strong> (drawn: 2); one near \"Z\" mark, one lower.</li>\n</ol>\n<p><strong>Check:</strong> bar does not move when pushed.\n<strong>Tip:</strong> hand-drive small screws; impact driver strips the plastic (UM).</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix the bolt carrier with 2x <strong>Bolt M3 10mm</strong>.</li>\n<li>One bolt goes near the \"Z\" mark, one lower down.</li>\n</ol>\n<p>Check: the carrier does not move.</p>", "checks_simple": [], "ts": [26, 0, 54]}, {"stage": 5, "kind": "step", "n": 79, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-079.webp", "html": "<ol>\n<li>Compare with the picture. The bolt carrier is gone into its slot and the bolt heads show.</li>\n<li>The motor shaft sticks out of the front plate, at the lower round hole.</li>\n</ol>\n<p><strong>Check:</strong> nothing is loose. Wires still come out where you planned (section 5.3).</p>", "html_pro": "<ol>\n<li>Compare with picture: bolt carrier seated in slot, bolt heads visible.</li>\n<li>Motor shaft exits front plate at the lower round hole.</li>\n</ol>\n<p><strong>Check:</strong> nothing loose; wires exit as planned (section 5.3).</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the shaft sticks out of the lower round hole. Nothing is loose.</p>", "checks_simple": [], "ts": [72, 33, 26, 70, 71]}, {"stage": 5, "kind": "step", "n": 80, "title": "Bolt the motor to the elbow", "img": "Attachments/Arctos/web/manual/arctos-step-080.webp", "html": "<ol>\n<li><strong>Last chance:</strong> check that the power, CAN in, CAN out and A limit leads are routed (section 5.3).</li>\n<li>Fit <strong>4x Bolt M3 10mm</strong> (drawn: 4) through the front plate into the motor's face.</li>\n<li>The bolts go in from the <strong>front</strong> (the side the shaft points to).</li>\n<li>Tighten them in a cross pattern, a little at a time.</li>\n</ol>\n<p><strong>Check:</strong> the motor does not move. The shaft still turns freely by hand.</p>", "html_pro": "<ol>\n<li><strong>Last chance:</strong> confirm power, CAN in, CAN out and A limit leads are routed (section 5.3).</li>\n<li><strong>4x Bolt M3 10mm</strong> (drawn: 4) through front plate into motor face; insert from the <strong>front</strong> (shaft side).</li>\n<li>Tighten in a cross pattern, incrementally.</li>\n</ol>\n<p><strong>Check:</strong> motor does not move; shaft still turns freely by hand.</p>", "checks_pro": [], "html_simple": "<div class=\"callout warning\">\n<div class=\"callout-title\">Last chance to wire</div>\n<p>Route power, CAN in, CAN out and the A LIMIT lead first (Wire A card).</p>\n</div>\n<ol>\n<li>Fit 4x <strong>Bolt M3 10mm</strong> through the front plate into the motor.</li>\n<li>Put the bolts in from the <strong>front</strong> (shaft side).</li>\n<li>Tighten them in a cross pattern.</li>\n</ol>\n<p>Check: the motor does not move. The shaft turns freely.</p>", "checks_simple": [], "ts": [87, 91, 58, 59, 61, 64]}, {"stage": 5, "kind": "step", "n": 81, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-081.webp", "html": "<ol>\n<li>Four bolt heads sit around the shaft opening. The shaft sticks out of the lower hole.</li>\n</ol>\n<p><strong>Check:</strong> spin the shaft by hand. It must not rub on the plate.</p>", "html_pro": "<ol>\n<li>Four bolt heads around the shaft opening; shaft exits the lower hole.</li>\n</ol>\n<p><strong>Check:</strong> spin shaft by hand; no rubbing on plate.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: four bolt heads around the shaft opening. Spin the shaft by hand. It does not rub.</p>", "checks_simple": [], "ts": [26, 0, 54]}, {"stage": 5, "kind": "step", "n": 82, "title": "AG motor gear and pulley", "img": "Attachments/Arctos/web/manual/arctos-step-082.webp", "html": "<ol>\n<li>Take the <strong>GT2B5W6</strong> pulley.</li>\n<li><strong>Remove the top ring (flange) with pliers.</strong> Picture note: \"Remove the top ring of the pulley with pliers\". 3D manual: \"Slight twist will remove it.\"</li>\n<li>Push the pulley's toothed part into the <strong>AG motor gear</strong>. The gear's bore has teeth that fit the pulley's teeth.</li>\n<li>Slide the gear-and-pulley onto the motor shaft.</li>\n<li>Turn it so the <strong>grub screw</strong> lands on the <strong>flat side</strong> of the shaft.</li>\n<li>Snug the grub screw only. You may need to slide the gear to line it up with the AG input gear in step 94. (Tip adapted from the official v0.2 video: \"do not overtighten the set screw\" on a pulley you must align later.)</li>\n</ol>\n<p><strong>Check:</strong> the pulley does not spin inside the gear. The gear does not wobble when the shaft turns.\n<strong>Note:</strong> the picture shows no bolts between the pulley and the gear. (unsure: the old note said the press fit is \"very tight\"; I found no source for that.)</p>", "html_pro": "<ol>\n<li><strong>GT2B5W6</strong> pulley: remove top ring (flange) with pliers. Picture note: \"Remove the top ring of the pulley with pliers\". 3D manual: \"Slight twist will remove it.\"</li>\n<li>Press pulley toothed part into <strong>AG motor gear</strong> (bore teeth mate with pulley teeth).</li>\n<li>Slide gear-and-pulley onto motor shaft; <strong>grub screw</strong> onto the <strong>flat side</strong> of the shaft.</li>\n<li>Snug the grub screw only; you may need to slide the gear to align with the AG input gear in step 94. (Tip adapted from official v0.2 video: \"do not overtighten the set screw\" on a pulley you must align later.)</li>\n</ol>\n<p><strong>Check:</strong> pulley does not spin in gear; no gear wobble when shaft turns.\n<strong>Note:</strong> picture shows no bolts between pulley and gear. (unsure: old note said press fit is \"very tight\"; no source found.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>GT2B5W6</strong> pulley. Pull off its top ring with pliers.</li>\n<li>Push the pulley's toothed part into the <strong>AG motor gear</strong>.</li>\n<li>Slide the gear and pulley onto the motor shaft.</li>\n<li>Put the <strong>grub screw</strong> on the <strong>flat side</strong> of the shaft.</li>\n<li>Snug the grub screw only. You may need to slide the gear in step 94.</li>\n</ol>\n<p>Check: the pulley does not spin in the gear.</p>", "checks_simple": [], "ts": [28, 31, 72, 26]}, {"stage": 5, "kind": "step", "n": 83, "title": "Middle planets in the A core inner", "img": "Attachments/Arctos/web/manual/arctos-step-083.webp", "html": "<ol>\n<li><strong>Build the gearbox on the bench, not on the arm.</strong> The picture shows the parts near the elbow, but the gearbox is only bolted on in step 94.</li>\n<li>Lay the <strong>A core inner</strong> flat. Its inside teeth face up.</li>\n<li>Put in the 4 <strong>BCGR middle planetary</strong> gears (drawn: 4).</li>\n<li>Set the timing exactly as section 4: 12 and 6 o'clock holes <strong>horizontal</strong>, 3 and 9 o'clock holes <strong>vertical</strong>.</li>\n<li>Picture note: \"Each gear is rotated 90° in respect to the next one.\"</li>\n</ol>\n<p><strong>Check:</strong> all 4 planets mesh with the ring. The gaps between them are equal (Alberto).\n<strong>Tip:</strong> 3D manual: \"This stopper can be used to stop gears from moving. It helps to bolt them more easily.\" (unsure which stopper part that note means.)</p>", "html_pro": "<ol>\n<li><strong>Build gearbox on the bench, not on the arm</strong>; picture shows parts near elbow, but gearbox is only bolted on in step 94.</li>\n<li><strong>A core inner</strong> flat, inside teeth up.</li>\n<li>4x <strong>BCGR middle planetary</strong> (drawn: 4).</li>\n<li>Timing per section 4: 12 and 6 o'clock holes <strong>horizontal</strong>, 3 and 9 o'clock holes <strong>vertical</strong>.</li>\n<li>Picture note: \"Each gear is rotated 90° in respect to the next one.\"</li>\n</ol>\n<p><strong>Check:</strong> all 4 planets mesh with ring; gaps equal (Alberto).\n<strong>Tip:</strong> 3D manual: \"This stopper can be used to stop gears from moving. It helps to bolt them more easily.\" (unsure which stopper part.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Build the gearbox on the bench, not on the arm.</li>\n<li>Lay the <strong>A core inner</strong> flat, inside teeth up.</li>\n<li>Put in 4x <strong>BCGR middle planetary</strong>. Turn each gear 90° from the next one.</li>\n<li>Copy the picture: top and bottom gears have their 2 holes <strong>horizontal</strong>. Left and right gears have them <strong>vertical</strong>.</li>\n</ol>\n<p>Check: all 4 gears mesh with the ring. The gaps are equal.</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23, 20]}, {"stage": 5, "kind": "step", "n": 84, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-084.webp", "html": "<ol>\n<li>Compare with the picture. The 4 planets sit inside the ring, evenly spaced.</li>\n</ol>\n<p><strong>Check:</strong> turn one planet with a finger. All of them move a little together. Nothing jumps a tooth.</p>", "html_pro": "<ol>\n<li>Compare with picture: 4 planets inside ring, evenly spaced.</li>\n</ol>\n<p><strong>Check:</strong> turn one planet by finger; all move slightly together; no tooth skip.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: 4 planets evenly spaced in the ring. Each planet meshes with the ring teeth.</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23]}, {"stage": 5, "kind": "step", "n": 85, "title": "Input sun in the centre", "img": "Attachments/Arctos/web/manual/arctos-step-085.webp", "html": "<ol>\n<li>Turn the A core inner over. You now look at the side that will face the elbow.</li>\n<li>Put the <strong>input sun</strong> in the centre. It is not labelled in the picture. It is the round hub with <strong>3 small holes and 1 centre hole</strong>.</li>\n<li>The 3-hole face points <strong>toward you</strong> (toward the elbow side).</li>\n</ol>\n<p><strong>Check:</strong> the sun sits in the middle and touches all 4 planet stacks evenly.\n<strong>Tip:</strong> Alberto (BC gearbox): to get a sun in, push the ring from below so it opens a little, drop the sun in, then let go. Don't spin the box until the sun is held in.\n<strong>Correction:</strong> the old caption called this a \"planet carrier\". This gearbox has no carrier. It is the sun.</p>", "html_pro": "<ol>\n<li>Flip <strong>A core inner</strong>; this side faces the elbow.</li>\n<li><strong>Input sun</strong> in centre (unlabelled in picture): round hub, <strong>3 small holes and 1 centre hole</strong>; 3-hole face toward you (elbow side).</li>\n</ol>\n<p><strong>Check:</strong> sun centred, touches all 4 planet stacks evenly.\n<strong>Tip:</strong> Alberto (BC gearbox): push ring from below so it opens slightly, drop sun in, release. Do not spin box until sun is held in.\n<strong>Correction:</strong> old caption said \"planet carrier\"; this gearbox has no carrier. It is the sun.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the <strong>A core inner</strong> over. This side faces the elbow.</li>\n<li>Put the <strong>input sun</strong> in the centre. It is the round hub with <strong>3 small holes and 1 centre hole</strong>.</li>\n<li>The 3-hole face points <strong>toward you</strong>.</li>\n</ol>\n<p>Check: the sun touches all 4 planets evenly.</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23]}, {"stage": 5, "kind": "step", "n": 86, "title": "Input planets", "img": "Attachments/Arctos/web/manual/arctos-step-086.webp", "html": "<ol>\n<li>Put the 4 <strong>BCGR input planetary</strong> gears on, one on each middle planet (drawn: 4).</li>\n<li>Line up their 2 holes with the 2 holes in the middle planet below.</li>\n<li>Fit <strong>8x Bolt M3 10mm</strong> (drawn: 8), <strong>2 per gear</strong>. The label \"Bolt M3 10mm v2(Mirror) (26)\" is the CAD part number, not a count.</li>\n<li>The bolts go in from <strong>this side</strong> (the elbow side) into the middle planets.</li>\n<li>Tighten a little on each bolt in turn. That stops one side lifting (Alberto).</li>\n</ol>\n<p><strong>Check:</strong> turn the input sun by hand. All planets turn smoothly with no hard spot.\n<strong>Tips:</strong></p>\n<ul>\n<li>UM: the holes have no clearance, so bolts are hard to drive. He pre-drilled with a <strong>3 mm bit</strong>. (unsure: drill only the gear half the bolt passes through. The other half must keep plastic for the thread to grip.)</li>\n<li>If the holes are half a hole out, turn that gear 180° (UM).</li>\n<li>UM: if you print gears at 98 %, the screw holes shrink too. Enlarge them in CAD first.</li>\n</ul>", "html_pro": "<ol>\n<li>4x <strong>BCGR input planetary</strong>, one per middle planet (drawn: 4); align their 2 holes with the 2 holes in the middle planet below.</li>\n<li><strong>8x Bolt M3 10mm</strong> (drawn: 8), <strong>2 per gear</strong>, into middle planets. Label \"Bolt M3 10mm v2(Mirror) (26)\" is the CAD part number, not a count.</li>\n<li>Bolts enter from <strong>this side</strong> (elbow side).</li>\n<li>Tighten each bolt a little in turn to stop one side lifting (Alberto).</li>\n<li>Then check.</li>\n</ol>\n<p><strong>Check:</strong> turn input sun by hand; all planets smooth, no hard spot.\n<strong>Tips:</strong></p>\n<ul>\n<li>UM: holes have no clearance; hard to drive. He pre-drilled with a <strong>3 mm bit</strong>. (unsure: drill only the gear half the bolt passes through; other half keeps plastic for thread.)</li>\n<li>Holes half a hole out: turn that gear 180° (UM).</li>\n<li>UM: printing gears at 98 % shrinks screw holes too; enlarge in CAD first.</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 4x <strong>BCGR input planetary</strong>, one on each middle planet.</li>\n<li>Line up their 2 holes with the 2 holes below.</li>\n<li>Fit 8x <strong>Bolt M3 10mm</strong>, 2 per gear, from this side.</li>\n<li>Tighten each bolt a little in turn.</li>\n</ol>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Holes half a hole out</div>\n<p>Turn that gear 180°.</p>\n</div>\n<p>Check: the input sun turns all planets smoothly.</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23, 20]}, {"stage": 5, "kind": "step", "n": 87, "title": "Centre bearing", "img": "Attachments/Arctos/web/manual/arctos-step-087.webp", "html": "<ol>\n<li>Take <strong>1x Bearing 61803</strong> (the \"(4)\" in the label is a part number).</li>\n<li>Press it straight onto the input sun's raised hub.</li>\n</ol>\n<p><strong>Check:</strong> the bearing sits flat and fully down. The inner ring turns with the sun.\n<strong>Tip:</strong> UM: \"A bearing between the sun gears is easy to miss\" (a tip from Alberto in his chat).</p>", "html_pro": "<ol>\n<li><strong>1x Bearing 61803</strong> (\"(4)\" in label is a part number).</li>\n<li>Press straight onto input sun raised hub.</li>\n</ol>\n<p><strong>Check:</strong> bearing flat, fully down; inner ring turns with sun.\n<strong>Tip:</strong> UM: \"A bearing between the sun gears is easy to miss\" (tip from Alberto in his chat).</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take 1x <strong>Bearing 61803</strong>.</li>\n<li>Press it straight onto the input sun's raised hub.</li>\n</ol>\n<p>Check: it sits flat and fully down.</p>", "checks_simple": [], "ts": [2, 3, 20, 21, 25, 27]}, {"stage": 5, "kind": "step", "n": 88, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-088.webp", "html": "<ol>\n<li>The bearing sits around the hub. You can still see the 3 small holes in the sun.</li>\n</ol>\n<p><strong>Check:</strong> turn the sun. The gearbox turns smoothly.</p>", "html_pro": "<ol>\n<li>Bearing around hub; 3 small sun holes still visible.</li>\n</ol>\n<p><strong>Check:</strong> turn sun; gearbox smooth.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the bearing sits around the hub, 3 small holes still visible. Turn the sun. It turns smoothly.</p>", "checks_simple": [], "ts": [2, 3, 54]}, {"stage": 5, "kind": "step", "n": 89, "title": "A input sun cap", "img": "Attachments/Arctos/web/manual/arctos-step-089.webp", "html": "<ol>\n<li>Take the <strong>A input sun cap</strong>.</li>\n<li>Turn it so its <strong>cut-out notch</strong> points to the same side as the motor shaft (down). (unsure: inferred from step 90 and step 100. The cut-out lets the gears near the motor gear.)</li>\n<li>Press it on. The 61803 bearing goes into its centre opening.</li>\n<li>Fix it with <strong>M3 x 10 mm</strong> bolts. The picture says \"models missing\", so no bolts are drawn. I counted <strong>5</strong> counterbored holes. Use <strong>5x M3x10</strong>.</li>\n<li>The red arrow points at one of the matching holes in the A core inner rim.</li>\n</ol>\n<p><strong>Check:</strong> the cap sits flat all round. The sun still turns freely by hand.</p>", "html_pro": "<ol>\n<li><strong>A input sun cap</strong>: <strong>cut-out notch</strong> toward motor shaft side (down). (unsure: inferred from step 90 and step 100; cut-out gives gears clearance near motor gear.)</li>\n<li>Press on; 61803 bearing into its centre opening.</li>\n<li>Fix with <strong>M3 x 10 mm</strong> bolts. Picture says \"models missing\" (no bolts drawn); I counted <strong>5</strong> counterbored holes. Use <strong>5x M3x10</strong>.</li>\n<li>Red arrow marks one matching hole in A core inner rim.</li>\n</ol>\n<p><strong>Check:</strong> cap flat all round; sun still turns freely by hand.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>A input sun cap</strong>.</li>\n<li>Turn its <strong>notch</strong> down, to the motor shaft side.</li>\n<li>Press it on. The 61803 bearing goes into its centre opening.</li>\n<li>Fix it with <strong>M3x10 bolts</strong>, one in each counterbored hole (5x). The picture does not draw them.</li>\n</ol>\n<p>Check: the cap sits flat. The sun still turns.</p>", "checks_simple": [], "ts": [2, 3, 72, 26]}, {"stage": 5, "kind": "step", "n": 90, "title": "AG input gear (do it now)", "img": "Attachments/Arctos/web/manual/arctos-step-090.webp", "html": "<ol>\n<li>Take the <strong>AG input gear</strong> and <strong>3x M3x15</strong> (drawn: 3).</li>\n<li>Put the gear on the input sun's 3-hole face, through the cap's centre opening.</li>\n<li>Line up its 3 holes with the 3 holes in the sun.</li>\n<li>Bolt it with the 3x M3x15. Tighten a little at a time.</li>\n<li>Picture note: \"Attach AG input gear in this step it's easier than doing it afterwards in step 99\".</li>\n</ol>\n<p><strong>Check:</strong> the input gear turns the whole gearbox smoothly. It does not wobble.\n<strong>Tip:</strong> Alberto: \"Use the correct bolt length here (about 15 mm). A bolt that is too long will break the sun gear.\"</p>", "html_pro": "<ol>\n<li><strong>AG input gear</strong> + <strong>3x M3x15</strong> (drawn: 3).</li>\n<li>Gear on input sun 3-hole face, through cap centre opening.</li>\n<li>Align 3 holes with the sun's 3 holes.</li>\n<li>Bolt with 3x M3x15; tighten incrementally.</li>\n<li>Picture note: \"Attach AG input gear in this step it's easier than doing it afterwards in step 99\".</li>\n</ol>\n<p><strong>Check:</strong> input gear turns whole gearbox smoothly, no wobble.\n<strong>Tip:</strong> Alberto: \"Use the correct bolt length here (about 15 mm). A bolt that is too long will break the sun gear.\"</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>AG input gear</strong> and 3x <strong>M3x15</strong> bolts.</li>\n<li>Put the gear on the sun's 3-hole face, through the cap's centre opening.</li>\n<li>Line up its 3 holes with the sun's 3 holes.</li>\n<li>A axis stiffer mod: push the <strong>M5 bolt</strong> (head turned down to about 6 mm) through the centre hole of the AG input gear, from its back. It goes on through the centre hole of the input sun.</li>\n<li>Bolt the gear with the 3 M3x15 bolts. The small M5 head sits between their heads.</l
