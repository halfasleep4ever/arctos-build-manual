"html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Press 1 x <strong>Bearing 61803</strong> into hub of Z R uper core.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> into hub of Z L uper core.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x 61803. \"(2)\" = CAD number.</p>\n<p><strong>Orientation:</strong> In picture both bearings enter from left: outer face of Z R uper core, inner face of Z L uper core. (unsure: check against your parts; seat recess shows the side.)</p>\n<p><strong>Check:</strong> Both bearings flush and straight.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Press 1x <strong>Bearing 61803</strong> into the hub of the Z R uper core.</li>\n<li>Press 1x <strong>Bearing 61803</strong> into the hub of the Z L uper core.</li>\n</ol>\n<p>Check: both bearings flush and straight.</p>", "checks_simple": [], "ts": [2, 3, 8, 12]}, {"stage": 2, "kind": "wire", "key": "Z-setup", "title": "Set up the Z driver on the table", "img": null, "html": "<p>Do this now: the Z motor goes in at step 49. It is the same job as the X driver (start of the X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Z</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 60 mm</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x65</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>3</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1600 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>2x KY-003. <strong>Front</strong> = home</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with a meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue it to the centre of the shaft end. Let it dry. Fit the driver with the M3x65 bolts.</li>\n<li><strong>Power:</strong> check the polarity with a meter, then + to V+ and − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on the shaft. Set the menu like X, but <strong>CanID 3</strong> and <strong>Ma about 1600 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on the bus.</li>\n<li><strong>Sensors:</strong> En = home, Dir = the other one. These only work after the <strong>remap and the COM jumper</strong> (next card).</li>\n</ol>", "ov": null, "bench": ["coil", "pwr", "can", "lim", "sensor", "com"], "drv": "42D", "grip": null, "conn": null, "checks": [], "html_pro": "<p>Do now: Z motor goes in at step 49. Same job as X driver (start of X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Z</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 60 mm</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x65</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>3</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1600 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>2x KY-003. <strong>Front</strong> = home</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the 2 pairs with a meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue to centre of shaft end; let dry. Fit driver with M3x65 bolts.</li>\n<li><strong>Power:</strong> check polarity with meter; + to V+, − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on shaft. Menu as X, but <strong>CanID 3</strong>, <strong>Ma about 1600 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on bus.</li>\n<li><strong>Sensors:</strong> En = home, Dir = other. Work only after <strong>remap and COM jumper</strong> (next card).</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Same job as the X driver, with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Z</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 60 mm</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x65</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>3</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1600 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>2x KY-003. <strong>Front</strong> = home</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with a meter. Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire.</li>\n<li><strong>Magnet:</strong> superglue to the centre of the shaft end. Fit the driver with the M3x65 bolts.</li>\n<li><strong>Power:</strong> check polarity with a meter, then + to V+ and − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on the shaft. Menu like X, but <strong>CanID 3</strong>, <strong>Ma about 1600 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on the bus.</li>\n<li><strong>Sensors:</strong> En = home, Dir = the other one.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Reversed power</div>\n<p>Check polarity before you connect.</p>\n</div>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 2, "kind": "wire", "key": "Z-remap", "title": "Z is the first 42D: remap + COM jumper", "img": null, "html": "<p>The 42D has one limit input until you remap it. After the remap, <strong>En = limit 1</strong> and <strong>Dir = limit 2</strong>.</p>\n<ol>\n<li>Send the remap command for this driver:\n   - Z: <code>03 9E 01 A2</code>\n   - A: <code>04 9E 01 A3</code>\n   - B: <code>05 9E 01 A4</code>\n   - C: <code>06 9E 01 A5</code></li>\n<li><strong>Fit the jumper from COM to the sensor +V (5 V).</strong> Without it, homing never stops at the sensor.</li>\n</ol>\n<p>The jumper is drawn only on the A part of the official diagram, so it is easy to miss. See <a class=\"wl\" href=\"#/mks/4-remap-the-42d-limit-inputs\">MKS Driver Setup › 4. Remap the 42D limit inputs</a>.</p>", "ov": null, "bench": ["com", "lim"], "drv": "42D", "grip": null, "conn": [["COM", "sensor +V (5 V)", "red", "jumper: required"], ["sensor 1 signal", "En (limit 1)", "blu", "after remap"], ["sensor 2 signal", "Dir (limit 2)", "blu", "after remap"]], "checks": [], "html_pro": "<p>42D has one limit input until remapped. After remap: <strong>En = limit 1</strong>, <strong>Dir = limit 2</strong>.</p>\n<ol>\n<li>Send remap command for this driver:\n   - Z: <code>03 9E 01 A2</code>\n   - A: <code>04 9E 01 A3</code>\n   - B: <code>05 9E 01 A4</code>\n   - C: <code>06 9E 01 A5</code></li>\n<li><strong>Jumper from COM to sensor +V (5 V).</strong> Without it, homing never stops at the sensor.</li>\n</ol>\n<p>Jumper drawn only on the A part of the official diagram; easy to miss. See <a class=\"wl\" href=\"#/mks/4-remap-the-42d-limit-inputs\">MKS Driver Setup › 4. Remap the 42D limit inputs</a>.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Send the remap command for this driver:\n   - Z: <code>03 9E 01 A2</code>\n   - A: <code>04 9E 01 A3</code>\n   - B: <code>05 9E 01 A4</code>\n   - C: <code>06 9E 01 A5</code></li>\n<li><strong>Fit a jumper from COM to the sensor +V (5 V).</strong></li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">COM jumper</div>\n<p>Without it, homing never stops at the sensor.</p>\n</div>", "checks_simple": [], "ts": [58, 59, 61, 64, 54, 7]}, {"stage": 2, "kind": "test", "key": "Z-check", "title": "Test the Z driver before it goes in", "img": null, "html": "<p>Same tests as X. Fix anything now: the driver is hard to reach later.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["\"Cal success\", and the settings survive a power cycle.", "It answers on ID 3. Read encoder (<code>31</code>) changes when you turn the shaft.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): it stops when you trigger the home sensor by hand."], "html_pro": "<p>Same tests as X. Fix anything now; driver hard to reach later.</p>", "checks_pro": ["\"Cal success\"; settings survive power cycle.", "Answers on ID 3; read encoder (<code>31</code>) changes when shaft turned.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): stops when home sensor triggered by hand."], "html_simple": "<p>Same tests as X. Fix anything now.</p>", "checks_simple": ["\"Cal success\", survives power cycle", "Answers on ID 3. <code>31</code> changes when shaft turns", "Each sensor LED lights with its magnet", "Home <code>91</code> stops at home sensor"], "ts": [54, 7, 28, 58, 69]}, {"stage": 2, "kind": "wire", "key": "z-driver", "title": "Wire the Z driver now, before step 49", "img": null, "html": "<ol>\n<li>The Z 42D must already be set up (Stage 0): CAN ID 3, remap <code>03 9E 01 A2</code>, COM jumper on.</li>\n<li>Power and <strong>CAN in</strong> from the Y Wagos. <strong>CAN out</strong> towards A.</li>\n<li>Fit the Z limit sensor leads to the 42D now, or leave labelled leads.</li>\n<li>Leave a slack loop at the Y joint so the shoulder can swing. The Y cable holder (step 45) is the likely path.</li>\n</ol>", "ov": ["pr-Z", "dZ", "mZ", "pd-Z", "cc-Z", "co-Z"], "bench": null, "drv": "42D", "grip": null, "conn": [["Wago +V", "driver V+", "red", ""], ["Wago GND", "driver Gnd", "blk", ""], ["Y CAN out", "Z CAN H / L", "yel", "in"], ["Z CAN H / L", "pair towards A", "grn", "out, labelled"], ["Z limit leads", "Z En / Dir", "blu", "or labelled tails"]], "checks": [], "html_pro": "<ol>\n<li>Z 42D already set up (Stage 0): CAN ID 3, remap <code>03 9E 01 A2</code>, COM jumper on.</li>\n<li>Power and <strong>CAN in</strong> from Y Wagos; <strong>CAN out</strong> towards A.</li>\n<li>Fit Z limit sensor leads to 42D now, or leave labelled leads.</li>\n<li>Slack loop at Y joint so shoulder can swing; Y cable holder (step 45) is the likely path.</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li>Z 42D set up already: CAN ID 3, remap <code>03 9E 01 A2</code>, COM jumper on.</li>\n<li>Power and <strong>CAN in</strong> from the Y Wagos. <strong>CAN out</strong> towards A.</li>\n<li>Fit the Z limit sensor leads to the 42D now, or leave labelled leads.</li>\n<li>Leave a slack loop at the Y joint so the shoulder can swing.</li>\n</ol>", "checks_simple": [], "ts": [58, 59, 61, 64, 69, 70]}, {"stage": 2, "kind": "step", "n": 49, "title": "Fit the Z motor (MKS SERVO42D + Nema 17 60 mm)", "img": "Attachments/Arctos/manual/arctos-step-049.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Make sure the motor prep box above is done. Driver on, all wires on, CAN ID 03, remap done, calibrated.</li>\n<li>Put the <strong>Nema_17_60mm</strong> (with the <strong>MKS Servo 42D</strong> on its back) between the upper-arm plates.</li>\n<li>Push its shaft out through the Z R middle core (left).</li>\n<li>Fix it with 4 x <strong>Bolt M3 20mm v2</strong> from the outside (left).</li>\n<li>Put <strong>Pulley GT2W10B5</strong> on the shaft, outside the plate. Leave the set screw loose.</li>\n</ol>\n<p><strong>Hardware:</strong> 4x M3x20, 1x GT2 W10 B5 pulley.</p>\n<p><strong>Orientation:</strong> The shaft points out to the ▼Y side. The 42D faces the other plate.</p>\n<p><strong>Check:</strong> The pulley is outside the plate. The motor sits in the 4 short slots.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wiring point: Z driver</div>\n<ul>\n<li>Run the Y-to-Z cable (power + CAN) from the Y driver, across the Y joint, up between the upper-arm plates to the 42D. (unsure: the manual shows no cable path in these steps. The Y cable holder (step 45) is the likely place where cables cross the Y joint.)</li>\n<li>Fit the Z limit sensor wires to the 42D now, or leave a labelled pigtail. Unexpected Maker: \"You can't assemble the robot and then go back and add all the limits and wiring.\"</li>\n<li>Run a cable from the 42D on towards the elbow for the A motor (CAN-out + power). It crosses the Z joint at steps 73–74.</li>\n<li>One builder broke stepper leads when parts pressed on the wires. The MKS terminals face sideways. Keep wires clear of plate edges. (Unexpected Maker)</li>\n</ul>\n</div>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Confirm motor prep box done: driver on, all wires on, CAN ID 03, remap done, calibrated.</li>\n<li><strong>Nema_17_60mm</strong> (with <strong>MKS Servo 42D</strong> on back) between upper-arm plates.</li>\n<li>Shaft out through Z R middle core (left).</li>\n<li>4 x <strong>Bolt M3 20mm v2</strong> from outside (left).</li>\n<li><strong>Pulley GT2W10B5</strong> on shaft, outside plate; set screw loose.</li>\n</ol>\n<p><strong>Hardware:</strong> 4x M3x20, 1x GT2 W10 B5 pulley.</p>\n<p><strong>Orientation:</strong> Shaft points out to ▼Y side; 42D faces other plate.</p>\n<p><strong>Check:</strong> Pulley outside plate; motor in the 4 short slots.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wiring point: Z driver</div>\n<ul>\n<li>Y-to-Z cable (power + CAN) from Y driver, across Y joint, up between upper-arm plates to 42D. (unsure: manual shows no cable path here; Y cable holder (step 45) likely where cables cross Y joint.)</li>\n<li>Z limit sensor wires to 42D now, or labelled pigtail. Unexpected Maker: \"You can't assemble the robot and then go back and add all the limits and wiring.\"</li>\n<li>Cable from 42D towards elbow for A motor (CAN-out + power); crosses Z joint at steps 73–74.</li>\n<li>One builder broke stepper leads when parts pressed on wires. MKS terminals face sideways; keep wires clear of plate edges. (Unexpected Maker)</li>\n</ul>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Check the Z driver is ready: on, wired, CAN ID 03, remapped, calibrated.</li>\n<li>Put the <strong>Nema_17_60mm</strong> (<strong>MKS Servo 42D</strong> on its back) between the upper-arm plates.</li>\n<li>Push its shaft out through the Z R middle core (left).</li>\n<li>Fix it with 4x <strong>Bolt M3x20 v2</strong> from outside (left).</li>\n<li>Put <strong>Pulley GT2W10B5</strong> on the shaft, outside the plate. Leave the set screw loose.</li>\n</ol>\n<p>Orientation: shaft points to the ▼Y side. The 42D faces the other plate.</p>\n<p>Check: pulley is outside the plate. Motor sits in the 4 short slots.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wiring now</div>\n<p>Fit the Z limit sensor wires to the 42D now. Run power and CAN on towards the elbow for A. Keep wires clear of plate edges.</p>\n</div>", "checks_simple": [], "ts": [28, 30, 16, 58, 59, 61]}, {"stage": 2, "kind": "step", "n": 50, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-050.png", "html": "<p><strong>Check:</strong> The Z motor sits between the plates. Its pulley is outside the plate.</p>", "html_pro": "<p><strong>Check:</strong> Z motor between plates; pulley outside plate.</p>", "checks_pro": [], "html_simple": "<p>Check: the Z motor sits between the plates with its pulley outside.</p>", "checks_simple": [], "ts": [16, 71, 33]}, {"stage": 2, "kind": "step", "n": 149, "title": "On the Y cable holder at the shoulder, check the magnets are in…", "img": "Attachments/Arctos/manual/arctos-step-149.png", "html": "<p>On the Y cable holder at the shoulder, check the magnets are in the holes the red arrows show (two on top, one at the end). Parts: none labelled. Hardware: magnets. Note: \"magnets\"</p>", "moved": "Paper manual step 149. In the paper manual this is in the Limit switches section near the end (steps 146–159). It is done here, right after this joint, while you can still reach the spot.", "html_pro": "<p>Y cable holder at shoulder: magnets in the holes the red arrows show (two on top, one at end). Parts: none labelled. Hardware: magnets. Note: \"magnets\"</p>", "checks_pro": [], "html_simple": "<p>Check the magnets are in the holes the red arrows show (two on top, one at the end).</p>", "checks_simple": [], "ts": [62, 54, 63, 69, 70]}, {"stage": 2, "kind": "step", "n": 150, "title": "Fix a KYD003 endstop to the Y encoder holder with M2 screws", "img": "Attachments/Arctos/manual/arctos-step-150.png", "html": "<p>Fix a KYD003 endstop to the Y encoder holder with M2 screws. Fix the holder over the Y gearbox hub with Bolt M3 20mm (drawn: 3). A second KYD003 endstop is shown near the hub. Parts: Y encoder holder (2), KYD003 endstop. Hardware: M2 screws, Bolt M3 20mm v2. Note: \"M2 screws\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Hall sensors are polarised, and the board leads can be short. If the Z sensor can't reach its magnet, use 2x M2.5 nuts as spacers. Test every sensor with a magnet before you close anything.</p>\n</div>", "html_pro": "<p>KYD003 endstop on Y encoder holder with M2 screws. Holder over Y gearbox hub with Bolt M3 20mm (drawn: 3). Second KYD003 endstop shown near hub. Parts: Y encoder holder (2), KYD003 endstop. Hardware: M2 screws, Bolt M3 20mm v2. Note: \"M2 screws\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Hall sensors are polarised; board leads can be short. If Z sensor can't reach its magnet, use 2x M2.5 nuts as spacers. Test every sensor with a magnet before closing anything.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix a <strong>KYD003</strong> endstop to the Y encoder holder with M2 screws.</li>\n<li>Fix the holder over the Y gearbox hub with 3x <strong>Bolt M3x20 v2</strong>.</li>\n</ol>\n<p>A second KYD003 endstop sits near the hub.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Test sensors</div>\n<p>Test every sensor with a magnet before you close anything.</p>\n</div>", "checks_simple": [], "ts": [4, 62, 54, 63, 58, 59]}, {"stage": 2, "kind": "step", "n": 151, "title": "Result: the Y encoder holder covers the hub and the endstop pins…", "img": "Attachments/Arctos/manual/arctos-step-151.png", "html": "<p>Result: the Y encoder holder covers the hub and the endstop pins point out. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: Y encoder holder covers hub; endstop pins point out. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>", "checks_simple": [], "ts": [7, 11, 58, 59, 61, 64]}, {"stage": 2, "kind": "wire", "key": "y-sensors", "title": "Wire the Y limit sensors", "img": null, "html": "<ol>\n<li>Two <strong>KY-003</strong> boards: \"Back\" and \"Front\". <strong>Back = home.</strong></li>\n<li>They sit on the Y encoder holder (step 150) with M2 screws.</li>\n<li>Wire them to the Y 57D: <strong>IN_1 = Back (home)</strong>, <strong>IN_2 = Front</strong>.</li>\n</ol>", "ov": ["li-Y"], "bench": ["lim", "sensor"], "drv": "57D", "grip": null, "conn": [["Back sensor S", "Y IN_1", "blu", "home"], ["Front sensor S", "Y IN_2", "blu", ""], ["Sensor + / −", "Y 5 V / GND", "red", "never the 24 V Wago"]], "checks": [], "html_pro": "<ol>\n<li>Two <strong>KY-003</strong> boards: \"Back\" and \"Front\". <strong>Back = home.</strong></li>\n<li>On Y encoder holder (step 150), M2 screws.</li>\n<li>To Y 57D: <strong>IN_1 = Back (home)</strong>, <strong>IN_2 = Front</strong>.</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li>Two <strong>KY-003</strong> boards: \"Back\" and \"Front\". <strong>Back = home.</strong></li>\n<li>They sit on the Y encoder holder (step 150) with M2 screws.</li>\n<li>Wire to the Y 57D: <strong>IN_1 = Back (home)</strong>, <strong>IN_2 = Front</strong>.</li>\n</ol>", "checks_simple": [], "ts": [58, 59, 61, 64, 26, 0]}, {"stage": 2, "kind": "test", "key": "y-test", "title": "Test Y", "img": null, "html": "<p>If the driver acts strangely after mounting, calibrate again with the <strong>belt off</strong>.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["Belt off: jog Y ±5°. It turns the right way.", "Belt on: jog ±10°, then home. It stops at the Back sensor.", "Swing the shoulder by hand through its range. No wire goes tight."], "html_pro": "<p>Driver misbehaves after mounting: recalibrate with <strong>belt off</strong>.</p>", "checks_pro": ["Belt off: jog Y ±5°; turns the right way.", "Belt on: jog ±10°, then home; stops at Back sensor.", "Swing shoulder by hand through range; no wire goes tight."], "html_simple": "<p>If the driver acts strangely after mounting, calibrate again with the <strong>belt off</strong>.</p>", "checks_simple": ["Belt off: jog Y ±5°, right way", "Belt on: jog ±10°, home stops at Back", "Swing shoulder by hand: no tight wire"], "ts": [28, 30, 54, 55, 57, 56]}, {"stage": 3, "kind": "step", "n": 51, "title": "Build three Z disks and line up the locking holes", "img": "Attachments/Arctos/manual/arctos-step-051.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Build 3 Z disks as in step 21. Each gets 1 x 61803, 5 small bearings and a cap with 5 screws.</li>\n<li>Find the number on each rim: <strong>Z cycloidal disk 1</strong>, <strong>2</strong> and <strong>3</strong>.</li>\n<li>Find the small locking hole on each disk (red arrow). It is near the rim, between two lobes.</li>\n<li>Stack the disks with disk 3 in front. Line up the 3 locking holes.</li>\n</ol>\n<p><strong>Hardware:</strong> for 3 disks: 3x 61803, 15x small bearings (type: see the conflict note), 15x cap screws.</p>\n<p><strong>Check:</strong> You can see 1, 2 and 3 on the rims, stepped like the picture.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>The designer enlarged this hole to about 1.8 mm so a piece of <strong>filament</strong> can pin the stack. (Unexpected Maker stream)</li>\n<li>Unexpected Maker also drilled about 1.8 mm alignment holes and used filament or a drill bit.</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Build 3 Z disks as step 21: each 1 x 61803, 5 small bearings, cap with 5 screws.</li>\n<li>Read rim numbers: <strong>Z cycloidal disk 1</strong>, <strong>2</strong>, <strong>3</strong>.</li>\n<li>Find small locking hole on each disk (red arrow), near rim between two lobes.</li>\n<li>Stack with disk 3 in front; align the 3 locking holes.</li>\n</ol>\n<p><strong>Hardware:</strong> for 3 disks: 3x 61803, 15x small bearings (type: see conflict note), 15x cap screws.</p>\n<p><strong>Check:</strong> 1, 2, 3 visible on rims, stepped as pictured.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Designer enlarged this hole to about 1.8 mm so a piece of <strong>filament</strong> pins the stack. (Unexpected Maker stream)</li>\n<li>Unexpected Maker also drilled about 1.8 mm alignment holes; used filament or drill bit.</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Build 3 Z disks as in step 21: each gets 1x 61803, 5 small bearings, a cap with 5 screws.</li>\n<li>Find the number on each rim: <strong>Z cycloidal disk 1</strong>, <strong>2</strong>, <strong>3</strong>.</li>\n<li>Find the small locking hole on each disk (red arrow), near the rim between two lobes.</li>\n<li>Stack the disks with disk 3 in front. Line up the 3 locking holes.</li>\n</ol>\n<p>Check: 1, 2 and 3 show on the rims, stepped like the picture.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 3, "kind": "step", "n": 52, "title": "Stack the disks on the camshaft pieces", "img": "Attachments/Arctos/manual/arctos-step-052.png", "html": "<p><strong>Do (left to right in the picture):</strong></p>\n<ol>\n<li>Start with <strong>ZC4</strong>.</li>\n<li>Slide on the first disk.</li>\n<li>Add <strong>ZC3</strong>.</li>\n<li>Slide on the second disk.</li>\n<li>Add <strong>ZC2</strong>.</li>\n<li>Slide on the third disk.</li>\n<li>Finish with <strong>ZC1</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> none.</p>\n<p><strong>Orientation:</strong> \"All camshaft pieces have markings on them.\" Match the marks as drawn. (unsure: the disks are not numbered in this picture. Step 53 shows disk 3 on the outside. By the Y pattern, disk 3 sits next to ZC4. Check your numbers against step 53.)</p>\n<p><strong>Check:</strong> It spins by hand after each stage.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li><strong>Cam 1 and cam 3 look alike.</strong> Check the marks. A bearing went in the wrong place for Unexpected Maker here.</li>\n<li><strong>The flat side of the cam stack faces the motor.</strong> (Unexpected Maker)</li>\n<li>Lock the disks: put 5 dowel pins through the 5 small bearings during assembly. (designer)</li>\n</ul>", "html_pro": "<p><strong>Do (left to right in picture):</strong></p>\n<ol>\n<li><strong>ZC4</strong>.</li>\n<li>First disk.</li>\n<li><strong>ZC3</strong>.</li>\n<li>Second disk.</li>\n<li><strong>ZC2</strong>.</li>\n<li>Third disk.</li>\n<li><strong>ZC1</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> none.</p>\n<p><strong>Orientation:</strong> \"All camshaft pieces have markings on them.\" Match marks as drawn. (unsure: disks not numbered in this picture. Step 53 shows disk 3 outside. By Y pattern, disk 3 next to ZC4. Check numbers against step 53.)</p>\n<p><strong>Check:</strong> Spins by hand after each stage.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li><strong>Cam 1 and cam 3 look alike</strong>; check marks. A bearing went in wrong place for Unexpected Maker here.</li>\n<li><strong>Flat side of cam stack faces motor.</strong> (Unexpected Maker)</li>\n<li>Lock disks: 5 dowel pins through the 5 small bearings during assembly. (designer)</li>\n</ul>", "checks_pro": [], "html_simple": "<p>Left to right in the picture:</p>\n<ol>\n<li>Start with <strong>ZC4</strong>.</li>\n<li>Slide on the first disk.</li>\n<li>Add <strong>ZC3</strong>.</li>\n<li>Slide on the second disk.</li>\n<li>Add <strong>ZC2</strong>.</li>\n<li>Slide on the third disk.</li>\n<li>Finish with <strong>ZC1</strong>.</li>\n</ol>\n<p>Match the marks on the camshaft pieces as drawn. Disk 3 sits next to ZC4.</p>\n<p>Check: it spins by hand after each stage.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Cam 1 and cam 3 look alike</div>\n<p>Check the marks. The flat side of the cam stack faces the motor.</p>\n</div>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 3, "kind": "step", "n": 53, "title": "Check the stack", "img": "Attachments/Arctos/manual/arctos-step-053.png", "html": "<p><strong>Check:</strong> Disk \"3\" is on the outside, facing you. The camshaft end shows in the centre. 5 cap screws are on disk 3.</p>\n<p><strong>Tip:</strong> If the disks went in back to front, the camshaft is on the wrong side. To fix it, remove only the outer bolts and flip the inner stack. (Unexpected Maker)</p>", "html_pro": "<p><strong>Check:</strong> Disk \"3\" outermost, facing you. Camshaft end visible in centre. 5 cap screws on disk 3.</p>\n<p><strong>Tip:</strong> Disks reversed = camshaft on wrong side. Fix: remove only the outer bolts, flip the inner stack. (Unexpected Maker)</p>", "checks_pro": [], "html_simple": "<p>Check: disk \"3\" faces you on the outside. Camshaft end shows in the centre. 5 cap screws on disk 3.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Disks back to front</div>\n<p>Camshaft on the wrong side means the stack is flipped. Remove only the outer bolts and flip the inner stack.</p>\n</div>", "checks_simple": [], "ts": [10, 15, 11, 17, 0]}, {"stage": 3, "kind": "step", "n": 54, "title": "Put the stack into the left cover", "img": "Attachments/Arctos/manual/arctos-step-054.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put 1 x <strong>Bearing 61810</strong> on the <strong>outer</strong> side of the <strong>A gearbox L cover</strong> (right in the picture). This is the Z left cover; the name is old.</li>\n<li>Put the disk stack into the open side of the cover, disk 3 facing out (left).</li>\n<li>Push 4 x <strong>Z gearbox pin</strong> through the disk lobes into the cover.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 61810, 4x Z gearbox pin (50 mm). \"(16)\" and \"(1)\" are CAD numbers.</p>\n<p><strong>Orientation:</strong> The bearing goes on the side <strong>away</strong> from the disks. The cover's fingers wrap around the disks.</p>\n<p><strong>Check:</strong> The 4 pins are tight in their holes. The bearing is fully seated.</p>\n<p><strong>Tip:</strong> One builder found the big bearing not fully seated. He pressed it on with a second bearing. (Unexpected Maker)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>1 x <strong>Bearing 61810</strong> on the <strong>outer</strong> side of the <strong>A gearbox L cover</strong> (right in picture). It is the Z left cover; name is legacy.</li>\n<li>Disk stack into open side of cover, disk 3 out (left).</li>\n<li>4 x <strong>Z gearbox pin</strong> through disk lobes into cover.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 61810, 4x Z gearbox pin (50 mm). \"(16)\" and \"(1)\" are CAD numbers.</p>\n<p><strong>Orientation:</strong> Bearing on the side <strong>away</strong> from the disks. Cover fingers wrap the disks.</p>\n<p><strong>Check:</strong> 4 pins tight. Bearing fully seated.</p>\n<p><strong>Tip:</strong> One builder: big bearing not fully seated; pressed it home with a second bearing. (Unexpected Maker)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 1x <strong>Bearing 61810</strong> on the <strong>outer</strong> side of the <strong>A gearbox L cover</strong> (right in the picture).</li>\n<li>Put the disk stack into the open side of the cover, disk 3 facing out (left).</li>\n<li>Push 4x <strong>Z gearbox pin</strong> (50 mm) through the disk lobes into the cover.</li>\n</ol>\n<p>Bearing goes on the side <strong>away</strong> from the disks.</p>\n<p>Check: 4 pins tight, bearing fully seated.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 3, "kind": "step", "n": 55, "title": "Check the stack in the cover", "img": "Attachments/Arctos/manual/arctos-step-055.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Look at the result before you close the gearbox.</li>\n</ol>\n<p><strong>Check:</strong></p>\n<ul>\n<li>Disk 3 faces you with its number at the top.</li>\n<li>4 pins are in, spread round the ring.</li>\n<li>The cover fingers wrap the disks evenly.</li>\n<li>The camshaft end shows in the centre.</li>\n<li>Turn the camshaft by hand. It should turn. (official video: check that it spins)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Inspect before closing the gearbox.</li>\n</ol>\n<p><strong>Check:</strong></p>\n<ul>\n<li>Disk 3 facing you, number at top.</li>\n<li>4 pins in, spread round the ring.</li>\n<li>Cover fingers wrap disks evenly.</li>\n<li>Camshaft end visible in centre.</li>\n<li>Turn camshaft by hand; must turn. (official video: check that it spins)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Look at the stack before you close the gearbox.</li>\n</ol>\n<p>Check:</p>\n<ul>\n<li>Disk 3 faces you, number at the top.</li>\n<li>4 pins in, spread round the ring.</li>\n<li>Cover fingers wrap the disks evenly.</li>\n<li>Camshaft end shows in the centre.</li>\n<li>Camshaft turns by hand.</li>\n</ul>", "checks_simple": [], "ts": [10, 15, 11, 17, 7]}, {"stage": 3, "kind": "step", "n": 56, "title": "Close it with the ZR cover", "img": "Attachments/Arctos/manual/arctos-step-056.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put the <strong>ZR gearbox cover</strong> on the disk-3 side (left).</li>\n<li>Push 6 x <strong>Bolt M3 50mm v2</strong> through both covers from the <strong>L-cover side</strong> (right).</li>\n<li>Screw 6 x <strong>Nut M3 v2</strong> onto them on the <strong>ZR-cover side</strong> (left).</li>\n<li>Tighten evenly, opposite bolts in turn.</li>\n</ol>\n<p><strong>Hardware:</strong> 6x M3x50, 6x M3 nut.</p>\n<p><strong>Check:</strong> The two covers meet with no gap. Nothing rocks.</p>\n<p><strong>Tip:</strong> The cover nuts are <strong>M3, not M4</strong>. (Unexpected Maker)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>ZR gearbox cover</strong> on disk-3 side (left).</li>\n<li>6 x <strong>Bolt M3 50mm v2</strong> through both covers from <strong>L-cover side</strong> (right).</li>\n<li>6 x <strong>Nut M3 v2</strong> on <strong>ZR-cover side</strong> (left).</li>\n<li>Tighten evenly, opposite bolts in turn.</li>\n</ol>\n<p><strong>Hardware:</strong> 6x M3x50, 6x M3 nut.</p>\n<p><strong>Check:</strong> Covers meet, no gap. No rocking.</p>\n<p><strong>Tip:</strong> Cover nuts are <strong>M3, not M4</strong>. (Unexpected Maker)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>ZR gearbox cover</strong> on the disk-3 side (left).</li>\n<li>Push 6x <strong>Bolt M3 50mm v2</strong> (M3x50) through both covers from the <strong>L-cover side</strong> (right).</li>\n<li>Screw 6x <strong>Nut M3 v2</strong> on, on the <strong>ZR-cover side</strong> (left).</li>\n<li>Tighten evenly, opposite bolts in turn.</li>\n</ol>\n<p>Check: covers meet with no gap. Nothing rocks.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Nuts are M3</div>\n<p>The cover nuts are <strong>M3, not M4</strong>.</p>\n</div>", "checks_simple": [], "ts": [4, 10, 15, 11, 17, 0]}, {"stage": 3, "kind": "step", "n": 57, "title": "The rest of the outer pins and the shaft bearing", "img": "Attachments/Arctos/manual/arctos-step-057.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>From the ZR-cover side, push the rest of the <strong>Z gearbox pin 50mm</strong> pins into the ring of holes. About 21 more are drawn, for 25 in total.</li>\n<li>Put 1 x <strong>Bearing 61810</strong> on the ZR-cover side.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> onto the camshaft end, in the centre.</li>\n<li>Pull the locking pin or filament out of the disks.</li>\n</ol>\n<p><strong>Hardware:</strong> about 21x Z gearbox pin (could not count exactly; total must be 25), 1x 61810, 1x 61803. \"(4) (1)\" are CAD numbers.</p>\n<p><strong>Check:</strong> All 25 pins are in and tight. Both 61810 bearings are seated.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Order that worked for Unexpected Maker: camshaft rod first, then the 5 centre pins, then the outer pins.</li>\n<li>Pins must be a tight fit. (Unexpected Maker)</li>\n<li>Look for support material left in a cover corner. It tilted his gearbox. (Unexpected Maker)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>From ZR-cover side, remaining <strong>Z gearbox pin 50mm</strong> pins into the ring of holes. About 21 more drawn; 25 total.</li>\n<li>1 x <strong>Bearing 61810</strong> on ZR-cover side.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> onto camshaft end, centre.</li>\n<li>Pull locking pin/filament from the disks.</li>\n</ol>\n<p><strong>Hardware:</strong> about 21x Z gearbox pin (not exactly countable; total must be 25), 1x 61810, 1x 61803. \"(4) (1)\" are CAD numbers.</p>\n<p><strong>Check:</strong> All 25 pins in, tight. Both 61810 seated.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Order that worked for Unexpected Maker: camshaft rod, then 5 centre pins, then outer pins.</li>\n<li>Pins must be tight. (Unexpected Maker)</li>\n<li>Check for support material in a cover corner; it tilted his gearbox. (Unexpected Maker)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>From the ZR-cover side, push the rest of the <strong>Z gearbox pin 50mm</strong> pins into the ring of holes (about 21 more; 25 in total).</li>\n<li>Put 1x <strong>Bearing 61810</strong> on the ZR-cover side.</li>\n<li>Press 1x <strong>Bearing 61803</strong> onto the camshaft end, in the centre.</li>\n<li>Pull the locking pin or filament out of the disks.</li>\n</ol>\n<p>Check: all 25 pins in and tight. Both 61810 bearings seated. No leftover support material in a cover corner.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 5, 9]}, {"stage": 3, "kind": "step", "n": 58, "title": "Ready to mount", "img": "Attachments/Arctos/manual/arctos-step-058.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Check the L-cover side: the 61810 from step 54 is on, and the 6 bolt heads are in.</li>\n</ol>\n<p><strong>Hardware:</strong> none new. (unsure: there are no labels here. The 6 long, thin bolts look like the same M3x50 bolts from step 56, seen from the L side. The ring looks like the step-54 61810. The old caption guessed M5 bolts; the pictures do not support that.)</p>\n<p><strong>Check:</strong> Turn the camshaft by hand. It turns smoothly with no clicking. The housing turns slowly.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>L-cover side: 61810 from step 54 on, 6 bolt heads in.</li>\n</ol>\n<p><strong>Hardware:</strong> none new. (unsure: no labels. The 6 long thin bolts look like the M3x50 from step 56, seen from L side. Ring looks like the step-54 61810. Old caption guessed M5 bolts; pictures do not support that.)</p>\n<p><strong>Check:</strong> Turn camshaft by hand: smooth, no clicking. Housing turns slowly.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Check the L-cover side: the 61810 from step 54 is on, and the 6 bolt heads (M3x50) are in.</li>\n</ol>\n<p>Check: the camshaft turns smoothly, no clicking. The housing turns slowly.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 3, "kind": "test", "key": "zg-test", "title": "Test the Z gearbox", "img": null, "html": "<p>Unexpected Maker's good Z gearbox had \"no backlash at all\".</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["Smooth by hand.", "Almost no play at the output."], "html_pro": "<p>Unexpected Maker's good Z gearbox: \"no backlash at all\".</p>", "checks_pro": ["Smooth by hand.", "Almost no play at output."], "html_simple": "<p>Test the Z gearbox.</p>", "checks_simple": ["Smooth by hand", "Almost no play at output"], "ts": [7, 0]}, {"stage": 4, "kind": "step", "n": 59, "title": "Join the two elbow cores", "img": "Attachments/Arctos/manual/arctos-step-059.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Take the <strong>A R CORE</strong> (round plate with a big hole, top) and <strong>ZL core 1</strong> (round plate with a bearing seat, bottom).</li>\n<li>Slot their square ends together at the corner.</li>\n</ol>\n<p><strong>Hardware:</strong> none.</p>\n<p><strong>Orientation:</strong> The two round plates face each other, with a gap between them for the gearbox.</p>\n<p><strong>Check:</strong> The square ends fit fully together with no step.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>A R CORE</strong> (round plate, big hole, top) + <strong>ZL core 1</strong> (round plate, bearing seat, bottom).</li>\n<li>Slot square ends together at the corner.</li>\n</ol>\n<p><strong>Hardware:</strong> none.</p>\n<p><strong>Orientation:</strong> Round plates face each other, gap between for the gearbox.</p>\n<p><strong>Check:</strong> Square ends fully mated, no step.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>A R CORE</strong> (round plate with a big hole, top) and <strong>ZL core 1</strong> (round plate with a bearing seat, bottom).</li>\n<li>Slot their square ends together at the corner.</li>\n</ol>\n<p>The round plates face each other, with a gap for the gearbox.</p>\n<p>Check: square ends fit fully, no step.</p>", "checks_simple": [], "ts": [2, 3, 8, 12]}, {"stage": 4, "kind": "step", "n": 60, "title": "Bolt the elbow cores together", "img": "Attachments/Arctos/manual/arctos-step-060.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put 2 x <strong>Nut M3 v2</strong> into the nut pockets: 1 at the top, 1 at the bottom.</li>\n<li>Push 2 x <strong>Bolt M3 20mm v2</strong> in from the outside (right).</li>\n<li>Tighten them into the nuts.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x M3x20, 2x M3 nut.</p>\n<p><strong>Check:</strong> The joint does not flex.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>2 x <strong>Nut M3 v2</strong> into nut pockets: 1 top, 1 bottom.</li>\n<li>2 x <strong>Bolt M3 20mm v2</strong> in from outside (right).</li>\n<li>Tighten into nuts.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x M3x20, 2x M3 nut.</p>\n<p><strong>Check:</strong> Joint does not flex.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 2x <strong>Nut M3 v2</strong> in the nut pockets: 1 top, 1 bottom.</li>\n<li>Push 2x <strong>Bolt M3 20mm v2</strong> (M3x20) in from the outside (right).</li>\n<li>Tighten them into the nuts.</li>\n</ol>\n<p>Check: the joint does not flex.</p>", "checks_simple": [], "ts": [4, 26, 7]}, {"stage": 4, "kind": "step", "n": 61, "title": "Bring the Z gearbox to the elbow", "img": "Attachments/Arctos/manual/arctos-step-061.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Hold the Z gearbox with the <strong>ZR-cover side</strong> (the nut side) facing you.</li>\n<li>Find the <strong>▼Z</strong> mark on the elbow plate.</li>\n<li>Lower the gearbox into the elbow, between the two round plates.</li>\n</ol>\n<p><strong>Orientation:</strong> The ▼Z mark points to the top of the joint. (unsure: which edge of the gearbox lines up with ▼Z; match the bolt holes.)</p>\n<p><strong>Check:</strong> The bolt holes in the plates line up with holes in the gearbox covers.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Z gearbox with <strong>ZR-cover side</strong> (nut side) toward you.</li>\n<li>Locate <strong>▼Z</strong> mark on elbow plate.</li>\n<li>Lower gearbox into elbow between the two round plates.</li>\n</ol>\n<p><strong>Orientation:</strong> ▼Z points to top of joint. (unsure: which gearbox edge aligns with ▼Z; match bolt holes.)</p>\n<p><strong>Check:</strong> Plate bolt holes align with gearbox cover holes.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Hold the Z gearbox with the <strong>ZR-cover side</strong> (nut side) facing you.</li>\n<li>Find the <strong>▼Z</strong> mark on the elbow plate.</li>\n<li>Lower the gearbox into the elbow, between the two round plates.</li>\n</ol>\n<p>▼Z points to the top of the joint.</p>\n<p>Check: bolt holes in the plates line up with the gearbox cover holes.</p>", "checks_simple": [], "ts": [4, 26, 71]}, {"stage": 4, "kind": "step", "n": 62, "title": "Bolt the gearbox into the elbow", "img": "Attachments/Arctos/manual/arctos-step-062.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push 5 x long bolts through the front plate (the ▼Z plate) into the gearbox.</li>\n<li>Push 5 x <strong>Bolt M3 20mm v2</strong> in from the back.</li>\n<li>Tighten all 10 in turn.</li>\n</ol>\n<p><strong>Hardware:</strong> 5x long bolts (unsure: not labelled; about twice as long as the M3x20 in the picture), 5x M3x20. The old caption said 6 short bolts; the picture shows 5.</p>\n<p><strong>Check:</strong> The gearbox is firmly held. The centre still turns.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>5 x long bolts through front plate (▼Z plate) into gearbox.</li>\n<li>5 x <strong>Bolt M3 20mm v2</strong> in from the back.</li>\n<li>Tighten all 10 in turn.</li>\n</ol>\n<p><strong>Hardware:</strong> 5x long bolts (unsure: unlabelled; about twice the M3x20 length in picture), 5x M3x20. Old caption said 6 short bolts; picture shows 5.</p>\n<p><strong>Check:</strong> Gearbox held firmly. Centre still turns.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Push 5x long bolts through the front plate (the ▼Z plate) into the gearbox.</li>\n<li>Push 5x <strong>Bolt M3 20mm v2</strong> (M3x20) in from the back.</li>\n<li>Tighten all 10 in turn.</li>\n</ol>\n<p>The long bolts are about twice as long as the M3x20.</p>\n<p>Check: gearbox held firmly. The centre still turns.</p>", "checks_simple": [], "ts": [26, 0, 7]}, {"stage": 4, "kind": "step", "n": 63, "title": "Open the upper arm", "img": "Attachments/Arctos/manual/arctos-step-063.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Gently pull the two upper-arm plates apart (red arrows). \"Stretch Z axis cores so that A axis can fit.\"</li>\n<li>Hold them apart.</li>\n</ol>\n<p><strong>Check:</strong> The gap is wide enough for the elbow. Don't bend so far that a plate cracks.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Gently spread the two upper-arm plates (red arrows). \"Stretch Z axis cores so that A axis can fit.\"</li>\n<li>Hold apart.</li>\n</ol>\n<p><strong>Check:</strong> Gap wide enough for elbow. Do not over-bend; a plate can crack.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Gently pull the two upper-arm plates apart (red arrows).</li>\n<li>Hold them apart.</li>\n</ol>\n<p>Check: gap wide enough for the elbow.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Plate can crack</div>\n<p>Don't bend the plates too far.</p>\n</div>", "checks_simple": [], "ts": [34, 35, 7]}, {"stage": 4, "kind": "step", "n": 64, "title": "Put the elbow in and fit the 5 inner rods (M4)", "img": "Attachments/Arctos/manual/arctos-step-064.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Slide the elbow between the upper-arm plates. Line the gearbox up with the two hubs.</li>\n<li>Let the plates spring back.</li>\n<li>Push 5 x <strong>Rod M4 100mm</strong> through the 5 holes around the near hub (left in the picture).</li>\n<li>Push each rod through the gearbox and out of the far hub.</li>\n<li>Screw 1 x <strong>Nut M4 v2</strong> on each rod end on the far side (5 nuts).</li>\n<li>Screw 1 x <strong>Nut M4 v2</strong> on each rod end on the near side (5 nuts).</li>\n</ol>\n<p><strong>Hardware:</strong> 5x M4x100 rod, 10x M4 nut. \"(4)\" is a CAD number.</p>\n<p><strong>Check:</strong></p>\n<ul>\n<li>The last rod meets some resistance. That shows correct assembly. (official docs)</li>\n<li>All 10 nuts are tight.</li>\n</ul>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>The M4 rods were missing from the old slides. <strong>Insert them from the left side</strong>, because they thread into nuts on the right. (Unexpected Maker)</li>\n<li>Use the <strong>M4</strong> rods here, not the M5 ones.</li>\n<li>Many builders use <strong>M4x100 bolts</strong> instead of rod. Unexpected Maker called it the \"best thing I ever did\".</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Slide elbow between upper-arm plates; align gearbox with the two hubs.</li>\n<li>Plates spring back.</li>\n<li>5 x <strong>Rod M4 100mm</strong> through the 5 holes around near hub (left in picture).</li>\n<li>Each rod through gearbox and out of far hub.</li>\n<li>1 x <strong>Nut M4 v2</strong> on each rod end, far side (5 nuts).</li>\n<li>1 x <strong>Nut M4 v2</strong> on each rod end, near side (5 nuts).</li>\n</ol>\n<p><strong>Hardware:</strong> 5x M4x100 rod, 10x M4 nut. \"(4)\" is a CAD number.</p>\n<p><strong>Check:</strong></p>\n<ul>\n<li>Last rod meets some resistance: correct assembly. (official docs)</li>\n<li>All 10 nuts tight.</li>\n</ul>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>M4 rods were missing from old slides. <strong>Insert from the left side</strong>; they thread into nuts on the right. (Unexpected Maker)</li>\n<li><strong>M4</strong> rods here, not M5.</li>\n<li>Many use <strong>M4x100 bolts</strong> instead of rod. Unexpected Maker: \"best thing I ever did\".</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Slide the elbow between the upper-arm plates. Line the gearbox up with the two hubs.</li>\n<li>Let the plates spring back.</li>\n<li>Push 5x <strong>Rod M4 100mm</strong> (M4x100) through the 5 holes round the near hub (left in the picture).</li>\n<li>Push each rod through the gearbox and out of the far hub.</li>\n<li>Screw 1x <strong>Nut M4 v2</strong> on each rod end on the far side (5 nuts).</li>\n<li>Screw 1x <strong>Nut M4 v2</strong> on each rod end on the near side (5 nuts).</li>\n</ol>\n<p>Insert the rods from the left side. Use <strong>M4</strong> rods, not M5.</p>\n<p>Check: all 10 nuts tight. The last rod meets some resistance. That is correct.</p>", "checks_simple": [], "ts": [4, 5, 9, 13]}, {"stage": 4, "kind": "step", "n": 65, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-065.png", "html": "<p><strong>Check:</strong> 5 nuts sit round the near hub. The ▼Z mark is on top. The camshaft end shows in the centre.</p>", "html_pro": "<p><strong>Check:</strong> 5 nuts round near hub. ▼Z on top. Camshaft end visible in centre.</p>", "checks_pro": [], "html_simple": "<p>Check: 5 nuts round the near hub. ▼Z mark on top. Camshaft end shows in the centre.</p>", "checks_simple": [], "ts": [4, 10, 15, 11, 17]}, {"stage": 4, "kind": "step", "n": 66, "title": "The Z pulley", "img": "Attachments/Arctos/manual/arctos-step-066.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push the <strong>Z pulley</strong> onto the camshaft through the near hub. Its key must engage the camshaft end.</li>\n</ol>\n<p><strong>Check:</strong> The pulley sits fully home. It does not rock.</p>\n<p><strong>Tip:</strong> If it does not engage, push it further on. A washer fixed this on Y. (designer)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>Z pulley</strong> onto camshaft through near hub. Key must engage camshaft end.</li>\n</ol>\n<p><strong>Check:</strong> Pulley fully home, no rocking.</p>\n<p><strong>Tip:</strong> If not engaged, push further on. A washer fixed this on Y. (designer)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Push the <strong>Z pulley</strong> onto the camshaft through the near hub. Its key must engage the camshaft end.</li>\n</ol>\n<p>Check: pulley fully home, does not rock. If it does not engage, push it further on.</p>", "checks_simple": [], "ts": [10, 15, 11, 17, 16]}, {"stage": 4, "kind": "step", "n": 67, "title": "The Z centre rod", "img": "Attachments/Arctos/manual/arctos-step-067.png", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Calibrate the Z driver now if you have not.</div>\n<p>The belt goes on in step 69. Calibration needs the motor free.</p>\n</div>\n<p><strong>Do:</strong></p>\n<ol>\n<li>Push 1 x <strong>Rod M5 100mm</strong> through the centre of the Z pulley and the gearbox.</li>\n<li>Screw 1 x <strong>Nut M5 v2</strong> on the far end.</li>\n<li>Screw <strong>Nut M5 v2</strong> onto the near end, outside the pulley. 2 nuts are drawn on this side.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x M5x100 rod, 3x M5 nut drawn. (unsure: step 68 shows only 1 nut on the pulley face. The second near-side nut may be a lock nut.)</p>\n<p><strong>Check:</strong> The rod sticks out at both ends. The pulley is held tight.</p>\n<p><strong>Tip:</strong> The rod \"isn't quite long enough\" for a nut each end. Use an M5 bolt 100 mm long (not counting the head), or longer rod. (Unexpected Maker)</p>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Calibrate Z driver now if not done.</div>\n<p>Belt goes on in step 69; calibration needs the motor free.</p>\n</div>\n<p><strong>Do:</strong></p>\n<ol>\n<li>1 x <strong>Rod M5 100mm</strong> through centre of Z pulley and gearbox.</li>\n<li>1 x <strong>Nut M5 v2</strong> on far end.</li>\n<li><strong>Nut M5 v2</strong> on near end, outside pulley. 2 nuts drawn on this side.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x M5x100 rod, 3x M5 nut drawn. (unsure: step 68 shows 1 nut on pulley face; second near-side nut may be a lock nut.)</p>\n<p><strong>Check:</strong> Rod protrudes both ends. Pulley held tight.</p>\n<p><strong>Tip:</strong> Rod \"isn't quite long enough\" for a nut each end. Use M5 bolt 100 mm long (excluding head) or longer rod. (Unexpected Maker)</p>", "checks_pro": [], "html_simple": "<div class=\"callout warning\">\n<div class=\"callout-title\">Calibrate the Z driver first</div>\n<p>The belt goes on in step 69. Calibration needs the motor free.</p>\n</div>\n<ol>\n<li>Push 1x <strong>Rod M5 100mm</strong> (M5x100) through the centre of the Z pulley and the gearbox.</li>\n<li>Screw 1x <strong>Nut M5 v2</strong> on the far end.</li>\n<li>Screw <strong>Nut M5 v2</strong> on the near end, outside the pulley (2 nuts drawn here).</li>\n</ol>\n<p>Check: rod sticks out at both ends. Pulley held tight.</p>", "checks_simple": [], "ts": [4, 5, 9, 13, 28, 30]}, {"stage": 4, "kind": "step", "n": 68, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-068.png", "html": "<p><strong>Check:</strong> One nut sits on the pulley face. The rod end shows.</p>", "html_pro": "<p><strong>Check:</strong> One nut on pulley face. Rod end visible.</p>", "checks_pro": [], "html_simple": "<p>Check: one nut on the pulley face. The rod end shows.</p>", "checks_simple": [], "ts": [4, 5, 9, 13, 16]}, {"stage": 4, "kind": "step", "n": 69, "title": "The Z belt", "img": "Attachments/Arctos/manual/arctos-step-069.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Loop <strong>GT2 W10 450 mm</strong> around the big Z pulley.</li>\n<li>Loop it down around the small motor pulley on the upper arm.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 450 mm belt.</p>\n<p><strong>Check:</strong> The belt runs straight, not twisted.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>GT2 W10 450 mm</strong> around big Z pulley.</li>\n<li>Down around small motor pulley on upper arm.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 450 mm belt.</p>\n<p><strong>Check:</strong> Belt straight, not twisted.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Loop the <strong>GT2 W10 450 mm</strong> belt around the big Z pulley.</li>\n<li>Loop it down around the small motor pulley on the upper arm.</li>\n</ol>\n<p>Check: belt runs straight, not twisted.</p>", "checks_simple": [], "ts": [28, 30, 16, 71, 33]}, {"stage": 4, "kind": "step", "n": 70, "title": "The Z belt tensioner", "img": "Attachments/Arctos/manual/arctos-step-070.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put the <strong>Nut M5 v2</strong> at the back of the <strong>Z belt tensioner</strong>.</li>\n<li>Fix the <strong>GT2 idler W10</strong> to the tensioner with 1 x <strong>Bolt M5 25mm v2</strong>.</li>\n<li>Put 2 x <strong>Nut M3 v2</strong> behind the arm plate.</li>\n<li>Fix the tensioner to the plate with 2 x <strong>Bolt M3 20mm v2</strong> through its slots.</li>\n<li>Leave the M3 bolts slightly loose.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x GT2 idler W10, 1x M5x25, 1x M5 nut, 2x M3x20, 2x M3 nut.</p>\n<p><strong>Check:</strong> The tensioner slides in its slots.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>M3x20 is the limit before the screws hit the gearbox. M3x15 also works. (designer, via Unexpected Maker)</li>\n<li>The idler bolt is M5x25. One kit did not include it. (Unexpected Maker)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>Nut M5 v2</strong> at back of <strong>Z belt tensioner</strong>.</li>\n<li><strong>GT2 idler W10</strong> to tensioner with 1 x <strong>Bolt M5 25mm v2</strong>.</li>\n<li>2 x <strong>Nut M3 v2</strong> behind arm plate.</li>\n<li>Tensioner to plate with 2 x <strong>Bolt M3 20mm v2</strong> through its slots.</li>\n<li>Leave M3 bolts slightly loose.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x GT2 idler W10, 1x M5x25, 1x M5 nut, 2x M3x20, 2x M3 nut.</p>\n<p><strong>Check:</strong> Tensioner slides in slots.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>M3x20 is the limit before screws hit gearbox; M3x15 also works. (designer, via Unexpected Maker)</li>\n<li>Idler bolt is M5x25; one kit omitted it. (Unexpected Maker)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>Nut M5 v2</strong> at the back of the <strong>Z belt tensioner</strong>.</li>\n<li>Fix the <strong>GT2 idler W10</strong> to the tensioner with 1x <strong>Bolt M5 25mm v2</strong> (M5x25).</li>\n<li>Put 2x <strong>Nut M3 v2</strong> behind the arm plate.</li>\n<li>Fix the tensioner to the plate with 2x <strong>Bolt M3 20mm v2</strong> (M3x20; M3x15 also works) through its slots.</li>\n<li>Leave the M3 bolts slightly loose.</li>\n</ol>\n<p>Check: tensioner slides in its slots.</p>", "checks_simple": [], "ts": [4, 28, 30, 29, 58, 59]}, {"stage": 4, "kind": "step", "n": 71, "title": "Tension the Z belt", "img": "Attachments/Arctos/manual/arctos-step-071.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push the tensioner so the idler presses on the belt (red arrow).</li>\n<li>\"Tighten the belt, then tighten the bolts to secure the tensioner.\"</li>\n<li>Slide the motor pulley until the belt runs straight. Tighten its set screw.</li>\n</ol>\n<p><strong>Check:</strong> The belt is tight. It does not skip when you turn the Z pulley by hand.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push tensioner so idler presses on belt (red arrow).</li>\n<li>\"Tighten the belt, then tighten the bolts to secure the tensioner.\"</li>\n<li>Slide motor pulley until belt runs straight; tighten set screw.</li>\n</ol>\n<p><strong>Check:</strong> Belt tight. No skipping when turning Z pulley by hand.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Push the tensioner so the idler presses on the belt (red arrow).</li>\n<li>Tighten the belt, then tighten the bolts to lock the tensioner.</li>\n<li>Slide the motor pulley until the belt runs straight. Tighten its set screw.</li>\n</ol>\n<p>Check: belt tight. It does not skip when you turn the Z pulley by hand.</p>", "checks_simple": [], "ts": [28, 30, 16, 29, 71, 33]}, {"stage": 4, "kind": "step", "n": 72, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-072.png", "html": "<p><strong>Check:</strong> The tensioner is locked. The belt is tight.</p>", "html_pro": "<p><strong>Check:</strong> Tensioner locked. Belt tight.</p>", "checks_pro": [], "html_simple": "<p>Check: tensioner locked. Belt tight.</p>", "checks_simple": [], "ts": [28, 30, 7]}, {"stage": 4, "kind": "step", "n": 73, "title": "The Z cable holder and its magnets", "img": "Attachments/Arctos/manual/arctos-step-073.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put magnets in the <strong>Z cable holder</strong> where the 3 red arrows point: 2 in the top, 1 in the round end at the bottom.</li>\n<li>Fit the holder to the far side of the elbow, by the hub with the M4 nuts.</li>\n<li>Fix it with 3 x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 3x M3x10, magnets (3x3 mm). (unsure: how many magnets in each spot.)</p>\n<p><strong>Check:</strong> The magnets are flush and test correctly with the sensor.</p>\n<p><strong>Tip:</strong> Same polarity warning as step 45.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wiring point: Z joint crossing</div>\n<p>The cable from the Z driver to the A driver crosses the Z joint here.</p>\n<ul>\n<li>Lay it now, before step 74.</li>\n<li>\"The ZL cover routes wires through itself.\" (Unexpected Maker)</li>\n<li>The A motor goes in at step 75. Its driver must be wired before it goes in. (docs: \"Once mounted, there's no space to add wires on A, B, and C axes\")</li>\n</ul>\n</div>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Magnets into <strong>Z cable holder</strong> at the 3 red arrows: 2 in top, 1 in round end at bottom.</li>\n<li>Holder on far side of elbow, by the hub with the M4 nuts.</li>\n<li>3 x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 3x M3x10, magnets (3x3 mm). (unsure: magnet count per spot.)</p>\n<p><strong>Check:</strong> Magnets flush; test correctly with sensor.</p>\n<p><strong>Tip:</strong> Same polarity warning as step 45.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wiring point: Z joint crossing</div>\n<p>Z driver to A driver cable crosses the Z joint here.</p>\n<ul>\n<li>Lay it now, before step 74.</li>\n<li>\"The ZL cover routes wires through itself.\" (Unexpected Maker)</li>\n<li>A motor goes in at step 75; driver must be wired before it goes in. (docs: \"Once mounted, there's no space to add wires on A, B, and C axes\")</li>\n</ul>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Put magnets (3x3 mm) in the <strong>Z cable holder</strong> where the 3 red arrows point: 2 in the top, 1 in the round end at the bottom.</li>\n<li>Fit the holder to the far side of the elbow, by the hub with the M4 nuts.</li>\n<li>Fix it with 3x <strong>Bolt M3 10mm v2</strong> (M3x10).</li>\n</ol>\n<p>Check: magnets flush and test correctly with the sensor. Same polarity rule as step 45.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Lay the A cable now</div>\n<p>The cable from the Z driver to the A driver crosses the Z joint. Lay it before step 74. The A driver must be wired before the A motor goes in at step 75.</p>\n</div>", "checks_simple": [], "ts": [4, 62, 63, 58, 59, 61]}, {"stage": 4, "kind": "wire", "key": "z-cable", "title": "Lay the cable to A, before step 74", "img": null, "html": "<ol>\n<li>The power and CAN for A cross the Z joint here.</li>\n<li>\"The ZL cover routes wires through itself.\" (Unexpected Maker)</li>\n<li>Run +V, GND, CAN H and CAN L from the Z Wagos and Z CAN out, through the ZL cover core.</li>\n<li>Leave a slack loop so the elbow can bend.</li>\n</ol>\n<p>The A driver must be fully wired before step 75 (next stage).</p>", "ov": ["pr-A", "cc-A"], "bench": null, "drv": "57D", "grip": null, "conn": [["Z Wagos +V / GND", "towards A", "red", "through the ZL cover"], ["Z CAN out", "towards A", "yel", ""]], "checks": [], "html_pro": "<ol>\n<li>Power and CAN for A cross the Z joint here.</li>\n<li>\"The ZL cover routes wires through itself.\" (Unexpected Maker)</li>\n<li>Run +V, GND, CAN H, CAN L from Z Wagos and Z CAN out, through ZL cover core.</li>\n<li>Leave a slack loop so the elbow can bend.</li>\n</ol>\n<p>A driver must be fully wired before step 75 (next stage).</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Run +V, GND, CAN H and CAN L from the Z Wagos and Z CAN out, through the ZL cover core.</li>\n<li>Leave a slack loop so the elbow can bend.</li>\n</ol>\n<p>The A driver must be fully wired before step 75.</p>", "checks_simple": [], "ts": [69, 70, 53, 34, 35, 37]}, {"stage": 4, "kind": "step", "n": 74, "title": "The ZL cover core", "img": "Attachments/Arctos/manual/arctos-step-074.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Check that every wire passing the elbow is in place.</li>\n<li>Fit the <strong>ZL cover core</strong> over the side of the elbow.</li>\n<li>Fix it with 4 x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 4x M3x10.</p>\n<p><strong>Check:</strong> No wire is pinched under the cover. The elbow turns through its range by hand without pulling a wire tight.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Confirm all wires passing the elbow are in place.</li>\n<li><strong>ZL cover core</strong> over side of elbow.</li>\n<li>4 x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 4x M3x10.</p>\n<p><strong>Check:</strong> No wire pinched under cover. Elbow turns through range by hand, no wire pulled tight.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Check every wire passing the elbow is in place.</li>\n<li>Fit the <strong>ZL cover core</strong> over the side of the elbow.</li>\n<li>Fix it with 4x <strong>Bolt M3 10mm v2</strong> (M3x10).</li>\n</ol>\n<p>Check: no wire pinched under the cover. The elbow turns through its range without pulling a wire tight.</p>", "checks_simple": [], "ts": [26, 0, 69, 70, 71]}, {"stage": 4, "kind": "step", "n": 152, "title": "On the Z cable holder at the elbow, check the magnets are in the…", "img": "Attachments/Arctos/manual/arctos-step-152.png", "html": "<p>On the Z cable holder at the elbow, check the magnets are in the holes the red arrows show. Parts: none labelled. Hardware: magnets. Note: \"magnets\"</p>", "moved": "Paper manual step 152. In the paper manual this is in the Limit switches section near the end (steps 146–159). It is done here, right after this joint, while you can still reach the spot.", "html_pro": "<p>Z cable holder at elbow: check magnets in the holes the red arrows show. Parts: none labelled. Hardware: magnets. Note: \"magnets\"</p>", "checks_pro": [], "html_simple": "<p>Check the magnets are in the holes the red arrows show on the Z cable holder.</p>", "checks_simple": [], "ts": [62, 54, 63, 69, 70]}, {"stage": 4, "kind": "step", "n": 153, "title": "Fix a KYD003 endstop to the Z encoder holder with M2 screws", "img": "Attachments/Arctos/manual/arctos-step-153.png", "html": "<p>Fix a KYD003 endstop to the Z encoder holder with M2 screws. Fix the holder over the Z hub with Bolt M3 20mm (drawn: 2). Parts: Z encoder holder (2), KYD003 endstop. Hardware: M2 screws, Bolt M3 20mm v2. Note: \"M2 screws\"</p>", "html_pro": "<p>KYD003 endstop to Z encoder holder with M2 screws. Holder over Z hub with Bolt M3 20mm (drawn: 2). Parts: Z encoder holder (2), KYD003 endstop. Hardware: M2 screws, Bolt M3 20mm v2. Note: \"M2 screws\"</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix a <strong>KYD003 endstop</strong> to the <strong>Z encoder holder</strong> (2) with M2 screws.</li>\n<li>Fix the holder over the Z hub with <strong>Bolt M3 20mm v2</strong> (M3x20, 2 drawn).</li>\n</ol>", "checks_simple": [], "ts": [58, 59, 61, 64]}, {"stage": 4, "kind": "step", "n": 154, "title": "Result: the Z encoder holder is on and the endstop wire runs down…", "img": "Attachments/Arctos/manual/arctos-step-154.png", "html": "<p>Result: the Z encoder holder is on and the endstop wire runs down the arm. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: Z encoder holder on; endstop wire runs down the arm. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture: holder on, endstop wire runs down the arm.</p>", "checks_simple": [], "ts": [58, 59, 61, 64, 69, 70]}, {"stage": 4, "kind": "wire", "key": "z-sensors", "title": "Wire the Z limit sensors", "img": null, "html": "<ol>\n<li>Two <strong>KY-003</strong>: \"Back\" and \"Front\". <strong>Front = home.</strong></li>\n<li>Wire them to the Z 42D: <strong>En = limit 1, Dir = limit 2</strong>.</li>\n<li>Check the <strong>COM-to-+V jumper</strong> is fitted.</li>\n<li>If the leads can't reach the magnet, use 2x M2.5 nuts as spacers.</li>\n<li>If Z runs past its limit later, the sensor-to-direction pairing is reversed. Swap the two sensors, or change HmDir.</li>\n</ol>", "ov": ["li-Z"], "bench": ["lim", "sensor", "com"], "drv": "42D", "grip": null, "conn": [["Front sensor S", "Z En (limit 1)", "blu", "home"], ["Back sensor S", "Z Dir (limit 2)", "blu", ""], ["COM", "sensor +V", "red", "jumper"]], "checks": [], "html_pro": "<ol>\n<li>Two <strong>KY-003</strong>: \"Back\" and \"Front\". <strong>Front = home.</strong></li>\n<li>Wire to Z 42D: <strong>En = limit 1, Dir = limit 2</strong>.</li>\n<li><strong>COM-to-+V jumper</strong> fitted.</li>\n<li>Leads can't reach magnet: 2x M2.5 nuts as spacers.</li>\n<li>Z runs past limit later: sensor-to-direction pairing reversed. Swap the two sensors, or change HmDir.</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li>Two <strong>KY-003</strong>: \"Back\" and \"Front\". <strong>Front = home.</strong></li>\n<li>Wire them to the Z 42D: <strong>En = limit 1, Dir = limit 2</strong>.</li>\n<li>Check the <strong>COM-to-+V jumper</strong> is fitted.</li>\n<li>If the leads can't reach the magnet, use 2x M2.5 nuts as spacers.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Z runs past its limit</div>\n<p>The sensor-to-direction pairing is reversed. Swap the two sensors, or change HmDir.</p>\n</div>", "checks_simple": [], "ts": [4, 62, 54, 63, 58, 59]}, {"stage": 4, "kind": "test", "key": "z-test", "title": "Test Z", "img": null, "html": "", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["Belt off: jog Z ±5°.", "Belt on: jog ±10°, then home. It stops at the Front sensor.", "Bend the elbow by hand through its range. No wire goes tight."], "html_pro": "", "checks_pro": ["Belt off: jog Z ±5°.", "Belt on: jog ±10°, then home; stops at Front sensor.", "Bend elbow by hand through range; no wire tight."], "html_simple": "", "checks_simple": ["Belt off: jog Z ±5°", "Belt on: jog ±10°, then home, stops at Front sensor", "Bend elbow by hand, no wire goes tight"], "ts": [7, 28, 58, 69]}, {"stage": 5, "kind": "wire", "key": "A-setup", "title": "Set up the A driver on the table", "img": null, "html": "<p>Do this before you build the A gearbox. It is the same job as the X driver (start of the X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>A</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 34 mm</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x40 (test-fit first)</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>4</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1300 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>1x WSH231 switch</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with a meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue it to the centre of the shaft end. Let it dry. Fit the driver with the M3x40 (test-fit first) bolts.</li>\n<li><strong>Power:</strong> check the polarity with a meter, then + to V+ and − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on the shaft. Set the menu like X, but <strong>CanID 4</strong> and <strong>Ma about 1300 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on the bus.</li>\n<li><strong>Sensors:</strong> En = home, Dir = the other one. These only work after the <strong>remap and the COM jumper</strong> (same as Z): <code>04 9E 01 A3</code>.</li>\n</ol>", "ov": null, "bench": ["coil", "pwr", "can", "lim", "sensor", "com"], "drv": "42D", "grip": null, "conn": null, "checks": [], "html_pro": "<p>Before building the A gearbox. Same as X driver (start of X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>A</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 34 mm</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x40 (test-fit first)</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>4</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1300 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>1x WSH231 switch</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue to centre of shaft end; let dry. Fit driver with M3x40 (test-fit first) bolts.</li>\n<li><strong>Power:</strong> check polarity with meter; + to V+, − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on shaft. Menu as X, but <strong>CanID 4</strong>, <strong>Ma about 1300 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on bus.</li>\n<li><strong>Sensors:</strong> En = home, Dir = other. Work only after <strong>remap and COM jumper</strong> (as Z): <code>04 9E 01 A3</code>.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Same job as the X driver, with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>A</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 34 mm</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x40</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>4</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1300 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>1x WSH231 switch</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with a meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue to the centre of the shaft end. Let it dry. Fit the driver with the M3x40 bolts.</li>\n<li><strong>Power:</strong> check polarity with a meter, then + to V+ and − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on the shaft. Menu like X, but <strong>CanID 4</strong> and <strong>Ma about 1300 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on the bus.</li>\n<li><strong>Sensors:</strong> En = home, Dir = the other one. Send the remap and fit the COM jumper (same as Z): <code>04 9E 01 A3</code>.</li>\n</ol>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 5, "kind": "test", "key": "A-check", "title": "Test the A driver before it goes in", "img": null, "html": "<p>Same tests as X. Fix anything now: the driver is hard to reach later.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["\"Cal success\", and the settings survive a power cycle.", "It answers on ID 4. Read encoder (<code>31</code>) changes when you turn the shaft.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): it stops when you trigger the home sensor by hand."], "html_pro": "<p>Same tests as X. Fix now: driver hard to reach later.</p>", "checks_pro": ["\"Cal success\"; settings survive a power cycle.", "Answers on ID 4. Read encoder (<code>31</code>) changes when shaft turns.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): stops when home sensor triggered by hand."], "html_simple": "<p>Same tests as X.</p>", "checks_simple": ["\"Cal success\", survives power cycle", "Answers on ID 4; read encoder (<code>31</code>) changes", "Each sensor LED lights with its magnet face", "Home (<code>91</code>) stops at home sensor"], "ts": [54, 18, 58, 69]}, {"stage": 5, "kind": "wire", "key": "a-wire", "title": "Wire A now, on the bench, before step 75", "img": null, "html": "<div class=\"callout danger\">\n<div class=\"callout-title\">The A driver ends up inside the elbow</div>\n<p>Run every wire <strong>before step 80</strong>, where 4x M3x10 lock the motor in.</p>\n</div>\n<ol>\n<li>Magnet, 42D (encoder bolts <strong>M3x40</strong>: test-fit them), coils.</li>\n<li>Power and <strong>CAN in</strong> from Z. <strong>CAN out</strong> on towards B and C.</li>\n<li>A long <strong>\"A LIMIT\" lead</strong> on the limit input. The sensor itself goes in at step 155.</li>\n<li>CAN ID <strong>4</strong>, remap <code>04 9E 01 A3</code>, COM jumper. <strong>Cal</strong> with nothing on the shaft.</li>\n<li>Before step 98 closes the A core, the wires for the wrist must pass to the A core side, with a slack loop for the roll.</li>\n</ol>", "ov": ["dA", "mA", "pd-A", "cc-A", "co-A"], "bench": null, "drv": "42D", "grip": null, "conn": [["Wago +V", "driver V+", "red", ""], ["Wago GND", "driver Gnd", "blk", ""], ["Z CAN out", "A CAN H / L", "yel", "in"], ["A CAN H / L", "pair towards B", "grn", "out"], ["\"A LIMIT\" lead", "A En", "blu", "long tail"]], "checks": [], "html_pro": "<div class=\"callout danger\">\n<div class=\"callout-title\">A driver ends up inside the elbow</div>\n<p>Run every wire <strong>before step 80</strong>, where 4x M3x10 lock the motor in.</p>\n</div>\n<ol>\n<li>Magnet, 42D (encoder bolts <strong>M3x40</strong>: test-fit), coils.</li>\n<li>Power and <strong>CAN in</strong> from Z. <strong>CAN out</strong> on towards B and C.</li>\n<li>Long <strong>\"A LIMIT\" lead</strong> on limit input. Sensor itself goes in at step 155.</li>\n<li>CAN ID <strong>4</strong>, remap <code>04 9E 01 A3</code>, COM jumper. <strong>Cal</strong> with nothing on shaft.</li>\n<li>Before step 98 closes the A core, wrist wires must pass to the A core side, with a slack loop for the roll.</li>\n</ol>", "checks_pro": [], "html_simple": "<div class=\"callout danger\">\n<div class=\"callout-title\">The A driver ends up inside the elbow</div>\n<p>Run every wire before step 80, where 4x M3x10 lock the motor in.</p>\n</div>\n<ol>\n<li>Wire the magnet, 42D (encoder bolts <strong>M3x40</strong>) and coils.</li>\n<li>Power and <strong>CAN in</strong> from Z. <strong>CAN out</strong> on towards B and C.</li>\n<li>Fit a long <strong>\"A LIMIT\" lead</strong> on the limit input. The sensor goes in at step 155.</li>\n<li>CAN ID <strong>4</strong>, remap <code>04 9E 01 A3</code>, COM jumper. <strong>Cal</strong> with nothing on the shaft.</li>\n<li>Before step 98 closes the A core, pass the wrist wires to the A core side with a slack loop.</li>\n</ol>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 5, "kind": "step", "n": 75, "title": "A motor and MKS Servo 42D", "img": "Attachments/Arctos/manual/arctos-step-075.png", "html": "<ol>\n<li>Get the <strong>Nema_17_34mm</strong> motor and the <strong>MKS Servo 42D</strong>.</li>\n<li>Do every item in section 5.1 first.</li>\n<li>The driver sits flat on the <strong>back</strong> of the motor. The shaft points away from the driver.</li>\n<li>Fit the 4 encoder bolts through the driver into the motor (see 5.2). Not drawn in the picture.</li>\n<li>Bring the motor to the elbow. The picture shows it beside the elbow, shaft pointing forward (to the left in the picture).</li>\n</ol>\n<p><strong>Check:</strong> the driver is tight and does not rock. The shaft turns by hand. All leads are labelled and long enough.\n<strong>Tips:</strong> UM: \"Should have done the wiring as I was going.\" Use washers under the encoder bolts if you can (official encoder video).</p>", "html_pro": "<ol>\n<li><strong>Nema_17_34mm</strong> motor and <strong>MKS Servo 42D</strong>.</li>\n<li>Complete all of section 5.1 first.</li>\n<li>Driver flat on <strong>back</strong> of motor; shaft points away from driver.</li>\n<li>4 encoder bolts through driver into motor (see 5.2). Not drawn in picture.</li>\n<li>Bring motor to elbow; picture shows it beside the elbow, shaft pointing forward (left in picture).</li>\n</ol>\n<p><strong>Check:</strong> driver tight, no rocking. Shaft turns by hand. All leads labelled and long enough.\n<strong>Tips:</strong> UM: \"Should have done the wiring as I was going.\" Washers under encoder bolts if possible (official encoder video).</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Get the <strong>Nema_17_34mm</strong> motor and the <strong>MKS Servo 42D</strong>.</li>\n<li>Do everything in section 5.1 first.</li>\n<li>Driver sits flat on the <strong>back</strong> of the motor. Shaft points away from the driver.</li>\n<li>Fit the 4 encoder bolts through the driver into the motor (see 5.2).</li>\n<li>Bring the motor to the elbow, shaft pointing forward (left in the picture).</li>\n</ol>\n<p>Check: driver tight, does not rock. Shaft turns by hand. All leads labelled and long enough.</p>", "checks_simple": [], "ts": [71, 33, 26]}, {"stage": 5, "kind": "step", "n": 76, "title": "Same picture again", "img": "Attachments/Arctos/manual/arctos-step-076.png", "html": "<ol>\n<li>This picture is identical to step 75. There is no new part.</li>\n<li>Put the motor into the elbow's motor pocket. The shaft must come out through the round hole in the elbow's front plate. Step 77 already shows the shaft sticking out there. (unsure: the picture does not show the exact path into the pocket.)</li>\n</ol>\n<p><strong>Check:</strong> the shaft sticks out of the front plate. No wire is pinched between the motor and the elbow.</p>", "html_pro": "<ol>\n<li>Same picture as step 75; no new part.</li>\n<li>Seat motor in elbow motor pocket; shaft exits the round hole in the elbow front plate (shown in step 77). (unsure: picture does not show the exact path into the pocket.)</li>\n</ol>\n<p><strong>Check:</strong> shaft protrudes from front plate. No wire pinched between motor and elbow.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Same picture as step 75. No new part.</li>\n<li>Put the motor into the elbow's motor pocket.</li>\n<li>The shaft comes out through the round hole in the front plate.</li>\n</ol>\n<p>Check no wire is pinched.</p>", "checks_simple": [], "ts": [71, 33, 69, 70]}, {"stage": 5, "kind": "step", "n": 77, "title": "A m3 bolt carrier", "img": "Attachments/Arctos/manual/arctos-step-077.png", "html": "<ol>\n<li>Take the <strong>A m3 bolt carrier</strong> (a narrow printed bar with holes).</li>\n<li>Put it into its slot on the elbow, just below
