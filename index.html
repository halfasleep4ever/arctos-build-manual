s=\"callout warning\">\n<div class=\"callout-title\">Do not over-tighten</div>\n<p>A nut can strip its plastic pocket.</p>\n</div>", "checks_simple": [], "ts": [2, 3, 8, 12, 4, 0]}, {"stage": 1, "kind": "step", "n": 28, "title": "The finished Y gearbox", "img": "Attachments/Arctos/web/manual/arctos-step-028.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Turn the camshaft (the star end in the centre) by hand.</li>\n<li>Hold the gearbox and wiggle the output.</li>\n</ol>\n<p><strong>Check:</strong> It turns smoothly with no clicking. The outside turns slowly. There is almost no play. If it is tight, see \"If something is wrong\" at the end.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Turn camshaft (star end, centre) by hand.</li>\n<li>Hold gearbox, wiggle output.</li>\n</ol>\n<p><strong>Check:</strong> Smooth, no clicking. Outside turns slowly. Almost no play. If tight, see \"If something is wrong\" at the end.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the camshaft by hand.</li>\n<li>Hold the gearbox and wiggle the output.</li>\n</ol>\n<p>Check: smooth, no clicking, almost no play.</p>", "checks_simple": [], "ts": [94, 10, 15, 11, 17]}, {"stage": 1, "kind": "step", "n": 29, "title": "Mount it between the Z lower cores", "img": "Attachments/Arctos/web/manual/arctos-step-029-where.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put the <strong>Z R lower core</strong> (the plate with the oval hole near the top) on the <strong>R-cover side</strong> (left).</li>\n<li>Put the <strong>Z L lower Core</strong> (the plate with the V notch at the top) on the <strong>L-cover side</strong> (right).</li>\n<li>Bolt the Z R lower core on with 6 x <strong>Bolt M5 25mm</strong> from the outside (left).</li>\n<li>Bolt the Z L lower Core on with 6 x <strong>Bolt M5 25mm</strong> from the outside (right).</li>\n</ol>\n<p><strong>Hardware:</strong> 12x M5x25 (6 per side).</p>\n<p><strong>Orientation:</strong> Both plates point up from the gearbox. The V notch is on the L side. The square cut-out near the hub of the Z R lower core should line up with the matching opening in the gearbox. (official video: \"oriented to match the rectangular cable opening\")</p>\n<p><strong>Check:</strong> Both plates are parallel. All 12 bolts are in. The gearbox centre is still free to turn.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>Z R lower core</strong> (plate with oval hole near top) on <strong>R-cover side</strong> (left).</li>\n<li><strong>Z L lower Core</strong> (plate with V notch at top) on <strong>L-cover side</strong> (right).</li>\n<li>Bolt Z R lower core with 6 x <strong>Bolt M5 25mm</strong> from outside (left).</li>\n<li>Bolt Z L lower Core with 6 x <strong>Bolt M5 25mm</strong> from outside (right).</li>\n</ol>\n<p><strong>Hardware:</strong> 12x M5x25 (6 per side).</p>\n<p><strong>Orientation:</strong> Both plates point up from gearbox. V notch on L side. Square cut-out near hub of Z R lower core lines up with matching opening in gearbox. (official video: \"oriented to match the rectangular cable opening\")</p>\n<p><strong>Check:</strong> Plates parallel. All 12 bolts in. Gearbox centre still free to turn.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>Z R lower core</strong> (oval hole) on the R-cover side.</li>\n<li>Put the <strong>Z L lower Core</strong> (V notch) on the L-cover side.</li>\n<li>Bolt each plate on from outside with 6x <strong>Bolt M5x25</strong> (12 total).</li>\n</ol>\n<p>Both plates point up.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Square notch</div>\n<p>The block on the R cover must sit in the square notch of the <strong>Z R lower core</strong>, next to the ▽Y mark.</p>\n</div>", "checks_simple": [], "ts": [26, 0, 7]}, {"stage": 1, "kind": "test", "key": "yg-test", "title": "Test the Y gearbox", "img": null, "html": "<p>No wiring in this stage.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["Turn the input by hand: smooth, no clicking.", "Wiggle the output: almost no play."], "html_pro": "<p>No wiring in this stage.</p>", "checks_pro": ["Input by hand: smooth, no clicking.", "Output wiggle: almost no play."], "html_simple": "<p>No wiring in this stage.</p>", "checks_simple": ["Turn the input by hand: smooth, no clicking.", "Wiggle the output: almost no play."], "ts": [7, 0]}, {"stage": 2, "kind": "wire", "key": "Y-setup", "title": "Set up the Y driver on the table", "img": null, "html": "<p>Do this before you start the Y axis. It is the same job as the X driver (start of the X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Y</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 23</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO57D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x65</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>2</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>3200 mA (the 57D default)</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>2x KY-003. <strong>Back</strong> = home</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with a meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue it to the centre of the shaft end. Let it dry. Fit the driver with the M3x65 bolts.</li>\n<li><strong>Power:</strong> check the polarity with a meter, then + to V+ and − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on the shaft. Set the menu like X, but <strong>CanID 2</strong> and <strong>Ma 3200 mA (the 57D default)</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on the bus.</li>\n<li><strong>Sensors:</strong> I1 = home, I2 = the other one. Set <strong>DIP switches 2 and 3 ON</strong> (1 OFF).</li>\n</ol>", "ov": null, "bench": ["coil", "pwr", "can", "lim", "sensor", "dip"], "drv": "57D", "grip": null, "conn": [["motor wire", "**A+**", "grn", "coil 1", "A+", null, "", null, "Green"], ["motor wire", "**A−**", "blk", "coil 1", "A−", null, "", null, "Black"], ["motor wire", "**B+**", "blu", "coil 2", "B+", null, "", null, "Blue"], ["motor wire", "**B−**", "red", "coil 2", "B−", null, "", null, "Red"], ["from the bench supply **+V**", "**V+**", "red", "table test", "V+", "supply +V", "tmp", null, "Red"], ["from the bench supply **−V**", "**Gnd**", "blk", "table test", "Gnd", "supply −V", "tmp", null, "Black"], ["from CANable **H**", "**A/H**", "yel", "table test, only this driver on the CANable", "A/H", "CANable H", "tmp", null, "Yellow"], ["from CANable **L**", "**B/L**", "grn", "table test", "B/L", "CANable L", "tmp", null, "Green"], ["from the Back sensor **S**", "**I1**", "blu", "home", "I1", "Back S", "tmp", null, "Blue"], ["from the Back sensor **+**", "**EVCC**", "red", "5 V from the driver", "EVCC", "Back +", "tmp", null, "Red"], ["from the Back sensor **−**", "**EGND**", "blk", "", "EGND", "Back −", "tmp", null, "Black"], ["from the Front sensor **S**", "**I2**", "blu", "", "I2", "Front S", "tmp", null, "Blue"], ["from the Front sensor **+**", "**EVCC**", "red", "same screw as the other sensor", "EVCC", "Front +", "tmp", null, "Red"], ["from the Front sensor **−**", "**EGND**", "blk", "same screw", "EGND", "Front −", "tmp", null, "Black"]], "conn_title": null, "sen": "ky", "sen_names": ["Back", "Front"], "wire": ["coil", "power", "can", "sensor"], "checks": [], "html_pro": "<p>Do before starting Y axis. Same job as X driver (start of X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Y</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 23</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO57D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x65</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>2</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>3200 mA (the 57D default)</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>2x KY-003. <strong>Back</strong> = home</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue to centre of shaft end; let dry. Fit driver with M3x65 bolts.</li>\n<li><strong>Power:</strong> check polarity with meter; + to V+, − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on shaft. Menu like X, but <strong>CanID 2</strong>, <strong>Ma 3200 mA (the 57D default)</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on bus.</li>\n<li><strong>Sensors:</strong> I1 = home, I2 = other. <strong>DIP switches 2 and 3 ON</strong> (1 OFF).</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Same job as the X driver, with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Y</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 23</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO57D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x65</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>2</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>3200 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>2x KY-003. <strong>Back</strong> = home</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>On the 57D:</strong> power and CAN = right-hand block (V+ / Gnd at the top, B/L / A/H at the bottom). Sensors = left-hand block. Motor = blue plug on the top edge.</p>\n<ul>\n<li>Find the 2 coil pairs with the meter (each under 10 Ω).</li>\n<li>Superglue the magnet to the centre of the shaft end. Let it dry. Fit the driver with its encoder bolts (M3x65).</li>\n</ul>\n<ol>\n<li><strong>Green</strong> motor wire → <strong>A+</strong> (coil 1)</li>\n<li><strong>Black</strong> motor wire → <strong>A−</strong> (coil 1)</li>\n<li><strong>Blue</strong> motor wire → <strong>B+</strong> (coil 2)</li>\n<li><strong>Red</strong> motor wire → <strong>B−</strong> (coil 2)</li>\n</ol>\n<ul>\n<li>Meter check: the bench supply <strong>+V</strong> and <strong>−V</strong> the right way round.</li>\n</ul>\n<ol start=\"5\">\n<li><strong>Red</strong> from the bench supply <strong>+V</strong> → <strong>V+</strong> (table test)</li>\n<li><strong>Black</strong> from the bench supply <strong>−V</strong> → <strong>Gnd</strong> (table test)</li>\n<li><strong>Yellow</strong> from CANable <strong>H</strong> → <strong>A/H</strong> (table test, only this driver on the CANable)</li>\n<li><strong>Green</strong> from CANable <strong>L</strong> → <strong>B/L</strong> (table test)</li>\n</ol>\n<ul>\n<li><strong>Cal</strong> with nothing on the shaft. Menu like X, but <strong>CanID 2</strong> and <strong>Ma 3200 mA</strong>.</li>\n<li>Set <strong>DIP switches 2 and 3 ON</strong>, 1 OFF.</li>\n</ul>\n<ol start=\"9\">\n<li><strong>Blue</strong> from the Back sensor <strong>S</strong> → <strong>I1</strong> (home)</li>\n<li><strong>Red</strong> from the Back sensor <strong>+</strong> → <strong>EVCC</strong> (5 V from the driver)</li>\n<li><strong>Black</strong> from the Back sensor <strong>−</strong> → <strong>EGND</strong></li>\n<li><strong>Blue</strong> from the Front sensor <strong>S</strong> → <strong>I2</strong></li>\n<li><strong>Red</strong> from the Front sensor <strong>+</strong> → <strong>EVCC</strong> (same screw as the other sensor)</li>\n<li><strong>Black</strong> from the Front sensor <strong>−</strong> → <strong>EGND</strong> (same screw)</li>\n</ol>\n<ul>\n<li>The table-test wires come off later, at step 32, before this driver goes in.</li>\n</ul>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Reversed power destroys the driver</div>\n<p>Red = +, black = −. Check three times with the meter.</p>\n</div>", "checks_simple": [], "ts": [62, 54, 85, 63, 87, 91]}, {"stage": 2, "kind": "test", "key": "Y-check", "title": "Test the Y driver before it goes in", "img": null, "html": "<p>Same tests as X. Fix anything now: the driver is hard to reach later.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["\"Cal success\", and the settings survive a power cycle.", "It answers on ID 2. Read encoder (<code>31</code>) changes when you turn the shaft.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): it stops when you trigger the home sensor by hand."], "html_pro": "<p>Same tests as X. Fix now; driver hard to reach later.</p>", "checks_pro": ["\"Cal success\"; settings survive power cycle.", "Answers on ID 2. Read encoder (<code>31</code>) changes when shaft turned.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): stops when home sensor triggered by hand."], "html_simple": "<p>Same tests as X. Fix anything now.</p>", "checks_simple": ["\"Cal success\". Settings survive a power cycle.", "Answers on ID 2. <code>31</code> changes when you turn the shaft.", "Home <code>91</code> stops when you trigger the home sensor by hand."], "ts": [54, 7, 28, 58, 70]}, {"stage": 2, "kind": "step", "n": 30, "title": "The bottom of the upper arm", "img": "Attachments/Arctos/web/manual/arctos-step-030.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Look at the result. This unit is the bottom of the upper arm.</li>\n</ol>\n<p><strong>Check:</strong> The V-notch plate (Z L lower Core) is in front. The camshaft star end shows in its centre hole.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Inspect result: unit is bottom of upper arm.</li>\n</ol>\n<p><strong>Check:</strong> V-notch plate (Z L lower Core) in front. Camshaft star end visible in its centre hole.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the V-notch plate (<strong>Z L lower Core</strong>) is in front.</p>", "checks_simple": [], "ts": [94, 10, 15, 11, 17]}, {"stage": 2, "kind": "step", "n": 31, "title": "Bring in the Y L Core and its bearing", "img": "Attachments/Arctos/web/manual/arctos-step-031.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Take the <strong>Y L Core</strong>. It is the shoulder: a tall wall with a round hub, joined to a lower box.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> into its round hub from the outside (right in the picture).</li>\n<li>Hold the gearbox unit so its V-notch side faces the inside of the Y L Core wall.</li>\n<li>Line up the gearbox centre with the Y L Core hub.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 61803. \"(9)\" is a CAD number.</p>\n<p><strong>Orientation:</strong> The \"X\" mark is on the bottom edge of the Y L Core box. The tall wall with the hub goes on the <strong>L side</strong> of the gearbox (the V-notch side).</p>\n<p><strong>Check:</strong> The bearing is flush in the hub. (unsure: the picture does not show the moment the gearbox enters the core. Steps 33–34 show it seated.)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Take <strong>Y L Core</strong> (shoulder: tall wall with round hub, joined to lower box).</li>\n<li>Press 1 x <strong>Bearing 61803</strong> into round hub from outside (right in picture).</li>\n<li>Hold gearbox unit with V-notch side facing inside of Y L Core wall.</li>\n<li>Align gearbox centre with Y L Core hub.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 61803. \"(9)\" is a CAD number.</p>\n<p><strong>Orientation:</strong> \"X\" mark on bottom edge of Y L Core box. Tall wall with hub goes on <strong>L side</strong> of gearbox (V-notch side).</p>\n<p><strong>Check:</strong> Bearing flush in hub. (unsure: picture does not show gearbox entering the core; steps 33–34 show it seated.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>Y L Core</strong>.</li>\n<li>Press 1x <strong>Bearing 61803</strong> into its round hub from outside.</li>\n<li>Hold the gearbox with its V-notch side to the inside of the Y L Core wall.</li>\n<li>Line up the gearbox centre with the hub.</li>\n</ol>\n<p>The \"X\" mark is on the bottom edge of the Y L Core.</p>", "checks_simple": [], "ts": [2, 3, 8, 12]}, {"stage": 2, "kind": "step", "n": 32, "title": "Fit the Y motor (MKS SERVO57D + Nema 23)", "img": "Attachments/Arctos/web/manual/arctos-step-032.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Make sure the motor prep box above is done. Driver bolted on, all wires connected, CAN ID 02, calibrated.</li>\n<li>Put the <strong>Nema 23 stepper</strong> (with the <strong>MKS 57D</strong> on its back) inside the Y L Core.</li>\n<li>Push its shaft out through the large hole in the tall wall.</li>\n<li>Fix it with 4 x <strong>Bolt M4 25mm</strong> from the outside of the wall (right).</li>\n</ol>\n<p><strong>Hardware:</strong> 4x M4x25.</p>\n<p><strong>Orientation:</strong> The shaft points <strong>out</strong> through the wall. The MKS 57D faces <strong>in</strong>, towards the middle of the shoulder.</p>\n<p><strong>Check:</strong> The shaft sticks out of the wall. The motor sits square.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>The designer: mount the motor \"in reverse, nuts outside\", because inner nuts cannot be reached. (Unexpected Maker stream)</li>\n<li>(unsure: Nema 23 flange holes are often plain holes. The BOM's 10 M4 nuts are all used on the Z rods. If your motor holes are not threaded, you need 4 more M4 nuts.)</li>\n</ul>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wiring point: Y driver</div>\n<p>The MKS 57D is now inside the shoulder.</p>\n<ul>\n<li>Its power and CAN-in cables come up from the X base through the <strong>hollow centre of the X pulley</strong>. The wiring runs down the centre; no slip ring is needed. (Unexpected Maker)</li>\n<li>Its CAN-out cable goes up to the Z driver. Leave it long and coiled for now.</li>\n<li>Do this <strong>before step 35</strong>. After step 35 the shoulder is bolted down onto the X pulley, and the centre hole is covered.</li>\n<li>(unsure: whether the 57D terminals can still be reached after step 37. Treat step 35 as the last easy point.)</li>\n</ul>\n</div>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Confirm motor prep box done: driver bolted on, all wires connected, CAN ID 02, calibrated.</li>\n<li>Put <strong>Nema 23 stepper</strong> (with <strong>MKS 57D</strong> on back) inside Y L Core.</li>\n<li>Push shaft out through large hole in tall wall.</li>\n<li>Fix with 4 x <strong>Bolt M4 25mm</strong> from outside of wall (right).</li>\n</ol>\n<p><strong>Hardware:</strong> 4x M4x25.</p>\n<p><strong>Orientation:</strong> Shaft points <strong>out</strong> through wall. MKS 57D faces <strong>in</strong>, toward middle of shoulder.</p>\n<p><strong>Check:</strong> Shaft protrudes through wall. Motor square.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Designer: mount motor \"in reverse, nuts outside\"; inner nuts unreachable. (Unexpected Maker stream)</li>\n<li>(unsure: Nema 23 flange holes often plain holes. BOM's 10 M4 nuts all used on Z rods. If motor holes not threaded, need 4 more M4 nuts.)</li>\n</ul>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wiring point: Y driver</div>\n<p>MKS 57D now inside shoulder.</p>\n<ul>\n<li>Power and CAN-in cables come up from X base through <strong>hollow centre of X pulley</strong>. Wiring runs down the centre; no slip ring needed. (Unexpected Maker)</li>\n<li>CAN-out cable goes up to Z driver. Leave long and coiled for now.</li>\n<li>Do this <strong>before step 35</strong>. After step 35 shoulder is bolted down onto X pulley and centre hole is covered.</li>\n<li>(unsure: whether 57D terminals reachable after step 37. Treat step 35 as last easy point.)</li>\n</ul>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Unplug the bench supply wires, the CANable CAN H / L and the two sensor plugs from the Y driver. Put the X CAN pair back on the CANable.</li>\n<li>Fit the <strong>MKS 57D</strong> on the back of the <strong>Nema 23 stepper</strong> (Y driver setup done, CAN ID 2).</li>\n<li>Put the motor inside the Y L Core.</li>\n<li>Push the shaft out through the large hole in the tall wall.</li>\n<li>Fix it with 4x <strong>Bolt M4x25</strong> from outside the wall.</li>\n</ol>\n<p>The shaft points out. The MKS 57D faces in.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wire Y before step 35</div>\n<p>Do the Y wiring card before step 35. After that the centre hole is covered.</p>\n</div>", "checks_simple": [], "ts": [4, 5, 9, 13, 16, 72]}, {"stage": 2, "kind": "step", "n": 33, "title": "Check from the other side", "img": "Attachments/Arctos/web/manual/arctos-step-033.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Turn the assembly round and look at the far side.</li>\n</ol>\n<p><strong>Check:</strong></p>\n<ul>\n<li>The round boss with the <strong>▼Y</strong> mark is at the top of the far side.</li>\n<li>The 6 M5 nuts from step 27 are still in place around it.</li>\n<li>The \"X\" mark is at the bottom corner of the shoulder box.</li>\n<li>\"Now we will test if those nuts we put earlier are still there.\" (official video)</li>\n</ul>\n<p>(unsure: no parts are labelled here. I could not tell if the low far wall is part of the Y L Core or a separate part.)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Rotate assembly; view far side.</li>\n</ol>\n<p><strong>Check:</strong></p>\n<ul>\n<li>Round boss with <strong>▼Y</strong> mark at top of far side.</li>\n<li>6 M5 nuts from step 27 still seated around it.</li>\n<li>\"X\" mark at bottom corner of shoulder box.</li>\n<li>\"Now we will test if those nuts we put earlier are still there.\" (official video)</li>\n</ul>\n<p>(unsure: no parts labelled. Could not tell if the low far wall is part of the Y L Core or a separate part.)</p>", "checks_pro": [], "html_simple": "<p>Turn the assembly to the far side.</p>\n<p>Check: the <strong>▼Y</strong> boss is at the top, the M5 nuts from step 27 are still in place, and the \"X\" mark is at the bottom corner.</p>", "checks_simple": [], "ts": [4, 54, 7]}, {"stage": 2, "kind": "step", "n": 34, "title": "The shoulder sits on the base", "img": "Attachments/Arctos/web/manual/arctos-step-034.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Lower the shoulder onto the round X pulley plate of the base.</li>\n</ol>\n<p><strong>Check:</strong> The motor shaft sticks out of the Y L Core wall. The 4 motor bolts sit in curved slots. The shoulder sits flat on the base.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Lower shoulder onto round X pulley plate of base.</li>\n</ol>\n<p><strong>Check:</strong> Motor shaft protrudes from Y L Core wall; 4 motor bolts in curved slots; shoulder flat on base.</p>", "checks_pro": [], "html_simple": "<p>Lower the shoulder onto the round X pulley plate of the base.</p>\n<p>Check: the motor shaft sticks out of the Y L Core wall. The shoulder sits flat.</p>", "checks_simple": [], "ts": [16, 72, 33]}, {"stage": 2, "kind": "wire", "key": "y-wire", "title": "Wire Y now, before step 35", "img": null, "html": "<div class=\"callout danger\">\n<div class=\"callout-title\">Last easy point for the Y driver</div>\n<p>After step 35 the shoulder is bolted down and the centre hole is covered.</p>\n</div>\n<ol>\n<li>Bring the 4-wire bundle (+V, GND, CAN H, CAN L) up from the base <strong>through the hollow centre of the X pulley</strong>.</li>\n<li>Connect it to the <strong>Y 57D</strong>: V+, Gnd, CAN H, CAN L.</li>\n<li>In the same terminals, fit the 4 wires <strong>out</strong> to Z.</li>\n<li>Leave the wires for Z <strong>long and coiled</strong>.</li>\n</ol>", "ov": ["pr-Y", "dY", "mY", "pd-Y", "cc-Y", "co-Y"], "bench": ["pwr", "can"], "drv": "57D", "grip": null, "conn": [["+V from the X driver", "**V+**", "red", "", "V+", "+V in", "", null, "Red"], ["GND from the X driver", "**Gnd**", "blk", "", "Gnd", "GND in", "", null, "Black"], ["CAN H from the X driver", "**A/H**", "yel", "", "A/H", "CAN H in", "", null, "Yellow"], ["CAN L from the X driver", "**B/L**", "grn", "", "B/L", "CAN L in", "", null, "Green"], ["+V out to the Z driver", "**V+**", "red", "same screw as the wire in", "V+", "+V out", "", null, "Red"], ["GND out to the Z driver", "**Gnd**", "blk", "same screw as the wire in", "Gnd", "GND out", "", null, "Black"], ["CAN H out to the Z driver", "**A/H**", "yel", "same screw as the wire in", "A/H", "CAN H out", "", null, "Yellow"], ["CAN L out to the Z driver", "**B/L**", "grn", "same screw as the wire in", "B/L", "CAN L out", "", null, "Green"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["power", "can"], "checks": [], "html_pro": "<div class=\"callout danger\">\n<div class=\"callout-title\">Last easy access to Y driver</div>\n<p>After step 35 shoulder is bolted down; centre hole covered.</p>\n</div>\n<ol>\n<li>Route 4-wire bundle (+V, GND, CAN H, CAN L) up from base <strong>through hollow centre of X pulley</strong>.</li>\n<li>Into <strong>Y 57D</strong>: V+, Gnd, CAN H, CAN L.</li>\n<li>Same terminals: 4 wires out to Z.</li>\n<li>Leave the wires for Z <strong>long and coiled</strong>.</li>\n</ol>", "checks_pro": [], "html_simple": "<div class=\"callout danger\">\n<div class=\"callout-title\">Last easy point for the Y driver</div>\n<p>After step 35 the centre hole is covered.</p>\n</div>\n<p><strong>Power and CAN on the Y 57D:</strong> right-hand block. V+ / Gnd at the top, B/L / A/H at the bottom.</p>\n<ul>\n<li>The table-test wires are already off the Y driver (step 32). The X CAN pair is back on the CANable.</li>\n<li>Bring the 4 wires from X up <strong>through the hollow centre of the X pulley</strong>.</li>\n</ul>\n<ol>\n<li><strong>Red</strong> +V from the X driver → <strong>V+</strong></li>\n<li><strong>Black</strong> GND from the X driver → <strong>Gnd</strong></li>\n<li><strong>Yellow</strong> CAN H from the X driver → <strong>A/H</strong></li>\n<li><strong>Green</strong> CAN L from the X driver → <strong>B/L</strong></li>\n<li><strong>Red</strong> +V out to the Z driver → <strong>V+</strong> (same screw as the wire in)</li>\n<li><strong>Black</strong> GND out to the Z driver → <strong>Gnd</strong> (same screw as the wire in)</li>\n<li><strong>Yellow</strong> CAN H out to the Z driver → <strong>A/H</strong> (same screw as the wire in)</li>\n<li><strong>Green</strong> CAN L out to the Z driver → <strong>B/L</strong> (same screw as the wire in)</li>\n</ol>\n<ul>\n<li>Two wires in one screw: twist the bare ends together first, then tighten.</li>\n<li>Leave the 4 wires for Z <strong>long and coiled</strong>.</li>\n</ul>", "checks_simple": [], "ts": [16, 26, 0, 70, 71, 53]}, {"stage": 2, "kind": "step", "n": 35, "title": "Bolt the shoulder to the base", "img": "Attachments/Arctos/web/manual/arctos-step-035.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push 2 x <strong>Bolt M5 40mm</strong> down at an angle on the left side.</li>\n<li>Push 1 x <strong>Bolt M5 40mm</strong> straight down on the right side.</li>\n<li>Tighten all 3 into the X pulley plate.</li>\n</ol>\n<p><strong>Hardware:</strong> 3x M5x40.</p>\n<p><strong>Check:</strong> The shoulder does not move on the base.</p>\n<p><strong>Tips:</strong> These bolts are hard to reach. Pre-drill (open up) the holes first. (Unexpected Maker)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>2 x <strong>Bolt M5 40mm</strong> down at an angle, left side.</li>\n<li>1 x <strong>Bolt M5 40mm</strong> straight down, right side.</li>\n<li>Tighten all 3 into X pulley plate.</li>\n</ol>\n<p><strong>Hardware:</strong> 3x M5x40.</p>\n<p><strong>Check:</strong> Shoulder does not move on base.</p>\n<p><strong>Tips:</strong> Bolts hard to reach; pre-drill (open up) holes first. (Unexpected Maker)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Push 2x <strong>Bolt M5x40</strong> down at an angle, left side.</li>\n<li>Push 2x <strong>Bolt M5x40</strong> straight down, right side (the picture shows one: the other is behind).</li>\n<li>Screw 4x <strong>Nut M5</strong> on under the X pulley plate. Tighten all 4.</li>\n</ol>\n<p>Check: the shoulder does not move.</p>", "checks_simple": [], "ts": [16, 26, 54]}, {"stage": 2, "kind": "step", "n": 36, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-036.webp", "html": "<p><strong>Check:</strong> The 3 bolts are in. The motor shaft still sticks out of the wall.</p>", "html_pro": "<p><strong>Check:</strong> 3 bolts in; motor shaft still protrudes from wall.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the bolts are in. The motor shaft still sticks out.</p>", "checks_simple": [], "ts": [72, 33, 54]}, {"stage": 2, "kind": "step", "n": 37, "title": "The two long M8 bolts", "img": "Attachments/Arctos/web/manual/arctos-step-037.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push 2 x <strong>Bolt M8 100mm</strong> through the lower shoulder box from the right side.</li>\n<li>Screw 2 x <strong>Nut M8</strong> onto them on the left side.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x M8x100, 2x M8 nut.</p>\n<p><strong>Check:</strong> Both bolts pass all the way through. The nuts are tight.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>2 x <strong>Bolt M8 100mm</strong> through lower shoulder box, right to left.</li>\n<li>2 x <strong>Nut M8</strong> on left side.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x M8x100, 2x M8 nut.</p>\n<p><strong>Check:</strong> Both bolts pass fully through; nuts tight.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Push 2x <strong>Bolt M8x100</strong> through the lower shoulder box from the right.</li>\n<li>Screw 2x <strong>Nut M8</strong> on at the left side.</li>\n</ol>\n<p>Check: both bolts go all the way through. The nuts are tight.</p>", "checks_simple": [], "ts": [4, 26, 54]}, {"stage": 2, "kind": "step", "n": 38, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-038.webp", "html": "<p><strong>Check:</strong> The shoulder is firm on the base.</p>", "html_pro": "<p><strong>Check:</strong> Shoulder firm on base.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the shoulder is firm on the base.</p>", "checks_simple": [], "ts": [54, 7, 28]}, {"stage": 2, "kind": "step", "n": 39, "title": "The 5 inner rods (M5)", "img": "Attachments/Arctos/web/manual/arctos-step-039.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push 5 x <strong>Rod M5 130mm</strong> through the 5 holes around the Y L Core hub, from the outside (right).</li>\n<li>Push each rod through the gearbox and out of the far side.</li>\n<li>Screw 1 x <strong>Nut M5</strong> onto each rod end on the far side (5 nuts).</li>\n<li>Screw 1 x <strong>Nut M5</strong> onto each rod end on the near side (5 nuts).</li>\n</ol>\n<p><strong>Hardware:</strong> 5x M5x130 rod, 10x M5 nut. \"(4) (3)\" are CAD numbers.</p>\n<p><strong>Check:</strong></p>\n<ul>\n<li>The <strong>last rod should meet some resistance</strong> when you push it in. That shows the gearbox is assembled correctly. (official docs)</li>\n<li>Every nut is tight. One loose rod nut caused a clicking noise. (Unexpected Maker)</li>\n</ul>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Use the <strong>M5</strong> rods here, not the M4 ones. (designer)</li>\n<li>Tightening the rod nuts brought some backlash back on Z. Lock nuts did not fit because the rods are too short. Many builders use <strong>M5x100 bolts</strong> instead of double-nutted rod. (Unexpected Maker)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>5 x <strong>Rod M5 130mm</strong> through the 5 holes around Y L Core hub, from outside (right).</li>\n<li>Push each through gearbox and out far side.</li>\n<li>1 x <strong>Nut M5</strong> on each rod end, far side (5).</li>\n<li>1 x <strong>Nut M5</strong> on each rod end, near side (5).</li>\n</ol>\n<p><strong>Hardware:</strong> 5x M5x130 rod, 10x M5 nut. \"(4) (3)\" = CAD numbers.</p>\n<p><strong>Check:</strong></p>\n<ul>\n<li><strong>Last rod meets some resistance</strong> on insertion = gearbox assembled correctly. (official docs)</li>\n<li>All nuts tight; one loose rod nut caused clicking. (Unexpected Maker)</li>\n</ul>\n<p><strong>Tips:</strong></p>\n<ul>\n<li><strong>M5</strong> rods here, not M4. (designer)</li>\n<li>Tightening rod nuts brought some Z backlash back. Lock nuts did not fit (rods too short). Many use <strong>M5x100 bolts</strong> instead of double-nutted rod. (Unexpected Maker)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Push 5x <strong>Rod M5x130</strong> through the 5 holes around the Y L Core hub, from the right.</li>\n<li>Push each rod through the gearbox and out the far side.</li>\n<li>Screw 1x <strong>Nut M5</strong> on each rod end, far side (5x).</li>\n<li>Screw 1x <strong>Nut M5</strong> on each rod end, near side (5x).</li>\n</ol>\n<p>Check: the last rod meets some resistance. Every nut is tight.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">M5 rods</div>\n<p>Use the M5 rods here, not the M4 rods.</p>\n</div>", "checks_simple": [], "ts": [4, 5, 9, 13]}, {"stage": 2, "kind": "step", "n": 40, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-040.webp", "html": "<p><strong>Check:</strong> 5 nuts sit around the hub on this side.</p>", "html_pro": "<p><strong>Check:</strong> 5 nuts around hub on this side.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: 5 nuts sit around the hub on this side.</p>", "checks_simple": [], "ts": [4, 54, 7]}, {"stage": 2, "kind": "step", "n": 41, "title": "Y pulley, centre rod and belt", "img": "Attachments/Arctos/web/manual/arctos-step-041.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Calibrate the Y driver now if you have not.</div>\n<p>The belt goes on in this step. Calibration needs the motor free. (Makerbase manual)</p>\n</div>\n<p><strong>Do:</strong></p>\n<ol>\n<li>Push the <strong>Y pulley</strong> onto the camshaft through the Y L Core hub. Its key must engage the camshaft star.</li>\n<li>Push 1 x <strong>Rod M5 140 mm</strong> through the centre of the Y pulley and the whole gearbox.</li>\n<li>Screw <strong>Nut M5 v1</strong> onto the far end (left).</li>\n<li>Screw <strong>Nut M5 v2</strong> onto the near end, outside the pulley (right).</li>\n<li>Put <strong>Pulley GT2W10B6.35</strong> on the motor shaft. Leave the set screw loose for now.</li>\n<li>Loop <strong>Belt GT2 380 mm</strong> around the Y pulley and the motor pulley.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x M5x140 rod, 2x M5 nut, 1x GT2 W10 B6.35 pulley, 1x 380 mm belt.</p>\n<p><strong>Check:</strong> The Y pulley sits fully on the camshaft. The belt runs straight.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>\"Pulley not engaging the camshaft, push it more.\" A washer fixed it, and then there was no backlash. (designer, in Unexpected Maker's stream)</li>\n<li>The centre rod should stick out of the pulley by about 5 mm, with a nut on the other side. (designer)</li>\n<li>Do not over-tighten the motor pulley set screw yet. You slide it later to line up with the belt. (official video)</li>\n<li>The Y belt is <strong>380 mm</strong>. The 630 mm belt is for X. (designer)</li>\n<li>If a bolt head rubs the belt, turn that bolt round. (Unexpected Maker)</li>\n</ul>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Calibrate Y driver now if not done.</div>\n<p>Belt goes on this step; calibration needs motor free. (Makerbase manual)</p>\n</div>\n<p><strong>Do:</strong></p>\n<ol>\n<li><strong>Y pulley</strong> onto camshaft through Y L Core hub; key engages camshaft star.</li>\n<li>1 x <strong>Rod M5 140 mm</strong> through centre of Y pulley and whole gearbox.</li>\n<li><strong>Nut M5 v1</strong> on far end (left).</li>\n<li><strong>Nut M5 v2</strong> on near end, outside pulley (right).</li>\n<li><strong>Pulley GT2W10B6.35</strong> on motor shaft; set screw loose.</li>\n<li><strong>Belt GT2 380 mm</strong> around Y pulley and motor pulley.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x M5x140 rod, 2x M5 nut, 1x GT2 W10 B6.35 pulley, 1x 380 mm belt.</p>\n<p><strong>Check:</strong> Y pulley fully seated on camshaft; belt runs straight.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>\"Pulley not engaging the camshaft, push it more.\" A washer fixed it, no backlash after. (designer, in Unexpected Maker's stream)</li>\n<li>Centre rod sticks out of pulley about 5 mm, nut on other side. (designer)</li>\n<li>Do not over-tighten motor pulley set screw yet; slide it later to align with belt. (official video)</li>\n<li>Y belt = <strong>380 mm</strong>; 630 mm belt is for X. (designer)</li>\n<li>Bolt head rubs belt: turn that bolt round. (Unexpected Maker)</li>\n</ul>", "checks_pro": [], "html_simple": "<div class=\"callout warning\">\n<div class=\"callout-title\">Calibrate first</div>\n<p>Calibrate the Y driver before the belt goes on.</p>\n</div>\n<ol>\n<li>Push the <strong>Y pulley</strong> (the printed HTD mod pulley, 50 teeth) onto the camshaft through the Y L Core hub, fully home.</li>\n<li>Push 1x <strong>Rod M5x140</strong> through the Y pulley and the gearbox.</li>\n<li>Screw 1x <strong>Nut M5</strong> on the far end (left).</li>\n<li>Screw 1x <strong>Nut M5</strong> on the near end, outside the pulley (right).</li>\n<li>Put the <strong>HTD 5M 15T pulley</strong> (metal, 6.35 mm bore) on the motor shaft. Leave the set screw loose.</li>\n<li>Loop the <strong>Y belt HTD 5M 400 mm</strong> (9 mm wide, \"400-5M-9\") round the Y pulley and the motor pulley. Teeth face in.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Belt size</div>\n<p>The Y belt is 400 mm. The 650 mm belt is for X, the 470 mm one for Z.</p>\n</div>", "checks_simple": [], "ts": [4, 5, 9, 13, 10, 15]}, {"stage": 2, "kind": "step", "n": 42, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-042.webp", "html": "<p><strong>Check:</strong> The belt goes from the small motor pulley up to the big Y pulley.</p>", "html_pro": "<p><strong>Check:</strong> Belt runs small motor pulley up to big Y pulley.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the belt runs from the small motor pulley up to the big Y pulley.</p>", "checks_simple": [], "ts": [28, 30, 16, 72, 33]}, {"stage": 2, "kind": "step", "n": 43, "title": "The Y belt tensioner", "img": "Attachments/Arctos/web/manual/arctos-step-043.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put the <strong>M5 nut</strong> in the back of the <strong>Y belt tensioner</strong> (red arrow \"M5 nut\").</li>\n<li>Fix the <strong>GT2 Idler W10</strong> to the tensioner with 1 x <strong>Bolt M5 25mm</strong>.</li>\n<li>Put 2 x <strong>M3 nuts</strong> behind the Y L Core wall at the two holes (red arrows \"M3 nuts\").</li>\n<li>Fix the tensioner to the wall with 2 x <strong>Bolt M3 15 mm</strong> through its slots.</li>\n<li>Leave the M3 bolts slightly loose.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x GT2 Idler W10, 1x M5x25, 1x M5 nut, 2x M3x15, 2x M3 nut.</p>\n<p><strong>Check:</strong> The tensioner slides in its slots.</p>\n<p><strong>Tip:</strong> The idler should spin freely. On X, the idlers clamped and needed washers. Chat said idlers are meant to float. (Unexpected Maker)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>M5 nut</strong> into back of <strong>Y belt tensioner</strong> (red arrow \"M5 nut\").</li>\n<li><strong>GT2 Idler W10</strong> to tensioner with 1 x <strong>Bolt M5 25mm</strong>.</li>\n<li>2 x <strong>M3 nuts</strong> behind Y L Core wall at the two holes (red arrows \"M3 nuts\").</li>\n<li>Tensioner to wall with 2 x <strong>Bolt M3 15 mm</strong> through slots.</li>\n<li>M3 bolts slightly loose.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x GT2 Idler W10, 1x M5x25, 1x M5 nut, 2x M3x15, 2x M3 nut.</p>\n<p><strong>Check:</strong> Tensioner slides in slots.</p>\n<p><strong>Tip:</strong> Idler should spin freely. On X, idlers clamped and needed washers; chat said idlers are meant to float. (Unexpected Maker)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 1x <strong>M5 nut</strong> in the back of the <strong>Y belt tensioner</strong>.</li>\n<li>Fix the <strong>GT2 Idler W10</strong> to the tensioner with 1x <strong>Bolt M5x25</strong>.</li>\n<li>Put 2x <strong>M3 nut</strong> behind the Y L Core wall at the two holes (red arrows).</li>\n<li>Fix the tensioner to the wall with 2x <strong>Bolt M3x15</strong> through its slots.</li>\n<li>Leave the M3 bolts slightly loose.</li>\n</ol>\n<p>Check: the tensioner slides in its slots. The idler spins freely.</p>", "checks_simple": [], "ts": [4, 28, 30, 29]}, {"stage": 2, "kind": "step", "n": 44, "title": "Tension the Y belt", "img": "Attachments/Arctos/web/manual/arctos-step-044.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Slide the tensioner so the idler presses on the belt.</li>\n<li>Tighten the 2 M3 bolts.</li>\n<li>Slide the motor pulley along its shaft until the belt runs straight.</li>\n<li>Tighten the pulley set screw.</li>\n</ol>\n<p><strong>Check:</strong> The belt is tight. It does not skip when you turn the Y pulley by hand.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Slide tensioner so idler presses on belt.</li>\n<li>Tighten 2 M3 bolts.</li>\n<li>Slide motor pulley along shaft until belt runs straight.</li>\n<li>Tighten pulley set screw.</li>\n</ol>\n<p><strong>Check:</strong> Belt tight; no skipping when Y pulley turned by hand.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Slide the tensioner so the idler presses on the belt.</li>\n<li>Tighten the 2 M3 bolts.</li>\n<li>Slide the motor pulley along the shaft until the belt runs straight.</li>\n<li>Tighten the pulley set screw.</li>\n</ol>\n<p>Check: the belt is tight. It does not skip when you turn the Y pulley by hand.</p>\n<p>Check: the 400 mm HTD belt length is calculated, not test-fitted. If the tensioner cannot make it tight, tell Kai.</p>", "checks_simple": [], "ts": [28, 30, 16, 29, 72, 33]}, {"stage": 2, "kind": "step", "n": 45, "title": "The Y cable holder and its magnets", "img": "Attachments/Arctos/web/manual/arctos-step-045.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put magnets in the <strong>Y cable holder</strong> where the 3 red arrows point: 2 in the top, 1 in the round end at the bottom.</li>\n<li>Fit the holder to the far-side boss, next to the <strong>▼Y</strong> mark.</li>\n<li>Fix it with 2 x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x M3x10, magnets (3x3 mm). (unsure: how many magnets go in each spot.)</p>\n<p><strong>Check:</strong> The holder sits next to the ▼Y mark. The magnets are flush.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>These magnets trigger the Y limit sensor. Hall sensors are polarised. Unexpected Maker glued magnets in with the wrong polarity and had to reprint.</li>\n<li>A dual Hall module (WSH231) needs one N magnet and one S magnet. (Unexpected Maker)</li>\n<li>Test each magnet with the sensor before you glue it.</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Magnets into <strong>Y cable holder</strong> at the 3 red arrows: 2 in top, 1 in round end at bottom.</li>\n<li>Fit holder to far-side boss next to <strong>▼Y</strong> mark.</li>\n<li>2 x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x M3x10, magnets (3x3 mm). (unsure: magnet count per spot.)</p>\n<p><strong>Check:</strong> Holder next to ▼Y mark; magnets flush.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Magnets trigger the Y limit sensor. Hall sensors are polarised. Unexpected Maker glued magnets in with wrong polarity, had to reprint.</li>\n<li>Dual Hall module (WSH231) needs one N and one S magnet. (Unexpected Maker)</li>\n<li>Test each magnet with the sensor before gluing.</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Put magnets in the <strong>Y cable holder</strong> at the 3 red arrows: 2 on top, 1 in the round end.</li>\n<li>Fit the holder to the far-side boss, next to the <strong>▼Y</strong> mark.</li>\n<li>Fix it with 2x <strong>Bolt M3x10</strong>.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Magnet polarity</div>\n<p>Test each magnet with its sensor before you glue it in.</p>\n</div>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 2, "kind": "step", "n": 46, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-046.webp", "html": "<p><strong>Check:</strong> The Y cable holder is fixed next to the ▼Y mark.</p>", "html_pro": "<p><strong>Check:</strong> Y cable holder fixed next to ▼Y mark.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the <strong>Y cable holder</strong> is fixed next to the ▼Y mark.</p>", "checks_simple": [], "ts": [70, 71, 54]}, {"stage": 2, "kind": "step", "n": 47, "title": "The upper-arm plates", "img": "Attachments/Arctos/web/manual/arctos-step-047.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>On the ▼Y side (left), put the <strong>Z R uper core</strong> above the Z R lower core.</li>\n<li>Lay the <strong>Z R middle core (1)</strong> over the joint, on the outside.</li>\n<li>Fix it with 4 x <strong>Bolt M5 20mm v2</strong> from the outside.</li>\n<li>On the other side (right), put the <strong>Z L uper core</strong> above the Z L lower Core.</li>\n<li>Lay the <strong>Z L middle core</strong> over the joint, on the outside.</li>\n<li>Fix it with 4 x <strong>Bolt M5 20mm v2</strong> and <strong>Nut M5 v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 8x M5x20 (4 per side). 4x M5 nut drawn (3 near the right-side bolts, 1 near the centre). (unsure: exactly which holes take the nuts, and whether the left side needs nuts.)</p>\n<p><strong>Orientation:</strong> The round hubs of both upper cores point up. They face each other.</p>\n<p><strong>Check:</strong> Both sides are straight and the same height. The hubs line up.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>▼Y side (left): <strong>Z R uper core</strong> above Z R lower core.</li>\n<li><strong>Z R middle core (1)</strong> over joint, outside.</li>\n<li>4 x <strong>Bolt M5 20mm v2</strong> from outside.</li>\n<li>Other side (right): <strong>Z L uper core</strong> above Z L lower Core.</li>\n<li><strong>Z L middle core</strong> over joint, outside.</li>\n<li>4 x <strong>Bolt M5 20mm v2</strong> and <strong>Nut M5 v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 8x M5x20 (4 per side). 4x M5 nut drawn (3 near right-side bolts, 1 near centre). (unsure: which holes take nuts; whether left side needs nuts.)</p>\n<p><strong>Orientation:</strong> Round hubs of both upper cores point up, facing each other.</p>\n<p><strong>Check:</strong> Both sides straight, same height; hubs aligned.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>On the ▼Y side (left), put the <strong>Z R uper core</strong> above the Z R lower core.</li>\n<li>Lay the <strong>Z R middle core</strong> over the joint, outside.</li>\n<li>Fix it with 5x <strong>Bolt M5x20</strong> from outside and 5x <strong>Nut M5</strong> inside. The picture draws 4: the CAD has a 5th bolt, higher up.</li>\n<li>On the right, put the <strong>Z L uper core</strong> above the Z L lower Core.</li>\n<li>Lay the <strong>Z L middle core</strong> over the joint, outside.</li>\n<li>Fix it with 4x <strong>Bolt M5x20</strong> and 4x <strong>Nut M5</strong>.</li>\n</ol>\n<p>The round hubs of both upper cores are at the top.</p>\n<p>Check: both sides are straight and the same height.</p>", "checks_simple": [], "ts": [4, 26, 54]}, {"stage": 2, "kind": "step", "n": 48, "title": "Bearings in the upper hubs", "img": "Attachments/Arctos/web/manual/arctos-step-048.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Press 1 x <strong>Bearing 61803</strong> into the hub of the Z R uper core.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> into the hub of the Z L uper core.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x 61803. \"(2)\" is a CAD number.</p>\n<p><strong>Orientation:</strong> In the picture both bearings go in from the left. That is the outer face of the Z R uper core and the inner face of the Z L uper core. (unsure: check against your parts; the seat recess shows the side.)</p>\n<p><strong>Check:</strong> Both bearings are flush and straight.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Press 1 x <strong>Bearing 61803</strong> into hub of Z R uper core.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> into hub of Z L uper core.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x 61803. \"(2)\" = CAD number.</p>\n<p><strong>Orientation:</strong> In picture both bearings enter from left: outer face of Z R uper core, inner face of Z L uper core. (unsure: check against your parts; seat recess shows the side.)</p>\n<p><strong>Check:</strong> Both bearings flush and straight.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Press 1x <strong>Bearing 61803</strong> into the hub of the <strong>Z R uper core</strong>.</li>\n<li>Press 1x <strong>Bearing 61803</strong> into the hub of the <strong>Z L uper core</strong>.</li>\n</ol>\n<p>Check: both bearings are flush and straight.</p>", "checks_simple": [], "ts": [2, 3, 8, 12]}, {"stage": 2, "kind": "wire", "key": "Z-setup", "title": "Set up the Z driver on the table", "img": null, "html": "<p>Do this now: the Z motor goes in at step 49. It is the same job as the X driver (start of the X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Z</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 60 mm</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x65</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>3</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1600 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>2x KY-003. <strong>Front</strong> = home</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with a meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue it to the centre of the shaft end. Let it dry. Fit the driver with the M3x65 bolts.</li>\n<li><strong>Power:</strong> check the polarity with a meter, then + to V+ and − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on the shaft. Set the menu like X, but <strong>CanID 3</strong> and <strong>Ma about 1600 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on the bus.</li>\n<li><strong>Sensors:</strong> En = home, Dir = the other one. These only work after the <strong>remap and the COM jumper</strong> (next card).</li>\n</ol>", "ov": null, "bench": ["coil", "pwr", "can", "lim", "sensor", "com"], "drv": "42D", "grip": null, "conn": [["motor wire", "**A+**", "grn", "coil 1", "A+", null, "", null, "Green"], ["motor wire", "**A−**", "blk", "coil 1", "A−", null, "", null, "Black"], ["motor wire", "**B+**", "blu", "coil 2", "B+", null, "", null, "Blue"], ["motor wire", "**B−**", "red", "coil 2", "B−", null, "", null, "Red"], ["from the bench supply **+V**", "**V+**", "red", "table test", "V+", "supply +V", "tmp", null, "Red"], ["from the bench supply **−V**", "**Gnd**", "blk", "table test", "Gnd", "supply −V", "tmp", null, "Black"], ["from CANable **H**", "**CANH**", "yel", "table test, only this driver on the CANable", "CANH", "CANable H", "tmp", null, "Yellow"], ["from CANable **L**", "**CANL**", "grn", "table test", "CANL", "CANable L", "tmp", null, "Green"], ["from the Front sensor **S**", "**En**", "blu", "home", "En", "Front S", "tmp", null, "Blue"], ["from the Front sensor **+**", "**+5V**", "red", "5 V from the driver", "+5V", "Front +", "tmp", null, "Red"], ["from the Front sensor **−**", "**GND**", "blk", "", "GND", "Front −", "tmp", null, "Black"], ["from the Back sensor **S**", "**Dir**", "blu", "", "Dir", "Back S", "tmp", null, "Blue"], ["from the Back sensor **+**", "**+5V**", "red", "same screw as the other sensor", "+5V", "Back +", "tmp", null, "Red"], ["from the Back sensor **−**", "**GND**", "blk", "same screw", "GND", "Back −", "tmp", null, "Black"]], "conn_title": null, "sen": "ky", "sen_names": ["Front", "Back"], "wire": ["coil", "power", "can", "sensor"], "checks": [], "html_pro": "<p>Do now: Z motor goes in at step 49. Same job as X driver (start of X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Z</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 60 mm</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x65</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>3</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1600 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>2x KY-003. <strong>Front</strong> = home</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the 2 pairs with a meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue to centre of shaft end; let dry. Fit driver with M3x65 bolts.</li>\n<li><strong>Power:</strong> check polarity with meter; + to V+, − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on shaft. Menu as X, but <strong>CanID 3</strong>, <strong>Ma about 1600 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on bus.</li>\n<li><strong>Sensors:</strong> En = home, Dir = other. Work only after <strong>remap and COM jumper</strong> (next card).</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Same job as the X driver, with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Z</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 60 mm</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x65</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>3</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1600 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>2x KY-003. <strong>Front</strong> = home</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>On the 42D:</strong> power = right-hand block, top (V+, Gnd). CAN = left-hand block, bottom (CANH, CANL). Sensor 5 V = left-hand block, top (+5V, GND). Sensor signals = right-hand block (En, Dir). Motor = blue plug on the top edge.</p>\n<ul>\n<li>Find the 2 coil pairs with the meter (each under 10 Ω).</li>\n<li>Superglue the magnet to the centre of the shaft end. Let it dry. Fit the driver with its encoder bolts (M3x65).</li>\n</ul>\n<ol>\n<li><strong>Green</strong> motor wire → <strong>A+</strong> (coil 1)</li>\n<li><strong>Black</strong> motor wire → <strong>A−</strong> (coil 1)</li>\n<li><strong>Blue</strong> motor wire → <strong>B+</strong> (coil 2)</li>\n<li><strong>Red</strong> motor wire → <strong>B−</strong> (coil 2)</li>\n</ol>\n<ul>\n<li>Meter check: the bench supply <strong>+V</strong> and <strong>−V</strong> the right way round.</li>\n</ul>\n<ol start=\"5\">\n<li><strong>Red</strong> from the bench supply <strong>+V</strong> → <strong>V+</strong> (table test)</li>\n<li><strong>Black</strong> from the bench supply <strong>−V</strong> → <strong>Gnd</strong> (table test)</li>\n<li><strong>Yellow</strong> from CANable <strong>H</strong> → <strong>CANH</strong> (table test, only this driver on the CANable)</li>\n<li><strong>Green</strong> from CANable <strong>L</strong> → <strong>CANL</strong> (table test)</li>\n</ol>\n<ul>\n<li><strong>Cal</strong> with nothing on the shaft. Menu like X, but <strong>CanID 3</strong> and <strong>Ma about 1600 mA</strong>.</li>\n</ul>\n<ol start=\"9\">\n<li><strong>Blue</strong> from the Front sensor <strong>S</strong> → <strong>En</strong> (home)</li>\n<li><strong>Red</strong> from the Front sensor <strong>+</strong> → <strong>+5V</strong> (5 V from the driver)</li>\n<li><strong>Black</strong> from the Front sensor <strong>−</strong> → <strong>GND</strong></li>\n<li><strong>Blue</strong> from the Back sensor <strong>S</strong> → <strong>Dir</strong></li>\n<li><strong>Red</strong> from the Back sensor <strong>+</strong> → <strong>+5V</strong> (same screw as the other sensor)</li>\n<li><strong>Black</strong> from the Back sensor <strong>−</strong> → <strong>GND</strong> (same screw)</li>\n</ol>\n<ul>\n<li>\n<p>The sensors work only after the remap and the COM wire (next card).</p>\n</li>\n<li>\n<p>The table-test wires come off later, on card \"Wire the Z driver\", before this driver goes in.</p>\n</li>\n</ul>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Reversed power destroys the driver</div>\n<p>Red = +, black = −. Check three times with the meter.</p>\n</div>", "checks_simple": [], "ts": [62, 54, 85, 63, 87, 91]}, {"stage": 2, "kind": "wire", "key": "Z-remap", "title": "Z is the first 42D: remap + COM jumper", "img": null, "html": "<p>The 42D has one limit input until you remap it. After the remap, <strong>En = limit 1</strong> and <strong>Dir = limit 2</strong>.</p>\n<ol>\n<li>Send the remap command for this driver:\n   - Z: <code>03 9E 01 A2</code>\n   - A: <code>04 9E 01 A3</code>\n   - B: <code>05 9E 01 A4</code>\n   - C: <code>06 9E 01 A5</code></li>\n<li><strong>Fit the jumper from COM to the sensor +V (5 V).</strong> Without it, homing never stops at the sensor.</li>\n</ol>\n<p>The jumper is drawn only on the A part of the official diagram, so it is easy to miss. See <a class=\"wl\" href=\"#/mks/4-remap-the-42d-limit-inputs\">MKS Driver Setup › 4. Remap the 42D limit inputs</a>.</p>", "ov": null, "bench": ["com", "lim"], "drv": "42D", "grip": null, "conn": [["short wire from **COM**", "**+5V**", "red", "without it, homing never stops at the sensor", "COM~+5V", "COM → +5V", "", null, "Red"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["sensor"], "checks": [], "html_pro": "<p>42D has one limit input until remapped. After remap: <strong>En = limit 1</strong>, <strong>Dir = limit 2</strong>.</p>\n<ol>\n<li>Send remap command for this driver:\n   - Z: <code>03 9E 01 A2</code>\n   - A: <code>04 9E 01 A3</code>\n   - B: <code>05 9E 01 A4</code>\n   - C: <code>06 9E 01 A5</code></li>\n<li><strong>Jumper from COM to sensor +V (5 V).</strong> Without it, homing never stops at the sensor.</li>\n</ol>\n<p>Jumper drawn only on the A part of the official diagram; easy to miss. See <a class=\"wl\" href=\"#/mks/4-remap-the-42d-limit-inputs\">MKS Driver Setup › 4. Remap the 42D limit inputs</a>.</p>", "checks_pro": [], "html_simple": "<p>After the remap, <strong>En = limit 1</strong> and <strong>Dir = limit 2</strong>.</p>\n<ul>\n<li>Send the remap command for this driver: Z <code>03 9E 01 A2</code> · A <code>04 9E 01 A3</code> · B <code>05 9E 01 A4</code> · C <code>06 9E 01 A5</code>.</li>\n</ul>\n<p><strong>COM</strong> is on the right-hand block, <strong>+5V</strong> on the left-hand block.</p>\n<ol>\n<li><strong>Red</strong> short wire from <strong>COM</strong> → <strong>+5V</strong> (without it, homing never stops at the sensor)</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">The COM wire</div>\n<p>Without it, homing never stops at the sensor.</p>\n</div>\n<p>See <a class=\"wl\" href=\"#/mks/4-remap-the-42d-limit-inputs\">MKS Driver Setup › 4. Remap the 42D limit inputs</a>.</p>", "checks_simple": [], "ts": [87, 91, 58, 59, 61, 64]}, {"stage": 2, "kind": "test", "key": "Z-check", "title": "Test the Z driver before it goes in", "img": null, "html": "<p>Same tests as X. Fix anything now: the driver is hard to reach later.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["\"Cal success\", and the settings survive a power cycle.", "It answers on ID 3. Read encoder (<code>31</code>) changes when you turn the shaft.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): it stops when you trigger the home sensor by hand."], "html_pro": "<p>Same tests as X. Fix anything now; driver hard to reach later.</p>", "checks_pro": ["\"Cal success\"; settings survive power cycle.", "Answers on ID 3; read encoder (<code>31</code>) changes when shaft turned.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): stops when home sensor triggered by hand."], "html_simple": "<p>Same tests as X. Fix anything now.</p>", "checks_simple": ["\"Cal success\". Settings survive a power cycle.", "Answers on ID 3. <code>31</code> changes when you turn the shaft.", "Home <code>91</code> stops when you trigger the home sensor by hand."], "ts": [54, 7, 28, 58, 70]}, {"stage": 2, "kind": "wire", "key": "z-driver", "title": "Wire the Z driver now, before step 49", "img": null, "html": "<ol>\n<li>The Z 42D must already be set up (Stage 0): CAN ID 3, remap <code>03 9E 01 A2</code>, COM jumper on.</li>\n<li>Power and <strong>CAN in</strong> from the Y driver. Power and <strong>CAN out</strong> towards A.</li>\n<li>Fit the Z limit sensor leads to the 42D now, or leave labelled leads.</li>\n<li>Leave a slack loop at the Y joint so the shoulder can swing. The Y cable holder (step 45) is the likely path.</li>\n</ol>", "ov": ["pr-Z", "dZ", "mZ", "pd-Z", "cc-Z", "co-Z"], "bench": ["pwr", "can", "lim"], "drv": "42D", "grip": null, "conn": [["+V from the Y driver", "**V+**", "red", "", "V+", "+V in", "", null, "Red"], ["GND from the Y driver", "**Gnd**", "blk", "", "Gnd", "GND in", "", null, "Black"], ["CAN H from the Y driver", "**CANH**", "yel", "", "CANH", "CAN H in", "", null, "Yellow"], ["CAN L from the Y driver", "**CANL**", "grn", "", "CANL", "CAN L in", "", null, "Green"], ["+V out to the A driver", "**V+**", "red", "same screw as the wire in", "V+", "+V out", "", null, "Red"], ["GND out to the A driver", "**Gnd**", "blk", "same screw as the wire in", "Gnd", "GND out", "", null, "Black"], ["CAN H out to the A driver", "**CANH**", "yel", "same screw as the wire in", "CANH", "CAN H out", "", null, "Yellow"], ["CAN L out to the A driver", "**CANL**", "grn", "same screw as the wire in", "CANL", "CAN L out", "", null, "Green"], ["lead for the sensor", "**+5V**", "red", "labelled \"Z lim\", the sensor goes on later", "+5V", "lim +5V", "", null, "Red"], ["lead for the sensor", "**GND**", "blk", "left-hand GND", "GND", "lim GND", "", null, "Black"], ["lead for the sensor", "**En**", "blu", "home", "En", "lim En", "", null, "Blue"], ["lead for the sensor", "**Dir**", "blu", "", "Dir", "lim Dir", "", null, "Blue"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["power", "can", "sensor"], "checks": [], "html_pro": "<ol>\n<li>Z 42D already set up (Stage 0): CAN ID 3, remap <code>03 9E 01 A2</code>, COM jumper on.</li>\n<li>Power and <strong>CAN in</strong> from Y driver; power and <strong>CAN out</strong> towards A.</li>\n<li>Fit Z limit sensor leads to 42D now, or leave labelled leads.</li>\n<li>Slack loop at Y joint so shoulder can swing; Y cable holder (step 45) is the likely path.</li>\n</ol>", "checks_pro": [], "html_simple": "<p><strong>On the Z 42D:</strong> V+ / Gnd = right-hand block, top. CANH / CANL = left-hand block, bottom.</p>\n<ul>\n<li>The Z driver is set up: CAN ID 3, remap <code>03 9E 01 A2</code>, COM wire in.</li>\n<li>Take the table-test wires off. Put the X CAN pair back on the CANable.</li>\n</ul>\n<ol>\n<li><strong>Red</strong> +V from the Y driver → <strong>V+</strong></li>\n<li><strong>Black</strong> GND from the Y driver → <strong>Gnd</strong></li>\n<li><strong>Yellow</strong> CAN H from the Y driver → <strong>CANH</strong></li>\n<li><strong>Green</strong> CAN L from the Y driver → <strong>CANL</strong></li>\n<li><strong>Red</strong> +V out to the A driver → <strong>V+</strong> (same screw as the wire in)</li>\n<li><strong>Black</strong> GND out to the A driver → <strong>Gnd</strong> (same screw as the wire in)</li>\n<li><strong>Yellow</strong> CAN H out to the A driver → <strong>CANH</strong> (same screw as the wire in)</li>\n<li><strong>Green</strong> CAN L out to the A driver → <strong>CANL</strong> (same screw as the wire in)</li>\n</ol>\n<p><strong>Sensor leads</strong> (+5V / GND left-hand block, En / Dir right-hand block):</p>\n<ol start=\"9\">\n<li><strong>Red</strong> lead for the sensor → <strong>+5V</strong> (labelled \"Z lim\", the sensor goes on later)</li>\n<li><strong>Black</strong> lead for the sensor → <strong>GND</strong> (left-hand GND)</li>\n<li><strong>Blue</strong> lead for the sensor → <strong>En</strong> (home)</li>\n<li><strong>Blue</strong> lead for the sensor → <strong>Dir</strong></li>\n</ol>\n<ul>\n<li>Two wires in one screw: twist the bare ends together first, then tighten.</li>\n<li>Label every lead. Leave a slack loop at the Y joint so the shoulder can swing.</li>\n</ul>", "checks_simple": [], "ts": [87, 91, 58, 59, 61, 64]}, {"stage": 2, "kind": "step", "n": 49, "title": "Fit the Z motor (MKS SERVO42D + Nema 17 60 mm)", "img": "Attachments/Arctos/web/manual/arctos-step-049.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Make sure the motor prep box above is done. Driver on, all wires on, CAN ID 03, remap done, calibrated.</li>\n<li>Put the <strong>Nema_17_60mm</strong> (with the <strong>MKS Servo 42D</strong> on its back) between the upper-arm plates.</li>\n<li>Push its shaft out through the Z R middle core (left).</li>\n<li>Fix it with 4 x <strong>Bolt M3 20mm v2</strong> from the outside (left).</li>\n<li>Put <strong>Pulley GT2W10B5</strong> on the shaft, outside the plate. Leave the set screw loose.</li>\n</ol>\n<p><strong>Hardware:</strong> 4x M3x20, 1x GT2 W10 B5 pulley.</p>\n<p><strong>Orientation:</strong> The shaft points out to the ▼Y side. The 42D faces the other plate.</p>\n<p><strong>Check:</strong> The pulley is outside the plate. The motor sits in the 4 short slots.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wiring point: Z driver</div>\n<ul>\n<li>Run the Y-to-Z cable (power + CAN) from the Y driver, across the Y joint, up between the upper-arm plates to the 42D. (unsure: the manual shows no cable path in these steps. The Y cable holder (step 45) is the likely place where cables cross the Y joint.)</li>\n<li>Fit the Z limit sensor wires to the 42D now, or leave a labelled pigtail. Unexpected Maker: \"You can't assemble the robot and then go back and add all the limits and wiring.\"</li>\n<li>Run a cable from the 42D on towards the elbow for the A motor (CAN-out + power). It crosses the Z joint at steps 73–74.</li>\n<li>One builder broke stepper leads when parts pressed on the wires. The MKS terminals face sideways. Keep wires clear of plate edges. (Unexpected Maker)</li>\n</ul>\n</div>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Confirm motor prep box done: driver on, all wires on, CAN ID 03, remap done, calibrated.</li>\n<li><strong>Nema_17_60mm</strong> (with <strong>MKS Servo 42D</strong> on back) between upper-arm plates.</li>\n<li>Shaft out through Z R middle core (left).</li>\n<li>4 x <strong>Bolt M3 20mm v2</strong> from outside (left).</li>\n<li><strong>Pulley GT2W10B5</strong> on shaft, outside plate; set screw loose.</li>\n</ol>\n<p><strong>Hardware:</strong> 4x M3x20, 1x GT2 W10 B5 pulley.</p>\n<p><strong>Orientation:</strong> Shaft points out to ▼Y side; 42D faces other plate.</p>\n<p><strong>Check:</strong> Pulley outside plate; motor in the 4 short slots.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wiring point: Z driver</div>\n<ul>\n<li>Y-to-Z cable (power + CAN) from Y driver, across Y joint, up between upper-arm plates to 42D. (unsure: manual shows no cable path here; Y cable holder (step 45) likely where cables cross Y joint.)</li>\n<li>Z limit sensor wires to 42D now, or labelled pigtail. Unexpected Maker: \"You can't assemble the robot and then go back and add all the limits and wiring.\"</li>\n<li>Cable from 42D towards elbow for A motor (CAN-out + power); crosses Z joint at steps 73–74.</li>\n<li>One builder broke stepper leads when parts pressed on wires. MKS terminals face sideways; keep wires clear of plate edges. (Unexpected Maker)</li>\n</ul>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Fit the <strong>MKS Servo 42D</strong> on the back of the <strong>Nema_17_60mm</strong> (Z driver setup done, CAN ID 3).</li>\n<li>Put the motor between the upper-arm plates.</li>\n<li>Push its shaft out through the <strong>Z R middle core</strong> (left).</li>\n<li>Fix it with 4x <strong>Bolt M3x20</strong> from outside.</li>\n<li>Put the <strong>HTD 5M 15T pulley</strong> (metal, 5 mm bore) on the shaft, outside the plate. Leave the set screw loose.</li>\n</ol>\n<p>The shaft points to the ▼Y side. The 42D faces the other plate.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wires</div>\n<p>Keep the motor and driver wires clear of the plate edges.</p>\n</div>", "checks_simple": [], "ts": [28, 30, 16, 58, 59, 61]}, {"stage": 2, "kind": "step", "n": 50, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-050.webp", "html": "<p><strong>Check:</strong> The Z motor sits between the plates. Its pulley is outside the plate.</p>", "html_pro": "<p><strong>Check:</strong> Z motor between plates; pulley outside plate.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the Z motor is between the plates. Its pulley is outside.</p>", "checks_simple": [], "ts": [16, 72, 33]}, {"stage": 2, "kind": "step", "n": 149, "title": "On the Y cable holder at the shoulder, check the magnets are in…", "img": "Attachments/Arctos/web/manual/arctos-step-149.webp", "html": "<p>On the Y cable holder at the shoulder, check the magnets are in the holes the red arrows show (two on top, one at the end). Parts: none labelled. Hardware: magnets. Note: \"magnets\"</p>", "moved": "Paper manual step 149. In the paper manual this is in the Limit switches section near the end (steps 146–159). It is done here, right after this joint, while you can still reach the spot.", "html_pro": "<p>Y cable holder at shoulder: magnets in the holes the red arrows show (two on top, one at end). Parts: none labelled. Hardware: magnets. Note: \"magnets\"</p>", "checks_pro": [], "html_simple": "<p>Check the magnets are in the <strong>Y cable holder</strong> at the red arrows: 2 on top, 1 at the round end.</p>", "checks_simple": [], "ts": [62, 54, 63, 70, 71]}, {"stage": 2, "kind": "step", "n": 150, "title": "Fix a KYD003 endstop to the Y encoder holder with M2 screws", "img": "Attachments/Arctos/web/manual/arctos-step-150.webp", "html": "<p>Fix a KYD003 endstop to the Y encoder holder with M2 screws. Fix the holder over the Y gearbox hub with Bolt M3 20mm (drawn: 3). A second KYD003 endstop is shown near the hub. Parts: Y encoder holder (2), KYD003 endstop. Hardware: M2 screws, Bolt M3 20mm v2. Note: \"M2 screws\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Hall sensors are polarised, and the board leads can be short. If the Z sensor can't reach its magnet, use 2x M2.5 nuts as spacers. Test every sensor with a magnet before you close anything.</p>\n</div>", "html_pro": "<p>KYD003 endstop on Y encoder holder with M2 screws. Holder over Y gearbox hub with Bolt M3 20mm (drawn: 3). Second KYD003 endstop shown near hub. Parts: Y encoder holder (2), KYD003 endstop. Hardware: M2 screws, Bolt M3 20mm v2. Note: \"M2 screws\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Hall sensors are polarised; board leads can be short. If Z sensor can't reach its magnet, use 2x M2.5 nuts as spacers. Test every sensor with a magnet before closing anything.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix 2x <strong>KY-003 sensor</strong> to the <strong>Y encoder holder</strong> with 4x <strong>Screw M2</strong>, one sensor on each side edge as drawn. The picture calls them KYD003 endstops.</li>\n<li>Fix the holder over the Y gearbox hub with 2x <strong>Bolt M3x20</strong> and 1x <strong>Bolt M3x10</strong> (the short one at the hub edge, next to the Back sensor).</li>\n</ol>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Test sensors</div>\n<p>Test every sensor with a magnet before you close anything.</p>\n</div>", "checks_simple": [], "ts": [4, 62, 54, 63, 58, 59]}, {"stage": 2, "kind": "step", "n": 151, "title": "Result: the Y encoder holder covers the hub and the endstop pins…", "img": "Attachments/Arctos/web/manual/arctos-step-151.webp", "html": "<p>Result: the Y encoder holder covers the hub and the endstop pins point out. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: Y encoder holder covers hub; endstop pins point out. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the <strong>Y encoder holder</strong> covers the hub. Both endstops sit on its edges, pins pointing out.</p>", "checks_simple": [], "ts": [7, 11, 58, 59, 61, 64]}, {"stage": 2, "kind": "wire", "key": "y-sensors", "title": "Wire the Y limit sensors", "img": "Attachments/Arctos/web/arctos-endstop_testing_setup.webp", "html": "<ol>\n<li>Two <strong>KY-003</strong> boards: \"Back\" and \"Front\". <strong>Back = home.</strong></li>\n<li>They sit on the Y encoder holder (step 150) with M2 screws.</li>\n<li>Wire them to the Y 57D: <strong>I1 = Back (home)</strong>, <strong>I2 = Front</strong>.</li>\n</ol>", "ov": ["li-Y"], "bench": ["lim", "sensor"], "drv": "57D", "grip": null, "conn": [["from the Back sensor **S**", "**I1**", "blu", "home", "I1", "Back S", "", null, "Blue"], ["from the Back sensor **+**", "**EVCC**", "red", "5 V from the driver", "EVCC", "Back +", "", null, "Red"], ["from the Back sensor **−**", "**EGND**", "blk", "", "EGND", "Back −", "", null, "Black"], ["from the Front sensor **S**", "**I2**", "blu", "", "I2", "Front S", "", null, "Blue"], ["from the Front sensor **+**", "**EVCC**", "red", "same screw as the other sensor", "EVCC", "Front +", "", null, "Red"], ["from the Front sensor **−**", "**EGND**", "blk", "same screw", "EGND", "Front −", "", null, "Black"]], "conn_title": null, "sen": "ky", "sen_names": ["Back", "Front"], "wire": ["sensor"], "checks": [], "html_pro": "<ol>\n<li>Two <strong>KY-003</strong> boards: \"Back\" and \"Front\". <strong>Back = home.</strong></li>\n<li>On Y encoder holder (step 150), M2 screws.</li>\n<li>To Y 57D: <strong>I1 = Back (home)</strong>, <strong>I2 = Front</strong>.</li>\n</ol>", "checks_pro": [], "html_simple": "<p><strong>Sensors:</strong> left-hand block of the Y 57D (EVCC, EGND, I1, I2). Two <strong>KY-003</strong> boards: Back and Front. <strong>Back = home.</strong></p>\n<ul>\n<li>Fix them on the Y encoder holder (step 150) with M2 screws.</li>\n</ul>\n<ol>\n<li><strong>Blue</strong> from the Back sensor <strong>S</strong> → <strong>I1</strong> (home)</li>\n<li><strong>Red</strong> from the Back sensor <strong>+</strong> → <strong>EVCC</strong> (5 V from the driver)</li>\n<li><strong>Black</strong> from the Back sensor <strong>−</strong> → <strong>EGND</strong></li>\n<li><strong>Blue</strong> from the Front sensor <strong>S</strong> → <strong>I2</strong></li>\n<li><strong>Red</strong> from the Front sensor <strong>+</strong> → <strong>EVCC</strong> (same screw as the other sensor)</li>\n<li><strong>Black</strong> from the Front sensor <strong>−</strong> → <strong>EGND</strong> (same screw)</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Sensor power = 5 V from the driver</div>\n<p>Never connect a sensor to the 24 V wires. That burns it out.</p>\n</div>", "checks_simple": [], "ts": [87, 91, 58, 59, 61, 64]}, {"stage": 2, "kind": "test", "key": "y-test", "title": "Test Y", "img": null, "html": "<p>If the driver acts strangely after mounting, calibrate again with the <strong>belt off</strong>.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["Belt off: jog Y ±5°. It turns the right way.", "Belt on: jog ±10°, then home. It stops at the Back sensor.", "Swing the shoulder by hand through its range. No wire goes tight."], "html_pro": "<p>Driver misbehaves after mounting: recalibrate with <strong>belt off</strong>.</p>", "checks_pro": ["Belt off: jog Y ±5°; turns the right way.", "Belt on: jog ±10°, then home; stops at Back sensor.", "Swing shoulder by hand through range; no wire goes tight."], "html_simple": "<p>If the driver acts strangely after mounting, calibrate again with the <strong>belt off</strong>.</p>", "checks_simple": ["Belt off: jog Y ±5°. It turns the right way.", "Belt on: jog ±10°, then home. It stops at the Back sensor.", "Swing the shoulder by hand. No wire goes tight."], "ts": [28, 30, 54, 85, 55, 57]}, {"stage": 3, "kind": "step", "n": 51, "title": "Build three Z disks and line up the locking holes", "img": "Attachments/Arctos/web/manual/arctos-step-051.webp", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Build 3 Z disks as in step 21. Each gets 1 x 61803, 5 small bearings and a cap with 5 screws.</li>\n<li>Find the number on each rim: <strong>Z cycloidal disk 1</strong>, <strong>2</strong> and <strong>3</strong>.</li>\n<li>Find the small locking hole on each disk (red arrow). It is near the rim, between two lobes.</li>\n<li>Stack the disks with disk 3 in front. Line up the 3 locking holes.</li>\n</ol>\n<p><strong>Hardware:</strong> for 3 disks: 3x 61803, 15x small bearings (type: see the conflict note), 15x cap screws.</p>\n<p><strong>Check:</strong> You can see 1, 2 and 3 on the rims, stepped like the picture.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>The designer enlarged this hole to about 1.8 mm so a piece of <strong>filament</strong> can pin the stack. (Unexpected Maker stream)</li>\n<li>Unexpected Maker also drilled about 1.8 mm alignment holes and used filament or a drill bit.</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Build 3 Z disks as step 21: each 1 x 61803, 5 small bearings, cap with 5 screws.</li>\n<li>Read rim numbers: <strong>Z cycloidal disk 1</strong>, <strong>2</strong>, <strong>3</strong>.</li>\n<li>Find small locking hole on each disk (red arrow), near rim between two lobes.</li>\n<li>Stack with disk 3 in front; align the 3 locking holes.</li>\n</ol>\n<p><strong>Hardware:</strong> for 3 disks: 3x 61803, 15x small bearings (type: see conflict note), 15x cap screws.</p>\n<p><strong>Check:</strong> 1, 2, 3 visible on rims, stepped as pictured.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Designer enlarged this hole to about 1.8 mm so a piece of <strong>filament</strong> pins the stack. (Unexpected Maker stream)</li>\n<li>Unexpected Maker also drilled about 1.8 mm alignment holes; used filament or drill bit.</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Build 3 Z disks (zero-backlash mod: they replace the stock disks) as in step 21. Each disk gets 1 big bearing, 5 small bearings and a cap with 5 small screws. In all: 3x <strong>Bearing 61803</strong>, 15x <strong>Bearing 618-6</strong> (618/6), 3x <strong>Bearing cap</strong>, 15x <strong>Screw M2.6x5</strong>.</li>\n<li>Find the number on each rim: <strong>Z cycloidal disk 1</strong>, <strong>2</strong>, <strong>3</strong>.</li>\n<li>Find the small locking hole on each disk. On the zero-backlash disks it is <strong>not</strong> where the red arrow points: it is near the rim, between two of the 5 bearing holes (see the 3D).</li>\n<li>Stack the disks with disk 3 in front.</li>\n<li>Line up the 3 locking holes. Push a piece of filament through to pin them.</li>\n</ol>\n<p>Check: 1, 2 and 3 show on the rims, stepped like the picture.</p>\n<p>Check: the zero-backlash locking holes line up only when the disks sit right on the camshaft (in the 3D they meet within about 0.7 mm). If the filament will not go through all 3, ask Kai before you force it. If your disks show no numbers, write 1, 2, 3 on them wit
