 If it binds, see <a class=\"wl\" href=\"#/planetary/if-the-gearbox-binds-or-is-loose\">Planetary Gearboxes (A, B, C) › If the gearbox binds or is loose</a>.</p>", "checks_simple": [], "ts": [95, 18, 19, 22, 23, 20]}, {"stage": 6, "kind": "step", "n": 128, "title": "The BL unit", "img": "Attachments/Arctos/web/manual/arctos-step-128.webp", "html": "<ol>\n<li>The BL unit is the motor holder, motor, driver and BL core gearbox together.</li>\n<li>Hold it beside the wrist. It is not fitted yet.</li>\n</ol>", "html_pro": "<ol>\n<li>BL unit = motor holder + motor + driver + BL core gearbox.</li>\n<li>Hold beside the wrist; not fitted yet.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the BL unit is complete. Hold it beside the wrist, do not fit it yet.</p>", "checks_simple": [], "ts": [72, 33, 18]}, {"stage": 6, "kind": "step", "n": 129, "title": "Gearbox gear bolts, first two", "img": "Attachments/Arctos/web/manual/arctos-step-129.webp", "html": "<ol>\n<li>Look at the back of the motor holder, next to the motor. You can see the 3-hole disc in the middle of the holder (the gearbox gear).</li>\n<li>Put <strong>Bolt M3 15mm</strong> through the 2 holes you can reach. Drawn: 2.</li>\n<li>These bolts go through the <strong>BCGL gearbox gear</strong> into the <strong>input sun</strong> (step 120). They lock the motor's drive into the gearbox.</li>\n</ol>\n<p><strong>Check:</strong> use the right length (15 mm). \"A bolt that is too long will break the sun gear.\" [Alberto]</p>\n<div class=\"callout note\">\n<div class=\"callout-title\">The motor holder does not move</div>\n<p>The red arrow in step 130 circles the <strong>3-hole disc</strong>, not the holder. The bolt heads appear one by one <strong>in that disc</strong>: 2 in step 130, 3 in step 132. The motor holder does not move.</p>\n</div>", "html_pro": "<ol>\n<li>Back of the motor holder, next to the motor: the 3-hole disc (gearbox gear) in the middle.</li>\n<li><strong>Bolt M3 15mm</strong> through the 2 reachable holes. Drawn: 2.</li>\n<li>Bolts pass through the <strong>BCGL gearbox gear</strong> into the <strong>input sun</strong> (step 120), locking motor drive to the gearbox.</li>\n</ol>\n<p><strong>Check:</strong> correct length (15 mm). \"A bolt that is too long will break the sun gear.\" [Alberto]</p>\n<div class=\"callout note\">\n<div class=\"callout-title\">Correction to earlier note</div>\n<p>Earlier notes said steps 129–132 \"fix and rotate the motor holder to tension the belt\". Pictures disagree. The red arrow in step 130 circles the <strong>3-hole disc</strong>, not the holder. Bolt heads appear one by one <strong>in that disc</strong>: 2 in step 130, 3 in step 132. The holder does not move.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Find the 3-hole disc on the motor holder, next to the motor.</li>\n<li>Put 2x <strong>Bolt M3 15mm</strong> through the 2 holes you can reach.</li>\n<li>They go through the <strong>BCGL gearbox gear</strong> into the <strong>input sun</strong>.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Use 15 mm only</div>\n<p>A longer bolt breaks the sun gear.</p>\n</div>", "checks_simple": [], "ts": [20, 21, 25, 27, 72, 33]}, {"stage": 6, "kind": "step", "n": 130, "title": "Turn the gearbox to reach the third hole", "img": "Attachments/Arctos/web/manual/arctos-step-130.webp", "html": "<ol>\n<li>The motor body hides the third hole.</li>\n<li>Turn the gearbox gear (red curved arrow) until the third hole comes clear of the motor. Turning the outer ring by hand does this. The motor turns too.</li>\n</ol>\n<p>Tip: the 3D viewer shows a \"stopper\" that \"can be used to stop gears from moving. It helps to bolt them more easily.\" [3D] (unsure: which step it belongs to.)</p>", "html_pro": "<ol>\n<li>Motor body hides the third hole.</li>\n<li>Turn the gearbox gear (red curved arrow) until the third hole clears the motor; turn the outer ring by hand. Motor turns too.</li>\n</ol>\n<p>Tip: 3D viewer shows a \"stopper\" that \"can be used to stop gears from moving. It helps to bolt them more easily.\" [3D] (unsure: which step it belongs to.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>The motor body hides the third hole.</li>\n<li>Turn the 3-hole disc (red arrow) until the third hole is clear.</li>\n</ol>", "checks_simple": [], "ts": [72, 33, 26]}, {"stage": 6, "kind": "step", "n": 131, "title": "Third bolt", "img": "Attachments/Arctos/web/manual/arctos-step-131.webp", "html": "<ol>\n<li>Put in the third <strong>Bolt M3 15mm</strong>. Drawn: 1.</li>\n</ol>", "html_pro": "<ol>\n<li>Insert third <strong>Bolt M3 15mm</strong>. Drawn: 1.</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li>Put in the third <strong>Bolt M3 15mm</strong> (1x).</li>\n</ol>", "checks_simple": [], "ts": [26, 0, 18]}, {"stage": 6, "kind": "step", "n": 132, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-132.webp", "html": "<ol>\n<li>Three bolt heads now show in the disc.</li>\n</ol>\n<p><strong>Check:</strong> tighten all 3 evenly. Spin test again. Turning the outer ring should still be smooth.</p>", "html_pro": "<ol>\n<li>Three bolt heads show in the disc.</li>\n</ol>\n<p><strong>Check:</strong> tighten all 3 evenly. Spin test again; outer ring still smooth.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Tighten all 3 bolts evenly.</li>\n</ol>\n<p>Check: the 3 bolt heads show in the disc. The outer ring still turns smoothly.</p>", "checks_simple": [], "ts": [26, 0, 18]}, {"stage": 6, "kind": "step", "n": 133, "title": "Bring the unit to the B core", "img": "Attachments/Arctos/web/manual/arctos-step-133.webp", "html": "<ol>\n<li>Bring the BL unit to the wrist.</li>\n<li>The 3-hole shaft of <strong>B bevel gear R</strong> (step 105) lines up with the 3-hole triangle on the BL <strong>timing pulley</strong>.</li>\n</ol>\n<p><strong>Check:</strong> before any bolts go in, \"<strong>check the axis turns before screwing everything together</strong>.\" [UM]</p>\n<p>(unsure: the bolts that join gear R's shaft to the timing pulley are not drawn. See section 2.4.)</p>", "html_pro": "<ol>\n<li>Bring BL unit to wrist.</li>\n<li>Align 3-hole shaft of <strong>B bevel gear R</strong> (step 105) with 3-hole triangle on BL <strong>timing pulley</strong>.</li>\n</ol>\n<p><strong>Check:</strong> before any bolts, \"<strong>check the axis turns before screwing everything together</strong>.\" [UM]</p>\n<p>(unsure: bolts joining gear R's shaft to timing pulley are not drawn. See section 2.4.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Bring the BL unit to the wrist.</li>\n<li>Line up the 3-hole shaft end of the <strong>bevel gear</strong> that faces the BL unit with the 3 small holes in the hub of the <strong>BC pulley</strong>.</li>\n</ol>\n<p>Check: the axis turns by hand before any bolt goes in.</p>", "checks_simple": [], "ts": [16, 32, 26]}, {"stage": 6, "kind": "step", "n": 134, "title": "Bolt the BL side", "img": "Attachments/Arctos/web/manual/arctos-step-134.webp", "html": "<ol>\n<li>Put <strong>Bolt M3 20mm</strong> in the 2 long-bolt holes. Drawn: 2.</li>\n<li>Put <strong>Bolt M3 10mm</strong> in the 4 short-bolt holes. Drawn: 4.</li>\n<li>Put <strong>Nut M3</strong> on the far side for the 2 holes shown. Drawn: 2 (they sit near the forearm end).</li>\n<li>The bolts go into holes around the top and bottom rim of the gearbox.</li>\n</ol>\n<p><strong>Check:</strong> nothing pinches a wire. The gearbox still spins.</p>\n<p>(unsure: which hole takes which length, and which bolts take the 2 nuts. The picture does not show the bolts going in. The old caption said 3 + 3. I counted 2 long + 4 short.)</p>", "html_pro": "<ol>\n<li><strong>Bolt M3 20mm</strong> in the 2 long-bolt holes. Drawn: 2.</li>\n<li><strong>Bolt M3 10mm</strong> in the 4 short-bolt holes. Drawn: 4.</li>\n<li><strong>Nut M3</strong> on far side for the 2 holes shown. Drawn: 2 (near forearm end).</li>\n<li>Bolts go in holes around top and bottom rim of gearbox.</li>\n</ol>\n<p><strong>Check:</strong> no wire pinched. Gearbox still spins.</p>\n<p>(unsure: which hole takes which length, and which bolts take the 2 nuts. Picture does not show bolts going in. Old caption said 3 + 3; counted 2 long + 4 short.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 2x <strong>Bolt M3 20mm v2</strong> in the long-bolt holes.</li>\n<li>Put 4x <strong>Bolt M3 10mm v2</strong> in the short-bolt holes.</li>\n<li>Put 2x <strong>Nut M3 v2</strong> on the far side, near the forearm end, top and bottom.</li>\n</ol>\n<p>Check: no wire is pinched. The gearbox still spins.</p>", "checks_simple": [], "ts": [4, 26, 70, 71]}, {"stage": 6, "kind": "step", "n": 135, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-135.webp", "html": "<ol>\n<li>The BL side is bolted on.</li>\n</ol>\n<p><strong>Check:</strong> turn the BL timing pulley by hand (belt not fitted yet). Bevel gear R inside the B core turns with it.</p>", "html_pro": "<ol>\n<li>BL side bolted on.</li>\n</ol>\n<p><strong>Check:</strong> turn BL timing pulley by hand (belt not fitted yet); bevel gear R inside B core turns with it.</p>", "checks_pro": [], "html_simple": "<p>Check: turn the BL <strong>BC pulley</strong> by hand. <strong>B bevel gear L</strong> inside the B core turns with it.</p>", "checks_simple": [], "ts": [28, 30, 32, 26]}, {"stage": 6, "kind": "step", "n": 136, "title": "BCL magnet holder (optional)", "img": "Attachments/Arctos/web/manual/arctos-step-136.webp", "html": "<ol>\n<li>The <strong>BCL magnet holder</strong> fits on the triangle boss in the centre of the timing pulley.</li>\n<li>The picture shows 2 bolt heads through it. (unsure: bolt size; not labelled.)</li>\n<li>\"Not needed if additional encoders will not be used.\" [Manual] The extra encoders (AS5600) are \"not included in the kit. Currently only in test phase.\" [3D]</li>\n</ol>\n<p>(unsure: whether the bolts that hold this part are the same bolts that join the pulley to bevel gear R. If so, you still need those bolts without the holder.)</p>", "html_pro": "<ol>\n<li><strong>BCL magnet holder</strong> fits on triangle boss in centre of timing pulley.</li>\n<li>Picture shows 2 bolt heads through it. (unsure: bolt size; not labelled.)</li>\n<li>\"Not needed if additional encoders will not be used.\" [Manual] Extra encoders (AS5600) \"not included in the kit. Currently only in test phase.\" [3D]</li>\n</ol>\n<p>(unsure: whether the bolts holding this part are the same bolts joining pulley to bevel gear R. If so, those bolts are still needed without the holder.)</p>", "checks_pro": [], "html_simple": "<p>Rigid diff mod: no magnet holder here (the pulley cap sits where it went).</p>\n<ol>\n<li>Push the <strong>Threaded rod M5x130</strong> in from the BL side: through the BC pulley, gear L, the free shaft and gear R into the <strong>Nut M5</strong> in the BR pulley cap. Screw it in.</li>\n<li>Press 1x <strong>Bearing 61803</strong> into the recess of the BL <strong>BC pulley</strong>.</li>\n<li>Push a <strong>BC pulley cap</strong> into that bearing.</li>\n<li>Screw 1x <strong>Nut M5</strong> onto the rod end, in the cap.</li>\n</ol>", "checks_simple": [], "ts": [16, 32, 62, 63, 26]}, {"stage": 6, "kind": "step", "n": 137, "title": "BC belt and idler tensioner", "img": "Attachments/Arctos/web/manual/arctos-step-137.webp", "html": "<ol>\n<li>Loop <strong>BC belt 1</strong> (6 mm x 450 mm) around the <strong>outer ring</strong> (big) and the <strong>timing pulley</strong> (small).</li>\n<li>Put 2 <strong>GT2 idler W6</strong> wheels on the <strong>BCL idler tensioner</strong>, each on a <strong>Bolt M5 25mm v2</strong>. Drawn: 2 bolts, 2 idlers.</li>\n<li>Fit the tensioner between the two pulleys. The idlers press on the <strong>outside (smooth back)</strong> of the belt, top run and bottom run. In the picture both runs bend inward toward the tensioner.</li>\n<li>Put the <strong>M3 nut</strong> in the slot at the bottom of the tensioner (red arrow).</li>\n<li>Put the <strong>M3x10 bolt</strong> in from below (red arrow). \"Will be used to tighten the idlers/belts.\" [3D]</li>\n<li>Turn the M3x10 bolt to pull the belt tight.</li>\n</ol>\n<p><strong>Check:</strong> belt tension. The belt should not skip when you hold the timing pulley and turn the outer ring hard. It should not be so tight that the gearbox drags.</p>\n<p>Tip: Unexpected Maker's idler bearings clamped and would not turn; they \"need washers\" and are \"meant to float\". [UM, X idlers] Spin each idler by finger after tightening.</p>", "html_pro": "<ol>\n<li>Loop <strong>BC belt 1</strong> (6 mm x 450 mm) around <strong>outer ring</strong> (big) and <strong>timing pulley</strong> (small).</li>\n<li>Put 2 <strong>GT2 idler W6</strong> on <strong>BCL idler tensioner</strong>, each on a <strong>Bolt M5 25mm v2</strong>. Drawn: 2 bolts, 2 idlers.</li>\n<li>Fit tensioner between the two pulleys. Idlers press on <strong>outside (smooth back)</strong> of belt, top and bottom run. Picture: both runs bend inward toward tensioner.</li>\n<li><strong>M3 nut</strong> in slot at bottom of tensioner (red arrow).</li>\n<li><strong>M3x10 bolt</strong> in from below (red arrow). \"Will be used to tighten the idlers/belts.\" [3D]</li>\n<li>Turn M3x10 bolt to tension belt.</li>\n</ol>\n<p><strong>Check:</strong> belt tension. No skipping when you hold timing pulley and turn outer ring hard. Not so tight that gearbox drags.</p>\n<p>Tip: Unexpected Maker's idler bearings clamped and would not turn; \"need washers\", \"meant to float\". [UM, X idlers] Spin each idler by finger after tightening.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Loop <strong>BC belt 1</strong> (HTD 5M, 9 mm x 450 mm) around the big <strong>outer ring</strong> and the small <strong>BC pulley</strong>.</li>\n<li>Put 2x <strong>GT2 idler W6</strong> on the <strong>BCL idler tensioner</strong>, on 2x <strong>Bolt M5 25mm v2</strong> (one each).</li>\n<li>Fit the tensioner between the pulleys. The idlers press on the smooth back of the belt, top and bottom.</li>\n<li>Put the <strong>M3 nut</strong> in the slot at the bottom of the tensioner.</li>\n<li>Put the <strong>M3x10 bolt</strong> in from below. Turn it to tighten the belt.</li>\n</ol>\n<p>Check: hold the pulley and turn the ring hard. The belt does not skip. Each idler spins by finger.</p>", "checks_simple": [], "ts": [2, 3, 32, 28, 30, 29]}, {"stage": 6, "kind": "step", "n": 138, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-138.webp", "html": "<ol>\n<li>Belt on, tensioner in place.</li>\n</ol>\n<p><strong>Check:</strong> the belt runs straight on both pulleys, with no rubbing on bolt heads. A bolt head rubbing the belt was a fault for Unexpected Maker; he reversed the bolt. [UM]</p>", "html_pro": "<ol>\n<li>Belt on, tensioner in place.</li>\n</ol>\n<p><strong>Check:</strong> belt runs straight on both pulleys, no rubbing on bolt heads. Bolt head rubbing belt was a fault for Unexpected Maker; he reversed the bolt. [UM]</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the belt runs straight and no bolt head rubs it.</p>", "checks_simple": [], "ts": [28, 30, 32, 26]}, {"stage": 6, "kind": "step", "n": 139, "title": "BCL encoder holder (optional)", "img": "Attachments/Arctos/web/manual/arctos-step-139.webp", "html": "<ol>\n<li>Fix the <strong>BCL encoder holder</strong> over the timing pulley with <strong>Bolt M3 10mm v2</strong>. Drawn: 2.</li>\n<li>This plate carries an optional AS5600 encoder (step 165). \"Holes for bigger encoders i.e. MT6701.\" [3D]</li>\n</ol>", "html_pro": "<ol>\n<li>Fix <strong>BCL encoder holder</strong> over timing pulley with <strong>Bolt M3 10mm v2</strong>. Drawn: 2.</li>\n<li>Plate carries optional AS5600 encoder (step 165). \"Holes for bigger encoders i.e. MT6701.\" [3D]</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Rigid diff mod: skip this step. The encoder holder (for extra encoders only) would hit the BC pulley, its cap and nut by about 2 mm.</p>", "checks_simple": [], "ts": [16, 32, 26]}, {"stage": 6, "kind": "step", "n": 140, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-140.webp", "html": "<ol>\n<li>The magnet holder shows through the encoder holder's centre hole.</li>\n</ol>", "html_pro": "<ol>\n<li>Magnet holder shows through encoder holder's centre hole.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Rigid diff mod: nothing here (no magnet holder, no encoder holder). The picture shows the stock parts.</p>", "checks_simple": [], "ts": [62, 54, 63]}, {"stage": 6, "kind": "step", "n": 141, "title": "B axis done", "img": "Attachments/Arctos/web/manual/arctos-step-141.webp", "html": "<ol>\n<li>Both side units are on the forearm.</li>\n</ol>\n<p><strong>Check:</strong> both belts are tensioned. Both timing pulleys turn when you turn each outer ring.</p>", "html_pro": "<ol>\n<li>Both side units on forearm.</li>\n</ol>\n<p><strong>Check:</strong> both belts tensioned. Both timing pulleys turn when each outer ring turns.</p>", "checks_pro": [], "html_simple": "<p>Check: both belts are tight. Each BC pulley turns when you turn its outer ring.</p>", "checks_simple": [], "ts": [28, 30, 32]}, {"stage": 6, "kind": "wire", "key": "w-servo", "title": "Gripper servo cable, before step 142", "img": null, "html": "<ol>\n<li>Push a <strong>servo extension</strong> (or a pull string) <strong>through the hollow C bevel gear</strong> before you fit it.</li>\n<li>Lead it into the B core, towards the Nano.</li>\n</ol>", "ov": ["sig"], "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": [], "html_pro": "<ol>\n<li>Push a <strong>servo extension</strong> (or pull string) <strong>through hollow C bevel gear</strong> before fitting.</li>\n<li>Lead into B core, towards the Nano.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>No screws here.</p>\n<ul>\n<li>Push a <strong>servo extension</strong> (or a pull string) through the hollow <strong>C bevel gear</strong> before you fit it. The rigid diff mod gear has a narrower hole (about 6.6 mm): test that the plug fits, else use a pull string.</li>\n<li>Lead it into the B core, towards the Nano.</li>\n</ul>", "checks_simple": [], "ts": [70, 71, 53, 80, 81, 18]}, {"stage": 6, "kind": "step", "n": 142, "title": "C bevel gear", "img": "Attachments/Arctos/web/manual/arctos-step-142.webp", "html": "<div class=\"callout danger\">\n<div class=\"callout-title\">🔌 WIRE NOW: gripper servo cable, before step 142</div>\n<p>The gripper servo wires go \"through this hole\" in the centre of the C flange (step 231). [Manual] The C bevel gear has a hollow shaft, and the B core cap has a centre hole. So the servo cable runs through the middle of the C gear into the B core.</p>\n<ol>\n<li>Before you fit the C bevel gear, push a servo extension cable (or a pull string) through the C bevel gear's centre hole.</li>\n<li>Lead it out of the B core toward where the Arduino Nano will sit (section 7).\n(unsure: the exact path out of the B core. The <strong>C cable holder</strong> with its clip (step 204) seems to guide this cable under the wrist.)</li>\n</ol>\n</div>\n<ol>\n<li>Press one <strong>Nut M3 v2</strong> into each of the 3 pockets on the C bevel gear. Drawn: 3. These take the bolts for the gripper flange later (step 216, M3x25).</li>\n<li>Put the <strong>C bevel gear</strong> into the front opening of the B core. Teeth point inward.</li>\n<li>Mesh it with <strong>both</strong> side bevel gears.</li>\n<li>Put <strong>Bearing 61803</strong> on its shaft. Drawn: 1.</li>\n</ol>\n<p><strong>Check:</strong> turn the C gear by hand. Both side bevel gears turn, in <strong>opposite</strong> directions. Nothing catches.</p>", "html_pro": "<div class=\"callout danger\">\n<div class=\"callout-title\">🔌 WIRE NOW: gripper servo cable, before step 142</div>\n<p>Gripper servo wires go \"through this hole\" in centre of C flange (step 231). [Manual] C bevel gear has hollow shaft; B core cap has centre hole. Servo cable runs through middle of C gear into B core.</p>\n<ol>\n<li>Before fitting C bevel gear, push servo extension cable (or pull string) through its centre hole.</li>\n<li>Lead out of B core toward where Arduino Nano will sit (section 7).\n(unsure: exact path out of B core. <strong>C cable holder</strong> with its clip (step 204) seems to guide this cable under the wrist.)</li>\n</ol>\n</div>\n<ol>\n<li>Press one <strong>Nut M3 v2</strong> into each of the 3 pockets on C bevel gear. Drawn: 3. They take the gripper flange bolts later (step 216, M3x25).</li>\n<li><strong>C bevel gear</strong> into front opening of B core. Teeth point inward.</li>\n<li>Mesh with <strong>both</strong> side bevel gears.</li>\n<li><strong>Bearing 61803</strong> on its shaft. Drawn: 1.</li>\n</ol>\n<p><strong>Check:</strong> turn C gear by hand. Both side bevel gears turn in <strong>opposite</strong> directions. Nothing catches.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>The <strong>C bevel gear</strong> of the rigid diff mod has no nut pockets: no nuts here.</li>\n<li>Put the C bevel gear into the front opening of the B core, teeth inward.</li>\n<li>Mesh it with <strong>both</strong> side bevel gears.</li>\n<li>Put 1x <strong>Bearing 61803</strong> on its shaft.</li>\n</ol>\n<p>Check: turn the C gear. The two side gears turn in <strong>opposite</strong> directions. Nothing catches.</p>", "checks_simple": [], "ts": [2, 3, 32, 26, 70, 71]}, {"stage": 6, "kind": "step", "n": 143, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-143.webp", "html": "<ol>\n<li>The C gear and bearing sit in the front of the B core.</li>\n</ol>", "html_pro": "<ol>\n<li>C gear and bearing sit in front of B core.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the C gear and its bearing sit in the front of the B core.</p>", "checks_simple": [], "ts": [2, 3, 32]}, {"stage": 6, "kind": "step", "n": 144, "title": "B core cap", "img": "Attachments/Arctos/web/manual/arctos-step-144.webp", "html": "<ol>\n<li>Put the <strong>B core cap</strong> over the C gear's bearing.</li>\n<li>Fix it with <strong>Bolt M3 10mm v2</strong>, one in each corner. Drawn: 4.</li>\n</ol>\n<p><strong>Check:</strong> the C output turns smoothly. The cap does not squeeze the bearing.</p>", "html_pro": "<ol>\n<li><strong>B core cap</strong> over C gear's bearing.</li>\n<li>Fix with <strong>Bolt M3 10mm v2</strong>, one per corner. Drawn: 4.</li>\n</ol>\n<p><strong>Check:</strong> C output turns smoothly. Cap does not squeeze bearing.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>B core cap</strong> over the C gear bearing.</li>\n<li>Fix it with 6x <strong>Bolt M3 10mm v2</strong>: one in each corner, and (rigid diff mod) 2 in the extra holes on the BL side, into B core 2.</li>\n</ol>\n<p>Check: the C output turns smoothly.</p>", "checks_simple": [], "ts": [2, 3, 32, 26]}, {"stage": 6, "kind": "step", "n": 145, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-145.webp", "html": "<ol>\n<li>The C output shaft, with 3 holes and a centre hole, shows through the cap.</li>\n</ol>\n<p><strong>Check:</strong> now do the <strong>hand test</strong> in section 3.</p>", "html_pro": "<ol>\n<li>C output shaft, with 3 holes and a centre hole, shows through cap.</li>\n</ol>\n<p><strong>Check:</strong> do the <strong>hand test</strong> in section 3.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the C output shaft shows through the cap.</p>\n<p>Check: turn both outer rings the same way, then opposite ways. Both moves are smooth.</p>", "checks_simple": [], "ts": [18, 28, 58]}, {"stage": 6, "kind": "step", "n": 158, "title": "Fix the KYD003 limit switch boards inside the wrist with 4 x M2…", "img": "Attachments/Arctos/web/manual/arctos-step-158.webp", "html": "<p>Fix the KYD003 limit switch boards inside the wrist with 4 x M2 screws (red arrows). Bend the pins so they fit. Parts: KYD003 limit switch. Hardware: 4 x M2 screws. Note: \"4 x M2 screws\" / \"Pins should be bent\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>The sensor connector on these boards is 2.0 mm pitch, not 2.54 mm.</p>\n</div>", "moved": "Paper manual step 158. In the paper manual this is in the Limit switches section near the end (steps 146–159). It is done here, right after this joint, while you can still reach the spot.", "html_pro": "<p>Fix KYD003 limit switch boards inside wrist with 4 x M2 screws (red arrows). Bend pins to fit. Parts: KYD003 limit switch. Hardware: 4 x M2 screws. Note: \"4 x M2 screws\" / \"Pins should be bent\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Sensor connector on these boards is 2.0 mm pitch, not 2.54 mm.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix the 2 <strong>KY-003 sensor</strong> boards inside the wrist (red arrows). The paper calls them KYD003.</li>\n<li>Use 4x <strong>M2 screw</strong> in total.</li>\n<li>Bend the pins so they fit.</li>\n</ol>\n<div class=\"callout note\">\n<div class=\"callout-title\">Connector size</div>\n<p>The sensor connector on these boards is 2.0 mm pitch, not 2.54 mm.</p>\n</div>", "checks_simple": [], "ts": [7, 11, 58, 59, 61, 64]}, {"stage": 6, "kind": "step", "n": 159, "title": "Result: the two limit switch boards are fixed inside the wrist,…", "img": "Attachments/Arctos/web/manual/arctos-step-159.webp", "html": "<p>Result: the two limit switch boards are fixed inside the wrist, with their wires connected and bent pins out of the way. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: two limit switch boards fixed inside wrist, wires connected, bent pins clear. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: both boards are fixed, wires on, bent pins clear.</p>", "checks_simple": [], "ts": [7, 11, 58, 59, 61, 64]}, {"stage": 6, "kind": "wire", "key": "b-sensors", "title": "Wire the B limit sensors", "img": null, "html": "<ol>\n<li>The 2 boards sit inside the wrist with <strong>4x M2 screws</strong> (step 158). \"Pins should be bent\" to fit.</li>\n<li>Wire them to B's <strong>En / Dir</strong> (after the remap). <strong>Top = home.</strong></li>\n<li>Hold a magnet near each board. Its LED lights.</li>\n</ol>", "ov": ["li-B"], "bench": ["lim", "sensor", "com"], "drv": "42D", "grip": null, "conn": [["from the Top sensor **S**", "**En**", "blu", "home, on the \"B lim\" lead", "En", "Top S", "", null, "Blue"], ["from the Top sensor **+**", "**+5V**", "red", "5 V from the driver", "+5V", "Top +", "", null, "Red"], ["from the Top sensor **−**", "**GND**", "blk", "", "GND", "Top −", "", null, "Black"], ["from the Bottom sensor **S**", "**Dir**", "blu", "on the \"B lim\" lead", "Dir", "Bottom S", "", null, "Blue"], ["from the Bottom sensor **+**", "Top sensor **+**", "red", "both boards share the 5 V", null, null, "", null, "Red"], ["from the Bottom sensor **−**", "Top sensor **−**", "blk", "", null, null, "", null, "Black"]], "conn_title": null, "sen": "ky", "sen_names": ["Top", "Bottom"], "wire": ["sensor"], "checks": [], "html_pro": "<ol>\n<li>2 boards inside wrist with <strong>4x M2 screws</strong> (step 158). \"Pins should be bent\" to fit.</li>\n<li>Wire to B's <strong>En / Dir</strong> (after the remap). <strong>Top = home.</strong></li>\n<li>Magnet near each board: LED lights.</li>\n</ol>", "checks_pro": [], "html_simple": "<p><strong>On the B 42D:</strong> the \"B lim\" lead (+5V, GND, En, Dir). Two <strong>KY-003</strong> boards: Top and Bottom. <strong>Top = home.</strong></p>\n<ul>\n<li>The 2 boards are fixed in step 158.</li>\n</ul>\n<ol>\n<li><strong>Blue</strong> from the Top sensor <strong>S</strong> → <strong>En</strong> (home, on the \"B lim\" lead)</li>\n<li><strong>Red</strong> from the Top sensor <strong>+</strong> → <strong>+5V</strong> (5 V from the driver)</li>\n<li><strong>Black</strong> from the Top sensor <strong>−</strong> → <strong>GND</strong></li>\n<li><strong>Blue</strong> from the Bottom sensor <strong>S</strong> → <strong>Dir</strong> (on the \"B lim\" lead)</li>\n<li><strong>Red</strong> from the Bottom sensor <strong>+</strong> → Top sensor <strong>+</strong> (both boards share the 5 V)</li>\n<li><strong>Black</strong> from the Bottom sensor <strong>−</strong> → Top sensor <strong>−</strong></li>\n</ol>\n<ul>\n<li>Hold a magnet near each board. Its LED lights.</li>\n</ul>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Sensor power = 5 V from the driver</div>\n<p>Never connect a sensor to the 24 V wires. That burns it out.</p>\n</div>", "checks_simple": [], "ts": [7, 11, 62, 54, 85, 63]}, {"stage": 6, "kind": "step", "n": 204, "title": "C cable holder", "img": "Attachments/Arctos/web/manual/arctos-step-204.webp", "html": "<ol>\n<li>Find the <strong>C cable holder</strong>. It is a flat base with a post and a round clip on top.</li>\n<li>Bring it to the underside of the wrist.</li>\n</ol>", "moved": "Paper manual step 204. In the paper manual this comes after the covers (steps 204–209). It is the C limit switch, so it is done here with the wrist, while you can still reach it.", "html_pro": "<ol>\n<li><strong>C cable holder</strong>: flat base, post, round clip on top.</li>\n<li>Bring to underside of wrist.</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>C cable holder</strong>.</li>\n<li>Bring it to the underside of the wrist.</li>\n</ol>", "checks_simple": [], "ts": [70, 71, 18]}, {"stage": 6, "kind": "step", "n": 205, "title": "Magnet", "img": "Attachments/Arctos/web/manual/arctos-step-205.webp", "html": "<ol>\n<li>Press one 3x3 magnet into the hole the red arrow shows. \"Place a magnet here.\" [Manual]</li>\n</ol>\n<p>(unsure: what reads this magnet. The sensor goes on this same holder in step 206. It may hold the C panel, or it may be for the dual-sensor version. Fit it as shown.)</p>", "html_pro": "<ol>\n<li>Press one 3x3 magnet into hole at red arrow. \"Place a magnet here.\" [Manual]</li>\n</ol>\n<p>(unsure: what reads this magnet. Sensor goes on same holder in step 206. May hold the C panel, or may be for dual-sensor version. Fit as shown.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Press 1x <strong>magnet</strong> into the hole the red arrow shows.</li>\n</ol>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 6, "kind": "step", "n": 206, "title": "Sensor board", "img": "Attachments/Arctos/web/manual/arctos-step-206.webp", "html": "<ol>\n<li>Put the <strong>KYD003 magnetic endstop</strong> onto the flat top of the holder. Its sensor bulb faces the end, toward the C flange.</li>\n<li>(See the conflict in 2.4: the 3D viewer says C uses a <strong>WSH231</strong>.)</li>\n</ol>", "html_pro": "<ol>\n<li><strong>KYD003 magnetic endstop</strong> onto flat top of holder. Sensor bulb faces the end, toward C flange.</li>\n<li>(See conflict in 2.4: 3D viewer says C uses a <strong>WSH231</strong>.)</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>KYD003 magnetic endstop</strong> on the flat top of the <strong>C cable holder</strong>.</li>\n<li>Its pins point toward the post. The sensor bulb points away from it.</li>\n</ol>\n<div class=\"callout note\">\n<div class=\"callout-title\">Which sensor</div>\n<p>The picture says KYD003. C uses a <strong>WSH231</strong>. See the C sensor card after step 209.</p>\n</div>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 6, "kind": "step", "n": 207, "title": "M2 screws", "img": "Attachments/Arctos/web/manual/arctos-step-207.webp", "html": "<ol>\n<li>Fix the board with <strong>2 M2 screws</strong> (red arrows). \"There goes two M2 screws.\" [Manual]</li>\n</ol>\n<p><strong>Check:</strong> the board does not rock. Its pins are clear of the holder.</p>", "html_pro": "<ol>\n<li>Fix board with <strong>2 M2 screws</strong> (red arrows). \"There goes two M2 screws.\" [Manual]</li>\n</ol>\n<p><strong>Check:</strong> board does not rock. Pins clear of holder.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix the board with 2x <strong>M2 screw</strong> (red arrows).</li>\n</ol>\n<p>Check: the board does not rock.</p>", "checks_simple": [], "ts": [7, 11, 26]}, {"stage": 6, "kind": "step", "n": 208, "title": "Bolt the holder under the wrist", "img": "Attachments/Arctos/web/manual/arctos-step-208.webp", "html": "<ol>\n<li>Fix the holder's flat base under the B core with <strong>Bolt M3 10mm v2</strong>. Drawn: 2.</li>\n<li>The old caption said the holder is not drawn here. It is: it is the flat plate with 4 holes under the B core.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">🔌 WIRE NOW: before step 208</div>\n<p>Connect the C sensor lead now. Run it to the <strong>C driver</strong> (ID 6) IN_1. If the lower cover is already on, run it in through the gap you planned in section 7.3. On the closed-loop diagram, C uses one WSH231 board: \"The North Pole corresponds to the Home limit.\" [Docs]</p>\n</div>", "html_pro": "<ol>\n<li>Fix holder's flat base under B core with <strong>Bolt M3 10mm v2</strong>. Drawn: 2.</li>\n<li>Old caption said holder not drawn here. It is: flat plate with 4 holes under B core.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">🔌 WIRE NOW: before step 208</div>\n<p>Connect C sensor lead now. Run to <strong>C driver</strong> (ID 6) IN_1. If lower cover already on, route through gap planned in section 7.3. Closed-loop diagram: C uses one WSH231 board: \"The North Pole corresponds to the Home limit.\" [Docs]</p>\n</div>", "checks_pro": [], "html_simple": "<div class=\"callout warning\">\n<div class=\"callout-title\">Wire now</div>\n<p>Connect the C sensor to the C driver (CAN ID 6) before this step. The pins are on the card \"Wire the C limit sensor\" after step 209.</p>\n</div>\n<ol>\n<li>Fix the holder's flat base under the B core with 2x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>", "checks_simple": [], "ts": [87, 91, 58, 59, 61, 64]}, {"stage": 6, "kind": "step", "n": 209, "title": "Result", "img": "Attachments/Arctos/web/manual/arctos-step-209.webp", "html": "<ol>\n<li>The 2 bolt heads show under the wrist.</li>\n</ol>\n<p><strong>Check:</strong> after the gripper flange is on (steps 212–216), turn C by hand. The sensor LED lights when the flange magnet passes. Test homing <strong>with the belt off</strong> first. [Docs: endstop testing] \"Don't use sensorless or crash homing.\" [UM]</p>", "html_pro": "<ol>\n<li>2 bolt heads show under wrist.</li>\n</ol>\n<p><strong>Check:</strong> after gripper flange is on (steps 212–216), turn C by hand. Sensor LED lights when flange magnet passes. Test homing <strong>with belt off</strong> first. [Docs: endstop testing] \"Don't use sensorless or crash homing.\" [UM]</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: 2 bolt heads show under the wrist.</p>\n<p>Check: after the gripper flange is on (steps 212-216), turn C by hand. The sensor LED lights when the flange magnet passes. Test homing with the belt off first.</p>", "checks_simple": [], "ts": [28, 30, 62, 63, 58, 59]}, {"stage": 6, "kind": "wire", "key": "c-sensor", "title": "Wire the C limit sensor", "img": null, "html": "<ol>\n<li>The C sensor (steps 204–209) reads a magnet on the gripper's C flange.</li>\n<li>It is <strong>1 WSH231</strong>: <strong>N_OUT → En</strong> (home), <strong>S_OUT → DIR</strong>, 3-26V → 5V, GND → GND (official diagram).</li>\n</ol>", "ov": ["li-C"], "bench": ["lim", "sensor", "com"], "drv": "42D", "grip": null, "conn": [["from the sensor **3-26V**", "**+5V**", "red", "5 V from the driver, on the \"C lim\" lead", "+5V", "3-26V", "", null, "Red"], ["from the sensor **GND**", "**GND**", "blk", "on the \"C lim\" lead", "GND", "GND", "", null, "Black"], ["from the sensor **N_OUT**", "**En**", "blu", "home, north face", "En", "N_OUT home", "", null, "Blue"], ["from the sensor **S_OUT**", "**Dir**", "blu", "", "Dir", "S_OUT", "", null, "Blue"]], "conn_title": null, "sen": "wsh", "sen_names": null, "wire": ["sensor"], "checks": [], "html_pro": "<ol>\n<li>C sensor (steps 204–209) reads magnet on gripper's C flange.</li>\n<li>Wire to C driver's limit input.</li>\n</ol>", "checks_pro": [], "html_simple": "<p><strong>On the C 42D:</strong> the \"C lim\" lead (+5V, GND, En, Dir). C has 1 <strong>WSH231</strong> board.</p>\n<ul>\n<li>The picture at step 206 says KYD003. Wire it as the official diagram: a WSH231.</li>\n</ul>\n<ol>\n<li><strong>Red</strong> from the sensor <strong>3-26V</strong> → <strong>+5V</strong> (5 V from the driver, on the \"C lim\" lead)</li>\n<li><strong>Black</strong> from the sensor <strong>GND</strong> → <strong>GND</strong> (on the \"C lim\" lead)</li>\n<li><strong>Blue</strong> from the sensor <strong>N_OUT</strong> → <strong>En</strong> (home, north face)</li>\n<li><strong>Blue</strong> from the sensor <strong>S_OUT</strong> → <strong>Dir</strong></li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Sensor power = 5 V from the driver</div>\n<p>Never connect a sensor to the 24 V wires. That burns it out.</p>\n</div>", "checks_simple": [], "ts": [62, 54, 85, 63, 87, 91]}, {"stage": 6, "kind": "test", "key": "w-test", "title": "Test the differential", "img": null, "html": "<p>First by hand, with the belts off or the power off.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["Turn both inputs the same way: the wrist moves one way.", "Turn them opposite ways: it does the other motion.", "No tight spot anywhere in either motion.", "Powered: home B and C together, slowly."], "html_pro": "<p>First by hand, belts off or power off.</p>", "checks_pro": ["Both inputs same way: wrist moves one way.", "Opposite ways: other motion.", "No tight spot in either motion.", "Powered: home B and C together, slowly."], "html_simple": "<p>Test by hand first, with the belts off or the power off.</p>", "checks_simple": ["Same way: one motion. Opposite ways: the other motion.", "No tight spot in either motion.", "Powered: home B and C together, slowly."], "ts": [28, 30, 67, 66, 68, 18]}, {"stage": 7, "kind": "wire", "key": "h-stepdown", "title": "Step-down converter for the gripper servo", "img": null, "html": "<ol>\n<li>On the table: step-down input to the supply's + and −.</li>\n<li>Switch on. <strong>Turn its screw until the output reads 6.0 V</strong> on a meter.</li>\n<li>Do this <strong>before</strong> anything is connected to the output.</li>\n<li>It goes in the wrist later. Its input then comes from the <strong>C driver's V+ and Gnd</strong> (the end of the chain).</li>\n</ol>", "ov": ["sd"], "bench": null, "drv": "57D", "grip": null, "conn": [["from the bench supply **+V**", "step-down **IN+**", "red", "table only", null, null, "tmp", null, "Red"], ["from the bench supply **−V**", "step-down **IN−**", "blk", "table only", null, null, "tmp", null, "Black"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["power"], "checks": [], "html_pro": "<ol>\n<li>On the table: step-down input to supply + and −.</li>\n<li>Switch on. <strong>Trim screw until output reads 6.0 V</strong> on meter.</li>\n<li>Do this <strong>before</strong> anything connects to output.</li>\n<li>Later goes in the wrist: input from <strong>C driver V+ / Gnd</strong> (end of power chain).</li>\n</ol>", "checks_pro": [], "html_simple": "<p><strong>Step-down:</strong> IN+ / IN− at one end, OUT+ / OUT− at the other.</p>\n<ol>\n<li><strong>Red</strong> from the bench supply <strong>+V</strong> → step-down <strong>IN+</strong> (table only)</li>\n<li><strong>Black</strong> from the bench supply <strong>−V</strong> → step-down <strong>IN−</strong> (table only)</li>\n</ol>\n<ul>\n<li>Switch on. Turn its screw until <strong>OUT</strong> reads <strong>6.0 V</strong> on the meter.</li>\n<li>Connect nothing to OUT yet.</li>\n<li>Later it goes in the wrist. Its input then comes from the <strong>C driver</strong> V+ / Gnd.</li>\n</ul>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Set 6.0 V first</div>\n<p>Set the output before the servo or the Nano is connected.</p>\n</div>", "checks_simple": [], "ts": [26, 0, 80, 81, 82, 67]}, {"stage": 7, "kind": "wire", "key": "g-bench", "title": "Bench-test the gripper electronics first", "img": "Attachments/Arctos/web/arctos-gripper_closed_loop_wiring.webp", "html": "<ol>\n<li>Flash the Nano with the official <strong><code>gripper_CL</code></strong> sketch. It needs the mcp_can, SPI and Servo libraries.</li>\n<li>Wire the Nano and the MCP2515 on the table (table below).</li>\n<li><strong>Set the step-down to 6.0 V</strong>, then connect the servo.</li>\n<li>Put the <strong>J1 jumper</strong> on the MCP2515. The gripper is the far end of the CAN bus.</li>\n<li>Send <code>07 63</code> (open) and <code>07 00</code> (close). The servo should move.</li>\n</ol>\n<div class=\"callout note\">\n<div class=\"callout-title\">Not on the official diagram (advice)</div>\n<p>Connect the Nano's GND to the step-down's GND, so the servo signal shares a ground. Never put 24 V into the Nano's VIN.</p>\n</div>", "ov": null, "bench": null, "drv": "57D", "grip": ["can", "j1", "spi", "sig", "sv6", "sdin", "gnd"], "conn": [["jumper from MCP2515 **INT**", "Nano **D2**", "cyn", "", null, null, "", null, "Light blue"], ["jumper from MCP2515 **SCK**", "Nano **D13**", "pnk", "", null, null, "", null, "Pink"], ["jumper from MCP2515 **SI**", "Nano **D11**", "org", "", null, null, "", null, "Orange"], ["jumper from MCP2515 **SO**", "Nano **D12**", "blu", "", null, null, "", null, "Blue"], ["jumper from MCP2515 **CS**", "Nano **D10**", "grn", "", null, null, "", null, "Green"], ["jumper from MCP2515 **GND**", "Nano **GND**", "blk", "", null, null, "", null, "Black"], ["jumper from MCP2515 **VCC**", "Nano **5V**", "red", "", null, null, "", null, "Red"], ["6 V from step-down **OUT+**", "Nano **VIN**", "red", "never 24 V on VIN", null, null, "", null, "Red"], ["from Nano **GND**", "step-down **OUT−**", "blk", "common GND", null, null, "", null, "Black"], ["servo wire (signal)", "Nano **D9**", "org", "table test", null, null, "tmp", null, "Orange"], ["servo wire (+)", "step-down **OUT+**", "red", "table test", null, null, "tmp", null, "Red"], ["servo wire (−)", "step-down **OUT−**", "brn", "table test", null, null, "tmp", null, "Brown"], ["", "**J1** pins on the MCP2515", "wht", "end 2 of the CAN bus", null, null, "", null, "Jumper cap"], ["CAN H from the C driver (\"C CAN out\")", "MCP2515 **H**", "yel", "", null, null, "", null, "Yellow"], ["CAN L from the C driver (\"C CAN out\")", "MCP2515 **L**", "grn", "", null, null, "", null, "Green"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["jumper"], "checks": [], "html_pro": "<ol>\n<li>Flash Nano with official <strong><code>gripper_CL</code></strong> sketch. Needs mcp_can, SPI, Servo libraries.</li>\n<li>Wire Nano and MCP2515 on the table (table below).</li>\n<li><strong>Set step-down to 6.0 V</strong>, then connect servo.</li>\n<li><strong>J1 jumper</strong> on MCP2515. Gripper is far end of CAN bus.</li>\n<li>Send <code>07 63</code> (open), <code>07 00</code> (close). Servo should move.</li>\n</ol>\n<div class=\"callout note\">\n<div class=\"callout-title\">Not on the official diagram (advice)</div>\n<p>Tie Nano GND to step-down GND so servo signal shares ground. Never put 24 V into Nano VIN.</p>\n</div>", "checks_pro": [], "html_simple": "<ul>\n<li>Flash the <strong>Nano</strong> with the <code>gripper_CL</code> sketch (mcp_can, SPI and Servo libraries).</li>\n<li>Unplug the Nano's USB before it runs from the step-down.</li>\n</ul>\n<p><strong>MCP2515 → Nano</strong> (jumper wires):</p>\n<ol>\n<li><strong>Light blue</strong> jumper from MCP2515 <strong>INT</strong> → Nano <strong>D2</strong></li>\n<li><strong>Pink</strong> jumper from MCP2515 <strong>SCK</strong> → Nano <strong>D13</strong></li>\n<li><strong>Orange</strong> jumper from MCP2515 <strong>SI</strong> → Nano <strong>D11</strong></li>\n<li><strong>Blue</strong> jumper from MCP2515 <strong>SO</strong> → Nano <strong>D12</strong></li>\n<li><strong>Green</strong> jumper from MCP2515 <strong>CS</strong> → Nano <strong>D10</strong></li>\n<li><strong>Black</strong> jumper from MCP2515 <strong>GND</strong> → Nano <strong>GND</strong></li>\n<li><strong>Red</strong> jumper from MCP2515 <strong>VCC</strong> → Nano <strong>5V</strong></li>\n</ol>\n<p><strong>Power the Nano</strong> (the step-down is still on the table supply and reads 6.0 V):</p>\n<ol start=\"8\">\n<li><strong>Red</strong> 6 V from step-down <strong>OUT+</strong> → Nano <strong>VIN</strong> (never 24 V on VIN)</li>\n<li><strong>Black</strong> from Nano <strong>GND</strong> → step-down <strong>OUT−</strong> (common GND)</li>\n</ol>\n<p><strong>Servo</strong> (check 6.0 V first):</p>\n<ol start=\"10\">\n<li><strong>Orange</strong> servo wire (signal) → Nano <strong>D9</strong> (table test)</li>\n<li><strong>Red</strong> servo wire (+) → step-down <strong>OUT+</strong> (table test)</li>\n<li><strong>Brown</strong> servo wire (−) → step-down <strong>OUT−</strong> (table test)</li>\n</ol>\n<p><strong>CAN</strong> (the gripper is the far end of the bus):</p>\n<ol start=\"13\">\n<li><strong>Jumper cap</strong> → <strong>J1</strong> pins on the MCP2515 (end 2 of the CAN bus)</li>\n<li><strong>Yellow</strong> CAN H from the C driver (\"C CAN out\") → MCP2515 <strong>H</strong></li>\n<li><strong>Green</strong> CAN L from the C driver (\"C CAN out\") → MCP2515 <strong>L</strong></li>\n</ol>\n<ul>\n<li>Send <code>07 63</code> (open) and <code>07 00</code> (close). The servo moves.</li>\n</ul>\n<div class=\"callout danger\">\n<div class=\"callout-title\">No 24 V on the Nano</div>\n<p>Only the 6 V step-down output goes to VIN.</p>\n</div>", "checks_simple": [], "ts": [70, 71, 53, 80, 81, 82]}, {"stage": 7, "kind": "step", "n": 210, "title": "Put a Bearing 61810 over the round C output at the front of the wrist", "img": "Attachments/Arctos/web/manual/arctos-step-210.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>A <strong>61810</strong> bearing over the C output. A <strong>magnet</strong> goes in the small tab on the flange, for the C limit sensor. The flange bolts on with <strong>3x M3x25</strong>.</p>\n</div>\n<p>Put a Bearing 61810 over the round C output at the front of the wrist. Parts: none labelled. Hardware: Bearing 61810.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p><strong>Before the gripper:</strong> flash the Arduino Nano and set the step-down converter to <strong>6 V</strong>. See <a class=\"wl\" href=\"#/wiring/gripper-closed-loop\">Wiring › Gripper (closed loop)</a>. Many builders fit the gripper last, after everything else works.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p><strong>61810</strong> bearing over C output. <strong>Magnet</strong> in small tab on flange, for C limit sensor. Flange bolts on with <strong>3x M3x25</strong>.</p>\n</div>\n<p>Put Bearing 61810 over round C output at front of wrist. Parts: none labelled. Hardware: Bearing 61810.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p><strong>Before the gripper:</strong> flash Arduino Nano, set step-down converter to <strong>6 V</strong>. See <a class=\"wl\" href=\"#/wiring/gripper-closed-loop\">Wiring › Gripper (closed loop)</a>. Many builders fit gripper last, after everything else works.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>Bearing 61810</strong> (1x) over the round C output at the front of the wrist.</li>\n</ol>", "checks_simple": [], "ts": [2, 3, 80, 81, 82]}, {"sta eth mesh with both racks.</li>\n</ol>", "checks_simple": [], "ts": [80, 81, 82]}, {"stage": 7, "kind": "step", "n": 225, "title": "Fix the gripper gear in the center with Bolt M3 10mm (drawn: 1)", "img": "Attachments/Arctos/web/manual/arctos-step-225.webp", "html": "<p>Fix the gripper gear in the center with Bolt M3 10mm (drawn: 1). Parts: none labelled. Hardware: Bolt M3 10mm v2.</p>", "html_pro": "<p>Fix gripper gear in center with Bolt M3 10mm (drawn: 1). Parts: none labelled. Hardware: Bolt M3 10mm v2.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix the <strong>gripper gear</strong> in its centre with 1x <strong>M3x10 bolt</strong>.</li>\n</ol>", "checks_simple": [], "ts": [26, 0, 80, 81, 82]}, {"stage": 7, "kind": "step", "n": 226, "title": "Result: the gear is bolted on and meshes with both jaw racks", "img": "Attachments/Arctos/web/manual/arctos-step-226.webp", "html": "<p>Result: the gear is bolted on and meshes with both jaw racks. When it turns, the jaws open and close. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: gear bolted on, meshes with both jaw racks. Turning it opens and closes jaws. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check the gear meshes with both racks. Turn it by hand: the jaws open and close.</p>", "checks_simple": [], "ts": [26, 0, 80, 81, 82]}, {"stage": 7, "kind": "step", "n": 227, "title": "Push the Stainless steel rod 4x70 mm guide rods up through the…", "img": "Attachments/Arctos/web/manual/arctos-step-227.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p><strong>2x 4x70 mm</strong> steel rods, then the rods cap. (The 3D manual says 4x65 mm; the BOM and picture manual say 70 mm.)</p>\n</div>\n<p>Push the Stainless steel rod 4x70 mm guide rods up through the carrier and the jaws (drawn: 2). The jaws slide on these rods. Parts: none labelled. Hardware: Stainless steel rod 4x70 mm.</p>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p><strong>2x 4x70 mm</strong> steel rods, then rods cap. (3D manual says 4x65 mm; BOM and picture manual say 70 mm.)</p>\n</div>\n<p>Push Stainless steel rod 4x70 mm guide rods up through carrier and jaws (drawn: 2). Jaws slide on rods. Parts: none labelled. Hardware: Stainless steel rod 4x70 mm.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Push 2x <strong>Stainless steel rod 4x70 mm</strong> up through the carrier and the jaws.</li>\n<li>Check the jaws slide on the rods.</li>\n</ol>", "checks_simple": [], "ts": [5, 9, 80, 81, 82]}, {"stage": 7, "kind": "step", "n": 228, "title": "Result: both steel rods are in and the jaws can slide on them", "img": "Attachments/Arctos/web/manual/arctos-step-228.webp", "html": "<p>Result: both steel rods are in and the jaws can slide on them. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: both steel rods in, jaws slide on them. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: both rods are in, the jaws slide on them.</p>", "checks_simple": [], "ts": [5, 9, 80, 81, 82, 34]}, {"stage": 7, "kind": "step", "n": 229, "title": "Put the Gripper rods cap on the bottom of the gripper carrier to…", "img": "Attachments/Arctos/web/manual/arctos-step-229.webp", "html": "<p>Put the Gripper rods cap on the bottom of the gripper carrier to hold the ends of the steel rods. Parts: Gripper rods cap. Hardware: none labelled.</p>", "html_pro": "<p>Gripper rods cap on bottom of gripper carrier, holds rod ends. Parts: Gripper rods cap. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>Gripper rods cap</strong> on the bottom of the carrier, over the rod ends.</li>\n</ol>", "checks_simple": [], "ts": [5, 9, 80, 81, 82]}, {"stage": 7, "kind": "step", "n": 230, "title": "Result: the rods cap is on the bottom of the carrier", "img": "Attachments/Arctos/web/manual/arctos-step-230.webp", "html": "<p>Result: the rods cap is on the bottom of the carrier. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: rods cap on bottom of carrier. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the rods cap is on the bottom of the carrier.</p>", "checks_simple": [], "ts": [5, 9, 80]}, {"stage": 7, "kind": "info", "key": "g-servo", "title": "Before step 231: servo to the middle", "img": null, "html": "<ol>\n<li><strong>Feed the servo wires through the centre hole of the C flange first</strong> (step 231), then seat the servo.</li>\n<li>The sketch starts the servo at <strong>90°</strong>. Power it once so it goes to 90°.</li>\n<li>Fit the servo arm (step 234 on) with the jaws <strong>half open</strong>. Then neither end of the travel crashes the jaws. (advice, not official)</li>\n</ol>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": [], "html_pro": "<ol>\n<li><strong>Feed servo wires through centre hole of C flange first</strong> (step 231), then seat servo.</li>\n<li>Sketch starts servo at <strong>90°</strong>. Power it once so it goes to 90°.</li>\n<li>Fit servo arm (step 234 on) with jaws <strong>half open</strong>; neither end of travel crashes jaws. (advice, not official)</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li>Power the <strong>servo</strong> once with the sketch. It goes to <strong>90°</strong>.</li>\n<li>Feed the servo wires through the centre hole of the C flange first (step 231).</li>\n<li>Fit the servo arm (step 234 on) with the jaws <strong>half open</strong>.</li>\n</ol>", "checks_simple": [], "ts": [70, 71, 53, 80, 81, 82]}, {"stage": 7, "kind": "step", "n": 231, "title": "Push the DS 3225 Servo motor wires through the hole in the center…", "img": "Attachments/Arctos/web/manual/arctos-step-231.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p><strong>feed the servo wires through the centre hole of the C flange first</strong>, then seat the servo.</p>\n</div>\n<p>Push the DS 3225 Servo motor wires through the hole in the center of the C flange (red arrow), then put the servo into the gripper carrier. Parts: none labelled. Hardware: DS 3225 Servo motor. Note: \"Servo wires goes through this hole\"</p>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p><strong>Servo wires through C flange centre hole first</strong>, then seat the servo.</p>\n</div>\n<p>Route DS 3225 Servo motor wires through the C flange centre hole (red arrow); seat servo in gripper carrier. Parts: none labelled. Hardware: DS 3225 Servo motor. Note: \"Servo wires goes through this hole\"</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Unplug the servo from the Nano and the step-down on the table.</li>\n<li>Push the <strong>DS3225 servo</strong> wires through the centre hole of the C flange (red arrow). Plug them onto the servo extension.</li>\n<li>Put the servo into the carrier, shaft facing out and near the top.</li>\n</ol>", "checks_simple": [], "ts": [72, 33, 80, 81, 82]}, {"stage": 7, "kind": "step", "n": 232, "title": "Fix the servo in the carrier with Bolt M3 10mm (drawn: 4, two at…", "img": "Attachments/Arctos/web/manual/arctos-step-232.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The servo, <strong>4x M3x10</strong>.</p>\n</div>\n<p>Fix the servo in the carrier with Bolt M3 10mm (drawn: 4, two at the top and two at the bottom). Parts: none labelled. Hardware: Bolt M3 10mm v2.</p>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>Servo: <strong>4x M3x10</strong>.</p>\n</div>\n<p>Fix servo in carrier, Bolt M3 10mm (drawn: 4; 2 top, s": [80, 81, 82]}, {"stage": 7, "kind": "wire", "key": "g-wire", "title": "Wire the gripper into the arm", "img": null, "html": "<ol>\n<li>The servo cable runs back through the C flange into the wrist, to the Nano's <strong>D9</strong> and the 6 V supply.</li>\n<li>The MCP2515 sits on the <strong>BC motors upper cover</strong>, with <strong>M2.5 screws</strong>. The Nano goes under the wrist, inside the <strong>BC motors lower cover</strong>.</li>\n<li>MCP2515 CAN H / L to the C driver's CAN out. <strong>J1 jumper on.</strong></li>\n<li>Connect the Nano's GND to the step-down's GND.</li>\n</ol>", "ov": ["mcp", "nano", "servo", "cc-G", "j1", "spi", "sv6", "gnd"], "bench": null, "drv": "57D", "grip": ["sdin", "sig", "sv6"], "conn": [["+V tail from the C driver (\"C SD\")", "step-down **IN+**", "red", "end of the 24 V chain", null, null, "", null, "Red"], ["GND tail from the C driver (\"C SD\")", "step-down **IN−**", "blk", "", null, null, "", null, "Black"], ["servo wire (signal)", "Nano **D9**", "org", "", null, null, "", null, "Orange"], ["servo wire (+)", "step-down **OUT+**", "red", "6 V", null, null, "", null, "Red"], ["servo wire (−)", "step-down **OUT−**", "brn", "common GND", null, null, "", null, "Brown"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["power", "can", "jumper"], "checks": [], "html_pro": "<ol>\n<li>Servo cable back through C flange into wrist, to Nano <strong>D9</strong> and the 6 V supply.</li>\n<li>Nano and MCP2515 on <strong>BC-motors-upper-cover</strong>, <strong>M2.5 screws</strong>.</li>\n<li>MCP2515 CAN H / L to C driver CAN out. <strong>J1 jumper on.</strong></li>\n<li>Nano GND to step-down GND.</li>\n</ol>", "checks_pro": [], "html_simple": "<ul>\n<li>Unplug the table supply from the step-down. Put the supply away.</li>\n<li>Stand the <strong>step-down</strong> on its long edge in the hollow on the left side of the wrist (under the left wrist cover), terminals facing in. Fix it with double-sided tape.</li>\n<li>Fix the <strong>MCP2515</strong> on the <strong>BC motors upper cover</strong> with <strong>M2.5 screws</strong>.</li>\n<li>The <strong>Nano</strong> goes under the wrist, where the <strong>BC motors lower cover</strong> closes over it (step 192).</li>\n</ul>\n<ol>\n<li><strong>Red</strong> +V tail from the C driver (\"C SD\") → step-down <strong>IN+</strong> (end of the 24 V chain)</li>\n<li><strong>Black</strong> GND tail from the C driver (\"C SD\") → step-down <strong>IN−</strong></li>\n</ol>\n<ul>\n<li>Run the servo cable back through the C flange into the wrist.</li>\n</ul>\n<ol start=\"3\">\n<li><strong>Orange</strong> servo wire (signal) → Nano <strong>D9</strong></li>\n<li><strong>Red</strong> servo wire (+) → step-down <strong>OUT+</strong> (6 V)</li>\n<li><strong>Brown</strong> servo wire (−) → step-down <strong>OUT−</strong> (common GND)</li>\n</ol>\n<ul>\n<li>Still in from the table test: the MCP2515 → Nano jumpers, 6 V → Nano <strong>VIN</strong>, Nano <strong>GND</strong> → OUT−, CAN H / L and the <strong>J1</strong> jumper. Tug each one.</li>\n</ul>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Polarity</div>\n<p>Red = +, black = −. Check the step-down input before you switch on.</p>\n</div>", "checks_simple": [], "ts": [26, 0, 70, 71, 53, 80]}, {"stage": 7, "kind": "test", "key": "g-test", "title": "Test the gripper", "img": null, "html": "", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["<code>07 63</code> opens and <code>07 00</code> closes, with the gripper on the arm.", "The jaws move freely on the rods and don't hit at either end."], "html_pro": "", "checks_pro": ["<code>07 63</code> opens, <code>07 00</code> closes, gripper on arm.", "Jaws move freely on rods; no hit at either end."], "html_simple": "", "checks_simple": ["<code>07 63</code> opens and <code>07 00</code> closes the jaws.", "The jaws move freely and do not hit at either end."], "ts": [80, 81, 82, 34]}, {"stage": 8, "kind": "step", "n": 167, "title": "Section title page for the cover panels", "img": "Attachments/Arctos/web/manual/arctos-step-167.webp", "html": "<p>Section title page for the cover panels. No assembly in this step. Note: \"COVER PANELS\"</p>", "moved": "Paper manual step 167. In the paper manual the covers (steps 167–203) come before the gripper. Here they come after it, so the gripper wiring is in and tested before the last panels close.", "html_pro": "<p>Section title: cover panels. No assembly. Note: \"COVER PANELS\"</p>", "checks_pro": [], "html_simple": "<p>No assembly here. Next: the cover panels.</p>", "checks_simple": [], "ts": [72, 43, 34]}, {"stage": 8, "kind": "wire", "key": "y-fan", "title": "Before step 168: wire the shoulder fan", "img": null, "html": "<ol>\n<li>Check the fan label: <strong>24 V fan on a 24 V supply</strong>.</li>\n<li>Fan red → <strong>Y driver V+</strong>. Fan black → <strong>Y driver Gnd</strong>.</li>\n<li>Twist the thin fan wire together with the power wire that goes on to Z, then tighten the screw.</li>\n<li>Switch on: the fan spins.</li>\n</ol>", "ov": ["fY"], "bench": ["pwr", "can"], "drv": "57D", "grip": null, "conn": [["fan wire", "Y driver **V+**", "red", "twist it with the +V wire on to Z", "V+", "fan +", "", null, "Red"], ["fan wire", "Y driver **Gnd**", "blk", "twist it with the GND wire on to Z", "Gnd", "fan −", "", null, "Black"]], "conn_title": null, "sen": null, "sen_names": null, "wire": ["power"], "checks": [], "html_pro": "<ol>\n<li>Check the fan label: <strong>24 V fan on a 24 V supply</strong>.</li>\n<li>Fan red → <strong>Y driver V+</strong>. Fan black → <strong>Y driver Gnd</strong>.</li>\n<li>Twist the thin fan wire together with the power wire that goes on to Z, then tighten the screw.</li>\n<li>Switch on: the fan spins.</li>\n</ol>", "checks_pro": [], "html_simple": "<p><strong>Y 57D:</strong> right-hand block, top 2 screws.</p>\n<ul>\n<li>Check the fan label: a  "checks_pro": [], "html_simple": "<p>Check it matches the picture: the C panel closes the gear side of the wrist.</p>", "checks_simple": [], "ts": [72, 43, 34]}, {"stage": 8, "kind": "step", "n": 199, "title": "Bring the BR panel (the big side cover with \"ARCTOS\" on it) to the…", "img": "Attachments/Arctos/web/manual/arctos-step-199.webp", "html": "<p>Bring the BR panel (the big side cover with \"ARCTOS\" on it) to the right side of the wrist. Parts: BR panel. Hardware: none labelled.</p>", "html_pro": "<p>BR panel (big side cover, \"ARCTOS\") to wrist right side. Parts: BR panel. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>BR panel</strong> (the one with \"ARCTOS\").</li>\n<li>Put 6x <strong>magnet</strong> into its magnet holes.</li>\n<li>Hold it at the right side of the wrist.</li>\n</ol>", "checks_simple": [], "ts": [72, 43, 34]}, {"stage": 8, "kind": "step", "n": 200, "title": "Optional: put a 12V LED strip into the slot behind the \"ARCTOS\"…", "img": "Attachments/Arctos/web/manual/arctos-step-200.webp", "html": "<p>Optional: put a 12V LED strip into the slot behind the \"ARCTOS\" letters inside the BR panel. The LED strip is not in the kit. Parts: none labelled. Hardware: 12V LED strip. Note: \"Optional (not included in the kit)\"</p>", "html_pro": "<p>Optional: 12V LED strip into slot behind \"ARCTOS\" letters inside BR panel. Not in kit. Parts: none labelled. Hardware: 12V LED strip. Note: \"Optional (not included in the kit)\"</p>", "checks_pro": [], "html_simple": "<p>Optional, not in the kit:</p>\n<ol>\n<li>Put a <strong>LED strip</strong> (12 V) in the slot behind the \"ARCTOS\" letters, inside the <strong>BR panel</strong>.</li>\n</ol>", "checks_simple": [], "ts": [72, 43, 34]}, {"stage": 8, "kind": "step", "n": 201, "title": "Result: the LED strip sits in its slot inside the BR panel", "img": "Attachments/Arctos/web/manual/arctos-step-201.webp", "html": "<p>Result: the LED strip sits in its slot inside the BR panel. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: LED strip in slot inside BR panel. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the LED strip sits in its slot inside the BR panel.</p>", "checks_simple": [], "ts": [72, 43, 34]}, {"stage": 8, "kind": "step", "n": 202, "title": "Fit the BR panel on the wrist", "img": "Attachments/Arctos/web/manual/arctos-step-202.webp", "html": "<p>Fit the BR panel on the wrist. Press the separate \"ARCTOS\" letters (and the small pieces that fill the letter gaps) into the cut-out on the panel. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Fit BR panel on wrist. Press separate \"ARCTOS\" letters (and small letter-gap fillers) into panel cut-out. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Fit the <strong>BR panel</strong> on the wrist.</li>\n<li>Press the <strong>ARCTOS letters</strong> into the letter opening.</li>\n<li>Press the small gap pieces into the letter gaps.</li>\n<li>Not in the paper manual: put 7x <strong>magnet</strong> into the <strong>B L Cover</strong> (left wrist cover) and fit it on the left side of the wrist.</li>\n</ol>", "checks_simple": [], "ts": [72, 43, 34]}, {"stage": 8, "kind": "step", "n": 203, "title": "Result: the BR panel is on with the \"ARCTOS\" letters in place", "img": "Attachments/Arctos/web/manual/arctos-step-203.webp", "html": "<p>Result: the BR panel is on with the \"ARCTOS\" letters in place. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: BR panel on, \"ARCTOS\" letters in place. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the BR panel is on and the \"ARCTOS\" letters are in.</p>", "checks_simple": [], "ts": [72, 43, 34]}, {"stage": 8, "kind": "test", "key": "cov-last", "title": "Before you close the last panel", "img": null, "html": "<p>The two lit terminators (CANable \"120R\" and MCP2515 \"J1\") make the 60 Ω reading.</p>\n<ul>\n<li>120 Ω means one end is missing.</li>\n</ul>", "ov": ["r120", "j1"], "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["Power off: CAN H to CAN L reads about 60 Ω.", "Every screw terminal is tight. Tug each wire. No bare copper shows.", "Both fans spin when the power is on.", "No wire crosses a moving part or a pinch point (turn every joint by hand).", "You photographed all the wiring."], "html_pro": "<p>Two lit terminators (CANable \"120R\", MCP2515 \"J1\") give the 60 Ω reading.</p>\n<ul>\n<li>120 Ω: one end missing.</li>\n</ul>", "checks_pro": ["Power off: CAN H to CAN L about 60 Ω.", "Every screw terminal tight (tug each wire), no bare copper.", "No wire crosses a moving part or pinch point (turn every joint by hand).", "All wiring photographed.", "Both fans spin with the power on."], "html_simple": "<ol>\n<li>Power off.</li>\n<li>Check both terminators are on: CANable \"120R\" and MCP2515 \"J1\".</li>\n<li>Measure CAN H to CAN L: about 60 Ω.</li>\n<li>120 Ω: one terminator is off.</li>\n<li>Turn every joint by hand. Watch the wires.</li>\n</ol>", "checks_simple": ["CAN H to CAN L reads about 60 Ω.", "Every screw terminal is tight (tug each wire). No bare copper.", "No wire touches a moving part or a pinch point."], "ts": [34, 35, 37, 42, 72, 43]}, {"stage": 8, "kind": "step", "n": 240, "title": "The finished ARCTOS robot arm, seen from the side: the base,…", "img": "Attachments/Arctos/web/manual/arctos-step-240.webp", "html": "<p>The finished ARCTOS robot arm, seen from the side: the base, shoulder, upper arm, elbow, forearm, wrist with the \"ARCTOS\" panel, and the gripper. Parts: none labelled. Hardware: none labelled.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Last step: <strong>bolt the robot to the table</strong> before the first move. It is about 10 kg and can tip over.</p>\n</div>", "html_pro": "<p>Finished ARCTOS arm, side view: base, shoulder, upper arm, elbow, forearm, wrist with \"ARCTOS\" panel, gripper. Parts: none labelled. Hardware: none labelled.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Last step: <strong>bolt robot to table</strong> before first move. About 10 kg, can tip.</p>\n</div>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the arm is complete, with the gripper on.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Bolt the robot to the table</div>\n<p>Do it before the first move. It is about 10 kg and can tip over.</p>\n</div>", "checks_simple": [], "ts": [26, 0, 34, 35, 37, 42]}, {"stage": 8, "kind": "test", "key": "power-up", "title": "First full power-up", "img": null, "html": "<ol>\n<li>Arctos Studio → Connections → <strong>Closed Loop</strong> → the CANable port → Connect.</li>\n<li><strong>Scan:</strong> joints answer on IDs 1–6, the gripper on 7.</li>\n<li>Robot Config gear ratios: <strong>X 7.2, Y 82, Z 82, A 48, B 67.82, C 67.82</strong>.</li>\n<li>Jog <strong>one joint at a time</strong>, a few degrees. Fix a wrong direction with \"invert\".</li>\n<li><strong>Home one joint at a time.</strong> Keep a hand on the power switch. <strong>Home B and C together.</strong></li>\n<li>Run <strong>Settings → Calibrate Axes</strong> for any joint that moves too far or not far enough.\n   Check: X 7.2, Y 82 and Z 82 are for the HTD mod (15-tooth motor pulleys). Y and Z are worked out from the stock 150, not measured.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Never use sensorless (\"crash\") homing</div>\n<p>The drivers can push hard enough to break a gearbox.</p>\n</div>\n<p>Then <strong>bolt the robot to the table</strong>. It is heavy and can tip over.</p>", "ov": [], "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": ["Scan finds IDs 1–7.", "Every joint jogs the right way.", "Every joint homes and stops at its sensor.", "The robot is bolted to the table."], "html_pro": "<ol>\n<li>Arctos Studio → Connections → <strong>Closed Loop</strong> → CANable port → Connect.</li>\n<li><strong>Scan:</strong> joints on IDs 1–6, gripper on 7.</li>\n<li>Robot Config gear ratios: <strong>X 13.5, Y 150, Z 150, A 48, B 67.82, C 67.82</strong>.</li>\n<li>Jog <strong>one joint at a time</strong>, few degrees. Wrong direction: \"invert\".</li>\n<li><strong>Home one joint at a time</strong>, hand on power switch. <strong>Home B and C together.</strong></li>\n<li><strong>Settings → Calibrate Axes</strong> for any joint that over- or under-travels.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Never use sensorless (\"crash\") homing</div>\n<p>Drivers can push hard enough to break a gearbox.</p>\n</div>\n<p>Then <strong>bolt robot to table</strong>: heavy, can tip.</p>", "checks_pro": ["Scan finds IDs 1–7.", "Every joint jogs the right way.", "Every joint homes, stops at its sensor.", "Robot bolted to table."], "html_simple": "<ol>\n<li>Arctos Studio → Connections → <strong>Closed Loop</strong> → the CANable port → Connect.</li>\n<li><strong>Scan:</strong> joints answer on IDs 1–6, the gripper on 7.</li>\n<li>Robot Config gear ratios: <strong>X 7.2, Y 82, Z 82, A 48, B 67.82, C 67.82</strong>.</li>\n<li>Jog <strong>one joint at a time</strong>, a few degrees. Wrong direction: use \"invert\".</li>\n<li><strong>Home one joint at a time.</strong> Keep a hand on the power switch. <strong>Home B and C together.</strong></li>\n<li>A joint moves too far or too little: run <strong>Settings → Calibrate Axes</strong>.</li>\n<li><strong>Bolt the robot to the table.</strong></li>\n</ol>\n<p>Check: X 7.2, Y 82 and Z 82 are for the HTD mod (15-tooth motor pulleys). Y and Z are worked out from the stock 150, not measured: if Y or Z mov
