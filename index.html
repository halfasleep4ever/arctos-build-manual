oles aligned.</p>", "checks_simple": [], "ts": [18, 19, 22, 23, 20, 21]}, {"stage": 6, "kind": "step", "n": 122, "title": "Bolt input planets to middle planets", "img": "Attachments/Arctos/manual/arctos-step-122.png", "html": "<ol>\n<li>Put <strong>Bolt M3 10mm</strong> through each input planet into its middle planet. <strong>2 per planet, 8 in total.</strong> Drawn: 8.</li>\n<li>Tighten a little on each bolt in turn, so no planet lifts on one side. [Alberto]</li>\n</ol>\n<p><strong>Check:</strong> no bolt head sticks up above the gear face. The planets still turn around the sun.</p>\n<p>(The old caption said \"to the carrier\". There is no carrier. The bolts join the input planet to the middle planet.)</p>", "html_pro": "<ol>\n<li><strong>Bolt M3 10mm</strong> through each input planet into its middle planet; <strong>2 per planet, 8 total.</strong> Drawn: 8.</li>\n<li>Tighten a little on each bolt in turn so no planet lifts on one side. [Alberto]</li>\n</ol>\n<p><strong>Check:</strong> no bolt head above the gear face; planets still turn around the sun.</p>\n<p>(Old caption said \"to the carrier\". No carrier exists; the bolts join input planet to middle planet.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put <strong>Bolt M3 10mm</strong> through each input planet into its middle planet: 2 per planet, 8 total.</li>\n<li>Tighten a little on each bolt in turn.</li>\n</ol>\n<p>Check: no bolt head sticks up; planets still turn around the sun.</p>", "checks_simple": [], "ts": [18, 19, 22, 23, 26]}, {"stage": 6, "kind": "step", "n": 123, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-123.png", "html": "<ol>\n<li>Each input planet shows 2 bolt heads.</li>\n</ol>", "html_pro": "<ol>\n<li>Each input planet shows 2 bolt heads.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture: each input planet shows 2 bolt heads.</p>", "checks_simple": [], "ts": [18, 19, 22, 23, 26]}, {"stage": 6, "kind": "step", "n": 124, "title": "Output sun (back on the outer side)", "img": "Attachments/Arctos/manual/arctos-step-124.png", "html": "<ol>\n<li>Turn back to the outer side of the BL core.</li>\n<li>Put the <strong>BCGR output sun</strong> into the centre of the middle planets.</li>\n</ol>\n<p><strong>Check:</strong> it meshes with all 4 planets.</p>\n<p>Tip: \"Note: in some cases (depending on the tolerances) the gearbox runs smoothly without the sun gear.\" [3D] If the finished box binds, try it without this part.</p>", "html_pro": "<ol>\n<li>Back to the outer side of the BL core.</li>\n<li><strong>BCGR output sun</strong> into the centre of the middle planets.</li>\n</ol>\n<p><strong>Check:</strong> meshes with all 4 planets.</p>\n<p>Tip: \"Note: in some cases (depending on the tolerances) the gearbox runs smoothly without the sun gear.\" [3D] If the finished box binds, try it without this part.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn back to the outer side of the BL core.</li>\n<li>Put the <strong>BCGR output sun</strong> into the centre of the middle planets.</li>\n</ol>\n<p>Check: it meshes with all 4 planets.</p>", "checks_simple": [], "ts": [18, 19, 22, 23, 20, 21]}, {"stage": 6, "kind": "step", "n": 125, "title": "Big bearing and outer ring", "img": "Attachments/Arctos/manual/arctos-step-125.png", "html": "<ol>\n<li>Put a <strong>Bearing 61812</strong> over the gearbox. Drawn: 1.</li>\n<li>Put the <strong>BCGL outer ring(Mirror)</strong> over it. It has belt teeth on the outside and gear teeth on the inside.</li>\n<li>Alberto fits the bearing into the outer ring first, then lowers both together. [Alberto]</li>\n</ol>\n<p><strong>Check:</strong> the bearing goes in <strong>straight</strong>. Do not sand a tight bore. Unexpected Maker's A-axis 61812 would not enter its bore, and sanding made it stick. Reprint rather than sand. [UM]</p>", "html_pro": "<ol>\n<li><strong>Bearing 61812</strong> over the gearbox. Drawn: 1.</li>\n<li><strong>BCGL outer ring(Mirror)</strong> over it (belt teeth outside, gear teeth inside).</li>\n<li>Alberto presses the bearing into the outer ring first, then lowers both together. [Alberto]</li>\n</ol>\n<p><strong>Check:</strong> bearing enters <strong>straight</strong>. Do not sand a tight bore; Unexpected Maker's A-axis 61812 would not enter its bore and sanding made it stick. Reprint instead. [UM]</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put a <strong>Bearing 61812</strong> over the gearbox (1x).</li>\n<li>Put the <strong>BCGL outer ring(Mirror)</strong> over it (belt teeth outside, gear teeth inside).</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Bearing goes in straight</div>\n<p>Don't sand a tight bore; reprint instead.</p>\n</div>\n<p>Check: bearing sits straight.</p>", "checks_simple": [], "ts": [2, 3, 32, 28, 30]}, {"stage": 6, "kind": "step", "n": 126, "title": "Output planets", "img": "Attachments/Arctos/manual/arctos-step-126.png", "html": "<ol>\n<li>Put the 4 <strong>BCGR output planetary</strong> gears into the outer ring, onto the middle planets. Drawn: 4.</li>\n<li>Line up their holes with the middle planets.</li>\n<li>Bolt each one with <strong>Bolt M3 10mm v2</strong>, <strong>2 per planet, 8 in total</strong>. Drawn: 8.</li>\n<li>That makes <strong>16</strong> M3x10 per side. \"8 first, 16 in total.\" [Alberto]</li>\n</ol>\n<p><strong>Check:</strong> you can feel the herringbone halves grip the ring from both sides.</p>", "html_pro": "<ol>\n<li>4 <strong>BCGR output planetary</strong> gears into the outer ring, onto the middle planets. Drawn: 4.</li>\n<li>Align holes with the middle planets.</li>\n<li><strong>Bolt M3 10mm v2</strong>, <strong>2 per planet, 8 total</strong>. Drawn: 8.</li>\n<li><strong>16</strong> M3x10 per side in total. \"8 first, 16 in total.\" [Alberto]</li>\n</ol>\n<p><strong>Check:</strong> herringbone halves grip the ring from both sides, felt by hand.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the 4 <strong>BCGR output planetary</strong> gears into the outer ring, onto the middle planets (4x).</li>\n<li>Line up their holes with the middle planets.</li>\n<li>Bolt each with <strong>Bolt M3 10mm v2</strong>: 2 per planet, 8 total.</li>\n<li>That makes 16 M3x10 per side.</li>\n</ol>\n<p>Check: the herringbone halves grip the ring from both sides.</p>", "checks_simple": [], "ts": [18, 19, 22, 23, 20, 21]}, {"stage": 6, "kind": "step", "n": 127, "title": "The triangle marks", "img": "Attachments/Arctos/manual/arctos-step-127.png", "html": "<ol>\n<li>Look at the small <strong>triangles</strong>. The outer ring has 4 (at 12, 3, 6 and 9 o'clock). They point <strong>toward the centre</strong>.</li>\n<li>Each planet and the output sun also has triangles.</li>\n<li>They should form <strong>4 straight lines</strong> from the centre, through each planet, to the ring triangles. \"The printed arrows should point to the centre of the gears.\" [Alberto]</li>\n<li>The output planet bolt pairs again alternate side-by-side and one-above-the-other.</li>\n</ol>\n<p><strong>Check:</strong> the <strong>spin test</strong>. Turn the outer ring by hand. It must turn with very little effort and keep turning a little after a flick. \"If it binds at all … that motor's not going to be able to move it.\" [Alberto] If it binds, see <a class=\"wl\" href=\"#/planetary/if-the-gearbox-binds-or-is-loose\">Planetary Gearboxes (A, B, C) › If the gearbox binds or is loose</a>.</p>", "html_pro": "<ol>\n<li>Small <strong>triangles</strong>: the outer ring has 4 (12, 3, 6, 9 o'clock), pointing <strong>toward the centre</strong>.</li>\n<li>Each planet and the output sun also carries triangles.</li>\n<li>They form <strong>4 straight lines</strong> from the centre, through each planet, to the ring triangles. \"The printed arrows should point to the centre of the gears.\" [Alberto]</li>\n<li>Output planet bolt pairs again alternate side-by-side and one-above-the-other.</li>\n</ol>\n<p><strong>Check:</strong> <strong>spin test</strong>: turn the outer ring by hand; very little effort, keeps turning a little after a flick. \"If it binds at all … that motor's not going to be able to move it.\" [Alberto] If it binds, see <a class=\"wl\" href=\"#/planetary/if-the-gearbox-binds-or-is-loose\">Planetary Gearboxes (A, B, C) › If the gearbox binds or is loose</a>.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>The outer ring has 4 small triangles (12, 3, 6, 9 o'clock) pointing at the centre.</li>\n<li>Each planet and the output sun has triangles too.</li>\n<li>They must form 4 straight lines from the centre through each planet to the ring triangles.</li>\n<li>Output planet bolt pairs again alternate side-by-side and one-above-the-other.</li>\n</ol>\n<p>Check: turn the outer ring by hand. It turns easily and keeps turning after a flick. If it binds, see <a class=\"wl\" href=\"#/planetary/if-the-gearbox-binds-or-is-loose\">Planetary Gearboxes (A, B, C) › If the gearbox binds or is loose</a>.</p>", "checks_simple": [], "ts": [18, 19, 22, 23, 20, 21]}, {"stage": 6, "kind": "step", "n": 128, "title": "The BL unit", "img": "Attachments/Arctos/manual/arctos-step-128.png", "html": "<ol>\n<li>The BL unit is the motor holder, motor, driver and BL core gearbox together.</li>\n<li>Hold it beside the wrist. It is not fitted yet.</li>\n</ol>", "html_pro": "<ol>\n<li>BL unit = motor holder + motor + driver + BL core gearbox.</li>\n<li>Hold beside the wrist; not fitted yet.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture. Hold the BL unit beside the wrist; don't fit it yet.</p>", "checks_simple": [], "ts": [71, 33, 18]}, {"stage": 6, "kind": "step", "n": 129, "title": "Gearbox gear bolts, first two", "img": "Attachments/Arctos/manual/arctos-step-129.png", "html": "<ol>\n<li>Look at the back of the motor holder, next to the motor. You can see the 3-hole disc in the middle of the holder (the gearbox gear).</li>\n<li>Put <strong>Bolt M3 15mm</strong> through the 2 holes you can reach. Drawn: 2.</li>\n<li>These bolts go through the <strong>BCGL gearbox gear</strong> into the <strong>input sun</strong> (step 120). They lock the motor's drive into the gearbox.</li>\n</ol>\n<p><strong>Check:</strong> use the right length (15 mm). \"A bolt that is too long will break the sun gear.\" [Alberto]</p>\n<div class=\"callout note\">\n<div class=\"callout-title\">The motor holder does not move</div>\n<p>The red arrow in step 130 circles the <strong>3-hole disc</strong>, not the holder. The bolt heads appear one by one <strong>in that disc</strong>: 2 in step 130, 3 in step 132. The motor holder does not move.</p>\n</div>", "html_pro": "<ol>\n<li>Back of the motor holder, next to the motor: the 3-hole disc (gearbox gear) in the middle.</li>\n<li><strong>Bolt M3 15mm</strong> through the 2 reachable holes. Drawn: 2.</li>\n<li>Bolts pass through the <strong>BCGL gearbox gear</strong> into the <strong>input sun</strong> (step 120), locking motor drive to the gearbox.</li>\n</ol>\n<p><strong>Check:</strong> correct length (15 mm). \"A bolt that is too long will break the sun gear.\" [Alberto]</p>\n<div class=\"callout note\">\n<div class=\"callout-title\">Correction to earlier note</div>\n<p>Earlier notes said steps 129–132 \"fix and rotate the motor holder to tension the belt\". Pictures disagree. The red arrow in step 130 circles the <strong>3-hole disc</strong>, not the holder. Bolt heads appear one by one <strong>in that disc</strong>: 2 in step 130, 3 in step 132. The holder does not move.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Look at the back of the motor holder, next to the motor.</li>\n<li>Put <strong>Bolt M3 15mm</strong> through the 2 reachable holes of the 3-hole disc (2x).</li>\n<li>They go through the <strong>BCGL gearbox gear</strong> into the <strong>input sun</strong>.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Use 15 mm</div>\n<p>A longer bolt breaks the sun gear.</p>\n</div>", "checks_simple": [], "ts": [20, 21, 25, 27, 71, 33]}, {"stage": 6, "kind": "step", "n": 130, "title": "Turn the gearbox to reach the third hole", "img": "Attachments/Arctos/manual/arctos-step-130.png", "html": "<ol>\n<li>The motor body hides the third hole.</li>\n<li>Turn the gearbox gear (red curved arrow) until the third hole comes clear of the motor. Turning the outer ring by hand does this. The motor turns too.</li>\n</ol>\n<p>Tip: the 3D viewer shows a \"stopper\" that \"can be used to stop gears from moving. It helps to bolt them more easily.\" [3D] (unsure: which step it belongs to.)</p>", "html_pro": "<ol>\n<li>Motor body hides the third hole.</li>\n<li>Turn the gearbox gear (red curved arrow) until the third hole clears the motor; turn the outer ring by hand. Motor turns too.</li>\n</ol>\n<p>Tip: 3D viewer shows a \"stopper\" that \"can be used to stop gears from moving. It helps to bolt them more easily.\" [3D] (unsure: which step it belongs to.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>The motor body hides the third hole.</li>\n<li>Turn the gearbox gear (red arrow) until the third hole is clear; turning the outer ring by hand does it.</li>\n</ol>", "checks_simple": [], "ts": [71, 33, 26]}, {"stage": 6, "kind": "step", "n": 131, "title": "Third bolt", "img": "Attachments/Arctos/manual/arctos-step-131.png", "html": "<ol>\n<li>Put in the third <strong>Bolt M3 15mm</strong>. Drawn: 1.</li>\n</ol>", "html_pro": "<ol>\n<li>Insert third <strong>Bolt M3 15mm</strong>. Drawn: 1.</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li>Put in the third <strong>Bolt M3 15mm</strong> (1x).</li>\n</ol>", "checks_simple": [], "ts": [26, 0, 18]}, {"stage": 6, "kind": "step", "n": 132, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-132.png", "html": "<ol>\n<li>Three bolt heads now show in the disc.</li>\n</ol>\n<p><strong>Check:</strong> tighten all 3 evenly. Spin test again. Turning the outer ring should still be smooth.</p>", "html_pro": "<ol>\n<li>Three bolt heads show in the disc.</li>\n</ol>\n<p><strong>Check:</strong> tighten all 3 evenly. Spin test again; outer ring still smooth.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>\n<ol>\n<li>Tighten all 3 bolts evenly.</li>\n<li>Spin test again. The outer ring must turn smoothly.</li>\n</ol>", "checks_simple": [], "ts": [26, 0, 18]}, {"stage": 6, "kind": "step", "n": 133, "title": "Bring the unit to the B core", "img": "Attachments/Arctos/manual/arctos-step-133.png", "html": "<ol>\n<li>Bring the BL unit to the wrist.</li>\n<li>The 3-hole shaft of <strong>B bevel gear R</strong> (step 105) lines up with the 3-hole triangle on the BL <strong>timing pulley</strong>.</li>\n</ol>\n<p><strong>Check:</strong> before any bolts go in, \"<strong>check the axis turns before screwing everything together</strong>.\" [UM]</p>\n<p>(unsure: the bolts that join gear R's shaft to the timing pulley are not drawn. See section 2.4.)</p>", "html_pro": "<ol>\n<li>Bring BL unit to wrist.</li>\n<li>Align 3-hole shaft of <strong>B bevel gear R</strong> (step 105) with 3-hole triangle on BL <strong>timing pulley</strong>.</li>\n</ol>\n<p><strong>Check:</strong> before any bolts, \"<strong>check the axis turns before screwing everything together</strong>.\" [UM]</p>\n<p>(unsure: bolts joining gear R's shaft to timing pulley are not drawn. See section 2.4.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Bring the BL unit to the wrist.</li>\n<li>Line up the 3-hole shaft of <strong>B bevel gear R</strong> (step 105) with the 3-hole triangle on the BL <strong>timing pulley</strong>.</li>\n<li>Check the axis turns before any bolts go in.</li>\n</ol>", "checks_simple": [], "ts": [16, 32, 26]}, {"stage": 6, "kind": "step", "n": 134, "title": "Bolt the BL side", "img": "Attachments/Arctos/manual/arctos-step-134.png", "html": "<ol>\n<li>Put <strong>Bolt M3 20mm</strong> in the 2 long-bolt holes. Drawn: 2.</li>\n<li>Put <strong>Bolt M3 10mm</strong> in the 4 short-bolt holes. Drawn: 4.</li>\n<li>Put <strong>Nut M3</strong> on the far side for the 2 holes shown. Drawn: 2 (they sit near the forearm end).</li>\n<li>The bolts go into holes around the top and bottom rim of the gearbox.</li>\n</ol>\n<p><strong>Check:</strong> nothing pinches a wire. The gearbox still spins.</p>\n<p>(unsure: which hole takes which length, and which bolts take the 2 nuts. The picture does not show the bolts going in. The old caption said 3 + 3. I counted 2 long + 4 short.)</p>", "html_pro": "<ol>\n<li><strong>Bolt M3 20mm</strong> in the 2 long-bolt holes. Drawn: 2.</li>\n<li><strong>Bolt M3 10mm</strong> in the 4 short-bolt holes. Drawn: 4.</li>\n<li><strong>Nut M3</strong> on far side for the 2 holes shown. Drawn: 2 (near forearm end).</li>\n<li>Bolts go in holes around top and bottom rim of gearbox.</li>\n</ol>\n<p><strong>Check:</strong> no wire pinched. Gearbox still spins.</p>\n<p>(unsure: which hole takes which length, and which bolts take the 2 nuts. Picture does not show bolts going in. Old caption said 3 + 3; counted 2 long + 4 short.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put <strong>Bolt M3 20mm</strong> in the 2 long-bolt holes (2x).</li>\n<li>Put <strong>Bolt M3 10mm</strong> in the 4 short-bolt holes (4x).</li>\n<li>Put <strong>Nut M3</strong> on the far side of the 2 holes shown (2x, near the forearm end).</li>\n</ol>\n<p><strong>Check:</strong> no wire is pinched. The gearbox still spins.</p>", "checks_simple": [], "ts": [4, 26, 69, 70]}, {"stage": 6, "kind": "step", "n": 135, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-135.png", "html": "<ol>\n<li>The BL side is bolted on.</li>\n</ol>\n<p><strong>Check:</strong> turn the BL timing pulley by hand (belt not fitted yet). Bevel gear R inside the B core turns with it.</p>", "html_pro": "<ol>\n<li>BL side bolted on.</li>\n</ol>\n<p><strong>Check:</strong> turn BL timing pulley by hand (belt not fitted yet); bevel gear R inside B core turns with it.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the BL timing pulley by hand (no belt yet).</li>\n<li>Bevel gear R in the B core must turn with it.</li>\n</ol>", "checks_simple": [], "ts": [28, 30, 32, 26]}, {"stage": 6, "kind": "step", "n": 136, "title": "BCL magnet holder (optional)", "img": "Attachments/Arctos/manual/arctos-step-136.png", "html": "<ol>\n<li>The <strong>BCL magnet holder</strong> fits on the triangle boss in the centre of the timing pulley.</li>\n<li>The picture shows 2 bolt heads through it. (unsure: bolt size; not labelled.)</li>\n<li>\"Not needed if additional encoders will not be used.\" [Manual] The extra encoders (AS5600) are \"not included in the kit. Currently only in test phase.\" [3D]</li>\n</ol>\n<p>(unsure: whether the bolts that hold this part are the same bolts that join the pulley to bevel gear R. If so, you still need those bolts without the holder.)</p>", "html_pro": "<ol>\n<li><strong>BCL magnet holder</strong> fits on triangle boss in centre of timing pulley.</li>\n<li>Picture shows 2 bolt heads through it. (unsure: bolt size; not labelled.)</li>\n<li>\"Not needed if additional encoders will not be used.\" [Manual] Extra encoders (AS5600) \"not included in the kit. Currently only in test phase.\" [3D]</li>\n</ol>\n<p>(unsure: whether the bolts holding this part are the same bolts joining pulley to bevel gear R. If so, those bolts are still needed without the holder.)</p>", "checks_pro": [], "html_simple": "<p>Optional. Skip it if you will not use extra encoders.</p>\n<ol>\n<li>Fit the <strong>BCL magnet holder</strong> on the triangle boss in the centre of the timing pulley.</li>\n<li>Fix it with 2 bolts.</li>\n</ol>", "checks_simple": [], "ts": [16, 32, 62, 63, 26]}, {"stage": 6, "kind": "step", "n": 137, "title": "BC belt and idler tensioner", "img": "Attachments/Arctos/manual/arctos-step-137.png", "html": "<ol>\n<li>Loop <strong>BC belt 1</strong> (6 mm x 450 mm) around the <strong>outer ring</strong> (big) and the <strong>timing pulley</strong> (small).</li>\n<li>Put 2 <strong>GT2 idler W6</strong> wheels on the <strong>BCL idler tensioner</strong>, each on a <strong>Bolt M5 25mm v2</strong>. Drawn: 2 bolts, 2 idlers.</li>\n<li>Fit the tensioner between the two pulleys. The idlers press on the <strong>outside (smooth back)</strong> of the belt, top run and bottom run. In the picture both runs bend inward toward the tensioner.</li>\n<li>Put the <strong>M3 nut</strong> in the slot at the bottom of the tensioner (red arrow).</li>\n<li>Put the <strong>M3x10 bolt</strong> in from below (red arrow). \"Will be used to tighten the idlers/belts.\" [3D]</li>\n<li>Turn the M3x10 bolt to pull the belt tight.</li>\n</ol>\n<p><strong>Check:</strong> belt tension. The belt should not skip when you hold the timing pulley and turn the outer ring hard. It should not be so tight that the gearbox drags.</p>\n<p>Tip: Unexpected Maker's idler bearings clamped and would not turn; they \"need washers\" and are \"meant to float\". [UM, X idlers] Spin each idler by finger after tightening.</p>", "html_pro": "<ol>\n<li>Loop <strong>BC belt 1</strong> (6 mm x 450 mm) around <strong>outer ring</strong> (big) and <strong>timing pulley</strong> (small).</li>\n<li>Put 2 <strong>GT2 idler W6</strong> on <strong>BCL idler tensioner</strong>, each on a <strong>Bolt M5 25mm v2</strong>. Drawn: 2 bolts, 2 idlers.</li>\n<li>Fit tensioner between the two pulleys. Idlers press on <strong>outside (smooth back)</strong> of belt, top and bottom run. Picture: both runs bend inward toward tensioner.</li>\n<li><strong>M3 nut</strong> in slot at bottom of tensioner (red arrow).</li>\n<li><strong>M3x10 bolt</strong> in from below (red arrow). \"Will be used to tighten the idlers/belts.\" [3D]</li>\n<li>Turn M3x10 bolt to tension belt.</li>\n</ol>\n<p><strong>Check:</strong> belt tension. No skipping when you hold timing pulley and turn outer ring hard. Not so tight that gearbox drags.</p>\n<p>Tip: Unexpected Maker's idler bearings clamped and would not turn; \"need washers\", \"meant to float\". [UM, X idlers] Spin each idler by finger after tightening.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Loop <strong>BC belt 1</strong> (6 mm x 450 mm) around the big <strong>outer ring</strong> and the small <strong>timing pulley</strong>.</li>\n<li>Put 2 <strong>GT2 idler W6</strong> on the <strong>BCL idler tensioner</strong>, each on a <strong>Bolt M5 25mm v2</strong> (2x).</li>\n<li>Fit the tensioner between the two pulleys. The idlers press on the smooth back of the belt, top and bottom run.</li>\n<li>Put the <strong>M3 nut</strong> in the slot at the bottom of the tensioner.</li>\n<li>Put the <strong>M3x10</strong> bolt in from below.</li>\n<li>Turn the M3x10 bolt to pull the belt tight.</li>\n</ol>\n<p><strong>Check:</strong> the belt does not skip when you hold the pulley and turn the ring hard. The gearbox does not drag. Each idler spins by finger.</p>", "checks_simple": [], "ts": [2, 3, 32, 28, 30, 29]}, {"stage": 6, "kind": "step", "n": 138, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-138.png", "html": "<ol>\n<li>Belt on, tensioner in place.</li>\n</ol>\n<p><strong>Check:</strong> the belt runs straight on both pulleys, with no rubbing on bolt heads. A bolt head rubbing the belt was a fault for Unexpected Maker; he reversed the bolt. [UM]</p>", "html_pro": "<ol>\n<li>Belt on, tensioner in place.</li>\n</ol>\n<p><strong>Check:</strong> belt runs straight on both pulleys, no rubbing on bolt heads. Bolt head rubbing belt was a fault for Unexpected Maker; he reversed the bolt. [UM]</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Belt on, tensioner in place.</li>\n</ol>\n<p><strong>Check:</strong> the belt runs straight and no bolt head rubs it.</p>", "checks_simple": [], "ts": [28, 30, 32, 26]}, {"stage": 6, "kind": "step", "n": 139, "title": "BCL encoder holder (optional)", "img": "Attachments/Arctos/manual/arctos-step-139.png", "html": "<ol>\n<li>Fix the <strong>BCL encoder holder</strong> over the timing pulley with <strong>Bolt M3 10mm v2</strong>. Drawn: 2.</li>\n<li>This plate carries an optional AS5600 encoder (step 165). \"Holes for bigger encoders i.e. MT6701.\" [3D]</li>\n</ol>", "html_pro": "<ol>\n<li>Fix <strong>BCL encoder holder</strong> over timing pulley with <strong>Bolt M3 10mm v2</strong>. Drawn: 2.</li>\n<li>Plate carries optional AS5600 encoder (step 165). \"Holes for bigger encoders i.e. MT6701.\" [3D]</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix the <strong>BCL encoder holder</strong> over the timing pulley with <strong>Bolt M3 10mm v2</strong> (2x). Optional.</li>\n</ol>", "checks_simple": [], "ts": [16, 32, 26]}, {"stage": 6, "kind": "step", "n": 140, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-140.png", "html": "<ol>\n<li>The magnet holder shows through the encoder holder's centre hole.</li>\n</ol>", "html_pro": "<ol>\n<li>Magnet holder shows through encoder holder's centre hole.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check the magnet holder shows through the centre hole of the encoder holder.</p>", "checks_simple": [], "ts": [62, 54, 63]}, {"stage": 6, "kind": "step", "n": 141, "title": "B axis done", "img": "Attachments/Arctos/manual/arctos-step-141.png", "html": "<ol>\n<li>Both side units are on the forearm.</li>\n</ol>\n<p><strong>Check:</strong> both belts are tensioned. Both timing pulleys turn when you turn each outer ring.</p>", "html_pro": "<ol>\n<li>Both side units on forearm.</li>\n</ol>\n<p><strong>Check:</strong> both belts tensioned. Both timing pulleys turn when each outer ring turns.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Both side units are on the forearm.</li>\n</ol>\n<p><strong>Check:</strong> both belts are tight. Both timing pulleys turn when you turn each outer ring.</p>", "checks_simple": [], "ts": [28, 30, 32]}, {"stage": 6, "kind": "wire", "key": "w-servo", "title": "Gripper servo cable, before step 142", "img": null, "html": "<ol>\n<li>Push a <strong>servo extension</strong> (or a pull string) <strong>through the hollow C bevel gear</strong> before you fit it.</li>\n<li>Lead it into the B core, towards the Nano.</li>\n</ol>", "ov": ["sig"], "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": [], "html_pro": "<ol>\n<li>Push a <strong>servo extension</strong> (or pull string) <strong>through hollow C bevel gear</strong> before fitting.</li>\n<li>Lead into B core, towards the Nano.</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li>Push a <strong>servo extension</strong> (or pull string) through the hollow <strong>C bevel gear</strong> before you fit it.</li>\n<li>Lead it into the B core, toward the Nano.</li>\n</ol>", "checks_simple": [], "ts": [69, 70, 53, 79, 80, 18]}, {"stage": 6, "kind": "step", "n": 142, "title": "C bevel gear", "img": "Attachments/Arctos/manual/arctos-step-142.png", "html": "<div class=\"callout danger\">\n<div class=\"callout-title\">🔌 WIRE NOW: gripper servo cable, before step 142</div>\n<p>The gripper servo wires go \"through this hole\" in the centre of the C flange (step 231). [Manual] The C bevel gear has a hollow shaft, and the B core cap has a centre hole. So the servo cable runs through the middle of the C gear into the B core.</p>\n<ol>\n<li>Before you fit the C bevel gear, push a servo extension cable (or a pull string) through the C bevel gear's centre hole.</li>\n<li>Lead it out of the B core toward where the Arduino Nano will sit (section 7).\n(unsure: the exact path out of the B core. The <strong>C cable holder</strong> with its clip (step 204) seems to guide this cable under the wrist.)</li>\n</ol>\n</div>\n<ol>\n<li>Press one <strong>Nut M3 v2</strong> into each of the 3 pockets on the C bevel gear. Drawn: 3. These take the bolts for the gripper flange later (step 216, M3x25).</li>\n<li>Put the <strong>C bevel gear</strong> into the front opening of the B core. Teeth point inward.</li>\n<li>Mesh it with <strong>both</strong> side bevel gears.</li>\n<li>Put <strong>Bearing 61803</strong> on its shaft. Drawn: 1.</li>\n</ol>\n<p><strong>Check:</strong> turn the C gear by hand. Both side bevel gears turn, in <strong>opposite</strong> directions. Nothing catches.</p>", "html_pro": "<div class=\"callout danger\">\n<div class=\"callout-title\">🔌 WIRE NOW: gripper servo cable, before step 142</div>\n<p>Gripper servo wires go \"through this hole\" in centre of C flange (step 231). [Manual] C bevel gear has hollow shaft; B core cap has centre hole. Servo cable runs through middle of C gear into B core.</p>\n<ol>\n<li>Before fitting C bevel gear, push servo extension cable (or pull string) through its centre hole.</li>\n<li>Lead out of B core toward where Arduino Nano will sit (section 7).\n(unsure: exact path out of B core. <strong>C cable holder</strong> with its clip (step 204) seems to guide this cable under the wrist.)</li>\n</ol>\n</div>\n<ol>\n<li>Press one <strong>Nut M3 v2</strong> into each of the 3 pockets on C bevel gear. Drawn: 3. They take the gripper flange bolts later (step 216, M3x25).</li>\n<li><strong>C bevel gear</strong> into front opening of B core. Teeth point inward.</li>\n<li>Mesh with <strong>both</strong> side bevel gears.</li>\n<li><strong>Bearing 61803</strong> on its shaft. Drawn: 1.</li>\n</ol>\n<p><strong>Check:</strong> turn C gear by hand. Both side bevel gears turn in <strong>opposite</strong> directions. Nothing catches.</p>", "checks_pro": [], "html_simple": "<div class=\"callout warning\">\n<div class=\"callout-title\">Wire now</div>\n<p>Push a servo extension (or pull string) through the C bevel gear centre first. Lead it out of the B core toward the Nano.</p>\n</div>\n<ol>\n<li>Press one <strong>Nut M3 v2</strong> into each of the 3 pockets on the C bevel gear (3x). They take the M3x25 flange bolts later.</li>\n<li>Put the <strong>C bevel gear</strong> into the front opening of the B core, teeth inward.</li>\n<li>Mesh it with <strong>both</strong> side step-down IN+", "red", ""], ["Wago GND", "step-down IN−", "blk", ""], ["Step-down OUT", "nothing yet", "wht", "set 6.0 V first"]], "checks": [], "html_pro": "<ol>\n<li>Connect step-down input to +V and GND.</li>\n<li>Switch on. <strong>Trim screw until output reads 6.0 V</strong> on meter.</li>\n<li>Do this <strong>before</strong> anything connects to output.</li>\n<li>Can sit in base or wrist. 6 V and a CAN pair must reach gripper.</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li>Connect the step-down input to +V and GND.</li>\n<li>Switch on. Turn its screw until the output reads <strong>6.0 V</strong>.</li>\n<li>Do this <strong>before</strong> you connect anything to the output.</li>\n<li>Put it in the base or the wrist. 6 V and a CAN pair must reach the gripper.</li>\n</ol>", "checks_simple": [], "ts": [26, 0, 79, 80, 81, 34]}, {"stage": 7, "kind": "wire", "key": "g-bench", "title": "Bench-test the gripper electronics first", "img": "Attachments/Arctos/arctos-gripper_closed_loop_wiring.png", "html": "<ol>\n<li>Flash the Nano with the official <strong><code>gripper_CL</code></strong> sketch. It needs the mcp_can, SPI and Servo libraries.</li>\n<li>Wire the Nano and the MCP2515 on the table (table below).</li>\n<li><strong>Set the step-down to 6.0 V</strong>, then connect the servo.</li>\n<li>Put the <strong>J1 jumper</strong> on the MCP2515. The gripper is the far end of the CAN bus.</li>\n<li>Send <code>07 63</code> (open) and <code>07 00</code> (close). The servo should move.</li>\n</ol>\n<div class=\"callout note\">\n<div class=\"callout-title\">Not on the official diagram (advice)</div>\n<p>Connect the Nano's GND to the step-down's GND, so the servo signal shares a ground. Never put 24 V into the Nano's VIN.</p>\n</div>", "ov": null, "bench": null, "drv": "57D", "grip": ["can", "j1", "spi", "sig", "sv6", "sdin", "gnd"], "conn": [["MCP2515 INT", "Nano D2", "wht", ""], ["MCP2515 CS", "Nano D10", "wht", ""], ["MCP2515 SCK / SI / SO", "Nano D13 / D11 / D1 function glossify(root){
  if(LV!==0) return;
  const used=new Set(), walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('code,a,.gl,h1,th,.sec')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    let txt=n.nodeValue, out=[], hit=false;
    for(;;){
      let best=null;
      GL.forEach((g,k)=>{if(g[1]&&used.has(g[1]))return; const m=g[0].exec(txt); if(m&&(!best||m.index<best.m.index))best={m,k}});
      if(!best) break;
      const g=GL[best.k], m=best.m, label=g[1]||('bolt M'+m[1]+'x'+m[2]);
      if(g[1]) used.add(g[1]);
      const tip=g[2]||`A metric bolt ${m[1]} mm thick and ${m[2]} mm long.`;
      out.push(document.createTextNode(txt.slice(0,m.index)));
      const sp=document.createElement('span'); sp.className='gl'; sp.tabIndex=0; sp.dataset.gt=g[1]||m[0]; sp.dataset.gd=tip; sp.textContent=m[0]; out.push(sp);
      txt=txt.slice(m.index+m[0].length); hit=true;
      if(!g[1]) GL.forEach(()=>{}), used.add('bolt:'+m[0]);
    }
    if(hit){out.push(document.createTextNode(txt)); n.replaceWith(...out)}
  });
}

  const gs=t.closest('[data-go]'); if(gs){go(+gs.dataset.go);return}
  const tr=t.closest('#track'); if(tr){const r=tr.getBoundingClientRect();go(Math.floor((e.clientX-r.left)/r.width*NV()));return}
  const vb=t.closest('[data-v]'); if(vb){vTab=vb.dataset.v;$$('.vtabs button').forEach(b=>b.classList.toggle('on',b===vb));$('#vis').innerHTML=visHTML(pIdx,vTab);return}
  const mv=t.closest('[data-mv]'); if(mv){go(pIdx+ +mv.dataset.mv);return}
  if(t.closest('[data-done]')){pst.done[sid(S[pIdx])]=true;save();if(pIdx<NV()-1)go(pIdx+1);else render(pIdx);return}
  const ck=t.closest('[data-ck]'); if(ck){const k=ck.dataset.ck;pst.checks[k]=!pst.checks[k];save();ck.classList.toggle('ok',pst.checks[k]);$('input',ck).checked=pst.checks[k];e.preventDefault();return}
});

/* ---------- wiring sheet ---------- */
const planIdx=S.findIndex(s=>s.ov&&s.ov.includes('*'));
const WST=[['ov','Whole arm'],['57D','57D driver (X, Y)'],['42D','42D driver (Z, A, B, C)'],['grip','Gripper'],['tbl','Motor table']];
function openWs(k){
  document.body.classList.add('ws-open');
  $('#wsTabs').innerHTML=WST.map(([id,l])=>`<button data-wt="${id}" class="${id===k?'on':''}">${l}</button>`).join('');
  let o='';
  if(k==='ov') o=`<div class="vbox sheet">${overviewSVG(planIdx)}</div>${legend}<p>The four wires that run up the arm: <b>+V, GND, CAN H, CAN L</b>. Each driver takes power from a Wago at its joint and passes CAN on to the next one. The bus ends at the CANable (120R jumper) and at the gripper MCP2515 (J1).</p>`;
  else if(k==='57D'||k==='42D') o=`<div class="vbox sheet">${benchSVG({bench:[],drv:k})}</div>${legend}`+(k==='57D'?'<p>Limit sensors go on IN_1 (home) and IN_2. Set <b>DIP switches 2 and 3 ON</b>. The sensors take 5 V from the driver, never 24 V.</p>':'<p>Limit sensors go on <b>En</b> (home) and <b>Dir</b>. Fit the <b>COM jumper to +5V</b>, then send the remap command for that axis (Z <code>03 9E 01 A2</code>, A <code>04 9E 01 A3</code>, B <code>05 9E 01 A4</code>, C <code>06 9E 01 A5</code>).</p>');
  else if(k==='grip') o=`<div class="vbox sheet">${gripSVG({grip:[]})}</div>${legend}`;
  else { const b=S.find(s=>s.key==='b-intro'); o=`<div class="txt">${b?b.html.replace(/<ol>[\s\S]*$/,''):''}</div>`; }
  $('#wsBody').innerHTML=o;
}

/* ---------- find ---------- */
const IDX=S.map((s,i)=>({i,t:(s.kind==='step'?'Step '+s.n+': ':(KLAB[s.kind]+': '))+s.title,x:(s.title+' '+strip(s.html)+' '+(s.conn||[]).flat().join(' ')).toLowerCase()}));
let hsel=0;
function findDraw(){
  const q=$('#q').value.trim().toLowerCase(), H=$('#hits'); if(!q){H.style.display='none';return}
  let r=/^\d+$/.test(q)?IDX.filter(o=>S[o.i].n===+q):[];
  r=r.concat(IDX.filter(o=>!r.includes(o)&&o.x.includes(q))).slice(0,14);
  H.innerHTML=r.map((o,k)=>`<a href="#/${o.i+1}" class="${k===hsel?'sel':''}">${esc(o.t)}<small>${esc(G[stageOf(o.i)].title)}</small></a>`).join('')||'<a>No match</a>';
  H.style.display='block';
}
$('#q').addEventListener('input',()=>{hsel=0;findDraw()});
$('#q').addEventListener('keydown',e=>{const a=$$('#hits a');if(e.key==='ArrowDown'){hsel=Math.min(hsel+1,a.length-1);findDraw();e.preventDefault()}else if(e.key==='ArrowUp'){hsel=Math.max(hsel-1,0);findDraw();e.preventDefault()}else if(e.key==='Enter'&&a[hsel]){location.hash=a[hsel].getAttribute('href');$('#q').value='';findDraw();$('#q').blur()}else if(e.key==='Escape'){$('#q').value='';findDraw()}});
document.addEventListener('click',e=>{if(!e.target.closest('.find'))$('#hits').style.display='none'; if(e.target.closest('#hits a')){$('#q').value='';}});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){document.body.classList.remove('ts-open','ws-open','lb-open');return}
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.body.classList.contains('ts-open')||document.body.classList.contains('ws-open'))return;
  if(e.key==='ArrowRight'){go(pIdx+1);e.preventDefault()}
  else if(e.key==='ArrowLeft'){go(pIdx-1);e.preventDefault()}
  else if(e.key==='Enter'&&!e.target.closest('button,a,summary')){$('[data-done]').click();e.preventDefault()}
});
route();
})();
</script>
</body>
</html>
