and left of the <strong>\"▼Z\"</strong> mark.</li>\n<li>The bar stands upright. Its round holes face out of the slot.</li>\n</ol>\n<p><strong>Check:</strong> it sits flush in the slot. It does not stick out.</p>", "html_pro": "<ol>\n<li><strong>A m3 bolt carrier</strong> (narrow printed bar with holes) into its elbow slot, just below and left of the <strong>\"▼Z\"</strong> mark.</li>\n<li>Upright; round holes face out of the slot.</li>\n</ol>\n<p><strong>Check:</strong> flush in slot, no protrusion.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>A m3 bolt carrier</strong>.</li>\n<li>Put it in its slot on the elbow, just below and left of the <strong>\"▼Z\"</strong> mark.</li>\n<li>Round holes face out of the slot.</li>\n</ol>\n<p>Check it sits flush.</p>", "checks_simple": [], "ts": [26, 0, 54]}, {"stage": 5, "kind": "step", "n": 78, "title": "Fix the bolt carrier", "img": "Attachments/Arctos/manual/arctos-step-078.png", "html": "<ol>\n<li>Fix the bolt carrier with <strong>2x Bolt M3 10mm</strong> (drawn: 2).</li>\n<li>The picture shows one bolt near the \"Z\" mark and one lower down.</li>\n</ol>\n<p><strong>Check:</strong> the bar does not move when you push it.\n<strong>Tip:</strong> turn small screws in by hand. An impact driver strips the plastic (UM).</p>", "html_pro": "<ol>\n<li>Fix bolt carrier: <strong>2x Bolt M3 10mm</strong> (drawn: 2); one near \"Z\" mark, one lower.</li>\n</ol>\n<p><strong>Check:</strong> bar does not move when pushed.\n<strong>Tip:</strong> hand-drive small screws; impact driver strips the plastic (UM).</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix the bolt carrier with <strong>2x Bolt M3 10mm</strong>.</li>\n<li>One bolt near the \"Z\" mark, one lower down.</li>\n</ol>\n<p>Check it does not move.</p>", "checks_simple": [], "ts": [26, 0, 54]}, {"stage": 5, "kind": "step", "n": 79, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-079.png", "html": "<ol>\n<li>Compare with the picture. The bolt carrier is gone into its slot and the bolt heads show.</li>\n<li>The motor shaft sticks out of the front plate, at the lower round hole.</li>\n</ol>\n<p><strong>Check:</strong> nothing is loose. Wires still come out where you planned (section 5.3).</p>", "html_pro": "<ol>\n<li>Compare with picture: bolt carrier seated in slot, bolt heads visible.</li>\n<li>Motor shaft exits front plate at the lower round hole.</li>\n</ol>\n<p><strong>Check:</strong> nothing loose; wires exit as planned (section 5.3).</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>\n<p>Check the shaft sticks out of the lower round hole, and nothing is loose.</p>", "checks_simple": [], "ts": [71, 33, 26, 69, 70]}, {"stage": 5, "kind": "step", "n": 80, "title": "Bolt the motor to the elbow", "img": "Attachments/Arctos/manual/arctos-step-080.png", "html": "<ol>\n<li><strong>Last chance:</strong> check that the power, CAN in, CAN out and A limit leads are routed (section 5.3).</li>\n<li>Fit <strong>4x Bolt M3 10mm</strong> (drawn: 4) through the front plate into the motor's face.</li>\n<li>The bolts go in from the <strong>front</strong> (the side the shaft points to).</li>\n<li>Tighten them in a cross pattern, a little at a time.</li>\n</ol>\n<p><strong>Check:</strong> the motor does not move. The shaft still turns freely by hand.</p>", "html_pro": "<ol>\n<li><strong>Last chance:</strong> confirm power, CAN in, CAN out and A limit leads are routed (section 5.3).</li>\n<li><strong>4x Bolt M3 10mm</strong> (drawn: 4) through front plate into motor face; insert from the <strong>front</strong> (shaft side).</li>\n<li>Tighten in a cross pattern, incrementally.</li>\n</ol>\n<p><strong>Check:</strong> motor does not move; shaft still turns freely by hand.</p>", "checks_pro": [], "html_simple": "<div class=\"callout warning\">\n<div class=\"callout-title\">Last chance</div>\n<p>Power, CAN in, CAN out and A limit leads must be routed first (section 5.3).</p>\n</div>\n<ol>\n<li>Fit <strong>4x Bolt M3 10mm</strong> through the front plate into the motor.</li>\n<li>Bolts go in from the <strong>front</strong> (shaft side).</li>\n<li>Tighten in a cross pattern.</li>\n</ol>\n<p>Check the motor does not move and the shaft turns freely.</p>", "checks_simple": [], "ts": [58, 59, 61, 64, 71, 26]}, {"stage": 5, "kind": "step", "n": 81, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-081.png", "html": "<ol>\n<li>Four bolt heads sit around the shaft opening. The shaft sticks out of the lower hole.</li>\n</ol>\n<p><strong>Check:</strong> spin the shaft by hand. It must not rub on the plate.</p>", "html_pro": "<ol>\n<li>Four bolt heads around the shaft opening; shaft exits the lower hole.</li>\n</ol>\n<p><strong>Check:</strong> spin shaft by hand; no rubbing on plate.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture: four bolt heads around the shaft opening.</p>\n<p>Spin the shaft by hand. It must not rub.</p>", "checks_simple": [], "ts": [26, 0, 54]}, {"stage": 5, "kind": "step", "n": 82, "title": "AG motor gear and pulley", "img": "Attachments/Arctos/manual/arctos-step-082.png", "html": "<ol>\n<li>Take the <strong>GT2B5W6</strong> pulley.</li>\n<li><strong>Remove the top ring (flange) with pliers.</strong> Picture note: \"Remove the top ring of the pulley with pliers\". 3D manual: \"Slight twist will remove it.\"</li>\n<li>Push the pulley's toothed part into the <strong>AG motor gear</strong>. The gear's bore has teeth that fit the pulley's teeth.</li>\n<li>Slide the gear-and-pulley onto the motor shaft.</li>\n<li>Turn it so the <strong>grub screw</strong> lands on the <strong>flat side</strong> of the shaft.</li>\n<li>Snug the grub screw only. You may need to slide the gear to line it up with the AG input gear in step 94. (Tip adapted from the official v0.2 video: \"do not overtighten the set screw\" on a pulley you must align later.)</li>\n</ol>\n<p><strong>Check:</strong> the pulley does not spin inside the gear. The gear does not wobble when the shaft turns.\n<strong>Note:</strong> the picture shows no bolts between the pulley and the gear. (unsure: the old note said the press fit is \"very tight\"; I found no source for that.)</p>", "html_pro": "<ol>\n<li><strong>GT2B5W6</strong> pulley: remove top ring (flange) with pliers. Picture note: \"Remove the top ring of the pulley with pliers\". 3D manual: \"Slight twist will remove it.\"</li>\n<li>Press pulley toothed part into <strong>AG motor gear</strong> (bore teeth mate with pulley teeth).</li>\n<li>Slide gear-and-pulley onto motor shaft; <strong>grub screw</strong> onto the <strong>flat side</strong> of the shaft.</li>\n<li>Snug the grub screw only; you may need to slide the gear to align with the AG input gear in step 94. (Tip adapted from official v0.2 video: \"do not overtighten the set screw\" on a pulley you must align later.)</li>\n</ol>\n<p><strong>Check:</strong> pulley does not spin in gear; no gear wobble when shaft turns.\n<strong>Note:</strong> picture shows no bolts between pulley and gear. (unsure: old note said press fit is \"very tight\"; no source found.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>GT2B5W6</strong> pulley.</li>\n<li>Remove its top ring with pliers.</li>\n<li>Push the pulley's toothed part into the <strong>AG motor gear</strong>.</li>\n<li>Slide gear and pulley onto the motor shaft.</li>\n<li>Put the <strong>grub screw</strong> on the <strong>flat side</strong> of the shaft.</li>\n<li>Snug the grub screw only. Do not overtighten. You may slide the gear later (step 94).</li>\n</ol>\n<p>Check the pulley does not spin in the gear.</p>", "checks_simple": [], "ts": [28, 31, 71, 26]}, {"stage": 5, "kind": "step", "n": 83, "title": "Middle planets in the A core inner", "img": "Attachments/Arctos/manual/arctos-step-083.png", "html": "<ol>\n<li><strong>Build the gearbox on the bench, not on the arm.</strong> The picture shows the parts near the elbow, but the gearbox is only bolted on in step 94.</li>\n<li>Lay the <strong>A core inner</strong> flat. Its inside teeth face up.</li>\n<li>Put in the 4 <strong>BCGR middle planetary</strong> gears (drawn: 4).</li>\n<li>Set the timing exactly as section 4: 12 and 6 o'clock holes <strong>horizontal</strong>, 3 and 9 o'clock holes <strong>vertical</strong>.</li>\n<li>Picture note: \"Each gear is rotated 90° in respect to the next one.\"</li>\n</ol>\n<p><strong>Check:</strong> all 4 planets mesh with the ring. The gaps between them are equal (Alberto).\n<strong>Tip:</strong> 3D manual: \"This stopper can be used to stop gears from moving. It helps to bolt them more easily.\" (unsure which stopper part that note means.)</p>", "html_pro": "<ol>\n<li><strong>Build gearbox on the bench, not on the arm</strong>; picture shows parts near elbow, but gearbox is only bolted on in step 94.</li>\n<li><strong>A core inner</strong> flat, inside teeth up.</li>\n<li>4x <strong>BCGR middle planetary</strong> (drawn: 4).</li>\n<li>Timing per section 4: 12 and 6 o'clock holes <strong>horizontal</strong>, 3 and 9 o'clock holes <strong>vertical</strong>.</li>\n<li>Picture note: \"Each gear is rotated 90° in respect to the next one.\"</li>\n</ol>\n<p><strong>Check:</strong> all 4 planets mesh with ring; gaps equal (Alberto).\n<strong>Tip:</strong> 3D manual: \"This stopper can be used to stop gears from moving. It helps to bolt them more easily.\" (unsure which stopper part.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Build the gearbox on the bench, not on the arm.</li>\n<li>Lay the <strong>A core inner</strong> flat, inside teeth up.</li>\n<li>Put in the <strong>4x BCGR middle planetary</strong> gears.</li>\n<li>Timing as section 4: 12 and 6 o'clock holes <strong>horizontal</strong>, 3 and 9 o'clock holes <strong>vertical</strong>.</li>\n</ol>\n<p>Check all 4 mesh with the ring, gaps equal.</p>", "checks_simple": [], "ts": [18, 19, 22, 23, 20, 21]}, {"stage": 5, "kind": "step", "n": 84, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-084.png", "html": "<ol>\n<li>Compare with the picture. The 4 planets sit inside the ring, evenly spaced.</li>\n</ol>\n<p><strong>Check:</strong> turn one planet with a finger. All of them move a little together. Nothing jumps a tooth.</p>", "html_pro": "<ol>\n<li>Compare with picture: 4 planets inside ring, evenly spaced.</li>\n</ol>\n<p><strong>Check:</strong> turn one planet by finger; all move slightly together; no tooth skip.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture: 4 planets evenly spaced in the ring.</p>\n<p>Turn one planet. All move together, no tooth jumps.</p>", "checks_simple": [], "ts": [18, 19, 22, 23]}, {"stage": 5, "kind": "step", "n": 85, "title": "Input sun in the centre", "img": "Attachments/Arctos/manual/arctos-step-085.png", "html": "<ol>\n<li>Turn the A core inner over. You now look at the side that will face the elbow.</li>\n<li>Put the <strong>input sun</strong> in the centre. It is not labelled in the picture. It is the round hub with <strong>3 small holes and 1 centre hole</strong>.</li>\n<li>The 3-hole face points <strong>toward you</strong> (toward the elbow side).</li>\n</ol>\n<p><strong>Check:</strong> the sun sits in the middle and touches all 4 planet stacks evenly.\n<strong>Tip:</strong> Alberto (BC gearbox): to get a sun in, push the ring from below so it opens a little, drop the sun in, then let go. Don't spin the box until the sun is held in.\n<strong>Correction:</strong> the old caption called this a \"planet carrier\". This gearbox has no carrier. It is the sun.</p>", "html_pro": "<ol>\n<li>Flip <strong>A core inner</strong>; this side faces the elbow.</li>\n<li><strong>Input sun</strong> in centre (unlabelled in picture): round hub, <strong>3 small holes and 1 centre hole</strong>; 3-hole face toward you (elbow side).</li>\n</ol>\n<p><strong>Check:</strong> sun centred, touches all 4 planet stacks evenly.\n<strong>Tip:</strong> Alberto (BC gearbox): push ring from below so it opens slightly, drop sun in, release. Do not spin box until sun is held in.\n<strong>Correction:</strong> old caption said \"planet carrier\"; this gearbox has no carrier. It is the sun.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the A core inner over (elbow side up).</li>\n<li>Put the <strong>input sun</strong> in the centre: the round hub with <strong>3 small holes and 1 centre hole</strong>.</li>\n<li>The 3-hole face points <strong>toward you</strong>.</li>\n</ol>\n<p>Check it touches all 4 planet stacks evenly.</p>", "checks_simple": [], "ts": [18, 19, 22, 23]}, {"stage": 5, "kind": "step", "n": 86, "title": "Input planets", "img": "Attachments/Arctos/manual/arctos-step-086.png", "html": "<ol>\n<li>Put the 4 <strong>BCGR input planetary</strong> gears on, one on each middle planet (drawn: 4).</li>\n<li>Line up their 2 holes with the 2 holes in the middle planet below.</li>\n<li>Fit <strong>8x Bolt M3 10mm</strong> (drawn: 8), <strong>2 per gear</strong>. The label \"Bolt M3 10mm v2(Mirror) (26)\" is the CAD part number, not a count.</li>\n<li>The bolts go in from <strong>this side</strong> (the elbow side) into the middle planets.</li>\n<li>Tighten a little on each bolt in turn. That stops one side lifting (Alberto).</li>\n</ol>\n<p><strong>Check:</strong> turn the input sun by hand. All planets turn smoothly with no hard spot.\n<strong>Tips:</strong></p>\n<ul>\n<li>UM: the holes have no clearance, so bolts are hard to drive. He pre-drilled with a <strong>3 mm bit</strong>. (unsure: drill only the gear half the bolt passes through. The other half must keep plastic for the thread to grip.)</li>\n<li>If the holes are half a hole out, turn that gear 180° (UM).</li>\n<li>UM: if you print gears at 98 %, the screw holes shrink too. Enlarge them in CAD first.</li>\n</ul>", "html_pro": "<ol>\n<li>4x <strong>BCGR input planetary</strong>, one per middle planet (drawn: 4); align their 2 holes with the 2 holes in the middle planet below.</li>\n<li><strong>8x Bolt M3 10mm</strong> (drawn: 8), <strong>2 per gear</strong>, into middle planets. Label \"Bolt M3 10mm v2(Mirror) (26)\" is the CAD part number, not a count.</li>\n<li>Bolts enter from <strong>this side</strong> (elbow side).</li>\n<li>Tighten each bolt a little in turn to stop one side lifting (Alberto).</li>\n<li>Then check.</li>\n</ol>\n<p><strong>Check:</strong> turn input sun by hand; all planets smooth, no hard spot.\n<strong>Tips:</strong></p>\n<ul>\n<li>UM: holes have no clearance; hard to drive. He pre-drilled with a <strong>3 mm bit</strong>. (unsure: drill only the gear half the bolt passes through; other half keeps plastic for thread.)</li>\n<li>Holes half a hole out: turn that gear 180° (UM).</li>\n<li>UM: printing gears at 98 % shrinks screw holes too; enlarge in CAD first.</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Put <strong>4x BCGR input planetary</strong> gears on, one on each middle planet.</li>\n<li>Line up their 2 holes with the 2 holes below.</li>\n<li>Fit <strong>8x Bolt M3 10mm</strong>, 2 per gear, from the elbow side.</li>\n<li>Tighten a little on each bolt in turn.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Holes tight</div>\n<p>If holes are half a hole out, turn that gear 180°.</p>\n</div>\n<p>Check the input sun turns all planets smoothly.</p>", "checks_simple": [], "ts": [18, 19, 22, 23, 20, 21]}, {"stage": 5, "kind": "step", "n": 87, "title": "Centre bearing", "img": "Attachments/Arctos/manual/arctos-step-087.png", "html": "<ol>\n<li>Take <strong>1x Bearing 61803</strong> (the \"(4)\" in the label is a part number).</li>\n<li>Press it straight onto the input sun's raised hub.</li>\n</ol>\n<p><strong>Check:</strong> the bearing sits flat and fully down. The inner ring turns with the sun.\n<strong>Tip:</strong> UM: \"A bearing between the sun gears is easy to miss\" (a tip from Alberto in his chat).</p>", "html_pro": "<ol>\n<li><strong>1x Bearing 61803</strong> (\"(4)\" in label is a part number).</li>\n<li>Press straight onto input sun raised hub.</li>\n</ol>\n<p><strong>Check:</strong> bearing flat, fully down; inner ring turns with sun.\n<strong>Tip:</strong> UM: \"A bearing between the sun gears is easy to miss\" (tip from Alberto in his chat).</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take <strong>1x Bearing 61803</strong>.</li>\n<li>Press it straight onto the input sun's raised hub.</li>\n</ol>\n<p>Check it sits flat and fully down.</p>", "checks_simple": [], "ts": [2, 3, 20, 21, 25, 27]}, {"stage": 5, "kind": "step", "n": 88, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-088.png", "html": "<ol>\n<li>The bearing sits around the hub. You can still see the 3 small holes in the sun.</li>\n</ol>\n<p><strong>Check:</strong> turn the sun. The gearbox turns smoothly.</p>", "html_pro": "<ol>\n<li>Bearing around hub; 3 small sun holes still visible.</li>\n</ol>\n<p><strong>Check:</strong> turn sun; gearbox smooth.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture: bearing around the hub, 3 small holes visible.</p>\n<p>Turn the sun. It turns smoothly.</p>", "checks_simple": [], "ts": [2, 3, 54]}, {"stage": 5, "kind": "step", "n": 89, "title": "A input sun cap", "img": "Attachments/Arctos/manual/arctos-step-089.png", "html": "<ol>\n<li>Take the <strong>A input sun cap</strong>.</li>\n<li>Turn it so its <strong>cut-out notch</strong> points to the same side as the motor shaft (down). (unsure: inferred from step 90 and step 100. The cut-out lets the gears near the motor gear.)</li>\n<li>Press it on. The 61803 bearing goes into its centre opening.</li>\n<li>Fix it with <strong>M3 x 10 mm</strong> bolts. The picture says \"models missing\", so no bolts are drawn. I counted <strong>5</strong> counterbored holes. Use <strong>5x M3x10</strong>.</li>\n<li>The red arrow points at one of the matching holes in the A core inner rim.</li>\n</ol>\n<p><strong>Check:</strong> the cap sits flat all round. The sun still turns freely by hand.</p>", "html_pro": "<ol>\n<li><strong>A input sun cap</strong>: <strong>cut-out notch</strong> toward motor shaft side (down). (unsure: inferred from step 90 and step 100; cut-out gives gears clearance near motor gear.)</li>\n<li>Press on; 61803 bearing into its centre opening.</li>\n<li>Fix with <strong>M3 x 10 mm</strong> bolts. Picture says \"models missing\" (no bolts drawn); I counted <strong>5</strong> counterbored holes. Use <strong>5x M3x10</strong>.</li>\n<li>Red arrow marks one matching hole in A core inner rim.</li>\n</ol>\n<p><strong>Check:</strong> cap flat all round; sun still turns freely by hand.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>A input sun cap</strong>.</li>\n<li>Turn its <strong>cut-out notch</strong> to the motor shaft side (down).</li>\n<li>Press it on. The 61803 bearing goes into its centre opening.</li>\n<li>Fix it with <strong>5x M3x10</strong> bolts.</li>\n</ol>\n<p>Check it sits flat and the sun still turns.</p>", "checks_simple": [], "ts": [2, 3, 71, 26]}, {"stage": 5, "kind": "step", "n": 90, "title": "AG input gear (do it now)", "img": "Attachments/Arctos/manual/arctos-step-090.png", "html": "<ol>\n<li>Take the <strong>AG input gear</strong> and <strong>3x M3x15</strong> (drawn: 3).</li>\n<li>Put the gear on the input sun's 3-hole face, through the cap's centre opening.</li>\n<li>Line up its 3 holes with the 3 holes in the sun.</li>\n<li>Bolt it with the 3x M3x15. Tighten a little at a time.</li>\n<li>Picture note: \"Attach AG input gear in this step it's easier than doing it afterwards in step 99\".</li>\n</ol>\n<p><strong>Check:</strong> the input gear turns the whole gearbox smoothly. It does not wobble.\n<strong>Tip:</strong> Alberto: \"Use the correct bolt length here (about 15 mm). A bolt that is too long will break the sun gear.\"</p>", "html_pro": "<ol>\n<li><strong>AG input gear</strong> + <strong>3x M3x15</strong> (drawn: 3).</li>\n<li>Gear on input sun 3-hole face, through cap centre opening.</li>\n<li>Align 3 holes with the sun's 3 holes.</li>\n<li>Bolt with 3x M3x15; tighten incrementally.</li>\n<li>Picture note: \"Attach AG input gear in this step it's easier than doing it afterwards in step 99\".</li>\n</ol>\n<p><strong>Check:</strong> input gear turns whole gearbox smoothly, no wobble.\n<strong>Tip:</strong> Alberto: \"Use the correct bolt length here (about 15 mm). A bolt that is too long will break the sun gear.\"</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>AG input gear</strong> and <strong>3x M3x15</strong>.</li>\n<li>Put the gear on the sun's 3-hole face, through the cap's centre opening.</li>\n<li>Line up its 3 holes with the sun's 3 holes.</li>\n<li>Bolt it with the 3x M3x15.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Bolt length</div>\n<p>Use M3x15 only. Longer bolts break the sun gear.</p>\n</div>\n<p>Check the whole gearbox turns smoothly.</p>", "checks_simple": [], "ts": [20, 21, 25, 27, 26]}, {"stage": 5, "kind": "step", "n": 100, "title": "AG output ring", "img": "Attachments/Arctos/manual/arctos-step-100.png", "html": "<ol>\n<li>Turn the gearbox over. The middle planets face you again.</li>\n<li>Take the <strong>AG output ring</strong> (teeth on the inside, a row of small holes on its face).</li>\n<li>Slide it over the front of the middle planets. Its teeth face the gearbox.</li>\n</ol>\n<p><strong>Check:</strong> the ring sits flat against the A core inner rim. It turns by hand.\n<strong>Tip:</strong> UM: his big bearing would not go into the tapered output-ring bore. \"Reprint rather than sand.\" Test-fit the 61812 on the ring now.</p>", "moved": "Paper manual step 100. The paper manual draws step 100 on the page between steps 90 and 91, so it is built in that order.", "html_pro": "<ol>\n<li>Flip gearbox; middle planets face you.</li>\n<li><strong>AG output ring</strong> (inside teeth, row of small holes on face).</li>\n<li>Over front of middle planets; teeth face gearbox.</li>\n</ol>\n<p><strong>Check:</strong> ring flat against A core inner rim; turns by hand.\n<strong>Tip:</strong> UM: big bearing would not enter tapered output-ring bore. \"Reprint rather than sand.\" Test-fit 61812 on ring now.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the gearbox over, middle planets facing you.</li>\n<li>Take the <strong>AG output ring</strong> (inside teeth, small holes on its face).</li>\n<li>Slide it over the middle planets, teeth toward the gearbox.</li>\n</ol>\n<p>Check it sits flat on the A core inner rim and turns. Test-fit the 61812 bearing on it now.</p>", "checks_simple": [], "ts": [2, 3, 18, 19, 22, 23]}, {"stage": 5, "kind": "step", "n": 91, "title": "AG output sun", "img": "Attachments/Arctos/manual/arctos-step-091.png", "html": "<ol>\n<li>Put the <strong>AG output sun</strong> in the centre, between the planets.</li>\n<li>Its plain side (the side with the hole shown in the picture) faces you.</li>\n</ol>\n<p><strong>Check:</strong> it drops in without force.\n<strong>Tip:</strong> 3D manual: \"In some cases the gearbox performs better without output sun gear.\" Keep it in. Remove it only if the box binds.</p>", "html_pro": "<ol>\n<li><strong>AG output sun</strong> in centre between planets.</li>\n<li>Plain side (with the hole shown in picture) toward you.</li>\n</ol>\n<p><strong>Check:</strong> drops in without force.\n<strong>Tip:</strong> 3D manual: \"In some cases the gearbox performs better without output sun gear.\" Keep it; remove only if box binds.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>AG output sun</strong> in the centre between the planets.</li>\n<li>Plain side faces you.</li>\n</ol>\n<p>Check it drops in without force.</p>", "checks_simple": [], "ts": [18, 19, 22, 23, 20, 21]}, {"stage": 5, "kind": "step", "n": 92, "title": "Output planets", "img": "Attachments/Arctos/manual/arctos-step-092.png", "html": "<ol>\n<li>Put on the 4 <strong>BCGR output planetary</strong> gears (drawn: 4).</li>\n<li>Each goes on the matching middle planet. The holes line up straight through.</li>\n<li>Copy the picture: 12 and 6 o'clock holes horizontal, 3 and 9 o'clock holes vertical.</li>\n<li>Match the small <strong>triangle marks</strong> to the picture (section 4).</li>\n<li>Fix with <strong>8x Bolt M3 10mm</strong> (drawn: 8), <strong>2 per gear</strong>, from the front.</li>\n<li>Tighten a little on each bolt in turn.</li>\n</ol>\n<p><strong>Check:</strong> turn the AG input gear by hand. The output ring turns slowly and smoothly.</p>", "html_pro": "<ol>\n<li>4x <strong>BCGR output planetary</strong> (drawn: 4), one per matching middle planet; holes line up straight through.</li>\n<li>Orientation per picture: 12 and 6 o'clock holes horizontal, 3 and 9 o'clock holes vertical.</li>\n<li>Match small <strong>triangle marks</strong> (section 4).</li>\n<li><strong>8x Bolt M3 10mm</strong> (drawn: 8), <strong>2 per gear</strong>, from front.</li>\n<li>Tighten incrementally.</li>\n</ol>\n<p><strong>Check:</strong> turn AG input gear by hand; output ring turns slowly and smoothly.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put <strong>4x BCGR output planetary</strong> gears on the middle planets.</li>\n<li>Copy the picture: 12 and 6 o'clock holes horizontal, 3 and 9 o'clock holes vertical.</li>\n<li>Match the <strong>triangle marks</strong> to the picture (section 4).</li>\n<li>Fix with <strong>8x Bolt M3 10mm</strong>, 2 per gear, from the front.</li>\n<li>Tighten a little on each bolt in turn.</li>\n</ol>\n<p>Check turning the AG input gear turns the output ring smoothly.</p>", "checks_simple": [], "ts": [18, 19, 22, 23, 20, 21]}, {"stage": 5, "kind": "step", "n": 93, "title": "Spin test, then bring it to the elbow", "img": "Attachments/Arctos/manual/arctos-step-093.png", "html": "<ol>\n<li><strong>Spin test now, on the bench.</strong> Turn the AG input gear many times.</li>\n<li>A good gearbox turns with very little effort. It has no hard spot.</li>\n<li>Hold the gearbox in front of the elbow as in the picture.</li>\n</ol>\n<p><strong>Check:</strong> if it binds at all, fix it now (section 4). Alberto: \"If it binds at all … that motor's not going to be able to move it.\"\n<strong>Tip:</strong> Grease only after it is fully built. Docs: vaseline or graphite grease. (unsure: the designer said in UM's chat that \"no grease is needed\".)</p>", "html_pro": "<ol>\n<li><strong>Bench spin test:</strong> turn AG input gear many times.</li>\n<li>Should turn with minimal effort, no hard spot.</li>\n<li>Hold gearbox in front of elbow as in picture.</li>\n</ol>\n<p><strong>Check:</strong> any binding: fix now (section 4). Alberto: \"If it binds at all … that motor's not going to be able to move it.\"\n<strong>Tip:</strong> grease only after fully built; docs: vaseline or graphite grease. (unsure: designer said in UM's chat \"no grease is needed\".)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Spin test on the bench: turn the AG input gear many times.</li>\n<li>It must turn easily, no hard spot.</li>\n<li>Hold the gearbox in front of the elbow as in the picture.</li>\n</ol>\n<p>If it binds, fix it now (section 4).</p>", "checks_simple": [], "ts": [71, 33, 54]}, {"stage": 5, "kind": "step", "n": 94, "title": "Bolt the gearbox to the elbow", "img": "Attachments/Arctos/manual/arctos-step-094.png", "html": "<ol>\n<li>Offer the gearbox to the elbow. The AG input gear must mesh with the AG motor gear below.</li>\n<li>If the two gears do not line up face to face, loosen the grub screw (step 82). Slide the motor gear to line up. Retighten the grub screw firmly.</li>\n<li>Fit <strong>3x Bolt M3 20mm</strong> (drawn: 3) through the mounting ears of the A core inner into the elbow. They go in from the <strong>front</strong>.</li>\n<li>The picture shows one bolt at the top, one on the left side, and one at the bottom.</li>\n</ol>\n<p><strong>Check:</strong> turn the motor shaft by hand (or the gearbox output). Everything turns. There is a little play between the motor gear and input gear, not zero.</p>", "html_pro": "<ol>\n<li>Offer gearbox to elbow; AG input gear meshes with AG motor gear below.</li>\n<li>If gears do not line up face to face: loosen grub screw (step 82), slide motor gear to align, retighten firmly.</li>\n<li><strong>3x Bolt M3 20mm</strong> (drawn: 3) through A core inner mounting ears into elbow, from the <strong>front</strong>.</li>\n<li>Picture: one top, one left side, one bottom.</li>\n</ol>\n<p><strong>Check:</strong> turn motor shaft (or gearbox output) by hand; all turns. Small play between motor gear and input gear, not zero.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Offer the gearbox to the elbow. The AG input gear must mesh with the AG motor gear below.</li>\n<li>If they do not line up, loosen the grub screw (step 82), slide the motor gear, retighten firmly.</li>\n<li>Fit <strong>3x Bolt M3x20</strong> through the A core inner ears into the elbow, from the <strong>front</strong>.</li>\n<li>One bolt top, one left, one bottom.</li>\n</ol>\n<p>Check everything turns, with a little play between the gears.</p>", "checks_simple": [], "ts": [71, 33, 26]}, {"stage": 5, "kind": "step", "n": 95, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-095.png", "html": "<ol>\n<li>The gearbox is fixed to the elbow. You can see the bolt heads at the top and on the right ear.</li>\n</ol>\n<p><strong>Check:</strong> the gearbox does not rock on the elbow.</p>", "html_pro": "<ol>\n<li>Gearbox fixed to elbow; bolt heads visible at top and on right ear.</li>\n</ol>\n<p><strong>Check:</strong> no rocking on elbow.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture: bolt heads at top and right ear.</p>\n<p>The gearbox does not rock.</p>", "checks_simple": [], "ts": [26, 0, 54]}, {"stage": 5, "kind": "step", "n": 96, "title": "Big bearing and A core outer", "img": "Attachments/Arctos/manual/arctos-step-096.png", "html": "<ol>\n<li>Take <strong>1x Bearing 61812</strong> (the \"(1) (1)\" in the label is a part number).</li>\n<li>Push it straight onto the gearbox's front ring. Keep it square.</li>\n<li>Slide the <strong>A core outer</strong> over the bearing.</li>\n<li>The <strong>\"▲A\"</strong> mark on the A core outer goes at the <strong>top</strong>, as in the picture. (unsure: which mark it lines up with.)</li>\n</ol>\n<p><strong>Check:</strong> the A core outer turns smoothly on the bearing. The bearing sits fully down.\n<strong>Tip:</strong> UM: if it does not go in straight, reprint. Sanding made his stick.</p>", "html_pro": "<ol>\n<li><strong>1x Bearing 61812</strong> (\"(1) (1)\" in label is a part number); push straight onto gearbox front ring, square.</li>\n<li><strong>A core outer</strong> over bearing.</li>\n<li><strong>\"▲A\"</strong> mark at <strong>top</strong> per picture. (unsure: which mark it lines up with.)</li>\n<li>Done.</li>\n</ol>\n<p><strong>Check:</strong> A core outer turns smoothly on bearing; bearing fully down.\n<strong>Tip:</strong> UM: if it does not go in straight, reprint; sanding made his stick.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take <strong>1x Bearing 61812</strong>.</li>\n<li>Push it straight onto the gearbox's front ring.</li>\n<li>Slide the <strong>A core outer</strong> over it.</li>\n<li>The <strong>\"▲A\"</strong> mark goes at the <strong>top</strong>.</li>\n</ol>\n<p>Check it turns smoothly and the bearing is fully down.</p>", "checks_simple": [], "ts": [2, 3, 54]}, {"stage": 5, "kind": "step", "n": 97, "title": "A core", "img": "Attachments/Arctos/manual/arctos-step-097.png", "html": "<ol>\n<li>Take the <strong>A core</strong> (the flat frame with a big centre hole).</li>\n<li>Hold it in front of the gearbox. The square lug block goes at <strong>top-left</strong>, the other at <strong>bottom-right</strong>, as in the picture.</li>\n</ol>\n<p><strong>Check:</strong> its holes line up with the holes on the front of the gearbox.</p>", "html_pro": "<ol>\n<li><strong>A core</strong> (flat frame, big centre hole).</li>\n<li>In front of gearbox; square lug block <strong>top-left</strong>, the other <strong>bottom-right</strong>, per picture.</li>\n</ol>\n<p><strong>Check:</strong> holes align with gearbox front holes.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>A core</strong>.</li>\n<li>Hold it in front of the gearbox: square lug block <strong>top-left</strong>, the other <strong>bottom-right</strong>.</li>\n</ol>\n<p>Check its holes line up with the gearbox holes.</p>", "checks_simple": [], "ts": [54, 18, 58]}, {"stage": 5, "kind": "step", "n": 98, "title": "Bolt the A core", "img": "Attachments/Arctos/manual/arctos-step-098.png", "html": "<ol>\n<li>Fit <strong>6x Bolt M3 20mm</strong> (drawn: 6). They go in from the <strong>front</strong>.</li>\n<li>Picture positions: 2 at the top, 1 on the left, 1 on the right, 2 at the bottom.</li>\n<li>UM \"golden rule\": <strong>press the A core against the bearing while you tighten.</strong> That removes the play.</li>\n<li>Tighten in a cross pattern.</li>\n</ol>\n<p><strong>Check:</strong> the A core turns with the gearbox. Wiggle the A core. There should be little or no free play.\n<strong>Note:</strong> UM said \"M3x20 is too long here\" at one point in his stream. His caption is garbled. (unsure which bolt he meant. Use the M3x20 shown, and stop if a bolt bottoms out.)</p>", "html_pro": "<ol>\n<li><strong>6x Bolt M3 20mm</strong> (drawn: 6) from the <strong>front</strong>.</li>\n<li>Picture: 2 top, 1 left, 1 right, 2 bottom.</li>\n<li>UM \"golden rule\": <strong>press A core against bearing while tightening</strong> to remove play.</li>\n<li>Tighten in cross pattern.</li>\n</ol>\n<p><strong>Check:</strong> A core turns with gearbox; wiggle it: little or no free play.\n<strong>Note:</strong> UM said \"M3x20 is too long here\" once in his stream; caption garbled. (unsure which bolt he meant. Use M3x20 shown; stop if a bolt bottoms out.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Fit <strong>6x Bolt M3x20</strong> from the front: 2 top, 1 left, 1 right, 2 bottom.</li>\n<li>Press the A core against the bearing while you tighten.</li>\n<li>Tighten in a cross pattern.</li>\n</ol>\n<p>Check there is little or no free play.</p>", "checks_simple": [], "ts": [2, 3, 26]}, {"stage": 5, "kind": "step", "n": 99, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-099.png", "html": "<ol>\n<li>The A core is bolted on. The output sun shows through the centre hole.</li>\n<li>Count the bolt heads: 6.</li>\n</ol>\n<p><strong>Check (final):</strong> turn the A core by hand. It rolls smoothly. The motor shaft turns with it, fast. No wire is pulled or pinched. Then go on to the B axis (step 101).</p>", "html_pro": "<ol>\n<li>A core bolted on; output sun visible through centre hole.</li>\n<li>Bolt heads: 6.</li>\n</ol>\n<p><strong>Check (final):</strong> turn A core by hand; rolls smoothly; motor shaft turns with it, fast; no wire pulled or pinched. Then B axis (step 101).</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture: A core bolted on with 6 bolt heads.</p>\n<p>Turn the A core by hand. It rolls smoothly and no wire is pinched. Then go to the B axis (step 101).</p>", "checks_simple": [], "ts": [71, 33, 26, 69, 70]}, {"stage": 5, "kind": "step", "n": 155, "title": "Fix a KYD003 endstop under the A axis at the place the red arrow…", "img": "Attachments/Arctos/manual/arctos-step-155.png", "html": "<p>Fix a KYD003 endstop under the A axis at the place the red arrow shows, with M2 screws. Parts: KYD003 endstop. Hardware: M2 screws. Note: \"M2 screws\"</p>", "moved": "Paper manual step 155. In the paper manual this is in the Limit switches section near the end (steps 146–159). It is done here, right after this joint, while you can still reach the spot.", "html_pro": "<p>Fix KYD003 endstop under A axis at red-arrow location with M2 screws. Parts: KYD003 endstop. Hardware: M2 screws. Note: \"M2 screws\"</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix the <strong>KYD003 endstop</strong> under the A axis, at the red arrow.</li>\n<li>Use M2 screws.</li>\n</ol>", "checks_simple": [], "ts": [58, 59, 61, 64, 26]}, {"stage": 5, "kind": "step", "n": 156, "title": "Result: the A endstop is fixed in its pocket", "img": "Attachments/Arctos/manual/arctos-step-156.png", "html": "<p>Result: the A endstop is fixed in its pocket. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: A endstop fixed in its pocket. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture: the A endstop sits fixed in its pocket.</p>", "checks_simple": [], "ts": [58, 59, 61, 64]}, {"stage": 5, "kind": "step", "n": 157, "title": "Put a magnet in the hole the red arrow shows, and another one on…", "img": "Attachments/Arctos/manual/arctos-step-157.png", "html": "<p>Put a magnet in the hole the red arrow shows, and another one on the other side of the robot. The limit switch reads these magnets. Parts: none labelled. Hardware: magnet. Note: \"Place magnet here and on the other side of the robot. They will be read by the limit shitch\" (the printed note says \"shitch\"; it means \"switch\")</p>", "html_pro": "<p>Magnet in red-arrow hole, another on the other side of the robot; limit switch reads them. Parts: none labelled. Hardware: magnet. Note: \"Place magnet here and on the other side of the robot. They will be read by the limit shitch\" (printed \"shitch\" = \"switch\")</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put a magnet in the hole at the red arrow.</li>\n<li>Put another magnet on the other side of the robot.</li>\n</ol>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 5, "kind": "wire", "key": "a-sensor", "title": "Connect the A limit sensor", "img": null, "html": "<ol>\n<li>The sensor sits in its pocket <strong>under the A axis</strong> (step 155), with M2 screws.</li>\n<li>Connect it to the \"A LIMIT\" lead.</li>\n<li>The magnet goes in the hole shown at step 157, <strong>and another one on the other side</strong>.</li>\n<li>The picture says KYD003, but the docs say A uses a <strong>WSH231</strong>. Use what came in your kit.</li>\n</ol>", "ov": ["li-A"], "bench": ["lim", "sensor", "com"], "drv": "42D", "grip": null, "conn": [["A sensor S", "\"A LIMIT\" lead → En", "blu", ""], ["Sensor + / −", "5 V / GND", "red", ""]], "checks": [], "html_pro": "<ol>\n<li>Sensor in pocket <strong>under A axis</strong> (step 155), M2 screws.</li>\n<li>Connect to \"A LIMIT\" lead.</li>\n<li>Magnet in hole shown at step 157, <strong>and another on the other side</strong>.</li>\n<li>Picture says KYD003; docs say A uses <strong>WSH231</strong>. Use what is in your kit.</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix the sensor under the A axis with M2 screws (step 155).</li>\n<li>Connect it to the \"A LIMIT\" lead.</li>\n<li>Put magnets in the hole from step 157 and on the other side.</li>\n<li>The docs say A uses a <strong>WSH231</strong>. Use what is in your kit.</li>\n</ol>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 5, "kind": "test", "key": "a-test", "title": "Test A", "img": null, "html": "", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["The gearbox turned freely before the motor drove it (step 93).", "Jog A ±10°, then home. It stops at the sensor.", "Roll A by hand. The wrist wires don't pull tight."], "html_pro": "", "checks_pro": ["Gearbox turned freely before motor drove it (step 93).", "Jog A ±10°, then home; stops at sensor.", "Roll A by hand; wrist wires not taut."], "html_simple": "", "checks_simple": ["Gearbox turned freely (step 93).", "Jog A ±10°, home, stops at sensor.", "Roll A: wrist wires not tight."], "ts": [54, 18, 58, 69]}, {"stage": 6, "kind": "test", "key": "w-before", "title": "Before you build the wrist", "img": null, "html": "<div class=\"callout important\">\n<div class=\"callout-title\">B and C work as a pair</div>\n<p>The wrist is a <strong>differential</strong>. Both motors the same way = one motion. Opposite ways = the other. So you always home and move B and C together.</p>\n</div>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["8 planets printed for the wrist (4 per side).", "Wrist gears sorted into one matched set per side. Don't mix L and R.", "Gear scale tested (99 % worked for one builder; for another, 100 % fixed tilting gears).", "You know the BR side is the mirror image of steps 107–140."], "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">B and C work as a pair</div>\n<p>Wrist is a <strong>differential</strong>: both motors same direction = one motion, opposite = the other. Always home and move B and C together.</p>\n</div>", "checks_pro": ["8 planets printed for wrist (4 per side).", "Wrist gears sorted into one matched set per side; no L/R mixing.", "Gear scale tested (99 % worked for one builder; 100 % fixed tilting gears for another).", "BR side is the mirror of steps 107–140."], "html_simple": "<div class=\"callout important\">\n<div class=\"callout-title\">B and C work as a pair</div>\n<p>Home and move B and C together.</p>\n</div>", "checks_simple": ["8 wrist planets printed (4 per side).", "Gears sorted per side, no L/R mix.", "Gear scale tested (99 % or 100 %).", "BR side mirrors steps 107–140."], "ts": [18, 28, 58, 69]}, {"stage": 6, "kind": "wire", "key": "BC-setup", "title": "Set up the B and C driver on the table", "img": null, "html": "<p>Do this before you build the wrist. Do it twice. It is the same job as the X driver (start of the X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>B and C</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 23 mm (two of them)</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x25</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>5 (B) and 6 (C)</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1200 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>B: 2x KY-003, <strong>Top</strong> = home. C: 1x WSH231</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with a meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue it to the centre of the shaft end. Let it dry. Fit the driver with the M3x25 bolts.</li>\n<li><strong>Power:</strong> check the polarity with a meter, then + to V+ and − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on the shaft. Set the menu like X, but <strong>CanID 5 (B) and 6 (C)</strong> and <strong>Ma about 1200 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on the bus.</li>\n<li><strong>Sensors:</strong> En = home, Dir = the other one. These only work after the <strong>remap and the COM jumper</strong> (same as Z): <code>05 9E 01 A4</code> (B), <code>06 9E 01 A5</code> (C).</li>\n</ol>", "ov": null, "bench": ["coil", "pwr", "can", "lim", "sensor", "com"], "drv": "42D", "grip": null, "conn": null, "checks": [], "html_pro": "<p>Before wrist build; do twice. Same job as X driver (start of X stage) with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>B and C</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 23 mm (two of them)</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x25</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>5 (B) and 6 (C)</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1200 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>B: 2x KY-003, <strong>Top</strong> = home. C: 1x WSH231</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with a meter (each under 10 Ω); coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue to centre of shaft end; dry; fit driver with M3x25 bolts.</li>\n<li><strong>Power:</strong> check polarity with meter, then + to V+, − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on shaft. Menu as X, but <strong>CanID 5 (B) and 6 (C)</strong>, <strong>Ma about 1200 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L; only this driver on the bus.</li>\n<li><strong>Sensors:</strong> En = home, Dir = the other. Work only after <strong>remap and COM jumper</strong> (same as Z): <code>05 9E 01 A4</code> (B), <code>06 9E 01 A5</code> (C).</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Do this twice, like the X driver, with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>B and C</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 17, 23 mm (two)</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO42D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x25</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>5 (B) and 6 (C)</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>about 1200 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>B: 2x KY-003, <strong>Top</strong> = home. C: 1x WSH231</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li>Find the two coil pairs with a meter. Coil 1 to A+ / A−, coil 2 to B+ / B−.</li>\n<li>Superglue the magnet to the centre of the shaft end. Fit the driver with the M3x25 bolts.</li>\n<li>Check polarity with a meter, then + to V+, − to Gnd.</li>\n<li>Cal with nothing on the shaft. Menu like X, but <strong>CanID 5 (B) and 6 (C)</strong>, <strong>Ma about 1200 mA</strong>.</li>\n<li>CAN: CANable H to H, L to L. Only this driver on the bus.</li>\n<li>Sensors: En = home, Dir = the other. Needs the remap and COM jumper (same as Z): <code>05 9E 01 A4</code> (B), <code>06 9E 01 A5</code> (C).</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Reversed power</div>\n<p>Check polarity before you power on.</p>\n</div>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 6, "kind": "test", "key": "BC-check", "title": "Test the B and C driver before it goes in", "img": null, "html": "<p>Same tests as X. Fix anything now: the driver is hard to reach later.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["\"Cal success\", and the settings survive a power cycle.", "It answers on ID 5 (B) and 6 (C). Read encoder (<code>31</code>) changes when you turn the shaft.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): it stops when you trigger the home sensor by hand."], "html_pro": "<p>Same tests as X. Fix now; driver is hard to reach later.</p>", "checks_pro": ["\"Cal success\"; settings survive power cycle.", "Answers on ID 5 (B) and 6 (C). Read encoder (<code>31</code>) changes with shaft turn.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): stops when home sensor is triggered by hand."], "html_simple": "<p>Test it like the X driver. Fix problems now: you can't reach it later.</p>", "checks_simple": ["\"Cal success\"; settings survive power cycle", "Answers on ID 5 (B) and 6 (C); <code>31</code> changes when you turn the shaft", "Each sensor LED lights with its marked magnet face", "<code>91</code>: stops when you trigger the home sensor"], "ts": [18, 28, 58, 69]}, {"stage": 6, "kind": "step", "n": 101, "title": "Bearings into the B core", "img": "Attachments/Arctos/manual/arctos-step-101.png", "html": "<ol>\n<li>Find the <strong>B core</strong>. It is the U-shaped part with \"B\" and \"C\" moulded on top.</li>\n<li>Press one <strong>Bearing 61803</strong> into the round hole on each side wall. Drawn: 2.</li>\n<li>Push them in straight and fully flat.</li>\n</ol>\n<p><strong>Check:</strong> both bearings sit flush. Each inner ring turns freely with a finger.</p>", "html_pro": "<ol>\n<li><strong>B core</strong> (U-shaped, \"B\" and \"C\" moulded on top).</li>\n<li>Press <strong>Bearing 61803</strong> into the round hole in each side wall. Drawn: 2.</li>\n<li>Seat straight and flat.</li>\n</ol>\n<p><strong>Check:</strong> both flush; inner rings turn freely by finger.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Find the <strong>B core</strong> (U-shaped, \"B\" and \"C\" on top).</li>\n<li>Press one <strong>Bearing 61803</strong> into the round hole on each side wall (2x).</li>\n<li>Push them in straight and flat.</li>\n</ol>\n<p>Check: both sit flush and turn freely.</p>", "checks_simple": [], "ts": [2, 3, 32]}, {"stage": 6, "kind": "step", "n": 102, "title": "Close view", "img": "Attachments/Arctos/manual/arctos-step-102.png", "html": "<ol>\n<li>Same as step 101, seen closer. Nothing new to fit.</li>\n</ol>", "html_pro": "<ol>\n<li>Step 101, close view. Nothing new to fit.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>", "checks_simple": [], "ts": [18, 28, 58]}, {"stage": 6, "kind": "step", "n": 103, "title": "B bevel gear L and its nuts", "img": "Attachments/Arctos/manual/arctos-step-103.png", "html": "<ol>\n<li>Find <strong>B bevel gear L</strong>. Its flat face has 3 hexagon pockets.</li>\n<li>Press one <strong>Nut M3</strong> into each pocket. Drawn: 3.</li>\n<li>Put gear L inside the B core, on the side wall that faces the <strong>BR core</strong>.</li>\n<li>The teeth point <strong>inward</strong>, toward the middle of the B core. The nut face also faces inward.</li>\n<li>Its hub sits in that wall's 61803 bearing.</li>\n</ol>\n<p><strong>Check:</strong> the 3 nuts stay in their pockets. A drop of superglue or a bit of tape helps if they fall out.</p>\n<p>Tip: these nuts take the bolts from the BR timing pulley later. (unsure: bolt size; not drawn.)</p>", "html_pro": "<ol>\n<li><strong>B bevel gear L</strong>: 3 hex pockets on the flat face.</li>\n<li>Press <strong>Nut M3</strong> into each pocket. Drawn: 3.</li>\n<li>Place gear L in the B core, on the side wall facing the <strong>BR core</strong>.</li>\n<li>Teeth <strong>inward</strong>, toward the B core middle; nut face also inward.</li>\n<li>Hub sits in that wall's 61803 bearing.</li>\n</ol>\n<p><strong>Check:</strong> 3 nuts stay in their pockets. Superglue or tape if they fall out.</p>\n<p>Tip: these nuts take the BR timing pulley bolts later. (unsure: bolt size; not drawn.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Find <strong>B bevel gear L</strong>. Its flat face has 3 hexagon pockets.</li>\n<li>Press one <strong>Nut M3</strong> into each pocket (3x).</li>\n<li>Put gear L inside the B core, on the wall facing the <strong>BR core</strong>.</li>\n<li>Teeth and nut face point <strong>inward</strong>.</li>\n<li>Its hub sits in that wall's 61803 bearing.</li>\n</ol>\n<p>Check: the 3 nuts stay in their pockets.</p>", "checks_simple": [], "ts": [2, 3, 32, 26]}, {"stage": 6, "kind": "step", "n": 104, "title": "B bevel gear R", "img": "Attachments/Arctos/manual/arctos-step-104.png", "html": "<ol>\n<li>Find <strong>B bevel gear R</strong>. It has a round shaft with 3 holes in its end.</li>\n<li>Pass it into the open middle of the B core.</li>\n<li>Push its shaft out through the bearing in the <strong>other</strong> wall (the BL side). Step 105 shows the shaft end sticking out.</li>\n<li>Teeth point inward, facing gear L.</li>\n</ol>\n<p><strong>Check:</strong> gear R's shaft turns in the bearing without rubbing the wall.</p>", "html_pro": "<ol>\n<li><strong>B bevel gear R</strong> (round shaft, 3 holes in the end).</li>\n<li>Pass into the open middle of the B core.</li>\n<li>Shaft out through the bearing in the <strong>other</strong> wall (BL side). Step 105 shows the shaft end protruding.</li>\n<li>Teeth inward, facing gear L.</li>\n</ol>\n<p><strong>Check:</strong> gear R shaft turns in the bearing, no wall rub.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Find <strong>B bevel gear R</strong> (round shaft with 3 holes in its end).</li>\n<li>Pass it into the open middle of the B core.</li>\n<li>Push its shaft out through the bearing in the <strong>other</strong> wall (BL side).</li>\n<li>Teeth point inward, facing gear L.</li>\n</ol>\n<p>Check: the shaft turns without rubbing.</p>", "checks_simple": [], "ts": [2, 3, 32]}, {"stage": 6, "kind": "step", "n": 105, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-105.png", "html": "<ol>\n<li>Both side bevel gears now face each other inside the B core.</li>\n<li>The 3-hole shaft end of gear R sticks out on the BL side.</li>\n</ol>\n<p><strong>Check:</strong> spin each bevel gear by hand. Each turns freely in its own bearing. They do not mesh with each other directly. The C bevel gear joins them later (step 142).</p>\n<p>(unsure: the old caption said gear L and R teeth \"meet\". In the picture they face each other across the gap. They only connect through the C gear.)</p>", "html_pro": "<ol>\n<li>Both side bevel gears face each other inside the B core.</li>\n<li>Gear R's 3-hole shaft end protrudes on the BL side.</li>\n</ol>\n<p><strong>Check:</strong> spin each bevel gear by hand; each turns freely in its own bearing. No direct mesh between them. The C bevel gear joins them later (step 142).</p>\n<p>(unsure: old caption said gear L and R teeth \"meet\". In the picture they face each other across the gap and connect only through the C gear.)</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>\n<ul>\n<li>Gear L and R face each other; R's 3-hole shaft sticks out on the BL side.</li>\n<li>Each turns freely.</li>\n</ul>", "checks_simple": [], "ts": [2, 3, 32]}, {"stage": 6, "kind": "step", "n": 106, "title": "B limit magnet", "img": "Attachments/Arctos/manual/arctos-step-106.png", "html": "<ol>\n<li>Press one 3x3 <strong>magnet</strong> into the small hole on the top corner of the B core (red arrow).</li>\n<li>Glue it if it is loose.</li>\n</ol>\n<p><strong>Check:</strong> the magnet is flush and does not stick out to rub anything.</p>\n<p>Tip: the B limit sensors (step 158) read this magnet. \"BC min magnet / BC max magnet … is read by this sensor.\" [3D] Mark which pole faces out. Unexpected Maker glued magnets in the wrong way round and had to reprint. [UM]</p>", "html_pro": "<ol>\n<li>Press 3x3 <strong>magnet</strong> into the small hole on the B core top corner (red arrow).</li>\n<li>Glue if loose.</li>\n</ol>\n<p><strong>Check:</strong> flush, no protrusion or rubbing.</p>\n<p>Tip: B limit sensors (step 158) read this magnet. \"BC min magnet / BC max magnet … is read by this sensor.\" [3D] Mark which pole faces out; Unexpected Maker glued magnets backwards and had to reprint. [UM]</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Press one 3x3 <strong>magnet</strong> into the small hole on the top corner of the B core (red arrow).</li>\n<li>Glue it if loose.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Mark the magnet pole</div>\n<p>Note which pole faces out before gluing; a wrong-way magnet means a reprint.</p>\n</div>\n<p>Check: the magnet is flush.</p>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 6, "kind": "step", "n": 107, "title": "Bearing into the BL motor holder", "img": "Attachments/Arctos/manual/arctos-step-107.png", "html": "<ol>\n<li>Find the <strong>BL motor holder</strong>. It is moulded \"BLMH\" and \"ID5\".</li>\n<li>Press one <strong>Bearing 61803</strong> into its round hole (the upper hole of the figure-8 opening). Drawn: 1.</li>\n</ol>\n<p><strong>Check:</strong> the bearing is flat and turns freely.</p>", "html_pro": "<ol>\n<li><strong>BL motor holder</strong> (moulded \"BLMH\", \"ID5\").</li>\n<li>Press <strong>Bearing 61803</strong> into the round hole (upper hole of the figure-8 opening). Drawn: 1.</li>\n</ol>\n<p><strong>Check:</strong> bearing flat, turns freely.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Find the <strong>BL motor holder</strong> (\"BLMH\", \"ID5\").</li>\n<li>Press one <strong>Bearing 61803</strong> into its upper round hole (1x).</li>\n</ol>\n<p>Check: bearing flat, turns freely.</p>", "checks_simple": [], "ts": [2, 3, 32, 71, 33]}, {"stage": 6, "kind": "step", "n": 108, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-108.png", "html": "<ol>\n<li>The bearing sits in the holder. Nothing new to fit.</li>\n</ol>", "html_pro": "<ol>\n<li>Bearing seated in holder. Nothing new to fit.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>", "checks_simple": [], "ts": [2, 3, 32]}, {"stage": 6, "kind": "step", "n": 109, "title": "Motor gear and gearbox gear", "img": "Attachments/Arctos/manual/arctos-step-109.png", "html": "<ol>\n<li>Remove the top ring of the <strong>GT2B5W6</strong> pulley if you have not yet. [3D: \"GT2 pulley without top ring\"]</li>\n<li>Press the pulley into the <strong>BCGR/BCGL motor gear</strong> (the small gear). The pulley teeth fit the gear's inside teeth. \"The press fit is very tight.\" [UM]</li>\n<li>Find the <strong>BCGL gearbox gear</strong> (the larger gear). It goes in the 61803 bearing of the holder, on the gearbox side.</li>\n<li>The <strong>M3x15</strong> bolts shown (drawn: 2) fix the gearbox gear to the input sun later, in steps 129–131.</li>\n</ol>\n<p><strong>Check:</strong> the pulley is pressed fully into the motor gear, flat and centred.</p>\n<p>(unsure: the picture shows parts only, with no arrows. The 3D viewer lists \"Bolt M3 15mm\" right next to \"BCGL gearbox gear\", which fits steps 129–131.)</p>", "html_pro": "<ol>\n<li>Remove the top ring of the <strong>GT2B5W6</strong> pulley if not done. [3D: \"GT2 pulley without top ring\"]</li>\n<li>Press pulley into the <strong>BCGR/BCGL motor gear</strong> (small gear); pulley teeth engage the gear's inner teeth. \"The press fit is very tight.\" [UM]</li>\n<li><strong>BCGL gearbox gear</strong> (larger) goes in the holder's 61803 bearing, gearbox side.</li>\n<li><strong>M3x15</strong> bolts shown (drawn: 2) fix the gearbox gear to the input sun later, steps 129–131.</li>\n</ol>\n<p><strong>Check:</strong> pulley fully pressed into motor gear, flat and centred.</p>\n<p>(unsure: picture shows parts only, no arrows. The 3D viewer lists \"Bolt M3 15mm\" next to \"BCGL gearbox gear\", consistent with steps 129–131.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Remove the top ring of the <strong>GT2B5W6</strong> pulley.</li>\n<li>Press the pulley fully into the <strong>BCGR/BCGL motor gear</strong> (small gear). Very tight fit.</li>\n<li>Find the <strong>BCGL gearbox gear</strong> (larger). It goes in the 61803 bearing of the holder, gearbox side.</li>\n<li>Keep 2 <strong>M3x15</strong> bolts for steps 129-131.</li>\n</ol>\n<p>Check: pulley flat and centred in the motor gear.</p>", "checks_simple": [], "ts": [2, 3, 32, 28, 30, 71]}, {"stage": 6, "kind": "wire", "key": "w-wire", "title": "Wire both wrist drivers now, before step 110", "img": null, "html": "<div class=\"callout danger\">\n<div class=\"callout-title\">The terminals can't be reached once the wrist is built</div>\n<p>They face sideways inside the wrist.</p>\n</div>\n<ol>\n<li>Coils, power, <strong>CAN in</strong> and <strong>CAN out</strong> on each 42D. The chain is <strong>B → C → gripper MCP2515</strong>.</li>\n<li>Limit leads: B has 2 boards (<strong>Top = home</strong>). C has 1 board (WSH231).</li>\n<li><strong>B = CAN ID 5</strong> (the left holder is moulded \"ID5\"). <strong>C = CAN ID 6.</strong> Remaps <code>05 9E 01 A4</code> and <code>06 9E 01 A5</code>, plus the COM jumpers.</li>\n<li><strong>Label every end</strong> (\"B CAN in\", \"B CAN out\", \"B lim\" …).</li>\n<li>Leave tails long enough to reach along the forearm.</li>\n</ol>", "ov": ["pr-B", "dB", "mB", "pd-B", "cc-B", "co-B", "pr-C", "dC", "mC", "pd-C", "cc-C", "co-C"], "bench": null, "drv": "42D", "grip": null, "conn": [["Wago +V", "driver V+", "red", ""], ["Wago GND", "driver Gnd", "blk", ""], ["A CAN out", "B CAN in", "yel", ""], ["B CAN out", "C CAN in", "yel", ""], ["C CAN out", "towards the MCP2515", "grn", "labelled"], ["B limit leads ×2", "B En / Dir", "blu", "Top = home"], ["C limit lead", "C En", "blu", ""]], "checks": [], "html_pro": "<div class=\"callout danger\">\n<div class=\"callout-title\">Terminals unreachable once the wrist is built</div>\n<p>They face sideways inside the wrist.</p>\n</div>\n<ol>\n<li>Per 42D: coils, power, <strong>CAN in</strong>, <strong>CAN out</strong>. Chain: <strong>B → C → gripper MCP2515</strong>.</li>\n<li>Limit leads: B 2 boards (<strong>Top = home</strong>); C 1 board (WSH231).</li>\n<li><strong>B = CAN ID 5</strong> (left holder moulded \"ID5\"); <strong>C = CAN ID 6</strong>. Remaps <code>05 9E 01 A4</code> and <code>06 9E 01 A5</code>, plus COM jumpers.</li>\n<li><strong>Label every end</strong> (\"B CAN in\", \"B CAN out\", \"B lim\" …).</li>\n<li>Leave tails long enough to reach along the forearm.</li>\n</ol>", "checks_pro": [], "html_simple": "<div class=\"callout danger\">\n<div class=\"callout-title\">Wire now</div>\n<p>You can't reach the terminals once the wrist is built.</p>\n</div>\n<ol>\n<li>Wire coils, power, <strong>CAN in</strong> and <strong>CAN out</strong> on each 42D. Chain: <strong>B → C → gripper MCP2515</strong>.</li>\n<li>B has 2 limit boards (<strong>Top = home</strong>). C has 1 (WSH231).</li>\n<li><strong>B = CAN ID 5</strong> (holder says \"ID5\"). <strong>C = CAN ID 6.</strong> Set <code>05 9E 01 A4</code> and <code>06 9E 01 A5</code>, plus the COM jumpers.</li>\n<li>Label every end (\"B CAN in\", \"B CAN out\", \"B lim\").</li>\n<li>Leave tails long enough to reach along the forearm.</li>\n</ol>", "checks_simple": [], "ts": [58, 59, 61, 64, 69, 70]}, {"stage": 6, "kind": "step", "n": 110, "title": "Fit the motor", "img": "Attachments/Arctos/manual/arctos-step-110.png", "html": "<div class=\"callout danger\">\n<div class=\"callout-title\">🔌 WIRE NOW: before steps 110–111</div>\n<ol>\n<li>Connect the motor coil wires to the 42D motor terminal (A+ A− B+ B−). Find coil pairs first: short two wires and turn the shaft; if it resists, they are one coil. [Docs]</li>\n<li>Fit the <strong>power</strong> leads (V+ and GND) and <strong>CAN in</strong> (H, L) to the 42D.</li>\n<li>Fit a <strong>CAN out</strong> lead (H, L) to the B driver. It goes on to the C driver, then to the gripper MCP2515.</li>\n<li>Fit a lead to the limit input you will use for the B sensors (IN_1, and IN_2 after the remap). [Docs: 42D needs the remap command for two limits]</li>\n<li>Leave tails long enough to reach along the forearm. Label each end (\"B CAN in\", \"B CAN out\", \"B lim\").</li>\n<li>Twist the wire strands before they go in the terminals. Unexpected Maker had to redo one stray strand. [UM]</li>\n</ol>\n</div>\n<ol>\n<li>Put the <strong>Nema_17_23mm</strong> motor onto the holder from the back. The shaft goes through the lower opening.</li>\n<li>Slide the motor gear onto the shaft.</li>\n<li>Tighten the pulley's set screw onto the flat of the shaft.</li>\n</ol>\n<p><strong>Check:</strong> the motor gear meshes with the gearbox gear. Turn the motor shaft by hand. The gearbox gear turns smoothly.</p>\n<p>(unsure: the order of motor gear and motor. The picture shows the motor going on with the gear already in the holder.)</p>", "html_pro": "<div class=\"callout danger\">\n<div class=\"callout-title\">🔌 WIRE NOW: before steps 110–111</div>\n<ol>\n<li>Motor coils to the 42D terminal (A+ A− B+ B−). Find coil pairs first: short two wires and turn the shaft; resistance means one coil. [Docs]</li>\n<li><strong>Power</strong> (V+, GND) and <strong>CAN in</strong> (H, L) to the 42D.</li>\n<li><strong>CAN out</strong> (H, L) on the B driver, on to the C driver, then the gripper MCP2515.</li>\n<li>Lead to the limit input for the B sensors (IN_1, and IN_2 after the remap). [Docs: 42D needs the remap command for two limits]</li>\n<li>Tails long enough to reach along the forearm. Label each end (\"B CAN in\", \"B CAN out\", \"B lim\").</li>\n<li>Twist wire strands before inserting in terminals; Unexpected Maker redid one stray strand. [UM]</li>\n</ol>\n</div>\n<ol>\n<li><strong>Nema_17_23mm</strong> motor onto the holder from the back; shaft through the lower opening.</li>\n<li>Slide motor gear onto shaft.</li>\n<li>Tighten the pulley set screw on the shaft flat.</li>\n</ol>\n<p><strong>Check:</strong> motor gear meshes with gearbox gear; turn the motor shaft by hand, gearbox gear turns smoothly.</p>\n<p>(unsure: order of motor gear and motor. Picture shows the motor going on with the gear already in the holder.)</p>", "checks_pro": [], "html_simple": "<div class=\"callout danger\">\n<div class=\"callout-title\">Wire now, before steps 110-111</div>\n<p>You can't reach the terminals later.</p>\n</div>\n<ol>\n<li>Wire the motor coils to the 42D (A+ A- B+ B-).</li>\n<li>Wire <strong>power</strong> (V+, GND) and <strong>CAN in</strong> (H, L) to the 42D.</li>\n<li>Wire <strong>CAN out</strong> (H, L) from the B driver on to the C driver.</li>\n<li>Wire a lead to the limit input for the B sensors (IN_1, later IN_2).</li>\n<li>\n<p>Leave long tails and label each end.</p>\n</li>\n<li>\n<p>Put the <strong>Nema_17_23mm</strong> motor on the holder from the back. Shaft goes through the lower opening.</p>\n</li>\n<li>Slide the motor gear onto the shaft.</li>\n<li>Tighten the pulley set screw onto the flat of the shaft.</li>\n</ol>\n<p>Check: motor gear meshes with the gearbox gear and turns smoothly by hand.</p>", "checks_simple": [], "ts": [16, 32, 58, 59, 61, 64]}, {"stage": 6, "kind": "step", "n": 111, "title": "MKS SERVO42D", "img": "Attachments/Arctos/manual/arctos-step-111.png", "html": "<ol>\n<li>Put the <strong>MKS Servo 42D</strong> on the back of the motor.</li>\n<li>Put an <strong>M3 x 25 mm</strong> bolt through each of the 4 corner holes (red arrows). Drawn: 4 arrows.</li>\n<li>The bolts go through the driver into the motor body.</li>\n<li>Tighten them evenly. Unexpected Maker suggests washers. [MKS video]</li>\n</ol>\n<p><strong>Check:</strong> the driver sits flat. Its encoder chip is centred over the shaft magnet. All wires from the 🔌 box come out free and are not pinched.</p>", "html_pro": "<ol>\n<li><strong>MKS Servo 42D</strong> on the motor back.</li>\n<li><strong>M3 x 25 mm</strong> through each of the 4 corner holes (red arrows). Drawn: 4 arrows.</li>\n<li>Bolts pass through the driver into the motor body.</li>\n<li>Tighten evenly; Unexpected Maker suggests washers. [MKS video]</li>\n</ol>\n<p><strong>Check:</strong> driver flat; encoder chip centred over the shaft magnet; all wires from the 🔌 box free, not pinched.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>MKS Servo 42D</strong> on the back of the motor.</li>\n<li>Put an <strong>M3 x 25 mm</strong> bolt through each of the 4 corner holes (red arrows).</li>\n<li>Tighten them evenly.</li>\n</ol>\n<p>Check: driver flat, encoder chip centred over the shaft magnet, wires free and not pinched.</p>", "checks_simple": [], "ts": [62, 54, 63, 71, 33, 26]}, {"stage": 6, "kind": "step", "n": 112, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-112.png", "html": "<ol>\n<li>The B motor and its driver are on the holder.</li>\n</ol>\n<p><strong>Check:</strong> connect power and CAN on the bench. The 42D powers up and answers on CAN ID 5. This is the last easy moment to test it.</p>", "html_pro": "<ol>\n<li>B motor and driver on the holder.</li>\n</ol>\n<p><strong>Check:</strong> connect power and CAN on the bench; 42D powers up and answers on CAN ID 5. Last easy moment to test.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>\n<p>Check: on the bench, power and CAN on; the 42D answers on CAN ID 5.</p>", "checks_simple": [], "ts": [71, 33, 18]}, {"stage": 6, "kind": "step", "n": 113, "title": "Bolt the motor to the holder", "img": "Attachments/Arctos/manual/arctos-step-113.png", "html": "<ol>\n<li>Turn the holder over to the gearbox side.</li>\n<li>Put one <strong>Bolt M3 x 15 mm</strong> through each of the 4 <strong>slotted</strong> holes around the motor gear. Drawn: 4.</li>\n<li>These bolts go into the <strong>motor's</strong> threaded holes. They hold the motor to the holder. (The old caption said they fix the holder to the wrist. That is wrong. Unexpected Maker confirms \"4x M3x15 for the motor\". [UM])</li>\n<li>Do not tighten yet.</li>\n</ol>\n<p><strong>Check:</strong> the motor can still slide a little in the slots.</p>", "html_pro": "<ol>\n<li>Flip the holder to the gearbox side.</li>\n<li><strong>Bolt M3 x 15 mm</strong> through each of the 4 <strong>slotted</strong> holes around the motor gear. Drawn: 4.</li>\n<li>Bolts thread into the <strong>motor's</strong> holes and hold the motor to the holder. (Old caption said holder to wrist; wrong. Unexpected Maker confirms \"4x M3x15 for the motor\". [UM])</li>\n<li>Leave loose.</li>\n</ol>\n<p><strong>Check:</strong> motor still slides slightly in the slots.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the holder over to the gearbox side.</li>\n<li>Put one <strong>Bolt M3 x 15 mm</strong> through each of the 4 <strong>slotted</strong> holes around the motor gear (4x).</li>\n<li>Do not tighten yet.</li>\n</ol>\n<p>Check: the motor still slides a little in the slots.</p>", "checks_simple": [], "ts": [71, 33, 26]}, {"stage": 6, "kind": "step", "n": 114, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-114.png", "html": "<ol>\n<li>The 4 bolts are in the slots, still loose.</li>\n</ol>", "html_pro": "<ol>\n<li>4 bolts in the slots, loose.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture: 4 bolts in the slots, loose.</p>", "checks_simple": [], "ts": [26, 0, 18]}, {"stage": 6, "kind": "step", "n": 115, "title": "Tighten (gently)", "img": "Attachments/Arctos/manual/arctos-step-115.png", "html": "<ol>\n<li>Slide the motor so the motor gear meshes fully with the gearbox gear. Do not force it so tight that it binds.</li>\n<li>Tighten the 4 bolts \"all the way. Not too hard because motor housing is made out of aluminum and the threads might be damaged.\" [Manual]</li>\n</ol>\n<p><strong>Check:</strong> turn the gearbox gear by hand. It turns the motor with no binding and no gap you can feel.</p>\n<p>(unsure: the manual note ends \"only tight enough so that the belt can't skip\". That text is from the older belt design. The current design uses two helical gears here, so there is no belt at this point. [UM: \"no more tensioning issue … there's no belt\"])</p>", "html_pro": "<ol>\n<li>Slide the motor until the motor gear fully meshes with the gearbox gear; do not force into binding.</li>\n<li>Tighten the 4 bolts \"all the way. Not too hard because motor housing is made out of aluminum and the threads might be damaged.\" [Manual]</li>\n</ol>\n<p><strong>Check:</strong> turn the gearbox gear by hand; it turns the motor with no binding and no felt gap.</p>\n<p>(unsure: the manual note ends \"only tight enough so that the belt can't skip\". That is from the older belt design. Current design uses two helical gears here, no belt. [UM: \"no more tensioning issue … there's no belt\"])</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Slide the motor so the motor gear meshes fully with the gearbox gear, without binding.</li>\n<li>Tighten the 4 bolts, but not too hard: the aluminium threads can strip.</li>\n</ol>\n<p>Check: the gearbox gear turns the motor with no binding and no gap.</p>", "checks_simple": [], "ts": [28, 30, 71, 33, 26]}, {"stage": 6, "kind": "step", "n": 116, "title": "The BL core", "img": "Attachments/Arctos/manual/arctos-step-116.png", "html": "<ol>\n<li>Find the <strong>BL core</strong> (the long left side plate). It has a big ring gear with teeth on the inside.</li>\n<li>The picture shows the BL core already sitting over the motor holder on the forearm. No label or bolts are shown.</li>\n</ol>\n<p>(unsure: when the BL core is fixed. It looks loosely placed here. Steps 120–123 show it pulled away again, and step 134 bolts the unit on.)</p>", "html_pro": "<ol>\n<li><strong>BL core</strong> (long left side plate, internal ring gear).</li>\n<li>Picture shows it sitting over the motor holder on the forearm; no label or bolts shown.</li>\n</ol>\n<p>(unsure: when the BL core is fixed. Looks loosely placed. Steps 120–123 show it pulled away again; step 134 bolts the unit on.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Find the <strong>BL core</strong> (long left side plate with the big inside-toothed ring gear).</li>\n<li>Check it looks like the picture.</li>\n</ol>", "checks_simple": [], "ts": [20, 21, 25, 27, 71, 33]}, {"stage": 6, "kind": "step", "n": 117, "title": "Bearing and GT2 timing pulley", "img": "Attachments/Arctos/manual/arctos-step-117.png", "html": "<ol>\n<li>Press one <strong>Bearing 61803</strong> into the round boss at the narrow (wrist) end of the BL core. Drawn: 1.</li>\n<li>Put the <strong>GT2 Timing Pulley</strong> onto that bearing. Its small triangle boss with 3 holes faces <strong>out</strong>.</li>\n</ol>\n<p><strong>Check:</strong> the pulley spins freely on the bearing and does not wobble. \"BCG GT2 pulleys wobble\" is a known community mod topic. [Community]</p>", "html_pro": "<ol>\n<li>Press <strong>Bearing 61803</strong> into the round boss at the narrow (wrist) end of the BL core. Drawn: 1.</li>\n<li><strong>GT2 Timing Pulley</strong> onto that bearing; small triangle boss with 3 holes faces <strong>out</strong>.</li>\n</ol>\n<p><strong>Check:</strong> pulley spins freely, no wobble. \"BCG GT2 pulleys wobble\" is a known community mod topic. [Community]</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Press one <strong>Bearing 61803</strong> into the round boss at the narrow (wrist) end of the BL core (1x).</li>\n<li>Put the <strong>GT2 Timing Pulley</strong> on that bearing, small triangle boss with 3 holes facing <strong>out</strong>.</li>\n</ol>\n<p>Check: pulley spins freely, no wobble.</p>", "checks_simple": [], "ts": [2, 3, 32, 28, 30]}, {"stage": 6, "kind": "step", "n": 118, "title": "Middle planets (the 90° rule)", "img": "Attachments/Arctos/manual/arctos-step-118.png", "html": "<ol>\n<li>Put the 4 <strong>BCGR middle planetary</strong> gears into the ring gear. Drawn: 4.</li>\n<li>Each planet has <strong>2 holes</strong>. \"Each one is rotated 90° with respect to previous/next one.\" [Manual]</li>\n<li>In step 119 the holes go: top planet side-by-side, right planet one-above-the-other, bottom side-by-side, left one-above-the-other.</li>\n<li>Seen from the centre, every hole pair lies <strong>across</strong> the radius. The 8 holes form a square around the middle. \"Make sure that these holes are arranged exactly as in the image forming a rectangle. Otherwise the gearbox will not spin.\" [3D]</li>\n</ol>\n<p><strong>Check:</strong> the 4 planets are <strong>equally spaced</strong>. Uneven gaps mean one is a tooth off. Lift it out and re-seat it. \"If you're off by a single tooth that's going to make the whole thing bind.\" [Alberto]</p>", "html_pro": "<ol>\n<li>4 <strong>BCGR middle planetary</strong> gears into the ring gear. Drawn: 4.</li>\n<li>Each planet has <strong>2 holes</strong>; \"Each one is rotated 90° with respect to previous/next one.\" [Manual]</li>\n<li>Step 119 hole order: top side-by-side, right one-above-the-other, bottom side-by-side, left one-above-the-other.</li>\n<li>From the centre, every hole pair lies <strong>across</strong> the radius; the 8 holes form a square around the middle. \"Make sure that these holes are arranged exactly as in the image forming a rectangle. Otherwise the gearbox will not spin.\" [3D]</li>\n</ol>\n<p><strong>Check:</strong> the 4 planets <strong>equally spaced</strong>. Uneven gaps = one a tooth off; lift out and re-seat. \"If you're off by a single tooth that's going to make the whole thing bind.\" [Alberto]</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the 4 <strong>BCGR middle planetary</strong> gears into the ring gear (4x).</li>\n<li>Each has <strong>2 holes</strong>; rotate each 90° from the one before.</li>\n<li>Match step 119: top side-by-side, right one-above-the-other, bottom side-by-side, left one-above-the-other.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Hole pattern</div>\n<p>The 8 holes must form a square around the middle, or the gearbox will not spin.</p>\n</div>\n<p>Check: the 4 planets are equally spaced. Uneven gap means one is a tooth off: lift out and re-seat.</p>", "checks_simple": [], "ts": [18, 19, 22, 23, 20, 21]}, {"stage": 6, "kind": "step", "n": 119, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-119.png", "html": "<ol>\n<li>Compare your hole pattern with this picture before going on.</li>\n</ol>", "html_pro": "<ol>\n<li>Compare hole pattern with this picture before proceeding.</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Check your hole pattern matches the picture before going on.</p>", "checks_simple": [], "ts": [18, 28, 58]}, {"stage": 6, "kind": "step", "n": 120, "title": "Input sun (from the other side)", "img": "Attachments/Arctos/manual/arctos-step-120.png", "html": "<ol>\n<li>Turn to the motor-holder side of the BL core. The picture pulls the BL core away from the holder to show this face.</li>\n<li>Put the <strong>BCGR input sun</strong> into the centre of the planets. Its round flange with 3 holes faces the motor holder.</li>\n</ol>\n<p><strong>Check:</strong> the sun meshes with all 4 planets.</p>\n<p>Tip: \"The input sun is not retained yet, so do not spin the assembly.\" [Alberto] Trick: push the ring from below so it opens a little, drop the sun in, then let it close. [Alberto]</p>", "html_pro": "<ol>\n<li>Go to the motor-holder side of the BL core; picture pulls the core away from the holder to show this face.</li>\n<li><strong>BCGR input sun</strong> into the centre of the planets; round flange with 3 holes faces the motor holder.</li>\n</ol>\n<p><strong>Check:</strong> sun meshes with all 4 planets.</p>\n<p>Tip: \"The input sun is not retained yet, so do not spin the assembly.\" [Alberto] Trick: push the ring from below so it opens slightly, drop the sun in, let it close. [Alberto]</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn to the motor-holder side of the BL core.</li>\n<li>Put the <strong>BCGR input sun</strong> into the centre of the planets, round 3-hole flange facing the motor holder.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Not held yet</div>\n<p>Don't spin the assembly.</p>\n</div>\n<p>Check: the sun meshes with all 4 planets.</p>", "checks_simple": [], "ts": [18, 19, 22, 23, 71, 33]}, {"stage": 6, "kind": "step", "n": 121, "title": "Input planets", "img": "Attachments/Arctos/manual/arctos-step-121.png", "html": "<ol>\n<li>Put the 4 <strong>BCGR input planetary</strong> gears onto the middle planets, on this side. Drawn: 4.</li>\n<li>Turn each one until its 2 holes line up with the 2 holes in the middle planet below it.</li>\n</ol>\n<p><strong>Check:</strong> each input planet sits flat on its middle planet, with holes aligned.</p>\n<p>Tip: if the holes are \"half a hole out\", turn that planet 180°. The holes are off-centre. [UM, A axis]</p>", "html_pro": "<ol>\n<li>4 <strong>BCGR input planetary</strong> gears onto the middle planets, this side. Drawn: 4.</li>\n<li>Rotate each until its 2 holes align with the 2 holes in the middle planet below.</li>\n</ol>\n<p><strong>Check:</strong> each input planet flat on its middle planet, holes aligned.</p>\n<p>Tip: if holes are \"half a hole out\", rotate that planet 180°; the holes are off-centre. [UM, A axis]</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the 4 <strong>BCGR input planetary</strong> gears onto the middle planets, this side (4x).</li>\n<li>Turn each until its 2 holes line up with the middle planet's holes.</li>\n</ol>\n<p>Check: each sits flat, h
