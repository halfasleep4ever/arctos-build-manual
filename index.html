 each driver</td>\n</tr>\n<tr>\n<td>GND</td>\n<td>black</td>\n<td>Gnd on each driver</td>\n</tr>\n<tr>\n<td>CAN H</td>\n<td>yellow</td>\n<td>CAN H on each driver</td>\n</tr>\n<tr>\n<td>CAN L</td>\n<td>green</td>\n<td>CAN L on each driver</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>Join with <strong>Wago lever connectors</strong>, one Wago per wire: port 1 in, port 2 to this driver, port 3 on up.</li>\n<li>Stock CAN wires from the MKS drivers are fine for the whole robot.</li>\n<li><strong>Limit sensor wires go only to their own driver.</strong> Never into the Wagos.</li>\n</ul>\n<p>The diagram above lights up as you wire; grey = not wired yet.</p>", "checks_pro": [], "html_simple": "<p>Four wires run up the arm and on to each joint.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Wire</th>\n<th>Colour</th>\n<th>Goes to</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>+V (12 or 24 V)</td>\n<td>red</td>\n<td>V+ on each driver</td>\n</tr>\n<tr>\n<td>GND</td>\n<td>black</td>\n<td>Gnd on each driver</td>\n</tr>\n<tr>\n<td>CAN H</td>\n<td>yellow</td>\n<td>CAN H on each driver</td>\n</tr>\n<tr>\n<td>CAN L</td>\n<td>green</td>\n<td>CAN L on each driver</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>Join each wire with a <strong>Wago</strong>: port 1 in, port 2 to the driver, port 3 on up.</li>\n<li>Limit sensor wires go only to their own driver, never to the Wagos.</li>\n</ul>", "checks_simple": [], "ts": [58, 59, 61, 64, 69, 70]}, {"stage": 0, "kind": "wire", "key": "h-power", "title": "Power in: supply, jack, fuse, switch, first Wagos", "img": null, "html": "<ol>\n<li><strong>Power supply:</strong> 24 V (or 12 V), at least 100 W.</li>\n<li><strong>DC jack</strong> in the electronics panel (step 18): the <strong>long prong is +</strong>.</li>\n<li><strong>Fuse</strong> on the + wire right after the jack: <strong>7 A at 24 V</strong>, or 15 A at 12 V. It is not in the kit.</li>\n<li><strong>Switch</strong> in the + wire after the fuse.</li>\n<li><strong>First Wago pair</strong> (+V and GND) in the base, next to the X driver.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Check polarity three times</div>\n<p>Red = +, black = −. A reversed supply destroys every driver on the line.</p>\n</div>", "ov": ["psu", "pin", "w0"], "bench": null, "drv": "57D", "grip": null, "conn": [["PSU +", "DC jack long prong", "red", ""], ["Jack +", "fuse → switch", "red", "7 A at 24 V"], ["Switch", "Wago +V (base)", "red", ""], ["Jack −", "Wago GND (base)", "blk", ""]], "checks": [], "html_pro": "<ol>\n<li><strong>Supply:</strong> 24 V (or 12 V), at least 100 W.</li>\n<li><strong>DC jack</strong> in electronics panel (step 18): <strong>long prong = +</strong>.</li>\n<li><strong>Fuse</strong> on + wire right after jack: <strong>7 A at 24 V</strong>, 15 A at 12 V. Not in kit.</li>\n<li><strong>Switch</strong> in + wire after fuse.</li>\n<li><strong>First Wago pair</strong> (+V, GND) in base, next to X driver.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Check polarity three times</div>\n<p>Red = +, black = −. Reversed supply destroys every driver on the line.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li><strong>Power supply:</strong> 24 V (or 12 V), at least 100 W.</li>\n<li><strong>DC jack</strong> in the electronics panel: long prong is +.</li>\n<li><strong>Fuse</strong> on the + wire after the jack: 7 A at 24 V, 15 A at 12 V.</li>\n<li><strong>Switch</strong> in the + wire after the fuse.</li>\n<li>First <strong>Wago</strong> pair (+V and GND) in the base, next to the X driver.</li>\n</ol>\n<div class=\"callout danger\">\n<div class=\"callout-title\">Polarity</div>\n<p>Red = +, black = −. A reversed supply destroys every driver.</p>\n</div>", "checks_simple": [], "ts": [69, 70, 53, 67, 66, 68]}, {"stage": 0, "kind": "wire", "key": "h-canable", "title": "CANable: USB and the first terminator", "img": null, "html": "<ol>\n<li>USB from the CANable to the computer.</li>\n<li><strong>Jumper the \"120R\" header</strong> on the CANable. This is one end of the bus.</li>\n<li>Its CAN H / CAN L will go to the X driver in the next stage.</li>\n</ol>", "ov": ["pc", "usb", "canable", "r120"], "bench": null, "drv": "57D", "grip": null, "conn": [["Computer USB", "CANable", "wht", ""], ["120R jumper", "on the CANable", "wht", "end 1 of 2"]], "checks": [], "html_pro": "<ol>\n<li>USB from CANable to computer.</li>\n<li><strong>Jumper the \"120R\" header</strong> on the CANable: one end of the bus.</li>\n<li>Its CAN H / CAN L go to the X driver in the next stage.</li>\n</ol>", "checks_pro": [], "html_simple": "<ol>\n<li>USB from the CANable to the computer.</li>\n<li>Jumper the <strong>120R</strong> header.</li>\n</ol>", "checks_simple": [], "ts": [34, 35, 37, 42, 54, 44]}, {"stage": 0, "kind": "test", "key": "h-test", "title": "Test the harness", "img": null, "html": "<p>Power on with nothing connected to the drivers yet.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["The meter reads the right voltage and polarity at the base Wago.", "The step-down reads 6.0 V."], "html_pro": "<p>Power on, nothing connected to the drivers yet.</p>", "checks_pro": ["Meter reads correct voltage and polarity at base Wago.", "Step-down reads 6.0 V."], "html_simple": "<p>Power on with nothing connected to the drivers.</p>", "checks_simple": ["Right voltage and polarity at base Wago.", "Step-down reads 6.0 V."], "ts": [67, 66, 68, 54, 44, 34]}, {"stage": 0, "kind": "wire", "key": "x-wire", "title": "Wire X now, before step 16 closes the motor box", "img": null, "html": "<ol>\n<li><strong>X driver power:</strong> V+ and Gnd from the base Wagos.</li>\n<li><strong>X driver CAN in</strong> from the CANable: H to H, L to L.</li>\n<li>Fit a second short pair <strong>out</strong>, to go up to Y.</li>\n<li><strong>Route the bundle up through the centre</strong> of the base to the shoulder. No slip ring is needed.</li>\n<li>Leave slack at the motor, so you can take it out later.</li>\n</ol>\n<p>The X limit sensor goes in on the next two pages (manual steps 147–148), while you can still reach it.</p>", "ov": ["dX", "mX", "pd-X", "cc-X", "co-X"], "bench": null, "drv": "57D", "grip": null, "conn": [["Wago +V", "driver V+", "red", ""], ["Wago GND", "driver Gnd", "blk", ""], ["CANable CAN H", "X CAN H", "yel", "in"], ["CANable CAN L", "X CAN L", "grn", "in"], ["X CAN H / L", "short pair up to Y", "yel", "out"]], "checks": [], "html_pro": "<ol>\n<li><strong>X driver power:</strong> V+ and Gnd from base Wagos.</li>\n<li><strong>X driver CAN in</strong> from CANable: H to H, L to L.</li>\n<li>Second short pair <strong>out</strong>, up to Y.</li>\n<li><strong>Route bundle up through base centre</strong> to shoulder. No slip ring needed.</li>\n<li>Leave slack at motor for later removal.</li>\n</ol>\n<p>X limit sensor goes in on next two pages (manual steps 147–148), while still reachable.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>X driver power: <strong>V+</strong> and <strong>Gnd</strong> from the base Wagos.</li>\n<li>X driver CAN in from the CANable: H to H, L to L.</li>\n<li>Fit a second short pair out, to go up to Y.</li>\n<li>Route the bundle up through the centre of the base.</li>\n<li>Leave slack at the motor.</li>\n</ol>", "checks_simple": [], "ts": [58, 59, 61, 64, 71, 33]}, {"stage": 0, "kind": "step", "n": 146, "title": "Section title page for the limit switches", "img": "Attachments/Arctos/manual/arctos-step-146.png", "html": "<p>Section title page for the limit switches. No assembly in this step. Note: \"LIMIT SWITCHES\"</p>", "moved": "Paper manual step 146. In the paper manual this is in the Limit switches section near the end (steps 146–159). It is done here, right after this joint, while you can still reach the spot.", "html_simple": "<p>Title page. Nothing to build.</p>", "checks_simple": [], "ts": [58, 59, 61, 64]}, {"stage": 0, "kind": "step", "n": 147, "title": "Inside the base, fix the KYD003 endstop board with M2 screws (red…", "img": "Attachments/Arctos/manual/arctos-step-147.png", "html": "<p>Inside the base, fix the KYD003 endstop board with M2 screws (red arrows) so it faces the magnet on the X pulley hub. Parts: KYD003 endstop. Hardware: M2 screws, magnet. Note: \"M2 screws\" / \"magnet\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Note: this picture labels the X sensor <strong>KY003</strong>, but the docs and the wiring diagram use a <strong>WSH231</strong> dual sensor on X (and on A and C). Use the sensor that matches your kit and the wiring diagram.</p>\n</div>", "html_pro": "<p>Inside base: fix KYD003 endstop board with M2 screws (red arrows), facing magnet on X pulley hub. Parts: KYD003 endstop. Hardware: M2 screws, magnet. Note: \"M2 screws\" / \"magnet\"</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Picture labels X sensor <strong>KY003</strong>; docs and wiring diagram use <strong>WSH231</strong> dual sensor on X (and A, C). Use the one matching your kit and the wiring diagram.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Fix the <strong>KYD003 endstop board</strong> inside the base with <strong>M2 screws</strong>.</li>\n<li>Face it at the magnet on the X pulley hub.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Sensor type</div>\n<p>The picture says KY003, but the wiring diagram uses a <strong>WSH231</strong> on X. Use the one in the wiring diagram.</p>\n</div>", "checks_simple": [], "ts": [16, 62, 54, 63, 58, 59]}, {"stage": 0, "kind": "step", "n": 148, "title": "Close view: the endstop board is fixed on its holder next to the…", "img": "Attachments/Arctos/manual/arctos-step-148.png", "html": "<p>Close view: the endstop board is fixed on its holder next to the pulley hub, with its wires going out. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Close view: endstop board fixed on holder beside pulley hub, wires out. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>", "checks_simple": [], "ts": [16, 58, 59, 61, 64, 69]}, {"stage": 0, "kind": "step", "n": 16, "title": "Put the X belt W10 630 mm around the big X pulley and around the…", "img": "Attachments/Arctos/manual/arctos-step-016.png", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The 630 mm belt round the big pulley, the motor pulley and the idlers. The X idler tensioner plate goes on top.</p>\n</div>\n<p>Put the X belt W10 630 mm around the big X pulley and around the motor pulley and idlers. Place the X idler tensioner plate on top of the idler bolts to hold them. Parts: X idler tensioner. Hardware: X belt W10 630 mm.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Tip: <strong>tension the belt so it can't skip</strong>. If it slips under load: loosen all 4 motor bolts, slide the motor back, tighten the 2 back nuts first, then the front ones.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>630 mm belt round big pulley, motor pulley, idlers. X idler tensioner plate on top.</p>\n</div>\n<p>Fit X belt W10 630 mm around big X pulley, motor pulley and idlers. Seat X idler tensioner plate on top of idler bolts. Parts: X idler tensioner. Hardware: X belt W10 630 mm.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Tip: <strong>tension belt so it can't skip</strong>. Slipping under load: loosen all 4 motor bolts, slide motor back, tighten 2 back nuts first, then front.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>X belt W10 630 mm</strong> round the big X pulley, the motor pulley and the idlers.</li>\n<li>Put the <strong>X idler tensioner</strong> plate on top of the idler bolts.</li>\n<li>Tension the belt so it can't skip.</li>\n</ol>", "checks_simple": [], "ts": [4, 28, 30, 29, 71, 33]}, {"stage": 0, "kind": "step", "n": 17, "title": "Result: the belt is on and the tensioner plate links the idler…", "img": "Attachments/Arctos/manual/arctos-step-017.png", "html": "<p>Result: the belt is on and the tensioner plate links the idler bolts on top of the motor box. Parts: none labelled. Hardware: none labelled. Note: \"TIP: Do the wiring of the motors as you go. Some motors are in tight spaces and hard to wire after everything is assembled\"</p>", "html_pro": "<p>Result: belt on; tensioner plate links idler bolts on top of motor box. Parts: none labelled. Hardware: none labelled. Note: \"TIP: Do the wiring of the motors as you go. Some motors are in tight spaces and hard to wire after everything is assembled\"</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>", "checks_simple": [], "ts": [28, 30, 29, 71, 33, 0]}, {"stage": 0, "kind": "step", "n": 18, "title": "Push the 12 female connector into the hole in the Electronics panel", "img": "Attachments/Arctos/manual/arctos-step-018.png", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The DC jack and the electronics panel (<strong>4x M3x10</strong>). The CANable fits on its side panel.</p>\n</div>\n<p>Push the 12 female connector into the hole in the Electronics panel. Screw the Electronics panel onto the end of the X motor CORE with Bolt M3 10mm (drawn: 4). Fit the mks cannable v2 board on the side panel. Parts: Electronics panel, 12 female connector, mks cannable v2. Hardware: Bolt M3 10mm v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>The 12 V/24 V female connector: its <strong>long prong is +</strong>. Wire + through the rocker switch. Add a fuse (not in the kit). See <a class=\"wl\" href=\"#/wiring/power\">Wiring › Power</a>.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>DC jack and electronics panel (<strong>4x M3x10</strong>). CANable fits on its side panel.</p>\n</div>\n<p>Push 12 female connector into Electronics panel hole. Screw Electronics panel onto end of X motor CORE with Bolt M3 10mm (drawn: 4). Fit mks cannable v2 board on side panel. Parts: Electronics panel, 12 female connector, mks cannable v2. Hardware: Bolt M3 10mm v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>12 V/24 V female connector: <strong>long prong is +</strong>. Wire + through rocker switch. Add fuse (not in kit). See <a class=\"wl\" href=\"#/wiring/power\">Wiring › Power</a>.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Push the <strong>12 female connector</strong> into the hole in the <strong>Electronics panel</strong>.</li>\n<li>Screw the panel to the end of the X motor CORE with 4x <strong>M3x10</strong>.</li>\n<li>Fit the <strong>mks cannable v2</strong> board on the side panel.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Power polarity</div>\n<p>The long prong of the female connector is +.</p>\n</div>", "checks_simple": [], "ts": [71, 33, 0, 69, 70, 53]}, {"stage": 0, "kind": "step", "n": 19, "title": "Fit the 3010 FAN 30x30 on the side of the motor box", "img": "Attachments/Arctos/manual/arctos-step-019.png", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The 30x30 fan, <strong>4x M3x10</strong>.</p>\n</div>\n<p>Fit the 3010 FAN 30x30 on the side of the motor box. Fix it with Bolt M3 10mm (drawn: 4). [unclear: the bolts are drawn near the round opening on the right face, so the fan may go there] Parts: 3010 FAN 30x30. Hardware: Bolt M3 10mm v2.</p>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>30x30 fan, <strong>4x M3x10</strong>.</p>\n</div>\n<p>Fit 3010 FAN 30x30 on side of motor box; fix with Bolt M3 10mm (drawn: 4). [unclear: bolts drawn near round opening on right face, so fan may go there] Parts: 3010 FAN 30x30. Hardware: Bolt M3 10mm v2.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Fit the <strong>3010 FAN 30x30</strong> on the side of the motor box.</li>\n<li>Fix it with 4x <strong>M3x10</strong>.</li>\n</ol>", "checks_simple": [], "ts": [71, 33, 0]}, {"stage": 0, "kind": "step", "n": 20, "title": "Result: the X Axis base is complete, with the electronics panel,…", "img": "Attachments/Arctos/manual/arctos-step-020.png", "html": "<p>Result: the X Axis base is complete, with the electronics panel, cannable board and fan fitted. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: X Axis base complete; electronics panel, cannable board, fan fitted. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture.</p>", "checks_simple": [], "ts": [71, 43, 54]}, {"stage": 0, "kind": "test", "key": "x-test", "title": "Test X", "img": null, "html": "<p><strong>Tension the belt first.</strong> Loosen the 4 motor bolts. Slide the motor back until the belt can't skip. Tighten the back nuts first, then the front ones.</p>", "ov": ["li-X"], "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["Belt off: jog X ±5°. It turns the right way.", "Belt on: jog ±10°, then home. It stops at the sensor.", "Turning the base by hand is smooth. No bearing rubs."], "html_pro": "<p><strong>Tension belt first.</strong> Loosen 4 motor bolts; slide motor back until belt can't skip; tighten back nuts, then front.</p>", "checks_pro": ["Belt off: jog X ±5°; correct direction.", "Belt on: jog ±10°, then home; stops at sensor.", "Base turns smooth by hand; no bearing rub."], "html_simple": "<p><strong>Tension the belt first.</strong> Loosen the 4 motor bolts. Slide the motor back until the belt can't skip. Tighten the back nuts first, then the front ones.</p>", "checks_simple": ["Belt off: jog X ±5°, right way.", "Belt on: jog ±10°, home stops at sensor.", "Base turns smooth, no rubbing."], "ts": [4, 28, 30, 71, 33, 26]}, {"stage": 1, "kind": "test", "key": "yg-before", "title": "Before you build the Y gearbox", "img": "Attachments/Arctos/arctos-cycloidal_disk_alignment.jpg", "html": "<p>Read <a class=\"wl\" href=\"#/cycloidal/before-you-start\">Cycloidal Gearboxes (Y and Z) › Before you start</a> once.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["The 4 mm pins measure about 3.97 mm. (At 3.82 mm one builder had 45° of slop.)", "Y parts set apart: M5 rods and 80 mm pins. The M4 rods and 50 mm pins are for Z.", "You found the marks on each disk and camshaft piece (numbers, notches, dashes)."], "html_pro": "<p>Read <a class=\"wl\" href=\"#/cycloidal/before-you-start\">Cycloidal Gearboxes (Y and Z) › Before you start</a> once.</p>", "checks_pro": ["4 mm pins measure about 3.97 mm. (At 3.82 mm one builder had 45° of slop.)", "Y parts set apart: M5 rods, 80 mm pins. M4 rods, 50 mm pins are for Z.", "Marks found on each disk and camshaft piece (numbers, notches, dashes)."], "html_simple": "<p>Read <a class=\"wl\" href=\"#/cycloidal/before-you-start\">Cycloidal Gearboxes (Y and Z) › Before you start</a> once.</p>", "checks_simple": ["4 mm pins measure about 3.97 mm.", "Y parts apart: M5 rods, 80 mm pins.", "Marks found on each disk and camshaft piece."], "ts": [10, 15, 11, 17, 7, 0]}, {"stage": 1, "kind": "step", "n": 21, "title": "Put the bearings and cap on one disk", "img": "Attachments/Arctos/manual/arctos-step-021.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Take one <strong>Y gearbox cycloidal disk</strong>.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> into the big centre hole.</li>\n<li>Press 5 x <strong>Bearing 688ZZ-4</strong> into the 5 holes around the centre.</li>\n<li>Put the <strong>Y cyclo bearings cap</strong> (the 5-lobed flat plate) on top.</li>\n<li>Screw the cap down with 5 x screws (labelled M2.6x5; the manual says use <strong>M3x10</strong> now).</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 61803, 5x 688ZZ-4, 5x cap screws. The label \"(11)\" and \"(10)\" are CAD numbers, not counts.</p>\n<p><strong>Orientation:</strong> The cap goes on the side shown in the picture. Its 5 lobes cover the 5 small bearings. Its centre hole lines up with the 61803.</p>\n<p><strong>Check:</strong> All 6 bearings sit flat. None stands proud of the disk. The cap is pressed fully down with no gap.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Press each bearing in evenly. Put a flat block of wood on it and tap with a mallet. A 22 mm socket also works as a press. (Unexpected Maker)</li>\n<li>Push the cap all the way down. Unexpected Maker's disk bearings were loose because the cap did not press them far enough. That made the gearbox wobble.</li>\n<li>Finish screws by hand. A power driver strips plastic. (Unexpected Maker)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Take one <strong>Y gearbox cycloidal disk</strong>.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> into big centre hole.</li>\n<li>Press 5 x <strong>Bearing 688ZZ-4</strong> into 5 holes around centre.</li>\n<li>Seat <strong>Y cyclo bearings cap</strong> (5-lobed flat plate) on top.</li>\n<li>Screw cap down with 5 x screws (labelled M2.6x5; manual now says <strong>M3x10</strong>).</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 61803, 5x 688ZZ-4, 5x cap screws. \"(11)\" and \"(10)\" are CAD numbers, not counts.</p>\n<p><strong>Orientation:</strong> Cap on side shown. 5 lobes cover the 5 small bearings; centre hole aligns with 61803.</p>\n<p><strong>Check:</strong> All 6 bearings flat, none proud of disk. Cap fully down, no gap.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Press bearings evenly: flat wood block + mallet tap; 22 mm socket also works. (Unexpected Maker)</li>\n<li>Push cap fully down. Unexpected Maker's disk bearings were loose because cap did not press them far enough; gearbox wobbled.</li>\n<li>Finish screws by hand; power driver strips plastic. (Unexpected Maker)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Take one <strong>Y gearbox cycloidal disk</strong>.</li>\n<li>Press 1x <strong>Bearing 61803</strong> into the big centre hole.</li>\n<li>Press 5x <strong>Bearing 688ZZ-4</strong> into the 5 holes around it.</li>\n<li>Put the <strong>Y cyclo bearings cap</strong> on top, on the side shown.</li>\n<li>Screw the cap down with 5x screws (use <strong>M3x10</strong>, label says M2.6x5).</li>\n</ol>\n<p>Check: all 6 bearings flat, cap pressed fully down.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 1, "kind": "step", "n": 22, "title": "Check the finished disk", "img": "Attachments/Arctos/manual/arctos-step-022.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Look at the rim. Find the number (here \"3\") and the tick marks (here 3 ticks, at the top).</li>\n<li>Build the other two disks the same way (steps 21–22 again for disks 1 and 2).</li>\n</ol>\n<p><strong>Hardware:</strong> for 3 disks in total: 3x 61803, 15x 688ZZ-4, 15x cap screws.</p>\n<p><strong>Check:</strong> You have 3 disks. Disk 1 has 1 tick. Disk 2 has 2 ticks. Disk 3 has 3 ticks. Each cap has 5 screw heads.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Inspect rim: number (here \"3\"), tick marks (here 3 ticks, at top).</li>\n<li>Build other two disks the same way (steps 21–22 again for disks 1 and 2).</li>\n</ol>\n<p><strong>Hardware:</strong> 3 disks total: 3x 61803, 15x 688ZZ-4, 15x cap screws.</p>\n<p><strong>Check:</strong> 3 disks. Disk 1 = 1 tick, disk 2 = 2 ticks, disk 3 = 3 ticks. Each cap has 5 screw heads.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Find the number and tick marks on the disk rim.</li>\n<li>Build 2 more disks the same way.</li>\n</ol>\n<p>Total for 3 disks: 3x <strong>61803</strong>, 15x <strong>688ZZ-4</strong>, 15x cap screws.</p>\n<p>Check: disk 1 has 1 tick, disk 2 has 2, disk 3 has 3.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 1, "kind": "step", "n": 23, "title": "Stack the disks on the camshaft pieces", "img": "Attachments/Arctos/manual/arctos-step-023.png", "html": "<p><strong>Do (left to right in the picture):</strong></p>\n<ol>\n<li>Start with <strong>YC4</strong> (the piece with the forked tab end).</li>\n<li>Slide on <strong>Y gearbox cycloidal disk 3</strong>.</li>\n<li>Add <strong>YC3</strong>.</li>\n<li>Slide on <strong>disk 2</strong>.</li>\n<li>Add <strong>YC2</strong>.</li>\n<li>Slide on <strong>disk 1</strong>.</li>\n<li>Finish with <strong>YC1</strong> (the piece with the star-shaped end).</li>\n</ol>\n<p><strong>Hardware:</strong> none.</p>\n<p><strong>Orientation:</strong> Each camshaft piece keys into the next. Match the tick marks on the pieces as drawn. Keep each disk facing the same way it faces in the picture. (unsure: I could not read the exact tick count on each camshaft piece in the picture.)</p>\n<p><strong>Check:</strong> After the first cam piece and disk, turn the cam by hand. It must spin. (official 2026 video: add the first camshaft piece, then check that it spins)</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>\"All camshaft parts are marked with notches. Order of assembly is important.\" (3D manual note)</li>\n<li>If the disks go in back to front, the camshaft ends up on the wrong side. (Unexpected Maker, on Z)</li>\n</ul>", "html_pro": "<p><strong>Do (left to right in picture):</strong></p>\n<ol>\n<li><strong>YC4</strong> (forked tab end).</li>\n<li><strong>Y gearbox cycloidal disk 3</strong>.</li>\n<li><strong>YC3</strong>.</li>\n<li><strong>disk 2</strong>.</li>\n<li><strong>YC2</strong>.</li>\n<li><strong>disk 1</strong>.</li>\n<li><strong>YC1</strong> (star-shaped end).</li>\n</ol>\n<p><strong>Hardware:</strong> none.</p>\n<p><strong>Orientation:</strong> Each camshaft piece keys into the next. Match tick marks as drawn. Each disk faces as in picture. (unsure: could not read exact tick count on each camshaft piece in picture.)</p>\n<p><strong>Check:</strong> After first cam piece and disk, turn cam by hand; must spin. (official 2026 video: add first camshaft piece, check it spins)</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>\"All camshaft parts are marked with notches. Order of assembly is important.\" (3D manual note)</li>\n<li>Disks in back to front puts camshaft on wrong side. (Unexpected Maker, on Z)</li>\n</ul>", "checks_pro": [], "html_simple": "<p>Left to right in the picture:</p>\n<ol>\n<li><strong>YC4</strong> (forked tab end).</li>\n<li><strong>Disk 3</strong>.</li>\n<li><strong>YC3</strong>.</li>\n<li><strong>Disk 2</strong>.</li>\n<li><strong>YC2</strong>.</li>\n<li><strong>Disk 1</strong>.</li>\n<li><strong>YC1</strong> (star end).</li>\n</ol>\n<p>Match the tick marks as drawn. After the first piece and disk, turn the cam by hand. It must spin.</p>", "checks_simple": [], "ts": [10, 15, 11, 17]}, {"stage": 1, "kind": "step", "n": 24, "title": "Lock the disks with one pin", "img": "Attachments/Arctos/manual/arctos-step-024.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Line up the small locking hole in all 3 disks. It sits in the notch between two lobes of the cap (red arrow).</li>\n<li>Push 1 x <strong>4 mm dowel pin</strong> through all 3 holes.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 4 mm dowel pin. Use one of the 25 Y gearbox pins.</p>\n<p><strong>Check:</strong> The 3 disks no longer turn against each other. Disk 3 faces you.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>The manual says: keep it in \"until the outer dowel pins are inserted. That will prevent disks from misaligning.\"</li>\n<li>You can also push 5 pins through the 5 small bearings to lock the stack. (designer, in Unexpected Maker's stream)</li>\n<li><strong>Don't forget to pull this pin out later.</strong> (3D manual note) I suggest you pull it just before the last outer pin goes in at step 26, then use it as that last pin. (unsure: this order is my suggestion, not in the manual.)</li>\n</ul>\n<p><img class=\"zoom\" loading=\"lazy\" src=\"Attachments/Arctos/arctos-cycloidal_disk_alignment.jpg\" alt=\"arctos-cycloidal_disk_alignment.jpg\"></p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Align small locking hole in all 3 disks (in notch between two cap lobes, red arrow).</li>\n<li>Push 1 x <strong>4 mm dowel pin</strong> through all 3 holes.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 4 mm dowel pin; one of the 25 Y gearbox pins.</p>\n<p><strong>Check:</strong> 3 disks no longer rotate against each other. Disk 3 faces you.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Manual: keep it in \"until the outer dowel pins are inserted. That will prevent disks from misaligning.\"</li>\n<li>Alternative: 5 pins through the 5 small bearings lock the stack. (designer, in Unexpected Maker's stream)</li>\n<li><strong>Pull this pin out later.</strong> (3D manual note) Suggest pulling it just before last outer pin at step 26 and using it as that pin. (unsure: this order is my suggestion, not in manual.)</li>\n</ul>\n<p><img class=\"zoom\" loading=\"lazy\" src=\"Attachments/Arctos/arctos-cycloidal_disk_alignment.jpg\" alt=\"arctos-cycloidal_disk_alignment.jpg\"></p>", "checks_pro": [], "html_simple": "<ol>\n<li>Line up the small locking hole in all 3 disks (red arrow).</li>\n<li>Push 1x <strong>4 mm dowel pin</strong> through all 3.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Pull this pin out later</div>\n<p>Remove it before the last outer pin goes in.</p>\n</div>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 1, "kind": "step", "n": 25, "title": "Put the stack between the covers", "img": "Attachments/Arctos/manual/arctos-step-025.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Place the disk stack inside the <strong>Y gearbox L cover</strong> (the big flat ring with fingers, right in the picture).</li>\n<li>Bring the <strong>Y gearbox R cover</strong> (the ring with short prongs, left) to the other side.</li>\n<li>Push 4 x <strong>Y gearbox pin</strong> through the R cover holes, past the disk lobes, into the L cover.</li>\n</ol>\n<p><strong>Hardware:</strong> 4x Y gearbox pin (80 mm). \"(16)\" is a CAD number.</p>\n<p><strong>Orientation:</strong> The fingers of the L cover and the prongs of the R cover interlock around the disks. The YC1 star end points out through the L cover side. (unsure: the picture shows the cam end facing the L cover; check that your star end is reachable from the L-cover side, because the Y pulley drives it.)</p>\n<p><strong>Check:</strong> The two covers close with no gap. The 4 pins slide in with a tight fit.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Line up the dots and small holes on the disks and the covers before you fit the pins and rods. The manual does not say this. (Unexpected Maker)</li>\n<li>The designer said the hardest step is \"snap two cases together and align all the pins correctly\". (Reddit)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Place disk stack inside <strong>Y gearbox L cover</strong> (big flat ring with fingers, right in picture).</li>\n<li>Bring <strong>Y gearbox R cover</strong> (ring with short prongs, left) to other side.</li>\n<li>Push 4 x <strong>Y gearbox pin</strong> through R cover holes, past disk lobes, into L cover.</li>\n</ol>\n<p><strong>Hardware:</strong> 4x Y gearbox pin (80 mm). \"(16)\" is a CAD number.</p>\n<p><strong>Orientation:</strong> L cover fingers and R cover prongs interlock around disks. YC1 star end points out through L cover side. (unsure: picture shows cam end facing L cover; check star end is reachable from L-cover side, since Y pulley drives it.)</p>\n<p><strong>Check:</strong> Covers close, no gap. The 4 pins slide in tight.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Align dots and small holes on disks and covers before fitting pins and rods. Not in manual. (Unexpected Maker)</li>\n<li>Designer: hardest step is \"snap two cases together and align all the pins correctly\". (Reddit)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the disk stack inside the <strong>Y gearbox L cover</strong>.</li>\n<li>Bring the <strong>Y gearbox R cover</strong> to the other side.</li>\n<li>Push 4x <strong>Y gearbox pin</strong> (80 mm) through the R cover holes into the L cover.</li>\n</ol>\n<p>The YC1 star end points out through the L cover side. Line up the dots and small holes first.</p>", "checks_simple": [], "ts": [5, 9, 13, 10, 15, 11]}, {"stage": 1, "kind": "step", "n": 26, "title": "Push in the rest of the outer pins and the shaft bearings", "img": "Attachments/Arctos/manual/arctos-step-026.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push the rest of the <strong>Y gearbox pins</strong> into the ring of holes. About 21 more are drawn, for 25 in total.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> onto the camshaft end on the R-cover side (left in the picture).</li>\n<li>Press 1 x <strong>Bearing 61803</strong> onto the camshaft end on the L-cover side (right in the picture).</li>\n</ol>\n<p><strong>Hardware:</strong> about 21x Y gearbox pin (could not count exactly; total must be 25), 2x 61803.</p>\n<p><strong>Check:</strong> All 25 pin holes are filled. Each pin is a <strong>tight</strong> fit. A loose pin means slop.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>\"It's easier to insert them when the entire assembly is upside down.\" (3D manual note)</li>\n<li>Pull the locking pin from step 24 when the other 24 pins are in. Use it as the 25th pin. (unsure: my suggestion)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push remaining <strong>Y gearbox pins</strong> into the ring of holes. About 21 more drawn; 25 total.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> onto camshaft end, R-cover side (left in picture).</li>\n<li>Press 1 x <strong>Bearing 61803</strong> onto camshaft end, L-cover side (right in picture).</li>\n</ol>\n<p><strong>Hardware:</strong> about 21x Y gearbox pin (could not count exactly; total must be 25), 2x 61803.</p>\n<p><strong>Check:</strong> All 25 pin holes filled. Each pin <strong>tight</strong>; loose pin = slop.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>\"It's easier to insert them when the entire assembly is upside down.\" (3D manual note)</li>\n<li>Pull step 24 locking pin once other 24 are in; use as 25th. (unsure: my suggestion)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Push the rest of the <strong>Y gearbox pins</strong> in. 25 in total.</li>\n<li>Press 1x <strong>Bearing 61803</strong> on the camshaft end, R-cover side.</li>\n<li>Press 1x <strong>Bearing 61803</strong> on the camshaft end, L-cover side.</li>\n</ol>\n<p>Check: all 25 pins are a tight fit.</p>", "checks_simple": [], "ts": [2, 3, 8, 12, 10, 15]}, {"stage": 1, "kind": "step", "n": 27, "title": "Big end bearings and through-bolts", "img": "Attachments/Arctos/manual/arctos-step-027.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put 1 x <strong>Bearing 61812</strong> on the R-cover end (left).</li>\n<li>Put 1 x <strong>Bearing 61812</strong> on the L-cover end (right).</li>\n<li>Push 6 x <strong>Bolt M5 80mm</strong> through the whole gearbox from the <strong>L-cover side</strong> (right).</li>\n<li>Screw 6 x <strong>Nut M5</strong> onto them on the <strong>R-cover side</strong> (left).</li>\n<li>Tighten them evenly, in a star pattern (opposite bolts in turn).</li>\n</ol>\n<p><strong>Hardware:</strong> 2x 61812, 6x M5x80, 6x M5 nut.</p>\n<p><strong>Check:</strong> Both 61812 bearings sit flat and fully seated. The gearbox does not rock when you squeeze it.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>The designer said only every second bolt is really needed. (Unexpected Maker stream)</li>\n<li>A nut seized and stripped its plastic pocket in one build. Don't over-tighten. (Unexpected Maker)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>1 x <strong>Bearing 61812</strong> on R-cover end (left).</li>\n<li>1 x <strong>Bearing 61812</strong> on L-cover end (right).</li>\n<li>Push 6 x <strong>Bolt M5 80mm</strong> through whole gearbox from <strong>L-cover side</strong> (right).</li>\n<li>6 x <strong>Nut M5</strong> on <strong>R-cover side</strong> (left).</li>\n<li>Tighten evenly in star pattern (opposite bolts in turn).</li>\n</ol>\n<p><strong>Hardware:</strong> 2x 61812, 6x M5x80, 6x M5 nut.</p>\n<p><strong>Check:</strong> Both 61812 flat, fully seated. Gearbox does not rock when squeezed.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Designer: only every second bolt is really needed. (Unexpected Maker stream)</li>\n<li>Nut seized and stripped plastic pocket in one build; don't over-tighten. (Unexpected Maker)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 1x <strong>Bearing 61812</strong> on the R-cover end.</li>\n<li>Put 1x <strong>Bearing 61812</strong> on the L-cover end.</li>\n<li>Push 6x <strong>Bolt M5x80</strong> through from the L-cover side.</li>\n<li>Screw 6x <strong>Nut M5</strong> on at the R-cover side.</li>\n<li>Tighten evenly in a star pattern.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Don't over-tighten</div>\n<p>A nut can strip its plastic pocket.</p>\n</div>", "checks_simple": [], "ts": [2, 3, 8, 12, 4, 0]}, {"stage": 1, "kind": "step", "n": 28, "title": "The finished Y gearbox", "img": "Attachments/Arctos/manual/arctos-step-028.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Turn the camshaft (the star end in the centre) by hand.</li>\n<li>Hold the gearbox and wiggle the output.</li>\n</ol>\n<p><strong>Check:</strong> It turns smoothly with no clicking. The outside turns slowly. There is almost no play. If it is tight, see \"If something is wrong\" at the end.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Turn camshaft (star end, centre) by hand.</li>\n<li>Hold gearbox, wiggle output.</li>\n</ol>\n<p><strong>Check:</strong> Smooth, no clicking. Outside turns slowly. Almost no play. If tight, see \"If something is wrong\" at the end.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the camshaft by hand.</li>\n<li>Wiggle the output.</li>\n</ol>\n<p>Check: smooth, no clicking, almost no play.</p>", "checks_simple": [], "ts": [10, 15, 11, 17]}, {"stage": 1, "kind": "step", "n": 29, "title": "Mount it between the Z lower cores", "img": "Attachments/Arctos/manual/arctos-step-029.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put the <strong>Z R lower core</strong> (the plate with the oval hole near the top) on the <strong>R-cover side</strong> (left).</li>\n<li>Put the <strong>Z L lower Core</strong> (the plate with the V notch at the top) on the <strong>L-cover side</strong> (right).</li>\n<li>Bolt the Z R lower core on with 6 x <strong>Bolt M5 25mm</strong> from the outside (left).</li>\n<li>Bolt the Z L lower Core on with 6 x <strong>Bolt M5 25mm</strong> from the outside (right).</li>\n</ol>\n<p><strong>Hardware:</strong> 12x M5x25 (6 per side).</p>\n<p><strong>Orientation:</strong> Both plates point up from the gearbox. The V notch is on the L side. The square cut-out near the hub of the Z R lower core should line up with the matching opening in the gearbox. (official video: \"oriented to match the rectangular cable opening\")</p>\n<p><strong>Check:</strong> Both plates are parallel. All 12 bolts are in. The gearbox centre is still free to turn.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>Z R lower core</strong> (plate with oval hole near top) on <strong>R-cover side</strong> (left).</li>\n<li><strong>Z L lower Core</strong> (plate with V notch at top) on <strong>L-cover side</strong> (right).</li>\n<li>Bolt Z R lower core with 6 x <strong>Bolt M5 25mm</strong> from outside (left).</li>\n<li>Bolt Z L lower Core with 6 x <strong>Bolt M5 25mm</strong> from outside (right).</li>\n</ol>\n<p><strong>Hardware:</strong> 12x M5x25 (6 per side).</p>\n<p><strong>Orientation:</strong> Both plates point up from gearbox. V notch on L side. Square cut-out near hub of Z R lower core lines up with matching opening in gearbox. (official video: \"oriented to match the rectangular cable opening\")</p>\n<p><strong>Check:</strong> Plates parallel. All 12 bolts in. Gearbox centre still free to turn.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>Z R lower core</strong> (oval hole) on the R-cover side.</li>\n<li>Put the <strong>Z L lower Core</strong> (V notch) on the L-cover side.</li>\n<li>Bolt each on from outside with 6x <strong>Bolt M5x25</strong> (12 total).</li>\n</ol>\n<p>Both plates point up. The square cut-out of the Z R core lines up with the gearbox opening.</p>", "checks_simple": [], "ts": [26, 0, 7]}, {"stage": 1, "kind": "test", "key": "yg-test", "title": "Test the Y gearbox", "img": null, "html": "<p>No wiring in this stage.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["Turn the input by hand: smooth, no clicking.", "Wiggle the output: almost no play."], "html_pro": "<p>No wiring in this stage.</p>", "checks_pro": ["Input by hand: smooth, no clicking.", "Output wiggle: almost no play."], "html_simple": "<p>No wiring in this stage.</p>", "checks_simple": ["Input turns smooth, no clicking.", "Output wiggle: almost no play."], "ts": [7, 0]}, {"stage": 2, "kind": "wire", "key": "Y-setup", "title": "Set up the Y driver on the table", "img": null, "html": "<p>Do this before you start the Y axis. It is the same job as the X driver (start of the X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Y</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 23</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO57D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x65</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>2</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>3200 mA (the 57D default)</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>2x KY-003. <strong>Back</strong> = home</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with a meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue it to the centre of the shaft end. Let it dry. Fit the driver with the M3x65 bolts.</li>\n<li><strong>Power:</strong> check the polarity with a meter, then + to V+ and − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on the shaft. Set the menu like X, but <strong>CanID 2</strong> and <strong>Ma 3200 mA (the 57D default)</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on the bus.</li>\n<li><strong>Sensors:</strong> IN_1 = home, IN_2 = the other one. Set <strong>DIP switches 2 and 3 ON</strong> (1 OFF).</li>\n</ol>", "ov": null, "bench": ["coil", "pwr", "can", "lim", "sensor", "dip"], "drv": "57D", "grip": null, "conn": null, "checks": [], "html_pro": "<p>Do before starting Y axis. Same job as X driver (start of X stage), with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Y</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 23</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO57D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x65</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>2</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>3200 mA (the 57D default)</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>2x KY-003. <strong>Back</strong> = home</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the two pairs with meter (each under 10 Ω). Coil 1 to A+ / A−, coil 2 to B+ / B−. Bare twisted wire, no ferrules.</li>\n<li><strong>Magnet:</strong> superglue to centre of shaft end; let dry. Fit driver with M3x65 bolts.</li>\n<li><strong>Power:</strong> check polarity with meter; + to V+, − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on shaft. Menu like X, but <strong>CanID 2</strong>, <strong>Ma 3200 mA (the 57D default)</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on bus.</li>\n<li><strong>Sensors:</strong> IN_1 = home, IN_2 = other. <strong>DIP switches 2 and 3 ON</strong> (1 OFF).</li>\n</ol>", "checks_pro": [], "html_simple": "<p>Same job as the X driver, with these values:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Y</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Motor</td>\n<td>NEMA 23</td>\n</tr>\n<tr>\n<td>Driver</td>\n<td>SERVO57D</td>\n</tr>\n<tr>\n<td>Encoder bolts</td>\n<td>M3x65</td>\n</tr>\n<tr>\n<td>CAN ID</td>\n<td><strong>2</strong></td>\n</tr>\n<tr>\n<td>Current (Ma)</td>\n<td>3200 mA</td>\n</tr>\n<tr>\n<td>Limit sensors</td>\n<td>2x KY-003. <strong>Back</strong> = home</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Coils:</strong> find the 2 pairs with a meter. Coil 1 to A+/A−, coil 2 to B+/B−.</li>\n<li><strong>Magnet:</strong> superglue it to the centre of the shaft end. Fit the driver with M3x65 bolts.</li>\n<li><strong>Power:</strong> check polarity with a meter, then + to V+, − to Gnd.</li>\n<li><strong>Cal</strong> with nothing on the shaft. Menu like X, but <strong>CanID 2</strong>, <strong>Ma 3200 mA</strong>.</li>\n<li><strong>CAN:</strong> CANable H to H, L to L. Only this driver on the bus.</li>\n<li><strong>Sensors:</strong> IN_1 = home. <strong>DIP 2 and 3 ON</strong>, 1 OFF.</li>\n</ol>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 2, "kind": "test", "key": "Y-check", "title": "Test the Y driver before it goes in", "img": null, "html": "<p>Same tests as X. Fix anything now: the driver is hard to reach later.</p>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "checks": ["\"Cal success\", and the settings survive a power cycle.", "It answers on ID 2. Read encoder (<code>31</code>) changes when you turn the shaft.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): it stops when you trigger the home sensor by hand."], "html_pro": "<p>Same tests as X. Fix now; driver hard to reach later.</p>", "checks_pro": ["\"Cal success\"; settings survive power cycle.", "Answers on ID 2. Read encoder (<code>31</code>) changes when shaft turned.", "Each sensor LED lights with its marked magnet face.", "Home (<code>91</code>): stops when home sensor triggered by hand."], "html_simple": "<p>Same tests as X. Fix problems now, the driver is hard to reach later.</p>", "checks_simple": ["Cal success, survives power cycle.", "Answers on ID 2. <code>31</code> changes with shaft.", "Each sensor LED lights with its magnet.", "<code>91</code> home stops at home sensor."], "ts": [54, 7, 28, 58, 69]}, {"stage": 2, "kind": "step", "n": 30, "title": "The bottom of the upper arm", "img": "Attachments/Arctos/manual/arctos-step-030.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Look at the result. This unit is the bottom of the upper arm.</li>\n</ol>\n<p><strong>Check:</strong> The V-notch plate (Z L lower Core) is in front. The camshaft star end shows in its centre hole.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Inspect result: unit is bottom of upper arm.</li>\n</ol>\n<p><strong>Check:</strong> V-notch plate (Z L lower Core) in front. Camshaft star end visible in its centre hole.</p>", "checks_pro": [], "html_simple": "<p>Check it looks like the picture. The V-notch plate is in front.</p>", "checks_simple": [], "ts": [10, 15, 11, 17]}, {"stage": 2, "kind": "step", "n": 31, "title": "Bring in the Y L Core and its bearing", "img": "Attachments/Arctos/manual/arctos-step-031.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Take the <strong>Y L Core</strong>. It is the shoulder: a tall wall with a round hub, joined to a lower box.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> into its round hub from the outside (right in the picture).</li>\n<li>Hold the gearbox unit so its V-notch side faces the inside of the Y L Core wall.</li>\n<li>Line up the gearbox centre with the Y L Core hub.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 61803. \"(9)\" is a CAD number.</p>\n<p><strong>Orientation:</strong> The \"X\" mark is on the bottom edge of the Y L Core box. The tall wall with the hub goes on the <strong>L side</strong> of the gearbox (the V-notch side).</p>\n<p><strong>Check:</strong> The bearing is flush in the hub. (unsure: the picture does not show the moment the gearbox enters the core. Steps 33–34 show it seated.)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Take <strong>Y L Core</strong> (shoulder: tall wall with round hub, joined to lower box).</li>\n<li>Press 1 x <strong>Bearing 61803</strong> into round hub from outside (right in picture).</li>\n<li>Hold gearbox unit with V-notch side facing inside of Y L Core wall.</li>\n<li>Align gearbox centre with Y L Core hub.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x 61803. \"(9)\" is a CAD number.</p>\n<p><strong>Orientation:</strong> \"X\" mark on bottom edge of Y L Core box. Tall wall with hub goes on <strong>L side</strong> of gearbox (V-notch side).</p>\n<p><strong>Check:</strong> Bearing flush in hub. (unsure: picture does not show gearbox entering the core; steps 33–34 show it seated.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Take the <strong>Y L Core</strong>.</li>\n<li>Press 1x <strong>Bearing 61803</strong> into its round hub from outside.</li>\n<li>Hold the gearbox with the V-notch side facing the inside of the core wall.</li>\n<li>Line up the gearbox centre with the hub.</li>\n</ol>\n<p>The tall wall with the hub goes on the <strong>L side</strong> of the gearbox.</p>", "checks_simple": [], "ts": [2, 3, 8, 12]}, {"stage": 2, "kind": "step", "n": 32, "title": "Fit the Y motor (MKS SERVO57D + Nema 23)", "img": "Attachments/Arctos/manual/arctos-step-032.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Make sure the motor prep box above is done. Driver bolted on, all wires connected, CAN ID 02, calibrated.</li>\n<li>Put the <strong>Nema 23 stepper</strong> (with the <strong>MKS 57D</strong> on its back) inside the Y L Core.</li>\n<li>Push its shaft out through the large hole in the tall wall.</li>\n<li>Fix it with 4 x <strong>Bolt M4 25mm</strong> from the outside of the wall (right).</li>\n</ol>\n<p><strong>Hardware:</strong> 4x M4x25.</p>\n<p><strong>Orientation:</strong> The shaft points <strong>out</strong> through the wall. The MKS 57D faces <strong>in</strong>, towards the middle of the shoulder.</p>\n<p><strong>Check:</strong> The shaft sticks out of the wall. The motor sits square.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>The designer: mount the motor \"in reverse, nuts outside\", because inner nuts cannot be reached. (Unexpected Maker stream)</li>\n<li>(unsure: Nema 23 flange holes are often plain holes. The BOM's 10 M4 nuts are all used on the Z rods. If your motor holes are not threaded, you need 4 more M4 nuts.)</li>\n</ul>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wiring point: Y driver</div>\n<p>The MKS 57D is now inside the shoulder.</p>\n<ul>\n<li>Its power and CAN-in cables come up from the X base through the <strong>hollow centre of the X pulley</strong>. The wiring runs down the centre; no slip ring is needed. (Unexpected Maker)</li>\n<li>Its CAN-out cable goes up to the Z driver. Leave it long and coiled for now.</li>\n<li>Do this <strong>before step 35</strong>. After step 35 the shoulder is bolted down onto the X pulley, and the centre hole is covered.</li>\n<li>(unsure: whether the 57D terminals can still be reached after step 37. Treat step 35 as the last easy point.)</li>\n</ul>\n</div>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Confirm motor prep box done: driver bolted on, all wires connected, CAN ID 02, calibrated.</li>\n<li>Put <strong>Nema 23 stepper</strong> (with <strong>MKS 57D</strong> on back) inside Y L Core.</li>\n<li>Push shaft out through large hole in tall wall.</li>\n<li>Fix with 4 x <strong>Bolt M4 25mm</strong> from outside of wall (right).</li>\n</ol>\n<p><strong>Hardware:</strong> 4x M4x25.</p>\n<p><strong>Orientation:</strong> Shaft points <strong>out</strong> through wall. MKS 57D faces <strong>in</strong>, toward middle of shoulder.</p>\n<p><strong>Check:</strong> Shaft protrudes through wall. Motor square.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Designer: mount motor \"in reverse, nuts outside\"; inner nuts unreachable. (Unexpected Maker stream)</li>\n<li>(unsure: Nema 23 flange holes often plain holes. BOM's 10 M4 nuts all used on Z rods. If motor holes not threaded, need 4 more M4 nuts.)</li>\n</ul>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wiring point: Y driver</div>\n<p>MKS 57D now inside shoulder.</p>\n<ul>\n<li>Power and CAN-in cables come up from X base through <strong>hollow centre of X pulley</strong>. Wiring runs down the centre; no slip ring needed. (Unexpected Maker)</li>\n<li>CAN-out cable goes up to Z driver. Leave long and coiled for now.</li>\n<li>Do this <strong>before step 35</strong>. After step 35 shoulder is bolted down onto X pulley and centre hole is covered.</li>\n<li>(unsure: whether 57D terminals reachable after step 37. Treat step 35 as last easy point.)</li>\n</ul>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Finish the motor prep first: driver on, wires connected, CAN ID 02, calibrated.</li>\n<li>Put the <strong>Nema 23 stepper</strong> (MKS 57D on its back) inside the Y L Core.</li>\n<li>Push the shaft out through the large hole in the tall wall.</li>\n<li>Fix it with 4x <strong>Bolt M4x25</strong> from outside the wall.</li>\n</ol>\n<p>The shaft points out. The MKS 57D faces in.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Wire the Y driver now</div>\n<p>Run its power and CAN-in cables up through the hollow centre of the X pulley. Leave CAN-out long for the Z driver. Do this before step 35.</p>\n</div>", "checks_simple": [], "ts": [4, 5, 9, 13, 16, 71]}, {"stage": 2, "kind": "step", "n": 33, "title": "Check from the other side", "img": "Attachments/Arctos/manual/arctos-step-033.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Turn the assembly round and look at the far side.</li>\n</ol>\n<p><strong>Check:</strong></p>\n<ul>\n<li>The round boss with the <strong>▼Y</strong> mark is at the top of the far side.</li>\n<li>The 6 M5 nuts from step 27 are still in place around it.</li>\n<li>The \"X\" mark is at the bottom corner of the shoulder box.</li>\n<li>\"Now we will test if those nuts we put earlier are still there.\" (official video)</li>\n</ul>\n<p>(unsure: no parts are labelled here. I could not tell if the low far wall is part of the Y L Core or a separate part.)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Rotate assembly; view far side.</li>\n</ol>\n<p><strong>Check:</strong></p>\n<ul>\n<li>Round boss with <strong>▼Y</strong> mark at top of far side.</li>\n<li>6 M5 nuts from step 27 still seated around it.</li>\n<li>\"X\" mark at bottom corner of shoulder box.</li>\n<li>\"Now we will test if those nuts we put earlier are still there.\" (official video)</li>\n</ul>\n<p>(unsure: no parts labelled. Could not tell if the low far wall is part of the Y L Core or a separate part.)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the assembly round to the far side.</li>\n</ol>\n<p>Check:</p>\n<ul>\n<li>Round boss with the <strong>▼Y</strong> mark is at the top.</li>\n<li>The 6 M5 nuts from step 27 are still there.</li>\n<li>The \"X\" mark is at the bottom corner of the shoulder box.</li>\n</ul>", "checks_simple": [], "ts": [4, 54, 7]}, {"stage": 2, "kind": "step", "n": 34, "title": "The shoulder sits on the base", "img": "Attachments/Arctos/manual/arctos-step-034.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Lower the shoulder onto the round X pulley plate of the base.</li>\n</ol>\n<p><strong>Check:</strong> The motor shaft sticks out of the Y L Core wall. The 4 motor bolts sit in curved slots. The shoulder sits flat on the base.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Lower shoulder onto round X pulley plate of base.</li>\n</ol>\n<p><strong>Check:</strong> Motor shaft protrudes from Y L Core wall; 4 motor bolts in curved slots; shoulder flat on base.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Lower the shoulder onto the round X pulley plate of the base.</li>\n</ol>\n<p>Check: motor shaft sticks out of the Y L Core wall. The 4 motor bolts sit in the curved slots. The shoulder sits flat.</p>", "checks_simple": [], "ts": [16, 71, 33]}, {"stage": 2, "kind": "wire", "key": "y-wire", "title": "Wire Y now, before step 35", "img": null, "html": "<div class=\"callout danger\">\n<div class=\"callout-title\">Last easy point for the Y driver</div>\n<p>After step 35 the shoulder is bolted down and the centre hole is covered.</p>\n</div>\n<ol>\n<li>Bring the 4-wire bundle (+V, GND, CAN H, CAN L) up from the base <strong>through the hollow centre of the X pulley</strong>.</li>\n<li>Join it at a Wago set under the Y axis.</li>\n<li>One branch goes to the <strong>Y 57D</strong>. One goes on up to Z.</li>\n<li>Leave the CAN-out and power for Z <strong>long and coiled</strong>.</li>\n</ol>", "ov": ["pr-Y", "dY", "mY", "pd-Y", "cc-Y", "co-Y"], "bench": null, "drv": "57D", "grip": null, "conn": [["Base Wagos", "Y Wagos", "red", "through the X pulley centre"], ["Y Wago +V / GND", "Y V+ / Gnd", "red", ""], ["X CAN out", "Y CAN H / L", "yel", "H to H, L to L"], ["Y Wagos + Y CAN out", "coiled, for Z", "grn", "leave long"]], "checks": [], "html_pro": "<div class=\"callout danger\">\n<div class=\"callout-title\">Last easy access to Y driver</div>\n<p>After step 35 shoulder is bolted down; centre hole covered.</p>\n</div>\n<ol>\n<li>Route 4-wire bundle (+V, GND, CAN H, CAN L) up from base <strong>through hollow centre of X pulley</strong>.</li>\n<li>Join at Wago set under Y axis.</li>\n<li>One branch to <strong>Y 57D</strong>; one on up to Z.</li>\n<li>Leave CAN-out and power for Z <strong>long and coiled</strong>.</li>\n</ol>", "checks_pro": [], "html_simple": "<div class=\"callout danger\">\n<div class=\"callout-title\">Last easy point for the Y driver</div>\n<p>After step 35 the centre hole is covered.</p>\n</div>\n<ol>\n<li>Bring the 4-wire bundle (+V, GND, CAN H, CAN L) up <strong>through the hollow centre of the X pulley</strong>.</li>\n<li>Join it at a Wago set under the Y axis.</li>\n<li>One branch goes to the <strong>Y 57D</strong>, one on up to Z.</li>\n<li>Leave the CAN-out and power for Z <strong>long and coiled</strong>.</li>\n</ol>", "checks_simple": [], "ts": [16, 26, 0, 69, 70, 53]}, {"stage": 2, "kind": "step", "n": 35, "title": "Bolt the shoulder to the base", "img": "Attachments/Arctos/manual/arctos-step-035.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push 2 x <strong>Bolt M5 40mm</strong> down at an angle on the left side.</li>\n<li>Push 1 x <strong>Bolt M5 40mm</strong> straight down on the right side.</li>\n<li>Tighten all 3 into the X pulley plate.</li>\n</ol>\n<p><strong>Hardware:</strong> 3x M5x40.</p>\n<p><strong>Check:</strong> The shoulder does not move on the base.</p>\n<p><strong>Tips:</strong> These bolts are hard to reach. Pre-drill (open up) the holes first. (Unexpected Maker)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>2 x <strong>Bolt M5 40mm</strong> down at an angle, left side.</li>\n<li>1 x <strong>Bolt M5 40mm</strong> straight down, right side.</li>\n<li>Tighten all 3 into X pulley plate.</li>\n</ol>\n<p><strong>Hardware:</strong> 3x M5x40.</p>\n<p><strong>Check:</strong> Shoulder does not move on base.</p>\n<p><strong>Tips:</strong> Bolts hard to reach; pre-drill (open up) holes first. (Unexpected Maker)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Push 2x <strong>Bolt M5x40</strong> down at an angle, left side.</li>\n<li>Push 1x <strong>Bolt M5x40</strong> straight down, right side.</li>\n<li>Tighten all 3 into the X pulley plate.</li>\n</ol>\n<p>Check: the shoulder does not move.</p>", "checks_simple": [], "ts": [16, 26, 54]}, {"stage": 2, "kind": "step", "n": 36, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-036.png", "html": "<p><strong>Check:</strong> The 3 bolts are in. The motor shaft still sticks out of the wall.</p>", "html_pro": "<p><strong>Check:</strong> 3 bolts in; motor shaft still protrudes from wall.</p>", "checks_pro": [], "html_simple": "<p>Check: the 3 bolts are in and the motor shaft still sticks out.</p>", "checks_simple": [], "ts": [71, 33, 54]}, {"stage": 2, "kind": "step", "n": 37, "title": "The two long M8 bolts", "img": "Attachments/Arctos/manual/arctos-step-037.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push 2 x <strong>Bolt M8 100mm</strong> through the lower shoulder box from the right side.</li>\n<li>Screw 2 x <strong>Nut M8</strong> onto them on the left side.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x M8x100, 2x M8 nut.</p>\n<p><strong>Check:</strong> Both bolts pass all the way through. The nuts are tight.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>2 x <strong>Bolt M8 100mm</strong> through lower shoulder box, right to left.</li>\n<li>2 x <strong>Nut M8</strong> on left side.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x M8x100, 2x M8 nut.</p>\n<p><strong>Check:</strong> Both bolts pass fully through; nuts tight.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Push 2x <strong>Bolt M8x100</strong> through the lower shoulder box from the right.</li>\n<li>Screw 2x <strong>Nut M8</strong> on them, left side.</li>\n</ol>\n<p>Check: bolts go all the way through. Nuts are tight.</p>", "checks_simple": [], "ts": [4, 26, 54]}, {"stage": 2, "kind": "step", "n": 38, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-038.png", "html": "<p><strong>Check:</strong> The shoulder is firm on the base.</p>", "html_pro": "<p><strong>Check:</strong> Shoulder firm on base.</p>", "checks_pro": [], "html_simple": "<p>Check: the shoulder is firm on the base.</p>", "checks_simple": [], "ts": [54, 7, 28]}, {"stage": 2, "kind": "step", "n": 39, "title": "The 5 inner rods (M5)", "img": "Attachments/Arctos/manual/arctos-step-039.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Push 5 x <strong>Rod M5 130mm</strong> through the 5 holes around the Y L Core hub, from the outside (right).</li>\n<li>Push each rod through the gearbox and out of the far side.</li>\n<li>Screw 1 x <strong>Nut M5</strong> onto each rod end on the far side (5 nuts).</li>\n<li>Screw 1 x <strong>Nut M5</strong> onto each rod end on the near side (5 nuts).</li>\n</ol>\n<p><strong>Hardware:</strong> 5x M5x130 rod, 10x M5 nut. \"(4) (3)\" are CAD numbers.</p>\n<p><strong>Check:</strong></p>\n<ul>\n<li>The <strong>last rod should meet some resistance</strong> when you push it in. That shows the gearbox is assembled correctly. (official docs)</li>\n<li>Every nut is tight. One loose rod nut caused a clicking noise. (Unexpected Maker)</li>\n</ul>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Use the <strong>M5</strong> rods here, not the M4 ones. (designer)</li>\n<li>Tightening the rod nuts brought some backlash back on Z. Lock nuts did not fit because the rods are too short. Many builders use <strong>M5x100 bolts</strong> instead of double-nutted rod. (Unexpected Maker)</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>5 x <strong>Rod M5 130mm</strong> through the 5 holes around Y L Core hub, from outside (right).</li>\n<li>Push each through gearbox and out far side.</li>\n<li>1 x <strong>Nut M5</strong> on each rod end, far side (5).</li>\n<li>1 x <strong>Nut M5</strong> on each rod end, near side (5).</li>\n</ol>\n<p><strong>Hardware:</strong> 5x M5x130 rod, 10x M5 nut. \"(4) (3)\" = CAD numbers.</p>\n<p><strong>Check:</strong></p>\n<ul>\n<li><strong>Last rod meets some resistance</strong> on insertion = gearbox assembled correctly. (official docs)</li>\n<li>All nuts tight; one loose rod nut caused clicking. (Unexpected Maker)</li>\n</ul>\n<p><strong>Tips:</strong></p>\n<ul>\n<li><strong>M5</strong> rods here, not M4. (designer)</li>\n<li>Tightening rod nuts brought some Z backlash back. Lock nuts did not fit (rods too short). Many use <strong>M5x100 bolts</strong> instead of double-nutted rod. (Unexpected Maker)</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Push 5x <strong>Rod M5x130</strong> through the 5 holes around the Y L Core hub, from the right.</li>\n<li>Push each through the gearbox and out the far side.</li>\n<li>Screw 1x <strong>Nut M5</strong> on each rod end, far side (5 nuts).</li>\n<li>Screw 1x <strong>Nut M5</strong> on each rod end, near side (5 nuts).</li>\n</ol>\n<p>Check:</p>\n<ul>\n<li>The <strong>last rod meets some resistance</strong>. That is right.</li>\n<li>Every nut is tight.</li>\n</ul>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Use M5 rods</div>\n<p>Not the M4 ones. (M5x100 bolts also work.)</p>\n</div>", "checks_simple": [], "ts": [4, 5, 9, 13]}, {"stage": 2, "kind": "step", "n": 40, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-040.png", "html": "<p><strong>Check:</strong> 5 nuts sit around the hub on this side.</p>", "html_pro": "<p><strong>Check:</strong> 5 nuts around hub on this side.</p>", "checks_pro": [], "html_simple": "<p>Check: 5 nuts sit around the hub on this side.</p>", "checks_simple": [], "ts": [4, 54, 7]}, {"stage": 2, "kind": "step", "n": 41, "title": "Y pulley, centre rod and belt", "img": "Attachments/Arctos/manual/arctos-step-041.png", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Calibrate the Y driver now if you have not.</div>\n<p>The belt goes on in this step. Calibration needs the motor free. (Makerbase manual)</p>\n</div>\n<p><strong>Do:</strong></p>\n<ol>\n<li>Push the <strong>Y pulley</strong> onto the camshaft through the Y L Core hub. Its key must engage the camshaft star.</li>\n<li>Push 1 x <strong>Rod M5 140 mm</strong> through the centre of the Y pulley and the whole gearbox.</li>\n<li>Screw <strong>Nut M5 v1</strong> onto the far end (left).</li>\n<li>Screw <strong>Nut M5 v2</strong> onto the near end, outside the pulley (right).</li>\n<li>Put <strong>Pulley GT2W10B6.35</strong> on the motor shaft. Leave the set screw loose for now.</li>\n<li>Loop <strong>Belt GT2 380 mm</strong> around the Y pulley and the motor pulley.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x M5x140 rod, 2x M5 nut, 1x GT2 W10 B6.35 pulley, 1x 380 mm belt.</p>\n<p><strong>Check:</strong> The Y pulley sits fully on the camshaft. The belt runs straight.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>\"Pulley not engaging the camshaft, push it more.\" A washer fixed it, and then there was no backlash. (designer, in Unexpected Maker's stream)</li>\n<li>The centre rod should stick out of the pulley by about 5 mm, with a nut on the other side. (designer)</li>\n<li>Do not over-tighten the motor pulley set screw yet. You slide it later to line up with the belt. (official video)</li>\n<li>The Y belt is <strong>380 mm</strong>. The 630 mm belt is for X. (designer)</li>\n<li>If a bolt head rubs the belt, turn that bolt round. (Unexpected Maker)</li>\n</ul>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Calibrate Y driver now if not done.</div>\n<p>Belt goes on this step; calibration needs motor free. (Makerbase manual)</p>\n</div>\n<p><strong>Do:</strong></p>\n<ol>\n<li><strong>Y pulley</strong> onto camshaft through Y L Core hub; key engages camshaft star.</li>\n<li>1 x <strong>Rod M5 140 mm</strong> through centre of Y pulley and whole gearbox.</li>\n<li><strong>Nut M5 v1</strong> on far end (left).</li>\n<li><strong>Nut M5 v2</strong> on near end, outside pulley (right).</li>\n<li><strong>Pulley GT2W10B6.35</strong> on motor shaft; set screw loose.</li>\n<li><strong>Belt GT2 380 mm</strong> around Y pulley and motor pulley.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x M5x140 rod, 2x M5 nut, 1x GT2 W10 B6.35 pulley, 1x 380 mm belt.</p>\n<p><strong>Check:</strong> Y pulley fully seated on camshaft; belt runs straight.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>\"Pulley not engaging the camshaft, push it more.\" A washer fixed it, no backlash after. (designer, in Unexpected Maker's stream)</li>\n<li>Centre rod sticks out of pulley about 5 mm, nut on other side. (designer)</li>\n<li>Do not over-tighten motor pulley set screw yet; slide it later to align with belt. (official video)</li>\n<li>Y belt = <strong>380 mm</strong>; 630 mm belt is for X. (designer)</li>\n<li>Bolt head rubs belt: turn that bolt round. (Unexpected Maker)</li>\n</ul>", "checks_pro": [], "html_simple": "<div class=\"callout important\">\n<div class=\"callout-title\">Calibrate the Y driver now if you have not.</div>\n<p>The belt goes on in this step. Calibration needs the motor free.</p>\n</div>\n<ol>\n<li>Push the <strong>Y pulley</strong> onto the camshaft through the Y L Core hub. Its key must engage the camshaft star.</li>\n<li>Push 1x <strong>Rod M5x140</strong> through the centre of the Y pulley and the gearbox.</li>\n<li>Screw <strong>Nut M5 v1</strong> on the far end (left).</li>\n<li>Screw <strong>Nut M5 v2</strong> on the near end, outside the pulley (right).</li>\n<li>Put <strong>Pulley GT2W10B6.35</strong> on the motor shaft. Leave the set screw loose.</li>\n<li>Loop <strong>Belt GT2 380 mm</strong> round the Y pulley and the motor pulley.</li>\n</ol>\n<p>Check: the Y pulley sits fully on the camshaft. The belt runs straight.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Belt size</div>\n<p>Y belt is 380 mm. The 630 mm belt is for X.</p>\n</div>", "checks_simple": [], "ts": [4, 5, 9, 13, 10, 15]}, {"stage": 2, "kind": "step", "n": 42, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-042.png", "html": "<p><strong>Check:</strong> The belt goes from the small motor pulley up to the big Y pulley.</p>", "html_pro": "<p><strong>Check:</strong> Belt runs small motor pulley up to big Y pulley.</p>", "checks_pro": [], "html_simple": "<p>Check: belt goes from the small motor pulley up to the big Y pulley.</p>", "checks_simple": [], "ts": [28, 30, 16, 71, 33]}, {"stage": 2, "kind": "step", "n": 43, "title": "The Y belt tensioner", "img": "Attachments/Arctos/manual/arctos-step-043.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put the <strong>M5 nut</strong> in the back of the <strong>Y belt tensioner</strong> (red arrow \"M5 nut\").</li>\n<li>Fix the <strong>GT2 Idler W10</strong> to the tensioner with 1 x <strong>Bolt M5 25mm</strong>.</li>\n<li>Put 2 x <strong>M3 nuts</strong> behind the Y L Core wall at the two holes (red arrows \"M3 nuts\").</li>\n<li>Fix the tensioner to the wall with 2 x <strong>Bolt M3 15 mm</strong> through its slots.</li>\n<li>Leave the M3 bolts slightly loose.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x GT2 Idler W10, 1x M5x25, 1x M5 nut, 2x M3x15, 2x M3 nut.</p>\n<p><strong>Check:</strong> The tensioner slides in its slots.</p>\n<p><strong>Tip:</strong> The idler should spin freely. On X, the idlers clamped and needed washers. Chat said idlers are meant to float. (Unexpected Maker)</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li><strong>M5 nut</strong> into back of <strong>Y belt tensioner</strong> (red arrow \"M5 nut\").</li>\n<li><strong>GT2 Idler W10</strong> to tensioner with 1 x <strong>Bolt M5 25mm</strong>.</li>\n<li>2 x <strong>M3 nuts</strong> behind Y L Core wall at the two holes (red arrows \"M3 nuts\").</li>\n<li>Tensioner to wall with 2 x <strong>Bolt M3 15 mm</strong> through slots.</li>\n<li>M3 bolts slightly loose.</li>\n</ol>\n<p><strong>Hardware:</strong> 1x GT2 Idler W10, 1x M5x25, 1x M5 nut, 2x M3x15, 2x M3 nut.</p>\n<p><strong>Check:</strong> Tensioner slides in slots.</p>\n<p><strong>Tip:</strong> Idler should spin freely. On X, idlers clamped and needed washers; chat said idlers are meant to float. (Unexpected Maker)</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put the <strong>M5 nut</strong> in the back of the <strong>Y belt tensioner</strong>.</li>\n<li>Fix the <strong>GT2 Idler W10</strong> to the tensioner with 1x <strong>Bolt M5x25</strong>.</li>\n<li>Put 2x <strong>M3 nuts</strong> behind the Y L Core wall at the two holes.</li>\n<li>Fix the tensioner to the wall with 2x <strong>Bolt M3x15</strong> through its slots.</li>\n<li>Leave the M3 bolts slightly loose.</li>\n</ol>\n<p>Check: the tensioner slides in its slots.</p>", "checks_simple": [], "ts": [4, 28, 30, 29]}, {"stage": 2, "kind": "step", "n": 44, "title": "Tension the Y belt", "img": "Attachments/Arctos/manual/arctos-step-044.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Slide the tensioner so the idler presses on the belt.</li>\n<li>Tighten the 2 M3 bolts.</li>\n<li>Slide the motor pulley along its shaft until the belt runs straight.</li>\n<li>Tighten the pulley set screw.</li>\n</ol>\n<p><strong>Check:</strong> The belt is tight. It does not skip when you turn the Y pulley by hand.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Slide tensioner so idler presses on belt.</li>\n<li>Tighten 2 M3 bolts.</li>\n<li>Slide motor pulley along shaft until belt runs straight.</li>\n<li>Tighten pulley set screw.</li>\n</ol>\n<p><strong>Check:</strong> Belt tight; no skipping when Y pulley turned by hand.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Slide the tensioner so the idler presses on the belt.</li>\n<li>Tighten the 2 M3 bolts.</li>\n<li>Slide the motor pulley along the shaft until the belt runs straight.</li>\n<li>Tighten the pulley set screw.</li>\n</ol>\n<p>Check: belt is tight and does not skip when you turn the Y pulley by hand.</p>", "checks_simple": [], "ts": [28, 30, 16, 29, 71, 33]}, {"stage": 2, "kind": "step", "n": 45, "title": "The Y cable holder and its magnets", "img": "Attachments/Arctos/manual/arctos-step-045.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Put magnets in the <strong>Y cable holder</strong> where the 3 red arrows point: 2 in the top, 1 in the round end at the bottom.</li>\n<li>Fit the holder to the far-side boss, next to the <strong>▼Y</strong> mark.</li>\n<li>Fix it with 2 x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x M3x10, magnets (3x3 mm). (unsure: how many magnets go in each spot.)</p>\n<p><strong>Check:</strong> The holder sits next to the ▼Y mark. The magnets are flush.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>These magnets trigger the Y limit sensor. Hall sensors are polarised. Unexpected Maker glued magnets in with the wrong polarity and had to reprint.</li>\n<li>A dual Hall module (WSH231) needs one N magnet and one S magnet. (Unexpected Maker)</li>\n<li>Test each magnet with the sensor before you glue it.</li>\n</ul>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>Magnets into <strong>Y cable holder</strong> at the 3 red arrows: 2 in top, 1 in round end at bottom.</li>\n<li>Fit holder to far-side boss next to <strong>▼Y</strong> mark.</li>\n<li>2 x <strong>Bolt M3 10mm v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x M3x10, magnets (3x3 mm). (unsure: magnet count per spot.)</p>\n<p><strong>Check:</strong> Holder next to ▼Y mark; magnets flush.</p>\n<p><strong>Tips:</strong></p>\n<ul>\n<li>Magnets trigger the Y limit sensor. Hall sensors are polarised. Unexpected Maker glued magnets in with wrong polarity, had to reprint.</li>\n<li>Dual Hall module (WSH231) needs one N and one S magnet. (Unexpected Maker)</li>\n<li>Test each magnet with the sensor before gluing.</li>\n</ul>", "checks_pro": [], "html_simple": "<ol>\n<li>Put magnets in the <strong>Y cable holder</strong> at the 3 red arrows: 2 in the top, 1 in the round end.</li>\n<li>Fit the holder to the far-side boss, next to the <strong>▼Y</strong> mark.</li>\n<li>Fix it with 2x <strong>Bolt M3x10 v2</strong>.</li>\n</ol>\n<p>Check: holder is next to the ▼Y mark. Magnets are flush.</p>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Magnet polarity</div>\n<p>Hall sensors are polarised. Test each magnet with the sensor before you glue it.</p>\n</div>", "checks_simple": [], "ts": [62, 54, 63, 58, 59, 61]}, {"stage": 2, "kind": "step", "n": 46, "title": "Result", "img": "Attachments/Arctos/manual/arctos-step-046.png", "html": "<p><strong>Check:</strong> The Y cable holder is fixed next to the ▼Y mark.</p>", "html_pro": "<p><strong>Check:</strong> Y cable holder fixed next to ▼Y mark.</p>", "checks_pro": [], "html_simple": "<p>Check: the Y cable holder is fixed next to the ▼Y mark.</p>", "checks_simple": [], "ts": [69, 70, 54]}, {"stage": 2, "kind": "step", "n": 47, "title": "The upper-arm plates", "img": "Attachments/Arctos/manual/arctos-step-047.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>On the ▼Y side (left), put the <strong>Z R uper core</strong> above the Z R lower core.</li>\n<li>Lay the <strong>Z R middle core (1)</strong> over the joint, on the outside.</li>\n<li>Fix it with 4 x <strong>Bolt M5 20mm v2</strong> from the outside.</li>\n<li>On the other side (right), put the <strong>Z L uper core</strong> above the Z L lower Core.</li>\n<li>Lay the <strong>Z L middle core</strong> over the joint, on the outside.</li>\n<li>Fix it with 4 x <strong>Bolt M5 20mm v2</strong> and <strong>Nut M5 v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 8x M5x20 (4 per side). 4x M5 nut drawn (3 near the right-side bolts, 1 near the centre). (unsure: exactly which holes take the nuts, and whether the left side needs nuts.)</p>\n<p><strong>Orientation:</strong> The round hubs of both upper cores point up. They face each other.</p>\n<p><strong>Check:</strong> Both sides are straight and the same height. The hubs line up.</p>", "html_pro": "<p><strong>Do:</strong></p>\n<ol>\n<li>▼Y side (left): <strong>Z R uper core</strong> above Z R lower core.</li>\n<li><strong>Z R middle core (1)</strong> over joint, outside.</li>\n<li>4 x <strong>Bolt M5 20mm v2</strong> from outside.</li>\n<li>Other side (right): <strong>Z L uper core</strong> above Z L lower Core.</li>\n<li><strong>Z L middle core</strong> over joint, outside.</li>\n<li>4 x <strong>Bolt M5 20mm v2</strong> and <strong>Nut M5 v2</strong>.</li>\n</ol>\n<p><strong>Hardware:</strong> 8x M5x20 (4 per side). 4x M5 nut drawn (3 near right-side bolts, 1 near centre). (unsure: which holes take nuts; whether left side needs nuts.)</p>\n<p><strong>Orientation:</strong> Round hubs of both upper cores point up, facing each other.</p>\n<p><strong>Check:</strong> Both sides straight, same height; hubs aligned.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>On the ▼Y side (left), put the <strong>Z R uper core</strong> above the Z R lower core.</li>\n<li>Lay the <strong>Z R middle core (1)</strong> over the joint, outside.</li>\n<li>Fix it with 4x <strong>Bolt M5x20 v2</strong> from outside.</li>\n<li>On the right, put the <strong>Z L uper core</strong> above the Z L lower Core.</li>\n<li>Lay the <strong>Z L middle core</strong> over the joint, outside.</li>\n<li>Fix it with 4x <strong>Bolt M5x20 v2</strong> and <strong>Nut M5 v2</strong>.</li>\n</ol>\n<p>Orientation: round hubs of both upper cores point up, facing each other.</p>\n<p>Check: both sides straight and same height. Hubs line up.</p>", "checks_simple": [], "ts": [4, 26, 54]}, {"stage": 2, "kind": "step", "n": 48, "title": "Bearings in the upper hubs", "img": "Attachments/Arctos/manual/arctos-step-048.png", "html": "<p><strong>Do:</strong></p>\n<ol>\n<li>Press 1 x <strong>Bearing 61803</strong> into the hub of the Z R uper core.</li>\n<li>Press 1 x <strong>Bearing 61803</strong> into the hub of the Z L uper core.</li>\n</ol>\n<p><strong>Hardware:</strong> 2x 61803. \"(2)\" is a CAD number.</p>\n<p><strong>Orientation:</strong> In the picture both bearings go in from the left. That is the outer face of the Z R uper core and the inner face of the Z L uper core. (unsure: check against your parts; the seat recess shows the side.)</p>\n<p><strong>Check:</strong> Both bearings are flush and straight.</p>",
