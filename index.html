<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arctos Build Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load without holding up the first screen (the text shows at once, then switches to Plex) -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --paper:#eeeeee; --sheet:#f6f6f4; --ink:#1a1a1a; --ink2:#3d3d3d; --muted:#6b6b6b; --rule:#c9c9c9; --rule2:#dcdcdc;
  --wire:#e07a00; --test:#1f7a3a; --info:#1a1a1a; --bad:#c62828;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
code{white-space:nowrap;font-family:var(--mono);font-size:.9em;background:#fff;border:1px solid var(--rule2);padding:0 4px}
pre{background:#fff;border:1px solid var(--rule);padding:10px 12px;overflow:auto;font-size:13.5px}
pre code{border:0;padding:0}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--ink)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 24px;max-width:1500px;margin:0 auto}
.logo{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.logo b{font-weight:700;letter-spacing:.14em;font-size:19px}
.logo span{font-weight:400;letter-spacing:.2em;font-size:12px;color:var(--muted);text-transform:uppercase}
.find{position:relative;flex:1;max-width:380px;margin-left:auto}
.find input{width:100%;padding:7px 10px;border:1px solid var(--ink);background:#fff;font:14px var(--sans);border-radius:0}
.hits{position:absolute;top:38px;left:0;right:0;background:#fff;border:1px solid var(--ink);max-height:60vh;overflow:auto;display:none;z-index:40}
.hits a{display:block;padding:7px 10px;border-bottom:1px solid var(--rule2);text-decoration:none;font-size:14px}
.hits a:hover,.hits a.sel{background:var(--paper)}
.hits small{display:block;color:var(--muted);font-size:12px}
.tb{border:1px solid var(--ink);background:transparent;padding:6px 12px;font-size:14px;white-space:nowrap}
.tb:hover{background:#fff}
.tb.bad{border-color:var(--bad);color:var(--bad)}
/* level buttons */
.lvl{display:flex;border:1px solid var(--ink);flex:0 0 auto}
.lvl button{border:0;background:transparent;padding:6px 13px;min-height:44px;font-size:13.5px;color:var(--ink2)}
.lvl button+button{border-left:1px solid var(--ink)}
.lvl button.on{background:var(--ink);color:#fff;font-weight:600}
.lvnote{font-size:13px;color:var(--muted);border-left:3px solid var(--ink);padding:2px 10px;margin:0 0 12px}
/* beginner glossary */
.gl{border-bottom:1.5px dotted var(--wire);cursor:help}
.gl:hover,.gl.on{background:#fff3e0}
.gpop{position:absolute;z-index:44;max-width:300px;background:#fff;border:1px solid var(--ink);padding:8px 11px;font-size:13.5px;line-height:1.45;box-shadow:3px 3px 0 var(--rule)}
.gpop b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
/* chapters */
.chap{display:flex;gap:0;overflow-x:auto;max-width:1500px;margin:0 auto;padding:0 24px;scrollbar-width:thin}
.chap button{flex:0 0 auto;border:0;background:none;padding:8px 12px 7px;min-height:44px;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.chap button b{font-family:var(--mono);font-weight:500;margin-right:5px;color:var(--ink2)}
.chap button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.chap button .n{font-family:var(--mono);font-size:11px;margin-left:5px}
.chap button.full .n{color:var(--test)}
.track{display:flex;height:4px;max-width:1500px;margin:0 auto;background:var(--rule2);cursor:pointer;position:relative}
.track .seg{height:100%;border-right:2px solid var(--paper);position:relative}
.track .seg i{position:absolute;inset:0;background:var(--ink);transform-origin:left}
.track .pos{position:absolute;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--wire);margin-left:-5px}
/* page */
main{max-width:1500px;margin:0 auto;padding:18px 24px 120px}
.fig{position:relative}
.vtabs{display:flex;gap:0;margin-bottom:-1px;flex-wrap:wrap}
.vtabs button{border:1px solid var(--rule);border-bottom:0;background:var(--paper);padding:5px 12px;font-size:13px;color:var(--muted);margin-right:-1px}
.vtabs button.on{background:var(--sheet);color:var(--ink);border-color:var(--ink);position:relative;z-index:1}
.v3d{height:min(68vh,640px);padding:0}
.f3d{position:absolute;border:0;z-index:5;background:#eeeeee}
.p3d{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#eeeeee}
.p3d img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:contain;opacity:.28;filter:grayscale(1);cursor:default}
.p3d .go3d{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:17px;font-weight:700;padding:14px 22px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.p3d .go3d small{font-size:12px;font-weight:400;color:var(--muted)}
.p3d .go3d:hover{background:var(--ink);color:#fff}.p3d .go3d:hover small{color:#ddd}
.vbox{border:1px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;min-height:220px}
.vbox.sheet{background:var(--sheet)}
.vbox img{max-width:100%;max-height:46vh;display:block;cursor:zoom-in}
.vbox svg{width:100%;height:auto;display:block;max-height:58vh}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin-top:6px;align-items:center}
.legend b{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.legend .lv{color:var(--muted);font-size:12px}
.vbox svg.tall{max-height:none}
.lbs svg.tall{width:max(96vw,700px)}
.modal .legend .lv{display:none}
.legend i{display:inline-block;width:22px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:34px;margin-top:22px;align-items:start}
/* step header: big number with a leader line, like the manual's labels */
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:6px}
.num{font-weight:300;font-size:64px;line-height:.9;letter-spacing:-.02em}
.num.card{font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid currentColor;padding:4px 9px;line-height:1.2;margin-bottom:6px}
.num.wire{color:var(--wire)} .num.test{color:var(--test)} .num.info{color:var(--ink)}
.lead{flex:1;position:relative;height:1px;background:var(--ink);margin-bottom:12px}
.lead:before{content:"";position:absolute;left:-5px;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--ink)}
.kick{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;white-space:nowrap;margin-left:auto}
.txt h1{font-size:27px;font-weight:500;line-height:1.25;margin:4px 0 14px}
.txt h2,.txt h3{font-size:18px;font-weight:600;margin:20px 0 6px}
.txt img{max-width:100%;cursor:zoom-in;border:1px solid var(--rule)}
.txt table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0 14px}
.txt th,.txt td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.txt th{font-weight:600;border-bottom:1.5px solid var(--ink);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.tbl{overflow-x:auto}
.txt ol,.txt ul{padding-left:22px} .txt li{margin:3px 0}
.txt ol li::marker{font-family:var(--mono);font-size:.9em}
.callout{border-left:3px solid var(--ink);padding:8px 14px;margin:14px 0;background:var(--sheet)}
.callout-title{font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.callout.warning,.callout.danger,.callout.caution{border-color:var(--bad)} .callout.warning .callout-title,.callout.danger .callout-title{color:var(--bad)}
.callout.tip{border-color:var(--test)} .callout.important{border-color:var(--wire)}
.callout p{margin:4px 0}
.missing{color:var(--muted);font-style:italic}
/* wire checklist */
.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin:18px 0 6px;display:flex;align-items:center;gap:10px}
.sec:after{content:"";flex:1;height:1px;background:var(--rule)}
.conn{width:100%;border-collapse:collapse;font-size:14.5px;margin:0 0 10px}
.conn td{border-bottom:1px solid var(--rule2);padding:7px 6px;vertical-align:middle}
.conn tr{cursor:pointer} .conn tr.ok td{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
.conn .sw{display:inline-block;width:28px;height:5px;margin-right:9px;vertical-align:middle}
.conn .ar{color:var(--muted)} .conn .nt{display:block;color:var(--muted);font-size:12.5px;text-decoration:none}
.conn .no{font-family:var(--mono);font-size:13px;color:var(--muted);width:24px;text-align:right;padding-right:2px}
.conn tr.dn{opacity:.55;cursor:default}
.txt ol > li > .sw{display:inline-block;width:22px;height:7px;border-radius:3px;margin-right:7px;vertical-align:middle;outline:1px solid rgba(0,0,0,.15)}
.conn input,.checks input{width:18px;height:18px;accent-color:var(--ink);vertical-align:middle;margin:0}
.checks{list-style:none;padding:0!important;margin:6px 0 14px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule2);cursor:pointer;margin:0}
.checks input{margin-top:3px;flex:0 0 auto}
.checks li.ok span{color:var(--muted)}
/* side column */
.side>div{margin-bottom:22px}
.joint{border:1px solid var(--ink);background:var(--sheet)}
.joint h4,.help h4{margin:0;padding:8px 12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;gap:8px}
.joint h4 span,.help h4 span{font-weight:400;color:var(--muted);letter-spacing:.04em;text-transform:none}
.jr{display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px 10px;padding:8px 12px;border-bottom:1px solid var(--rule2);font-size:13.5px;line-height:1.45}
.jr:last-child{border-bottom:0}
.jr>b{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:1px}
.jr .w{display:flex;align-items:center;gap:8px;margin:1px 0}
.jr .w i{flex:0 0 22px;height:4px}
.jnote{padding:8px 12px;font-size:13px;color:var(--muted)}
.help{border:1px solid var(--bad);background:var(--sheet)}
.help h4{border-color:var(--bad);color:var(--bad)}
details.pr{border-bottom:1px solid var(--rule2)}
details.pr:last-of-type{border-bottom:0}
details.pr summary{padding:8px 12px 8px 30px;cursor:pointer;font-size:14px;list-style:none;position:relative;font-weight:500}
details.pr summary::-webkit-details-marker{display:none}
details.pr summary:before{content:"+";position:absolute;left:12px;font-family:var(--mono);color:var(--bad)}
details.pr[open] summary:before{content:"−"}
details.pr summary small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
details.pr .fx{padding:0 12px 10px 30px;font-size:14px}
details.pr .fx p{margin:4px 0}
.fx .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:6px}
.help .acts{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--rule2)}
.help .acts button{border:1px solid var(--ink);background:transparent;padding:5px 10px;font-size:13px}
/* keyboard focus */
:focus-visible{outline:2px solid var(--wire);outline-offset:2px}
.find input:focus-visible{outline-offset:0}
/* credit */
.credit{margin:28px 0 0;padding-top:10px;border-top:1px solid var(--rule2);font-size:13px;color:var(--muted);line-height:1.5}
.credit a{color:var(--muted)}
.credbox{border:1px solid var(--ink);background:var(--sheet);padding:12px 14px;margin:0 0 16px;font-size:14.5px;line-height:1.55}
.credbox b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--paper);border-top:1px solid var(--ink)}
.nav .in{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 24px}
.nb{border:1px solid var(--ink);background:transparent;padding:11px 18px;font-size:15px}
.nb:hover:not(:disabled){background:#fff}
.nb:disabled{opacity:.3;cursor:default}
.nb.go{background:var(--ink);color:#fff;font-weight:600}
.nb.go:hover{background:#000}
.nb.bad{border-color:var(--bad);color:var(--bad)}
.nav .cnt{margin:0 auto;text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted);line-height:1.3}
.nav .cnt b{color:var(--ink);font-weight:500;font-size:15px}
kbd{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:6px}
.nb.go kbd{color:#bbb}
/* simple mode: fewer controls */
body.simple .find, body.simple .bar > [data-ts], body.simple [data-mv="1"], body.simple .kick, body.simple .track{display:none}
body.simple .cols{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
body.simple .txt{font-size:17px}
.cols.one{grid-template-columns:minmax(0,1fr)!important;max-width:900px}
/* drawer + sheet modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:45;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);z-index:50;background:var(--paper);border-left:1px solid var(--ink);transform:translateX(105%);transition:transform .22s;display:flex;flex-direction:column}
body.ts-open .drawer{transform:none} body.ts-open .scrim,body.ws-open .scrim{display:block}
.dh{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--ink)}
.dh h3{margin:0;font-size:15px;letter-spacing:.12em;text-transform:uppercase;flex:1}
.x{border:1px solid var(--ink);background:transparent;width:44px;height:44px;font-size:18px;line-height:1}
.dtabs{display:flex;border-bottom:1px solid var(--rule)}
.dtabs button{flex:1;border:0;background:none;padding:9px;min-height:44px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent}
.dtabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.db{overflow:auto;padding:14px 18px 40px;flex:1}
.db input.q{width:100%;padding:8px 10px;border:1px solid var(--ink);background:#fff;font:14px var(--sans);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--rule);background:transparent;padding:3px 9px;font-size:12.5px;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.plist{border:1px solid var(--ink);background:var(--sheet)}
.cath{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:10px 12px 4px;color:var(--muted);border-bottom:1px solid var(--rule2)}
.ff .q{font-size:22px;font-weight:500;margin:6px 0 16px;line-height:1.3}
.ff .yn{display:flex;gap:10px;margin-bottom:18px}
.ff .yn button{flex:1;border:1px solid var(--ink);background:#fff;padding:14px;font-size:17px;font-weight:600}
.ff .yn button:hover{background:var(--ink);color:#fff}
.ff .path{font-size:13px;color:var(--muted);margin-bottom:12px;font-family:var(--mono)}
.ff .end{border:1px solid var(--ink);background:var(--sheet);padding:12px 14px;margin-bottom:14px}
.ff .end b{display:block;font-size:17px;margin-bottom:4px}
.ff .tip{font-size:14px;color:var(--ink2);border-left:3px solid var(--wire);padding:4px 12px;margin:0 0 16px}
.modal{position:fixed;inset:24px;z-index:50;background:var(--paper);border:1px solid var(--ink);display:none;flex-direction:column}
body.ws-open .modal{display:flex}
.modal .db{padding:16px 22px 30px}
.wsgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(238,238,238,.97);display:none;align-items:center;justify-content:center;cursor:zoom-out}
.lb img{max-width:96vw;max-height:94vh}
.lbs{width:96vw;height:94vh;overflow:auto;background:var(--sheet);border:1px solid var(--ink)} .lbs svg{width:max(96vw,1100px);height:auto;display:block}
.vbox svg{cursor:zoom-in}
body.lb-open .lb{display:flex} body.lb-open .scrim{display:none}
/* svg states */
.wd text{font-family:var(--sans)}
.wd rect,.wd circle{stroke-width:1.3}
.wd .st-off{opacity:.12} .wd .st-done{opacity:1}
.wd .st-now{opacity:1;filter:drop-shadow(0 0 2.5px #ff9500) drop-shadow(0 0 7px rgba(255,149,0,.55))}
.wd .st-now .flow{stroke-dasharray:9 7;animation:flow .9s linear infinite}
.wd .ghost{opacity:1}
@keyframes flow{to{stroke-dashoffset:-16}}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)} }
@media (max-width:720px){
  .lvl{order:4;flex-basis:100%} .lvl button{flex:1}
  .bar{padding:8px 14px;flex-wrap:wrap;gap:8px} .find{order:3;flex-basis:100%;max-width:none} .logo span{display:none}
  .chap{padding:0 8px} main{padding:12px 16px 110px}
  .num{font-size:48px} .txt h1{font-size:22px} .kick{display:none}
  .nav .in{padding:8px 10px;gap:6px} .nb{padding:10px 11px;font-size:14px;min-width:44px;min-height:44px} kbd,.nl{display:none}
  .modal{inset:0}
  .vbox img{max-height:40vh}
}
@media print{.top,.nav,.side .help .acts{display:none} main{padding:0}}
.wsall .wsh{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:6px}.wsall .wsh b{font-size:16px}.wsall .wsh span{color:var(--muted);font-size:13px}
.wsall .ch{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin:16px 0 4px;padding-bottom:3px;border-bottom:1.5px solid var(--ink)}
.wsall .cr{display:grid;grid-template-columns:30px 104px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr);gap:8px;padding:5px 0;border-bottom:1px solid var(--rule2);font-size:14px;align-items:baseline}
.wsall .cn{font-family:var(--mono);color:var(--muted);text-align:right;font-size:12.5px}
.wsall .cw i{display:inline-block;width:20px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle;outline:1px solid rgba(0,0,0,.15)}
.wsall .cc{font-size:12.5px;color:var(--muted)} .wsall .cc a{color:var(--ink2)} .wsall .ccp{display:none}
@media (max-width:720px){.wsall .cr{grid-template-columns:26px minmax(0,1fr) minmax(0,1fr);font-size:13.5px}.wsall .cw{grid-column:2/4}.wsall .cf{grid-column:2}.wsall .ct{grid-column:3}.wsall .cc{grid-column:2/4}.wsall .cr{grid-template-columns:26px minmax(0,1.1fr) minmax(0,1fr)}}
@media print{
  @page{size:A4;margin:8mm}
  body.ws-open .top,body.ws-open main,body.ws-open .nav,body.ws-open .drawer,body.ws-open .scrim,body.ws-open .f3d,body.ws-open .modal>.dh,body.ws-open #wsTabs,body.ws-open .modal>.nt,.noprint{display:none!important}
  html,body{background:#fff!important}
  body.ws-open .modal{position:static;display:block;border:0;inset:auto;background:#fff}
  body.ws-open .modal .db{padding:0;overflow:visible}
  .wsall{font-size:6.2pt;line-height:1.12} .wsall .wsh b{font-size:10pt} .wsall .wsh span{font-size:7pt}
  .wsall .legend{font-size:6.6pt;margin:0;gap:2px 8px} .wsall .legend b{font-size:6pt} .wsall .legend .lv{display:none}
  .wsall .cols2{column-count:2;column-gap:5mm;margin-top:3mm}
  .wsall .ch{font-size:6.2pt;margin:2.5px 0 0;padding-bottom:1px;break-after:avoid}

  .wsall .cn{font-size:5.6pt} .wsall .cw i{width:2.6mm;height:1.5mm;margin-right:.8mm}
  .wsall .cc{font-size:6pt} .wsall .cc a,.wsall .ccl{display:none} .wsall .ccp{display:inline}
}

<script>
const DATA = {"problems": [{"cat": "Printing and fit", "problem": "Bearings, nuts or bolts don't fit", "cause": "", "fix": "Calibrate the flow rate, then print the test part. [docs] Deburr or drill the holes. [docs]"}, {"cat": "Printing and fit", "problem": "Parts are consistently too big", "cause": "", "fix": "Print at 99 %. [docs]"}, {"cat": "Printing and fit", "problem": "A bearing won't go in", "cause": "", "fix": "Tap it in evenly with a wood block and a mallet, or press it with a socket or a second bearing. Don't force it crooked. (Unexpected Maker)"}, {"cat": "Printing and fit", "problem": "A big bearing won't enter a tapered bore", "cause": "", "fix": "<strong>Reprint</strong>, don't sand. Sanding made it stick. (Unexpected Maker)"}, {"cat": "Printing and fit", "problem": "A nut spins in its pocket (stripped plastic)", "cause": "", "fix": "Hold it with pliers or Blu-Tack. Reprint the part if the pocket is gone."}, {"cat": "Printing and fit", "problem": "A part snapped while forcing a rod", "cause": "", "fix": "Stop forcing it. Check the alignment and the order. Reprint. (Unexpected Maker, Y cycloid)"}, {"cat": "Printing and fit", "problem": "The gearbox won't close (wrist)", "cause": "", "fix": "Your motor's shaft may be longer than the design expects. Check it against the CAD. (Unexpected Maker)"}, {"cat": "Cycloidal gearbox", "problem": "<strong>Lots of slop / backlash</strong> (even 45°)", "cause": "<strong>Undersized outer pins</strong>", "fix": "Measure them: they should be about <strong>3.97 mm</strong>. One builder's were 3.82 mm. Buy good pins. \"It's not a 3D printing problem.\" (Unexpected Maker)"}, {"cat": "Cycloidal gearbox", "problem": "Slop", "cause": "Loose disk bearings", "fix": "Press the bearing caps fully down. Reprint the caps if needed. (Unexpected Maker)"}, {"cat": "Cycloidal gearbox", "problem": "Slop came back after tightening", "cause": "The nuts pull the rods", "fix": "Use M4x100 / M5x100 <strong>bolts</strong> instead of rods with nuts. Use blue Loctite only when you're sure you're done. (Unexpected Maker)"}, {"cat": "Cycloidal gearbox", "problem": "<strong>Won't turn / tight</strong>", "cause": "Disks in the wrong order or direction", "fix": "Check the disk order 1-2-3 and the camshaft marks. <strong>The flat side of the cam faces the motor.</strong> [docs], (Unexpected Maker)"}, {"cat": "Cycloidal gearbox", "problem": "Won't turn", "cause": "The locking pin is still in", "fix": "Pull out the 4 mm alignment pin. [docs]"}, {"cat": "Cycloidal gearbox", "problem": "Wobbles", "cause": "Support material left inside; a tilted bearing", "fix": "Clean the covers. Reseat the bearings. (Unexpected Maker)"}, {"cat": "Cycloidal gearbox", "problem": "Clicking", "cause": "A loose rod nut", "fix": "Tighten every rod nut. (Unexpected Maker)"}, {"cat": "Cycloidal gearbox", "problem": "Grinding", "cause": "A broken bearing", "fix": "Replace it. Use good bearings. (Unexpected Maker)"}, {"cat": "Cycloidal gearbox", "problem": "Crunching", "cause": "A disk is mis-assembled and jumping the pins", "fix": "Rebuild it and check the disk order. (Bryce Hackel, unconfirmed)"}, {"cat": "Cycloidal gearbox", "problem": "The pulley doesn't turn the gearbox", "cause": "The pulley is not pushed onto the camshaft", "fix": "Push it further on. A washer fixed this. (designer)"}, {"cat": "Cycloidal gearbox", "problem": "How do I know it's right?", "cause": "", "fix": "<strong>The last inner rod should meet some resistance going in.</strong> [docs]"}, {"cat": "Planetary gearbox", "problem": "<strong>Binds or won't turn</strong>", "cause": "A planet is rotated wrong", "fix": "<strong>Each planet's holes must be 90° from the next one</strong>, and the arrows point to the centre. Redo it. [docs], (Alberto)"}, {"cat": "Planetary gearbox", "problem": "Binds", "cause": "Planets unevenly spaced (one tooth off)", "fix": "Take out the planet, turn it one tooth, and refit it. (Alberto)"}, {"cat": "Planetary gearbox", "problem": "Binds", "cause": "Gears printed too big", "fix": "Try 99 % (or 98 %). Run it in with a drill. Lubricate it. [docs]"}, {"cat": "Planetary gearbox", "problem": "Binds", "cause": "The output sun gear", "fix": "Try it <strong>without</strong> the output sun gear. [docs, manual note]"}, {"cat": "Planetary gearbox", "problem": "Bolt holes half a hole out", "cause": "The planet is turned 180°", "fix": "Turn it 180°. The holes are off-centre. (Unexpected Maker)"}, {"cat": "Planetary gearbox", "problem": "<strong>Gears tilt and lock</strong>", "cause": "Gears printed <strong>too small</strong>", "fix": "Reprint at <strong>100 %</strong>. Check that the slicer is not scaling everything. (Unexpected Maker, wrist)"}, {"cat": "Planetary gearbox", "problem": "Rattles", "cause": "Too loose", "fix": "Print at a bigger scale. Tighten the bolts evenly. Press the parts against the bearings while you tighten."}, {"cat": "Planetary gearbox", "problem": "A sun gear cracked", "cause": "A bolt that is too long", "fix": "Use the right bolt length (about 15 mm there). (Alberto)"}, {"cat": "Planetary gearbox", "problem": "Screws won't go in", "cause": "No clearance holes", "fix": "Pre-drill with a 3 mm bit. (Unexpected Maker)"}, {"cat": "Planetary gearbox", "problem": "A catch at one spot (stick-slip)", "cause": "Gear mesh too tight in one place", "fix": "Work it back and forth by hand through the spot. Grease it. Reprint with more clearance if needed. (mdion2)"}, {"cat": "Belts", "problem": "The belt skips under load", "cause": "", "fix": "Tighten it so it <strong>can't skip</strong>. On X: loosen the 4 motor bolts, slide the motor back, tighten the back nuts, then the front ones. (Unexpected Maker)"}, {"cat": "Belts", "problem": "The idler doesn't turn", "cause": "", "fix": "It is clamped. Add washers so it floats. (Unexpected Maker)"}, {"cat": "Belts", "problem": "A bolt head rubs the belt", "cause": "", "fix": "Turn the bolt around. (Unexpected Maker)"}, {"cat": "Belts", "problem": "The A belt can't be tensioned after assembly", "cause": "", "fix": "Tension it before you close up. In the newer design, a helical gear replaced the belt. (Unexpected Maker)"}, {"cat": "Belts", "problem": "B/C pulley wobbles", "cause": "", "fix": "Community mods exist: \"BCG GT2 pulleys wobble\", \"BCG pulleys\". (mods page)"}, {"cat": "Belts", "problem": "A motor housing thread stripped", "cause": "", "fix": "Don't over-tighten. The motor housing is aluminium. [manual step 115]"}, {"cat": "CAN bus / drivers not answering", "problem": "<strong>No driver answers</strong>", "cause": "", "fix": "Check <strong>CAN H↔H and L↔L against the board labels</strong>. Old diagrams had them swapped. (Unexpected Maker)"}, {"cat": "CAN bus / drivers not answering", "problem": "No answer", "cause": "", "fix": "Check that <strong>both ends have 120 Ω</strong>: the CANable \"120R\" jumper, and J1 on the gripper MCP2515 (or the last driver). Measure about 60 Ω across H–L with the power off. [docs]"}, {"cat": "CAN bus / drivers not answering", "problem": "No answer", "cause": "", "fix": "<strong>Bitrate:</strong> everything at 500K. On Linux, <code>slcand -s6</code> (not <code>-s3</code>). (mdion2)"}, {"cat": "CAN bus / drivers not answering", "problem": "No answer from one driver", "cause": "", "fix": "<strong>Wrong CAN ID.</strong> Scan IDs 1–7. Don't trust the screen or the config file. (mdion2)"}, {"cat": "CAN bus / drivers not answering", "problem": "A powered driver is totally silent", "cause": "", "fix": "It may be the <strong>RS485 version</strong>, which has no CAN chip. Check the part number. (mdion2)"}, {"cat": "CAN bus / drivers not answering", "problem": "CANable not found", "cause": "", "fix": "Try another USB cable (some are power-only). Install the driver. [docs]"}, {"cat": "CAN bus / drivers not answering", "problem": "It worked, then commands time out after a power cycle", "cause": "", "fix": "Unplug and replug the CANable. Re-run <code>slcand</code> on Linux. (Unexpected Maker), (mdion2)"}, {"cat": "CAN bus / drivers not answering", "problem": "Is the bus getting data?", "cause": "", "fix": "With \"Direct mode\" on, the driver LED flashes when it receives CAN messages. [docs]"}, {"cat": "CAN bus / drivers not answering", "problem": "Answers, but the joint holds and won't move", "cause": "", "fix": "That is the classic <strong>H/L swap</strong> symptom. (Unexpected Maker)"}, {"cat": "CAN bus / drivers not answering", "problem": "One bad section breaks everything", "cause": "", "fix": "The daisy chain is in series. Check each joint's connections. Photograph them before you take anything apart. (Unexpected Maker)"}, {"cat": "Motor problems", "problem": "<strong>Answers but no torque</strong> (the shaft spins freely)", "cause": "", "fix": "No motor power on V+/Gnd (the driver can talk on USB/CAN power alone), a broken phase wire, or a bad connector. Measure the coils (a few ohms each). Swap with a known-good motor. (mdion2)"}, {"cat": "Motor problems", "problem": "Moves only a little (1° instead of 4°)", "cause": "", "fix": "A loose motor connector. Reseat it. (mdion2)"}, {"cat": "Motor problems", "problem": "Wrong direction", "cause": "", "fix": "Invert the axis in Arctos Studio → Robot Config, or flip one coil. [docs]"}, {"cat": "Motor problems", "problem": "Moves too far / not far enough", "cause": "", "fix": "Set the gear ratio, or run <strong>Calibrate Axes</strong>. [docs]"}, {"cat": "Motor problems", "problem": "Motor too hot", "cause": "", "fix": "Lower the current (Ma). \"Maximum torque without the motor being too hot to touch.\" [docs]"}, {"cat": "Motor problems", "problem": "Jerky at very low speed", "cause": "", "fix": "A known vFOC issue. Try SR_CLOSE mode. (MKS issue #16)"}, {"cat": "Motor problems", "problem": "Misses steps, but stall protection doesn't trip", "cause": "", "fix": "A known MKS issue: stall detection is unreliable. Don't rely on it. (MKS issue #3, 4 reports)"}, {"cat": "Motor problems", "problem": "A new target is ignored while moving", "cause": "", "fix": "The MKS ignores a new position command until the move ends. Send smaller moves, or stop first. (MKS issue #29)"}, {"cat": "Motor problems", "problem": "Stuck on \"Coming back to Origin\"", "cause": "", "fix": "A known firmware bug. Power cycle; factory reset (hold Next at power-on); re-calibrate. No confirmed fix. (MKS issue #19)"}, {"cat": "Motor problems", "problem": "Power comes on and then goes off", "cause": "", "fix": "A loose wire somewhere, often in the wrist. (Unexpected Maker)"}, {"cat": "Calibration (MKS \"Cal\")", "problem": "\"Reverse Lookup Error\"", "cause": "", "fix": "Check that the magnet is glued, <strong>centred</strong> and close to the chip. The coil resistance must be <strong>under 10 Ω</strong>. Calibrate <strong>with no load</strong>. [MKS], (MKS issues #6, #40)"}, {"cat": "Calibration (MKS \"Cal\")", "problem": "\"Phase Line Error!\"", "cause": "", "fix": "Check the motor wiring order and the power supply. [MKS]"}, {"cat": "Calibration (MKS \"Cal\")", "problem": "\"Not Cal\"", "cause": "", "fix": "Run Cal. You must calibrate before the other menu items unlock. [MKS]"}, {"cat": "Calibration (MKS \"Cal\")", "problem": "Odd behaviour after mounting", "cause": "", "fix": "Factory reset, then calibrate again <strong>with the belt off</strong>, then re-enter the settings. This fixed X running past its limit. (Unexpected Maker)"}, {"cat": "Limit sensors and homing", "problem": "A sensor doesn't light", "cause": "", "fix": "The driver must be powered, because the sensors take its 5 V. On a 57D, set <strong>DIP switches 2 and 3 ON</strong>. [docs]"}, {"cat": "Limit sensors and homing", "problem": "It lights, but the motor runs past it", "cause": "", "fix": "<strong>EndLimit</strong> is off. Or on a 42D: the <strong>remap</strong> wasn't sent, or the <strong>COM-to-+V jumper</strong> is missing. (Unexpected Maker)"}, {"cat": "Limit sensors and homing", "problem": "42D remap fails", "cause": "", "fix": "Stop homing first. The remap only works by command, not from the menu. (Unexpected Maker)"}, {"cat": "Limit sensors and homing", "problem": "It homes the wrong way / to the wrong sensor", "cause": "", "fix": "Swap the sensors, or change HmDir (CW/CCW). (Unexpected Maker)"}, {"cat": "Limit sensors and homing", "problem": "A magnet isn't detected", "cause": "", "fix": "The magnet faces the wrong way: hall sensors only see one pole. Test each magnet before you glue it. (Unexpected Maker)"}, {"cat": "Limit sensors and homing", "problem": "The sensor can't reach its magnet", "cause": "", "fix": "Use spacers under the board (2x M2.5 nuts), or move the magnet. (Unexpected Maker)"}, {"cat": "Limit sensors and homing", "problem": "A sensor burnt out", "cause": "", "fix": "Its 5 V wire touched the 12/24 V line. Keep the sensor wires separate. (Cr0Kz)"}, {"cat": "Limit sensors and homing", "problem": "The X sensor stops working", "cause": "", "fix": "Check the 57D's sensor GND terminal. One was broken. (Unexpected Maker)"}, {"cat": "Power", "problem": "Motors weak or the supply cuts out", "cause": "", "fix": "The supply is too small. Use 12/24 V at 20 A, and at least 100 W. (designer)"}, {"cat": "Power", "problem": "Boards died at first power-on", "cause": "", "fix": "<strong>Reversed polarity.</strong> One builder killed 2 CNC shields this way. Always check with a meter. [docs], (u/hyuratzu)"}, {"cat": "Power", "problem": "A wire got hot", "cause": "", "fix": "The wire is too thin. Use proper power wire for the main line, and a fuse. (Cr0Kz)"}, {"cat": "Power", "problem": "The driver screen stays dark at power-on", "cause": "", "fix": "<ol>\n<li>Supply LED on? If not: mains plug and switch; a 115/230 V selector must be on 115 in the US. 2. Meter on V DC at the supply's +V and −V: about +24 V. 3. Meter at the driver's V+ and Gnd: 0 V = a loose wire or a screw on the insulation; −24 V = reversed, switch off and swap the two wires. 4. Power off: +V on V+ (right side, top pin), −V on Gnd, bare metal under each screw, the green terminal block pushed fully on.</li>\n</ol>"}, {"cat": "Wires and terminals", "problem": "A wire snapped inside an MKS terminal", "cause": "", "fix": "<strong>Ferrules snap</strong> in the 2.54 mm terminals. Use bare, twisted stranded wire, or solid-core wire. <strong>Don't tin it.</strong> (Unexpected Maker)"}, {"cat": "Wires and terminals", "problem": "A stepper lead broke at the motor", "cause": "", "fix": "Add strain relief, and don't let parts press on the wires. (Unexpected Maker)"}, {"cat": "Wires and terminals", "problem": "Can't remove a motor", "cause": "", "fix": "The wires are too short. Leave slack. (Unexpected Maker)"}, {"cat": "Software", "problem": "GRBL won't flash", "cause": "", "fix": "Re-zip <strong>only</strong> the inner <code>grbl</code> folder. [docs]"}, {"cat": "Software", "problem": "Motors jitter during upload", "cause": "", "fix": "Unplug the motor power while you upload. (Epione team)"}, {"cat": "Software", "problem": "Serial port busy", "cause": "", "fix": "Close the Arduino Serial Monitor first. (Epione team)"}, {"cat": "Software", "problem": "<code>ArmJointState.h: No such file</code> (ROS 1)", "cause": "", "fix": "Source the ROS workspace, then regenerate <code>ros_lib</code>. (ROS issue #1, 3 reports)"}, {"cat": "Software", "problem": "The G-code converter outputs nothing", "cause": "", "fix": "Keep all 6 axes in every G-code line. (Unexpected Maker)"}, {"cat": "Software", "problem": "Inverse kinematics fails", "cause": "", "fix": "Move the target closer to the base, or change the gripper angle. [docs]"}, {"cat": "Software", "problem": "Arctos GUI on a Mac", "cause": "", "fix": "It needs ROS 1, so use the VM or Arctos Studio. (Unexpected Maker)"}, {"cat": "Gripper", "problem": "The servo doesn't move", "cause": "", "fix": "Set the step-down to <strong>6 V</strong>. Check the shared ground between the Nano and the step-down. Check that the Nano sketch is flashed and that the MCP2515 has the 8 MHz crystal."}, {"cat": "Gripper", "problem": "No CAN response from the gripper", "cause": "", "fix": "It is ID <strong>07</strong>. Check the J1 jumper and the H/L wires."}, {"cat": "Gripper", "problem": "A metal servo arm came in the kit", "cause": "", "fix": "Use it. You don't need the printed one. [manual step 234]"}, {"cat": "From the Discord (most common)", "problem": "The MKS gives no CAN reply", "cause": "", "fix": "<ol>\n<li>Mode <strong>SR_vFOC</strong>, CanRate <strong>500K</strong>, a unique CanID. 2. CAN H → A/H, CAN L → B/L (57D labels). 3. 120R jumper on the CANable. 4. The driver must be the <strong>CAN</strong> version, not RS485. 5. Restart the PC software. 6. Still nothing: try another CANable.</li>\n</ol>"}, {"cat": "From the Discord (most common)", "problem": "Sensor LED lights but the motor does not stop", "cause": "", "fix": "<ol>\n<li>Set <strong>EndLimit On</strong>, then home once. 2. 57D: DIP switches <strong>2 and 3 ON</strong>. 3. 42D: send the remap (<code>ID 9E 01 CRC</code>) and bridge <strong>COM to 5V</strong>.</li>\n</ol>"}, {"cat": "From the Discord (most common)", "problem": "Reverse Lookup Error during Cal", "cause": "", "fix": "<ol>\n<li>Belt off, nothing on the shaft. 2. Measure the coil pairs again (colours vary). 3. Re-centre the encoder magnet. 4. The board must sit flat on the motor back.</li>\n</ol>"}, {"cat": "From the Discord (most common)", "problem": "Which encoder magnet, and how to glue it", "cause": "", "fix": "The 6 mm round magnet from the MKS bag. Centre it (jig), one small drop of superglue. Its polarity does not matter. Too much glue can jam the motor."}, {"cat": "From the Discord (most common)", "problem": "The limit magnet does not reach the sensor", "cause": "", "fix": "Bend the sensor chip toward the magnet, extend it with 90° header pins, or stack 2 magnets. Set it up with the belt off."}, {"cat": "From the Discord (most common)", "problem": "Which limit sensor goes where", "cause": "", "fix": "X, A, C: <strong>1 WSH231</strong> (two outputs). Y, Z, B: <strong>2 KY-003</strong>. Follow the official wiring diagram, not the paper manual."}, {"cat": "From the Discord (most common)", "problem": "A joint moves the wrong distance", "cause": "", "fix": "Arctos Studio ratios are <strong>half</strong> the real ones: <strong>3.6, 41, 41, 24, 33.91, 33.91</strong> with the HTD pulley mod (stock arm: 6.75, 75, 75, 24, 33.91, 33.91) (MStep 16). Fine-tune after that."}, {"cat": "From the Discord (most common)", "problem": "Where the 120 Ω terminators go", "cause": "", "fix": "Only at the two ends of the CAN chain: the CANable's 120R jumper and the far end. Power off: CAN H to CAN L reads about <strong>60 Ω</strong>."}, {"cat": "From the Discord (most common)", "problem": "M2 screws are missing from the kit", "cause": "", "fix": "They are not in the kit. Buy <strong>M2x5</strong>. M2.5 screws crack the sensor boards."}, {"cat": "From the Discord (most common)", "problem": "A board died at power-on (magic smoke)", "cause": "", "fix": "The MKS has no reverse-polarity protection. On many jacks the <strong>long prong is −</strong>: measure before connecting. Twist wire ends tight so no single strand sticks out."}, {"cat": "From the Discord (most common)", "problem": "The MKS screen stays dark (solder pins)", "cause": "", "fix": "The solder pins on the back of the board can touch the motor: trim them or add a 1–3 mm washer. Power goes to <strong>V+ / Gnd</strong>, not EVCC / EGND."}, {"cat": "From the Discord (most common)", "problem": "Y or Z cycloidal gearbox has backlash", "cause": "", "fix": "The 5 centre rods are often undersized: use true <strong>5 mm (Y)</strong> and <strong>4 mm (Z)</strong> rods and tighten the nuts with a wrench. Zero-backlash mods are on the Arctos website."}, {"cat": "From the Discord (most common)", "problem": "A planetary gearbox jams", "cause": "", "fix": "Assemble sun gear first. Reprint the inner gears at <strong>98–99 %</strong>, remove elephant's foot, grease, run it in with a drill."}, {"cat": "From the Discord (most common)", "problem": "Printed parts do not fit", "cause": "", "fix": "Print the test piece, set XY hole compensation, ream the holes. The gearboxes are the most sensitive."}, {"cat": "From the Discord (most common)", "problem": "The online manual looks out of date", "cause": "", "fix": "Use the Fusion CAD for your version. Steps 82–93 still show the old belt."}], "problems_easy": [{"problem": "Bearings, nuts or bolts don't fit", "cause": "", "fix": "Calibrate the flow rate, then print the test part. Deburr or drill the holes."}, {"problem": "Parts are too big", "cause": "", "fix": "Print at 99 %."}, {"problem": "A bearing won't go in", "cause": "", "fix": "Tap it in evenly with a wood block and a mallet, or press it with a socket. Don't force it crooked."}, {"problem": "A big bearing won't enter a tapered bore", "cause": "", "fix": "Reprint the part. Don't sand it, because sanding made it stick."}, {"problem": "A nut spins in its pocket", "cause": "The plastic is stripped.", "fix": "Hold the nut with pliers or Blu-Tack. Reprint the part if the pocket is gone."}, {"problem": "A part snapped while forcing a rod", "cause": "", "fix": "Stop forcing it. Check the alignment and the order, then reprint."}, {"problem": "The wrist gearbox won't close", "cause": "Your motor's shaft may be longer than the design expects.", "fix": "Check the shaft against the CAD."}, {"problem": "Lots of slop (backlash)", "cause": "The outer pins are too small.", "fix": "Measure them: they should be about 3.97 mm. Buy good pins."}, {"problem": "Slop in the gearbox", "cause": "The disk bearings are loose.", "fix": "Press the bearing caps fully down. Reprint the caps if needed."}, {"problem": "Slop came back after tightening", "cause": "The nuts pull the rods.", "fix": "Use M4x100 / M5x100 bolts instead of rods with nuts. Use blue Loctite only when you're sure you're done."}, {"problem": "Gearbox is tight or won't turn", "cause": "The disks are in the wrong order or direction.", "fix": "Check the disk order 1-2-3 and the camshaft marks. The flat side of the cam faces the motor."}, {"problem": "Gearbox won't turn", "cause": "The locking pin is still in.", "fix": "Pull out the 4 mm alignment pin."}, {"problem": "Gearbox wobbles", "cause": "Support material is left inside, or a bearing is tilted.", "fix": "Clean the covers. Reseat the bearings."}, {"problem": "Gearbox clicks", "cause": "A rod nut is loose.", "fix": "Tighten every rod nut."}, {"problem": "Gearbox grinds", "cause": "A bearing is broken.", "fix": "Replace it with a good bearing."}, {"problem": "Gearbox crunches", "cause": "A disk is built wrong and jumps the pins.", "fix": "Rebuild it and check the disk order."}, {"problem": "The pulley doesn't turn the gearbox", "cause": "The pulley is not pushed far enough onto the camshaft.", "fix": "Push it further on. A washer fixed this."}, {"problem": "How do I know it's built right?", "cause": "", "fix": "The last inner rod should meet some resistance going in."}, {"problem": "Planetary gearbox binds or won't turn", "cause": "A planet is rotated wrong.", "fix": "Each planet's holes must be 90° from the next one, and the arrows point to the centre. Redo it."}, {"problem": "Planetary gearbox binds", "cause": "The planets are unevenly spaced (one tooth off).", "fix": "Take out the planet, turn it one tooth, and refit it."}, {"problem": "Planetary gearbox binds", "cause": "The gears are printed too big.", "fix": "Try 99 % (or 98 %). Run it in with a drill. Lubricate it."}, {"problem": "Planetary gearbox binds", "cause": "The output sun gear may be the cause.", "fix": "Try it without the output sun gear."}, {"problem": "Bolt holes are half a hole out", "cause": "The planet is turned 180°.", "fix": "Turn it 180°. The holes are off-centre."}, {"problem": "Gears tilt and lock", "cause": "The gears are printed too small.", "fix": "Reprint at 100 %. Check that the slicer is not scaling everything."}, {"problem": "Gearbox rattles", "cause": "It is too loose.", "fix": "Print at a bigger scale. Tighten the bolts evenly while pressing the parts against the bearings."}, {"problem": "A sun gear cracked", "cause": "The bolt is too long.", "fix": "Use the right bolt length (about 15 mm there)."}, {"problem": "Screws won't go in", "cause": "There are no clearance holes.", "fix": "Pre-drill with a 3 mm bit."}, {"problem": "A catch at one spot in the gears", "cause": "The gear mesh is too tight in one place.", "fix": "Work it back and forth by hand through the spot, and grease it. Reprint with more clearance if needed."}, {"problem": "The belt skips under load", "cause": "", "fix": "Tighten it so it can't skip. On X: loosen the 4 motor bolts, slide the motor back, tighten the back nuts, then the front ones."}, {"problem": "The idler doesn't turn", "cause": "It is clamped.", "fix": "Add washers so it floats."}, {"problem": "A bolt head rubs the belt", "cause": "", "fix": "Turn the bolt around."}, {"problem": "The A belt can't be tensioned after assembly", "cause": "", "fix": "Tension it before you close up. The newer design uses a helical gear instead of the belt."}, {"problem": "B/C pulley wobbles", "cause": "", "fix": "Look for the community mods \"BCG GT2 pulleys wobble\" or \"BCG pulleys\"."}, {"problem": "A motor housing thread stripped", "cause": "The motor housing is aluminium.", "fix": "Don't over-tighten."}, {"problem": "No driver answers", "cause": "", "fix": "Check CAN H↔H and L↔L against the board labels. Old diagrams had them swapped."}, {"problem": "No answer on the CAN bus", "cause": "", "fix": "Check that both ends have 120 Ω: the CANable \"120R\" jumper, and J1 on the gripper MCP2515 (or the last driver). With the power off, you should measure about 60 Ω across H–L."}, {"problem": "No answer on the CAN bus", "cause": "The bitrate is wrong.", "fix": "Set everything to 500K. On Linux, use <code>slcand -s6</code> (not <code>-s3</code>)."}, {"problem": "No answer from one driver", "cause": "The CAN ID is wrong.", "fix": "Scan IDs 1–7. Don't trust the screen or the config file."}, {"problem": "A powered driver is totally silent", "cause": "It may be the RS485 version, which has no CAN chip.", "fix": "Check the part number."}, {"problem": "CANable not found", "cause": "", "fix": "Try another USB cable (some are power-only). Install the driver."}, {"problem": "Commands time out after a power cycle", "cause": "", "fix": "Unplug and replug the CANable. Re-run <code>slcand</code> on Linux."}, {"problem": "Is the bus getting data?", "cause": "", "fix": "With \"Direct mode\" on, the driver LED flashes when it receives CAN messages."}, {"problem": "Joint holds and won't move", "cause": "H and L are swapped.", "fix": "Swap the H and L wires."}, {"problem": "One bad section breaks everything", "cause": "The daisy chain is in series.", "fix": "Check each joint's connections. Photograph them before you take anything apart."}, {"problem": "Motor answers but has no torque", "cause": "The motor may have no power on V+/Gnd, a broken phase wire, or a bad connector.", "fix": "Measure the coils (a few ohms each). Swap with a known-good motor."}, {"problem": "Moves only a little (1° instead of 4°)", "cause": "A motor connector is loose.", "fix": "Reseat it."}, {"problem": "Motor turns the wrong way", "cause": "", "fix": "Invert the axis in Arctos Studio → Robot Config, or flip one coil."}, {"problem": "Moves too far or not far enough", "cause": "", "fix": "Set the gear ratio, or run Calibrate Axes."}, {"problem": "Motor too hot", "cause": "", "fix": "Lower the current (Ma) until the motor is not too hot to touch."}, {"problem": "Jerky at very low speed", "cause": "A known vFOC issue.", "fix": "Try SR_CLOSE mode."}, {"problem": "Misses steps but stall protection doesn't trip", "cause": "Stall detection on the MKS is unreliable.", "fix": "Don't rely on it."}, {"problem": "A new target is ignored while moving", "cause": "The MKS ignores a new position command until the move ends.", "fix": "Send smaller moves, or stop first."}, {"problem": "Stuck on \"Coming back to Origin\"", "cause": "A known firmware bug.", "fix": "Power cycle, factory reset (hold Next at power-on), then re-calibrate."}, {"problem": "Power comes on and then goes off", "cause": "A loose wire, often in the wrist.", "fix": "Check and reseat the wires."}, {"problem": "\"Reverse Lookup Error\"", "cause": "", "fix": "Check that the magnet is glued, centred and close to the chip. The coil resistance must be under 10 Ω. Calibrate with no load."}, {"problem": "\"Phase Line Error!\"", "cause": "", "fix": "Check the motor wiring order and the power supply."}, {"problem": "\"Not Cal\"", "cause": "", "fix": "Run Cal. You must calibrate before the other menu items unlock."}, {"problem": "Odd behaviour after mounting", "cause": "", "fix": "Factory reset, then calibrate again with the belt off, then re-enter the settings."}, {"problem": "A limit sensor doesn't light", "cause": "The sensors take 5 V from the driver, so it must be powered.", "fix": "Power the driver. On a 57D, set DIP switches 2 and 3 ON."}, {"problem": "Sensor lights, but the motor runs past it", "cause": "", "fix": "EndLimit is off. On a 42D, the remap wasn't sent or the COM-to-+V jumper is missing."}, {"problem": "42D remap fails", "cause": "", "fix": "Stop homing first. The remap only works by command, not from the menu."}, {"problem": "It homes the wrong way or to the wrong sensor", "cause": "", "fix": "Swap the sensors, or change HmDir (CW/CCW)."}, {"problem": "A magnet isn't detected", "cause": "The magnet faces the wrong way. Hall sensors only see one pole.", "fix": "Test each magnet before you glue it."}, {"problem": "The sensor can't reach its magnet", "cause": "", "fix": "Use spacers under the board (2x M2.5 nuts), or move the magnet."}, {"problem": "A sensor burnt out", "cause": "Its 5 V wire touched the 12/24 V line.", "fix": "Keep the sensor wires separate."}, {"problem": "The X sensor stops working", "cause": "", "fix": "Check the 57D's sensor GND terminal. One was broken."}, {"problem": "Motors weak or the supply cuts out", "cause": "The supply is too small.", "fix": "Use 12/24 V at 20 A, and at least 100 W."}, {"problem": "Boards died at first power-on", "cause": "Reversed polarity.", "fix": "Always check polarity with a meter before powering on."}, {"problem": "A wire got hot", "cause": "The wire is too thin.", "fix": "Use proper power wire for the main line, and a fuse."}, {"problem": "The driver screen stays dark at power-on", "cause": "", "fix": "<ol>\n<li>Supply LED on? If not: check the mains plug and switch. A 115/230 V switch goes on <strong>115</strong> (US).</li>\n<li>Meter on V DC at the supply's <strong>+V</strong> and <strong>−V</strong>: about +24 V.</li>\n<li>Meter at the driver's <strong>V+</strong> and <strong>Gnd</strong>: 0 V = loose wire or the screw is on the insulation. −24 V = reversed: switch off, swap the two wires.</li>\n<li>Power off. +V on <strong>V+</strong> (right side, top pin), −V on <strong>Gnd</strong>. Bare metal under each screw. Green terminal block pushed fully on.</li>\n</ol>"}, {"problem": "A wire snapped inside an MKS terminal", "cause": "Ferrules snap in the 2.54 mm terminals.", "fix": "Use bare, twisted stranded wire, or solid-core wire. Don't tin it."}, {"problem": "A stepper lead broke at the motor", "cause": "", "fix": "Add strain relief, and don't let parts press on the wires."}, {"problem": "Can't remove a motor", "cause": "The wires are too short.", "fix": "Leave slack."}, {"problem": "GRBL won't flash", "cause": "", "fix": "Re-zip only the inner <code>grbl</code> folder."}, {"problem": "Motors jitter during upload", "cause": "", "fix": "Unplug the motor power while you upload."}, {"problem": "Serial port busy", "cause": "", "fix": "Close the Arduino Serial Monitor first."}, {"problem": "<code>ArmJointState.h: No such file</code> (ROS 1)", "cause": "", "fix": "Source the ROS workspace, then regenerate <code>ros_lib</code>."}, {"problem": "The G-code converter outputs nothing", "cause": "", "fix": "Keep all 6 axes in every G-code line."}, {"problem": "Inverse kinematics fails", "cause": "", "fix": "Move the target closer to the base, or change the gripper angle."}, {"problem": "Arctos GUI on a Mac", "cause": "It needs ROS 1.", "fix": "Use the VM or Arctos Studio."}, {"problem": "The gripper servo doesn't move", "cause": "", "fix": "Set the step-down to 6 V. Check the shared ground between the Nano and the step-down. Check that the Nano sketch is flashed and that the MCP2515 has the 8 MHz crystal."}, {"problem": "No CAN response from the gripper", "cause": "It should be ID 07.", "fix": "Check the J1 jumper and the H/L wires."}, {"problem": "A metal servo arm came in the kit", "cause": "", "fix": "Use it. You don't need the printed one."}, {"problem": "The MKS gives no CAN reply", "cause": "", "fix": "<ol>\n<li>Mode <strong>SR_vFOC</strong>, CanRate <strong>500K</strong>, a unique CanID. 2. CAN H → A/H, CAN L → B/L (57D labels). 3. 120R jumper on the CANable. 4. The driver must be the <strong>CAN</strong> version, not RS485. 5. Restart the PC software. 6. Still nothing: try another CANable.</li>\n</ol>"}, {"problem": "Sensor LED lights but the motor does not stop", "cause": "", "fix": "<ol>\n<li>Set <strong>EndLimit On</strong>, then home once. 2. 57D: DIP switches <strong>2 and 3 ON</strong>. 3. 42D: send the remap (<code>ID 9E 01 CRC</code>) and bridge <strong>COM to 5V</strong>.</li>\n</ol>"}, {"problem": "Reverse Lookup Error during Cal", "cause": "", "fix": "<ol>\n<li>Belt off, nothing on the shaft. 2. Measure the coil pairs again (colours vary). 3. Re-centre the encoder magnet. 4. The board must sit flat on the motor back.</li>\n</ol>"}, {"problem": "Which encoder magnet, and how to glue it", "cause": "", "fix": "The 6 mm round magnet from the MKS bag. Centre it (jig), one small drop of superglue. Its polarity does not matter. Too much glue can jam the motor."}, {"problem": "The limit magnet does not reach the sensor", "cause": "", "fix": "Bend the sensor chip toward the magnet, extend it with 90° header pins, or stack 2 magnets. Set it up with the belt off."}, {"problem": "Which limit sensor goes where", "cause": "", "fix": "X, A, C: <strong>1 WSH231</strong> (two outputs). Y, Z, B: <strong>2 KY-003</strong>. Follow the official wiring diagram, not the paper manual."}, {"problem": "A joint moves the wrong distance", "cause": "", "fix": "Arctos Studio ratios are <strong>half</strong> the real ones: <strong>3.6, 41, 41, 24, 33.91, 33.91</strong> (MStep 16) with the HTD pulley mod (stock arm: 6.75, 75, 75, 24, 33.91, 33.91). Fine-tune after that."}, {"problem": "Where the 120 Ω terminators go", "cause": "", "fix": "Only at the two ends of the CAN chain: the CANable's 120R jumper and the far end. Power off: CAN H to CAN L reads about <strong>60 Ω</strong>."}, {"problem": "M2 screws are missing from the kit", "cause": "", "fix": "They are not in the kit. Buy <strong>M2x5</strong>. M2.5 screws crack the sensor boards."}, {"problem": "A board died at power-on (magic smoke)", "cause": "", "fix": "The MKS has no reverse-polarity protection. On many jacks the <strong>long prong is −</strong>: measure before connecting. Twist wire ends tight so no single strand sticks out."}, {"problem": "The MKS screen stays dark (solder pins)", "cause": "", "fix": "The solder pins on the back of the board can touch the motor: trim them or add a 1–3 mm washer. Power goes to <strong>V+ / Gnd</strong>, not EVCC / EGND."}, {"problem": "Y or Z cycloidal gearbox has backlash", "cause": "", "fix": "The 5 centre rods are often undersized: use true <strong>5 mm (Y)</strong> and <strong>4 mm (Z)</strong> rods and tighten the nuts with a wrench. Zero-backlash mods are on the Arctos website."}, {"problem": "A planetary gearbox jams", "cause": "", "fix": "Assemble sun gear first. Reprint the inner gears at <strong>98–99 %</strong>, remove elephant's foot, grease, run it in with a drill."}, {"problem": "Printed parts do not fit", "cause": "", "fix": "Print the test piece, set XY hole compensation, ream the holes. The gearboxes are the most sensitive."}, {"problem": "The online manual looks out of date", "cause": "", "fix": "Use the Fusion CAD for your version. Steps 82–93 still show the old belt."}], "cats": ["Printing and fit", "Cycloidal gearbox", "Planetary gearbox", "Belts", "CAN bus / drivers not answering", "Motor problems", "Calibration (MKS \"Cal\")", "Limit sensors and homing", "Power", "Wires and terminals", "Software", "Gripper", "From the Discord (most common)"], "steps": [{"stage": 0, "kind": "step", "n": 1, "title": "The whole robot", "img": "Attachments/Arctos/web/manual/arctos-step-001.webp", "html": "<p>This is the finished arm. No building in this step.</p><ol><li>Turn it and zoom in with your finger or mouse.</li><li>Tap <b>Next</b> to start the build.</li></ol>", "html_simple": "<p>This is the finished arm. No building in this step.</p><ol><li>Turn it and zoom in with your finger or mouse.</li><li>Tap <b>Next</b> to start the build.</li></ol>", "checks_simple": [], "ts": [54, 44, 34], "whole": true, "html_pro": "<p>This is the finished arm. No building in this step.</p><ol><li>Turn it and zoom in with your finger or mouse.</li><li>Tap <b>Next</b> to start the build.</li></ol>"}, {"stage": 0, "kind": "step", "n": 2, "title": "Put a 625 bearing into one of the small pockets around the side of…", "img": "Attachments/Arctos/web/manual/arctos-step-002.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>A ring of <strong>625 bearings</strong> on <strong>M5x30</strong> bolts in the X upper core. Fill every pocket the same way.</p>\n</div>\n<p>Put a 625 bearing into one of the small pockets around the side of the X upper Core. Push a Bolt M5 30mm through the side hole so it goes through the bearing and holds it like an axle. Parts: X upper Core. Hardware: 625 bearing (8), Bolt M5 30mm v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Tip: the top bearing must sit <strong>flush</strong> with the top face. If a bearing won't go in by hand, put a block of wood on it and tap it evenly with a mallet. The M5x30 bolts thread straight into the plastic; the holes are tight on purpose.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>Ring of <strong>625 bearings</strong> on <strong>M5x30</strong> bolts in X upper core. Fill every pocket the same way.</p>\n</div>\n<p>625 bearing into each small side pocket of X upper Core; Bolt M5 30mm v2 through side hole, through bearing, as axle. Parts: X upper Core. Hardware: 625 bearing (8), Bolt M5 30mm v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Top bearing <strong>flush</strong> with top face. Stuck bearing: wood block on it, tap evenly with mallet. M5x30 bolts thread straight into plastic; holes tight on purpose.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>You need 12x <strong>625 bearing</strong> and 12x <strong>M5x30 bolt</strong>, one of each for every pocket.</li>\n<li>Push a bearing into a small pocket on the top edge of the <strong>X upper Core</strong>.</li>\n<li>Push a bolt in through the side hole and through the bearing.</li>\n<li>Fill every pocket the same way, one bearing in each.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Bearing flush</div>\n<p>Each bearing must sit flush with the top face.</p>\n</div>", "checks_simple": [], "ts": [2, 3, 0]}, {"stage": 0, "kind": "step", "n": 3, "title": "Result: the X upper Core with the bearings fitted in the side…", "img": "Attachments/Arctos/web/manual/arctos-step-003.webp", "html": "<p>Result: the X upper Core with the bearings fitted in the side pockets and the bolt heads seen in the side holes. Check every bearing pocket is filled the same way. Parts: X upper Core (shown, not labelled). Hardware: none labelled.</p>", "html_pro": "<p>Result: X upper Core, bearings in side pockets, bolt heads visible in side holes. Check all pockets filled identically. Parts: X upper Core (shown, not labelled). Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: a bearing in every pocket, a bolt head in every side hole.</p>", "checks_simple": [], "ts": [2, 3, 0]}, {"stage": 0, "kind": "step", "n": 4, "title": "Put the X upper Core on top of the X lower core", "img": "Attachments/Arctos/web/manual/arctos-step-004.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The upper core onto the lower core: <strong>3x M8</strong> from above and <strong>6x M3x20</strong> from below. (The manual says M8x25; the BOM lists M8x40 and M8x100. Check your bag.)</p>\n</div>\n<p>Put the X upper Core on top of the X lower core. Bolt them together with Bolt M8 25mm from above (drawn: 3) and fix the bottom with Bolt M3 20 mm from underneath (drawn: 6). Parts: X lower core. Hardware: Bolt M8 25mm v2, Bolt M3 20 mm.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Note: the picture says <strong>M8x25</strong>, but the parts list only has M8x40 and M8x100. Check the length against your parts before you buy.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>Upper core onto lower core: <strong>3x M8</strong> from above, <strong>6x M3x20</strong> from below. (Manual says M8x25; BOM lists M8x40 and M8x100. Check your bag.)</p>\n</div>\n<p>X upper Core on X lower core. Bolt M8 25mm v2 from above (drawn: 3); Bolt M3 20 mm from underneath (drawn: 6). Parts: X lower core. Hardware: Bolt M8 25mm v2, Bolt M3 20 mm.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Picture says <strong>M8x25</strong>; parts list has only M8x40 and M8x100. Check length against your parts before buying.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 8x <strong>M3 nut</strong> into the nut pockets.</li>\n<li>Put the <strong>X upper Core</strong> on the <strong>X lower core</strong>.</li>\n<li>Fix them with 4x <strong>M8x25 bolt</strong> from above, one in each foot.</li>\n<li>Fix the bottom with 8x <strong>M3x20 bolt</strong> from underneath, into the nuts.</li>\n</ol>\n<div class=\"callout note\">\n<div class=\"callout-title\">M8 length</div>\n<p>The parts list has only M8x40 and M8x100. Check the length in your bag.</p>\n</div>", "checks_simple": [], "ts": [26, 0, 54]}, {"stage": 0, "kind": "step", "n": 5, "title": "Result: upper core and lower core joined into one base unit, with…", "img": "Attachments/Arctos/web/manual/arctos-step-005.webp", "html": "<p>Result: upper core and lower core joined into one base unit, with the bolt heads showing on the sides and the bottom. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: upper and lower core joined as one base unit; bolt heads on sides and bottom. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: upper and lower core are one unit.</p>", "checks_simple": [], "ts": [26, 0, 54]}, {"stage": 0, "kind": "step", "n": 6, "title": "Fit two Bearing 61806 into the center of the core", "img": "Attachments/Arctos/web/manual/arctos-step-006.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>2x <strong>61806</strong> bearings in the centre, the X pulley onto the X pulley shaft with <strong>3x M3x20 + 3x M3 nuts</strong>. Turn the base over, add a third <strong>61806</strong>, then screw on the <strong>X pulley nut</strong>.</p>\n</div>\n<p>Fit two Bearing 61806 into the center of the core. Join the X pulley onto the X pulley shaft with Bolt M3 20mm (drawn: 3) and Nut M3 (drawn: 3). Drop the shaft down through the center bearings; a Nut M5 is also shown loose beside it. Parts: X pulley (2), X pulley shaft. Hardware: Bolt M3 20mm v2, Nut M3 v2, Nut M5 v2, Bearing 61806 (2).</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Tip: the X pulley holes may need drilling out for the M3x20 bolts. After step 8, <strong>give the pulley a few spins</strong>. If it turns unevenly, a bearing is not seated straight: back it off, reseat it, and refit.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>2x <strong>61806</strong> bearings in centre; X pulley onto X pulley shaft with <strong>3x M3x20 + 3x M3 nuts</strong>. Flip base, third <strong>61806</strong>, screw on <strong>X pulley nut</strong>.</p>\n</div>\n<p>Two Bearing 61806 into centre of core. X pulley onto X pulley shaft: Bolt M3 20mm v2 (drawn: 3), Nut M3 v2 (drawn: 3). Drop shaft down through centre bearings; a Nut M5 v2 also shown loose beside it. Parts: X pulley (2), X pulley shaft. Hardware: Bolt M3 20mm v2, Nut M3 v2, Nut M5 v2, Bearing 61806 (2).</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>X pulley holes may need drilling out for M3x20. After step 8, <strong>spin the pulley a few times</strong>; uneven = bearing not seated straight: back off, reseat, refit.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Fit a <strong>61806 bearing</strong> into the centre of the core.</li>\n<li>Join the <strong>X pulley</strong> (the printed HTD mod pulley, 108 teeth) to the <strong>X pulley shaft</strong> with 3x <strong>M3x20 bolt</strong> and 3x <strong>M3 nut</strong>.</li>\n<li>Drop the shaft down through the centre bearing.</li>\n<li>The picture also draws one loose part by the rim. Nothing to fit there now.</li>\n</ol>", "checks_simple": [], "ts": [2, 3, 4, 0]}, {"stage": 0, "kind": "step", "n": 7, "title": "Result: the large X pulley sits on top of the base unit and can turn", "img": "Attachments/Arctos/web/manual/arctos-step-007.webp", "html": "<p>Result: the large X pulley sits on top of the base unit and can turn. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: large X pulley on top of base unit, turns freely. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture. Spin the pulley: it turns evenly.</p>", "checks_simple": [], "ts": [16, 34, 35, 37, 42]}, {"stage": 0, "kind": "step", "n": 8, "title": "Turn the base upside down", "img": "Attachments/Arctos/web/manual/arctos-step-008.webp", "html": "<p>Turn the base upside down. Put another Bearing 61806 over the threaded end of the shaft, then screw the X pulley nut onto the thread to hold the shaft in place. Parts: X pulley nut. Hardware: Bearing 61806 (3).</p>", "html_pro": "<p>Flip base. Bearing 61806 over threaded shaft end; X pulley nut onto thread to retain shaft. Parts: X pulley nut. Hardware: Bearing 61806 (3).</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Turn the base upside down.</li>\n<li>Put another <strong>61806 bearing</strong> over the threaded end of the shaft.</li>\n<li>Screw the <strong>X pulley nut</strong> onto the thread.</li>\n</ol>", "checks_simple": [], "ts": [2, 3, 4, 0]}, {"stage": 0, "kind": "step", "n": 9, "title": "Result seen from below: the X pulley nut is screwed onto the shaft…", "img": "Attachments/Arctos/web/manual/arctos-step-009.webp", "html": "<p>Result seen from below: the X pulley nut is screwed onto the shaft in the center. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result, from below: X pulley nut on shaft, centre. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the <strong>X pulley nut</strong> is on the shaft, in the centre.</p>", "checks_simple": [], "ts": [4, 16, 0]}, {"stage": 0, "kind": "step", "n": 10, "title": "Put Nut M5 into the nut slots inside the base", "img": "Attachments/Arctos/web/manual/arctos-step-010.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>M5 nuts in the slots, then the X motor core with <strong>4x M5x20</strong>.</p>\n</div>\n<p>Put Nut M5 into the nut slots inside the base. Slide the X motor CORE (a box-shaped frame) into the side opening of the base and fix it with Bolt M5 20mm (drawn: 4). Parts: X motor CORE. Hardware: Nut M5 v2, Bolt M5 20mm v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Tip: the M5 nuts deep in the motor core are hard to reach. Use a screwdriver extension through the back opening. Blu-Tack on the Allen key holds a nut or bolt in place.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>M5 nuts in slots, then X motor core with <strong>4x M5x20</strong>.</p>\n</div>\n<p>Nut M5 v2 into nut slots inside base. Slide X motor CORE (box-shaped frame) into base side opening; fix with Bolt M5 20mm v2 (drawn: 4). Parts: X motor CORE. Hardware: Nut M5 v2, Bolt M5 20mm v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>M5 nuts deep in motor core are hard to reach: screwdriver extension through back opening. Blu-Tack on Allen key holds nut/bolt.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>Put 4x <strong>M5 nut</strong> into the nut slots inside the base, one for each bolt.</li>\n<li>Slide the <strong>X motor CORE</strong> into the side opening of the base.</li>\n<li>Fix it with 4x <strong>M5x20 bolt</strong>.</li>\n</ol>", "checks_simple": [], "ts": [4, 72, 33, 0]}, {"stage": 0, "kind": "step", "n": 11, "title": "Result: the X motor CORE box is attached to the side of the base", "img": "Attachments/Arctos/web/manual/arctos-step-011.webp", "html": "<p>Result: the X motor CORE box is attached to the side of the base. Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result: X motor CORE box attached to base side. Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the <strong>X motor CORE</strong> box is on the side of the base.</p>", "checks_simple": [], "ts": [72, 33, 54]}, {"stage": 0, "kind": "step", "n": 12, "title": "Build the X limit switch holder from three printed pieces", "img": "Attachments/Arctos/web/manual/arctos-step-012.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The X limit holder (3 pieces) clamps round the pulley hub: <strong>2x M3x20 + 2 nuts</strong>, then <strong>2x M3x10</strong>.</p>\n</div>\n<p>Build the X limit switch holder from three printed pieces. Clamp X limit holder 1 and X limit holder 2 together around a ring shape with Bolt M3 20mm (drawn: 2) and Nut M3 (drawn: 2). Then fix X limit holder 3 to holder 2 with Bolt M3 10mm (drawn: 2). Parts: X limit holder 1, X limit holder 2, X limit holder 3. Hardware: Bolt M3 20mm v2, Nut M3 v2, Bolt M3 10mm v2.</p>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>X limit holder (3 pieces) clamps round pulley hub: <strong>2x M3x20 + 2 nuts</strong>, then <strong>2x M3x10</strong>.</p>\n</div>\n<p>Build X limit switch holder from three printed pieces. X limit holder 1 + X limit holder 2 clamped into a ring: Bolt M3 20mm v2 (drawn: 2), Nut M3 v2 (drawn: 2). X limit holder 3 to holder 2: Bolt M3 10mm v2 (drawn: 2). Parts: X limit holder 1, X limit holder 2, X limit holder 3. Hardware: Bolt M3 20mm v2, Nut M3 v2, Bolt M3 10mm v2.</p>", "checks_pro": [], "html_simple": "<ol>\n<li>Put <strong>X limit holder 1</strong> and <strong>X limit holder 2</strong> together as a ring.</li>\n<li>Join them with 2x <strong>M3x20 bolt</strong> and 2x <strong>M3 nut</strong>.</li>\n<li>Fix <strong>X limit holder 3</strong> to holder 2 with 2x <strong>M3x10 bolt</strong>.</li>\n</ol>", "checks_simple": [], "ts": [4, 16, 58, 59, 61, 64]}, {"stage": 0, "kind": "step", "n": 13, "title": "Result seen from below: the limit holder is clamped around the…", "img": "Attachments/Arctos/web/manual/arctos-step-013-where.webp", "html": "<p>Result seen from below: the limit holder is clamped around the center hub of the X pulley inside the base. [unclear: exact clamp position is not marked] Parts: none labelled. Hardware: none labelled.</p>", "html_pro": "<p>Result, from below: limit holder clamped round centre hub of X pulley inside base. [unclear: exact clamp position is not marked] Parts: none labelled. Hardware: none labelled.</p>", "checks_pro": [], "html_simple": "<p>Check it matches the picture: the holder clamps round the centre hub of the X pulley.</p>", "checks_simple": [], "ts": [16, 87, 58, 59, 61, 64]}, {"stage": 0, "kind": "step", "n": 14, "title": "On top of the X motor CORE, fit the belt idler", "img": "Attachments/Arctos/web/manual/arctos-step-014.webp", "html": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>The GT2 idlers on <strong>M5x20</strong> bolts with an <strong>M3 washer</strong> under each, nuts below. <strong>Add washers so the idler floats.</strong> A clamped idler won't turn. (Unexpected Maker)</p>\n</div>\n<p>On top of the X motor CORE, fit the belt idler. Stack the GT2 idler on a Bolt M5 20mm with an M3 washer under it, push the bolt down through the top plate and hold it with Nut M5 from below. The drawing shows two idler bolts (drawn: 2 bolts, 2 nuts). Parts: none labelled. Hardware: GT2 idler W10 (1), Bolt M5 20mm v2, M3 washer (1), Nut M5 v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p>Tip: <strong>fit the idlers before the motor.</strong> The idler bearings can clamp and stop turning. Add an M5 washer (or a printed 2 mm washer) above and below so the idler floats.</p>\n</div>", "html_pro": "<div class=\"callout important\">\n<div class=\"callout-title\">Build manual note</div>\n<p>GT2 idlers on <strong>M5x20</strong> bolts, <strong>M3 washer</strong> under each, nuts below. <strong>Add washers so the idler floats</strong>; a clamped idler won't turn. (Unexpected Maker)</p>\n</div>\n<p>On top of X motor CORE, fit belt idler: GT2 idler on Bolt M5 20mm v2 with M3 washer under it; bolt down through top plate, Nut M5 v2 from below. Drawing shows two idler bolts (drawn: 2 bolts, 2 nuts). Parts: none labelled. Hardware: GT2 idler W10 (1), Bolt M5 20mm v2, M3 washer (1), Nut M5 v2.</p>\n<div class=\"callout tip\">\n<div class=\"callout-title\">Tip</div>\n<p><strong>Fit idlers before the motor.</strong> Idler bearings can clamp and stop turning; add an M5 washer (or printed 2 mm washer) above and below so the idler floats.</p>\n</div>", "checks_pro": [], "html_simple": "<ol>\n<li>You need 2x <strong>GT2 idler W10</strong>, 2x <strong>M5x20 bolt</strong>, 2x <strong>M3 washer</strong> and 2x <strong>M5 nut</strong>.</li>\n<li>Stack an idler on a bolt, with a washer under it.</li>\n<li>Push the bolt down through the top plate of the <strong>X motor CORE</strong>.</li>\n<li>Hold it with a nut from below.</li>\n<li>Do the same for the second idler.</li>\n</ol>\n<div class=\"callout warning\">\n<div class=\"callout-title\">Idler must turn</div>\n<p>Add washers until the idler turns freely.</p>\n</div>", "checks_simple": [], "ts": [2, 3, 4, 28, 30, 29]}, {"stage": 0, "kind": "info", "key": "b-intro", "title": "Before step 15: set up the X driver", "img": "Attachments/Arctos/arctos-encoder_bolts_table_labelled_MKS_config_on_docs.jpg", "html": "<p>You <strong>wire as you go</strong>. Each motor's driver is set up on the table <strong>right before that motor goes in</strong>, then wired into the arm before the step that closes it in.</p>\n<p>The X motor is first: step 15 fits its driver, so set it up now. Power it straight from the supply for this bench setup.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Axis</th>\n<th>Motor</th>\n<th>Driver</th>\n<th>Encoder bolts</th>\n<th>CAN ID</th>\n<th>Limit sensors</th>\n<th>42D remap</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>X</td>\n<td>NEMA 23</td>\n<td>SERVO57D</td>\n<td>M3x65</td>\n<td>1</td>\n<td>1x WSH231</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Y</td>\n<td>NEMA 23</td>\n<td>SERVO57D</td>\n<td>M3x65</td>\n<td>2</td>\n<td>2x KY-003, Back = home</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Z</td>\n<td>NEMA 17, 60 mm</td>\n<td>SERVO42D</td>\n<td>M3x65</td>\n<td>3</td>\n<td>2x KY-003, Front = home</td>\n<td><code>03 9E 01 A2</code></td>\n</tr>\n<tr>\n<td>A</td>\n<td>NEMA 17, 34 mm</td>\n<td>SERVO42D</td>\n<td>M3x40 (test-fit)</td>\n<td>4</td>\n<td>1x WSH231</td>\n<td><code>04 9E 01 A3</code></td>\n</tr>\n<tr>\n<td>B</td>\n<td>NEMA 17, 23 mm</td>\n<td>SERVO42D</td>\n<td>M3x25</td>\n<td>5</td>\n<td>2x KY-003, Top = home</td>\n<td><code>05 9E 01 A4</code></td>\n</tr>\n<tr>\n<td>C</td>\n<td>NEMA 17, 23 mm</td>\n<td>SERVO42D</td>\n<td>M3x25</td>\n<td>6</td>\n<td>1x WSH231</td>\n<td><code>06 9E 01 A5</code></td>\n</tr>\n<tr>\n<td>Gripper</td>\n<td>DS3225 servo</td>\n<td>Nano + MCP2515</td>\n<td>–</td>\n<td>7</td>\n<td>–</td>\n<td>–</td>\n</tr>\n</tbody>\n</table></div>\n<ol>\n<li><strong>Label</strong> each motor and its driver with a marker: the axis letter and the CAN ID.</li>\n<li>Keep this table next to you. You need it at every joint.</li>\n</ol>", "ov": null, "bench": null, "drv": "57D", "grip": null, "conn": null, "conn_title": null, "sen": null, "sen_names": null, "wire": null, "checks": [], "html_pro": "<p><strong>Wire as you go</strong>: set up each driver on the table <strong>right before its motor goes in</strong>; wire it into the arm before the step that closes it in.</p>\n<p>X first: step 15 fits its driver. Bench-power it straight from the supply.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Axis</th>\n<th>Motor</th>\n<th>Driver</th>\n<th>Encoder bolts</th>\n<th>CAN ID</th>\n<th>Limit sensors</th>\n<th>42D remap</th>\n</tr>\n</thead>\n<tbod
