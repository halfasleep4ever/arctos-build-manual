<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extra Encoders 3D</title>
<style>
  :root{--bg:#eeeeee;--ink:#1a1a1a;--mute:#6b6b6b;--line:#c9ced6;--card:#ffffff;--new:#e07a00}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
  #view{position:fixed;inset:0 0 0 360px}
  .panel{position:fixed;left:0;top:0;bottom:0;width:360px;overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:14px 16px 90px}
  h1{font-size:13px;letter-spacing:.18em;margin:0 0 12px;font-weight:700}
  h1 span{font-weight:400;color:var(--mute);letter-spacing:.1em}
  .steps{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .steps button{min-width:42px;padding:4px 7px}
  .steps button.card{border-style:dashed;font-size:12px}
  button{font:inherit;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:6px;padding:6px 10px;min-height:40px;cursor:pointer}
  button.on{background:var(--ink);color:#fff}
  button:focus-visible{outline:3px solid #1d6fd8;outline-offset:2px}
  h2{font-size:20px;margin:6px 0 6px}
  .kind{font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:700}
  .spr{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-weight:600;margin:4px 0 10px}
  .spr input{width:100%;accent-color:#1a1a1a;min-height:32px}
  .txt{margin:0 0 10px}
  .txt code{background:#f0f1f3;padding:0 3px;border-radius:3px}
  .txt ol,.txt ul{margin:4px 0;padding-left:20px}
  .txt table{border-collapse:collapse;margin:6px 0;font-size:13px}
  .txt td,.txt th{border:1px solid var(--line);padding:3px 6px;text-align:left}
  .txt .call{border-left:4px solid var(--new);background:#fff6ec;padding:6px 8px;margin:8px 0;border-radius:0 4px 4px 0}
  .txt .chk{color:var(--mute);font-size:13px}
  .lbl{font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:700;margin:14px 0 6px}
  ul.pl{list-style:none;margin:0;padding:0}
  ul.pl li{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid #eef0f3;min-height:40px}
  ul.pl li[data-l],ul.pl li[data-w]{cursor:pointer}
  ul.pl li[data-l]:hover,ul.pl li[data-w]:hover{background:#f5f6f8}
  ul.pl li .sw{width:12px;height:12px;border-radius:3px;border:1px solid #111;flex:none}
  ul.pl li .sw.w{height:5px;border-radius:3px;width:18px}
  ul.pl li b{font-weight:600}
  ul.pl li .n{margin-left:auto;font:12px ui-monospace,monospace;color:var(--mute)}
  ul.pl li.new b{color:var(--new)}
  ul.pl li.info{color:var(--mute)}
  ul.pl li.rm{color:#c62828;font-weight:600}
  .bar{position:fixed;left:0;bottom:0;width:360px;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px}
  .bar button{flex:1}
  #tip{position:fixed;pointer-events:none;background:#1a1a1a;color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;display:none;white-space:nowrap;z-index:5}
  #iso{position:fixed;right:14px;top:14px;width:300px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:none;z-index:4}
  #iso h3{margin:0 0 4px;font-size:17px}
  #iso .m{color:var(--mute);font-size:13px}
  #hint{position:fixed;right:14px;bottom:12px;color:var(--mute);font-size:12px}
  /* ?embed=1: only the 3D view, for the Build Manual iframe */
  body.embed .panel, body.embed .bar, body.embed #hint{display:none}
  body.embed #view{inset:0}
  #emb{display:none;position:fixed;left:10px;bottom:10px;right:10px;gap:10px;align-items:center;z-index:3}
  body.embed #emb{display:flex}
  #emb button{min-height:36px;padding:4px 10px}
  #emb label{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);border-radius:6px;padding:4px 10px;font-weight:600;font-size:13px}
  #emb input{width:140px;accent-color:#1a1a1a}
  /* loading overlay, tools (Re-center, Names, full screen), name labels with leader lines */
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);z-index:20;font-weight:600}
  #load .pb{width:min(260px,70vw);height:8px;border-radius:4px;background:#d7dae0;overflow:hidden}
  #load .pb i{display:block;height:100%;width:0;background:var(--ink);transition:width .15s}
  #load .m{font-weight:400;color:var(--mute);font-size:13px}
  #load.err{color:#a3271b}
  #tools{position:fixed;right:10px;top:10px;display:flex;gap:6px;z-index:4}
  #tools button{min-height:36px;padding:4px 10px;background:rgba(255,255,255,.92)}
  #tools button.on{background:var(--ink);color:#fff}
  #tools button.hot{border-color:var(--new);box-shadow:0 0 0 2px var(--new)}
  #fs{display:none}
  body.embed #fs{display:block}
  body.iso #tools{display:none}
  #lbl{position:fixed;inset:0 0 0 360px;pointer-events:none;z-index:2;overflow:hidden}
  #lbl svg{position:absolute;inset:0;width:100%;height:100%}
  #lbl line{stroke:#1a1a1a;stroke-width:1.2}
  #lbl circle{fill:var(--new);stroke:#fff;stroke-width:1.5}
  #lbl div{position:absolute;background:#fff;border:1.5px solid var(--new);color:var(--ink);font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;transform:translate(-50%,-50%)}
  #lbl div.rm{border-color:#c62828;color:#c62828}
  body.embed #lbl{inset:0}
  body.nolbl #lbl{display:none}
  @media (max-width:760px){
    #lbl{inset:0 0 46% 0}
    #tools{top:auto;bottom:calc(46% + 8px)}
    body.embed #tools{top:10px;bottom:auto}
    #lbl div{font-size:11px;padding:1px 5px}
  }
  @media (max-width:480px){
    #emb{flex-wrap:wrap;gap:6px}
    #emb input{width:90px}
  }
  @media (max-width:760px){
    #view{inset:0 0 46% 0}
    .panel{top:54%;width:auto;right:0;border-right:0;border-top:1px solid var(--line)}
    .bar{width:auto;right:0}
    #iso{left:8px;right:8px;width:auto;top:8px}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="view"></div>
<div id="lbl"><svg></svg></div>
<div class="panel">
  <h1 id="h1"></h1>
  <div class="steps" id="steps"></div>
  <label class="spr">Spread apart <input type="range" id="spread" min="0" max="100" value="0" aria-label="Spread the parts apart"></label>
  <div class="kind" id="st-kind"></div>
  <h2 id="st-title"></h2>
  <p class="txt" id="st-text"></p>
  <div class="lbl">NEW IN THIS STEP</div><ul class="pl" id="pl-new"></ul>
  <div class="lbl">ALREADY IN</div><ul class="pl" id="pl-old"></ul>
</div>
<div class="bar"><button id="prev">← Back</button><button id="play">▶ Replay</button><button id="next">Next →</button></div>
<div id="iso"><h3 id="iso-name"></h3><div class="m" id="iso-meta"></div><div style="margin-top:10px;display:flex;gap:8px"><button id="iso-back">← Back to the step</button></div></div>
<div id="tools"><button id="recenter" title="Point the camera at this step's parts again">⌖ Re-center</button><button id="names" aria-pressed="true" title="Show or hide the part names">Names</button><button id="fs" title="Full screen">⛶</button></div>
<div id="tip"></div>
<div id="emb"><button id="e-play">▶ Replay</button><label>Spread apart <input type="range" id="e-spread" min="0" max="100" value="0" aria-label="Spread the parts apart"></label></div>
<div id="hint">Tap a piece or a wire for a close-up. Drag to turn, scroll to zoom.</div>
<div id="load"><div>Loading the 3D parts…</div><div class="pb"><i></i></div><div class="m"></div></div>
<script>window.ST_FILE='extras_data.js'; window.ST_BYTES=+'77082443'||0; if (new URLSearchParams(location.search).get('embed')==='1') document.body.classList.add('embed');

  addEventListener('message', e=>{ if (e.data && e.data.step!=null) window.__st0 = e.data; });   // a step asked for while the parts still load</script>

const allB0 = vis=>{ const b = new THREE.Box3(); vis.forEach(m=>{ if (!isW(m)) b.expandByObject(m); }); return b; };
const ease = u=>u<.5 ? 4*u*u*u : 1-Math.pow(-2*u+2,3)/2, CAMT = 800;

// install order: groups (same ord) one after another, the pieces of a group 0-500 ms apart, each 2.4 s.

function playStep(cv){
  const n = cur;
  const goneM = showGone(n);

    const together = grp.every(m=>mvAt(m.userData.p,n) || m.userData.p.s!==n);

      const a = {t0:start + j*gap, from, to, pos:from.clone(), spin:(moving||w)?0:(p.spin||0)};

    if (camPlan && !userCam && !iso){ let ki = 0; camPlan.keys.forEach((K,k)=>{ if (t > K.t-CAMT) ki = k; });   // fade what blocks the group the camera goes to

}
$('#play').onclick=()=>go(cur);
$('#spread').oninput=e=>{spread=e.target.value/100};
$('#prev').onclick=()=>go(cur-1); $('#next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key==='Escape')closeIso()});

// ---- close-up of one piece or wire
let saved = null;
function openIso(label, mesh){
  const ms = all.filter(m=>m.userData.p.label===label && on(m,cur)); const one = mesh || ms[0] || all.find(m=>m.userData.p.label===label);
